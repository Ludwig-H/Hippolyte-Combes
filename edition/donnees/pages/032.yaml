historique: |
  Ramecourt, au sud-ouest de Saint-Pol, est à l'opposé de Saint-Michel-sur-Ternoise et de la grand-route d'Arras, par où Combes arrive de l'est : Roëllecourt, sur cette route à 2,9 km de Marquay, conviendrait mieux (OSM). Saint-Pol comptait 4 243 habitants en 1911 (Cassini/EHESS). L'église est l'ancienne chapelle des Carmes, devenue paroissiale, datée de 1682 et non de 1697 (Mérimée PA00108424) ; bombardée en 1943--1944, elle a fait place à l'actuelle église Saint-Paul (Palissy PM62001934). Benoît-Joseph Labre, né à Amettes en 1748, fut canonisé le 8 décembre 1881 : la plaque qui le dit « bienh\textsuperscript{x} » date sans doute d'entre sa béatification (1860) et cette date ; revenu à Amettes en novembre 1766, il chercha deux ans durant à entrer chez les chartreux ou à la Trappe (Delany 1907), mais son passage à Saint-Pol en mars 1767 n'est pas attesté ailleurs. Ce « \textit{Fine day} », la 54th Brigade s'exerce à l'aube à l'attaque de deux lignes de tranchées devant les commandants du corps et de la division (JMO 7/Bedf, 31 août 1916). À la douzaine, la carte postale revient à 4 c, contre 10 c en Flandre (voir f. 3 r\textsuperscript{o}).
