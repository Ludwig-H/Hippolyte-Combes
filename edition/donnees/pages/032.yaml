historique: |
  Ramecourt, au sud-ouest de Saint-Pol, n'est pas sur le trajet ; Roëllecourt, sur la grand-route d'Arras à 2,9~km de Marquay, conviendrait mieux (OSM). Saint-Pol compte 4 243~habitants en 1911 (Cassini/EHESS). L'église est l'ancienne chapelle des Carmes, datée de 1682 et non de 1697 (Mérimée PA00108424) ; bombardée en 1943--1944, elle a fait place à l'église Saint-Paul (Palissy PM62001934). Benoît-Joseph Labre, né à Amettes, est béatifié en 1860 et canonisé en 1881 : la plaque date sans doute d'entre-temps. Son passage à Saint-Pol en mars 1767, quand il cherche à entrer chez les chartreux ou à la Trappe (Delany 1907), n'est pas attesté ailleurs. Achetée à la douzaine, la carte postale revient ici à 4 c environ, contre 10 c en Flandre (voir f.~3~r\textsuperscript{o}).
