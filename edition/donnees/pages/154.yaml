historique: |
  Puchevillers abrite les hôpitaux d'évacuation n\textsuperscript{os}~3 et~44 jusqu'en mars 1917 (LLT). À Authie, Hippolyte Combes avait déjeuné le 9 décembre au mess d'une compagnie du train de la 31st Division (voir f.~54~v\textsuperscript{o}). Couin (Pas-de-Calais), si la lecture est bonne, avait été le QG du XIII Corps du 4 octobre au 29 novembre 1916 ; Acheux-en-Amiénois, quitté par Combes le 7 février (voir f.~73~v\textsuperscript{o}), est de nouveau, depuis le 12 janvier, celui du V Corps (LLT). Les « prix exorbitants » tiennent sans doute à l'afflux des officiers britanniques dans ces bourgs d'état-major. M.~Lefèvre, rencontré à Toutencourt, QG de la Fifth Army (voir f.~75~r\textsuperscript{o}), n'est pas identifié.
sources:
- Baker, C., The Long, Long Trail, « Locations of British Casualty Clearing Stations » (copie Wayback du 13 janvier 2018), « The British XIII Corps in France and Flanders » et « The British V Corps in France and Flanders » (longlongtrail.co.uk, consultés le 18 oct. 2026).
