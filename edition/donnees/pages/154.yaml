historique: |
  Puchevillers, au nord d'Hérissart, abrite les hôpitaux d'évacuation n\textsuperscript{os} 3 et 44 jusqu'en mars 1917 (LLT). Authie (Somme), où Combes avait déjeuné le 9 décembre au mess d'une compagnie du train de la 31st Division (voir f.~54 v\textsuperscript{o}), avait accueilli en juillet 1916 un centre opératoire avancé (OH 1916-I, p.~282). Couin (Pas-de-Calais), si la lecture est bonne, avait été le QG du XIII Corps du 4 octobre au 29 novembre 1916 ; Acheux-en-Amiénois, quitté par Combes le 7 février (voir f.~73 v\textsuperscript{o}), est de nouveau, depuis le 12 janvier, celui du V Corps (LLT). Les « prix exorbitants » de l'Hôtel de ville tiennent sans doute à l'afflux des officiers britanniques dans ces bourgs d'état-major. M.~Lefèvre, rencontré à Toutencourt, QG de la Fifth Army (voir f.~75 r\textsuperscript{o}), n'est pas identifié. Le gel du 14 est l'un des derniers : le dégel commence le 16 (OH 1917-I, p.~76 ; Haig, \textit{Despatches}, p.~69--70).
sources:
- Baker, C., The Long, Long Trail, « Locations of British Casualty Clearing Stations » (copie Wayback du 13 janvier 2018), « The British XIII Corps in France and Flanders » et « The British V Corps in France and Flanders » (longlongtrail.co.uk, consultés le 18 oct. 2026).
- Edmonds, J. E. (comp.), Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 282.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 76.
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), London, Dent, 1919, p. 69-70 (dépêche du 31 mai 1917).
