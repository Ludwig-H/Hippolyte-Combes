critique: La journée du 19 s'arrête là ; la page suivante commence au 20 mars.
historique: |
  Le 18 mars est un jour de paie de la Mission française de la Fifth Army, à Toutencourt avec le QG de Gough jusqu'au 28 mars (voir f.~75~r\textsuperscript{o} ; LLT) ; l'écart des 82~f avec les 78~f~75 d'une quinzaine à 5~f~25 reste inexpliqué. Le « Lt Wentworth » est sans doute l'officier australien arrivé le 6 mars (voir f.~81~v\textsuperscript{o}) : Henry Coates Wentworth ou Fitzwilliam Wentworth (AIF Project). Les officiers de la 63rd (Royal Naval) Division, d'une unité non identifiée, viennent d'un secteur dépassé par l'avance : Miraumont est occupé depuis la fin de février, Achiet-le-Petit atteint le 18 au matin (OH 1917-I, p.~95--101, 110--115, 140).
sources:
