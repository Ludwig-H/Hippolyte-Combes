historique: |
  Le 18~mars est un jour de paie de la Mission française de la Fifth Army, à Toutencourt avec le QG de Gough jusqu'au 28~mars (voir f.~75~r\textsuperscript{o} ; LLT) ; l'écart des 82~F avec les 78,75~F d'une quinzaine à 5,25~F reste inexpliqué. Le « Lt Wentworth » est peut-être l'officier australien arrivé le 6~mars (voir f.~81~v\textsuperscript{o}) ; ce pourrait être Henry Coates Wentworth, du train de la 2\textsuperscript{nd} Australian Division (AIF Project). Les officiers de la 63\textsuperscript{rd} (Royal Naval) Division sont sans doute de ceux qui gagnent alors l'Artois : la division, qui avait occupé Miraumont le 25~février, est relevée au début de mars ; le 18~mars, elle regagne Hédauville et fait de là sa première étape vers le château de Contay, à 5~km d'Hérissart (Jerrold 1923, p.~220--221).
sources:
- Jerrold, D., The Royal Naval Division, Londres, Hutchinson, 1923, p. 220-221.
- The Long, Long Trail (C. Baker), « The British Fifth or Reserve Army 1916-1918 », copie Wayback du 23 juill. 2024.
- UNSW Canberra, The AIF Project, notice Henry Coates Wentworth (pid 318876), aif.adfa.edu.au.
