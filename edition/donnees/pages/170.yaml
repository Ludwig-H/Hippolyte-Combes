critique: Encre violette ; quelques mots (« labourés ou ensemencés », « retour », « libre ») semblent repassés d'une encre plus épaisse. Les comptes du 18, ouverts par un grand crochet, sont serrés sous la fin de la notice, et un filet sépare les deux journées. La notice du 19 s'achève sans ponctuation au pied de la page ; la suivante s'ouvre sur le 20.
historique: |
  Le 18 mars est l'un des jours de paie fixés par la Mission française de la Fifth Army, installée à Toutencourt comme le QG de Gough jusqu'au 28 mars (voir f.~75~r\textsuperscript{o} ; LLT) ; les 82~f s'écartent des 78~f~75 d'une quinzaine à 5~f~25 sans explication. Le « Lt Wentworth » est sans doute l'officier australien arrivé le 6 mars (voir f.~81~v\textsuperscript{o}) : Henry Coates Wentworth, du train de la 2nd Australian Division, ou Fitzwilliam Wentworth, du 26th Battalion (AIF Project). L'auto est aux ateliers depuis le 17 (voir f.~84~v\textsuperscript{o}), les routes étant ruinées par le dégel (OH 1917-I, p.~103). Les officiers de la 63rd (Royal Naval) Division reviennent d'un secteur que la Fifth Army vient de dépasser : Miraumont est occupé depuis la fin de février, Achiet-le-Petit atteint par la cavalerie le 18 au matin, et le repli allemand s'achève le 19 (OH 1917-I, p.~95--101, 110--115, 140). L'infanterie de la division avait été relevée avant le 28 février, son artillerie tirait encore le 10 mars (OH 1917-I, p.~102, 105) ; l'unité n'est pas identifiée.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, London, Macmillan, 1940, p. 95-105, 110-115, 140.
- The Long, Long Trail (C. Baker), « The British Fifth or Reserve Army 1916-1918 », copie Wayback du 23 juill. 2024.
- UNSW Canberra, The AIF Project, notices Henry Coates Wentworth (pid 318876) et Fitzwilliam Wentworth (pid 318872-318873), aif.adfa.edu.au.
