historique: |
  Le train part de la gare du Nord, où Hippolyte Combes a laissé ses paquets le matin (voir f.~32 v\textsuperscript{o}) : c'est la « Consigne : 10c » des comptes. Le ticket de métro à 15 c est celui de 2\textsuperscript{e} classe (Baedeker 1913, p.~30). À l'aller, il avait pris à Amiens un train de permissionnaires, après être venu d'Acheux-Varennes par le petit train départemental (voir f.~25 v\textsuperscript{o}). Au retour, ignorant que sa division a quitté l'Ancre, il remonte vers Doullens. La ville est alors un grand centre sanitaire : hôpital militaire français dans la citadelle, \textit{Casualty Clearing Stations} britanniques depuis mars 1916 (CWGC, Doullens Communal Cemetery Extension No. 1).
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. 30.
- Commonwealth War Graves Commission, notice « Doullens Communal Cemetery Extension No. 1 », cwgc.org, consultée le 18 oct. 2026.
