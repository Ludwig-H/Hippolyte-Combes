historique: |
  Le train part de la gare du Nord, où Hippolyte Combes a laissé le matin ses paquets à la consigne (voir f.~32 v\textsuperscript{o}) : c'est la « Consigne : 10c » des comptes. Les deux billets de métro à 15 c sont au tarif de 2\textsuperscript{e} classe du Métropolitain d'avant-guerre, « 2nd cl. 15 c. » (Baedeker 1913, p.~30). À l'aller, il avait pris à Amiens un train de permissionnaires après être venu d'Acheux-Varennes par le petit train départemental (voir f.~25 v\textsuperscript{o}) ; au retour, ignorant que sa division a quitté l'Ancre, il remonte d'Amiens vers Doullens par la ligne du Nord. Doullens était alors un grand centre sanitaire de l'arrière : sa citadelle était devenue hôpital militaire français, plusieurs \textit{Casualty Clearing Stations} britanniques s'y étaient installées depuis mars 1916 et sa gare servait aux deux armées (CWGC, Doullens Communal Cemetery Extension No. 1). Cette nuit en gare (voir f.~33 v\textsuperscript{o}) est la première de celles qu'Hippolyte Combes passera, au retour de ses permissions, à Doullens, Amiens ou Saint-Flour.
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. 30.
- Commonwealth War Graves Commission, notice « Doullens Communal Cemetery Extension No. 1 », cwgc.org, consultée le 18 oct. 2026.
