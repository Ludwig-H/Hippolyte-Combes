critique: Le récit reprend, à la date du 27, l'arrivée à Amiens déjà notée au f.~64~v\textsuperscript{o} ; il se poursuit au verso.
historique: |
  Boilly, « prof. à Pont-à-Mousson » (Meurthe-et-Moselle), n'est pas identifié ; encore un universitaire parmi les interprètes (voir f.~48~v\textsuperscript{o}). L'« abri du soldat », foyer d'accueil du boulevard d'Alsace-Lorraine, ne l'est pas davantage. La Y.M.C.A. tenait près de la gare d'Amiens un foyer ouvert la nuit, avec un « tea-room des officiers » servant « pour une somme modique » thé, gâteaux et fruits aux voyageurs (Fernand-Laurent 1917, p.~92-93) ; c'est peut-être la \textit{« Joy » hut} de Yapp (1918, chap.~VII). L'« air brûlant » du compartiment contraste avec la crise du charbon : ce même 27 janvier, le général Dubail, gouverneur militaire de Paris, met voitures et hommes de corvée à la disposition des municipalités pour y remédier (\textit{La Dépêche}, 28 janv. 1917, p.~2). Le fiacre taximètre jusqu'à Orsay coûte 1~f~45 et 30~c de pourboire (f.~66~r\textsuperscript{o} ; Baedeker 1913, p.~28). La ligne~1 du métro s'arrête à la Porte Maillot jusqu'en 1937 (Wikipédia), d'où la marche jusqu'à la rue d'Armenonville, chez Mme Faure (voir f.~65~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 92-93.
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. VII.
- La Dépêche (Toulouse), 28 janvier 1917, p. 2 (Gallica, bpt6k4146920v).
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. 28.
- Wikipédia, « Ligne 1 du métro de Paris », consulté le 18 oct. 2026.
