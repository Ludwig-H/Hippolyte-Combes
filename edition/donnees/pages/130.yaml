historique: |
  Boilly, « prof. à Pont-à-Mousson » (Meurthe-et-Moselle), n'est pas identifié ; l'« abri du soldat » du boulevard d'Alsace-Lorraine non plus. La Y.M.C.A. tenait près de la gare d'Amiens un foyer ouvert la nuit, servant thé, gâteaux et fruits « pour une somme modique » (Fernand-Laurent 1917, p.~92--93). Le compartiment surchauffé contraste avec la crise du charbon : ce même 27~janvier, le gouverneur militaire de Paris met voitures et hommes de corvée au service des municipalités (\textit{La Dépêche}, 28~janv. 1917, p.~2). La ligne~1 du métro s'arrête alors à la Porte Maillot (Wikipédia), d'où la marche jusqu'à la rue d'Armenonville, chez M\textsuperscript{me} Faure (voir f.~65~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 92-93.
- La Dépêche (Toulouse), 28 janvier 1917, p. 2 (Gallica, bpt6k4146920v).
- Wikipédia, « Ligne 1 du métro de Paris », consulté le 18 oct. 2026.
