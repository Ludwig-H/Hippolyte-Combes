historique: |
  Bayencourt et Coigneux (Somme) sont juste derrière le saillant de Gommecourt (Pas-de-Calais), tenu par les Allemands jusqu'au 27 février 1917 (CWGC, Gommecourt Wood New Cemetery) ; les « 3 kilomètre » visent sans doute leurs premières lignes, la mairie de Gommecourt étant à 5,3~km (geo.api.gouv.fr). La 31st Division tient alors le secteur d'Hébuterne (OH 1917-I, p.~66). Curtis, à Acheux depuis le 2 novembre (voir f.~45~v\textsuperscript{o}), rejoint la 152nd Company, alors que la 18th Division est au repos dans la région d'Abbeville (Nichols 1922, p.~136, 139). Les 50~£ par an du capitaine Williams (voir f.~52~v\textsuperscript{o}) font environ 1~260~F (March 1925, p.~141), moins de 3,50~F par jour.
sources:
- Commonwealth War Graves Commission, notice historique « Gommecourt Wood New Cemetery » (cwgc.org).
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 136, 139.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 141.
