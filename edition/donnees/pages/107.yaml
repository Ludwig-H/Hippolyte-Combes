critique: Encre noire virée au brun ; quelques apostrophes et virgules, surtout dans la journée du 6, sont d'un trait plus fin et plus pâle, peut-être ajoutées après coup. Le bas de la page est resté blanc ; on y devine le report de l'encre de la page en regard.
historique: |
  Bayencourt et Coigneux (Somme) sont à l'arrière immédiat du saillant de Gommecourt (Pas-de-Calais), tenu par les Allemands jusqu'au 27 février 1917 (CWGC, Gommecourt Wood New Cemetery). Bayencourt est à 5,3~km de la mairie de Gommecourt (geo.api.gouv.fr) : les « 3 kilomètre » valent sans doute pour les premières lignes allemandes. Le secteur d'Hébuterne est alors tenu par la 31st Division, à la gauche du XIII Corps (OH 1917-I, p.~66). Curtis, détaché avec lui à Acheux depuis le 2 novembre (voir f.~45~v\textsuperscript{o}), rejoint la 152nd Company alors que la 18th Division, relevée par la 61st, est au repos dans la région d'Abbeville (Nichols 1922, p.~136, 139) : le 7th Bedfordshire est à Millencourt-en-Ponthieu le 1\textsuperscript{er} décembre, à Domvast à partir du 14 (JMO 7/Bedf, déc. 1916). Les « 50 £ a year » du capitaine Williams, arrivé le 2 (voir f.~52~v\textsuperscript{o}), font environ 1~260~F à la parité-or de 25,22~F la livre (March 1925, p.~141), moins de 3,50~F par jour, quand la solde de Combes atteint 78~F~75 par quinzaine (voir f.~53~r\textsuperscript{o}).
