critique: Page écrite en travers, à l'encre violette, d'une seule venue ; le soulignement de la date passe au-dessus de « extrémité ». La dernière phrase se poursuit f.~40 r\textsuperscript{o}.
historique: |
  Le 18 octobre est le dernier jour de la bataille des crêtes du Transloy, où la Fourth Army attaque à 3~h~40 dans des tranchées inondées (OH 1916-II, p.~xlii--xliv, 444). Albert, 6~742 habitants et 1~105 maisons avant la guerre (OH 1916-I, p.~247), bombardée depuis le 29 septembre 1914 (Michelin 1919, p.~31--35), est la tête de la route de Bapaume ; les ambulances de campagne y sont concentrées depuis septembre (CWGC, Albert Communal Cemetery Extension) et la 18th Division y a ouvert le 14 octobre un QG avancé en vue de l'attaque de Regina Trench (JMO 7/Bedf, 14 oct. 1916). Combes fréquentera le bureau de la Mission française de la ville jusqu'au début de novembre. La basilique Notre-Dame de Brebières, élevée de 1885 à 1897 sur les plans d'Edmond Duthoit (Mérimée PA80000002), a été crevée par les obus en janvier 1915 (diocèse d'Amiens) ; sur sa Vierge penchée, voir f.~42 r\textsuperscript{o}. Le \textit{lift} pris sur un camion de passage, défendu en principe, était toléré : c'est le \textit{lorry hopping} (Fraser et Gibbons 1925, s.v.).
