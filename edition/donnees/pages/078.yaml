historique: |
  Albert comptait avant la guerre 6~742 habitants et 1~105 maisons (OH 1916-I, p.~247). Bombardée depuis le 29 septembre 1914 (Michelin 1919, p.~31--35), la ville est la tête de la route de Bapaume. La 18th Division y a ouvert le 14 octobre un QG avancé (JMO 7/Bedf, 14 oct. 1916). Hippolyte Combes fréquentera le bureau de la Mission française d'Albert jusqu'au début de novembre. La basilique Notre-Dame de Brebières, construite de 1885 à 1897 sur les plans d'Edmond Duthoit (Mérimée PA80000002), a été crevée par les obus en janvier 1915 (diocèse d'Amiens) ; sur sa Vierge penchée, voir f.~42~r\textsuperscript{o}. Monter sur un camion de passage, interdit en principe mais toléré, s'appelait le \textit{lorry hopping} (Fraser et Gibbons 1925, s.v.).
sources:
