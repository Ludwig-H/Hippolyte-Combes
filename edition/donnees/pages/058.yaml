critique: Encre violette. Deux espaces laissés en blanc encadrent la ligne du retour, comme si le récit de la soirée devait être complété ; les comptes sont rejetés sous le filet.
historique: |
  La messe de 8 h est entendue à l'autel paroissial de la cathédrale Saint-Étienne (Mérimée PA00094498), proche de l'appartement d'Hippolyte Combes, rue de Languedoc (lettre à Marguerite, 25 nov. 1918 ; Baedeker 1912, p.~300). Sainte-Marie-des-Champs est la maison de l'oncle Émile Crouzet, au terminus du tram de la Côte-Pavée, où séjournent Marguerite et sa mère (voir f.~27 v\textsuperscript{o}). L'après-midi, la ligne suburbaine partie de la place Esquirol conduit à Lardenne, à l'ouest de la ville (Baedeker 1912, p.~298) ; le Touch coule au-delà. « Jean » est sans doute l'abbé Jean Crouzet (v. 1880--1932), fils d'Émile et cousin germain de Marguerite (\textit{L'Express du Midi}, 23 déc. 1926, p.~5 ; 27 août 1932, p.~4) : un « abbé Crouzet » est vicaire à la cathédrale pendant la guerre (\textit{Le Télégramme}, 5 févr. 1915, p.~2 ; 15 avr. 1917, p.~3), d'où ce retour en ville le soir. Ce jour, la 55th Brigade de la 18th Division dispute encore la Schwaben Redoubt, que la division tient jusqu'à sa relève, le 5 octobre (Becke 1938, p.~84 ; OH 1916-II, p.~453).
