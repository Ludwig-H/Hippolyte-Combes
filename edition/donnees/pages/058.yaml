historique: |
  La messe de 8~h est dite à l'autel paroissial de la cathédrale Saint-Étienne (Mérimée PA00094498), proche de l'appartement de la rue de Languedoc (lettre à Marguerite, 25~nov. 1918). Sur Sainte-Marie, maison de l'oncle Émile Crouzet, voir f.~27~v\textsuperscript{o}. Le tram de la place Esquirol mène à Lardenne, à l'ouest, près du Touch (Baedeker 1912, p.~298). « Jean » est sans doute l'abbé Jean Crouzet (v.~1880--1932), vraisemblablement fils d'Émile et cousin germain de Marguerite (\textit{L'Express du Midi}, 23~déc. 1926, p.~5 ; 27~août 1932, p.~4) ; un « abbé Crouzet » est vicaire à la cathédrale pendant la guerre (\textit{Le Télégramme}, 5~févr. 1915, p.~2). Ce jour, la 55\textsuperscript{th} Brigade de la 18\textsuperscript{th} Division dispute encore la Schwaben Redoubt, que la division tient jusqu'à sa relève, le 5~octobre (Becke 1938, p.~84 ; OH~\mbox{1916-II}, p.~453).
