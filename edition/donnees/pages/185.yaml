critique: Encre violette, d'une seule venue pour les deux journées. Taches brunes (rouille ou décharge) au milieu et au pied de la page.
historique: |
  L'officier « retour de \textit{Bournmth} » rentre sans doute d'une permission passée à Bournemouth, alors dans le Hampshire. Le départ annoncé « à Cambrai » relève de la rumeur : la ville, à 12-13 km derrière la ligne Hindenburg, restera allemande jusqu'au 9 octobre 1918 (Michelin 1921, p.~62-63) ; l'annonce traduit l'espoir d'une avance de la Fifth Army, qui avait attaqué Bullecourt le 11 avril (OH 1917-I, p.~361-364). Au même moment, l'ancienne division d'Hippolyte Combes monte vers Arras : le 27, les transports de la 54th Brigade y font route « under Capt. West Comdg 152nd Coy A.S.C. » (JMO 7/Bedf, ordre n\textsuperscript{o}~5, 26 avril 1917), avant l'attaque de Chérisy du 3 mai (Nichols 1922, p.~165-166). Le \textit{water-cart} est une voiture-citerne à eau (\textit{Dictionary} 1919, s.v. « Voiture ») ; le \textit{lift} pris au passage d'un véhicule était toléré (Fraser et Gibbons 1925, s.v. « Lorry hopping »). Le lieutenant Gilbert, « de Jersey », n'est pas identifié (voir f.~89 v\textsuperscript{o}) ; la route de Mirvaux avait été parcourue le 24 avril (f.~91 v\textsuperscript{o}).
sources:
- Michelin & Cie, St-Quentin – Cambrai, la ligne Hindenburg (Guides illustrés Michelin des champs de bataille), Clermont-Ferrand, Michelin, 1921, p. 62-63.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 361-364.
- 'Bedfordshire Archives Service, X550/8/1/1704 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, avril 1917, ordre n° 5 du 26 avril (transcription en ligne).'
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 165-166.
- French-English Dictionary of Military Terms and of Other Terms Useful to Officers, Londres, HMSO, 1919, s.v. « Voiture ».
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, Londres, Routledge, 1925, s.v. « Lorry hopping ».
