historique: |
  L'officier « retour de \textit{Bournmth} » rentre sans doute d'une permission à Bournemouth, alors dans le Hampshire. Le départ « à Cambrai » n'est qu'une rumeur : la ville, à 12--13~km derrière la ligne Hindenburg, reste allemande jusqu'au 9~octobre 1918 (Michelin 1921, p.~62--63) ; l'annonce supposait une avance de la Fifth Army, qui avait attaqué Bullecourt le 11~avril (OH~\mbox{1917-I}, p.~361--364). L'ancienne division d'Hippolyte Combes monte alors vers Arras : le 27, les transports de la 54\textsuperscript{th} Brigade y font route (JMO~7/Bedf, ordre n\textsuperscript{o}~5, 26~avril 1917). Le \textit{lift} pris sur un véhicule de passage était toléré (Fraser et Gibbons 1925, s.v. « Lorry hopping »). Sur le sous-lieutenant Gilbert, voir f.~89~v\textsuperscript{o}.
sources:
- Michelin & Cie, St-Quentin – Cambrai, la ligne Hindenburg (Guides illustrés Michelin des champs de bataille), Clermont-Ferrand, Michelin, 1921, p. 62-63.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 361-364.
- 'Bedfordshire Archives Service, X550/8/1/1704 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, avril 1917, ordre n° 5 du 26 avril (transcription en ligne).'
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, Londres, Routledge, 1925, s.v. « Lorry hopping ».
