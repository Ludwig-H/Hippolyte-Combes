historique: |
  Estaires (Nord), sur la Lys, à 6~km à l'ouest de La Croix-du-Bac, est un bourg de l'arrière ; il a abrité des ambulances et la 1\textsuperscript{st} Australian Casualty Clearing Station (CWGC, Estaires Communal Cemetery). L'église Saint-Vaast date de 1858 ; l'hôtel de ville, de style flamand, de 1600--1612. Tous deux seront détruits avec la ville, prise le 10~avril 1918, puis reconstruits en 1927--1930 (Wikipédia, « Estaires »). Aucun n'est protégé (Mérimée) ; les stalles et la statuette de saint Ambroise ne sont pas documentées. Le quart de livre de « bonbons chocolat » à 75~c met le kilo à 6~F, près du double du chocolat ordinaire (3,19~F le kilo à l'économat d'une compagnie de chemins de fer en juillet 1916 : March 1925, p.~199).
