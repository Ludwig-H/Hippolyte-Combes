historique: |
  Estaires (Nord), sur la Lys, à 6 km à l'ouest de La Croix-du-Bac, est un bourg de l'arrière, occupé par la cavalerie française dès le 15 octobre 1914 ; il a abrité des ambulances, puis la 1st Australian Casualty Clearing Station (CWGC, Estaires Communal Cemetery). L'église Saint-Vaast que visite Hippolyte Combes est celle de 1858 (arch. Charles Leroy) ; l'hôtel de ville à l'écusson peint est l'édifice de style flamand bâti en 1600-1612. Tous deux disparaîtront avec la ville, prise le 10 avril 1918 pendant la bataille de la Lys et presque entièrement détruite, puis seront reconstruits par Georges Dumas en 1927-1930 (Wikipédia, « Estaires », à confirmer). Aucun n'est protégé au titre des monuments historiques (Mérimée, interrogation du 18 oct. 2026), et le mobilier décrit (stalles, statuette de saint Ambroise) n'est pas documenté. Le quart de livre de « bonbons chocolat » à 75 c met le kilo à 6 F, près du double du chocolat ordinaire, vendu 3,19 F le kilo à l'économat d'une compagnie de chemins de fer en juillet 1916 (March 1925, p. 199).
