critique: Page d'une seule venue à l'encre violette. Le récit du voyage se poursuit sans interruption au verso, sous la mention « 26 (suite) ».
historique: |
  Le départ, fixé « definit au 26 » au bureau de la Mission du V Corps à Acheux (f.~61~v\textsuperscript{o}), suit l'itinéraire de la permission de septembre (voir f.~25~v\textsuperscript{o}). La gare d'Acheux-Varennes, entre les deux villages, appartient à la ligne à voie métrique d'Albert à Doullens des chemins de fer départementaux de la Somme, qui rejoint à Gézaincourt la ligne du Nord d'Amiens à Frévent (Wikipédia, « Chemins de fer départementaux de la Somme » ; OH 1916-I, p.~273). Varennes et Gézaincourt abritent alors des hôpitaux d'évacuation de la Fifth Army, trois et deux en novembre 1916 (OH 1916-II, p.~541). Le « train de Doullens » est celui de la ligne du Nord vers Amiens, où Combes n'arrive que vers 2~h du matin (f.~64~v\textsuperscript{o}). La forte gelée et la neige durcie sont celles de la vague de froid qui, commencée vers le 16 janvier 1917, dure jusqu'à la mi-février (Barbé 1917, p.~181-182). L'interprète rencontré dans le compartiment n'est pas nommé ; c'est peut-être l'un des deux qui accompagnent Combes à Amiens (f.~65~r\textsuperscript{o}).
sources:
- Wikipédia, « Chemins de fer départementaux de la Somme », § « Ligne d'Albert à Doullens », consulté le 17 oct. 2026.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 541.
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
