historique: |
  Mme de Labarthe, la « gde amie » de Combes, est sans doute la mère de son ami le docteur de L— (voir f.~28~v\textsuperscript{o}) ; les dames Delsol, ses voisines, et Henriette ne sont pas identifiées. Du Capitole part le tram de la Côte-Pavée, qui dessert Sainte-Marie, maison des Crouzet (Baedeker 1912, p.~298). La chapelle de Nazareth, rue Philippe-Féral, était un lieu de messes anniversaires (\textit{Le Télégramme}, 10 mars 1916, p.~4) ; le sens de « revu tte ma famille » est incertain. Pfister, horloger-bijoutier au 24, place des Carmes, angle de la rue de Languedoc, avait vendu le sautoir (f.~28~v\textsuperscript{o}) ; la montre est payée le lendemain (f.~69~r\textsuperscript{o}). La conférence était celle de l'abbé Thellier de Poncheville, aumônier militaire, annoncée pour 17~h~30 dans la chapelle de l'archevêché, place du Salin, partant en mission au Canada et aux États-Unis (\textit{L'Express du Midi}, 31 janv. et 1\textsuperscript{er} févr. 1917, p.~3). Combes reviendra : nommé au lycée de Toulouse vers 1937, il s'y fixera, 38, rue du Taur (Pouvillon 1938 ; PC-Livre).
