titre: Grand froid ; Nazareth ; montre en or chez Pfister ; conférence manquée ; adieu à Toulouse
transcription: |
  1^{er} \sl{Jeudi} \hfill \sl{Février 1917} —
  Temps très froid. Gelé dur. Dans la journée, soleil
  brillant
  matin, longue visite à Mme de Labarthe
  & aux dames Delsol, mes voisines
  Au Capitole, retrouvé Mte, vers 11^{H} \fr{1}{2} et sa
  sœur ! Remontés ensemble tram S^{te}-marie.
  après déjeuner, descendu ville et. av Henriette
  vers 4^{H} \fr{1}{2}, à \add{gare, à propos panier fleurs} Nazareth, revu \inc{tte} ma famille
  Choisi montre or ch Pfister.
  Chapelle archevêché : conférence, pas eu lieu –
  Rentré dîner à S^{te} Marie —
  vers 9^{H} \fr{1}{2}, à pied j-à rue de Languedoc —
  \ind Ville silencieuse. Maisons fermées. Je me
  sens complet^{t} détaché de Toulouse. Partirai sans
  regret, et pour n'y retourner jamais plus .
  \blanc{4}
  \equerre{4}Trams : 30c. , 10c. , 20c , 30c.
  Food (\inc{boulangeon}) : 25c
  Remboursé à mes voisines : 3^{f} \inc{75}
  (12 œufs, \fr{1}{2} beurre, 1 \inc{boulangeon})
