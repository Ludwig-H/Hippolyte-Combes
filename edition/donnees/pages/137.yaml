historique: |
  Sur Mme de Labarthe, voir f.~28~v\textsuperscript{o} ; les dames Delsol et Henriette ne sont pas identifiées. La chapelle de Nazareth accueillait des messes anniversaires (\textit{Le Télégramme}, 10 mars 1916, p.~4). Pfister, horloger-bijoutier au 24, place des Carmes, avait vendu le sautoir (f.~28~v\textsuperscript{o}) ; la montre est payée le 2 (f.~69~r\textsuperscript{o}). La conférence était celle de l'abbé Thellier de Poncheville à la chapelle de l'archevêché, avant une mission en Amérique du Nord (\textit{L'Express du Midi}, 31 janv. et 1\textsuperscript{er} févr. 1917, p.~3). Combes reviendra pourtant : nommé au lycée de Toulouse vers 1937, il s'y fixera, 38, rue du Taur (Pouvillon 1938 ; PC-Livre).
