critique: Les lignes sous le filet reviennent sur la visite chez M\textsuperscript{me} de Labarthe racontée f.~30~v\textsuperscript{o}.
historique: |
  La « tunique » est sans doute celle de la tenue d'interprète, kaki, avec une tête de sphinx au collet (Tessan, dans Fernand-Laurent 1917, p.~\textsc{xii}--\textsc{xiii} ; Whittem et Long 1917, p.~130). Guiraud et la « Cie Française » ne sont pas identifiés. Le « semestre » versé à M\textsuperscript{lle} Guilhem est le loyer de l'appartement du 24, rue de Languedoc, gardé pendant la guerre (lettre du 25~nov. 1918) : 15~F par mois, quand la pension complète d'un ouvrier célibataire coûtait une centaine de francs en Haute-Garonne (March 1925, p.~237--238). Sur M\textsuperscript{me} de Labarthe, voir f.~28~v\textsuperscript{o}.
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XII-XIII.
- Whittem, A. F., et Long, P. W., French for Soldiers, Cambridge (Mass.), Harvard University Press, 1917, p. 130.
- March, L., Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 237-238.
- Lettre d'Hippolyte Combes à sa femme, Paris, 25 novembre 1918 (archives familiales ; en annexe).
