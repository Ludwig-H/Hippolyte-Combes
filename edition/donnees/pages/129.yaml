critique: |
  Le récit reprend au f.~65~r\textsuperscript{o}, à la date du 27, en revenant sur l'arrivée à Amiens.
historique: |
  Le voiturier d'Acheux est celui de la voiture « qui fait service poste » (f.~64~r\textsuperscript{o}). À Gézaincourt, Hippolyte Combes ne paie que 10~c pour 27~kg : les voyageurs avaient droit à 30~kg de bagages en franchise, et seul un droit d'enregistrement de 10~c était perçu (Baedeker 1913, p.~xiii). À Paris, il fait enregistrer de nouveau ses sacs pour Toulouse (f.~65~r\textsuperscript{o}). Les 319,50~F en caisse au départ valent à peu près deux mois de ce que verse la Mission (162,75~F en décembre comme en janvier ; voir ff.~60~r\textsuperscript{o} et 62~v\textsuperscript{o}) ; ils doivent couvrir le voyage et les achats de la permission (voir f.~66~r\textsuperscript{o}).
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. xiii.
