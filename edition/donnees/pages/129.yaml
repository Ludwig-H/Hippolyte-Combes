titre: Arrivée à Amiens vers deux heures du matin ; frais de bagages et état de la caisse
transcription: |
  Ven. \sl{26 (suite)} \hfill \sl{Janvier 1917}
  Arrivé Amiens vers 2^{H} m
  Froid penetrant — gelé très dur
  au ciel sombre, qq etoiles très brillantes
  \blanc{1}
  \filet[d]{0.15}
  \crochet{5}\crochet{3}— Voiturier, à Acheux : \hfill 1^{f}
  \ind[2] (2 sacs à la gare
  A Gezaincourt : enregt bag. : \hfill 10c
  \droite 27 kos. – 2 sacs
  En caisse, ce matin : 319^{f} 50c
  \filet
  \blanc{12}
