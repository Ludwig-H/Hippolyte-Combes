critique: Page écrite au tiers supérieur seulement ; le compte est enclos dans un cadre (grand crochet, segment de filet en haut à droite, double filet au pied), et le reste de la page est blanc. Au bas, décharge brunâtre de l'écriture de la page en regard. Le récit reprend au f.~65~r\textsuperscript{o} à la date du 27, en revenant sur l'arrivée à Amiens.
historique: |
  Le voiturier d'Acheux est celui de la voiture « qui fait service poste », à qui Hippolyte Combes a fait porter ses deux sacs à la gare (f.~64~r\textsuperscript{o}). À Gézaincourt, il ne paie que 10~c pour 27~kg : sur les chemins de fer français, les voyageurs avaient droit à 30~kg de bagages en franchise, et seul était perçu un droit d'enregistrement de 10~c (Baedeker 1913, p.~xiii). Les sacs ne sont enregistrés que jusqu'à Paris : Hippolyte Combes les fait enregistrer de nouveau à la gare d'Orsay pour Toulouse (f.~65~r\textsuperscript{o}). L'encaisse de 319~f~50 au départ équivaut à peu près à deux mois de solde et d'indemnité versés au bureau de la Mission, soit 162~f~75 en décembre 1916 comme en janvier 1917 (comptes du carnet, déc. 1916 -- janv. 1917) ; elle doit couvrir le voyage et les achats de la permission, qui grèvent les comptes des pages suivantes (voir f.~66~r\textsuperscript{o}). Le froid « penetrant » de la nuit est celui de la vague de froid de janvier-février 1917 (voir f.~64~r\textsuperscript{o}).
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. xiii.
