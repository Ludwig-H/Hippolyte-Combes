historique: |
  Pendant la vague de froid (mi-janvier -- mi-février), Toulouse a onze jours de neige et vingt-cinq de gelée, avec $-$8,3~°C le 4~février (Barbé 1917, p.~182). La halle métallique de la place Victor-Hugo était le plus grand des trois marchés couverts de la ville (Archives municipales de Toulouse) ; Combes y avait fait le marché avec Marguerite en octobre (voir f.~30~v\textsuperscript{o}). L'hôtel d'Assézat, « construit en 1555 sur les plans de N. Bachelier », abrite depuis 1895 l'Académie des Jeux floraux ; la Daurade a été « rebâtie de 1773 à 1790 » (Baedeker 1912, p.~303--305). Le clocher de la Dalbade, le plus haut de Toulouse, s'effondrera le 11~avril 1926 (Office de tourisme de Toulouse). Le télégramme à M\textsuperscript{me} Spagnol concerne sans doute le panier de fleurs de Nice (voir f.~67~r\textsuperscript{o}).
sources:
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
- Archives municipales de Toulouse, Histoire des marchés toulousains et Marchés dans la ville (archives.mairie-toulouse.fr).
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne. Manuel du voyageur, Leipzig, K. Baedeker, 1912, p. 303-305.
- Office de tourisme de Toulouse, notice « Notre-Dame de la Dalbade » (toulouse-tourisme.com), consultée le 18 oct. 2026.
