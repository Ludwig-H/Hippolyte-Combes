date: Mercredi 31 janvier 1917
mois: Janvier 1917
lieux: Toulouse (Haute-Garonne)
titre: 'Toulouse dans le gel : marché Victor-Hugo, hôtel d''Assézat, la Daurade et la Dalbade'
transcription: |
  \sl{Mercredi 31.} — \hfill \sl{Janvier 1917}
  Nuit, gelé très fort. Ds la journée, neige 1 peu,
  et soufflé bise glaciale
  matinée, venu rejoindre M^{te} \inc{p su} tram à St Ser.
  ver 10^{h}. Ensemble, fait marché à V. Hugo
  Après-midi, descendus en ville. Promené
  rues bien abritées. Visité Hotel d'asezat,
  Daurade & Dalbade
  Puis montés mon appart^{t} et y reposé 2 long^{ues}
  heures. Evité troubler qq grandes precieuses
  A S^{te} Marie, ver 6^{h}\fr{1}{2}. Retour à pied, ver
  9^{h}. Legers flocons neige tombaient sur le sol
  durci.
  \crochet{8}\ind Halles Victor Hugo : Gigot d'agneau : 5^{f} —
  Petits fromages (gervais & blancs) : 90. —
  1/2 beurre : 60c. — Boite sardines : \inc{2^{f}} —
  gâteaux : 20c. — 1 livre de dattes : 1^{f} — id. de
  figues : 1^{f} — gâteau aux noix : 1^{f} 25 c —
  gâteau des allées : 1 \inc{90}. — chz \inc{Henri} \inc{Testet}
  \ind Trams : 30c., 30c.
  Télegramme à Mme Spagnol, Nice : 2^{f} —
