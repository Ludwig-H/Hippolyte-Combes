historique: |
  Le village « abandonné » est Hérissart, que les troupes ont quitté le 27 (voir f.~86~v\textsuperscript{o}). Le 30 et le 31, les tournées du Purchase Board vont vers le sud-ouest, sur le plateau entre Hérissart et Villers-Bocage : Pierregot, Molliens-au-Bois et Rainneville, à 4--8~km (calcul de l'éditeur). La paille achetée le 31 sert la préparation de l'offensive d'Arras : on comptait « vider rapidement les granges en aidant les fermiers à battre leur grain et en achetant la paille pour l'armée » (OH~\mbox{1917-I}, p.~190). Avec le dégel de mars, les routes à l'empierrement mince étaient défoncées, au point que « même les voitures légères » les crevaient (OH~\mbox{1917-I}, p.~103).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 103, 190.
