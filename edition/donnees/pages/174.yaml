date: Jeudi 29 – samedi 31 mars 1917
mois: Mars 1917
lieux: Hérissart, Puchevillers, Rubempré, Molliens-au-Bois et Rainneville (Somme)
titre: Giboulées, routes défoncées par les camions ; achats de paille ; Hérissart vide de troupes
transcription: |
  29 \sl{Jeudi} \hfill — \sl{Mars 1917} —
  Temps moins froid. Mais, presque tt le jour,
  ondées torrentielles
  Matinée, courses en auto : Puchevillers &
  Rubempré. Averses très fortes –
  \ind Après-midi entière, liberté
  Village parait abandonné. Plus de troupes.
  Rues désertes. Calme délicieux —
  \blanc{2}
  \sl{30 Ven.}
  Encore aujd'hui, giboulées saison. Averses très fortes,
  un peu de neige, rafales violentes
  Routes, etat lamentable, creusées de sillons
  profonds par gros camions & lourds véhicules
  Matinée, courses à Pierregot & Molliens-au-B
  Après-midi, liberté complète
  merv^{x} ciel étoilé, croissant lune brillant,
  nuages très rapides. Etat lyrique. —
  \blanc{1}
  \sl{31 Sam.} – En course, matin & soir. Rubempré,
  par Toutencourt & Puchevillers, Pierregot et
  Rainneville – – acheté paille
  Temps très mauvais. Surpris en route par
  fortes averses, grèle – grelons, frappé nos
  visages – Routes ext^{t} detrempées . – .
  village tjours sans troupes, parait inhabite
  \ind J'aime ce calme & ce silence
