historique: |
  Le village « abandonné » est Hérissart, que les troupes ont quitté le 27 (voir f.~86 v\textsuperscript{o}). Les tournées du \textit{Purchase Board} se portent désormais vers le sud-ouest, sur les villages du plateau entre Hérissart et Villers-Bocage : Pierregot, Molliens-au-Bois et Rainneville, à 4–8 km (calcul de l'éditeur). La paille achetée le 31 à Rainneville répond à une demande accrue : pour préparer l'offensive d'Arras, on comptait « vider rapidement les granges en aidant les fermiers à battre leur grain et en achetant la paille pour l'armée » (OH 1917-I, p.~190). Les routes « creusées de sillons profonds » sont l'effet, décrit par l'histoire officielle, du dégel de mars sur un empierrement mince que « même les voitures légères crevaient » (OH 1917-I, p.~103). Le « croissant » du 30 au soir est celui d'une Lune nouvelle le 23 mars, proche de son premier quartier (calcul de l'éditeur).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 103, 190.
