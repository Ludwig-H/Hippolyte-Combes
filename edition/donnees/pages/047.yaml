historique: |
  La « station de Raincheval » est la gare Raincheval-Arquèves (voir f. 22 r\textsuperscript{o}). Les « Bedfs » sont le 7th Bedfordshire (54th Brigade), à Raincheval depuis le 11 septembre. Son journal note ce jour : « Received orders to move on 23rd inst. time uncertain » (JMO 7/Bedf, 22 sept. 1916). Le « cap Pant » n'est pas identifié : aucun « Panton » de l'A.S.C. dans les dossiers d'officiers (TNA, WO 339). Le château est sans doute celui de Raincheval (voir f. 21 v\textsuperscript{o}). La permission lui donnera sept jours pleins à Toulouse, du 27 septembre au 4 octobre (voir f. 27 v\textsuperscript{o}--32 r\textsuperscript{o}) : la durée réglementaire au 1\textsuperscript{er} octobre 1916 (Cronier 2013, p.~18 et 32).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre 1916 (transcription en ligne).'
- 'The National Archives (Kew), WO 339 : dossiers d''officiers, catalogue Discovery (recherche « Panton »).'
- Cronier, E., Permissionnaires dans la Grande Guerre, Paris, Belin, 2013, p. 18 et 32.
