titre: Horaires à la gare de Raincheval ; match de football des Bedfords ; ordre de départ
transcription: |
  22 \sl{Ve –} Enfin, temps splendide \hfill \sl{Sept /16}
  ciel d'1 bleu intense – Soleil ardent \fr{1}{2} jour
  Apres-midi, promené j-à la station de
  Raincheval et me suis renseigné horaire trains
  Au retour assisté match de football –
  s/ prairie à coté horse-lines the Bedfs
  maillots rouge vif, " blancs – à l'arrière-
  -plan, très beaux arbres —
  Cme tournais en face chateau cap
  Pant m'a appris que we are moving demain.
  gde deception — & mélancolie —
  Dernière nuit, chambre, préoccupé
  paquets à faire et voyage a Toul\trait
  depart le 25
  \blanc{4}
  Nuit très sombre\trait qq stars au ciel noir.
  \filet[g]{0.15}
  \ind 2 tins of coffee milk, à la
  \ind[2] Cantine : \inc{3^{f}}
  \ind Eggs & food : 1 f 10 —
