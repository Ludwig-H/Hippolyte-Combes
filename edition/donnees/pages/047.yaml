critique: Encre violette. Le récit du jour occupe le haut de la page ; après un blanc, une ligne isolée note la nuit, puis les comptes, sous un court filet à gauche, sont serrés au pied de la page.
historique: |
  La « station de Raincheval » est la gare Raincheval-Arquèves de la voie métrique Albert--Doullens, dont Combes connaît déjà la cantine (f. 22 r\textsuperscript{o} ; CFD Somme). Les « Bedfs » sont le 7th Bedfordshire, de la 54th Brigade que ravitaille la 152nd Coy, cantonné à Raincheval depuis le 11 septembre ; ce jour-là, son journal note : « Received orders to move on 23rd inst. time uncertain » (JMO 7/Bedf, 22 sept. 1916) : l'annonce du « cap Pant » suit cet ordre de quelques heures. L'officier n'est pas identifié : la forme « Panton » des lectures antérieures n'est pas assurée et ne correspond à aucun officier de l'A.S.C. parmi les dossiers d'officiers des National Archives (TNA, WO 339). Le château devant lequel passe Combes est sans doute celui de Raincheval, de 1719 (Mérimée PA00116224). La permission annoncée, « départ le 25 », lui donnera sept jours pleins à Toulouse, du 27 septembre au 4 octobre (f. 27 v\textsuperscript{o}--32 r\textsuperscript{o}) : c'est la durée réglementaire des permissions à partir du 1\textsuperscript{er} octobre 1916 (Cronier 2013, p.~18 et 32).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre 1916 (transcription en ligne).'
- Wikipédia, « Chemins de fer départementaux de la Somme », § « Ligne d'Albert à Doullens » (consulté le 17 oct. 2026).
- Ministère de la Culture, base Mérimée, notice PA00116224 (château, Raincheval).
- 'The National Archives (Kew), WO 339 : dossiers d''officiers, catalogue Discovery (recherche « Panton »).'
- Cronier, E., Permissionnaires dans la Grande Guerre, Paris, Belin, 2013, p. 18 et 32.
