historique: |
  Montigny est sans doute Montigny-sur-l'Hallue, où Hippolyte Combes verra le 2 mars un « Dr Dubois » (f.~80~v\textsuperscript{o}). Ni le maire Paul Dubois, ni le capitaine Trefton [?], ni la maison « La Semeuse » ne sont identifiés. Réquisitions et réclamations passent d'abord par le maire ou le garde champêtre (\textit{Blackwood's}, juin 1917, p.~935-939). Amiens avait subi des bombardements aériens ; les portails de la cathédrale étaient protégés par des sacs de terre (Michelin 1919, p.~9-10, 26-27). L'Hôtel de la Paix est sans doute celui du 15, rue Duméril, qui annonce en 1919 un abri pour vingt voitures (Michelin 1919, liste des hôtels). Le « bonnet police » est le calot français : en kaki, les interprètes gardaient le képi ou le casque (Tessan, dans Fernand-Laurent 1917, p.~XII-XIII).
sources:
- Anonyme (« A Divisional Claims Officer »), « Claims », Blackwood's Magazine, vol. 201, n° 1220, juin 1917, p. 935-939.
- Michelin & Cie, Amiens before and during the War, Clermont-Ferrand, Michelin, 1919, p. 9-10, 26-27 et liste des hôtels (renseignements au 1er mars 1919).
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XII-XIII.
