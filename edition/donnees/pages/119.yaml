critique: Encre noire virée au brun. Les comptes d'Amiens, détachés du récit par un blanc de deux lignes, ne sont ouverts par aucun crochet. Au pied de la page apparaissent, inversées, des traces de l'écriture de l'autre face.
historique: |
  Montigny est sans doute Montigny-sur-l'Hallue, où Combes causera le 2 mars avec un « Dr Dubois » (f.~80~v\textsuperscript{o}) ; le maire Paul Dubois n'est pas autrement identifié. Toute réquisition ou réclamation passe d'abord par le maire ou le garde champêtre (\textit{Blackwood's}, juin 1917, p.~935-939). Amiens, à l'abri de l'ennemi jusqu'en mars 1918, avait pourtant subi des bombardements aériens, et les portails de la cathédrale étaient protégés par « un épais mur de sacs de terre » (Michelin 1919, p.~9-10, 26-27). Les « détails déjà vus » ne renvoient à aucune visite du carnet, qui ne note à Amiens que des correspondances (f.~26~r\textsuperscript{o}, 33~r\textsuperscript{o}). L'Hôtel de la Paix est vraisemblablement celui du 15, rue Duméril, qui annonce en 1919 un abri pour vingt voitures (Michelin 1919, liste des hôtels). Ni le capitaine Trefcon ni la maison « La Semeuse » ne sont identifiés. Le « bonnet police drap bleu » est le calot français : habillés de kaki, les interprètes gardaient le képi ou le casque (Tessan, dans Fernand-Laurent 1917, p.~XII-XIII).
sources:
- Anonyme (« A Divisional Claims Officer »), « Claims », Blackwood's Magazine, vol. 201, n° 1220, juin 1917, p. 935-939.
- Michelin & Cie, Amiens before and during the War, Clermont-Ferrand, Michelin, 1919, p. 9-10, 26-27 et liste des hôtels (renseignements au 1er mars 1919).
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XII-XIII.
