historique: |
  Ni M\textsuperscript{me} Delille ni le capitaine Williams, venu le 2~décembre remplacer Curtis (f.~52~v\textsuperscript{o}), ne sont identifiés. Le bureau de la Mission française d'Acheux, celui du V Corps depuis la mi-janvier (f.~61~v\textsuperscript{o}), sert de relais pour les messages et le téléphone. Hérissart (Somme), à une dizaine de kilomètres au sud-ouest d'Acheux, n'est qu'à 3~km de Toutencourt, QG de la Fifth Army jusqu'au 28~mars 1917 (OH~\mbox{1916-I}, p.~304 ; LLT). L'auto passe par Raincheval et par Puchevillers, qui a deux hôpitaux d'évacuation jusqu'en mars 1917 (LLT). Le café Chatelain (lecture incertaine) n'est pas identifié. L'église d'Hérissart est dédiée à saint Martin (Palissy PM80005288).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 304.
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » et « Locations of British Casualty Clearing Stations » (longlongtrail.co.uk, copies Wayback 2018 et 2024).
- Ministère de la Culture, base Palissy, notice PM80005288 (statue de la Vierge à l'Enfant, église Saint-Martin, Hérissart).
