historique: |
  Le voyage se fait en pleine vague de froid, du 16~janvier au 16~février (Barbé 1917, p.~181--182). Sur la Y.M.C.A. d'Amiens, voir f.~65~r\textsuperscript{o}. Le « train de Doullens » le ramène, sans doute par Gézaincourt, sur la voie métrique d'Albert à Doullens, qui dessert Louvencourt et Acheux-Varennes (OH~\mbox{1916-I}, p.~273 ; trajet inverse au f.~64~r\textsuperscript{o}). Les « taches blanches » sont les éclatements des obus antiaériens britanniques, l'\textit{Archie} (Fraser et Gibbons 1925, s.v.). Les Carlumont (forme incertaine), logeurs d'Hippolyte Combes (f.~47~r\textsuperscript{o}), ne sont pas identifiés. Le mari, tailleur (f.~51~r\textsuperscript{o}), avait annoncé le 1\textsuperscript{er}~janvier qu'il devrait quitter sa maison (f.~59~r\textsuperscript{o}).
sources:
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, Paris, Librairie agricole de la Maison rustique, 1917, p. 181-182.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 273.
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, Londres, Routledge, 1925, s.v. « Archie », « Taube ».
