critique: Le récit du 7 février se poursuit au verso.
historique: |
  Le voyage se fait au cœur de la vague de froid du 16 janvier au 16 février (Barbé 1917, p.~181-182). Sur le foyer de la Y.M.C.A. voisin de la gare d'Amiens, voir f.~65~r\textsuperscript{o}. Le « train de Doullens » ramène Hippolyte Combes, sans doute par Gézaincourt, sur la voie métrique d'Albert à Doullens, qui dessert Louvencourt et Acheux-Varennes (OH 1916-I, p.~273 ; trajet inverse au f.~64~r\textsuperscript{o}). « Taube » (« colombe »), nom du monoplan allemand du début de la guerre, désigne alors tout avion allemand ; les « taches blanches » sont les éclatements des obus antiaériens britanniques, l'\textit{Archie} (Fraser et Gibbons 1925, s.v.). En avril 1917, Léalvillers, à 3~km au sud de Louvencourt, abrite deux escadrilles du RFC (Jones 1931, App.~XII). Les Carluvant (forme incertaine), logeurs d'Hippolyte Combes au n°~1, route de Léalvillers (f.~47~r\textsuperscript{o}), ne sont pas identifiés ; le mari, tailleur (f.~51~r\textsuperscript{o}), avait annoncé le 1\textsuperscript{er} janvier qu'il devrait quitter sa maison (f.~59~r\textsuperscript{o}) : d'où peut-être l'« ancien billet ».
sources:
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, Paris, Librairie agricole de la Maison rustique, 1917, p. 181-182.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273.
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, London, Routledge, 1925, s.v. « Archie », « Taube ».
- Jones, H. A., The War in the Air, vol. III, Oxford, Clarendon Press, 1931, App. XII.
