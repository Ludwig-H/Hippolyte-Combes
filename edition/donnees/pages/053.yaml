- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, Baedeker, 1913, p. 52.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, route 39.
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
- BnF, notice d'autorité « Ernest Zyromski (1862-1933) », data.bnf.fr/12976861.
- La Dépêche (Toulouse), 29 août 1916, p. 1.
- Wikipédia (en), « Battle of Nagyszeben (1916) », consulté en oct. 2026.
