historique: |
  Les « Magasins de l'Hotel-de-Ville » sont le Bazar de l'Hôtel-de-Ville (Baedeker 1913, p.~52). Le « \fr{1}{4} place » est le tarif des militaires en permission (Lafon 1922, p.~37) ; le plein tarif Paris--Toulouse en 2\textsuperscript{e} classe est de 54~fr.~30 (Baedeker 1912, R.~39). Ernest Zyromski (1862--1933), auteur de \textit{L'Orgueil humain} (1904), enseigne à la faculté des lettres de Toulouse (BnF) ; Hippolyte Combes suivra son cours le 30 janvier 1917 (voir f.~67 v\textsuperscript{o}). La Roumanie, entrée en guerre le 27 août (\textit{La Dépêche}, 29 août 1916, p.~1), subit dès ce jour la contre-offensive de Falkenhayn devant Hermannstadt (Wikipédia, « Battle of Nagyszeben »).
