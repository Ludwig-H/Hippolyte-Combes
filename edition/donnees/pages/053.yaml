transcription: |
  mardi – \sl{26} \hfill \sl{Sept 16}
  Dejeun – B^{d} St-Germain
  Reposé jardin Notre-Dame
  Magasins de l'Hotel-de-Ville
  \inc{Lgs} assis banc ds le square de la
  tour St-Jacques – grd mouvt rue de
  Rivoli. Animation ordin^{re}. —
  \blanc{3}
  Après diner, venu lentemt, par le
  quais à gare d'Orsay
  Depart train vers 8 H s
  \filet
  Tramway : Bourget - gare du nord : 50 c
  Metro : 1 f   \inc{Envois} : 10 c, 1 f, 2 f, 2 f (\inc{Therese})
  Billet 2e cl. Toulouse \fr{1}{4} place : 15^{f} \add{Coupe (chvx} 1 f
  Christofle : 12^{f} 50, remise, une \ill : 10^{f}50
  Zyromski : Lorgueil humain : 4^{f}. net : 3^{f}20
  Maeterlinck : Les Debris : 3^{f}50. – Cirage : 25 c
  Dejeun : 1^{f}60. – Diner : 1^{f}60. – C^{tes} p^{les} : 15 c
  Fleurs artif^{lles}, Hotel de Ville : 8^{f}50 couronne \trait
  Kepi (au Bon Marché : 8^{f}75. – Consigne : \inc{15 c}
  Carte de Verdun : 50 c – \inc{Entretien} souliers : 30 c
  Carte Roumanie : 30 c – \inc{Divers} : W.C : 15 c
