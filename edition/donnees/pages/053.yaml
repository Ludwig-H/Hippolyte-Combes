critique: Encre violette. Le récit continue la journée commencée sur la page précédente (f.~26 v\textsuperscript{o}) ; après un blanc, les comptes placés sous le filet récapitulent tout le passage à Paris, du tramway du Bourget au départ d'Orsay.
historique: |
  Les « Magasins de l'Hôtel-de-Ville » sont le Bazar de l'Hôtel-de-Ville, 54--62, rue de Rivoli (Baedeker 1913, p.~52). Le billet à « \fr{1}{4} place » applique l'article~54 des cahiers des charges de 1859, qui réduit au quart de la taxe le prix payé par les militaires en permission (Lafon 1922, p.~37) ; le plein tarif Paris--Toulouse en 2\textsuperscript{e} classe était de 54~fr.~30 (Baedeker 1912, R.~39). Ernest Zyromski (1862--1933), professeur de littérature française à la faculté des lettres de Toulouse, avait publié \textit{L'Orgueil humain} chez Armand Colin en 1904 (BnF) ; le « net » de 3~f~20 suppose une remise de 20~\% ; Hippolyte Combes suivra son cours public le 30 janvier 1917 (voir f.~67 v\textsuperscript{o}). \textit{Les Débris de la guerre} de Maeterlinck (Fasquelle, 1916) est vendu au prix de la Bibliothèque-Charpentier. La carte de Roumanie suit l'actualité : entrée en guerre le 27 août 1916 (\textit{La Dépêche}, 29 août 1916, p.~1), la Roumanie subit à partir de ce 26 septembre la contre-offensive de Falkenhayn devant Hermannstadt (Wikipédia, « Battle of Nagyszeben »).
