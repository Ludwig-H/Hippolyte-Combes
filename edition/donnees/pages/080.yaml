critique: Page d'une seule venue à l'encre violette ; une petite tache d'encre touche « Cartes » à la dernière ligne.
historique: |
  L'orage et la pluie de la nuit du 18 au 19 sont ceux qui, ce matin-là à 9~h~45, font reporter de 24 heures par la Fifth Army l'attaque de Regina et Stuff Trenches. Un message de 13~h~30 la fixe au 21 octobre et l'opération principale sur l'Ancre au 25 (OH 1916-II, p.~461). Le même 19 octobre, le 7th Bedfordshire, bataillon de la 54th Brigade que sert la compagnie, quitte Bouzincourt pour Albert (JMO 7/Bedf, 17--19 oct. 1916). Le \textit{wagon} sur lequel monte Combes est sans doute une voiture hippomobile de la compagnie (\textit{G.S. wagon}), non un train. Le \textit{brickfield area} est sans doute les \textit{Brickfields}, anciennes briqueteries de la sortie nord d'Albert, en direction d'Aveluy, devenues en 1916 une vaste zone de bivouac. Bouzincourt est à 3~km à l'ouest-nord-ouest de ce camp (journal d'A. Linfoot, 58th Field Ambulance, notes des 8--9 nov. 1916). La chambre trouvée dans une rue voisine est l'une des maisons d'Albert laissées vides par leurs habitants (voir f.~39~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
- Linfoot, A., journal de guerre (58th Field Ambulance, R.A.M.C.), édition annotée en ligne, arthurlinfoot.org.uk, entrées du 23 oct. au 9 nov. 1916, consultée le 18 oct. 2026.
