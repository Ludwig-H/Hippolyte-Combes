historique: |
  À cause de l'orage de la nuit, la Fifth Army reporte de 24 heures, à 9~h~45, l'attaque de Regina et Stuff Trenches ; un message de 13~h~30 la fixe au 21 octobre (OH 1916-II, p.~461). Le même jour, le 7th Bedfordshire, bataillon de la 54th Brigade que sert la compagnie, quitte Bouzincourt pour Albert (JMO 7/Bedf, 17--19 oct. 1916). Le \textit{wagon} est sans doute une voiture à chevaux de la compagnie (\textit{G.S. wagon}), non un train. Le \textit{brickfield area} désigne sans doute les \textit{Brickfields}, anciennes briqueteries à la sortie nord d'Albert, vers Aveluy, devenues en 1916 une vaste zone de bivouac. Bouzincourt est à 3~km à l'ouest-nord-ouest de ce camp (journal d'A. Linfoot, 58th Field Ambulance, 8--9 nov. 1916).
