historique: |
  Sur Mme de Labarthe, voir f.~28 v\textsuperscript{o}. Montaudran, paroisse rattachée à Toulouse avant 1794, voisine de la Côte-Pavée (voir f.~27 v\textsuperscript{o}), a une église Saint-Étienne d'origine médiévale, remaniée en 1696 (Wikipédia). Le cimetière de Terre-Cabade, ouvert en 1840 sur le coteau de Jolimont, garde le tombeau d'Aristide Bergès (1835--1904), « en forme de temple antique » (Wikipédia) : peut-être celui que décrit Hippolyte Combes. Le capucin Marie-Antoine, mort en février 1907, y fut porté devant « plus de cinq mille personnes » (\textit{L'Express du Midi}, 11 févr. 1907, p.~2). « Josèphe » est Joséphine Combes, sœur aînée d'Hippolyte Combes, morte en octobre 1914 selon la tradition familiale (PC-Bio). Le « grand ami » est très probablement le P. Alfred d'Adhémar de Cransac, supérieur des jésuites de Toulouse en 1912 (\textit{Le Télégramme}, 23 nov. 1912, p.~3), mort le 16 septembre 1914 (\textit{L'Express du Midi}, 18 sept. 1914, p.~2), dont la photographie fut épinglée sur la robe mortuaire de Joséphine (PC-Bio) ; son inhumation au caveau des jésuites reste une hypothèse.
