date: Samedi 30 septembre 1916
mois: Septembre 1916
lieux: Toulouse (Haute-Garonne)
titre: Montaudran, clocher et cinq cloches ; serments au cimetière de Terre-Cabade
transcription: |
  \sl{30 Samedi.} \hfill \sl{Septb /16}
  \ind Tout le jour, temps \inc{pluvx}. Fine ondée qui dure peu
  Matin – venu voir Mme de Labarthe, au 12.. \inc{A}
  pour cette amie, attachemt profond.. –
  Monté à Ste Marie vers 11^{H} \fr{1}{2} –
  Dans petit salon, qq minutes de tête à-tête \inc{delicieux}
  av Margte.. –
  Après-midi, promenade à pied au village
  de Montaudran. Reposé ds l'eglise. Monté à la
  tribune puis au clocher, par escalier très
  raide & très étroit, presque 1 echelle. Là-haut,
  très b. vue panoramique de la plaine du Lauraguais
  Paysage nullement banal. Verdure & lignes d'arbres
  clochers de village, à l'horizon – — Ciel tout
  couvert de nuages noirs –
  Fait vibrer chacune des 5 cloches d'airain – –
  Sons différents & très mélodieux – p. \inc{Remq} &
  \ind Continué promenade j-au Cimetière de
  Terre-Cabade. Admiré tombeau imité d'un
  temple grec
  \inc{Venus} devant caveau des P.P. Jésuites & celui du
  P. Marie-Antoine. Margte & moi, echangé serments
  profondt émus au souvenir de notre gd ami & de Josèphe
  Retour du cimetière à pied par rues & chemins de
  traverse – Pluie cessé bientot & soleil couché
  \ind horizon nuageux
  \filet
  Tram : 20c. – Sweets & cakes : 3f – Bière & \add{limonade} 0.80c.
