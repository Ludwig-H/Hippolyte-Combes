historique: |
  Sur M\textsuperscript{me} de Labarthe, voir f.~28~v\textsuperscript{o}. Montaudran est voisin de la Côte-Pavée (voir f.~27~v\textsuperscript{o}). À Terre-Cabade, le tombeau d'Aristide Bergès, « en forme de temple antique », est peut-être celui que décrit Hippolyte Combes (Wikipédia). Le capucin Marie-Antoine, mort en février 1907, y fut porté (\textit{L'Express du Midi}, 11~févr. 1907, p.~2). « Josèphe » est Joséphine Combes, sœur aînée d'Hippolyte, morte en octobre 1914 selon la tradition familiale. Le « grand ami » est très probablement le P. Alfred d'Adhémar de Cransac, supérieur des jésuites de Toulouse en 1912 (\textit{Le Télégramme}, 23~nov. 1912, p.~3), mort le 16~septembre 1914 (\textit{L'Express du Midi}, 18~sept. 1914, p.~2), dont la photographie fut épinglée sur la robe mortuaire de Joséphine (\mbox{PC-Bio}) ; son inhumation au caveau des jésuites reste une hypothèse.
