critique: Encre violette ; seul le nom du lieutenant Godard est ajouté au crayon, dans le blanc de droite. Les numéros des deux adresses de Toutencourt, et le nom de la seconde rue, sont restés en blanc. La journée se poursuit au verso.
historique: |
  Combes se croit appelé à quitter le \textit{Purchase Board} d'Hérissart pour le dépôt de Toutencourt (voir f.~82 r\textsuperscript{o}). La « demande instante » du major Levy, sans doute Walter Henry Levy, major temporaire de l'A.S.C. (voir f.~46 r\textsuperscript{o}), montre que le chef britannique peut obtenir de la Mission, qui affecte les interprètes, le maintien de celui qu'il apprécie. Le \textit{purchase board} d'armée achète paille et fourrage, fait battre et botteler et constitue des réserves (Puckle 1917, p.~28) ; celui de la Fifth Army siégeait en décembre à Raincheval (voir f.~56 r\textsuperscript{o}). La rue de Raincheval est à Toutencourt, QG de la Fifth Army (LLT). Le lieutenant Godard, peut-être de la Mission, n'est pas identifié. Le billet 220, libéré par l'interprète Valet (voir f.~82 r\textsuperscript{o}), est à Hérissart, où un \textit{tommy} porte les sacs (voir f.~83 v\textsuperscript{o}). Combes y servira « mon l\textsuperscript{t} », sans doute l'Australien Wentworth (voir f.~84 r\textsuperscript{o}--v\textsuperscript{o}).
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
- Supplement to the London Gazette, n° 29585, 17 mai 1916, p. 4941.
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copie Wayback du 23 juil. 2024).
