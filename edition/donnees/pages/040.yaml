historique: |
  Oppy, « hameau de 6 maisons », est un écart de Beaudricourt (Pas-de-Calais), à 7,4 km de Monts-en-Ternois (OSM), et non l'Oppy proche d'Arras, alors dans les lignes allemandes. Les bancs « devant le four » sont ceux de la ferme de Monts-en-Ternois (voir f. 20 r\textsuperscript{o}). Ce jour-là, la 54th Brigade gagne la zone de Sus-Saint-Léger par Beaudricourt ; le 7th Bedfordshire cantonne à Ivergny, et la division passe à minuit à la Reserve Army (JMO 7/Bedf, 10 sept. 1916). Le service « chz le maire » concerne le cantonnement : le maire est l'intermédiaire légal pour le logement des troupes et les réquisitions (loi du 3 juillet 1877), et le cantonnement est « une des principales besognes de l'interprète » (Fernand-Laurent 1917, p. 225-234).
