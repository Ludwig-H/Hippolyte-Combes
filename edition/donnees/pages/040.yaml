critique: Encre noire virée au brun, homogène sur toute la page. Le récit de la nuit reprend celui de la veille (f. 20 r\textsuperscript{o}), dont la page est la suite immédiate.
historique: |
  Oppy, « hameau de 6 maisons », est un écart de la commune de Beaudricourt (Pas-de-Calais), à 7,4 km à vol d'oiseau de Monts-en-Ternois (OSM) ; rien à voir avec l'Oppy des environs d'Arras, alors dans les lignes allemandes. Les deux bancs « devant le four » sont ceux de la ferme-monastère de Monts-en-Ternois (voir f. 20 r\textsuperscript{o}). Ce 10 septembre, la 54th Brigade gagne la zone de Sus-Saint-Léger par Houvin-Houvigneul, Estrée-Wamin et Beaudricourt, le 7th Bedfordshire cantonnant à Ivergny ; les voitures de vivres marchent avec la « 152nd Company Divisional Train », et à minuit la division passe à la Reserve Army (JMO 7/Bedf, 10 sept. 1916). Le service « chz le maire » est celui du cantonnement : le maire est l'intermédiaire légal du logement des troupes et des réquisitions (loi du 3 juillet 1877), et le cantonnement est « une des principales besognes de l'interprète » (Fernand-Laurent 1917, p. 225-234). Hippolyte Combes, invité au mess par le capitaine West la veille, y prend tous ses repas avant d'en devenir membre le 12 (voir f. 21 v\textsuperscript{o}).
