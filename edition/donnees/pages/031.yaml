date: Mercredi 30 août 1916
mois: Août 1916
lieux: Marquay (Pas-de-Calais)
titre: Pluie et rafales à Marquay ; fourrage vert dans les champs détrempés
transcription: |
  \sl{30 Me} \hfill Aout \sl{1916}
  \ind Tout le jour, pluie . et rafales
  Vent tourmente grands arbres du
  voisinage (boqueteau de l'autre coté de
  la route et prairies derrière fermes et
  fait bruit effrayant
  \ind Matin & après-midi, en dépit ondées
  très fortes, dû aller, champs detrempés
  pour faire prendre fourrage vert
  \blanc{12}
apparat: []
historique: |
  Le journal du 7\textsuperscript{th} Bedfordshire, cantonné à La Thieuloye, à 3,6~km de Marquay, note le même jour : « \textit{Wet day. Company training lectures etc. in billets} » (JMO~7/Bedf, 30~août 1916). L'instruction se fait à couvert, mais la corvée de fourrage vert continue. Ce fourrage complète la ration de foin des chevaux du train (voir f.~9~v\textsuperscript{o}) : Hippolyte Combes doit faire enlever dans les champs l'herbe achetée aux cultivateurs, comme les deux jours précédents (voir f.~15~v\textsuperscript{o}). Ce même 30~août, la Turquie déclare à son tour la guerre à la Roumanie (Falls 1933, p.~139).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- 'Falls, Cyril (comp.), Military Operations, Macedonia, vol. I : From the Outbreak of War to the Spring of 1917, Londres, HMSO, 1933, p. 139.'
