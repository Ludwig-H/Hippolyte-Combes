date: Mercredi 30 août 1916
mois: Août 1916
lieux: Marquay (Pas-de-Calais)
titre: Pluie et rafales sur Marquay ; fourrage vert à faire prendre malgré les ondées
transcription: |
  \sl{30 Me} \hfill Aout \sl{1916}
  \ind Tout le jour, pluie . et rafales
  Vent tourmente grands arbres du
  voisinage (boqueteau de l'autre coté de
  la route et prairies derrière fermes et
  fait bruit effrayant
  \ind Matin & après-midi, en dépit ondées
  très fortes, dû aller, champs detrempés
  pour faire prendre fourrage vert
  \blanc{12}
apparat:
- ligne: 1
  lemme: Me
  type: abreviation
  note: mercredi
critique: Seule la moitié supérieure de la page est écrite, à l'encre noire ; le bas, resté blanc, laisse voir par transparence l'écriture du verso.
historique: |
  Le temps noté par Combes est celui qu'enregistre le même jour le journal du 7th Bedfordshire, cantonné à La Thieuloye, à 3,6 km de Marquay : « \textit{Wet day. Company training lectures etc. in billets} » (JMO 7/Bedf, 30 août 1916) ; la veille, un « \textit{heavy thunderstorm} » avait trempé les hommes au retour de l'exercice (ibid., 29 août ; voir f. 15 v\textsuperscript{o}). Si l'instruction à l'attaque de la 54th Brigade se replie dans les cantonnements, la corvée de fourrage vert, qui complète la ration de foin des chevaux du train (voir f. 9 v\textsuperscript{o}), ne s'interrompt pas : Combes doit encore, matin et après-midi, faire enlever dans les champs détrempés l'herbe achetée aux cultivateurs, comme les deux jours précédents avec Curtis (voir f. 15 v\textsuperscript{o}). Le « boqueteau » et les prairies « derrière fermes » sont ceux du hameau de Marquay, sur le plateau à 6 km à l'est de Saint-Pol (voir f. 14 v\textsuperscript{o}). Ce même 30 août, la Turquie déclare à son tour la guerre à la Roumanie, entrée en guerre le 27 (Falls 1933, p. 139).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- 'Falls, Cyril (comp.), Military Operations, Macedonia, vol. I : From the Outbreak of War to the Spring of 1917, London, HMSO, 1933, p. 139.'
