transcription: |
  \sl{Mardi 26} \hfill \sl{Sept^{r} 16}
  \ind Vers 6^{H} m. , encore nuit , dû descendre gare
  du Bourget .
  Suivi voies , \inc{j'que} bureau militre . Là
  obtenu l'autorison de sortir et accompagné
  par un planton jà la porte \trait
  du Bourget , sortie de la rue de Flandre ,
  pris tramway qui m'a conduit j-à gare
  du Nord . De là , par metro , arrivé
  à station Tuileries . \add{changé au Chatelet} Traversé jardin et
  Venu gare d'Orsay \trait
  Me suis rendu à la place (hotel .
  des Invalides , pr demande autorison de
