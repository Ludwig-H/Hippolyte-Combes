critique: Encre violette. Les dernières lignes, courtes et décalées, dressent la liste des étapes de la promenade sur la rive gauche ; la journée se poursuit sur la page suivante (f.~27 r\textsuperscript{o}), qui en donne aussi les comptes.
historique: |
  Le Bourget est l'une des deux grandes gares régulatrices des armées françaises de la Somme (voir f.~26 r\textsuperscript{o}) : d'où le contrôle et le planton. Du Nord aux Tuileries, il emprunte les lignes~4 et~1 du métro. La gare d'Orsay, bâtie en 1898--1900 sur l'emplacement de l'ancienne Cour des comptes, prolonge depuis Austerlitz la ligne d'Orléans (Baedeker 1913, p.~305) ; on y prend les trains de Toulouse par Limoges, Brive, Cahors et Montauban (Baedeker 1912, R.~39). La « place (hotel . des Invalides » est sans doute le commandement de la place de Paris, le gouvernement militaire siégeant à l'hôtel des Invalides (Baedeker 1913, p.~263--264) ; l'autorisation de voyager « à mes frais en express » le dispensait vraisemblablement des trains réservés aux permissionnaires, mais le règlement n'a pas été retrouvé. Le Bon Marché occupe les n\textsuperscript{os}~131--137 de la rue du Bac (Baedeker 1913, p.~51) ; « Colin » est probablement la librairie Armand Colin, 103, boulevard Saint-Michel, au bord du Luxembourg (Zyromski 1921, titre).
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, Baedeker, 1913, p. 51, 263-264, 305.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, route 39.
- Zyromski, E., Maurice de Guérin, Paris, Librairie Armand Colin, 103, boulevard Saint-Michel, 1921, page de titre.
