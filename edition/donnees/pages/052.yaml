critique: La journée se poursuit sur la page suivante (f.~27 r\textsuperscript{o}), qui en donne aussi les comptes.
historique: |
  Le Bourget est l'une des deux gares régulatrices des armées françaises de la Somme (voir f.~26 r\textsuperscript{o}) : d'où le contrôle et le planton. Du Nord aux Tuileries, Hippolyte Combes prend les lignes~4 et~1 du métro. D'Orsay partent les trains de Toulouse par Limoges, Brive, Cahors et Montauban (Baedeker 1912, R.~39). La « place » est sans doute le commandement de la place de Paris, le gouvernement militaire siégeant aux Invalides (Baedeker 1913, p.~263--264). L'autorisation de voyager « à mes frais en express » le dispensait vraisemblablement des trains de permissionnaires ; le règlement n'a pas été retrouvé. « Colin » est probablement la librairie Armand Colin, 103, boulevard Saint-Michel (Zyromski 1921, titre).
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, Baedeker, 1913, p. 263-264.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, route 39.
- Zyromski, E., Maurice de Guérin, Paris, Librairie Armand Colin, 103, boulevard Saint-Michel, 1921, page de titre.
