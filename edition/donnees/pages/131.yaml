critique: |
  Les comptes de la journée sont portés en tête du f.~66~r\textsuperscript{o}.
historique: |
  « Mme Faure » est sans doute Marguerite Barnerot (1874--1954), veuve de Camille Faure (1861--1910), polytechnicien et ingénieur des Ponts et Chaussées originaire de Marvejols ; elle est apparentée aux Calmels par les Fabry de Millau (P. Combes, étude familiale, p.~107). Marcel est sans doute Marcel Faure (1906--1999), futur compagnon de la Libération, élevé à Neuilly par sa mère après la mort de son père (Ordre de la Libération). Henri, né en 1895, serait mort à la guerre le 11~juin 1918 (tradition familiale) ; André (1898--1963) prépare l'École de son père. Imbert est l'opticien à qui Hippolyte Combes avait confié son pince-nez (voir ff.~58~r\textsuperscript{o} et 61~r\textsuperscript{o}). Les « Magasins de l'Hotel de Ville » sont le Bazar de l'Hôtel de Ville, rue de Rivoli (Baedeker 1913, p.~51--52).
sources:
- Combes, Pierre, étude familiale (arbres Calmels et Fabry–Barnerot–Faure), dactylographie, 2020–2021, p. 106–107.
- Ordre de la Libération, notice « Marcel Faure », https://www.ordredelaliberation.fr/fr/compagnons/marcel-faure.
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, Baedeker, 1913, p. 51–52.
