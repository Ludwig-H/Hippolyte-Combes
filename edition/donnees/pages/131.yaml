critique: Encre violette. Le récit s'arrête au premier tiers inférieur de la page, dont le reste est laissé blanc ; les comptes de la journée sont reportés en tête du feuillet suivant (f. 66 r\textsuperscript{o}).
historique: |
  « Mme Faure » est sans doute Marguerite Barnerot (1874–1954), veuve de Camille Faure (1861–1910), polytechnicien et ingénieur des Ponts et Chaussées originaire de Marvejols, apparentée aux Calmels par les Fabry de Millau (P. Combes, étude familiale, p. 107). Marcel, dix ans, est très probablement Marcel Faure (1906–1999), élevé à Neuilly où sa mère s'était installée, futur administrateur colonial, combattant de Bir-Hakeim et compagnon de la Libération (Ordre de la Libération). L'aspirant Henri, né en 1895, aurait été « tué à la guerre » le 11 juin 1918 (tradition familiale, non vérifiée) ; André (1898–1963) prépare l'École de son père. Imbert est l'opticien auquel Hippolyte Combes avait confié son pince-nez (voir f. 58 r\textsuperscript{o} et 61 r\textsuperscript{o}). Les « Magasins de l'Hôtel de Ville » sont le Bazar de l'Hôtel-de-Ville, 54-62, rue de Rivoli (Baedeker 1913, p. 51–52) ; les achats sont détaillés f. 66 r\textsuperscript{o}. La gare d'Orsay, terminus de la Compagnie du Paris-Orléans, avait été inaugurée en 1900 (musée d'Orsay).
sources:
- Combes, Pierre, étude familiale (arbres Calmels et Fabry–Barnerot–Faure), dactylographie, 2020–2021, p. 106–107.
- Ordre de la Libération, notice « Marcel Faure », https://www.ordredelaliberation.fr/fr/compagnons/marcel-faure.
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, Baedeker, 1913, p. 51–52.
- Musée d'Orsay, « Histoire du musée », https://www.musee-orsay.fr/fr/articles/histoire-du-musee-60.
