historique: |
  Le champ de luzerne est sans doute celui de la veille (voir f.~36~v\textsuperscript{o}). La luzerne, fourrage vert, peut remplacer une partie du foin (FSPB 1914, chap.~6, §~20 ; \textit{Veterinary Services} 1925, p.~566). Le \textit{limber} est peut-être le \textit{limbered G.S. wagon}, voiture articulée plus légère que le grand chariot à quatre chevaux (FSPB 1914, chap.~5, §~5). Le « Cap. Pant » (voir f.~34~v\textsuperscript{o}) n'est pas identifié : la forme « Panton » n'est qu'une conjecture, et aucun officier de ce nom ne figure dans l'A.S.C. (TNA, WO~339 et WO~374). Prouville abrite alors le 12\textsuperscript{th} Middlesex, de la 54\textsuperscript{th} Brigade (Wyrall, p.~319). Le 14, la 54\textsuperscript{th} Brigade reçoit l'ordre de gagner Beauval (JMO~7/Bedf, 14~oct. 1916 ; Nichols 1922, p.~131).
