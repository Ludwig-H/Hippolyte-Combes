critique: Les deux journées sont séparées par un blanc et un filet. La date « Ven. 13. » est soulignée d'un trait fin, d'une encre plus pâle que le texte.
historique: |
  Le champ de luzerne coupée est sans doute celui des jours précédents, derrière le bois de Ribeaucourt (voir f.~36 v\textsuperscript{o}) : la luzerne compte parmi les fourrages verts (FSPB 1914, chap.~6, §~20), distribuables à la place d'une partie du foin (\textit{Veterinary Services} 1925, p.~566). Le \textit{limber} est peut-être le \textit{limbered G.S. wagon}, voiture articulée plus légère que le grand chariot du service général à quatre chevaux (FSPB 1914, chap.~5, §~5). Le « Cap. Pant » (voir f.~34 v\textsuperscript{o}) n'est pas identifié : la forme « Panton » parfois conjecturée restitue une abréviation, et aucun officier de ce nom ne figure dans l'A.S.C. (TNA, WO~339 et WO~374). Prouville abrite alors le 12th Middlesex, de la 54th Brigade (Wyrall, p.~319). Le départ annoncé au dîner suit de près les ordres : le 14 octobre, la division ouvre un QG avancé à Albert, la 53rd Brigade se prépare contre Regina Trench, qu'elle enlèvera le 21, et la 54th reçoit l'ordre de gagner Beauval (JMO 7/Bedf, 14 oct. 1916 ; Nichols 1922, p.~131).
sources:
- Field Service Pocket Book, 1914, London, HMSO, 1914, chap. 5, § 5, et chap. 6, « Forage », § 20.
- Blenkinsop, L. J., et Rainey, J. W. (éd.), Veterinary Services (History of the Great War based on Official Documents), London, HMSO, 1925, p. 566.
- The National Archives (Kew), Discovery, dossiers d'officiers, séries WO 339 et WO 374 (requête « Panton » et « Army Service Corps »).
- Wyrall, E., The Die-Hards in the Great War. A History of the Duke of Cambridge's Own (Middlesex Regiment), vol. I, London, Harrison & Sons, [1926], p. 319.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 131.
