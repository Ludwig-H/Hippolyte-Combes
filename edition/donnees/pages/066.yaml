critique: Le récit de la journée se poursuit f.~34 r\textsuperscript{o}.
historique: |
  Relevée après Thiepval, la 18th Division se repose « in the Candas area » (Nichols 1922, p.~126). Le 7th Bedfordshire, de la 54th Brigade, a été transporté le 2 octobre en train d'Acheux à Candas (OH 1916-I, p.~273) et cantonne à Vacquerie et Gorges (JMO 7/Bedf, oct. 1916). Canaples, sur la ligne Amiens--Doullens, sert de \textit{railhead} : les camions de la \textit{supply column} y chargent les vivres et les remettent au \textit{refilling point} aux voitures du train (FSPB 1914, « Definitions »). Le carnet montre que la 152nd Coy sert la 54th Brigade, et non la 55th comme le dit Nichols (p.~108--110), ce que montraient déjà les ordres du 7th Bedfordshire des 9--10 septembre (JMO 7/Bedf, sept. 1916). L'église de Doullens est sans doute Notre-Dame, l'ancienne église Saint-Pierre étant désaffectée (Mérimée PA00116138).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 108-110, 126.
