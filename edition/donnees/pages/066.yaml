historique: |
  Relevée après Thiepval, la 18\textsuperscript{th} Division se repose « \textit{in the Candas area} » (Nichols 1922, p.~126). Le 7\textsuperscript{th} Bedfordshire, de la 54\textsuperscript{th} Brigade, est venu le 2~octobre en train d'Acheux à Candas (OH~\mbox{1916-I}, p.~273) et cantonne à Vacquerie et Gorges (JMO~7/Bedf, oct. 1916). Canaples, sur la ligne Amiens--Doullens, sert de \textit{railhead} : les camions de la \textit{supply column} y chargent les vivres pour les remettre aux voitures du train au \textit{refilling point} (FSPB 1914, « Definitions »). Le carnet montre, comme les ordres du 7\textsuperscript{th} Bedfordshire des 9--10~septembre (JMO~7/Bedf, sept. 1916), que la 152\textsuperscript{nd} Coy sert la 54\textsuperscript{th} Brigade, et non la 55\textsuperscript{th} comme le dit Nichols (p.~108--110). L'église de Doullens est sans doute Notre-Dame, l'ancienne église Saint-Pierre étant désaffectée (Mérimée PA00116138).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 108-110, 126.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273.
- 'Bedfordshire Archives Service, X550/8/1/1609 et 1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre et octobre 1916 (transcription en ligne).'
- Field Service Pocket Book, 1914, London, HMSO, 1914, « Definitions ».
- Ministère de la Culture, base Mérimée, notice PA00116138 (ancienne église Saint-Pierre, Doullens), consultée via monumentum.fr.
