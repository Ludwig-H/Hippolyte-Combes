critique: Page d'une seule venue à l'encre violette ; le récit de la journée se poursuit f.~34 r\textsuperscript{o}.
historique: |
  La 18th Division, relevée après Thiepval (26--27 septembre) et les combats de la Schwaben Redoubt, est partie se reposer « in the Candas area » (Nichols 1922, p.~126). Le 7th Bedfordshire, de la 54th Brigade, a été transporté le 2 octobre en wagons de la gare d'Acheux à Candas, par la voie normale ouverte en 1916 (OH 1916-I, p.~273), et cantonne à Vacquerie et Gorges (JMO 7/Bedf, oct. 1916). Canaples, station voisine de Candas sur la ligne Amiens--Doullens, sert de \textit{railhead} : les camions de la \textit{supply column} y chargent les vivres, transbordés au \textit{refilling point} dans les voitures du train (FSPB 1914, « Definitions »). Le trajet d'Hippolyte Combes confirme que la 152nd Coy servait la 54th Brigade, contre le tableau de Nichols (p.~108--110), qui la place auprès de la 55th ; les ordres du 7th Bedfordshire des 9--10 septembre la mettaient déjà dans la colonne de la brigade (JMO 7/Bedf, sept. 1916). L'église de Doullens est sans doute l'église paroissiale Notre-Dame, l'ancienne église Saint-Pierre étant désaffectée depuis sa vente comme bien national (Mérimée PA00116138).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 108-110, 126.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273.
- 'Bedfordshire Archives Service, X550/8/1/1609 et 1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre et octobre 1916 (transcription en ligne).'
- Field Service Pocket Book, 1914, London, HMSO, 1914, « Definitions ».
- Ministère de la Culture, base Mérimée, notice PA00116138 (ancienne église Saint-Pierre, Doullens), consultée via monumentum.fr.
