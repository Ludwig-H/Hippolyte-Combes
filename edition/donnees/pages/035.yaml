historique: |
  Roëllecourt, sur la route de Saint-Pol à Arras, à 2,9~km de Marquay (OSM), abrite sans doute le bureau de la Mission française où Hippolyte Combes touche sa solde. Les 78~F 75 font une quinzaine à 5,25~F, comme les 84~F du 18~août en faisaient seize (voir f.~11~r\textsuperscript{o}). L'ordre d'opérations n\textsuperscript{o}~28 du 4~septembre transférait la division à la Reserve Army dans la nuit du 6 au 7 ; il porte « \textit{Cancelled 5 a.m. 5.9.16} » (JMO~7/Bedf, 4--5~sept. 1916). Les « 8~jours » d'attente seront quatre : l'ordre n\textsuperscript{o}~29 du 8 fixe le transfert à la nuit du 10 au 11, et la compagnie quitte Marquay le 9 (ibid. ; voir f.~20~r\textsuperscript{o}). Le « wagon » est sans doute une voiture de la compagnie.
