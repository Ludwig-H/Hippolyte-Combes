critique: Encre noire virée au brun ; « Causé de tt 1 peu » et la fin de la ligne « Mis à jour correspce moult en arriéré » sont d'une encre plus pâle et brunâtre, sans doute après une reprise de plume.
historique: |
  La « très violente canonnade », déjà notée le 9 (voir f. 60 v\textsuperscript{o}), prépare deux petites opérations du XIII Corps au nord de l'Ancre. Le 10 janvier à 2 h, après dix-huit heures de bombardement, le 2/Border (7th Division) attaque le \textit{Triangle}, à 1 000 yards à l'est de Beaumont-Hamel. Le 11, la 91st Brigade prend \textit{Munich Trench} ; le bombardement lourd avait été « maintenu pendant les deux jours précédents » sur tout le front de la Fifth Army (OH 1917-I, p. 67–69). Manqué la veille à Hédauville (« out riding »), Morris est sans doute un officier de la 150th Company du train de la 18th Division ; son identité n'est pas établie. Belle-Église avait été tête de ligne pour les vivres en juillet 1916 (OH 1916-I, p. 274). Imbert est l'opticien du boulevard Saint-Michel, à qui Combes avait expédié une boîte recommandée fin décembre (f. 58 r\textsuperscript{o}). Le 27 janvier, il passera chez lui et le trouvera mobilisé (f. 65 v\textsuperscript{o}). Au Café Continental de Beauquesne, Combes avait déjeuné le 5 avec Walsh et Morris (f. 60 r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 67–69.
- 'Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Sir Douglas Haig''s Command to the 1st July : Battle of the Somme, Londres, Macmillan, 1932, p. 274.'
