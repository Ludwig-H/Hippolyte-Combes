date: Mercredi 10 – vendredi 12 janvier 1917
mois: Janvier 1917
lieux: Acheux-en-Amiénois, Saint-Léger-lès-Authie, Authie, Beauquesne et Rubempré (Somme)
titre: Canonnade sur Miraumont ; retrouvé Morris ; neige, grésil et courses en auto
transcription: |
  \sl{10 Me} \hfill — \sl{Janvier 1917} —
  \ind Toute la nuit & matinée
  très violente canonnade s/ ligne de Miraumt
  \ind Course en auto à St-Léger & Belle-Eglise,
  où rencontré, enfin mon vieux Morris.
  \ind Après-midi, liberté entière. Visite de
  Morris à mon billet. Causé de tt 1 peu
  \ind Temps froid, neige & pluie glaciale
  [ — Mandat-poste à Imbert, opticien
  Paris, pour réparatn pince-nez et pour,
  1 neuf (d'après ordonnance : 19 fr.
  \blanc{1}
  \sl{11 J} – Neige & pluie fine, presque tt le jour
  \ind a whole day, off —
  Mis à jour correspce \inc{moult} en arriéré.
  Soir, diné \del{seul}. Rentré tot chambre
  \blanc{1}
  \sl{12 Ve}. Durant nuit, neigé encore
  \ind – Toute matinée, averses et giboulées,
  grésil & neige Surpris par tempête au
  retour d'Authie & sur la route d'Arqueves,
  plateaux de Louvencourt
  \ind Courses en auto : Louvencourt, St-Léger
  Raincheval, Beauquesne, où dejeuné au
  Café Continental
  \ind Après-midi, à Septenville & Rubempré
  Rentré vers 6^{h}, nuit noire.
