historique: |
  À Renescure (4~km de Lynde, OSM), les deux châteaux sont le château de Zuthove, entouré de douves (Mérimée PA00107784), et le château dit de Philippe de Comines (Mérimée PA00107783), où le chroniqueur naquit avant 1447 (Feller-Vest 2015). L'église à double nef est Notre-Dame-de-l'Assomption (Palissy). À Hazebrouck, l'église de la grand-place est Saint-Éloi, du XV\textsuperscript{e}~s. (Mérimée PA00107549). La solde de 84~F est le premier des dix-neuf versements de la Mission militaire française notés dans le carnet ; peut-être seize jours à 5~F~25 (calcul de l'éditeur). La carte d'état-major est une feuille au 1/80~000 (\textit{French-English Dictionary} 1919, s.v. « Carte »).
