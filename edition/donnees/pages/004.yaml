critique: Encre violette homogène. Les comptes, séparés du récit par un filet, se répartissent sous deux rubriques, « A Renescure » (soulignée) et « A Hazebrouck » ; la colonne de droite est écrite sur des lignes légèrement décalées par rapport à celle de gauche, et la mention de la solde est logée au-dessus de la rubrique « A Hazebrouck ».
historique: |
  À Renescure, à 4 km de Lynde (OSM), les « 2 superbes chateaux » sont le château de Zuthove, entouré de douves (façades, toitures, douves et dépendances inscrites MH le 4 nov. 1946 ; Mérimée PA00107784), et le château dit de Philippe de Comines (parties subsistantes et courtine inscrites en 1981 ; Mérimée PA00107783) : le chroniqueur y naquit avant 1447 (Feller-Vest 2015). L'église à double nef est Notre-Dame-de-l'Assomption, dont la nef sud abrite le maître-autel et une chaire de 1616 venue de Poperinge (Palissy). À Hazebrouck, nœud ferroviaire où des \textit{Casualty Clearing Stations} sont installées d'octobre 1914 à septembre 1917 (CWGC), l'église de la grand-place est Saint-Éloi, du XV\textsuperscript{e}~s. (Mérimée PA00107549). La « Solde : 84 fr. » ouvre la série des dix-neuf versements de solde et d'indemnité reçus de la Mission militaire française que note le carnet ; elle correspond peut-être à seize jours à 5~F~25 (calcul de l'éditeur). La « Cte d Etat-major » est une feuille de la carte de France au 1/80~000 (\textit{French-English Dictionary} 1919, s.v. « Carte »).
