critique: Suite de la journée du 6 octobre commencée f.~33 v\textsuperscript{o}. Page d'une seule venue à l'encre violette ; un filet sépare le récit des comptes, au bas de la page.
historique: |
  Barlette, hameau au sud de Ribeaucourt (Somme), ne comptait que 29 habitants en 1906 ; il relevait autrefois de Franqueville et n'a été rattaché à Ribeaucourt qu'au XX\textsuperscript{e} siècle (Inventaire Hauts-de-France, IA80009826). La 152nd Coy y cantonne pendant le repos de la division (voir f.~33 v\textsuperscript{o}), à quelques kilomètres des bataillons de la 54th Brigade, logés à Vacquerie, Gorges et Prouville (JMO 7/Bedf, oct. 1916). À Bernaville, le bureau de la Mission française auprès de la 18th Division (à Acheux en septembre : voir f.~23 v\textsuperscript{o}) vise le titre du permissionnaire ; il retiendra le 3 novembre 30~F pour six jours d'absence (f.~46 r\textsuperscript{o}). La « canteen » de Doullens est sans doute une succursale des \textit{Expeditionary Force Canteens} (Fortescue 1928, p.~52--53), qui vendaient « à un prix sensiblement voisin du prix coûtant » (Fernand-Laurent 1917, p.~82--83). Le \textit{Quartermaster-Serjeant} Tait, sous-officier chargé des vivres et du matériel de la compagnie (FSPB 1914), n'est pas identifié.
sources:
- Inventaire général du patrimoine culturel, Région Hauts-de-France, dossier IA80009826, « Hameau de Barlette » (Ribeaucourt), 2010, inventaire.hautsdefrance.fr.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
