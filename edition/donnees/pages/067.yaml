critique: Suite de la journée du 6 octobre commencée f.~33 v\textsuperscript{o}.
historique: |
  Barlette, hameau au sud de Ribeaucourt, ne comptait que 29 habitants en 1906 ; il dépendait autrefois de Franqueville (Inventaire Hauts-de-France, IA80009826). Les bataillons de la 54th Brigade sont à quelques kilomètres (voir f.~33 v\textsuperscript{o}). Le bureau de la Mission française auprès de la 18th Division, à Acheux en septembre (voir f.~23 v\textsuperscript{o}), est passé à Bernaville. La « canteen » de Doullens est sans doute une des \textit{Expeditionary Force Canteens} (Fortescue 1928, p.~52--53), qui vendaient « à un prix sensiblement voisin du prix coûtant » (Fernand-Laurent 1917, p.~82--83). Le \textit{Quartermaster-Serjeant} Tait (vivres et matériel de la compagnie : FSPB 1914) n'est pas identifié.
