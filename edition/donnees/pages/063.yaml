historique: |
  Le train de nuit arrive à la gare d'Orsay, terminus de la Compagnie d'Orléans. Pour gagner la gare du Nord, Hippolyte Combes refait en sens inverse le trajet de l'aller (voir f.~26 v\textsuperscript{o}) : ligne 1 des Tuileries au Châtelet, puis ligne 4, ouverte en 1908 (RATP). L'église Saint-Vincent-de-Paul (X\textsuperscript{e} arr.) a été bâtie par Lepère et Hittorff de 1824 à 1844 ; ses deux étages de colonnes encadrent la frise peinte de la nef, œuvre d'Hippolyte Flandrin (1850--1854) (Mérimée PA00086489 ; Baedeker 1913). Les Grands Magasins du Louvre font face au palais, rue de Rivoli (Baedeker 1913, p.~51) ; ils offraient à leurs clients un salon de correspondance.
sources:
- Baedeker, K., Paris and Environs, with Routes from London to Paris, 18e éd., Leipzig, K. Baedeker, 1913, p. 28-30, 51-52.
