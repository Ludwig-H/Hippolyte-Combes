historique: |
  Le billet n°~59 (voir f.~45~v\textsuperscript{o}) est repris par le \textit{Town Major} (Fernand-Laurent 1917, p.~227). Le propriétaire du n°~1 est sans doute le tailleur Carluvant [?] nommé le 22 novembre (f.~51~r\textsuperscript{o}), son hôte jusqu'au 7 février 1917. La « V\textsuperscript{th} Army » est l'armée de Gough, nommée \textit{Fifth Army} depuis le 30 octobre (OH 1916-II, p.~461, n.~1). Acheux est le QG du V Corps jusqu'au 29 novembre (LLT), et le « bureau mission du corps » est sans doute celui de ce corps. Le capitaine Huguet, revu en janvier (f.~61~v\textsuperscript{o}), n'est pas identifié. Ce bureau, passé au XIII Corps, prendra l'interprète en charge le 1\textsuperscript{er} décembre (f.~52~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 227.
- Baker, C., The Long, Long Trail, « The British V Corps in France and Flanders » et « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copies Wayback 2020 et 2024).
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461, n. 1.
