historique: |
  Le billet n°~59, attribué le 2 novembre (voir f.~45~v\textsuperscript{o}), est repris par le \textit{Town Major}, chargé du cantonnement de toutes les unités de la localité (Fernand-Laurent 1917, p.~227). Le propriétaire du n°~1, route de Léalvillers, est sans doute le tailleur Carluvant [?] nommé le 22 novembre (f.~51~r\textsuperscript{o}), chez qui Combes loge jusqu'au 7 février 1917. L'« interprete de la V\textsuperscript{th} Army troops » use du nom de \textit{Fifth Army}, porté par l'armée de Gough depuis le 30 octobre (OH 1916-II, p.~461, n.~1 ; LLT). Acheux est le QG du V Corps du 2 octobre au 29 novembre 1916 (LLT) : le « bureau mission du corps » est donc vraisemblablement celui de ce corps, où Combes revoit le capitaine Huguet le 13 janvier 1917 (f.~61~v\textsuperscript{o}). Cet officier, non identifié, est sans lien connu avec le général Victor Huguet. L'entretien porte sans doute sur la situation de Combes, qui ne sera « pris en charge » par le bureau d'Acheux, passé au XIII Corps, que le 1\textsuperscript{er} décembre (f.~52~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 227.
- Baker, C., The Long, Long Trail, « The British V Corps in France and Flanders » et « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copies Wayback 2020 et 2024).
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461, n. 1.
