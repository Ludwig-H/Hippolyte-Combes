critique: Encre noire. Les comptes du 6 sont isolés entre deux blancs ; les journées des 7 et 8 ne sont pas tenues, l'entrée du 9 les résumant.
historique: |
  Les routes encombrées du 6 annoncent les relèves des 7-21 janvier, où l'artillerie relevante monte avant l'infanterie (OH 1917-I, p.~66) : au nord de l'Ancre, le V Corps reprend le secteur du XIII, la 32nd Division relevant la 3rd le 9 et la 19th la 31st le 11 ; au sud, les 2nd et 18th Divisions remplacent les 51st et 61st (OH 1917-I, p.~69-70). La 18th, au repos près d'Abbeville, revient le 16 (Nichols 1922, p.~139) : la 150th Company de son train, campée le 9 à Hédauville, la devance sans doute. Morris, vu le 5 (f.~60~r\textsuperscript{o}), y sert vraisemblablement ; Combes l'appelle « mon vieux Morris » le lendemain (f.~61~r\textsuperscript{o}). La « très violente canonnade » est le bombardement de dix-huit heures qui précède l'attaque de « The Triangle », à l'est de Beaumont-Hamel, lancée le 10 à 2~h au clair de lune, puis le feu entretenu sur tout le front de la Fifth Army jusqu'à la prise de Munich Trench le 11 (OH 1917-I, p.~67-69). L'avis de réception est celui de la boîte recommandée envoyée le 28 décembre à l'opticien Imbert (f.~58~r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66-70.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 139.
