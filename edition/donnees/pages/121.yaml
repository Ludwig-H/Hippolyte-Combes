historique: |
  Les routes encombrées annoncent les relèves du 7 au 21~janvier : le V Corps reprend le secteur du XIII, et les 2\textsuperscript{nd} et 18\textsuperscript{th} Divisions remplacent les 51\textsuperscript{st} et 61\textsuperscript{st} (OH~\mbox{1917-I}, p.~66, 69--70). La 18\textsuperscript{th}, au repos près d'Abbeville, revient le 16 (Nichols 1922, p.~139) ; la 150\textsuperscript{th} Company de son train la précède sans doute. Morris, vu le 5 (f.~60~r\textsuperscript{o}), y sert vraisemblablement ; Hippolyte Combes l'appelle « mon vieux Morris » le lendemain (f.~61~r\textsuperscript{o}). La « très violente canonnade » prépare l'attaque de « The Triangle », à l'est de Beaumont-Hamel, le 10 à 2~h (OH~\mbox{1917-I}, p.~67--69). L'avis de réception est celui de la boîte envoyée le 28~décembre à l'opticien Imbert (f.~58~r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, Londres, Macmillan, 1940, p. 66-70.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et Londres, Blackwood, 1922, p. 139.
