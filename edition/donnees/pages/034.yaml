critique: Le récit du dimanche 3 se poursuit au f.~18~r\textsuperscript{o}.
historique: |
  Marquay est à 6,1~km à vol d'oiseau de Saint-Pol-sur-Ternoise (OSM) : Hippolyte Combes refait à pied le trajet du 31~août (voir f.~16~v\textsuperscript{o}). Ce 3~septembre, le 7\textsuperscript{th} Bedfordshire, cantonné à La Thieuloye, entend la messe en plein champ derrière l'église ; son journal note « \textit{Fine Day but wet evening} » (JMO~7/Bedf, 3~sept. 1916), ce qui s'accorde avec le retour « avant pluie ». Le blanchissage de quatre pièces pour 1~F met la pièce à 25~c environ. À Paris, laver une chemise d'homme coûtait déjà 40~c en 1914 (March 1925, p.~211--212) : c'est un tarif de village, comme le « Washing : 1\textsuperscript{f} » du 26~juillet (voir f.~1~v\textsuperscript{o}), la comparaison restant approximative.
