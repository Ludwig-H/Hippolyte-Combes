critique: Encre noire virée au brun. Le compte du samedi, ouvert par un grand crochet, est séparé de la journée du dimanche par un filet ; le récit du dimanche 3 se poursuit au recto suivant (f. 18 r\textsuperscript{o}) par les champs d'avoine et les achats faits à Saint-Pol.
historique: |
  Marquay est à 6,1 km à vol d'oiseau de Saint-Pol-sur-Ternoise (OSM) : la marche du dimanche longe le plateau qui domine la vallée de la Ternoise et refait le trajet du 31 août (voir f. 16 v\textsuperscript{o}, pour la ville et son église des Carmes). Ce 3 septembre, le 7th Bedfordshire, cantonné à La Thieuloye, assiste à la messe militaire « \textit{in field just behind La Thieuloye Church} » ; son journal note « \textit{Fine Day but wet evening} » (JMO 7/Bedf, 3 sept. 1916), ce qui concorde avec le retour de Combes « avant pluie ». Le blanchissage de quatre pièces pour 1 f met la pièce à 25 c environ. À Paris, le blanchissage d'une chemise d'homme coûtait déjà 0,40 F en 1914 selon la Commission centrale d'études relatives au coût de la vie (March 1925, p. 211-212) : c'est un tarif de blanchisseuse de village, comme le « Washing : 1\textsuperscript{f} » du 26 juillet (voir f. 1 v\textsuperscript{o}), la comparaison restant approximative.
