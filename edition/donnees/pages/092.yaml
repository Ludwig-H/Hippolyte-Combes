critique: Encre violette régulière ; l'addition « au » à la l.~3 est inscrite en module réduit dans l'interligne inférieur.
historique: |
  Bertrancourt, à 3~km au nord-est d'Acheux, abrite des troupes du V Corps qui prépare l'attaque au nord de l'Ancre. La 2nd Division, l'une des quatre chargées du principal effort du 13 novembre (OH 1916-II, p.~477), y a sans doute le QG situé « à gauche route de Bus » (Bus-lès-Artois). Les tentes, huttes, voitures et caissons sont ceux de cette concentration, maintenue par une attaque « constamment remise mais jamais annulée » (OH 1916-II, p.~480). La « question de pétrole », qui le mène encore à Belle-Église le 6 (f.~47~v\textsuperscript{o}), porte peut-être sur l'essence, livrée en bidons de 2 ou 4 gallons (\textit{Statistics} 1922, p.~846). Ni Jamet ni Cordonnier, attaché à la \textit{Royal Field Artillery}, ne sont identifiés. La rencontre de Béthune renvoie au service de Combes en mai–juillet 1915 auprès du \textit{1\textsuperscript{st} Battalion, Irish Guards} (alors rattaché à la \textit{4\textsuperscript{th} Guards Brigade} de cette même \textit{2\textsuperscript{nd} Division}), désormais formellement attesté de sa main par les chapitres~\textsc{v} et~\textsc{vi} du plan de ses \textit{Feuillets de Route} (\textit{« Avec les 1\textsuperscript{st} Irish. Guards »}, \textit{« La veille d'une g\textsuperscript{de} attaque (Mai 1915) »}, en annexe ; Kipling 1923, p.~63–95). Le lieutenant de la Mission vu à Albert est sans doute l'officier interprète de la 18th Division (voir f.~45~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 477 et 480.
- War Office, Statistics of the Military Effort of the British Empire during the Great War, 1914-1920, London, HMSO, 1922, p. 846.
- Kipling, R., The Irish Guards in the Great War, vol. 1, London, Macmillan, 1923.
