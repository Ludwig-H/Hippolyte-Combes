historique: |
  Rubempré est à l'ouest d'Hérissart ; Montigny-sur-l'Hallue et Fréchencourt sont dans la vallée de l'Hallue (voir f.~78~v\textsuperscript{o}). Montigny avait logé en juillet 1916 le QG du III~Corps (OH~\mbox{1916-II}, p.~147). Les champs « vers Pont Noyelles » sont ceux de la bataille de l'Hallue, livrée le 23~décembre 1870 par l'armée du Nord de Faidherbe aux troupes de Manteuffel (Wikipedia, « Battle of Hallue »). Le « fils du maire » n'est pas nommé. Combes avait été reçu le 3~janvier par Paul Dubois, maire de Montigny (voir f.~59~v\textsuperscript{o}) ; le « Dr. Dubois » du 2~mars est sans doute un parent, peut-être ce fils. Pour la route de Contay, voir f.~79~v\textsuperscript{o}.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 147.
- Wikipedia, « Battle of Hallue », consulté le 18 oct. 2026.
