critique: Encre violette. Un blanc d'environ une ligne et demie sépare les deux journées ; les taches brunes de la moitié inférieure de la page sont des maculatures, sans écriture.
historique: |
  La tournée du 1\textsuperscript{er} mars reprend les villages où le service d'achats cherche paille et fourrage depuis février : Rubempré, à l'ouest d'Hérissart, puis Montigny-sur-l'Hallue et Fréchencourt, dans la vallée de l'Hallue (voir f.~78~v\textsuperscript{o}). Fréchencourt était, au 1\textsuperscript{er} juillet 1916, tête de ligne pour les vivres sur la voie normale Daours--Contay posée au printemps dans la vallée (OH 1916-I, p.~273--274) ; Montigny avait logé en juillet le QG du III Corps (OH 1916-II, p.~147). Les champs « vers Pont Noyelles » sont ceux de la bataille de l'Hallue, livrée le 23 décembre 1870 par l'armée du Nord de Faidherbe aux troupes de Manteuffel. Le « fils du maire » n'est pas nommé ; Combes avait été reçu le 3 janvier par Paul Dubois, maire de Montigny (voir f.~59~v\textsuperscript{o}), et le « Dr. Dubois » du 2 mars est sans doute un parent, peut-être ce fils même. Au bout de la route de Contay, les 49th et 9th \textit{Casualty Clearing Stations} restent installées jusqu'en mars 1917 (CWGC).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273-274.
