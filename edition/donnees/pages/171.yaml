date: Mardi 20 – jeudi 22 mars 1917
mois: Mars 1917
lieux: Hérissart, Puchevillers, Contay, Warloy-Baillon, Senlis-le-Sec et Albert (Somme)
titre: Départ de l'officier de la Naval Division ; neige ; troupes en marche ; Senlis et Albert
transcription: |
  \sl{20 Mardi} \hfill \sl{Mars 1917} —
  \ind Lieut 63^{rd} div, couché \inc{ds} lit
  une chambre. Parti avec son unité 8^{h} matin
  \ind Toute la nuit, vent soufflé en rafales extt violentes.
  Durant matinée, neige. tombé à gros flocons —
  \ind Liberté entière, journée
  \blanc{2}
  21 \sl{Merc.}
  \ind Nuit très froide Tout le jour, ciel couvert,
  pluie fine & neige, par intermittence —
  \ind Matin, course en auto à Puchevillers et
  Arqueves, Belle Eglise Farm, M. Houtteman —
  \ind Après-midi, par Contay & Warloy,
  venus à Senlis. Routes encombrées par troupes
  moving. Admiré cavrie indienne & anglaise
  (Death or Glory Boys, 17^{th} Lancers)
  22 \sl{Jeudi}
  \ind matin & soir, tourmentes de neige.
  matin, courses en auto à Puchevillers, Mirvaux
  Pierregot & Molliens-au-Bois.
  \ind Après-midi, Senlis & Albert très longuement
  regardé à Albert maisons atteintes par obus \trait
  \ind Retour par gd route d'Amiens : à droite &
  à g., champs couverts de neige
