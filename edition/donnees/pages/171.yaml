critique: '« Liberté entière, journée » et la fin de la parenthèse « Glory Boys, 17th Lancers) » sont d''une encre plus pâle, grise ou brunâtre : ajout postérieur ou plume presque sèche. Un blanc d''environ deux lignes sépare le 20 du 21 mars.'
historique: |
  La ferme de Belle-Église, près d'Arquèves, est tenue par une famille belge (voir f.~54~r\textsuperscript{o}) ; Mirvaux et Pierregot sont des villages d'achat déjà parcourus le 16 (voir f.~84~v\textsuperscript{o}). Les « troupes moving » sont celles des relèves qui suivent le repli allemand : le 20, la 18th Division, dernière du II Corps en ligne, est relevée par la 7th (OH 1917-I, p.~145) ; le 22, le 7th Bedfordshire défile à Senlis devant le commandant du II Corps puis gagne Contay, Bertangles et Saleux, où il embarque le 26 pour la Flandre (JMO 7/Bedf ; LLT). Hippolyte Combes croise sans doute son ancienne division. Le 17th Lancers, surnommé « \textit{Death or Glory Boys} » d'après la tête de mort et la devise « \textit{or Glory} » de son insigne (Fraser et Gibbons 1925), est le régiment britannique de la Sialkot Brigade de la 4th Cavalry Division, avec deux régiments indiens (LLT) ; un de ses escadrons attendra la percée à Bullecourt le 11 avril (OH 1917-I, p.~368). Albert reste la tête de ligne du II Corps et reçoit le 28 mars le QG de la Fifth Army (OH 1917-I, p.~145 ; LLT).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, London, Macmillan, 1940, p. 145, 368.
- Bedfordshire Archives Service, X550/8/1, War Diary, 7th (Service) Battalion, Bedfordshire Regiment, 20-27 mars 1917.
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, London, Routledge, 1925, « Nicknames of Regiments ».
