historique: |
  La ferme de Belle-Église, près d'Arquèves, est tenue par une famille belge (voir f.~54~r\textsuperscript{o}) ; Mirvaux et Pierregot ont été parcourus le 16 (voir f.~84~v\textsuperscript{o}). Les troupes en marche sont celles des relèves qui suivent le repli allemand : le 20, la 18\textsuperscript{th} Division est relevée par la 7\textsuperscript{th} (OH~\mbox{1917-I}, p.~145) ; le 22, son 7\textsuperscript{th} Bedfordshire défile à Senlis puis gagne Contay (JMO~7/Bedf ; LLT). Hippolyte Combes croise sans doute son ancienne division. Le 17\textsuperscript{th} Lancers doit son surnom à la tête de mort et à la devise « \textit{or Glory} » de son insigne (Fraser et Gibbons 1925) ; c'est le régiment britannique de la Sialkot Brigade, 4\textsuperscript{th} Cavalry Division, avec deux régiments indiens (LLT). Albert, tête de ligne du II~Corps, reçoit le 28~mars le QG de la Fifth Army (OH~\mbox{1917-I}, p.~145 ; LLT).
