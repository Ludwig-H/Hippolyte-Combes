titre: Mme de Labarthe ; Purpan et Blagnac avec Marguerite ; sautoir chez Pfister
transcription: |
  29 \sl{Ve.} \hfill \sl{Sept /16}
  \ind Tout le jour, ciel nuageux.
  Fin après-midi, courte averse \trait
  Matin, venu voir Mme de Labarthe : gde amie
  affectueuse & attachée.
  Marché déjeuné Restaurant du Chge – et retrouvé M^{te}
  Affection réciproque de + en + profonde. Intimité
  tjs + g^{de} –
  Après-\inc{repas}, course en tram. Esquirol – Purpan
  Longue halte aux Ruines. Assis côte à côte
  sur reste de pilier, doux epanchts & baisers intimes
  av ma Femme –
  Continué à pied j-à Blagnac. Reposé ds
  la chapelle du monastère.
  allé ensuite prairie au bord de la Garonne
  Assis sur l'herbe haute, en face petite grève
  Venus à pied j-aux Ponts Jumeaux, d'où pris
  tram j-à \inc{rue} Alsace. —
  \blanc{3}
  — Trams : 20c, 40c, 60c, 40, 40c —
  Chz Pfister, sautoir en or — ; 300^{f} net 295^{f}
  Remboursé à mes \inc{nièces} (oeufs, beurre etc.) : 2 \inc{75}
  Fruits : 25c + 55c. — Fleurs : 25c
