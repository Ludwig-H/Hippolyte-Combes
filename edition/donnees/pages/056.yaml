historique: |
  Mme de Labarthe est sans doute la mère du « docteur de L-- » de la lettre du 16 juin 1916 (« dont la mère m'est tant dévouée »). Les « Ruines » de Purpan sont l'amphithéâtre gallo-romain de Purpan-Ancely (Office de tourisme de Toulouse). La « chapelle du monastère » de Blagnac est sans doute celle des cisterciennes installées en 1852 au domaine de Maniban (Daraux 2002). Pfister était horloger-bijoutier au 24, place des Carmes, à l'angle de la rue de Languedoc (\textit{L'Express du Midi}, 25 déc. 1911, p.~3) ; le sautoir, sans doute pour Marguerite, coûte près de quatre quinzaines de solde (voir f.~23 v\textsuperscript{o}). La lecture « nièces » est douteuse : la tradition familiale ne connaît pas de nièce à Hippolyte Combes (PC-Bio).
