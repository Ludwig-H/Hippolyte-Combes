critique: Encre violette ; un second pâté touche « Assis » et « côte » (l.~10). Le récit s'arrête après « Alsace », trois lignes environ au-dessus des comptes.
historique: |
  Mme de Labarthe est très probablement la mère de l'ami que nomme la lettre du 16 juin 1916, « le docteur de L--, dont la mère m'est tant dévouée ». Combes appelle déjà Marguerite « ma Femme ». La ligne Esquirol -- Purpan -- Blagnac (7,4~km ; Wikipédia) dessert les « Ruines », l'amphithéâtre gallo-romain de Purpan-Ancely, du I\textsuperscript{er} siècle, seul édifice antique de Toulouse conservé dans son ensemble (Office de tourisme de Toulouse). La « chapelle du monastère » de Blagnac est vraisemblablement celle des cisterciennes établies en 1852 sur le domaine de Maniban (Daraux 2002). Des Ponts-Jumeaux, la ligne de l'allée Lafayette (Baedeker 1912, p.~298) ramène vers la rue d'Alsace-Lorraine. Pfister était horloger-bijoutier au 24, place des Carmes, angle de la rue de Languedoc (\textit{L'Express du Midi}, 25 déc. 1911, p.~3) ; le sautoir, sans doute pour Marguerite, coûte près de quatre quinzaines de solde (voir f.~23 v\textsuperscript{o}). La lecture « nièces » reste douteuse : la tradition familiale ne connaît pas de nièce à Combes (PC-Bio).
