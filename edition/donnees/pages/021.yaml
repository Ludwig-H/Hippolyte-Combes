critique: Encre noire virée au brun. Les deux journées sont séparées par un filet pleine largeur ; sous le compte du 18, que borde un grand crochet, un blanc d'environ deux lignes. Les 16 et 17 août n'ont pas d'entrée, la journée du 18 revenant sur la veille (« Hier après-midi ») ; la chevauchée du 19 se poursuit au f. 11 v\textsuperscript{o}.
historique: |
  Le \textit{refilling point} est sans doute toujours celui du bord de la Lys, près de l'écluse de Bac-Saint-Maur (voir f. 7 r\textsuperscript{o}) ; le champ de trèfle est celui où l'on coupe le fourrage vert, que le règlement range avec le ray-grass, la luzerne et le sainfoin parmi les « green foods » (FSPB 1914, chap. 6, § 20). Les 84 F, même somme que le 27 juillet (voir f. 2 r\textsuperscript{o}), suivent le rythme des paies de quinzaine, plus tard fixées aux 3 et 18 du mois ; c'est la seule fois que le carnet nomme les deux éléments, solde et indemnité, dont aucun texte retrouvé ne donne le détail. Le 18, la 54th Brigade est au camp de La Motte, en forêt de Nieppe, pour s'exercer au combat sous bois, et son journal note de fortes pluies nocturnes (JMO 7/Bedf, 18-21 août 1916). La « zone exposée » du 19 est la bande de 2 à 4 km entre la Lys et le front de Bois-Grenier : Fleurbaix, que Combes traverse (f. 11 v\textsuperscript{o}), est « about a mile behind the line » (Ellis [1920], p. 75). Le lieutenant Curtis n'est pas identifié.
sources:
- Field Service Pocket Book, 1914, Londres, HMSO, 1914, chap. 6, « Forage », § 20.
- Bedfordshire Archives Service, X550/8/1/1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (JMO 7/Bedf).
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 75.
