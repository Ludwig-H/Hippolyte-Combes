critique: Les 16 et 17 août n'ont pas d'entrée ; le 18 revient sur la veille (« Hier après-midi »). La chevauchée du 19 se poursuit au f. 11 v\textsuperscript{o}.
historique: |
  Le \textit{refilling point} est sans doute toujours celui du bord de la Lys, près de l'écluse de Bac-Saint-Maur (voir f. 7 r\textsuperscript{o}). Les 84 F, même somme que le 27 juillet (voir f. 2 r\textsuperscript{o}), suivent le rythme des paies de quinzaine ; c'est la seule fois que le carnet distingue solde et indemnité de fonctions. Le 18, la 54th Brigade s'exerce au combat sous bois au camp de La Motte, en forêt de Nieppe ; son journal note de fortes pluies la nuit (JMO 7/Bedf, 18-21 août 1916). La « zone exposée » du 19 est la bande de 2 à 4 km qui sépare la Lys du front de Bois-Grenier ; Hippolyte Combes y traverse Fleurbaix (voir f. 11 v\textsuperscript{o}). Le lieutenant Curtis n'est pas identifié.
sources:
- Bedfordshire Archives Service, X550/8/1/1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (JMO 7/Bedf).
