historique: |
  Le bourg de Steenwerck est à 3~km à vol d'oiseau de La Croix-du-Bac, ce qui s'accorde avec les 55 minutes de marche ; sa gare est sur la ligne de Lille à Hazebrouck. Bac-Saint-Maur, hameau de Sailly-sur-la-Lys sur l'autre rive de la Lys, est la tête de ligne des vivres du secteur (voir f.~7~r\textsuperscript{o}). Maurin, sans doute interprète lui aussi et provençal (voir f.~7~r\textsuperscript{o}), n'est pas identifié. Le sac part pour Nogent-le-Rotrou (voir f.~12~r\textsuperscript{o}) ; le factage est le port à domicile depuis la gare d'arrivée. Vers le 22~août, la 34\textsuperscript{th} Division reprend le front de la 18\textsuperscript{th} Division jusqu'au saillant de Bridoux inclus, et son état-major retrouve « their old quarters in Croix du Bac » (Shakespear 1921, p.~74--75). C'est la relève qui précède le départ du 25~août.
sources:
- Shakespear, J., The Thirty-Fourth Division, 1915–1919. The Story of its Career from Ripon to the Rhine, Londres, H. F. & G. Witherby, 1921, p. 74-75.
