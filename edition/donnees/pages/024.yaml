critique: 'Le trait oblique qui sépare le récit des comptes, la haste du crochet, le montant « 3 f 80 » et les mots « à l''arrivée » sont d''une encre brune plus pâle : complément sans doute porté après coup, quand le prix fut connu. Le bas de la page est resté blanc.'
historique: |
  Le bourg de Steenwerck est à 3 km à vol d'oiseau de La Croix-du-Bac, ce qui s'accorde avec les « 55 m. » de marche ; sa gare est sur la ligne de Lille à Hazebrouck par Armentières et Bailleul. Bac-Saint-Maur, hameau de Sailly-sur-la-Lys, sur l'autre rive de la Lys, est la tête de ligne des vivres du secteur (voir f. 9 r\textsuperscript{o}). Maurin, collègue interprète sans doute provençal (voir f. 7 r\textsuperscript{o}), n'est pas identifié. Le sac part pour Nogent-le-Rotrou (voir f. 12 r\textsuperscript{o}) ; le factage est le port à domicile depuis la gare d'arrivée. Le bain à 1 f 25 est plus cher que ceux qu'Hippolyte Combes paiera à Toulouse en permission, 90 c aux Thermes du Languedoc et 1 f place Belfort (voir f. 27 v\textsuperscript{o} et 69 r\textsuperscript{o}). Vers le 22 août, la 34th Division, revenue de la Somme, reprend le front de la 18th Division, de « Chard's farm » sur la route de Lille jusqu'au saillant de Bridoux inclus, et son état-major retrouve « their old quarters in Croix du Bac » (Shakespear 1921, pp. 74-75) : c'est la relève qui précède le départ du 25 août.
sources:
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 119-120.
- Shakespear, J., The Thirty-Fourth Division, 1915–1919. The Story of its Career from Ripon to the Rhine, Londres, H. F. & G. Witherby, 1921, p. 74-75.
