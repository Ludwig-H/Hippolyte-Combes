historique: |
  Sur le lieutenant Curtis, voir f. 11 r\textsuperscript{o}. M. Barbry, payé le 21 pour cuisine, blanchissage et œufs, est son logeur ; un lien avec la blanchisserie Barbry (f. 11 v\textsuperscript{o}) est possible. Les adjudants sont des interprètes de la Mission. Schumacher, encore « sergent » dans la lettre du 25 février 1916 (en annexe, p.~\pageref{annexe:doc1}), est sans doute le « Schuhmacher, the interpreter at Brigade H.Q. » de la 53rd Brigade (Banks \& Chell 1924, p. 310). Lupin (ou Lépin, voir f. 43 r\textsuperscript{o}) n'est pas identifié. Le départ a lieu le 25 août, en train de Bailleul vers Saint-Pol (JMO 7/Bedf, 23-25 août 1916). Nogent est Nogent-le-Rotrou (Eure-et-Loir), où il enseignait au collège (carte-lettre du 25 nov. 1918 ; envoi détaillé au f. 12 v\textsuperscript{o}).
sources:
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 310.
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (ordre d''opérations n° 26 du 23 août ; 24-25 août).'
- Hippolyte Combes, H., lettre « Au front, le 25 février 1916 » à un capitaine (copie autographe, archives familiales ; en annexe).
- Hippolyte Combes, H., carte-lettre à Marguerite, 25 novembre 1918 (archives familiales).
