date: Jeudi 28 septembre 1916
mois: Septembre 1916
lieux: Toulouse (Haute-Garonne)
titre: Rangement de l'appartement ; bouquet pour Marguerite ; Pouvourville et Pech-David
transcription: |
  \sl{28 Jeudi.} \hfill \sl{Sept^{bre} /16}
  Me suis attardé ds mon appart^{t} Pris un
  plaisir extrême à regarder & ranger mes
  affaires, et à laisser peu à peu
  s'éveiller \inc{&} moi des souvenirs du passé.
  Monté à S^{te} Marie, vers 11^{H} \fr{1}{2}. Apporté à M^{te}
  un très joli bouquet fleurs delicates \trait
  Mêmes impressions au sujet de ma fiancée :
  tjs simple, affectueuse, charmante \trait
  \ind Après déjeun, promenade en cie Mme \inc{C^{h}} et
  M. C^{zt}. Descendu à pied cote vers S^{t} Joseph et
  arrivé j-à la barrière St-Agne \inc{Là} pris tram
  j-à St-Agne Remonté par route ombragée
  j-au village de Pouvourville eglise –
  Puis, sur la hauteur, d'où vue superbe
  suivi crête de Pech David – j-au carref
  Recollets et Caserne \trait
  \ind Allé prendre trams à la barrière St-Agne \trait
  Exc^{te} après-midi.
  Vers 9^{H} 30 s, redescendu à pied Cote Pavée
  \filet
  Trams : 20c, 40, 40, 40 c. —
  Fruits (raisins & grenades) : 1 f — Varia : 10 c.
  Bouquet (place Esquirol : 3^{f} —
