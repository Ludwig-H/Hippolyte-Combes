historique: |
  Sur l'appartement de la rue de Languedoc, sur Sainte-Marie et sur Émile Crouzet (« M. C\textsuperscript{zt} »), voir f.~27 v\textsuperscript{o}. Le carnet nomme ici pour la première fois Marguerite Calmels sa « fiancée », plus d'un an avant le mariage du 25 octobre 1917. « Mme C\textsuperscript{h} » n'est pas identifiée (Mme Calmels mère ?). Le tram Esquirol -- Saint-Agne -- Castanet (Baedeker 1912, p.~298 ; Wikipédia) mène au pied des coteaux de la rive droite : de Pouvourville, village de la commune de Toulouse, on gagne la crête de Pech-David, à quelque 130~m au-dessus de la Garonne (Toulouse Métropole). La « Caserne » est sans doute la caserne Niel, boulevard des Récollets. Le bouquet (3~f) vaut plus d'une demi-journée de solde (voir f.~23 v\textsuperscript{o}).
sources:
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, p. 298.
- Wikipédia, art. « Ancien tramway de Toulouse » (d'après C. Lacombe et P. Malterre, Omnibus, tramways et autobus de Toulouse, éd. du Cabri, 1983), consulté en oct. 2026.
- Toulouse Métropole, « Balades nature » (carte, 2022) et notices de quartier « Rangueil, Sauzelong, Jules-Julien, Pech-David, Pouvourville » et « Maison des associations » (metropole.toulouse.fr), consultées le 18 oct. 2026.
