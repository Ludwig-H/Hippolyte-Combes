critique: Encre violette ; « Beauquesne » (l.~7) est ajouté après coup d'une encre plus pâle, grise-brune, d'un module plus petit. Un blanc d'une ligne précède chacune des journées du 9 et du 10.
historique: |
  Le temps noté est celui de l'histoire officielle : le 8, « belle journée après plusieurs jours humides et neigeux » ; le 9, matinée « ponctuée de grains de pluie, de grésil et de neige » ; le 10, temps « au moins aussi défavorable » (OH 1917-I, p.~168, 201, 245). Ce lundi 9 s'ouvre la bataille d'Arras, reportée du 8 au 9 (OH 1917-I, p.~182), et le Canadian Corps prend la crête de Vimy du 9 au 12 avril ; le carnet n'en dit rien. Le notaire de Toutencourt, déjà vu le 3 (voir f.~87 v\textsuperscript{o}), est M\textsuperscript{e} Jules Bienaimé, titulaire de l'étude de 1906 à 1933 (AD Somme, Espel 2018, p.~3--4). Beauquesne, où Combes avait négocié en décembre la location d'une batteuse (f.~57 v\textsuperscript{o}), avait abrité au château de Valvion le QG avancé de Haig pendant la bataille de la Somme (OH 1916-I, p.~304). Belle-Église et Fréchencourt étaient, le 1\textsuperscript{er} juillet 1916, des têtes de ligne pour les vivres (OH 1916-I, p.~274). La famille Denis, d'Hérissart, qu'il fréquentera tout le mois (f.~90 r\textsuperscript{o}), n'est pas identifiée.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 168, 182, 201, 245.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 274, 304.
- Archives départementales de la Somme, Fonds de l'Office notarial de Toutencourt, aujourd'hui Acheux-en-Amiénois (1729-1904). Répertoire méthodique détaillé, par A. Espel, Amiens, 2018, p. 3-4.
