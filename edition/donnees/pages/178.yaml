historique: |
  Le temps noté concorde avec l'histoire officielle : belle journée le 8, grains de pluie, de grésil et de neige le 9, temps aussi mauvais le 10 (OH~\mbox{1917-I}, p.~168, 201, 245). Ce lundi 9 s'ouvre la bataille d'Arras, reportée du 8 (OH~\mbox{1917-I}, p.~182) ; le carnet n'en dit rien. Le notaire de Toutencourt, déjà vu le 3 (voir f.~87~v\textsuperscript{o}), est M\textsuperscript{e} Jules Bienaimé, en charge de l'étude de 1906 à 1933 (AD Somme, Espel 2018, p.~3--4). À Beauquesne, le château de Valvion avait abrité le QG avancé de Haig pendant la bataille de la Somme (OH~\mbox{1916-I}, p.~304). La famille Denis, d'Hérissart, souvent revue en avril, n'est pas identifiée.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 168, 182, 201, 245.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 304.
- Archives départementales de la Somme, Fonds de l'Office notarial de Toutencourt, aujourd'hui Acheux-en-Amiénois (1729-1904). Répertoire méthodique détaillé, par A. Espel, Amiens, 2018, p. 3-4.
