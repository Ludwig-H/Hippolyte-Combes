historique: |
  Belle-Église est le hameau d'Arquèves où Hippolyte Combes a suivi le battage de la paille (voir f.~54~r\textsuperscript{o}). Raincheval abritait en décembre l'Army Purchase Board (f.~56~r\textsuperscript{o}) ; Puchevillers garde jusqu'en mars 1917 les 3\textsuperscript{rd} et 44\textsuperscript{th} Casualty Clearing Stations (LLT, CCS). La canonnade du 18 au matin fait peut-être suite à l'opération menée la veille par la 11\textsuperscript{th} Division contre les postes à l'ouest de la route de Beaucourt à Puisieux (OH~\mbox{1917-I}, p.~69). La neige du 17 (f.~62~r\textsuperscript{o}) tient sous le gel venu vers le 14--16~janvier (OH~\mbox{1917-I}, p.~66 ; Barbé 1917, p.~181). Le bureau de la Mission suit le QG du V Corps, revenu à Acheux le 12 (f.~61~v\textsuperscript{o}). Les 84~F sont la solde d'une seconde quinzaine de seize jours à 5,25~F (voir f.~40~r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, Londres, Macmillan, 1940, p. 66, 69.
- The Long, Long Trail (C. Baker), « Locations of British Casualty Clearing Stations », copie Wayback du 13 janv. 2018.
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
