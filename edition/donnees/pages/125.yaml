critique: Encre noire, avec des reprises d'encre sur quelques mots (« Matin », « s'élève », « horizon », « Froid »). La mention de la solde, qui se rapporte au matin du 19, est inscrite à la fin de la journée ; le bas de la page est resté blanc.
historique: |
  Les villages de la course du 18 jalonnent la route d'Acheux à Puchevillers : Belle-Église, hameau d'Arquèves où Hippolyte Combes a suivi en décembre le battage de la paille (voir f.~54~r\textsuperscript{o}), avait été tête de ligne pour les vivres au 1\textsuperscript{er} juillet 1916 (OH 1916-I, p.~274) ; Raincheval abritait en décembre l'\textit{Army Purchase Board} (f.~56~r\textsuperscript{o}) ; Puchevillers garde jusqu'en mars 1917 les 3rd et 44th \textit{Casualty Clearing Stations} (LLT, CCS). La canonnade du 18 répond peut-être aux attaques que mène alors la 11th Division sur la pente à l'ouest de la route de Beaucourt à Puisieux, avant d'être relevée le 20 (OH 1917-I, p.~69). La neige tombée le 17 (f.~62~r\textsuperscript{o}) tient sous le gel installé vers le 14-16 janvier (OH 1917-I, p.~66 ; Barbé 1917, p.~181). Le « bureau Mission Ve corps » suit le QG du V Corps, revenu à Acheux le 12 janvier (LLT, V Corps ; voir f.~61~v\textsuperscript{o}) ; les 84~F sont la paie d'une seconde quinzaine de seize jours à 5,25~F (voir f.~40~r\textsuperscript{o}).
