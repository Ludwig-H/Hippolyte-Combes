lieux: Acheux-en-Amiénois, Belle-Église (Arquèves), Raincheval et Puchevillers (Somme)
titre: Neige et gel ; courses à Belle-Église, Raincheval et Puchevillers ; solde
transcription: |
  18 \sl{Jeudi} Matin (Canonnade — \hfill \sl{Janvier '17}
  \ind Temps froid. Neige,
  restée s/ toits & champs
  Matin, course en auto à Belle-église
  Raincheval & Puchevillers. Plaines blanches
  se \inc{confondent} à l'horizon rapproché avec ciel
  mat. Legère buée —
  \ind Après-midi, liberté entière –
  \blanc{2}
  \filet
  19 Vendredi
  \ind ciel mat & bas. Tempér^{re}, pas froide
  Neige pas encore fondue Toits, arbres et
  champs tout blancs
  \ind Après-midi, course à Puchevillers. par
  Raincheval. Neige comme cristallisée, durcie
  – ds les champs, Buée grise s'élève à l'horizon
  Froid pénetrant. Il gele dejà très fort
  \ind[2] — Matin, au bureau Mission
  Ve corps, solde : 84 fr —
  \blanc{4}
