historique: |
  Le dentiste « M. de Lersay » (f.~69~r\textsuperscript{o}) n'est pas identifié ; il fait payer 25~F « net » au lieu de 40 (?). « Marie » est sans doute la bonne des Crouzet, nommée « Maria » en octobre (f.~32~r\textsuperscript{o}). Permissionnaire, Hippolyte Combes paie un tarif réduit, comme en septembre 1916 (f.~27~r\textsuperscript{o} ; Lafon 1922, p.~37) : 1~F~80 pour quelque 120~km de Béziers à Millau, contre 18~F~50 au plein tarif de 3\textsuperscript{e} classe pour les 374~km de Clermont à Béziers (Baedeker 1914, p.~282). Le « supplément » pour la 2\textsuperscript{e} classe reste obscur, le petit train de Béziers n'ayant « pas de 2ème » (f.~69~v\textsuperscript{o}). Bédarieux avait un « Hôt. Terminus \& Buffet » (Baedeker 1914, p.~287) : les 7~F paient sans doute le dîner des deux voyageurs.
sources:
- Baedeker, K., Southern France including Corsica. Handbook for Travellers, 6e éd., Leipzig, K. Baedeker, 1914, R. 38, p. 282 et 287.
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
