critique: Page de comptes à l'encre violette, qui clôt la journée du 3 février commencée au f.~69~v\textsuperscript{o} ; chaque poste est ouvert par un court tiret, la ligne de la broche est serrée à droite entre les deux lignes voisines. Un filet sur toute la largeur ferme la liste ; le bas de la page est resté blanc.
historique: |
  Le dentiste « M. de Lersay », qui a soigné Combes la veille rue La Fayette (f.~69~r\textsuperscript{o}), n'est pas identifié (« de Lezay » ?) ; le motif de la réduction à 25 f « net » n'est pas dit. « Marie », gratifiée au départ de Sainte-Marie, est sans doute la bonne des Crouzet, nommée « Maria » en octobre (f.~32~r\textsuperscript{o}). Permissionnaire, Combes paie un tarif réduit, comme le quart de place de septembre 1916 (f.~27~r\textsuperscript{o} ; Lafon 1922, p.~37) : pour quelque 120~km, le billet « 1/2 pl. » de Béziers à Millau (1 f 80) reste très en deçà du plein tarif, que le Baedeker fixe à 18 f 50 en 3\textsuperscript{e} classe pour les 374~km de Clermont à Béziers (Baedeker 1914, p.~282). Le sens du « supplément » pour s'être « declassé en 2\textsuperscript{e} » demeure incertain, le « petit train » de Béziers n'ayant « pas de 2ème » (f.~69~v\textsuperscript{o}). Sur la ligne des Causses, Bédarieux avait un « Hôt. Terminus \& Buffet » (Baedeker 1914, p.~287) : les 7 f paient sans doute le dîner des deux voyageurs, partis de Béziers à 17~h~23.
sources:
- Baedeker, K., Southern France including Corsica. Handbook for Travellers, 6e éd., Leipzig, K. Baedeker, 1914, R. 38, p. 282 et 287.
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
