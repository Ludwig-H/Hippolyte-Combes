critique: Pâté d'encre sur la fin de « (suite) », en tête de page. Les derniers mots (« rempli de troupes anglaises ») sont d'une encre violette plus pâle, la plume s'épuisant ; la tournée du samedi se poursuit au verso.
historique: |
  Toutencourt, à 3~km à l'est d'Hérissart, abrite du 2 juillet 1916 au 28 mars 1917 le QG de la Fifth Army (LLT) et sa Mission française (voir f.~52 v\textsuperscript{o}). Payé jusque-là par la Mission de corps d'Acheux, encore le 7 février (voir f.~74 r\textsuperscript{o}), Hippolyte Combes relève désormais, sans doute comme le \textit{Purchase Board} auquel il est détaché, de l'armée ; le calendrier sera tenu : 18 février, 3 et 18 mars (voir f.~78 r\textsuperscript{o}, 81 r\textsuperscript{o}, 85 r\textsuperscript{o}). Le lieutenant Croughton, rencontré le 9 décembre au mess d'une compagnie du train de la 31st Division (voir f.~54 v\textsuperscript{o}), n'est pas identifié. Martinsart, à 4~km au nord d'Albert, était proche du front jusqu'en septembre 1916 (CWGC) ; en février 1917, la 54th Brigade loge dans les baraques du bois voisin (JMO 7/Bedf, févr. 1917). Hippolyte Combes avait pris le thé au château le 28 novembre (voir f.~52 r\textsuperscript{o}) ; le général « Volké » n'est pas identifié.
sources:
- The Long, Long Trail (C. Baker), « The British Fifth or Reserve Army 1916-1918 », copie Wayback du 23 juil. 2024.
- Commonwealth War Graves Commission, notice « Martinsart British Cemetery » (cwgc.org).
- 'Bedfordshire Archives Service, X550/8/1/1702 : War Diary, 7th (Service) Battalion, Bedfordshire Regiment, février 1917.'
