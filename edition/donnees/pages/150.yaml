historique: |
  Toutencourt, à 3~km d'Hérissart, abrite du 2~juillet 1916 au 28~mars 1917 le QG de la Fifth Army et sa Mission française (LLT ; voir f.~52~v\textsuperscript{o}). Payé jusque-là par la Mission du corps d'Acheux (voir f.~74~r\textsuperscript{o}), Hippolyte Combes l'est désormais par l'armée, aux dates prévues (voir ff.~78~r\textsuperscript{o}, 81~r\textsuperscript{o}). Le lieutenant Croughton, rencontré le 9~décembre (voir f.~54~v\textsuperscript{o}), n'est pas identifié. Martinsart, à 4~km au nord d'Albert, était près du front jusqu'en septembre 1916 (CWGC) ; en février 1917, la 54\textsuperscript{th} Brigade loge au bois voisin (JMO~7/Bedf, févr. 1917). Sur le château, voir f.~52~r\textsuperscript{o} ; le général « Votté » n'est pas identifié.
