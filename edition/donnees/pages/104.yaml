historique: |
  Martinsart, hameau de Mesnil-Martinsart à 4~km au nord d'Albert et 8~km au sud-est d'Acheux (geo.api.gouv.fr), était « proche de la ligne de front jusqu'en septembre 1916 » (CWGC). Les châtelains, au nom douteux, ne sont pas identifiés ; Hippolyte Combes reviendra au château le 10 février 1917 (voir f.~75~r\textsuperscript{o}). La tournée du 29 mène à 12--15~km au sud-ouest d'Acheux, sur le plateau entre Puchevillers et l'Hallue, zone des achats de paille et de fourrage ; Septenville est un hameau de Rubempré. Le même jour, le QG du V Corps quitte Acheux pour Doullens et celui du XIII Corps le remplace (LLT). Le thé du 30 à Hérissart est peut-être pris chez le lieutenant Walsh, qui y réside (voir f.~49~v\textsuperscript{o}, 51~v\textsuperscript{o}).
