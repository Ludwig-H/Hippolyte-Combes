critique: Encre noire virée au brun, homogène sur toute la page ; le mot « brouillard » du 29 novembre a été repassé d'une encre plus appuyée, la boucle du premier tracé restant visible.
historique: |
  Martinsart, hameau de la commune de Mesnil-Martinsart, à 4~km au nord d'Albert et à 8~km au sud-est d'Acheux, était « proche de la ligne de front jusqu'en septembre 1916 » (CWGC) ; au printemps de 1916, des voies de 60~cm en partaient vers le bois d'Aveluy (OH 1916-I, p.~276, n.), et les batteries lourdes y tirent encore vers l'Ancre au lendemain de la bataille du 13–18 novembre. Les châtelains, dont le nom reste douteux (« Vali » ou « Bertin »), ne sont pas identifiés ; Hippolyte Combes reviendra au château le 10 février 1917 (voir f.~75~r\textsuperscript{o}). La tournée du 29 conduit, à 12–15~km au sud-ouest d'Acheux, aux villages du plateau entre Puchevillers et l'Hallue, champ des achats de paille et de fourrage ; Septenville est un hameau de Rubempré. Le même 29 novembre, le QG du V Corps quitte Acheux pour Doullens et celui du XIII Corps le remplace (LLT ; voir f.~52~v\textsuperscript{o}). Le thé pris à Hérissart le 30 l'est peut-être chez le lieutenant Walsh, qui y réside (voir f.~49~v\textsuperscript{o}, 51~v\textsuperscript{o}).
