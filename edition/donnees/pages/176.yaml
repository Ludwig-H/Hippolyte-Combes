critique: Encre violette. Un filet tiré sur toute la largeur sépare les deux journées ; le bas de la page est resté blanc.
historique: |
  La « tourmente de neige » du 4 avril est celle dans laquelle, à quelque 45 km à l'est, la 59th Brigade attaque Metz-en-Couture ; l'histoire officielle note qu'une neige comme celle du début d'avril « est rare en Picardie » (OH 1917-I, p.~159, 161). Les achats de fourrage de ferme en ferme se poursuivent à Toutencourt, où Hippolyte Combes était déjà passé le 3 (voir f.~87 v\textsuperscript{o}). Le 5, Contay, Warloy-Baillon et Varennes « paraissent deserts, maintenant sans troupes » : le repli allemand sur la ligne Hindenburg a porté vers l'est les hôpitaux d'évacuation (\textit{casualty clearing stations}) installés à Contay depuis août 1916, et le cimetière militaire de Varennes, ouvert par la 39th CCS, sera abandonné en mai 1917 (CWGC). Ce même 5 avril, la prise de Ronssoy libère « le dernier village du département de la Somme » encore aux mains allemandes (OH 1917-I, p.~162--169). La coupe de cheveux, payée 30 c en février (f.~78 v\textsuperscript{o}), coûte ici 90 c. Le Jeudi saint précède la fête de Pâques, le 8 avril 1917.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 159, 161, 162-169.
- Commonwealth War Graves Commission, Contay British Cemetery et Varennes Military Cemetery, notices historiques (consultées le 17 oct. 2026).
