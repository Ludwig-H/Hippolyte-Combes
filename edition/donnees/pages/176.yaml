historique: |
  Le 4 avril, dans la même neige, la 59th Brigade attaque Metz-en-Couture, à quelque 45 km à l'est (OH 1917-I, p.~159, 161). Le 5, Contay, Warloy-Baillon et Varennes sont vides : avec le repli allemand sur la ligne Hindenburg, les hôpitaux d'évacuation (\textit{casualty clearing stations}) installés à Contay depuis août 1916 sont partis vers l'est, et le cimetière militaire de Varennes, ouvert par la 39th CCS, sera abandonné en mai 1917 (CWGC). Le même jour, la prise de Ronssoy libère « le dernier village du département de la Somme » encore aux mains allemandes (OH 1917-I, p.~162--169). La coupe de cheveux, payée 30 c en février (f.~78 v\textsuperscript{o}), coûte ici 90 c.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 159, 161, 162-169.
- Commonwealth War Graves Commission, Contay British Cemetery et Varennes Military Cemetery, notices historiques (consultées le 17 oct. 2026).
