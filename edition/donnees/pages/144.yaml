historique: |
  De Saint-Flour, Hippolyte Combes gagne directement Brioude (Haute-Loire) par la ligne de la Margeride, sans repasser par Neussargues : c'est l'itinéraire que le Baedeker indique de Clermont à Béziers (Baedeker 1914, p.~282). Concédée au P.L.M. en 1905, la ligne est ouverte en juin 1910 (Inventaire général Auvergne-Rhône-Alpes). À Brioude, sur la ligne de Nîmes à Clermont, il dépense 60~c au buffet (f.~72~v\textsuperscript{o}), puis prend l'express de Paris par la ligne du Bourbonnais : Clermont-Ferrand, Riom, Gannat, Saint-Germain-des-Fossés, Nevers (Baedeker 1914, p.~216--217), Gien et Montargis (Loiret). Le froid est très vif : −18,5~°C à Clermont-Ferrand le 30~janvier (Barbé 1917, p.~182 ; voir f.~71~r\textsuperscript{o}).
sources:
- Baedeker, K., Southern France including Corsica. Handbook for Travellers, 6e éd., Leipzig, K. Baedeker, 1914, p. 216-217, 282.
- Inventaire général du patrimoine culturel, Région Auvergne-Rhône-Alpes, dossier « Ligne Brioude – Saint-Flour » (patrimoine.auvergnerhonealpes.fr).
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
