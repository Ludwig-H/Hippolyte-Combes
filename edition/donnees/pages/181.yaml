historique: |
  Bresle, Laviéville et Hénencourt, à l'ouest d'Albert, avaient servi de cantonnements pendant la bataille de la Somme (23rd Division en septembre 1916 : OH 1916-II, p.~301) ; Laviéville porte encore l'aérodrome du No.~3 Squadron (Jones 1931, app.~XII). La date « fin juillet 1915 », bien lisible, surprend : concentrée le 30 juillet 1915 près de Flesselles, la 18th Division n'entre dans le secteur d'Albert qu'en août (Becke 1938, p.~84 ; Nichols 1922, p.~15-16), tandis qu'elle quitta la Somme le 21 juillet 1916 en embarquant à Edgehill, entre Buire et Dernancourt (JMO 7/Bedf, 21 juill. 1916) ; souvenir peut-être approximatif. Abbeville, d'où revient Gilbert (voir f.~89 v\textsuperscript{o}), est le siège du QG des \textit{Lines of Communication} (Maurois 1920, p.~ix). Albert abrite depuis le 28 mars le QG de la Fifth Army (LLT) ; les Australiens de Buire relèvent du I Anzac Corps (OH 1917-I, p.~74). Ribemont, où la division cantonnait à l'hiver 1915-1916 (Becke 1938, p.~83, n.~14), avait déjà réjoui Combes le 16 mars (f.~84 v\textsuperscript{o}) ; les Colart ne sont pas identifiés.
