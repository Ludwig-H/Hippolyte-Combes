historique: |
  Bresle, Laviéville et Hénencourt avaient servi de cantonnements pendant la bataille de la Somme (OH 1916-II, p.~301). « Fin juillet 1915 » surprend : la 18th Division, concentrée le 30 juillet 1915 près de Flesselles, n'entre dans le secteur d'Albert qu'en août (Becke 1938, p.~84 ; Nichols 1922, p.~15-16) ; elle quitte la Somme le 21 juillet 1916 (JMO 7/Bedf) ; souvenir peut-être approximatif. Abbeville, d'où revient Gilbert, est le siège du QG des \textit{Lines of Communication} (Maurois 1920, p.~ix). Les Australiens de Buire relèvent du I Anzac Corps (OH 1917-I, p.~74). Ribemont, où la division cantonnait à l'hiver 1915-1916 (Becke 1938, p.~83, n.~14), avait déjà été revu le 16 mars (f.~84 v\textsuperscript{o}) ; les Colart ne sont pas identifiés.
