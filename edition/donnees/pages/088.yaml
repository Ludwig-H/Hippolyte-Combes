historique: |
  Le retour du soleil, le 31, ne relance pas les opérations : l'attaque principale de la Fifth Army sur l'Ancre, fixée « provisoirement » au 1\textsuperscript{er} novembre le 27 octobre, est déjà remise au 5, et ce même 31 octobre Foch demande que l'attaque alliée vers Le Transloy soit elle aussi retardée jusqu'au 5 novembre (OH 1916-II, p.~461-462, 468). À Albert, la 54th Brigade attend l'ordre d'attaquer Petit-Miraumont (ordre d'opérations du 30 octobre), opération remise de jour en jour \textit{by weather} (JMO 7/Bedf, 26-31 oct. 1916) ; octobre et novembre 1916 furent, écrit Nichols, des mois où \textit{the Staff proposed and the weather disposed} (Nichols 1922, p.~130). La ville « bombardée » toute la journée contredit le guide Michelin, selon lequel Albert, sous les obus depuis le 29 septembre 1914, se trouvait enfin hors de portée des canons allemands en octobre 1916 (Michelin 1919, p.~31-35) ; Hippolyte Combes note d'autres obus le 24 octobre et le 9 novembre (voir f.~43~r\textsuperscript{o} et f.~48~r\textsuperscript{o}), sans doute tirés par des pièces à longue portée.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461-462, 468.
- Bedfordshire Archives, X550/8/1/1610, War Diary, 7th (Service) Battalion, Bedfordshire Regiment, octobre 1916.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 130.
- Michelin & Cie, Illustrated Michelin Guides to the Battlefields (1914-1918). The Somme, vol. 1, The First Battle of the Somme (1916-1917), Clermont-Ferrand, Michelin, 1919, p. 31-35.
