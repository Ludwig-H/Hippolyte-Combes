date: Mardi 31 octobre 1916
mois: Octobre 1916
lieux: Albert (Somme)
titre: Éclaircie après les rafales, nuit étoilée ; Albert bombardé tout le jour
transcription: |
  \sl{31 Ma} \hfill \sl{Oct – /16}
  \ind Matin, rafales peu à peu chassé
  nuages. Tout l'après-midi, enfin, soleil
  reparu. Belle fin de journee.
  Nuit étoilée.
  \ind Durant jour entier ; ville bombardee.
  \blanc{18}
apparat: []
historique: |
  Le soleil revient, mais l'attaque de la Fifth Army sur l'Ancre, fixée au 1\textsuperscript{er}~novembre, est déjà remise au 5. Le 31, Foch demande aussi que l'attaque alliée vers Le Transloy soit retardée au 5 (OH~\mbox{1916-II}, p.~461--462, 468). À Albert, la 54\textsuperscript{th} Brigade attend toujours l'ordre d'attaquer Petit-Miraumont (voir f.~43~v\textsuperscript{o}). Pour Nichols, octobre et novembre 1916 furent des mois où \textit{the Staff proposed and the weather disposed} (Nichols 1922, p.~130). Comme les obus du 24~octobre (voir f.~43~r\textsuperscript{o}) et du 9~novembre (f.~48~r\textsuperscript{o}), ce bombardement est sans doute dû à des pièces allemandes à longue portée.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 461-462, 468.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et Londres, Blackwood, 1922, p. 130.
