critique: 'Le feuillet a été photographié verso d''abord : cette page (f.~32 r\textsuperscript{o}) continue la dernière phrase du f.~31 v\textsuperscript{o} et précède le f.~32 v\textsuperscript{o}. Le récit s''arrête après six lignes et un blanc ; sous le filet, les comptes, à la même encre violette, sont introduits par « Hier » et portent sur le 4 octobre (bain aux Thermes, passage à la gare : f.~31 v\textsuperscript{o}), ce qui les date du 5.'
historique: |
  Le billet de 3\textsuperscript{e} classe pour Orsay, où le train arrive le 5 au matin (voir f.~32 v\textsuperscript{o}), coûte moins que celui de 2\textsuperscript{e} classe pris à l'aller, 15~F~15 au quart de place (voir f.~27 r\textsuperscript{o}) : sans doute est-il au même tarif, dû aux militaires en permission par les cahiers des charges des compagnies (Lafon 1922, p.~37). Le bain aux Thermes du Languedoc coûte 90~c, comme le 27 septembre (voir f.~27 v\textsuperscript{o}). Les « images de S\textsuperscript{te} Thérèse » sont peut-être celles de sœur Thérèse de l'Enfant-Jésus, carmélite de Lisieux, béatifiée seulement en 1923, dont médailles et gravures circulent alors parmi les soldats : un sergent en distribue à ses camarades en octobre 1916 (Archives du Carmel de Lisieux) ; il peut aussi s'agir de Thérèse d'Ávila, fêtée le 15 octobre. L'une et l'autre renvoient au Carmel, où Françoise, sœur aînée de Combes, est religieuse à Périgueux (tradition familiale). Les 5~F donnés à Maria, bonne des Crouzet (voir f.~31 v\textsuperscript{o}), égalent la gratification remise au \textit{headcook} de la compagnie (voir f.~3 v\textsuperscript{o}).
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
- Archives du Carmel de Lisieux, « Supplique des soldats envoyée au pape pour la béatification de Thérèse », archives.carmeldelisieux.fr, consulté le 18 oct. 2026.
