critique: 'Ordre des feuillets restitué : cette page (f.~32 r\textsuperscript{o}) continue le f.~31 v\textsuperscript{o} et précède le f.~32 v\textsuperscript{o}. Les comptes, introduits par « Hier », portent sur le 4 octobre et ont été écrits le 5.'
historique: |
  Le billet de 3\textsuperscript{e} classe pour Orsay coûte moins que celui de 2\textsuperscript{e} classe pris à l'aller, 15~F~15 au quart de place (voir f.~27 r\textsuperscript{o}) : il est sans doute aussi au quart de place des permissionnaires (Lafon 1922, p.~37). Les « images de S\textsuperscript{te} Thérèse » sont peut-être celles de Thérèse de l'Enfant-Jésus, carmélite de Lisieux, béatifiée seulement en 1923, dont les images circulent parmi les soldats (Archives du Carmel de Lisieux) ; ou celles de Thérèse d'Ávila, fêtée le 15 octobre. Les deux saintes renvoient au Carmel, où Françoise, sœur aînée d'Hippolyte Combes, est religieuse à Périgueux (tradition familiale).
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
- Archives du Carmel de Lisieux, « Supplique des soldats envoyée au pape pour la béatification de Thérèse », archives.carmeldelisieux.fr, consulté le 18 oct. 2026.
