historique: |
  Le \textit{green forage} est la ration d'appoint des chevaux : le \textit{Field Service Pocket Book} range la luzerne parmi les « green foods », avec le ray-grass, le sainfoin et le trèfle (FSPB 1914, chap.~6, « Forage », § 20), et le fourrage vert pouvait être distribué « in lieu of part of the hay ration » (\textit{Veterinary Services} 1925, p.~566). Combes en a déjà conduit la récolte à Saint-Jans-Cappel et à Raincheval (voir f.~3 v\textsuperscript{o} et 22 v\textsuperscript{o}) ; la luzerne était sans doute payée aux cultivateurs. Les « fourragères » sont sans doute les voitures de la compagnie, \textit{limber} et \textit{G.S. wagons} que Combes nomme le 12 (voir f.~37 r\textsuperscript{o}). La lisière boisée est celle du massif du bois de Ribeaucourt et du bois Monsieur-de-Berny, contre lequel s'adosse Barlette (voir f.~35 v\textsuperscript{o}). La « très belle journée » suit les bourrasques des 7 et 8 octobre (voir f.~34 v\textsuperscript{o}). La pleine lune tomba le 11 octobre 1916 vers 7 h, temps universel (calendrier lunaire 1916).
sources:
- Field Service Pocket Book, 1914, London, HMSO, 1914, chap. 6, « Forage », § 20.
- Blenkinsop, L. J., et Rainey, J. W. (éd.), Veterinary Services (History of the Great War based on Official Documents), London, HMSO, 1925, p. 566.
- Région Hauts-de-France, Inventaire général du patrimoine culturel, dossier « Le village de Franqueville », inventaire.hautsdefrance.fr.
- Calendar-12.com, « 1916 Moon Phases » (pleine lune du 11 octobre 1916, 06 h 59 UTC), consulté en octobre 2026.
