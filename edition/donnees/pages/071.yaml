date: Mardi 10 octobre 1916
mois: Octobre 1916
lieux: Barlette (Ribeaucourt, Somme)
titre: Chargement de luzerne (\textit{green forage}) en lisière des bois ; nuit de pleine lune
transcription: |
  \sl{Mardi 10} \hfill Oct^{bre} \sl{1916}
  \ind[2] Enfin, très belle journée.
  matin & après-midi, occupé pour green
  forage. Conduit fourragères ds les
  champs. Tout en surveillant le
  chargement, assis s/ 1 botte de
  luzerne – et rempli yeux vue
  des bois. Devant moi, à qq 40 ou 50
  mètres, lisière foret arbres
  massés les 1 à côté des autres
  très belles teintes que le soleil rendait
  + eclatantes et qui se détachaient
  sur le ciel bleu –
  \ind[2] Comme ts les soirs, nuit
  merveilleuse. Lune pleine
  brillant d'1 vive lueur ds l'immensité
  firmament. qq rares étoiles
  gde paix épandue \trait
apparat: []
historique: |
  Le \textit{green forage} est le fourrage vert des chevaux. Le \textit{Field Service Pocket Book} range la luzerne parmi les « green foods », avec le ray-grass, le sainfoin et le trèfle (FSPB 1914, chap.~6, « Forage », §~20) ; on pouvait la donner « in lieu of part of the hay ration » (\textit{Veterinary Services} 1925, p.~566). Hippolyte Combes a déjà mené cette corvée à Saint-Jans-Cappel et à Raincheval (voir ff.~3~v\textsuperscript{o} et 22~v\textsuperscript{o}). Les « fourragères » sont sans doute les voitures de la compagnie, \textit{limber} et \textit{G.S. wagons}, qu'il nomme le 12 (voir f.~37~r\textsuperscript{o}). Les bois sont ceux de Barlette (voir f.~35~v\textsuperscript{o}).
sources:
- Field Service Pocket Book, 1914, Londres, HMSO, 1914, chap. 6, « Forage », § 20.
- Blenkinsop, L. J., et Rainey, J. W. (éd.), Veterinary Services (History of the Great War based on Official Documents), Londres, HMSO, 1925, p. 566.
