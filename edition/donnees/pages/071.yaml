historique: |
  Le \textit{green forage} est le fourrage vert des chevaux. Le \textit{Field Service Pocket Book} range la luzerne parmi les « green foods », avec le ray-grass, le sainfoin et le trèfle (FSPB 1914, chap.~6, « Forage », § 20) ; on pouvait la donner « in lieu of part of the hay ration » (\textit{Veterinary Services} 1925, p.~566). Hippolyte Combes a déjà mené cette corvée à Saint-Jans-Cappel et à Raincheval (voir f.~3 v\textsuperscript{o} et 22 v\textsuperscript{o}). Les « fourragères » sont sans doute les voitures de la compagnie, \textit{limber} et \textit{G.S. wagons}, qu'il nomme le 12 (voir f.~37 r\textsuperscript{o}). Les bois sont ceux de Barlette (voir f.~35 v\textsuperscript{o}).
sources:
- Field Service Pocket Book, 1914, London, HMSO, 1914, chap. 6, « Forage », § 20.
- Blenkinsop, L. J., et Rainey, J. W. (éd.), Veterinary Services (History of the Great War based on Official Documents), London, HMSO, 1925, p. 566.
