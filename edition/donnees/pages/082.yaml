critique: Page d'une seule journée, à l'encre violette ; le dernier tiers de la page est resté blanc.
historique: |
  Ce samedi est le jour de l'attaque du II Corps sur Regina et Stuff Trenches, à 12~h~06, à laquelle prend part la 53rd Brigade de la 18th Division (voir f.~41~r\textsuperscript{o}) : la « canonnade » du soir en est l'écho. L'histoire officielle note que la journée « se leva belle et froide » (OH 1916-II, p.~462). Aveluy (Somme), à 2,5~km au nord d'Albert dans la vallée de l'Ancre, est sur la grande ligne Albert--Arras, où la voie normale Candas--Acheux est prolongée à l'automne 1916 (OH 1916-II, p.~543). « L'ordonnance » y désigne peut-être un dépôt de l'\textit{Army Ordnance Department}, le service du matériel ; la lecture du nom de lieu n'est pas sûre. Le camp du « plateau » est celui des briqueteries au nord d'Albert (voir f.~40~v\textsuperscript{o}). Abel est le plus jeune fils des Duchâteau, famille d'Albert chez qui loge sans doute Hippolyte Combes. Leur fils aîné, maréchal des logis d'artillerie dans l'armée belge, vient en permission le 29 octobre (voir f.~44~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 462-463, 543.
