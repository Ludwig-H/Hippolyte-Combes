historique: |
  Ce samedi, à 12~h~06, le II~Corps attaque Regina et Stuff Trenches (voir f.~41~r\textsuperscript{o}) ; la journée « se leva belle et froide » (OH~\mbox{1916-II}, p.~462). Aveluy (Somme) est à 2,5~km au nord d'Albert, dans la vallée de l'Ancre, sur la ligne Albert--Arras, où l'on prolonge à l'automne 1916 la voie normale Candas--Acheux (OH~\mbox{1916-II}, p.~543). « L'ordonnance » y est peut-être un dépôt de l'Army Ordnance Department, le service du matériel ; la lecture du nom de lieu n'est pas sûre. Abel serait le plus jeune fils des Duchâteau, famille d'Albert chez qui loge sans doute Hippolyte Combes. Le fils aîné, maréchal des logis dans l'artillerie belge, vient en permission le 29~octobre (voir f.~44~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 462, 543.
