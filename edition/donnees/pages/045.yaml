date: Lundi 18 septembre 1916
mois: Septembre 1916
lieux: Raincheval, Hédauville, Forceville et Acheux-en-Amiénois (Somme)
titre: Sous la pluie à la Mission d'Acheux, par Hédauville et Forceville ; malaise
transcription: |
  \sl{18 Lundi} \hfill \sl{Septbr 1916}
  \ind Tout le jour, pluie très forte
  Reçu hier soir message ; obligé venir mission
  fr^{se}. Malgré averses incessantes, parti
  à cheval vers 1^{H} \fr{1}{2}. Tout l'après-midi par
  monts & par vaux, sur routes boueuses
  A Hédauville, appris que \inc{xviiie} divi, \inc{contr^{t}}
  et pas quitte Acheux — Le HQ^{rs} divi reste \inc{m}
  où elle etait \trait
  \sur{\ill}{\inc{Reparti}} par Forceville à Acheux — où
  enfin retrouvé mission fr de notre divi
  Au retour, fait route en cie de \inc{Brammas}
  Temps affreux. Cape traversée par la pluie
  Habits trempés. Souliers remplis d'eau
  En outre, derangt d'entrailles, depuis
  qq jours, par suite changemt de regime
  (mess d'offrs
  \ind Rentré chambre, mal à l'aise. Selles
  frequentes. Rendu enfin \sur{\ill}{repas} de midi
  qui me chargeait l'estomac \trait
  \ind Couché de b heure \trait
  \blanc{2}
  \filet
  Tip à Connelly mon groom : 2^{f} —
