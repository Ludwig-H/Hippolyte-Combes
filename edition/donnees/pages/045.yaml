historique: |
  Le message émane sans doute du bureau divisionnaire de la Mission, dont relèvent les interprètes des unités (voir f. 22 r\textsuperscript{o}). Hippolyte Combes le cherche d'abord à Hédauville, à 9,8 km de Raincheval, peut-être sur le bruit d'un déplacement du QG : celui-ci ne s'y installera que le 25 septembre, la veille de l'attaque de Thiepval, et y restera jusqu'au 6 octobre (Nichols 1922, p. 79). Hédauville est sur la route Contay–Englebelmer–Aveluy, presque la seule route proche du front praticable de jour comme de nuit (OH 1916-I, p. 271) ; Forceville et Acheux sont à 1,9 et 4 km de là. Le 7th Bedfordshire note ce jour un « Wet morning » et la visite du général Shoubridge, commandant la 54th Brigade (JMO 7/Bedf, 18 sept. 1916 ; Nichols 1922, p. 109). « Brammas » (lecture incertaine) n'est pas identifié. Le régime incriminé est celui du mess des officiers, partagé depuis le 12 (voir f. 21 v\textsuperscript{o}). Connelly, son palefrenier, avait reçu 1 f le 5 août et le 11 septembre (voir f. 6 r\textsuperscript{o} et 21 r\textsuperscript{o}) ; le pourboire double ce jour.
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh, Blackwood, 1922, p. 79, 109.
- Edmonds, J. E. (comp.), Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 271.
