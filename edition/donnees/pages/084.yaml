historique: |
  La Boisselle, hameau d'Ovillers-la-Boisselle (Somme), est à 3,5~km au nord-est d'Albert, sur la route de Bapaume. Le front y était fixé depuis octobre 1914 et la guerre des mines y faisait rage (Michelin 1919, p.~36--37). Le 1er juillet 1916, la 34th Division l'attaque sans le prendre. La 19th (Western) Division nettoie le village le 4 juillet (CWGC, Gordon Dump Cemetery). Les \textit{dug-outs} visités sont les abris profonds de l'ancienne première ligne allemande. L'« immense cratère s/ la droite » est celui de la mine de Lochnagar : 60~000 livres d'ammonal, mises à feu le 1er juillet à 7~h~28. Elles laissent un cratère de 90 yards de diamètre et de 70 pieds de profondeur (OH 1916-I, p.~375, 380). Le guide Michelin note de même que « le plus grand cratère est sur la droite » de la route (Michelin 1919, p.~36--37). Le cratère est classé monument historique (Mérimée PA80000004). À Albert, les cartes postales coûtent 10~c pièce (f.~50~r\textsuperscript{o}) : la dépense de 70~c correspond sans doute à sept cartes.
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 375, 380.
- Michelin, The Somme, vol. 1, The First Battle of the Somme (1916-1917), Clermont-Ferrand, Michelin, 1919, p. 36-37.
- Commonwealth War Graves Commission, Gordon Dump Cemetery, Ovillers-La Boisselle, notice historique (cwgc.org).
- Ministère de la Culture, base Mérimée, notice PA80000004 (trou de mine de La Boisselle).
