critique: Trois journées sur la page. Le compte du samedi est ouvert par un grand crochet et séparé du dimanche par un long filet ; le poste « Washing » est ajouté au crayon. Les deux avant-dernières lignes sont serrées en bas de page, l'une empiétant sur l'autre.
historique: |
  Le 3 mars est l'une des dates de paie fixées le 9 février par la Mission de la Fifth Army (voir f.~75~r\textsuperscript{o}). Les 43~f~75 et les 35~f retenus redonnent les 78~f~75 de la quinzaine ordinaire, soit sans doute quinze jours à 5~f~25, dont 5~f d'indemnité journalière suspendue pendant les sept jours pleins de la permission prise du 26 janvier au 7 février. Sept jours, délais de route non compris, est la durée fixée depuis le 1\textsuperscript{er} octobre 1916 (Cronier 2013, p.~18, 32). À Puchevillers, le \textit{Town Major} est l'officier chargé des cantonnements du village (voir f.~54~r\textsuperscript{o}). Flixecourt, à quelque 25~km à l'ouest, entre Amiens et Abbeville, avait abrité au printemps 1916 l'école d'officiers de la Fourth Army (Sassoon 1930). La neige du 5 au matin est tombée dans la nuit du 4, avant un jour de dégel (OH 1917-I, p.~104). L'officier australien annoncé s'explique par le passage du I Anzac Corps à la Fifth Army le 15 février (OH 1917-I, p.~74) ; c'est peut-être le « Lt. Wentworth » nommé à partir du 17 mars (voir f.~84~v\textsuperscript{o}).
sources:
- Cronier, E., Permissionnaires dans la Grande Guerre, Paris, Belin, 2013, p. 18 et 32.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 74, 104.
- Sassoon, S., Memoirs of an Infantry Officer, London, Faber & Faber, 1930, chap. I.
