historique: |
  Le 3~mars est l'une des dates de paie fixées le 9~février par la Mission de la Fifth Army (voir f.~75~r\textsuperscript{o}). Les 43,75~F et les 35~F retenus font les 78,75~F de la quinzaine, soit sans doute quinze jours à 5,25~F, dont 5~F d'indemnité journalière suspendue pendant les sept jours de la permission (26~janvier -- 7~février). Sept jours, délais de route non compris, est la durée fixée depuis le 1\textsuperscript{er}~octobre 1916 (Cronier 2013, p.~18, 32). Flixecourt, à quelque 25~km à l'ouest, entre Amiens et Abbeville, avait abrité au printemps 1916 l'école d'officiers de la Fourth Army (Sassoon 1930). La neige du 5 est tombée dans la nuit du 4 (OH~\mbox{1917-I}, p.~104). L'officier australien annoncé s'explique par le passage du I Anzac Corps à la Fifth Army le 15~février (OH~\mbox{1917-I}, p.~74).
sources:
- Cronier, E., Permissionnaires dans la Grande Guerre, Paris, Belin, 2013, p. 18 et 32.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, Londres, Macmillan, 1940, p. 74, 104.
- Sassoon, S., Memoirs of an Infantry Officer, Londres, Faber & Faber, 1930, chap. I.
