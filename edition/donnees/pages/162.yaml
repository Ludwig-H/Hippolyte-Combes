date: Samedi 3 – lundi 5 mars 1917
mois: Mars 1917
lieux: Hérissart, Rubempré, Puchevillers, Toutencourt, Montigny-sur-l'Hallue et Fréchencourt (Somme)
titre: Paille à Rubempré et Puchevillers ; paie et permission ; neige ; relève annoncée
transcription: |
  3 \sl{Sam.} \hfill — \sl{Mars 1917} —
  \ind matin & soir, brouillard
  glacial. ciel resté voilé de brume tout le jour.
  \ind Matin, de 9^{H}30 à 1^{H}, à Rubempré et à
  Puchevillers (paille ...etc. / & Town Major's office
  \ind Après midi, liberté entière. Venu à pied
  à Toutencourt, mission fr^{se} & qq fermes
  Retour sur 1 lorry. Temps froid. Brouillard.
  \ind Fini journée ds notre office. Herissart. à lire
  \ind[2] ou à ecrire
  \crochet{2}Toutencourt : Mission fr^{se} : 43^{f} 75 (retenue
  \ind[2] de 35 fr. pour 7 jours de permission
  \filet
  4 \sl{Dim.} Nuit, gelé un peu
  Matin & soir, froid un peu vif. Mais ds la
  journée, très beau temps, soleil \del{\ill} chaud.
  \ind Cap & son ami, en ballade à
  Flixecourt. aussi, liberté entière.
  matin & soir — \hfill Washing : 60c
  5 \sl{Lundi.} – au reveil, epaisse couche de
  neige recouvrait routes & toits. Branches
  d'arbres, très belles, sous leur ouate blanche
  \ind matin, course à Montigny & à Frechencourt
  après-midi, à Rubempré & Puchevillers. au
  retour, fait 500 m. à pied sur plateau —
  \ind Appris arrivée très prochaine off^{r} australien, au \ill
  \inc{interprète}, pour ns remplacer. Très content de quitter le Cap
  \ind nuit, merv^{t} ciel etoilé, pleine lune — superbe!
