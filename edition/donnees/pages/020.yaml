date: Mardi 15 août 1916 (Assomption)
mois: Août 1916
lieux: La Croix-du-Bac (Steenwerck, Nord)
titre: Assomption pluvieuse passée dans la chambre ; brouillards du matin ; cuisine et lait payés
transcription: |
  15 \sl{ma – \inc{Assomptn}.} \hfill \sl{Aout /16}
  Toute matinée et 1 peu après-midi ;
  fortes ondées. Routes détrempées. Aucun
  envie aller promener. Resté partie journée
  ds ma chambre Large pièce ; très
  haute de plafond. Belle vue de la
  fenêtre, où me tiens sans cesse \trait
  \blanc{7}
  \ind — Presque ts ces matins, à l'aube,
  épais brouillards \trait
  \ind — donné à ma propri pour
  cooking semaine dernière et 2 l. lait : 5^{f} —
  \blanc{4}
