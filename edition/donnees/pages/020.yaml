historique: |
  L'Assomption est l'une des quatre fêtes religieuses que le Concordat avait maintenues comme jours chômés (indult Caprara, 9 avril 1802) ; Hippolyte Combes ne mentionne ni messe ni office. Les 15 et 16 août, la 51st (Highland) Division relève la New Zealand Division entre La Chapelle-d'Armentières et la Lys, et sa 152nd Brigade cantonne dans Armentières même (Bewsher 1921, pp. 87-88) : ce sont les « Ecossais » qu'Hippolyte Combes y croisera le 19 (f. 11 v\textsuperscript{o}). Le 16 au soir, le 7th Bedfordshire, relevé par le 6th Northamptonshire, gagne ses cantonnements de Rue-Marle (JMO 7/Bedf, 16 août 1916). La grande chambre haute de plafond, à la fenêtre tournée vers Estaires et Hazebrouck (voir f. 8 v\textsuperscript{o} et 9 r\textsuperscript{o}), est sans doute celle qu'il occupe depuis le 7 août au-dessus de la poste (voir f. 7 v\textsuperscript{o}). Les 5 F versés à la propriétaire couvrent le \textit{cooking} de la semaine et deux litres de lait : au prix de 25 à 30 c le litre noté les jours précédents (f. 7 r\textsuperscript{o} et 9 v\textsuperscript{o}), la cuisine coûte quelque 4 F 50.
sources:
- Indult du cardinal Caprara pour la réduction des fêtes, 9 avril 1802, publié par l'arrêté des consuls du 29 germinal an X (19 avril 1802).
- Bewsher, F. W., The History of the 51st (Highland) Division, 1914–1918, Édimbourg–Londres, W. Blackwood & Sons, 1921, pp. 87-88.
- Bedfordshire Archives Service, X550/8/1/1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (JMO 7/Bedf).
