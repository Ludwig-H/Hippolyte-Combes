critique: Encre violette. Quelques mots d'une encre plus pâle, brunâtre (« or — », « mortes », « 152 Coy », le nom de Léalvillers et la parenthèse vide qui le suit) paraissent écrits ou repassés après coup, peut-être dans des blancs réservés.
historique: |
  Belle-Église, hameau d'Arquèves à 3~km à l'ouest d'Acheux, était en juillet 1916 une tête de ligne des vivres (OH 1916-I, p.~274) ; la ferme, tenue par une fermière belge, verra en décembre des battages pour l'armée (f.~54~r\textsuperscript{o}). La « question de pétrole » (voir f.~46~v\textsuperscript{o}) porte peut-être sur l'essence, livrée en bidons emballés en caisses (\textit{Statistics} 1922, p.~846). À Coisy, au nord d'Amiens, a lieu le premier achat de paille et de foin noté : l'interprète « sert d'intermédiaire pour les approvisionnements ou les réquisitions de paille et de foin » (Tessan, dans Fernand-Laurent 1917, p.~XIV) ; la paille complète le fourrage et sert de couchage, à 4 livres par homme et par semaine en hiver (Puckle 1917, p.~28). Le flot du 7, route de Léalvillers (voir f.~47~r\textsuperscript{o}), accompagne la préparation de l'attaque de l'Ancre, « constamment remise mais jamais annulée » (OH 1916-II, p.~480), que Gough décide le 8 au soir de lancer si la pluie ne reprend pas (ibid., p.~462) ; elle part le 13.
