historique: |
  Belle-Église, hameau d'Arquèves à 3~km à l'ouest d'Acheux, était en juillet 1916 une tête de ligne des vivres (OH~\mbox{1916-I}, p.~274) ; la ferme, tenue par une fermière belge, verra en décembre des battages pour l'armée (f.~54~r\textsuperscript{o}). Le « petrole » est peut-être l'essence, livrée en bidons mis en caisses (\textit{Statistics} 1922, p.~846 ; voir f.~46~v\textsuperscript{o}). À Coisy, au nord d'Amiens, a lieu le premier achat noté de paille et de foin : l'interprète « sert d'intermédiaire pour les approvisionnements ou les réquisitions de paille et de foin » (Tessan, dans Fernand-Laurent 1917, p.~\textsc{xiv}). La paille sert aussi de couchage (Puckle 1917, p.~28). Le flot de véhicules du 7 prépare l'attaque de l'Ancre (voir f.~46~v\textsuperscript{o}) ; elle part le 13.
sources:
