date: Samedi 20 – mardi 23 janvier 1917
mois: Janvier 1917
lieux: Acheux-en-Amiénois et Louvencourt (Somme)
titre: Grand gel ; visite à M\textsuperscript{me} Cuisinier à Louvencourt ; préparatifs de départ
transcription: |
  20 \sl{Sam.} \hfill — \sl{Janvier 1917} –
  \ind[3] Repos tout le jour.
  Chambre ou office : lu \inc{à} toilette.
  Neige ne fond pas. Champs & toits
  encore tout blancs
  \ind Froid sec. Gelé très fortement
  Sol resté durci. —
  \filet
  21 \sl{Dim.} Nuit, gelé très fort. Froid sec –
  Matinée, en auto j-à Louvencourt, où
  vu Mme Cuis^{r}. Sur ma demande, retour
  à pied. Sol durci. Route excellente. 2 \inc{kil'g.}
  Champs tout blancs. Neige durcie ne
  fond pas.
  \ind[2] [— Canteen : Wren's Dubbin : 3 tins : 30c
  après-midi, liberté. Commencé preparatifs
  départ
  \filet
  \sl{23 Mardi} [ Hier & aujdhui liberté entière
  \ind[3] Hier, Cap^{ne} W, à Amiens — seul.
  Tempér^{re} très basse, nuit & matinée, gelé très
  fort. Vitres, complèt^{t} mates de glace
  Neige ne fond pas. \fr{1}{2} jour, très beau
  soleil. Neige etincelle sous ses rayons
