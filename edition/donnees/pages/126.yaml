critique: |
  Le lundi 22 n'a pas d'entrée propre : il n'est évoqué que par « Hier » sous la date du 23. La journée du 23 se poursuit au verso.
historique: |
  Louvencourt est à 3,4~km au nord-ouest d'Acheux à vol d'oiseau (mairies, geo.api.gouv.fr) ; les « 2 kil'g. » du retour sous-estiment sans doute la distance. Le capitaine Williams y a lancé son « Bloody France » chez M\textsuperscript{me} Cuisinier le 24~décembre (ff.~56~v\textsuperscript{o}, 59~r\textsuperscript{o}). Le gel rend la route « excellente », mais il va ruiner les routes mal empierrées de l'arrière (OH~\mbox{1917-I}, p.~69). Les trois boîtes de \textit{Wren's Dubbin} coûtent 10~c pièce, le tiers du prix du 11~décembre (f.~54~v\textsuperscript{o}) : sans doute de petites boîtes. Les préparatifs sont ceux de la permission fixée au 26~janvier (f.~61~v\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 69.
