critique: Trois journées séparées par deux filets ; le lundi 22 n'a pas d'entrée propre et n'est évoqué que par « Hier » sous la date du 23, soulignée d'un trait oblique. L'entrée du 23 se poursuit au verso, sous un nouvel en-tête de date.
historique: |
  Louvencourt, à 3,4~km au nord-ouest d'Acheux à vol d'oiseau (mairies, geo.api.gouv.fr), est le village de Mme Cuisinier, dont la ferme a été le cadre du « Bloody France » du capitaine Williams le 24 décembre (voir f.~56~v\textsuperscript{o}, 59~r\textsuperscript{o}) ; les « 2 kil'g. » du retour sous-estiment donc sans doute le trajet. La « route excellente » est celle du gel : le sol durci porte bien, mais ce froid d'un mois ruinera les routes faiblement empierrées de l'arrière (OH 1917-I, p.~69) ; sur la vague de froid, voir f.~62~v\textsuperscript{o}. Les trois \textit{tins} de \textit{Wren's Dubbin}, graisse pour le cuir, reviennent à 10~c pièce, le tiers du prix payé le 11 décembre (voir f.~54~v\textsuperscript{o}) : sans doute de petites boîtes. Les « preparatifs départ » sont ceux de la permission que le bureau du V Corps a fixée le 13 au 26 janvier (f.~61~v\textsuperscript{o}). Le voyage du capitaine Williams (voir f.~53~v\textsuperscript{o}) à Amiens, le 22, n'est pas autrement documenté.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 69.
- Base adresse nationale, coordonnées des mairies d'Acheux-en-Amiénois et de Louvencourt (geo.api.gouv.fr).
