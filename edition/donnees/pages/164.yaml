critique: Le mot « office » est d'une encre plus pâle, la plume étant moins chargée. Le règlement du mess, isolé après un blanc d'environ deux lignes, est encadré à gauche par une équerre.
historique: |
  Ces allées et venues accompagnent la relève du capitaine Williams par un officier australien, arrivé le 6 mars avec un « Nouvel interprète » (voir f.~81 v\textsuperscript{o}) : depuis le 15 février, le I Anzac Corps, dont la 2nd Australian Division, appartient à la Fifth Army (OH 1917-I, p.~74). Evar, qui « revient » ce jour-là, est peut-être cet interprète du 6 ; il repart pour Albert. Valet, qui cédera sa chambre à Combes le 11 (voir f.~83 r\textsuperscript{o}), n'est pas identifié, et le sigle « R.2 » reste inexpliqué. Le maréchal des logis laissé sans nom est sans doute celui du 6, qui avait promis un « bon poste » (voir f.~81 v\textsuperscript{o}). Le « dépôt » de Toutencourt, QG de la Fifth Army jusqu'au 28 mars (LLT), est vraisemblablement celui où la Mission de l'armée garde les interprètes en attente d'affectation, à l'image du dépôt des interprètes du Havre en 1914 (Fernand-Laurent 1917, p.~27). Les 18~f (ou 16) de mess pour les neuf premiers jours de mars font suite aux 33~f de février, comptés depuis le 8 (voir f.~80 r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 74.
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copie Wayback du 23 juil. 2024).
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 27.
