historique: |
  Evar, qui « revient » ce jour-là, est peut-être le nouvel interprète arrivé le 6, le même jour que l'officier australien qui relève le capitaine Williams (voir f.~81~v\textsuperscript{o}) ; il repart pour Albert. Valet, de la 2\textsuperscript{nd} Australian Division, qui cédera sa chambre à Combes le 11 (voir f.~83~r\textsuperscript{o}), n'est pas identifié ; le sigle « R2 » reste inexpliqué. Le maréchal des logis sans nom est sans doute celui du 6, qui avait promis un « bon poste ». Le « dépôt » de Toutencourt, QG de la Fifth Army jusqu'au 28~mars (LLT), est sans doute celui où la Mission garde les interprètes en attente d'affectation, comme le dépôt des interprètes du Havre en 1914 (Fernand-Laurent 1917, p.~27). Les 18~F (ou 14, ou 16) de mess de mars suivent les 33~F de février (voir f.~80~r\textsuperscript{o}).
sources:
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copie Wayback du 23 juil. 2024).
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 27.
