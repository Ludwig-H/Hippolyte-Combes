critique: La journée se poursuit f.~31 r\textsuperscript{o} (dépenses et note sur la propriété de Mme de Labarthe).
historique: |
  La « Mlle Calmels » n'est pas une sœur de Marguerite (\textit{PC-Annexe}) ; ce pourrait être Anne Calmels, sœur du Dr Gabriel Calmels, « célibataire, esprit religieux » (Combes 2020, p.~106). Le marché couvert Victor-Hugo est une halle métallique de Joseph Galinier (1890--1892) (Office de tourisme de Toulouse). Les « magasins Capitole » sont les grands magasins « Au Capitole » (\textit{La Dépêche}, 8 août 1917, p.~3) ; l'Automate, rue d'Alsace-Lorraine, n'est pas identifié. Si la lecture « Castanet » est juste, il s'agit de la ligne Esquirol--Saint-Agne--Castanet (Wikipédia, « Ancien tramway de Toulouse »). Sur Mme de Labarthe, voir f.~28 v\textsuperscript{o} ; Mme « Laudet » (?) n'est pas identifiée. « B. Mm » (Bonne-Maman ?) est peut-être Mme Calmels, la « Mme Cl » du matin.
sources:
- Combes, P., étude familiale « Famille Combes » (2020-2021), p. 106 ; livre familial dactylographié, annexe généalogique (PC-Annexe), archives familiales.
- Office de tourisme de Toulouse, notice « Marché couvert Victor Hugo », toulouse-tourisme.com, consultée le 18 oct. 2026.
- La Dépêche, 8 août 1917, p. 3, Rosalis, Bibliothèque de Toulouse.
- Wikipédia, « Ancien tramway de Toulouse » (d'après C. Lacombe et P. Malterre, Omnibus, tramways et autobus de Toulouse, éd. du Cabri, 1983), consulté le 18 oct. 2026.
