critique: Encre violette. Les comptes, séparés du récit par un filet terminé en pointe de flèche, sont disposés en deux colonnes ; la journée se poursuit sur la page suivante (f.~31 r\textsuperscript{o}), où d'autres dépenses précèdent une note sur la propriété de Mme de Labarthe.
historique: |
  La « Mlle Calmels » de la messe anniversaire n'appartient pas à la fratrie de Marguerite (\textit{PC-Annexe}) ; ce pourrait être Anne Calmels, sœur du Dr Gabriel Calmels, « célibataire, esprit religieux » (Combes 2020, p.~106). Sur l'abbé Crouzet, vicaire à la cathédrale, voir f.~29 v\textsuperscript{o}. Le marché couvert de la place Victor-Hugo, halle métallique de Joseph Galinier (1890--1892), est le plus grand des marchés couverts de 1892 (Office de tourisme de Toulouse). Les « magasins Capitole » sont les grands magasins « Au Capitole » (\textit{La Dépêche}, 8 août 1917, p.~3) ; « l'Automate », rue d'Alsace-Lorraine, n'a pas été identifié. Si la lecture « Castanet » est juste, le tram est celui de la ligne suburbaine Esquirol--Saint-Agne--Castanet (Wikipédia, « Ancien tramway de Toulouse »). Mme de Labarthe, « gde amie » visitée les 29 et 30 septembre (voir f.~28 v\textsuperscript{o}), n'est pas identifiée. « B. Mm », peut-être « Bonne-Maman », désigne sans doute Mme Calmels, nommée « Mme Cl » le matin. Mme « Laudet » (?) reste inconnue.
sources:
- Combes, P., étude familiale « Famille Combes » (2020-2021), p. 106 ; livre familial dactylographié, annexe généalogique (PC-Annexe), archives familiales.
- Office de tourisme de Toulouse, notice « Marché couvert Victor Hugo », toulouse-tourisme.com, consultée le 18 oct. 2026.
- La Dépêche, 8 août 1917, p. 3, Rosalis, Bibliothèque de Toulouse.
- Wikipédia, « Ancien tramway de Toulouse » (d'après C. Lacombe et P. Malterre, Omnibus, tramways et autobus de Toulouse, éd. du Cabri, 1983), consulté le 18 oct. 2026.
