critique: Les deux dépenses du 29 sont réunies par un grand crochet, et un filet sépare les deux journées. À la l.~12, une reprise d'encre violette empâte le mot qui suit « sympathique. ».
historique: |
  Senlis-le-Sec, à 6~km environ à l'ouest-nord-ouest d'Albert, abrite alors le QG du II Corps, dont relève la 18th Division. Acheux-en-Amiénois, à une douzaine de kilomètres au nord-ouest, abrite celui du V Corps du 2 octobre au 29 novembre 1916 (LLT). C'est aussi le terminus de la voie normale venue de Candas (OH 1916-I, p.~273). Cette « enquête » sur la paille et le foin est la première trace du service où Hippolyte Combes sera détaché le 2 novembre, avec le lieutenant Curtis, à Acheux même (f.~45~r\textsuperscript{o}--v\textsuperscript{o}). Ces achats locaux de l'armée britannique passent par des \textit{purchase boards} (Puckle 1917, p.~8). En novembre, faute de tonnage, le \textit{War Office} proposera d'« étendre l'achat local » du fourrage (OH 1916-II, p.~550). Le fils aîné de M. Duchâteau est le frère d'Abel ; la famille loge sans doute Hippolyte Combes (voir f.~41~v\textsuperscript{o}). Son service dans l'artillerie belge suggère que la famille est belge, sans que rien ne le confirme. Le 30 octobre, jour de la tempête, la Reserve Army de Gough devient la Fifth Army (LLT ; Becke 1938, p.~84).
sources:
- Baker, C., The Long, Long Trail, « The British II Corps in France and Flanders » (copie Wayback Machine du 6 novembre 2024).
- Baker, C., The Long, Long Trail, « The British V Corps in France and Flanders » et « The British Fifth or Reserve Army 1916-1918 » (copies Wayback Machine, 2024).
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 550.
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 8.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 84.'
