historique: |
  Senlis-le-Sec, à 6~km environ à l'ouest-nord-ouest d'Albert, abrite le QG du II~Corps, dont relève la 18\textsuperscript{th} Division. Acheux-en-Amiénois, à 12~km environ au nord-ouest, abrite celui du V Corps du 2~octobre au 29~novembre 1916 (LLT). L'enquête est la première trace du service où Hippolyte Combes sera détaché le 2~novembre, avec le lieutenant Curtis, à Acheux (f.~45~r\textsuperscript{o}--v\textsuperscript{o}). Ces achats locaux passent par des \textit{purchase boards} (Puckle 1917, p.~8). Le fils aîné de M. Duchâteau serait le frère d'Abel ; la famille loge sans doute Hippolyte Combes (voir f.~41~v\textsuperscript{o}). Le 30~octobre, la Reserve Army de Gough devient la Fifth Army (LLT ; Becke 1938, p.~84).
sources:
- Baker, C., The Long, Long Trail, « The British II Corps in France and Flanders » (copie Wayback Machine du 6 novembre 2024).
- Baker, C., The Long, Long Trail, « The British V Corps in France and Flanders » et « The British Fifth or Reserve Army 1916-1918 » (copies Wayback Machine, 2024).
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 8.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), Londres, HMSO, 1938, p. 84.'
