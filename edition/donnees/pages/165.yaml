critique: Encre violette sur toute la page ; les trois dernières lignes, d'un module nettement plus grand, ont sans doute été écrites le soir. Le bas du feuillet, taché de rouille, est resté blanc.
historique: |
  Le capitaine Williams, arrivé à Acheux le 2 décembre 1916 pour remplacer le lieutenant Curtis (voir f.~52 v\textsuperscript{o}), avait alors vingt ans et était \textit{office boy} avant la guerre (voir f.~53 v\textsuperscript{o}) ; parmi les quarante-neuf officiers de l'A.S.C. de ce nom (TNA, WO 339), aucun ne peut être retenu, et sa nouvelle affectation est inconnue. Son départ achève la relève annoncée le 5 mars (voir f.~81 r\textsuperscript{o}). Sans officier à servir, l'interprète n'a plus de fonction et attend l'ordre de la Mission (voir f.~82 r\textsuperscript{o}). Les « 6 derniers mois », si la lecture est bonne, sont ceux du séjour dans la Somme, commencé le 11 septembre 1916 à Raincheval (voir f.~21 r\textsuperscript{o}). Ce même 10 mars, à quelque 26~km à l'est-nord-est, la 53rd Brigade de la 18th Division, dont Combes a servi le train jusqu'en novembre, enlève Irles, les hommes du 10th Essex attaquant en tenue blanche (\textit{snow mantles}) (Nichols 1922, p.~157--159 ; Becke 1938, p.~85).
sources:
- 'The National Archives (Kew), WO 339 : dossiers d''officiers, requête « Williams » « Army Service Corps » (catalogue en ligne).'
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg et Londres, W. Blackwood & Sons, 1922, p. 157-159.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 85.'
