critique: |
  La journée du 23, commencée au recto (f.~63~r\textsuperscript{o}), se termine en tête de page.
historique: |
  La hutte de la Y.M.C.A. d'Acheux, où Hippolyte Combes a entendu les chanteurs du XIII Corps (voir f.~58~r\textsuperscript{o}, 60~r\textsuperscript{o}), accueille aussi des conférences, à entrée gratuite (Yapp 1918, chap.~IV) ; le conférencier n'est pas connu. Le froid culmine le 25 : 15~°F, environ $-9$~°C, et aucune opération connue n'explique le « violent bombardemt. » de la nuit (OH 1917-I, p.~69). Le départ du 26 se fait par la voie métrique, en gare d'Acheux-Varennes (f.~64~r\textsuperscript{o}). Les 79~f~10 de mess pour janvier font près de la moitié des 162~f~75 reçus de la Mission ce mois-là (f.~60~r\textsuperscript{o}, 62~v\textsuperscript{o}), soit un peu plus de 3~F par jour pour vingt-cinq jours (calcul de l'éditeur) ; le mess de décembre, noté 88~F, faisait en fait 78~F (f.~58~v\textsuperscript{o}).
sources:
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV, « The Romance of Finance », p. 39-62.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 69.
