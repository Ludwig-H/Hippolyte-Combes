critique: La soirée du 23 est reportée en tête de page sous un nouvel en-tête de date, à la suite de l'entrée commencée au recto. Les trois journées sont séparées par des filets.
historique: |
  La hutte de la Y.M.C.A. d'Acheux, où Combes a entendu les chanteurs du XIII Corps (voir f.~58~r\textsuperscript{o}, 60~r\textsuperscript{o}), accueille aussi des conférences, dont l'association ne faisait pas payer l'entrée (Yapp 1918, chap.~IV) ; le conférencier n'est pas connu. Le froid culmine le 25 : l'histoire officielle relève ce jour-là 15~°F (environ $-9$~°C) (OH 1917-I, p.~69). Le « violent bombardemt. » de la nuit du 24 au 25 ne répond à aucune opération signalée pour la fin de janvier (OH 1917-I, p.~69). Le départ « demain 3\textsuperscript{H} 1/2 » est celui de la permission fixée le 13 (voir f.~61~v\textsuperscript{o}) ; le train de la voie métrique quittera la gare d'Acheux-Varennes peu après 3~h (f.~64~r\textsuperscript{o}). Les 79~f~10 de mess pour janvier absorbent près de la moitié des 162~f~75 versés par la Mission ce mois-là (voir f.~60~r\textsuperscript{o} et 62~v\textsuperscript{o}), soit un peu plus de 3~F par jour pour vingt-cinq jours (calcul de l'éditeur) ; la quote-part de décembre avait été de 88~F (f.~58~v\textsuperscript{o}).
sources:
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV, « The Romance of Finance », p. 39-62.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 69.
