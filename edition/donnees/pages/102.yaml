historique: |
  Le tailleur Carluvant (ou Carlumont) est sans doute le logeur du 1, route de Léalvillers, où Hippolyte Combes loge depuis le 5 novembre (voir f.~47~r\textsuperscript{o}) ; il annoncera le 1\textsuperscript{er} janvier 1917 devoir quitter la maison (voir f.~59~r\textsuperscript{o}). La course du 23 mène au nord-ouest, vers la vallée de l'Authie : Amplier (Pas-de-Calais) est à une douzaine de kilomètres d'Acheux, Authieule aux portes de Doullens. Authie avait abrité au 1\textsuperscript{er} juillet l'un des deux centres opératoires avancés de la bataille (OH 1916-I, p.~282). Il s'agit sans doute de chercher la paille et le fourrage des fermes, sa mission depuis le 2 novembre.
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 282.
