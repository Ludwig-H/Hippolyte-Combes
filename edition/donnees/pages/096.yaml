historique: |
  Forceville, à 2~km à l'est d'Acheux, abrite alors des brigades de la 51\textsuperscript{st} (Highland) Division, dont la 152\textsuperscript{nd} partira le 12 au soir pour l'assaut de Beaumont-Hamel (OH~\mbox{1916-II}, p.~480--491). La route d'Albert traverse Varennes, où sont installés depuis octobre les 4\textsuperscript{th} et 11\textsuperscript{th} \textit{Casualty Clearing Stations} (LLT), et Senlis-le-Sec, QG du II~Corps (LLT). La Mission d'Albert paiera encore Hippolyte Combes le 18 (f.~50~r\textsuperscript{o}). La 152 Coy cantonne toujours sur le plateau d'Albert ; la 18\textsuperscript{th} Division tient le secteur de Regina Trench (Nichols 1922, p.~133--136). La pleine lune tombe le 9 (Espenak). Albert est bombardé, comme les 24 et 31~octobre (voir f.~43~r\textsuperscript{o} et f.~44~v\textsuperscript{o}), alors que le guide Michelin le dit hors de portée dès octobre 1916 (Michelin 1919, p.~31--35).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 480-491.
- Baker, C., The Long, Long Trail, « Locations of British Casualty Clearing Stations » (copie Wayback Machine du 13 janvier 2018) et « The British II Corps in France and Flanders » (copie Wayback Machine du 6 novembre 2024).
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 133-136.
- 'Espenak, F., Six Millennium Catalog of Phases of the Moon, table « Phases of the Moon : 1901 to 2000 » (astropixels.com).'
- Michelin, The Somme, vol. 1, The First Battle of the Somme (1916-1917), Clermont-Ferrand, Michelin, 1919, p. 31-35.
