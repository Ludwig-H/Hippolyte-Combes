critique: Deux journées séparées par un filet ; rien n'est noté pour le 21 ni pour le 23, et la page fait suite au f.~56~r\textsuperscript{o} (19-20 décembre). Chaque série de comptes est ouverte par une équerre en marge gauche.
historique: |
  Senlis-le-Sec est alors le siège du QG du IV Corps (LLT, IV Corps) ; le Quesnoy est vraisemblablement l'écart de ce nom à Puchevillers (IGN). Beauquesne, où dîne le capitaine, avait accueilli le QG avancé de Haig au château de Valvion (OH 1916-I, p.~304). La réparation ne tient pas : le 28, Hippolyte Combes envoie le lorgnon à l'opticien Imbert, à Paris (f.~58~r\textsuperscript{o} et 61~r\textsuperscript{o}). Les œufs au plat d'Authie coûtent deux fois le prix des œufs de ferme de septembre (voir f.~21~r\textsuperscript{o}). Mme Cuisinier tient à Louvencourt une ferme où une machine endommagée sera expertisée le 2 janvier (f.~59~r\textsuperscript{o}). \textit{Bloody} est un juron grossier : le mot avait fait scandale sur la scène londonienne de \textit{Pygmalion} le 11 avril 1914 (Wikipédia). Rapporter le mot du jeune capitaine Williams (voir f.~53~v\textsuperscript{o}) au bureau de la Mission, c'était s'exposer à ces « heurts désagréables » dont les interprètes « sont toujours les victimes » (Fernand-Laurent 1917, p.~225-234). Sur la lettre du 17, voir f.~57~r\textsuperscript{o}.
