historique: |
  La réparation du lorgnon ne tient pas : le 28, Hippolyte Combes l'envoie sans doute à l'opticien Imbert, à Paris (ff.~58~r\textsuperscript{o} et 61~r\textsuperscript{o}). M\textsuperscript{me} Cuisinier tient à Louvencourt une ferme où une machine endommagée sera expertisée le 2~janvier (f.~59~r\textsuperscript{o}). \textit{Bloody} est un juron grossier : le mot avait fait scandale à Londres dans \textit{Pygmalion}, le 11~avril 1914 (Wikipédia). Rapporter le mot du capitaine Williams au bureau de la Mission, c'était risquer ces « heurts désagréables » dont les interprètes « sont toujours les victimes » (Fernand-Laurent 1917, p.~225--234). Sur la lettre du 17, voir f.~57~r\textsuperscript{o} ; sur Senlis-le-Sec, le Quesnoy et Beauquesne, voir ff.~55~r\textsuperscript{o}, 55~v\textsuperscript{o} et 56~r\textsuperscript{o}.
