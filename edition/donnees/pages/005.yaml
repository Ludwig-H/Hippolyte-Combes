historique: |
  Le changement de cantonnement annoncé au f. 1 v\textsuperscript{o} est la marche de la 54th Brigade vers l'ouest de Bailleul. Le 7th Bedfordshire part à 9 h et gagne le « Steam Mill W of Bailleul » par Hazebrouck, Borre, Pradelles, Strazeele et Moolenacker, \textit{« a very hot day which tired the men severely »} (JMO 7/Bedf, 28 juill. 1916). Le convoi suit sans doute la même route. La ferme d'arrivée est vraisemblablement près de Saint-Jans-Cappel (voir f. 3 r\textsuperscript{o}), à 22 km de Lynde à vol d'oiseau (OSM). Mme Donse (lecture incertaine), sa logeuse à Lynde, n'est pas identifiée. Le \textit{groom} est le soldat chargé du cheval d'un officier monté (Fernand-Laurent 1917, p.~64) ; sans doute déjà Connelly (voir f. 6 r\textsuperscript{o}).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1607 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet 1916 (28 juill.).'
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 64.
- OpenStreetMap / Nominatim, distances à vol d'oiseau entre chefs-lieux.
