critique: Encre violette. La première ligne du récit, qui renvoie à la soirée du 27 juillet, est glissée en retrait sous l'en-tête ; un blanc d'environ trois lignes et un filet presque pleine largeur séparent le récit des comptes. Un pâté d'encre couvre le milieu de « gouttelettes », et hampes et jambages débordent souvent sur la ligne voisine.
historique: |
  Le « changem de cantonnement » annoncé pour le 28 (voir f. 1 v\textsuperscript{o}) est la marche de la 54th Brigade des environs de Wallon-Cappel vers l'ouest de Bailleul : le 7th Bedfordshire part à 9 h et gagne le « Steam Mill W of Bailleul » par Hazebrouck, Borre, Pradelles, Strazeele et Moolenacker, \textit{« a very hot day which tired the men severely »} (JMO 7/Bedf, 28 juill. 1916). Le convoi, parti une demi-heure plus tôt, suit sans doute le même axe ; la ferme d'arrivée est vraisemblablement aux abords de Saint-Jans-Cappel, où Hippolyte Combes demeure jusqu'au 5 août (voir f. 3 r\textsuperscript{o}), à quelque 22 km à vol d'oiseau de Lynde (OSM). La division relève désormais de la Second Army de Plumer, qui reçoit le 31 juillet les chefs de bataillon de la brigade (JMO 7/Bedf, 31 juill. 1916). Mme « Donze », logeuse d'Hippolyte Combes à Lynde (« Lind »), n'est pas identifiée, et la lecture du nom reste incertaine. Le \textit{groom} est le soldat chargé du cheval d'un officier monté (Fernand-Laurent 1917, p.~64) ; c'est sans doute déjà Connelly, nommé au f. 6 r\textsuperscript{o}.
