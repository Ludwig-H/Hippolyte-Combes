historique: |
  Les \textit{dug-outs} et les tranchées que longe le petit chemin de Puchevillers sont peut-être, comme les champs de barbelés et de tranchées vus près de Toutencourt le 27 février (voir f.~80 r\textsuperscript{o}), des ouvrages creusés avant le 1\textsuperscript{er} juillet 1916 pour les répétitions d'assaut, que l'histoire officielle dit aménagées « dans les zones arrière », au grand mécontentement des cultivateurs (OH 1916-I, p.~262, n.~1) ; il peut aussi s'agir de lignes de défense arrière. Varennes, à moins de 3~km au sud d'Acheux, abrite encore trois hôpitaux d'évacuation, les 4th et 11th CCS depuis octobre 1916 et la 47th depuis décembre ; la notice du CWGC dit le village « déserté » en mai 1917 (LLT ; CWGC). Combes y était venu dès novembre 1916, au temps du bureau d'Acheux (f.~48 v\textsuperscript{o}) ; la famille Mortreux, qu'il « revoit » avec plaisir, n'est pas identifiée. Les soirées chez les Denis (voir f.~89 r\textsuperscript{o}) se poursuivent jusqu'à l'annonce, le 28, d'un départ prochain (f.~92 v\textsuperscript{o}).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 262, n. 1.
- The Long, Long Trail (C. Baker), « Locations of British Casualty Clearing Stations », copie Wayback du 13 janv. 2018.
- Commonwealth War Graves Commission, notice historique de Varennes Military Cemetery (consultée le 18 oct. 2026).
