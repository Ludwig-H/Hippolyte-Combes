historique: |
  Les \textit{dug-outs} et les tranchées du chemin de Puchevillers sont peut-être, comme les tranchées vues près de Toutencourt le 27~février (voir f.~80~r\textsuperscript{o}), des ouvrages creusés avant le 1\textsuperscript{er}~juillet 1916 pour les répétitions d'assaut, aménagés « dans les zones arrière » au grand mécontentement des cultivateurs (OH~\mbox{1916-I}, p.~262, n.~1), ou des lignes de défense arrière. Varennes, à moins de 3~km au sud d'Acheux, abrite encore trois hôpitaux d'évacuation, les 4\textsuperscript{th}, 11\textsuperscript{th} et 47\textsuperscript{th} CCS ; le village est « déserté » en mai 1917 (LLT ; CWGC). Hippolyte Combes y était venu dès novembre 1916 (f.~48~r\textsuperscript{o}) ; la famille Mortreux n'est pas identifiée.
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 262, n. 1.
- The Long, Long Trail (C. Baker), « Locations of British Casualty Clearing Stations », copie Wayback du 13 janv. 2018.
- Commonwealth War Graves Commission, notice historique de Varennes Military Cemetery (consultée le 18 oct. 2026).
