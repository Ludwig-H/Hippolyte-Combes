historique: |
  La canonnade des nuits du 21 et du 22, entendue d'Hérissart à quelque 39~km d'Arras, est sans doute la préparation d'artillerie de la deuxième bataille de la Scarpe : la Third Army attaque le 23 à 4~h~45 sur une quinzaine de kilomètres, de Croisilles, au sud-est d'Arras, à Gavrelle (OH 1917-I, p.~378 sq.). Les 78~f~75 touchés à Toutencourt, à 3~km d'Hérissart, sont le dernier des dix-neuf versements de solde notés dans le carnet, soit quinze jours à 5~f~25 (voir f.~88 v\textsuperscript{o}). La paille introuvable tient peut-être à l'épuisement des réserves des fermes à la fin de l'hiver. Le guide d'« A. Martin » est vraisemblablement celui d'Alexis Martin (1834-1904), \textit{Une visite à Amiens}, Paris, Hennuyer, 1896, dont Combes cite le titre de façon approximative (BnF) ; à 2~f~75, la « gde carte » est bien plus chère qu'une carte postale. « B\textsuperscript{te} Denis » appartient sans doute à la famille d'Hérissart chez qui Combes passe ses soirées (voir f.~89 r\textsuperscript{o}). Sur l'\textit{anti-aircraft}, l'« Archie » des Britanniques, voir f.~73 r\textsuperscript{o}.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 378 sq.
- Martin, A., Une visite à Amiens. Historique. La ville haute, la ville basse, les faubourgs. Hommes célèbres nés en Picardie, Paris, A. Hennuyer, 1896 (BnF, notice de la réédition La Vague verte, 2016, ark:/12148/cb450737666).
