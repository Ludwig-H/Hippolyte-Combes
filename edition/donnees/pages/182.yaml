historique: |
  La canonnade notée à partir de la nuit du 20 au 21 précède la deuxième bataille de la Scarpe : les nuits du 21 et du 22, Allenby fait tirer des obus à gaz, surtout lacrymogènes, sur les batteries, les abris et les chemins creux allemands ; le 23 à 4~h~45, la Third Army et, à sa gauche, le XIII~Corps de la First Army attaquent sur une quinzaine de kilomètres, de Croisilles, au sud-est d'Arras, à Gavrelle (OH~\mbox{1917-I}, p.~382--383). Hérissart est à 39~km environ d'Arras. Les 78,75~F touchés à Toutencourt, à 3~km d'Hérissart, sont la dernière solde notée dans le carnet : sans doute quinze jours à 5,25~F (voir f.~88~v\textsuperscript{o}). Le guide d'« A. Martin », au titre cité de façon approximative, est sans doute \textit{Une visite à Amiens} d'Alexis Martin (Paris, Hennuyer, 1896 ; BnF). « B\textsuperscript{te} Denis » est sans doute de la famille d'Hérissart chez qui Hippolyte Combes passe ses soirées (voir f.~89~r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 382-383.
- Martin, A., Une visite à Amiens. Historique. La ville haute, la ville basse, les faubourgs. Hommes célèbres nés en Picardie, Paris, A. Hennuyer, 1896 (BnF, notice de la réédition La Vague verte, 2016, ark:/12148/cb450737666).
