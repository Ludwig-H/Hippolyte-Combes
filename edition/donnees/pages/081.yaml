historique: |
  Le soleil et la « bise glaciale » du 20 concordent avec l'histoire officielle : « un jour de pluie fut suivi de soleil le 20, quand un grand vent sécha un peu la boue » (OH 1916-II, p.~462). Le « duel d'artillerie formidable » est la préparation de l'attaque que le II Corps lance le lendemain, 21 octobre, à 12~h~06, sur Regina et Stuff Trenches, sur près de 5~000 yards. Elle est appuyée par 200 pièces lourdes et l'artillerie de campagne de sept divisions (OH 1916-II, p.~463). L'infanterie des 4th Canadian, 18th, 25th et 39th Divisions y prend part. Dans la 18th Division, la 53rd Brigade (10th Essex, 8th Norfolk) enlève sa part de Regina Trench : 250 Allemands sont tués, 6 officiers et 309 hommes faits prisonniers (Nichols 1922, p.~131). Ces tranchées courent sur la crête au nord de Courcelette et de Thiepval, à quelques kilomètres au nord-est du camp. La « colline » et le « plateau voisin » sont ceux des briqueteries au nord d'Albert, où bivouaque la compagnie (voir f.~40~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 462-463.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 131.
