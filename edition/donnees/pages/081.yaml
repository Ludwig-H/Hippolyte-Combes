historique: |
  Le soleil et le vent froid du 20 concordent avec l'histoire officielle : après un jour de pluie, « un grand vent sécha un peu la boue » (OH 1916-II, p.~462). Le « duel d'artillerie » prépare l'attaque du II Corps du 21 octobre, à 12~h~06, sur Regina et Stuff Trenches, sur la crête au nord de Courcelette et de Thiepval. Elle est appuyée par 200 pièces lourdes et l'artillerie de campagne de sept divisions (OH 1916-II, p.~463). Dans la 18th Division, la 53rd Brigade (10th Essex, 8th Norfolk) prend sa part de Regina Trench et fait prisonniers 6 officiers et 309 hommes (Nichols 1922, p.~131). La « colline » est celle des briqueteries au nord d'Albert (voir f.~40~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 462-463.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 131.
