critique: La dépense est isolée tout au bas de la page, après un large blanc.
historique: |
  Les « Bedfords » sont le 7th Bedfordshire (54th Brigade), cantonné à La Thieuloye, à 3,6 km de Marquay (voir f. 14 v\textsuperscript{o}) ; ses deux voitures devaient prendre livraison du fourrage vert (voir f. 9 v\textsuperscript{o}). Ce même après-midi, le bataillon s'exerce dans la zone « C » au creusement intensif et à suivre un barrage, et ne rentre que vers 19 h ; le jour même lui parvient l'ordre d'opérations n° 29 : départ le lendemain, la division devant passer à la Reserve Army à minuit le 10/11 (JMO 7/Bedf, 8 sept. 1916). Ces préparatifs expliquent peut-être la défection des voitures. Le « clair de lune superbe » est celui d'une lune gibbeuse éclairée à 88 %, trois jours avant la pleine lune du 11 septembre (Espenak ; calcul PyEphem). « Ryonval » et la « ferme Collet » ne sont pas localisés. La poudre dentifrice est vraisemblablement la poudre phéniquée de Calvert (Manchester), qu'Hippolyte Combes achète ensuite en boîte aux cantines britanniques, à 60 c à Louvencourt le 2 janvier 1917 (voir f. 59 r\textsuperscript{o}).
