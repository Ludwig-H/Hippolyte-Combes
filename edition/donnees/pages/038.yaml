historique: |
  Les « Bedfords » sont le 7th Bedfordshire, cantonné à La Thieuloye (voir f. 14 v\textsuperscript{o}) ; leurs voitures devaient prendre le fourrage vert (voir f. 9 v\textsuperscript{o}). Cet après-midi-là, le bataillon s'exerce au creusement ; il reçoit l'ordre d'opérations n° 29 : départ le lendemain, la division passant à la Reserve Army à minuit le 10/11 (JMO 7/Bedf, 8 sept. 1916). D'où peut-être l'absence des voitures. La lune est à trois jours de son plein, le 11 septembre (Espenak). « Ryonval » et la ferme Collet ne sont pas localisés. La poudre dentifrice est sans doute celle de Calvert (Science Museum Group), qu'Hippolyte Combes achète encore à 60 c le 2 janvier 1917 (voir f. 59 r\textsuperscript{o}).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre 1916, avec l''ordre d''opérations n° 29 (transcription en ligne).'
- Espenak, Fred, Six Millennium Catalog of Phases of the Moon, table 1901-2000 (astropixels.com).
- Science Museum Group, notice « F C Calvert and Company 1859-1965 » ; Grace's Guide, « F. C. Calvert and Co ».
