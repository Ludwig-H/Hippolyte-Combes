  \centre Au 30 avril 1917
  \filet[c]{0.40}
apparat: []
critique: |
  Titre et dates semblent tracés d'un seul jet, donc après le 30~avril 1917.
historique: |
  Le titre reprend un terme de comptabilité : le « livre-journal » est le registre que tout commerçant doit tenir « jour par jour » (Code de commerce, 1807, art.~8). Le carnet en garde sans doute la forme : chaque journée donne le récit puis, sous un filet, les dépenses (voir f.~1~r\textsuperscript{o}). Hippolyte Combes tenait aussi un « Journal » sur feuilles volantes, auquel il renvoie le 4~février 1917 (f.~71~r\textsuperscript{o}). Le 25~juillet 1916 vient deux jours après l'arrivée en Flandre de la 54\textsuperscript{th} Brigade, venue de la Somme et débarquée à Arques le 23 au soir (JMO~7/Bedf, juill. 1916). Le 30~avril 1917, dernier jour du carnet (f.~93~r\textsuperscript{o}), il est au service d'achats d'Hérissart (Somme) ; la division vient de partir pour Arras (JMO~7/Bedf, 26--28~avr. 1917).
sources:
