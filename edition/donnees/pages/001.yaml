apparat: []
critique: 'Plat supérieur de la couverture : dans le haut, papier rouge gaufré à losanges, déchiré à l''angle supérieur droit ; au-dessous, sur toute la largeur, papier bleu qui porte l''inscription, à l''encre violet foncé, d''une écriture posée et calligraphiée qui garde les formes d''Hippolyte Combes. Titre et dates sont de la même encre et du même module : l''inscription a sans doute été tracée d''un seul jet, donc une fois le carnet clos, après le 30 avril 1917.'
historique: |
  L'intitulé emprunte un terme de la comptabilité commerciale : le « livre-journal » est le registre que le Code de commerce impose à tout commerçant de tenir « jour par jour » (Code de commerce, 1807, art. 8). Le carnet en a sans doute la double nature : chaque journée y juxtapose le récit et, sous un filet, les dépenses du jour (voir f. 1 r\textsuperscript{o}). Hippolyte Combes tenait par ailleurs un autre « Journal », sur feuilles volantes, auquel il renvoie le 4 février 1917 (f. 71 r\textsuperscript{o}). La borne initiale, le 25 juillet 1916, tombe deux jours après l'arrivée en Flandre de la 54th Brigade, débarquée à Arques le 23 juillet au soir et cantonnée autour de Wallon-Cappel (Nord) au sortir de la Somme (Beds War Diary, juill. 1916). La borne finale, le 30 avril 1917, est la dernière journée du carnet (f. 93 r\textsuperscript{o}) : Hippolyte Combes, alors attaché au service d'achats d'Hérissart (Somme), y parcourt les villages voisins, tandis que la division vient de partir pour Arras (JMO 7/Bedf, 26-28 avr. 1917).
sources:
- Code de commerce, Paris, 1807, livre I, titre II « Des livres de commerce », art. 8.
- 'Bedfordshire Archives Service (Bedford), X550/8/1/1607 et 1607b : War Diary, 7th (Service) Battalion Bedfordshire Regiment (54th Infantry Brigade, 18th Division), juillet 1916 (cité « Beds War Diary »).'
