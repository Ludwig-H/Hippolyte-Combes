critique: Page écrite en travers du carnet. Le récit du mardi 17 se poursuit f.~39~r\textsuperscript{o}.
historique: |
  Le franc de la chambre de Beauval (voir f.~37~v\textsuperscript{o}) est le tarif du lit d'officier logé chez l'habitant, 1~F par nuit selon le décret de 1877 (Fernand-Laurent 1917, p.~225--234) ; Hippolyte Combes semble l'avoir payé lui-même. Le \textit{groom} est le soldat qui soigne le cheval d'un officier monté (Fernand-Laurent 1917, p.~64) ; c'est sans doute Connelly (voir f.~37~v\textsuperscript{o}). La 54\textsuperscript{th} Brigade, que sert la 152\textsuperscript{nd} Company, a passé la nuit au bois de Vadencourt (voir f.~38~r\textsuperscript{o}) et gagne Bouzincourt le 17 (JMO~7/Bedf, 17~oct. 1916 ; Wyrall, p.~319). L'histoire officielle note le beau temps du 16 et de la matinée du 17, et une lune proche de son dernier quartier (OH~\mbox{1916-II}, p.~444).
