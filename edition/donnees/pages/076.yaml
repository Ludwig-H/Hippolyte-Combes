critique: Page écrite en travers. Les comptes du lundi 16, disposés en deux colonnes, sont séparés par un filet de l'entrée du mardi 17, dont le récit se poursuit f.~39 r\textsuperscript{o}.
historique: |
  L'étape suit celle de la 54th Brigade, que sert la 152nd Company : le 7th Bedfordshire, parti de Beauval, passe la nuit du 16 au bois de Vadencourt, à l'ouest de Warloy, après une marche de 13 milles, et gagne Bouzincourt le 17 (JMO 7/Bedf, 16--17 oct. 1916 ; Wyrall, p.~319). Le franc de la chambre de Beauval est le tarif de l'indemnité de logement due à l'habitant pour un lit d'officier, 1~F par nuit selon le décret de 1877 (Fernand-Laurent 1917, p.~225--234) ; Hippolyte Combes paraît l'avoir réglée lui-même. Le \textit{groom} est le soldat qui soigne le cheval d'un officier monté (Fernand-Laurent 1917, p.~64) : sans doute Connelly, « mon groom » (f.~6 r\textsuperscript{o}), qui reçoit d'Hippolyte Combes 1 ou 2~F à intervalles réguliers. Warloy-Baillon, à 8~km du front du 1\textsuperscript{er} juillet, abritait des ambulances de campagne (CWGC). Le beau temps du 16, « definitely fine », et la belle matinée du 17 sont ceux de l'histoire officielle, qui note la lune proche de son dernier quartier (OH 1916-II, p.~444).
