critique: Les deux lignes de comptes du pied de page sont séparées du récit par un filet tiré sur toute la largeur et réunies par une grande accolade.
historique: |
  Le cimetière de Millau abrite le caveau de famille des Combes, où reposent le père d'Hippolyte, avocat mort à Millau le 11 août 1899, et sa sœur Joséphine, morte à Nogent-le-Rotrou en octobre 1914 et dont le corps y fut ramené (\textit{PC-Bio} ; voir f.~70~v\textsuperscript{o}). « Pierre » est sans doute Pierre Calmels, frère de Marguerite, qui l'avait déjà attendu à la gare le 3 février (f.~69~v\textsuperscript{o} ; tradition familiale, \textit{PC-Annexe}). Les « enfants Vincens » sont ceux de Madeleine Calmels, sœur aînée de Marguerite, et du Dr Fernand Vincens, médecin à Saint-Chély-d'Apcher (Lozère) : Germaine, qui aura six ans en octobre 1917, et Robert (\textit{PC-Annexe}). Le train « venant Beziers » est celui de la ligne des Causses (Béziers–Neussargues, Compagnie du Midi), par Sévérac-le-Château, Marvejols, Saint-Chély-d'Apcher et le viaduc de Garabit, bâti en 1881-1884 par Boyer et Eiffel (Baedeker 1914, p.~282-284) ; aucune de ces stations n'est nommée. La neige est celle de la vague de froid du 16 janvier au 16 février 1917 (Barbé 1917, p.~181).
sources:
- Pierre Combes, « Mon grand-père Hippolyte Combes (et ses sœurs) », dactylogramme, archives familiales [PC-Bio].
- Pierre Combes, livre familial dactylographié, annexe 2, « Les Calmels », archives familiales [PC-Annexe].
- Baedeker, K., Southern France including Corsica. Handbook for Travellers, 6e éd., Leipzig, K. Baedeker, 1914, p. 282-284.
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
