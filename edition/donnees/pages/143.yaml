historique: |
  Le cimetière de Millau abrite le caveau Combes, où reposent son père et sa sœur Joséphine, dont le corps y fut ramené de Nogent-le-Rotrou (\mbox{PC-Bio} ; voir f.~70~v\textsuperscript{o}). « Pierre » est sans doute Pierre Calmels, frère de Marguerite, qui l'avait déjà attendu à la gare le 3~février (f.~69~v\textsuperscript{o} ; PC-Annexe). Les « enfants Vincens » sont sans doute Germaine (voir f.~70~v\textsuperscript{o}) et Robert, enfants de Madeleine Calmels, sœur aînée de Marguerite, et du D\textsuperscript{r} Fernand Vincens, médecin à Saint-Chély-d'Apcher (Lozère) (PC-Annexe). Le train « venant Beziers » est celui de la ligne des Causses (Béziers–Neussargues, Compagnie du Midi), par Sévérac-le-Château, Marvejols, Saint-Chély-d'Apcher et le viaduc de Garabit (Baedeker 1914, p.~282--284).
sources:
- Pierre Combes, livre familial dactylographié, annexe 2, « Les Calmels », archives familiales [PC-Annexe].
- Baedeker, K., Southern France including Corsica. Handbook for Travellers, 6e éd., Leipzig, K. Baedeker, 1914, p. 282-284.
- Pierre Combes, « Mon grand-père Hippolyte Combes (et ses sœurs) », dactylogramme, archives familiales [PC-Bio].
