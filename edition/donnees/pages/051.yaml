critique: Suite du 25 septembre commencé sur la page précédente (f.~25 v\textsuperscript{o}). Encre violette uniforme ; après la l.~16, environ quatre lignes laissées en blanc, puis deux lignes au bas de la page qui appartiennent à la nuit du 25 au 26.
historique: |
  Le « petit train départemental » mène Combes à Gézaincourt, au sud-ouest de Doullens, où la voie métrique rejoint la ligne du Nord (voir f.~25 v\textsuperscript{o}). Les trains spéciaux de permissionnaires circulent depuis l'automne 1915 ; le seul réseau du Nord en fait rouler 11 800 en 1916 (Lafon 1922, p.~105, 153). À Paris, il prendra un billet de deuxième classe à quart de place (voir f.~27 r\textsuperscript{o}). Longueau, au sud-est d'Amiens, est le nœud de la ligne Creil--Clermont--Longueau, grande artère du front de la Somme (Lafon 1922, p.~115). « Taube », nom du monoplan allemand du début de la guerre, désigne alors tout avion allemand (Fraser et Gibbons 1925, s.v.) ; les obus « ds les airs » et les projecteurs sont ceux de la défense antiaérienne. Ce raid nocturne n'a pas été retrouvé dans les sources consultées. Creil et Le Bourget sont les deux grandes gares régulatrices des armées françaises de la Somme (Lafon 1922, p.~99, 115) ; c'est au Bourget que Combes devra descendre au matin (voir f.~26 v\textsuperscript{o}).
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 99, 105, 115, 153.
- Fraser, E., et Gibbons, J., Soldier and Sailor Words and Phrases, London, Routledge, 1925, s.v. « Taube ».
