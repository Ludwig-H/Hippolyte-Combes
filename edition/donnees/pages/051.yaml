historique: |
  Les trains spéciaux de permissionnaires circulent depuis l'automne 1915 ; le réseau du Nord en fait rouler 11 800 en 1916 (Lafon 1922, p.~105, 153). Longueau, au sud-est d'Amiens, est le nœud de la ligne Creil--Clermont--Longueau, grande artère du front de la Somme (Lafon 1922, p.~115). Les obus et les projecteurs sont ceux de la défense antiaérienne. Ce raid de nuit n'a pas été retrouvé dans les sources consultées. Creil et Le Bourget sont les deux grandes gares régulatrices des armées françaises de la Somme (Lafon 1922, p.~99, 115). Hippolyte Combes descend au Bourget au matin (voir f.~26 v\textsuperscript{o}).
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 99, 105, 115, 153.
