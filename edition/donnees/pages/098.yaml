critique: |
  Le lundi 13 n'a pas d'entrée ; « Tout hier » (l.~13) s'y rapporte.
historique: |
  Le lundi 13 s'ouvre la bataille de l'Ancre : la 51\textsuperscript{st} (Highland) Division prend Beaumont-Hamel, à 9~km à l'est d'Acheux, et la 63\textsuperscript{rd} (Royal Naval) Division atteint les abords de Beaucourt, enlevé le 14 ; on compte plus de 7~200 prisonniers (Haig 1919, p.~49--51 ; OH~\mbox{1916-II}, p.~476--505). Les blessés vont aux hôpitaux d'évacuation de Varennes, Contay, Puchevillers et Gézaincourt, ou aux hôpitaux stationnaires de Doullens (OH~\mbox{1916-II}, p.~541). La course du 12 mène sans doute à Beauquesne, QG avancé de Haig (voir f.~38~r\textsuperscript{o}). La « belle église » de Frévent est Saint-Hilaire (Mérimée PA00108287) ou Saint-Vaast, seule signalée en 1909 (Baedeker 1909, p.~22). Les interprètes portaient le képi « ou le nouveau casque — également khaki » (Fernand-Laurent 1917, p.~\textsc{xiii}).
sources:
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), Londres, Dent, 1919, p. 49-51.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 476-505, 541.
- Ministère de la Culture, base Mérimée, PA00108287 (église Saint-Hilaire, Frévent).
- Baedeker, K., Northern France from Belgium and the English Channel to the Loire, excluding Paris and its Environs, 5e éd., Leipzig, Baedeker, 1909, p. 22.
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, préface de F. de Tessan, p. XII-XIII.
