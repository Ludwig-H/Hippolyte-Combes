critique: 'Encre violette pour la journée du dimanche 12 ; encre noire virée au brun pour les comptes du 12, le filet et toute la journée du mardi 14 : les dépenses du 12 ont été portées en même temps que le texte du 14. Le lundi 13 n''a pas d''entrée propre et n''est évoqué que par « Tout hier ». La photographie coupe le bord droit du feuillet, où se perdent la fin de « Beauquesne » et de « petits ».'
historique: |
  Le lundi 13 à 5~h~45 s'ouvre la bataille de l'Ancre : la 51st (Highland) Division prend Beaumont-Hamel, à 9~km à l'est d'Acheux, et la 63rd (Royal Naval) Division atteint les abords de Beaucourt, enlevé le 14 ; les prisonniers dépassent 7~200 (Haig 1919, p.~49--51 ; OH 1916-II, p.~476--505). Les blessés gagnent les hôpitaux d'évacuation de la Fifth Army, à Varennes (voir f.~48~v\textsuperscript{o}), Contay, Puchevillers et Gézaincourt, ou l'un des deux hôpitaux stationnaires de Doullens, dont l'un est prêté par la Third Army « pour les opérations de l'Ancre » (OH 1916-II, p.~541). La course du 12 mène par Varennes et Contay à Beauquesne, siège du QG avancé de Haig (voir f.~38~r\textsuperscript{o}). À Frévent (Pas-de-Calais), l'église Saint-Hilaire, des XVI\textsuperscript{e}--XIX\textsuperscript{e} siècles, est classée depuis 1982 (Mérimée PA00108287). Vêtus de kaki, les interprètes portaient le képi « ou le nouveau casque — également khaki » (Fernand-Laurent 1917, p.~XIII). À 7~F, le déjeuner de l'hôtel d'Amiens est le plus cher des repas notés hors des permissions.
sources:
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), London, Dent, 1919, p. 49-51.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 476-505, 541.
- Ministère de la Culture, base Mérimée, PA00108287 (église Saint-Hilaire, Frévent).
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, préface de F. de Tessan, p. XII-XIII.
