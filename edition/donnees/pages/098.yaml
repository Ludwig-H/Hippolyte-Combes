date: Dimanche 12 et mardi 14 novembre 1916
mois: Novembre 1916
lieux: Acheux-en-Amiénois, Varennes, Contay, Beauquesne ?, Raincheval et Doullens (Somme) ; Frévent (Pas-de-Calais)
titre: Course à Beauquesne (?) ; bombardement vers Beaumont ; Doullens et Frévent
transcription: |
  \sl{Dim. 12.} \hfill \sl{Novembre 1916}
  \ind assz belle journée. Matin & soir, brouillard
  Routes mauvaises. Sol mou, pétri & sillons
  profonds par les innombrables véhicules \add{lourds} qui
  le labourent
  \ind Matin, liberté complète –
  \ind Après-midi, Course en auto à Beauq\lac
  par Varennes & Contay. Brume s'est levée
  peu à peu. Paysage anglais. Arbre étriqués
  Feuillages jaune marron semant la route
  \blanc{1}
  \crochet{2}Journal semaine : 40 c
  Casque peint khaki : 1^{f} —
  \filet
  \sl{14 Ma^{rdi}} — Tout hier, et principt matin, ainsi
  \ind qu'auj'dhui, très fort bombardt — du
  Côté de Beaumont Vu passer de x blessés
  transportés s/ fourgons, \del{\inc{autos}} & cars —
  \ind Courses à Raincheval, Doullens et Frévent
  Partis 8^{h} \fr{1}{2} m., rentrés 5^{h} soir.
  ciel nuageux – pluie menacé tt le jour.
  A Doullens, grande foire
  \ind A Frévent, promené passim — Petite
  ville assz coquette belle église, \inc{catéchumènes} & un \inc{camion} —
  — Boutons simili cuir : 4^{f} 75 (10 \add{0.40} \inc{gd}, 3 \add{0.25} petit\lac
  \crochet{2}Cartes ple : 40c – 1 50 et 10c
  Déjeuner à l'hôtel d'Amiens, ma part : 7 fr
