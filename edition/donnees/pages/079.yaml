critique: Page écrite en travers ; fin du récit du 18~octobre commencé f.~39~v\textsuperscript{o}.
historique: |
  La route qui longe le camp (voir f.~39~r\textsuperscript{o}) est sans doute celle d'Albert à Doullens, qui passe à Hédauville (CWGC, Hedauville Communal Cemetery Extension). Le trafic est celui de la préparation de l'attaque du II~Corps sur Regina et Stuff Trenches, alors prévue pour le 20~octobre (OH~\mbox{1916-II}, p.~461). Les 84~F touchés à la Mission française d'Albert sont la « solde \& indemnité de fonctions » de l'interprète (voir f.~11~r\textsuperscript{o}). La plupart des soldes se comptent à 5,25~F par jour : 78,75~F la quinzaine, 84~F pour les seize derniers jours des mois de 31~jours (18~août, 19~décembre, 19~janvier : ff.~11~r\textsuperscript{o}, 56~r\textsuperscript{o}, 62~v\textsuperscript{o}), 68,25~F pour les treize derniers jours de février (f.~78~r\textsuperscript{o}). Ces 84~F paient donc sans doute les jours du 16 au 31~octobre. Le compte ne vaut pas toujours : 80,30~F le 4~août, 58,75~F et 30~F retenus le 2~novembre, 88~F le 18, 82~F le 18~mars (ff.~5~r\textsuperscript{o}, 46~r\textsuperscript{o}, 50~r\textsuperscript{o}, 85~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 461.
- Commonwealth War Graves Commission, notice « Hedauville Communal Cemetery Extension », cwgc.org, consultée le 18 oct. 2026.
