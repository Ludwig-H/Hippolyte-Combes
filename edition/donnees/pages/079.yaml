critique: Page à l'encre violette, écrite en travers, qui achève le récit du 18 octobre commencé f.~39~v\textsuperscript{o}. Un large blanc sépare le récit du compte de la journée, placé au pied de la page sous un filet tiré sur toute la largeur.
historique: |
  La route qui longe le camp, entre Bouzincourt et Hédauville (voir f.~39~r\textsuperscript{o}), est sans doute celle d'Albert à Doullens, qui passe à Hédauville, à 5~km au nord-ouest d'Albert (CWGC, Hedauville Communal Cemetery Extension) : elle relie la ville à l'arrière. Le trafic noté par Hippolyte Combes est celui de la préparation de l'attaque du II Corps sur Regina et Stuff Trenches, alors prévue pour le 20 octobre et remise au 21 (OH 1916-II, p.~461) ; la 18th Division a ouvert un QG avancé à Albert le 14 octobre (JMO 7/Bedf, 14 oct. 1916). Les 84~F touchés au bureau de la Mission française d'Albert sont la « solde \& indemnité de fonctions » de l'interprète (voir f.~11~r\textsuperscript{o}). Ils font 16 jours à 5,25~F. Les versements de la seconde moitié des mois de 31 jours sont aussi de 84~F (18 août, 19 décembre, 19 janvier) ; celui du 18 février, pour un mois de 28 jours, est de 68,25~F, soit 13 jours (f.~11~r\textsuperscript{o}, 56~r\textsuperscript{o}, 62~v\textsuperscript{o}, 78~r\textsuperscript{o}). Il s'agit donc sans doute de la quinzaine du 16 au 31 octobre.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
- Commonwealth War Graves Commission, notice « Hedauville Communal Cemetery Extension », cwgc.org, consultée le 18 oct. 2026.
