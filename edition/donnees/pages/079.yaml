critique: Page écrite en travers ; fin du récit du 18~octobre commencé f.~39~v\textsuperscript{o}.
historique: |
  La route qui longe le camp (voir f.~39~r\textsuperscript{o}) est sans doute celle d'Albert à Doullens, qui passe à Hédauville (CWGC, Hedauville Communal Cemetery Extension). Le trafic est celui de la préparation de l'attaque du II~Corps sur Regina et Stuff Trenches, alors prévue pour le 20~octobre (OH~\mbox{1916-II}, p.~461). Les 84~F touchés à la Mission française d'Albert sont la « solde \& indemnité de fonctions » de l'interprète (voir f.~11~r\textsuperscript{o}), soit 16~jours à 5,25~F. Les versements de la seconde moitié des mois de 31~jours sont aussi de 84~F (18~août, 19~décembre, 19~janvier), celui du 18~février, pour un mois de 28~jours, de 68,25~F, soit 13~jours (ff.~11~r\textsuperscript{o}, 56~r\textsuperscript{o}, 62~v\textsuperscript{o}, 78~r\textsuperscript{o}) : il s'agit donc sans doute de la quinzaine du 16 au 31~octobre.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461.
- Commonwealth War Graves Commission, notice « Hedauville Communal Cemetery Extension », cwgc.org, consultée le 18 oct. 2026.
