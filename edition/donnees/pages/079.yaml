titre: Flot nuit et jour de camions et de caissons ; seul au mess ; solde de 84 F à Albert
transcription: |
  sur l. nuit & jour, flot ininterrompu de vehicules de
  ttes sortes : lorries, caissons de munitions etc . Autant de
  mouvement que le long d'1 gde artère de capitale
  \blanc{1}
  Quand, après dinner, les offs partis, enfin seul
  ds la mess-tent –
  \blanc{6}
  \filet
  \barre{2}merc-\sl{18} Albert : cartes ples : 40c \hfill \sl{Oct 16}
  Albert, mission frse : 84 fr – —
