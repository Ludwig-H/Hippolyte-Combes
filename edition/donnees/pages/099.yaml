date: Mercredi 15 et jeudi 16 novembre 1916
mois: Novembre 1916
lieux: Acheux-en-Amiénois, Albert, Raincheval, Louvencourt, Toutencourt et Hérissart (Somme)
titre: Canonnade vers Beaumont ; Mission française à Albert ; déjeuner à Hérissart chez le Lt Walsh
transcription: |
  \sl{15 \inc{Me}} Toute la nuit, encore \hfill Nov^{bre} \sl{1916}
  et durant journée, principt à l'aube très
  violente canonnade vers Beaumont s/ Ancre \trait
  \ind Très belle journée ensoleillée.
  Matin, venu en auto à Albert Rentré de =
  Passé au bureau mission fr^{se}. Rien de
  nouveau me concernant
  \ind Après-midi, liberté entière. Promené
  village –
  \blanc{1}
  \crochet{2}Cartes ples : Acheux : 35c. — Journaux : 40c
  Washing : 65c –
  \filet
  16 J – Matinée toujours très violent bombardt
  \ind Vitres et fenêtres ne cessent pas de
  trembler
  \ind Soleil brillé journée entière. Gelé
  fortt durant nuit. Bise froide.
  \ind Matin & après-midi, en auto
  Raincheval Louvencourt, Toutencourt etc.
  Déjeuné à Hérissart chz Lt Walsh et
  avec son interp^{te}. Fort apprécié ce dernier
  M. \hfill , directeur d'1 usine
  (\inc{tiss}) près Paris. Intelligent & distingué
