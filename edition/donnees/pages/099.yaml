critique: 'Encre gris-noir assez pâle pour la journée du mercredi 15 ; encre noire virée au brun, plus appuyée, pour les comptes du 15, le filet et la journée du jeudi 16 : les dépenses du 15 ont été portées avec le texte du 16.'
historique: |
  Les 15 et 16 novembre, la bataille de l'Ancre se poursuit à l'est de Beaumont-Hamel par des attaques contre Munich et Frankfort Trenches, encore aux mains allemandes le 16 (OH 1916-II, p.~510--512) ; la nouvelle première ligne, \textit{New Munich Trench}, a été creusée dans la nuit du 14 au 15 (CWGC). Le froid concorde avec l'histoire officielle (OH 1916-II, p.~513). Détaché à Acheux, Hippolyte Combes relève encore du bureau de la Mission française d'Albert, où il touchera sa solde le 18 (voir f.~48~r\textsuperscript{o} et 50~r\textsuperscript{o}) ; il en attend sans doute une décision sur son sort depuis l'annonce, en octobre, du renvoi d'une partie des interprètes (f.~42~r\textsuperscript{o}). Toutencourt est le siège du QG de la Fifth Army (Gough) depuis le 2 juillet 1916 (LLT) ; Hérissart, à 3~km à l'ouest, sera le poste d'Hippolyte Combes à partir du 7 février 1917 (f.~74~r\textsuperscript{o}). Le lieutenant Walsh, revu jusqu'en janvier 1917, n'est pas identifié ; son interprète est nommé « M. Deloney » le 26 novembre (f.~51~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 510-513 (« another clear cold day », p. 513).
- CWGC, New Munich Trench British Cemetery, Beaumont-Hamel, historique (cwgc.org, consulté le 17 oct. 2026).
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copie Wayback 2024).
