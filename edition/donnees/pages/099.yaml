historique: |
  Les 15 et 16, la bataille de l'Ancre se poursuit à l'est de Beaumont-Hamel contre \textit{Munich} et \textit{Frankfort Trenches}, encore allemandes le 16 (OH~\mbox{1916-II}, p.~510--512). Détaché à Acheux, Hippolyte Combes dépend toujours du bureau de la Mission française d'Albert, où il touchera sa solde le 18 (voir f.~50~r\textsuperscript{o}). Il en attend sans doute une décision depuis l'annonce, en octobre, du renvoi d'une partie des interprètes (f.~42~r\textsuperscript{o}). Toutencourt est le QG de la Fifth Army (Gough) depuis le 2~juillet 1916 (LLT). Hérissart, à 3~km à l'ouest, sera son poste dès le 7~février 1917 (f.~74~r\textsuperscript{o}). Le lieutenant Walsh n'est pas identifié ; son interprète est nommé « M. Deloney » (?) le 26~novembre (f.~51~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 510-513 (« another clear cold day », p. 513).
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 » (longlongtrail.co.uk, copie Wayback 2024).
