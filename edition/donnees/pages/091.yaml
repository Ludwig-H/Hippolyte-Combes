historique: |
  Raincheval est à 7~km à l'ouest d'Acheux ; l'« Army P. Board » y siégera (f.~56~r\textsuperscript{o}). Le major Levy, qui obtiendra en mars 1917 le maintien d'Hippolyte Combes au \textit{Purchase Board} (f.~83~r\textsuperscript{o}), est sans doute Walter Henry Levy, de l'A.S.C., major temporaire depuis le 1\textsuperscript{er} mai 1916 (\textit{London Gazette}, suppl. 29585, p.~4941). « D.O.S.T. », sigle non attesté, abrège peut-être « D. of S. and T. », \textit{Director of Supplies and Transport} (Puckle 1917, p.~26). Les 30~F retenus sont sans doute l'indemnité de 5~F par jour des six jours de permission de fin septembre (\textit{Bulletin des armées}, 22 mars 1916 ; voir f.~34~r\textsuperscript{o}). Victor Duchateau, fils aîné du logeur d'Albert, est maréchal des logis dans l'artillerie belge (f.~44~r\textsuperscript{o}).
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 26.
- Supplement to the London Gazette, n° 29585, 17 mai 1916, p. 4941.
- Bulletin des armées de la République, 2e année, n° 186, 22 mars 1916, p. 2 (« Les permissions »).
