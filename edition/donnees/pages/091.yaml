critique: Encre violette. Les deux journées sont séparées par un filet ; les comptes du 2 novembre sont réunis par un grand crochet, ceux du 3 rejetés au bas de la page après un blanc, et un pâté d'encre violette marque la fin de l'avant-dernier alinéa. Cette page a fait l'objet d'une seconde prise photographique.
historique: |
  Le soir de son arrivée à Acheux (voir f.~45~v\textsuperscript{o}), Hippolyte Combes va à Raincheval, à 7~km à l'ouest, où siégera l'« Army P. Board » (f.~56~r\textsuperscript{o}). Le major Levy, qui obtiendra son maintien au \textit{Purchase Board} en mars 1917 (f.~83~r\textsuperscript{o}), est sans doute Walter Henry Levy, de l'A.S.C., major temporaire depuis le 1\textsuperscript{er} mai 1916 (\textit{London Gazette}, suppl. 29585, p.~4941). « D.O.S.T. », sigle non attesté, abrège peut-être « D. of S. and T. », \textit{Director of Supplies and Transport} (Puckle 1917, p.~26), dont relèvent les \textit{purchase boards} (ibid., p.~8). Le 3, Haig autorise Gough à remettre indéfiniment l'attaque de l'Ancre (OH 1916-II, p.~462). Les 30~F retenus sont sans doute l'indemnité, à 5~F par jour, des six jours pleins de la permission de fin septembre (\textit{Bulletin des armées}, 22 mars 1916 ; voir f.~34~r\textsuperscript{o}). Victor Duchateau, fils aîné du logeur d'Albert, est maréchal des logis dans l'artillerie belge (f.~44~r\textsuperscript{o}).
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 8 et 26.
- Supplement to the London Gazette, n° 29585, 17 mai 1916, p. 4941.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 462.
- Bulletin des armées de la République, 2e année, n° 186, 22 mars 1916, p. 2 (« Les permissions »).
