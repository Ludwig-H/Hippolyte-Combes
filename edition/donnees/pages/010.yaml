critique: Encre noire uniforme. Les deux derniers alinéas, isolés par des blancs, s'ouvrent sur des signes en équerre d'une encre plus épaisse. La journée du 4 août se poursuit au verso (f. 5 v\textsuperscript{o}).
historique: |
  La Croix-du-Bac, hameau de Steenwerck (Nord) à 3 km au sud du bourg et à 6,5 km d'Armentières, est un siège habituel d'état-major divisionnaire : la 34th Division s'y installe le 24 février 1916 (Shakespear 1921, p. 15), la 5th Australian Division y ouvre son QG le 8 juillet (Ellis [1920], p. 74). Le 4 août, la 18th Division n'a pas encore pris le secteur, qu'elle relève dans la nuit du 6 au 7 (Beds War Diary) : le bureau de la Mission où Combes est payé est vraisemblablement déjà celui de sa division, sans qu'aucune source le confirme. Les « 15 K\textsuperscript{ils} » notés pour 11 km à vol d'oiseau tiennent au détour par Bailleul. L'église de Steenwerck, « très gde », disparaîtra dans les combats de 1918 (le village est pris le 10 avril : CWGC) et sera reconstruite en 1928 (Mérimée PA59000231). Les 80 F 30 suivent de huit jours les 84 F touchés à Hazebrouck (voir f. 2 r\textsuperscript{o}) ; ni ce montant ni le « supplément » de 8 F de juillet n'entrent dans le schéma des paies de quinzaine, et aucun texte connu ne les explique.
sources:
- Shakespear, J., The Thirty-Fourth Division, 1915–1919. The Story of its Career from Ripon to the Rhine, Londres, H. F. & G. Witherby, 1921, p. 15.
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 74.
- 'Bedfordshire Archives Service, X550/8/1/1607-1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet-septembre 1916 (Beds War Diary).'
- CWGC, Le Grand Beaumart British Cemetery, Steenwerck (fiche 20802), historique.
- Ministère de la Culture, base Mérimée, PA59000231 (église Saint-Jean-Baptiste, Steenwerck).
