historique: |
  Ces retrouvailles closent la crise des fiançailles de décembre (voir f.~56~v\textsuperscript{o} et 57~r\textsuperscript{o}). La « tante » est Élisabeth Calmels, épouse d'Émile Crouzet et sœur du Dr Gabriel Calmels, père de Marguerite (\textit{L'Express du Midi}, 23 déc. 1926 ; P. Combes, étude familiale, p.~106). Madeleine est sans doute la sœur aînée de Marguerite, épouse du Dr Fernand Vincens. Jean est sans doute l'abbé Jean Crouzet (v.~1880–1932), fils d'Émile, vicaire à la cathédrale Saint-Étienne pendant la guerre (\textit{Le Télégramme}, 15 avr. 1917, p.~3 ; voir f.~29~v\textsuperscript{o}). Il rentre à pied faute de tram : la presse dénonce alors « la crise des tramways électriques » (\textit{Le Télégramme}, 30 janv. 1917, p.~3).
sources:
- L'Express du Midi (Toulouse), 23 décembre 1926, p. 5 (faire-part d'Émile Crouzet).
- Combes, Pierre, étude familiale (arbre Calmels), dactylographie, 2020–2021, p. 106.
- Le Télégramme (Toulouse), 15 avril 1917, p. 3 ; 30 janvier 1917, p. 3.
