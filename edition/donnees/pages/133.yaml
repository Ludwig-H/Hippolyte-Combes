date: Dimanche 28 janvier 1917 (suite)
mois: Janvier 1917
lieux: Toulouse (Haute-Garonne)
titre: Journée à Sainte-Marie auprès de Marguerite ; retour à pied, faute de tram
transcription: |
  \sl{Dim. 28.} (suite) \hfill \sl{Janv. /17 =}
  Marg^{te}, sur la porte, m'attendait Accueil
  infiniment tendre. S'est montrée charmante
  Vu tante & Madeleine
  Passé journée entière à S^{te}-Marie. Longues
  heures d'intime tete à-tête avec Marg^{te}, dans
  le petit salon
  Jean, monté à 6^{H}\fr{1}{2} et diné avec nous
  Redescendu seul, à pied, à 9 \fr{1}{2}. Aucun tram
  Marg^{te}, vraiment exquise de simplicité & de charme
  vive, spontanée, aimante, affectueuse au possible
  Mes sentiments à son égard, douceur infinie
  Causeries délicieuses sur les sujets les plus
  divers
  \blanc{3}
  \ind — Trams : 10c, 10c –
apparat:
- ligne: 6
  lemme: d'intime
  type: lecture
  note: 'd'' retenu par le sens ; autre lecture : & intime'
historique: |
  Ces retrouvailles closent la crise des fiançailles de décembre (voir ff.~56~v\textsuperscript{o} et 57~r\textsuperscript{o}). La « tante » est sans doute Élisabeth Calmels, épouse d'Émile Crouzet et sœur du D\textsuperscript{r} Gabriel Calmels, père de Marguerite (\textit{L'Express du Midi}, 23~déc. 1926 ; P. Combes, étude familiale, p.~106). Madeleine est sans doute la sœur aînée de Marguerite, épouse du D\textsuperscript{r} Fernand Vincens. Jean est sans doute l'abbé Jean Crouzet (v.~1880--1932), vraisemblablement fils d'Émile, vicaire à la cathédrale Saint-Étienne pendant la guerre (\textit{Le Télégramme}, 15~avr. 1917, p.~3 ; voir f.~29~v\textsuperscript{o}). Il rentre à pied faute de tram : la presse dénonce alors « la crise des tramways électriques » (\textit{Le Télégramme}, 30~janv. 1917, p.~3).
sources:
- L'Express du Midi (Toulouse), 23 décembre 1926, p. 5 (faire-part d'Émile Crouzet).
- Combes, Pierre, étude familiale (arbre Calmels), dactylographie, 2020–2021, p. 106.
- Le Télégramme (Toulouse), 15 avril 1917, p. 3 ; 30 janvier 1917, p. 3.
