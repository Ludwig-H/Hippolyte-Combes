critique: Page écrite en travers du carnet. Les comptes de la journée sont portés en tête du f.~38~v\textsuperscript{o}.
historique: |
  À Beauval, la colonne campait près du cimetière communal, où les hôpitaux d'évacuation enterraient leurs morts (CWGC). Ce jour-là, la 54\textsuperscript{th} Brigade marche treize milles jusqu'au bois de Vadencourt, près de Warloy (JMO~7/Bedf, 16~oct. 1916). Haig a son QG avancé à Beauquesne, au château de Valvion, depuis le 27~juin (OH~\mbox{1916-I}, p.~304). Puchevillers est une tête de ligne des munitions et abrite les 3\textsuperscript{rd} et 44\textsuperscript{th} Casualty Clearing Stations (OH~\mbox{1916-I}, p.~274 ; CWGC). Warloy-Baillon a reçu avant le 1\textsuperscript{er}~juillet des ambulances de campagne et un centre opératoire avancé (OH~\mbox{1916-I}, p.~282). Les routes sont encombrées : le II~Corps prépare l'attaque de Regina et de Stuff Trenches, lancée le 21~octobre (OH~\mbox{1916-II}, p.~463).
