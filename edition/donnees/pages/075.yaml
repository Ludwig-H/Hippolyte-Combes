critique: Page écrite en travers du carnet, d'une seule encre violette. Les comptes de la journée sont portés en tête du f.~38 v\textsuperscript{o}.
historique: |
  À Beauval, la colonne campait sur la colline, près du cimetière communal où les hôpitaux d'évacuation inhumaient leurs morts (CWGC). L'itinéraire est celui de la 54th Brigade, qui marche ce jour-là treize milles jusqu'au bois de Vadencourt, près de Warloy (JMO 7/Bedf, 16 oct. 1916). Il passe par Beauquesne, où Haig a son QG avancé au château de Valvion depuis le 27 juin 1916 (OH 1916-I, p.~304), puis Puchevillers, tête de ligne des munitions et siège des 3rd et 44th Casualty Clearing Stations (OH 1916-I, p.~274 ; CWGC). Warloy-Baillon a reçu avant le 1\textsuperscript{er} juillet les ambulances de campagne et un centre opératoire avancé (OH 1916-I, p.~282) ; la plupart des 1~331 tombes de l'extension du cimetière datent de juillet à novembre 1916 (CWGC). La route de Senlis mène à Senlis-le-Sec, QG du II Corps depuis le 24 juillet (LLT). Ce corps prépare l'attaque de Regina et de Stuff Trenches, lancée le 21 octobre (OH 1916-II, p.~463), d'où l'encombrement des routes. La pleine lune datait du 11 octobre ; le 17, Combes note une demi-lune (f.~38 v\textsuperscript{o}).
