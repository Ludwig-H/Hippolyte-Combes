historique: |
  Raincheval abrite l'\textit{Army Purchase Board} du major Levy (voir f.~56~r\textsuperscript{o}). M. Guibet, revu le 9~janvier (f.~60~v\textsuperscript{o}), n'est pas identifié. Le Quesnoy est sans doute l'écart de ce nom à Puchevillers (voir f.~55~v\textsuperscript{o}). La démarche auprès de M\textsuperscript{me} Capron (lecture du nom incertaine) aboutit au contrat de location du 5~janvier (f.~60~r\textsuperscript{o}). Le \textit{purchase board} de chaque armée gérait presses et batteuses pour faire des réserves de paille, pour le fourrage et la litière (Puckle 1917, p.~28) ; la ration d'avoine des chevaux tombait alors à 6 livres (OH~\mbox{1917-I}, p.~65--66). Doullens est depuis le 29~novembre le siège du QG du V Corps (LLT, V Corps).
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 65-66.
- The Long, Long Trail, « The British V Corps in France and Flanders », https://web.archive.org/web/20200805133825/https://www.longlongtrail.co.uk/army/other-aspects-of-order-of-battle/the-british-corps-headquarters-in-france-and-flanders/the-british-v-corps-in-france-and-flanders/.
