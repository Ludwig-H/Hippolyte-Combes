critique: Encre gris-noir virée au brun, homogène ; les quantièmes 26 et 27 sont d'un trait plus épais que le texte. Un blanc d'environ trois lignes sépare les deux journées, et les comptes de Doullens, ouverts par une équerre, sont rejetés en bas de page sous un blanc de six lignes.
historique: |
  Raincheval abrite l'\textit{Army Purchase Board} du major Levy (voir f.~56~r\textsuperscript{o}) ; M. Guibet, que Combes y revoit le 9 janvier (f.~60~v\textsuperscript{o}), n'est pas identifié. Le Quesnoy est sans doute l'écart de ce nom à Puchevillers (voir f.~56~v\textsuperscript{o}). La démarche auprès de Mme Capron, de Beauquesne (lecture du nom incertaine), aboutit au contrat de location du 5 janvier (f.~60~r\textsuperscript{o}) ; un battage avait commencé à Arquèves le 8 décembre (f.~54~r\textsuperscript{o}). Le \textit{purchase board} de chaque armée administrait presses et batteuses pour constituer des réserves de paille, fourrage d'appoint et litière des cantonnements (Puckle 1917, p.~28), au moment où la ration d'avoine des chevaux tombait à 6 livres (OH 1917-I, p.~65-66). Doullens est depuis le 29 novembre le siège du QG du V Corps (LLT, V Corps). La ramette de papier à lettres coûte le même prix qu'à Toulouse fin janvier (f.~67~v\textsuperscript{o}), alors que la Y.M.C.A. donnait papier et enveloppes dans ses huttes (Yapp 1918, chap.~IV).
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 65-66.
- The Long, Long Trail, « The British V Corps in France and Flanders », https://web.archive.org/web/20200805133825/https://www.longlongtrail.co.uk/army/other-aspects-of-order-of-battle/the-british-corps-headquarters-in-france-and-flanders/the-british-v-corps-in-france-and-flanders/.
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV, « The Romance of Finance », p. 39-62.
