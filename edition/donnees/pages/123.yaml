date: Samedi 13 – lundi 15 janvier 1917
mois: Janvier 1917
lieux: Acheux-en-Amiénois, Beaucourt-sur-l'Hallue, Montigny-sur-l'Hallue, Louvencourt, Saint-Léger-lès-Authie et Doullens (Somme)
titre: Départ en permission fixé au 26 ; neige sur les arbres ; course à Doullens
transcription: |
  \sl{13 Sam.} \hfill \sl{Janv. 17}
  \ind Tout le jour, pluie fine et \add{(neige fondue)}
  brouillard froid —
  \ind Après-midi, course en auto à Beaucourt &
  Montigny.
  \ind Matin, au bureau mission V^{e} corps : Vu
  cap. Huguet : mon départ fixé definit au 26 ct —
  \blanc{1}
  14 D. – Neige tombé à gros flocons durant
  matinée entière. Toits & arbres recouverts couche
  blanche. Branches ext^{t} jolies avec \inc{ce} leger
  duvet – ainsi ouatées
  \ind[2] Après-midi, course à Louvencourt et
  à St-Léger –
  \blanc{1}
  \sl{15 L} Pluie fine, par intermittence
  Course à Doullens. Paysages, asz pittoresq
  au delà de Beauquesne – Champs couverts de
  neige – Masses sombres des arbres. Arbres &
  maisons de village se détachent davantage
  au \fr{1}{2} du blanc (Raincheval). Brume monte
  \ind 3 h. de liberté à Doullens visité ville.
  arret église etc.
  \equerre{2}— 2 douz. c^{tes} p^{les} : \inc{1^{f}} — \hfill — Lunch 1^{f}90
  — 1 plaque chocolat : \inc{65} c
