historique: |
  Le « bureau mission V\textsuperscript{e} corps » est celui de la Mission française auprès du V Corps. Son QG est revenu la veille de Doullens à Acheux (LLT) : le V Corps reprend au nord de l'Ancre le secteur du XIII~Corps (OH~\mbox{1917-I}, p.~69), dont le bureau payait encore Hippolyte Combes le 5~janvier (f.~60~r\textsuperscript{o}). Le capitaine Huguet, qui l'avait convoqué le 5~novembre 1916 (f.~47~r\textsuperscript{o}), n'est pas identifié ; rien ne le rattache au général Victor Huguet. Beaucourt et Montigny sont ceux de l'Hallue (voir f.~59~v\textsuperscript{o}). Le départ du 26 est celui de la seconde permission ; Hippolyte Combes rentrera le 7~février. La neige du 14 ouvre un grand gel d'un mois (OH~\mbox{1917-I}, p.~66). Si la somme est bien de 1~F, les cartes postales reviennent à un peu plus de 4~c pièce.
sources:
- Baker, C., « The British V Corps in France and Flanders », The Long, Long Trail, https://www.longlongtrail.co.uk (copie Wayback du 5 août 2020).
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 66, 69.
