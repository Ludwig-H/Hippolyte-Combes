critique: Encre noire virée au brun ; les comptes du 15 janvier sont isolés au bas de la page par un filet en équerre.
historique: |
  Le « bureau mission V\textsuperscript{e} corps » est celui de la Mission française auprès du V Corps (lieutenant-général Fanshawe). Son QG est revenu de Doullens à Acheux la veille (LLT) : après l'opération du 11, le V Corps reprend au nord de l'Ancre le secteur du XIII Corps (OH 1917-I, p. 69), dont le bureau payait encore Hippolyte Combes le 5 janvier (f. 60 r\textsuperscript{o}). Le capitaine Huguet, qui l'avait convoqué le 5 novembre 1916 (f. 47 r\textsuperscript{o}), n'est pas identifié ; rien ne le rattache au général Victor Huguet, ancien chef de la Mission. Le départ « au 26 ct » est celui de la seconde permission : Hippolyte Combes quittera Acheux le vendredi 26 janvier et ne rentrera que le 7 février. La neige du 14 ouvre le grand gel, daté de ce jour par l'histoire officielle et long d'un mois (OH 1917-I, p. 66). Beaucourt et Montigny sont ceux de l'Hallue (voir f. 59 v\textsuperscript{o}). Les cartes postales reviennent à 4 c pièce, contre 10 c à Albert. Le chocolat ordinaire valait alors 3,23 F le kilo à l'économat d'une compagnie de chemins de fer (March 1925, p. 199–200).
sources:
- Baker, C., « The British V Corps in France and Flanders », The Long, Long Trail, https://www.longlongtrail.co.uk (copie Wayback du 5 août 2020).
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 66, 69.
- March, L., Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 199–200.
