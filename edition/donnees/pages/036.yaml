titre: 'Dimanche 3 septembre (suite) : avoine sur pied ; achats à Saint-Pol, carte de la Somme'
transcription: |
  \sl{3 D.} \hfill Sept^{bre} /16
  \ind Champs d'avoine non encore \trait
  fauchés, tout jaunes – et qui
  bruissaient monotone, sous la caresse \trait
  de la brise –
  \blanc{14}
  \droite \inc{3} \ill . 1/2h – 60
  \filet
  \sl{A Saint-Pol} : ctes p^{les} : 30 c \hfill + \inc{5}
  Carte du dep^{t} Somme : 70 c \add{Géog. du Pas de Calais : \inc{35}}
  1 boîte de saddle soap : 1^{f} 50 \hfill Varia : 30 c
  1 Eponge : 60 – – — 1/4 livre choc^{t} Poulain : \inc{f}
