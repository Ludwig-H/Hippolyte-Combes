critique: 'Recto du f. 18 : la page continue la journée du dimanche 3 (f. 17 v\textsuperscript{o}) et précède celle du lundi 4, au verso, dont le cliché a été pris le premier. Sous cinq lignes de récit, un grand blanc, puis une ligne au crayon en partie illisible au-dessus du filet ; dans les comptes, plusieurs chiffres et la mention ajoutée de la « Géog. du Pas de Calais » sont d''une encre plus pâle, peut-être portés après coup.'
historique: |
  La carte du département de la Somme, payée le même prix que la « Carte du départt » du 31 août (voir f. 16 v\textsuperscript{o}), est achetée la veille du jour où l'ordre d'opérations n° 28 transfère la division à la Reserve Army, sur la Somme (JMO 7/Bedf, 4 sept. 1916) : la destination était donc connue, ou pressentie ; la compagnie entrera dans ce département le 11, à Raincheval (voir f. 21 r\textsuperscript{o}). Le \textit{saddle soap} est le savon de sellerie qui entretient le cuir des selles et des harnais : Combes suit la compagnie à cheval (« très lente chevauchée », f. 20 r\textsuperscript{o}) et paiera le 14 un \textit{batman} pour seller son poney (voir f. 22 r\textsuperscript{o}). Le chocolat Poulain est la marque lancée en 1848 par le Blésois Victor-Auguste Poulain (Ville de Blois 2015) ; si le quart de livre coûte bien 1 f, il revient à 8 F le kilo, quand le chocolat ordinaire valait 3,19 F à l'économat d'une grande compagnie de chemins de fer en juillet 1916 (March 1925, p. 199-200).
sources:
