critique: Les trois dernières lignes, ajoutées en fin de journée, reviennent sur le début de l'après-midi.
historique: |
  La Lys sépare ici le Nord (Steenwerck) du Pas-de-Calais (Sailly-sur-la-Lys) ; l'éclusier est sans doute celui de Bac-Saint-Maur, déjà rencontré le 10~août (voir f.~8~v\textsuperscript{o}). La luzerne fait partie du fourrage vert prévu pour les chevaux britanniques (« rye grass, lucerne, sainfoin, clover » : FSPB 1914, chap.~6, §~20) ; Hippolyte Combes fait couper ce fourrage et le paie aux cultivateurs. Le front reste calme devant le 7\textsuperscript{th} Bedfordshire (JMO~7/Bedf, 12~août 1916) ; la 53\textsuperscript{rd} Brigade gagne un camp de tentes au Mont de Lille (Banks et Chell 1924, p.~143). Le litre de lait revient à 30~c (le 6~août : « 25 + 0.05 », voir f.~7~r\textsuperscript{o}) ; à Paris, le prix maximal sera fixé à 50~c en février 1917 (March 1925, p.~182--183).
sources:
- Field Service Pocket Book, 1914, Londres, HMSO, 1914, chap. 6, « Forage », § 20.
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 143.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 182-183.
