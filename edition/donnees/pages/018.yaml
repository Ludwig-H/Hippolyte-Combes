historique: |
  La Lys sépare ici le Nord (Steenwerck, rive nord) du Pas-de-Calais (Sailly-sur-la-Lys, rive sud) ; l'éclusier est sans doute celui de Bac-Saint-Maur, avec qui Combes a déjà causé l'avant-veille (voir f. 8 v\textsuperscript{o}). La luzerne est l'une des plantes du fourrage vert réglementaire des chevaux britanniques (« rye grass, lucerne, sainfoin, clover » : FSPB 1914, chap. 6, § 20), que Combes fait couper et payer aux cultivateurs pour compléter la ration de foin. Ce samedi, le front reste calme devant le 7th Bedfordshire (JMO 7/Bedf, 12 août 1916), tandis que la 53rd Brigade, dont on n'a pas besoin à Erquinghem, gagne un camp de tentes au pied du Mont de Lille, au sud de Bailleul (Banks \& Chell 1924, p. 143). Le demi-litre de lait à 15 c met le litre à 30 c, contre 25 c le 6 août (voir f. 7 r\textsuperscript{o}) : prix de ferme, bien au-dessous des 50 c que la préfecture de police fixera comme prix maximal du litre à Paris en février 1917 (March 1925, p. 182-183).
sources:
