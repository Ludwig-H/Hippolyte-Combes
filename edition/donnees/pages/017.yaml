critique: Les deux biffures de la l.~6, d'une encre noir bleuté distincte, sont peut-être postérieures à la rédaction. Les quatre dernières lignes, isolées entre le filet des comptes et un double trait ondulé, forment une note à part.
historique: |
  Le bombardement touche l'arrière d'un secteur réputé calme : le 9 août, « about 50 heavy shells » étaient tombés sur Armentières (JMO 7/Bedf, 9 août 1916), et le 10th Essex note que le QG divisionnaire, « a few miles back » d'Erquinghem, « received some attention from enemy artillery » (Banks \& Chell 1924, p. 142) ; ce QG n'est pas localisé. Le soldat atteint dans la « maison du coin » n'est pas identifié. La « gde blanchisserie Barbry » se rattache sans doute aux blanchisseurs Barbry de la rue de la Lys à Sailly-sur-la-Lys, entre le bourg et Bac-Saint-Maur, à 1,5 km environ de La Croix-du-Bac (répertoire SIRENE) ; Hippolyte Combes y repasse le 19 août et prend café et rhum chez « M. Barbry » le 20 (voir f. 11 v\textsuperscript{o} et f. 12 r\textsuperscript{o}). Ces usines de blanchiment des fils et toiles de lin jalonnaient la Lys, telle l'usine Mahieu d'Erquinghem-Lys, « partiellement détruite » pendant la guerre (Mérimée PA59000059). Le « nouveau départ dimanche » (13 août) n'eut pas lieu : la compagnie ne quitte les bords de la Lys que le 25 août.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., London, Gay & Hancock, 1924, p. 142.
- INSEE, répertoire SIRENE (annuaire-entreprises.data.gouv.fr), établissements Barbry, rue de la Lys, Sailly-sur-la-Lys, consulté le 18 oct. 2026.
- Ministère de la Culture, base Mérimée, notice PA59000059 (ancienne usine de blanchiment Mahieu, Erquinghem-Lys).
