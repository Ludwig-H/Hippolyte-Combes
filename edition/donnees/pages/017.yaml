historique: |
  Le bombardement touche l'arrière d'un secteur calme : Armentières avait déjà reçu des obus lourds le 9~août (voir f.~8~r\textsuperscript{o}), et le QG de la division « received some attention from enemy artillery » (Banks \& Chell 1924, p.~142). Le soldat de la « maison du coin » n'est pas identifié. La blanchisserie se rattache sans doute aux blanchisseurs Barbry de la rue de la Lys, à Sailly-sur-la-Lys, à 1,5~km environ de La Croix-du-Bac (répertoire SIRENE). Hippolyte Combes y repasse le 19 et prend un café chez « M. Barbry » le 20 (voir ff.~11~v\textsuperscript{o} et 12~r\textsuperscript{o}). Le départ prévu le dimanche 13 n'a pas lieu : la compagnie ne quitte la Lys que le 25~août.
sources:
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., London, Gay & Hancock, 1924, p. 142.
- INSEE, répertoire SIRENE (annuaire-entreprises.data.gouv.fr), établissements Barbry, rue de la Lys, Sailly-sur-la-Lys, consulté le 18 oct. 2026.
