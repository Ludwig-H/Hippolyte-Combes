critique: La phrase sur le clocher de Saint-Michel reste en suspens après « est » ; le compte et les mots « allée de pins » ont été ajoutés après coup.
historique: |
  Le beau temps revient : le journal des Bedfords note « \textit{Fine weather} » les 6 et 7~septembre, après un 5 pluvieux (JMO~7/Bedf, 5--7~sept. 1916). Le départ étant retardé (voir f.~18~v\textsuperscript{o}), la 54\textsuperscript{th} Brigade s'exerce au creusement et à la construction rapide d'abris enterrés (ibid.). M\textsuperscript{me} Vauchel, propriétaire d'une ferme voisine, n'est pas identifiée ; la visite avec Curtis tient sans doute à un achat de fourrage vert (voir f.~9~v\textsuperscript{o}). Le 7, Hippolyte Combes va à pied à \mbox{Saint-Pol}, à 6,1~km de Marquay, et revient par Saint-Michel-sur-Ternoise (4,6~km ; OSM). Il paiera encore 50~c une coupe de cheveux à Albert en octobre (voir f.~43~v\textsuperscript{o}).
