historique: |
  La course mène à quelque 25~km au sud d'Acheux (geo.api.gouv.fr) : au-delà de Corbie, Villers-Bretonneux, Marcelcave et Warfusée-Abancourt (auj. Lamotte-Warfusée) sont hors de la zone britannique ; elle sera étendue en janvier 1917 jusqu'à la route Amiens–Roye (OH~\mbox{1917-I}, p.~37, 43). Le lieutenant Walsh, d'Hérissart, est déjà connu (voir ff.~49~v\textsuperscript{o}, 51~v\textsuperscript{o}) ; l'interprète invité avec lui est peut-être le sien, M. Deloney (?). La solde de 78~F~75 est celle d'une quinzaine (voir f.~23~v\textsuperscript{o}) ; la suivante sera versée le 19 (voir f.~56~r\textsuperscript{o}). Belle-Église, hameau d'Arquèves, était tête de ligne de ravitaillement en juillet 1916 (OH~\mbox{1916-I}, p.~274) ; on y battra la paille à partir du 8 (voir f.~54~r\textsuperscript{o}).
