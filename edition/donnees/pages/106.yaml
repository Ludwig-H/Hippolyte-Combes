critique: Encre noire virée au brun. Les comptes du 3 décembre sont ouverts par un grand crochet et séparés de la journée du 4 par un long filet partant du milieu de la page.
historique: |
  Corbie, tête de ligne des munitions et siège d'un hôpital d'évacuation au 1\textsuperscript{er} juillet 1916 (OH 1916-I, p.~274, 282), commande le passage de la Somme ; au-delà, Villers-Bretonneux, Marcelcave et Warfusée-Abancourt (auj. Lamotte-Warfusée) restent hors de la zone britannique, que la conférence de Londres des 15–16 janvier 1917 étendra jusqu'à la route Amiens–Roye (OH 1917-I, p.~37, 43) ; la course mène à quelque 25~km au sud d'Acheux. Le lieutenant Walsh, d'Hérissart et son interprète M. Deloney [?] sont connus (voir f.~49~v\textsuperscript{o}, 51~v\textsuperscript{o}). La solde de 78~F~75 est celle d'une quinzaine (voir f.~23~v\textsuperscript{o}, 35~r\textsuperscript{o}) ; la suivante sera versée le 19 (voir f.~56~r\textsuperscript{o}). Le bock est à 15~c ; le litre valait 0,44~F dans un économat de chemins de fer en janvier 1917 (March 1925, p.~182). Belle-Église, hameau d'Arquèves, était tête de ligne de ravitaillement en juillet 1916 (OH 1916-I, p.~274) ; on y battra la paille à partir du 8 décembre (voir f.~54~r\textsuperscript{o}).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 274, 282.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 37, 43.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 182.
