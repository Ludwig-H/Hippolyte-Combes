historique: |
  Sur M\textsuperscript{me} de Labarthe, voir f.~28~v\textsuperscript{o}. Ernest Zyromski (1862--1933) est professeur à la Faculté des lettres de Toulouse ; Combes avait acheté son \textit{Orgueil humain} à Paris (voir f.~27~r\textsuperscript{o}). La leçon est annoncée pour « mardi 30 janvier, à 5 heures », sur « M. de Guérin : Le séjour en Bretagne et l'influence de Lamennais » (\textit{Le Télégramme}, 30~janv. 1917, p.~3). Le cours aboutit au \textit{Maurice de Guérin} de 1921, dont le chapitre VI traite de « l'influence de la terre bretonne et l'action de Lamennais » (Zyromski 1921, p.~113--114). \textit{Le Miroir des modes} est un mensuel de mode parisien de la maison américaine Butterick (BnF), sans doute acheté pour Marguerite.
sources:
