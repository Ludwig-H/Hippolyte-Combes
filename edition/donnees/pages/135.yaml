critique: Encre violette. Un blanc d'environ cinq lignes sépare le journal des comptes, que réunit un grand crochet.
historique: |
  Sur Mme de Labarthe, « gde amie affectueuse \& attachée », voir f.~28 v\textsuperscript{o}. La « conférence » est une leçon du cours public de littérature française d'Ernest Zyromski (1862--1933), professeur à la Faculté des lettres de Toulouse et mainteneur des Jeux floraux, dont Combes avait acheté \textit{L'Orgueil humain} à Paris (voir f.~27 r\textsuperscript{o}). La presse l'annonce pour « mardi 30 janvier, à 5 heures », sur « M. de Guérin : Le séjour en Bretagne et l'influence de Lamennais » (\textit{Le Télégramme}, 30 janv. 1917, p.~3), et en publie le compte rendu sous le titre « Maurice de Guérin à la Chênaie » (\textit{L'Express du Midi}, 1\textsuperscript{er} févr. 1917, p.~3). Le cours aboutit au \textit{Maurice de Guérin} de 1921, dont le chapitre VI traite de « l'influence de la terre bretonne et l'action de Lamennais » (Zyromski 1921, p.~113--114). \textit{Le Miroir des modes} est un mensuel de mode publié à Paris par la maison américaine Butterick (BnF), sans doute acheté pour Marguerite.
