critique: |
  La dernière phrase se poursuit en tête du f.~71~r\textsuperscript{o}.
historique: |
  Première nuit dans la maison Calmels (voir f.~69~v\textsuperscript{o}). La lune ne sera pleine que le 7 février (Calendar-12). Son père, l'avocat Hippolyte Combes, est mort à Millau le 11 août 1899, sa mère, Anaïs Alric, à Toulouse en 1907. Sa sœur Maria, religieuse missionnaire, est morte à Carthage le 19 novembre 1903, et Joséphine, qui tenait son ménage, à Nogent-le-Rotrou en octobre 1914 ; seule Françoise vit encore, carmélite à Périgueux (PC-Livre ; PC-Bio). Le lendemain, il va avec Marguerite au caveau Combes (f.~71~v\textsuperscript{o}). « Germaine » est sans doute Germaine Vincens, nièce de Marguerite, fille de Madeleine Calmels, âgée de six ans au mariage (PC-Bio).
sources:
- Combes, Pierre, Une étude de la famille Combes de Castelnau-Pégayrols, dactylographie, version du 19 mars 2023 (PC-Livre), archives familiales.
