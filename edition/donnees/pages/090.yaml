critique: Le récit du 2 novembre se poursuit en tête de la page suivante.
historique: |
  Le colonel Grose est le lieutenant-colonel Daniel Charles Evans Grose, A.S.C., qui commande le train de la 18th Division (Nichols 1922, p.~107). Le major Hughes, revu le 8 novembre (voir f.~48~r\textsuperscript{o}), est peut-être Herbert Francis Hughes, major temporaire de l'A.S.C. en 1916 (\textit{London Gazette}, suppl. 29585, p.~4941). Le Lt Pizzi est l'officier interprète de la division (lettre d'Hippolyte Combes du 25 février 1916). L'adjudant Lépin (ailleurs « Lupin »), Serpin, du bureau de la Mission, et le capitaine « Pant » ne sont pas identifiés. Acheux est le siège du QG du V Corps du 2 octobre au 29 novembre (LLT) et une tête de ligne pour les vivres (OH 1916-I, p.~273-274).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 107.
- Supplement to the London Gazette, n° 29585, 17 mai 1916, p. 4941.
- Lettre d'Hippolyte Combes à un capitaine, « Au front, le 25 février 1916 », copie autographe, archives familiales.
- The Long, Long Trail, « The British V Corps in France and Flanders », https://web.archive.org/web/20200805133825/https://www.longlongtrail.co.uk/army/other-aspects-of-order-of-battle/the-british-corps-headquarters-in-france-and-flanders/the-british-v-corps-in-france-and-flanders/.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273-274.
