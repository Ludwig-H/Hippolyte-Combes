critique: Le récit du 2~novembre se poursuit en tête de la page suivante.
historique: |
  Le colonel Grose est le lieutenant-colonel Daniel Charles Evans Grose, A.S.C., qui commande le train de la 18\textsuperscript{th} Division (Nichols 1922, p.~107). Le major Hughes, revu le 8~novembre (voir f.~48~r\textsuperscript{o}), est peut-être Herbert Francis Hughes, major temporaire de l'A.S.C. en 1916 (\textit{London Gazette}, suppl. 29585, p.~4941). Sur le lieutenant Pizzi, voir f.~43~r\textsuperscript{o}. L'adjudant Lépin (ailleurs « Lupin »), Serpin, du bureau de la Mission, et le capitaine « Pant » ne sont pas identifiés. Acheux, siège du QG du V Corps (voir f.~44~r\textsuperscript{o}), est aussi une tête de ligne pour les vivres (OH~\mbox{1916-I}, p.~273--274).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 107.
- Supplement to the London Gazette, n° 29585, 17 mai 1916, p. 4941.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273-274.
