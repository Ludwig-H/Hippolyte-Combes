critique: Encre violette ; page pleine, sans comptes. Le récit du 2 novembre se poursuit en tête de la page suivante (« après le diner »).
historique: |
  Le « Col. Grose » est le lieutenant-colonel Daniel Charles Evans Grose, A.S.C., commandant du train de la 18th Division (Nichols 1922, p.~107), fait D.S.O. en juin 1917 (\textit{London Gazette}, 4 juin 1917, p.~5470). Le « Major Hughes », revu le 8 novembre (voir f.~48~r\textsuperscript{o}), est peut-être Herbert Francis Hughes, major temporaire de l'A.S.C. au 1\textsuperscript{er} mai 1916 (\textit{London Gazette}, suppl. 29585, p.~4941). Le Lt Pizzi est l'officier interprète de la division (lettre de Combes du 25 février 1916) ; l'adjudant « Lépin » (ailleurs « Lupin ») et Serpin, du bureau de la Mission, ne sont pas identifiés, non plus que le « Cap. Pant » de la compagnie. L'ordre est britannique, mais l'interprète doit aussi l'aval de la Mission. Acheux est depuis le 2 octobre le siège du QG du V Corps (Fanshawe), qui y reste jusqu'au 29 novembre (LLT), et une tête de ligne pour les vivres, au terminus de la voie normale venue de Candas (OH 1916-I, p.~273-274). Le \textit{Town Major} y répartit les logements entre les unités de passage (Fernand-Laurent 1917, p.~227).
