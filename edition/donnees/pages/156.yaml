critique: Encre violette uniforme ; un pâté couvre en partie « plus » (l.~7). La solde touchée à Toutencourt est notée en bas à droite, entre deux grands crochets.
historique: |
  Le samedi 17, que Combes passe au repos, la 18th Division attaque à Boom Ravine dans la boue du dégel (voir f.~75~v\textsuperscript{o}) ; son historien tient ce jour pour « the first day of the thaw » (Nichols 1922, p.~140). Les « fondrières » du 18 rejoignent le constat officiel : sur les routes de l'arrière, même les voitures légères crèvent la mince croûte d'empierrement, et il faut fermer des routes et délivrer des passes aux camions (OH 1917-I, p.~103). À Toutencourt, le bureau de la Mission française de la Fifth Army (voir f.~52~v\textsuperscript{o}) paie la solde à la date annoncée le 9 février, les 3 et 18 de chaque mois (voir f.~75~r\textsuperscript{o}) ; les 68~F~25 font treize jours à 5~F~25 (calcul de l'éditeur). Le renseignement demandé sur un « cantonnement d anglais, à Toulouse » n'est pas expliqué : peut-être Combes s'enquiert-il d'un poste auprès de troupes britanniques dans la ville où il a son domicile et où vit sa fiancée (voir f.~63~v\textsuperscript{o} et suiv.). Le prône est l'instruction faite en chaire par le curé pendant la grand-messe.
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg et Londres, W. Blackwood & Sons, 1922, p. 140.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 103.
