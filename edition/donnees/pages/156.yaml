historique: |
  Le samedi 17, la 18\textsuperscript{th} Division attaque à Boom Ravine dans la boue (voir f.~75~v\textsuperscript{o}) ; son historien y voit « \textit{the first day of the thaw} » (Nichols 1922, p.~140). Sur les routes de l'arrière, même les voitures légères crèvent l'empierrement et l'on doit fermer des routes (OH~\mbox{1917-I}, p.~103). À Toutencourt, la Mission française de la Fifth Army (voir f.~52~v\textsuperscript{o}) paie la solde le 18, comme annoncé (voir f.~75~r\textsuperscript{o}) : 68~F~25, soit treize jours à 5~F~25 (calcul de l'éditeur). La demande sur un « cantonnement d anglais, à Toulouse » n'est pas expliquée : peut-être Combes cherche-t-il un poste auprès de troupes britanniques dans la ville de son domicile et de sa fiancée (voir f.~66~r\textsuperscript{o} et suiv.).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg et Londres, W. Blackwood & Sons, 1922, p. 140.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 103.
