critique: 'Les mots « de Marquay » (l.~9) sont d''une encre brune plus pâle que le reste de la page : le nom a sans doute été complété après coup dans un blanc.'
historique: |
  Bailleul-aux-Cornailles est à 2 km à vol d'oiseau de Marquay ; c'est l'un des quatre villages assignés à la 54th Brigade, avec La Thieuloye, Marquay et Orlencourt (JMO 7/Bedf, ordre n° 26, 23 août 1916 ; voir f. 14 v\textsuperscript{o}). Les ondées de la matinée sont aussi dans le journal des Bedfords : « Very heavy rain interfered with training » (JMO 7/Bedf, 26 août 1916). La « chambrette » est un \textit{billet} chez l'habitant : la recherche des logements revient d'ordinaire à l'interprète, et l'indemnité due au logeur, fixée en application de la loi du 3 juillet 1877 sur les réquisitions, est de 1 F par nuit et par lit d'officier, 20 c par lit de soldat (Fernand-Laurent 1917, p. 225-234). Hippolyte Combes ne changera pas de logement : le 6 septembre encore, il dit languir « ds ce trou perdu, et sale » (voir f. 19 r\textsuperscript{o}), jusqu'au départ de la brigade le 9.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916, ordre d''opérations n° 26 du 23 août et journal du 26 août (transcription en ligne).'
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 225-234.
