historique: |
  Le 24~février, des patrouilles de la 18\textsuperscript{th} Division découvrent le repli allemand préliminaire ; Serre et Pys sont occupés le 25 (OH~\mbox{1917-I}, p.~95--101). Contay, à 4~km au sud-est, est le terminus de la voie normale venue de Daours (OH~\mbox{1916-I}, p.~273--274) et abrite deux \textit{Casualty Clearing Stations} (LLT). Le « moulin » est sans doute l'un des moulins à vent du plateau (voir f.~80~v\textsuperscript{o}). Le « Village où ns sommes exilé » est Hérissart, où le service d'achats s'est installé le 7~février (voir f.~73~v\textsuperscript{o}). Le capitaine Williams va à Senlis-le-Sec, QG du II~Corps (voir f.~75~v\textsuperscript{o}), puis à Martinsart, où cantonne la 54\textsuperscript{th} Brigade (JMO~7/Bedf, févr. 1917). La « pleine lune » ne s'accorde pas avec le calendrier : nouvelle lune le 21, premier quartier le 28 (calendar-12.com).
