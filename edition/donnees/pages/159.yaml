date: Samedi 24 – lundi 26 février 1917
mois: Février 1917
lieux: Hérissart, Contay, Mirvaux et Toutencourt (Somme)
titre: Journées libres à Hérissart ; promenades vers Contay, Mirvaux, Toutencourt
transcription: |
  24 \sl{Samedi} \hfill \sl{Fév- 1917}
  \ind Journée entière, inoccupé.
  Après-midi, Courte promenade s/ route
  de Contay. Temps brumeux. Route très
  boueuse Arrivé jusqu'au moulin –
  \blanc{2}
  25 \sl{Dim.}
  \ind matin course à Mirvaux – hameau d'1
  100ne d'habitants. Silence & solitude funebre
  \ind enfin, durant qq heure, soleil brille ciel
  bleu. 1ère sensation de printemps proche
  \ind Après lunch, venu promener seul sur la
  route de Toutencourt. Beau soleil ciel bleu
  Champs ensemencés. Masses sombres de petits
  bois à l'horizon. Air encore froid.
  \ind Village où ns sommes exilé, absolt
  perdu sur hauteurs – –
  \sl{26 L} — Jour entier de liberté. Cap. W^{–}, seul
  parti vers 11^{h}, allé à Senlis & Martinsart,
  ne rentré qu'à 6^{h} \inc{s} —
  Temps beau, soleil très agréable \fr{1}{2} journée.
  Ecrit bp et lu English novel
  après tea, promenade autour & \inc{ds} les
  environs du village \trait
  \ind De nouveau, après dîner. Nuit étoilée, et
  \ind pleine lune
