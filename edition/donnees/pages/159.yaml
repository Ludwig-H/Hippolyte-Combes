critique: Encre violette uniforme. Les mots « pleine lune » sont serrés en petit module au pied de la page, sous la dernière ligne.
historique: |
  Le 24 février, au nord-est, des patrouilles de la 55th Brigade de la 18th Division découvrent le repli allemand préliminaire, commencé dans la nuit du 22 ; Serre et Pys sont occupés le 25 (OH 1917-I, p.~95--101) ; le carnet n'en dit rien. La route de Contay, à 4~km au sud-est, mène au terminus de la voie normale de Daours, avec son dépôt de munitions (OH 1916-I, p.~273--274) et les 9th et 49th \textit{Casualty Clearing Stations} (LLT) ; le « moulin » est sans doute l'un des moulins à vent du plateau que Combes décrit le 1\textsuperscript{er} mars (f.~80 v\textsuperscript{o}). Le « Village où ns sommes exilé » est Hérissart, où le service d'achats s'est installé le 7 février (voir f.~73 v\textsuperscript{o}). Le capitaine Williams gagne Senlis-le-Sec, QG du II Corps et de sa Mission française (voir f.~75 v\textsuperscript{o}), puis Martinsart, dont les baraques du bois abritent la 54th Brigade, relevée le 18 au lendemain de Boom Ravine (JMO 7/Bedf, févr. 1917). La « pleine lune » surprend : la nouvelle lune datait du 21 et le premier quartier tombe le 28 (calendar-12.com).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 95-101.
- 'Edmonds, J. E. (comp.), Military Operations, France and Belgium, 1916, vol. I, Sir Douglas Haig''s Command to the 1st July : Battle of the Somme, Londres, Macmillan, 1932, p. 273-274.'
- The Long, Long Trail (C. Baker), « Locations of British Casualty Clearing Stations », copie Wayback du 13 janv. 2018.
- 'Bedfordshire Archives Service, X550/8/1/1702 : War Diary, 7th (Service) Battalion, Bedfordshire Regiment, février 1917.'
- Calendar-12.com, « Dates of Moon Phases in 1917 » (nouvelle lune le 21 févr., premier quartier le 28 févr. 1917), consulté le 18 oct. 2026.
