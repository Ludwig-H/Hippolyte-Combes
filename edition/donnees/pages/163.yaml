critique: Page entière à l'encre violette, tachée de brun. Les comptes du 6, précédés d'un blanc et réunis par un grand crochet, sont placés entre les deux journées.
historique: |
  L'officier australien arrivé le 6 est peut-être le « Lt. Wentworth » nommé à partir du 17 mars (voir f.~84~v\textsuperscript{o}). Le nouvel interprète, sans nom ici, est soit « Evar », qui revient le 8 avec Valet, interprète de la 2nd Australian Division, et repart pour Albert, soit Valet lui-même (voir f.~82~r\textsuperscript{o}). Relevé, Hippolyte Combes va chercher une affectation au bureau de la Mission française de la Fifth Army à Toutencourt (voir f.~75~r\textsuperscript{o}), qui tient listes nominatives, fiches et carnets de notes des interprètes (SHD, GR 17 N 447-448, 463-479). Le maréchal des logis « Granger » et le capitaine « Raucoule », de lecture incertaine, ne sont pas identifiés ; le 8, on lui dira de rester auprès de son capitaine jusqu'au départ de celui-ci (voir f.~82~r\textsuperscript{o}). Doullens, à 15~km au nord-nord-ouest, abritait des hôpitaux militaires français et britanniques (CWGC) ; l'hôpital auxiliaire, qui relevait d'une société de la Croix-Rouge, n'est pas identifié. Sur les pastilles de chlorate de potasse, voir f.~69~r\textsuperscript{o}.
sources:
- Nicot, J., Schillinger, P., Ficat, J., Inventaire sommaire des archives de la guerre 1914-1918. Grand quartier général des armées alliées (15 N), GQG (16 N), Missions militaires françaises (17 N), Vincennes, Service historique de l'Armée, 1972, p. 263-269.
- Commonwealth War Graves Commission, Doullens Communal Cemetery Extension No. 1, notice historique (cwgc.org).
