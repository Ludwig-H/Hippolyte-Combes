historique: |
  L'officier australien est peut-être le « Lt. Wentworth » nommé à partir du 17~mars (voir f.~84~v\textsuperscript{o}). Le nouvel interprète est soit Evar (?), qui revient le 8 avec Valet, interprète de la 2\textsuperscript{nd} Australian Division, soit Valet lui-même (voir f.~82~r\textsuperscript{o}). Relevé, Combes cherche une affectation auprès de la Mission française de la Fifth Army à Toutencourt (voir f.~75~r\textsuperscript{o}), qui tient les fiches et carnets de notes des interprètes (SHD, GR 17 N 447--448, 463--479). Le maréchal des logis « Granger » et le capitaine « Renouleau », de lecture incertaine, ne sont pas identifiés. Doullens, à 15~km au nord-nord-ouest, avait des hôpitaux militaires français et britanniques (CWGC) ; l'hôpital auxiliaire n'est pas identifié. Sur les pastilles de chlorate de potasse, voir f.~69~r\textsuperscript{o}.
sources:
- Nicot, J., Schillinger, P., Ficat, J., Inventaire sommaire des archives de la guerre 1914-1918. Grand quartier général des armées alliées (15 N), GQG (16 N), Missions militaires françaises (17 N), Vincennes, Service historique de l'Armée, 1972, p. 263-269.
- Commonwealth War Graves Commission, Doullens Communal Cemetery Extension No. 1, notice historique (cwgc.org).
