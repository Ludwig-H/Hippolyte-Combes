fichier: 20251126_111116.jpg
date: Mardi 6 – mercredi 7 mars 1917
mois: Mars 1917
lieux: Hérissart, Doullens et Toutencourt (Somme)
titre: Officier australien et nouvel interprète ; Doullens ; démarche à la Mission
transcription: |
  6 \sl{mardi} \hfill — \sl{Mars 1917} —
  \ind tout le jour, soufflé
  bise glaciale. Ciel resté nuageux
  matinée, entier^{t} libre. Nouvel off. arrivé,
  australien, plutôt vulgaire
  \ind après-midi, venu à Doullens, avec cap. W^{m} —
  Nouvel interprète, arrivé, tr sympathique
  \ind Vers 6^{H} s allé à pied Toutencourt, Mission f^{se}.
  marl logis \inc{Granger} m'a conduit chz le cap
  \inc{Renouleau}, l'a demandé divers renseig^{ts}.
  marl logis \inc{Granger} m'a promis de me
  faire donner bon poste —.
  \ind Fini journée au mess, en cie nouvel intpte
  \blanc{2}
  \crochet{3}A Doullens : papeterie : 3^{f} + 1^{f} 50
  Carte ple : 1fc. — 2 boîtes pastilles chlorate : 1^{f}
  \droite Quête pour wounded : 50c
  \droite (Hôpital auxil^{re})
  7 \sl{Mercredi}
  \ind Matin & soir, inoccupé
  Preparé lentement paquets & sac
  Ciel resté couvert. Bise glaciale. Après-midi,
  vent soufflé en violentes rafales et fait
  bruit de tempête à travers branches \inc{des}
  arbres
  \ind Courte promenade vers 4^{H}, autour
  et ds les environs village. \hfill Visité cimetière
  \ind Temps funèbre
