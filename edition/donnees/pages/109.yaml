critique: |
  Le dimanche 10 n'a pas d'entrée propre : il est résumé le lundi 11.
historique: |
  La « no 3 Coy » est une compagnie du train de la 31\textsuperscript{st} Division, écrite « 81st » par lapsus probable, aucune division britannique ne portant ce numéro ; la 31\textsuperscript{st} tient le secteur d'Hébuterne (voir f.~53~v\textsuperscript{o}) et son train compte les compagnies 221, 222, 223 et 279 de l'A.S.C. (LLT). Le lieutenant Croughton, revu le 9~février 1917 (voir f.~75~r\textsuperscript{o}), n'est pas identifié ; un homonyme sert dans les volontaires de Londres (LG suppl. 29787, 18~oct. 1916, p.~10039). Saulty et L'Arbret (Pas-de-Calais), sur la route Doullens--Arras, sont à l'arrière de la Third Army, dont le front commence à Hébuterne (OH~\mbox{1916-II}, p.~543, n.~3) ; deux hôpitaux d'évacuation (\textit{casualty clearing stations}) y soignent les blessés de juin 1916 à mai 1917 (CWGC). La marque Wren's, de Northampton, date de 1889 (Ward 2022).
