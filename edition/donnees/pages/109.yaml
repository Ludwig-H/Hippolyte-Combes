critique: 'Le dimanche 10 n''a pas d''entrée propre : un filet sépare le 9 du 11, et la journée de la veille est résumée dans celle du lundi. La ligne de compte du bas de page, isolée après un blanc, est ouverte par une équerre.'
historique: |
  La « no 3 Coy » est une compagnie du train divisionnaire de la 31st Division, que Combes écrit « 81st » : lapsus probable, aucune division britannique ne portant ce numéro. Elle tient le secteur d'Hébuterne (OH 1917-I, p.~66 ; voir f.~53~v\textsuperscript{o}) ; son train compte en France les compagnies 221, 222, 223 et 279 de l'A.S.C. (LLT). Le lieutenant Croughton, dans l'auto duquel Combes circulera le 9 février 1917 (voir f.~75~r\textsuperscript{o}), n'est pas identifié (un homonyme de la \textit{London Gazette} sert dans les volontaires de Londres : LG suppl. 29787, 18 oct. 1916, p.~10039). Saulty et L'Arbret (Pas-de-Calais) bordent la route Doullens--Arras, à 13~km de Doullens et 22~km d'Arras ; près de la halte de Warlincourt, les 20th et 43rd CCS soignent les blessés de juin 1916 à mai 1917 (CWGC, Warlincourt Halte British Cemetery) : on est à l'arrière de la Third Army, dont le front commence à Hébuterne (Miles 1938, p.~543, n.~3). Le \textit{dubbin} est une graisse pour le cuir (Clifton et Grimaux 1883) ; la marque Wren's, de Northampton, date de 1889 (Ward 2022).
