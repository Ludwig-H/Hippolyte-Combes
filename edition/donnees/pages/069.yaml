cliche: 69
fichier: 20251126_103845.jpg
date: Dimanche 8 octobre 1916
mois: Octobre 1916
lieux: Barlette (Ribeaucourt) et Bernaville (Somme)
titre: Dimanche de repos à Barlette ; solde et indemnité touchées à Bernaville
transcription: |
  \sl{Dim. 8.} \hfill \sl{Oct^{bre} 1916}
  \ind Installation terminée . . .
  Jouis repos complet village paisible
  tout le jour, ciel couvert de nuages
  que le vent chassait av violence
  \ind Après-midi, venu à Bernaville,
  au bureau de la mission fr^{se} –
  Aller & retour à pied. Violentes rafales
  Pays très verdoyant & boisé –
  \blanc{9}
  \filet
  A Bernaville, solde & indemnité .: \inc{78^{75}}
apparat:
- ligne: 10
  lemme: \inc{78^{75}}
  type: lecture
  note: 'lecture incertaine : 78,75~F, montant habituel ; autre lecture : 78^{f}'
historique: |
  Le bureau de la Mission auprès de la 18\textsuperscript{th} Division est celui qui a visé la permission d'Hippolyte Combes le 6 (voir f.~34~r\textsuperscript{o}). Les 78,75~F font quinze jours à 5,25~F, somme déjà touchée le 5 et le 21~septembre (ff.~18~v\textsuperscript{o} et 23~v\textsuperscript{o}) : sans doute la première quinzaine d'octobre, permission comprise, les six jours d'absence n'étant retenus que le 3~novembre (f.~46~r\textsuperscript{o}) (calcul). Ce dimanche, les 1\textsuperscript{st} et 3\textsuperscript{rd} Canadian Divisions échouent devant Regina Trench (OH~\mbox{1916-II}, p.~451--452) et perdent 1~364~hommes (Nicholson 1962, p.~186) ; la 18\textsuperscript{th} Division l'enlèvera le 21~octobre (voir f.~41~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 451-452.
- Nicholson, G. W. L., Canadian Expeditionary Force 1914-1919, Ottawa, Queen's Printer, 1962, p. 186.
