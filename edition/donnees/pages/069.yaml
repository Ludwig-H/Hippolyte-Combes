critique: La moitié inférieure de la page est restée blanche ; le compte du jour est porté en pied, sous un filet.
historique: |
  Le « bureau de la mission » est celui où Hippolyte Combes a fait viser sa permission le 6 (voir f.~34 r\textsuperscript{o}) : la Mission auprès de la 18th Division, qu'il retrouvera à Albert le 18 octobre (f.~40 r\textsuperscript{o}). Les 78~F~75 sont le montant ordinaire d'une quinzaine de quinze jours, soit 15 fois 5~F~25, déjà touché le 5 et le 21 septembre (f.~18 v\textsuperscript{o} et 23 v\textsuperscript{o}) ; ce versement couvre sans doute la première quinzaine d'octobre, permission comprise, la retenue des six jours d'absence n'étant faite que le 3 novembre (f.~46 r\textsuperscript{o}) (calcul). Le même dimanche, à 4~h~50, par une pluie froide, les 1st et 3rd Canadian Divisions échouaient devant Regina Trench (OH 1916-II, p.~451--452), au prix de 1~364 hommes (Nicholson 1962, p.~186) ; la 18th Division l'enlèvera le 21 octobre (Nichols 1922, p.~131).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 451-452.
- Nicholson, G. W. L., Canadian Expeditionary Force 1914-1919, Ottawa, Queen's Printer, 1962, p. 186.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 131.
