critique: Encre violette ; la journée occupe toute la page, sans compte. « et haute » (l.~6), « était prêt » (l.~13) et le double trait de la l.~19 sont d'un tracé plus fin et plus pâle, peut-être repris après coup.
historique: |
  La hutte est au bivouac du tournant de la route de Forceville (voir f.~24 v\textsuperscript{o}). Depuis l'ouverture, le 23, de la préparation d'artillerie de la Reserve Army contre la crête de Thiepval (230 pièces lourdes, 570 de campagne), « a thick mist always prevailed in the mornings and evenings », et la Fourth Army ouvre le 24 à 7 h, « in a heavy autumn mist », le bombardement de Morval et de Lesbœufs (OH 1916-II, p.~372, 393--394). Le canon annonce l'attaque de la Fourth Army du 25 et celle de Thiepval, le 26, par la 18th Division, qui relève la 49th dans la nuit (OH 1916-II, p.~394). La musique joue à Acheux, où le QG divisionnaire reste jusqu'au 25 septembre (Nichols 1922, p.~79) et où la Mission française a son bureau dans le parc du château (voir f.~22 r\textsuperscript{o}). Le « cap \textit{Newton} », de lecture incertaine, n'est pas identifié. Les bagages faits en deux heures sont ceux de la permission qui commence le lendemain (voir f.~25 v\textsuperscript{o}) ; sur le \textit{green forage}, voir f.~3 v\textsuperscript{o}.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 372, 393-394.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 79.
