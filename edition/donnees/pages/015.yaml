critique: 'Encre noire. Deux journées sur la même page : un blanc d''environ cinq lignes et deux filets, qui encadrent l''unique ligne de comptes du 8 août, les séparent ; le 9 août n''a pas de comptes.'
historique: |
  La chaleur notée par Hippolyte Combes est celle du journal du 7th Bedfordshire, qui porte « Fine hot day » du 29 juillet au 4 août et encore le 10 août (JMO 7/Bedf, juill.-août 1916). Le mercredi 9, qu'Hippolyte Combes passe enfermé, « about 50 heavy shells » tombent sur Armentières, à 6,5 km de là (JMO 7/Bedf, 9 août 1916) ; dans la nuit du 8 au 9, au sud d'Ypres, les Allemands lancent contre le VIII Corps la seule attaque par gaz notable de l'été et de l'automne sur le front britannique, ressentie jusqu'à Poperinghe (OH 1916-II, pp. 544-545). La poussière vient sans doute des convois de la route de Bac-Saint-Maur, qui mène à la tête de ligne des vivres du secteur (voir f. 7 r\textsuperscript{o}). Les moustiques tiennent à la basse plaine de la Lys, gorgée d'eau : derrière Fleurbaix, la Layes coule à 12 pieds au-dessus de la Lys, et le génie australien dut abaisser en 1916 la nappe du secteur avant de 2 pieds 6 pouces par un drainage gradué (Ellis [1920], p. 119). Les œufs, achetés 50 c le 8 août, ont vu leur prix urbain monter à l'indice 172 en août 1916 (base 1914 = 100 : March 1925, p. 226).
sources:
- Bedfordshire Archives Service, X550/8/1/1607b et 1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet-août 1916.
