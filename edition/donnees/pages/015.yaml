historique: |
  La chaleur est aussi notée dans le journal du 7\textsuperscript{th} Bedfordshire : « Fine hot day » du 29~juillet au 4~août, et encore le 10~août (JMO~7/Bedf, juill.--août 1916). Le 9, « about 50 heavy shells » tombent sur Armentières, à 6,5~km de là (JMO~7/Bedf, 9~août 1916). La poussière vient sans doute des convois de la route de Bac-Saint-Maur, vers la tête de ligne des vivres (voir f.~7~r\textsuperscript{o}). Les moustiques tiennent à la plaine de la Lys, gorgée d'eau : en 1916, le génie australien dut abaisser de 2~pieds 6~pouces la nappe du secteur avant, derrière Fleurbaix (Ellis [1920], p.~119).
sources:
- Bedfordshire Archives Service, X550/8/1/1607b et 1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet-août 1916.
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 119.
