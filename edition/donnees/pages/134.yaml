critique: Encre violette sur toute la page. Les comptes du jour, au pied de la page, sont ouverts par un grand crochet qui couvre quatre lignes.
historique: |
  La « chambre rue » est celle de l'appartement de la rue de Languedoc (voir f.~31 r\textsuperscript{o}). Le panier de fleurs venu de Nice est l'envoi de Mme Spagnol (télégramme du 31, f.~68 r\textsuperscript{o} ; mandat de 42 francs le 21 février, f.~79 r\textsuperscript{o}), non identifiée. « Mad\textsuperscript{ne} » est sans doute Madeleine Calmels, épouse du Dr Fernand Vincens et sœur aînée de Marguerite (voir f.~66 v\textsuperscript{o}). La crypte de Saint-Sernin, sous le chœur, qui « renferme les reliques d'un très grand nombre de saints », coûte 50 c l'entrée (Baedeker 1912, p.~302) : le franc payé vaut sans doute deux entrées. En 1896, les parents d'Hippolyte Combes habitaient 47, rue du Taur, qui mène du Capitole à Saint-Sernin (registre matricule, Toulouse, classe 1896). Les « Magasins du Capitole » sont le grand magasin « Au Capitole » ; Labit, la « Maison universelle » d'Antoine Labit, rue d'Alsace-Lorraine, réputé le premier de la ville (immeuble de 1877) (Mérimée PA31000123). Le retour emprunte la ligne de tramway Capitole -- Côte-Pavée (Baedeker 1912, p.~298).
sources:
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne. Manuel du voyageur, Leipzig, K. Baedeker, 1912, p. 298, 302.
- Archives départementales de la Haute-Garonne, registre matricule du recrutement de Toulouse, classe 1896, n° 911 (Combes, Marie Lucien Hippolyte).
- Ministère de la Culture, base Mérimée, notice PA31000123 (musée Georges-Labit, Toulouse), consultée via monumentum.fr ; PSS-Archi, fiche FR-31555-9853 (ancien bazar Labit).
- Combes, Pierre, livre familial dactylographié, annexe généalogique (PC-Annexe), archives familiales.
