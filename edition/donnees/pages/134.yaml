historique: |
  La « chambre rue » est celle de l'appartement de la rue de Languedoc (voir f.~31~r\textsuperscript{o}). Le panier de fleurs vient de Nice, sans doute de M\textsuperscript{me} Spagnol, non identifiée (télégramme le 31, f.~68~r\textsuperscript{o} ; mandat de 42~F le 21~février, f.~79~r\textsuperscript{o}). « Mad\textsuperscript{ne} » est sans doute Madeleine, sœur aînée de Marguerite (voir f.~66~v\textsuperscript{o}). L'entrée de la crypte de Saint-Sernin coûte 50~c (Baedeker 1912, p.~302) : le franc payé vaut sans doute deux entrées. En 1896, les parents de Combes habitaient 47, rue du Taur, entre le Capitole et Saint-Sernin (registre matricule, Toulouse, classe 1896). Labit est sans doute la « Maison universelle » d'Antoine Labit, rue d'Alsace-Lorraine (Mérimée PA31000123).
sources:
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne. Manuel du voyageur, Leipzig, K. Baedeker, 1912, p. 302.
- Archives départementales de la Haute-Garonne, registre matricule du recrutement de Toulouse, classe 1896, n° 911 (Combes, Marie Lucien Hippolyte).
- Ministère de la Culture, base Mérimée, notice PA31000123 (musée Georges-Labit, Toulouse), consultée via monumentum.fr ; PSS-Archi, fiche FR-31555-9853 (ancien bazar Labit).
