critique: Encre violette. Les deux « Toutencourt », « Admiré » et l'initiale du second « Après-midi » sont repassés d'un trait très appuyé, peut-être sur une première écriture.
historique: |
  Le lundi 23, jour où la Third Army attaque à l'est d'Arras (voir f.~91 r\textsuperscript{o}), le carnet ne retient que le beau temps et les courses du service d'achats. Acheux, « presque désert et mort » le 25, où Hippolyte Combes avait eu son bureau de novembre à février (voir f.~73 v\textsuperscript{o}), a perdu le 2 avril le QG du V Corps, parti pour Bihucourt derrière le nouveau front (LLT). Puchevillers garde encore un hôpital d'évacuation, la 61st (South Midland) CCS, arrivée en mars après le départ des 3rd et 44th CCS (LLT). Le chemin de Mirvaux, au sud d'Hérissart, domine la vallée de l'Hallue, où Faidherbe avait livré le 23 décembre 1870 la bataille dite de Pont-Noyelles (Faidherbe 1871) ; à Montigny, Hippolyte Combes avait traité avec le maire, Paul Dubois (f.~59 v\textsuperscript{o}). Les « métiers à tisser » vus le 23 témoignent peut-être d'un tissage à domicile encore pratiqué dans ces villages ; le carnet ne dit ni où ni chez qui. Mme Mignot et Louise, de Pierregot, ne sont pas identifiées ; sur les Denis, voir f.~89 r\textsuperscript{o}.
sources:
- The Long, Long Trail (C. Baker), « The British V Corps in France and Flanders », copie Wayback d'août 2020.
- The Long, Long Trail (C. Baker), « Locations of British Casualty Clearing Stations », copie Wayback du 13 janv. 2018.
- Faidherbe, L., Campagne de l'armée du Nord en 1870-1871, Paris, E. Dentu, 1871.
