critique: Deux journées séparées par un blanc d'environ trois lignes et un filet. Le filet qui isole les comptes, tiré après coup, traverse les hampes de « blanchissage ».
historique: |
  Le lundi 14 août 1916 est le quarantième anniversaire de Combes, né à Millau le 14 août 1876 (acte de naissance n\textsuperscript{o} 395) : l'entrée n'en dit rien, pas plus que de la visite que George V, avec le prince de Galles et le général Plumer, fait ce jour-là à l'école de grenadiers et de raids de la 5th Australian Division à Sailly-sur-la-Lys, à 2,5 km de La Croix-du-Bac (Ellis [1920], pp. 120-121), puis au camp de la 53rd Brigade, au pied du Mont de Lille (Banks \& Chell 1924, p. 143). Dans la nuit du 14 au 15, un \textit{dummy raid} du 7th Bedfordshire devant Armentières coûte la vie au 2nd Lt David Arnold Roeber, 18 ans, et à trois hommes (JMO 7/Bedf, 15 août 1916 ; CWGC). Le « pot-au-noir », terme de marine désignant les calmes équatoriaux (OQLF, GDT), dit sans doute ici l'humeur sombre du jour. Le mot attendu est de Marguerite Calmels (voir f. 1 r\textsuperscript{o}) ; Maurin n'est pas identifié (voir f. 7 r\textsuperscript{o}).
sources:
- Acte de naissance n° 395, état civil de Millau (Aveyron), 16 août 1876 (Marie Lucien Hippolyte Combes, né le 14 août 1876).
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], pp. 120-121.
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 143.
- Bedfordshire Archives Service, X550/8/1/1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (JMO 7/Bedf).
- CWGC, Second Lieutenant David Arnold Roeber, 3rd Bn. attd. 7th Bn. Bedfordshire Regiment, mort le 14 août 1916, Ration Farm Military Cemetery, La Chapelle-d'Armentières, II.C.2.
- Office québécois de la langue française, Grand Dictionnaire terminologique, fiche « pot au noir » (consulté le 18 oct. 2026).
