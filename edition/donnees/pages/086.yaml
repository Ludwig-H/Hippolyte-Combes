critique: La date du samedi 28 est alignée sur « Tjours gros nuages », la mention « Encore temps pluvieux » étant écrite plus haut, à sa droite. La fin de la page, plus pâle, est écrite d'une plume moins chargée.
historique: |
  Ces journées sont celles où, dit l'histoire officielle, les troupes, « froides et souvent mouillées jusqu'aux os », attendent une attaque « constamment remise mais jamais annulée » (OH 1916-II, p.~480). Le 7th Bedfordshire, relevé de Regina Trench le 25, cantonne à Albert et prépare l'attaque de la 54th Brigade sur Petit-Miraumont, remise de jour en jour « by weather » (JMO 7/Bedf, 26--31 oct. 1916). L'interprète, chargé surtout des rapports avec les habitants, n'a guère d'emploi dans une ville vidée de sa population (voir f.~39~v\textsuperscript{o}). Le « R.F. » qui lui coupe les cheveux est sans doute un homme du 11th Royal Fusiliers, autre bataillon de la brigade (Becke 1938, p.~82). La lecture « R.E. », proposée ailleurs, en ferait un sapeur du génie. La coupe coûte 50~c, comme en septembre (f.~19~r\textsuperscript{o}) ; elle ne coûtera plus que 30~c au printemps 1917 (f.~78~v\textsuperscript{o}, 88~r\textsuperscript{o}). L'église est la basilique Notre-Dame de Brebières et sa Vierge penchée (voir f.~42~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 480.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
