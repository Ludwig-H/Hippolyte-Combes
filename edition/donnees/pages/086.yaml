historique: |
  Les troupes, « froides et souvent mouillées jusqu'aux os », attendent alors une attaque « constamment remise mais jamais annulée » (OH~\mbox{1916-II}, p.~480). Relevé de Regina Trench le 25, le 7\textsuperscript{th} Bedfordshire cantonne à Albert et prépare l'attaque de la 54\textsuperscript{th} Brigade sur Petit-Miraumont, remise de jour en jour \textit{by weather} (JMO~7/Bedf, 26--31~oct. 1916). Chargé surtout des rapports avec les habitants, l'interprète est sans emploi dans une ville vidée (voir f.~39~v\textsuperscript{o}). Le « R.F. » est sans doute du 11\textsuperscript{th} Royal Fusiliers, autre bataillon de la brigade (Becke 1938, p.~82). L'église est la basilique Notre-Dame de Brebières (voir f.~42~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 480.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 82.'
