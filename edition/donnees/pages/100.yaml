historique: |
  Le 17 est « une autre journée claire et froide » ; la première neige tombe la nuit, et l'assaut final des II et V Corps part le 18 à 6~h~10 « dans un tourbillon de grésil qui se changea ensuite en pluie » (OH 1916-II, p.~513--514). La 55th Brigade de la 18th Division, ancienne division d'Hippolyte Combes, attaque \textit{Desire Trench} ; deux compagnies des 7th Queen's et 7th Buffs y sont anéanties (Nichols 1922, p.~133--136). Le 18 marque la fin officielle des batailles de la Somme (OH 1916-II, p.~xliv). La Y.M.C.A. ne faisait pas payer ses conférences (Yapp 1918, chap.~IV). Les 88~F de solde ne sont pas un multiple des 5,25~F par jour habituels (voir f.~40~r\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. xliv, 513-519.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh, Blackwood, 1922, p. 133-136.
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV.
