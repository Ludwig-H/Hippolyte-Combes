date: Vendredi 17 – samedi 18 novembre 1916
mois: Novembre 1916
lieux: Acheux-en-Amiénois, Authie et Albert (Somme) ; Orville et Amplier (Pas-de-Calais)
titre: Gel ; Authie, Orville, Amplier ; conférence sur la Russie ; canonnade et neige
transcription: |
  \sl{17 Ven.} \hfill \sl{Nov^{bre} –16}
  \ind[2] Nuit gelé très
  fortt Sol, durci. Vitres, couvertes d'arabesques
  \fr{1}{2} jour, soleil brillé, mais bise glaciale
  soufflé et soulevé routes nuages de poussière
  \ind Toute matinée, roulé en auto. Authie,
  coquet bourg au fond d'1 vallon —
  Orville et Amplier – Sites assez \inc{j.}
  Après-midi, liberté complète
  A 6^{H} s, venu hut de Y.M-C-A- et entendu
  conférence s/ Russie – –
  \ind Comme ts les soirs précédents, nuit noire
  bombardement très violent ds le lointain
  \filet
  \sl{18 Sam.} Durant tte nuit & + fort^{t} encore
  \ind[2] aux 1^{ère} heures jour, très violente
  canonnade, ds le lointain. Fenêtres & portes,
  vibrant sans arret Obus eclatent à coups
  de + en + précipités : on dirait énormes vagues
  déferlant s/ rochers av 1 bruit de tonnerre
  \ind[2] Matinée, venu à Albert. aller &
  retour, sur 1 lorry – –
  \ind Neige tombé matin — 1^{ère} neige,
  mais peu à peu, fondue sous pluie fine
  Routes détrempées, vraies fondrières
  \equerre{1}\equerred{1}— Albert : solde : 88 \inc{fr} – — 3 C^{tes} p^{les} : 30 c
