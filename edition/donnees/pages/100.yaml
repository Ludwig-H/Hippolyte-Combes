critique: Le compte final est enfermé entre deux équerres, la fermante prolongeant le délié de « fondrières ».
historique: |
  Le 17 est « une autre journée claire et froide » ; dans la nuit tombe la première neige de l'hiver, et l'assaut final des II et V Corps part le 18 à 6~h~10 « dans un tourbillon de grésil qui se changea ensuite en pluie » (OH 1916-II, p.~513--514) : c'est la neige « fondue sous pluie fine » du carnet. Au sud de l'Ancre, la 55th Brigade de la 18th Division, l'ancienne division d'Hippolyte Combes, attaque \textit{Desire Trench} aux côtés de la 4th Canadian Division ; deux compagnies du 7th Queen's et du 7th Buffs y sont anéanties, faute de liaison avec la 19th Division (Nichols 1922, p.~133--136 ; OH 1916-II, p.~514--519). Le 18 novembre est la date officielle de la fin des batailles de la Somme (OH 1916-II, p.~xliv); rien ne permet d'attribuer à ce seul secteur la canonnade entendue d'Acheux. La Y.M.C.A. consacrait de fortes sommes aux \textit{lectures} et n'en faisait pas payer l'entrée dans ses huttes (Yapp 1918, chap.~IV). Les 88~F de la solde ne sont pas un multiple des 5,25~F par jour des autres versements (voir f.~40~r\textsuperscript{o}) : rappel ou rajustement inexpliqué.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. xliv, 513-519.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh, Blackwood, 1922, p. 133-136.
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV.
