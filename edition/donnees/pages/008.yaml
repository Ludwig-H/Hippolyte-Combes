critique: 'Encre noire virée au brun. Seul le haut de la page est écrit : les comptes, encadrés de deux filets, laissent blanc le dernier tiers du feuillet.'
historique: |
  Libre ce jour-là, Combes gagne à pied Bailleul (Nord), à 3 km environ de son cantonnement. Occupée par les Britanniques le 14 octobre 1914, la ville est en 1916 un grand centre ferroviaire, aérien et hospitalier et abrite un QG de corps d'armée jusqu'en juillet 1917 ; elle tombe le 15 avril 1918, pendant la bataille de la Lys (CWGC, Bailleul Communal Cemetery Extension). L'hôtel de ville est dominé par le beffroi, dont la salle basse gothique remonte au XII\textsuperscript{e} siècle ; la ville étant rasée à 98 \% en 1918, l'hôtel de ville est reconstruit en 1929 (Mérimée PA00107358, PA59000232), et le beffroi figure depuis 2005 parmi les beffrois de Belgique et de France inscrits au patrimoine mondial (UNESCO 943-033). Sur l'église Saint-Vaast, voir f. 4 v\textsuperscript{o}. Combes connaît Béthune pour avoir servi en mai–juillet 1915 dans ce secteur auprès du \textit{1\textsuperscript{st} Battalion, Irish Guards} (voir le plan autographe des \textit{Feuillets de Route}, chap.~\textsc{v}–\textsc{vi}, en annexe, et f. 46 v\textsuperscript{o}). Les « 4 pattes cuivre » (lecture incertaine) achetées chez M. Guetin, commerçant non identifié, sont peut-être des patères pour l'installation du « garret ».
sources:
- Commonwealth War Graves Commission, Bailleul Communal Cemetery Extension (Nord), historique du cimetière, fiche 2000048.
- Ministère de la Culture, base Mérimée (POP), notices PA00107358 (beffroi et hôtel de ville de Bailleul) et PA59000232 (monument aux morts de Bailleul).
- UNESCO, Centre du patrimoine mondial, « Beffrois de Belgique et de France », n° 943bis, élément 943-033 (Bailleul).
