historique: |
  Candas est le point de départ de la voie normale Candas--Acheux, construite au printemps 1916 (OH 1916-I, p.~273), et le siège du dépôt n\textsuperscript{o}~2 d'aviation du R.F.C. (Jones 1928, p.~198--199). Le chauffeur australien s'explique par le passage du I Anzac Corps à la Fifth Army le 15 février (OH 1917-I, p.~74). La Vauxhall type D était la voiture d'état-major britannique courante (Tattersfield 2021) ; « Jessie » (lecture incertaine) n'est pas identifié. Les \textit{Expeditionary Force Canteens} vendaient les marques britanniques presque au prix coûtant (Fernand-Laurent 1917, p.~82--83) ; la boîte de Calvert's, payée 60~c à Louvencourt le 2 janvier (voir f.~59~r\textsuperscript{o}), coûte ici près de 88~c.
