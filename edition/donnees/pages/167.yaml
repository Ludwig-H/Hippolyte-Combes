titre: Calme de la nouvelle chambre ; tournée en Wolseley de Toutencourt à Candas
transcription: |
  D\sl{im. 11 (}Fin) \hfill Mar\sl{s 191}7
  2 fenêtres. Impressions de calme & silence, \inc{favorables}
  à reverie & étude \trait
  \ind Matinée, vrai printemps. Soleil très chaud.
  après-midi, averses & brume \trait
  \blanc{1}
  [A Herissart, tommy \inc{aidé} \inc{porter} sacs : 50c
  \filet
  L\sl{undi} 12 — Levé 7^{h} m. — très bonne nuit.
  Achevé de m'installer nouvelle maison. Y serai bien.
  \ind Tout le jour, temps brumeux & par moments,
  pluie fine
  \ind Matinée. courses, à \add{Toutencourt,} Contay, \inc{Beaucourt} &
  Molliens-au-Bois. Auto \inc{Wolsey}, conduite par
  1 australien, moins confortable que le Vauxhall
  de \inc{Jessie}.
  \ind Tout l'après-midi, à Puchevillers, puis
  Raincheval Candas.
  \blanc{8}
  \crochet{2}Toutencourt : Exp. F. Canteen : 2 tins of
  Calvert's Tooth Powder : 1^{f} 75c
