critique: Les premières lignes achèvent la journée du dimanche 11 commencée au recto. Encre violette ; le compte de la cantine de Toutencourt, isolé au pied de la page après un long blanc, est d'une encre plus noire et fut sans doute inscrit à part.
historique: |
  Maintenu au \textit{Purchase Board} à la demande du Major Levy (voir f.~83~r\textsuperscript{o}), Combes reprend ses tournées. « Beaumont », cité entre Contay et Molliens-au-Bois, ne peut guère être Beaumont-Hamel : peut-être faut-il lire un autre nom. Candas est l'origine de la voie normale Candas--Acheux construite au printemps 1916 (OH 1916-I, p.~273) et le siège du dépôt n\textsuperscript{o}~2 d'aviation du R.F.C. (Jones 1928, p.~198--199). Le chauffeur australien s'explique par le passage du I Anzac Corps à la Fifth Army le 15 février (OH 1917-I, p.~74). La Vauxhall type D était la voiture d'état-major ordinaire de l'armée britannique (Tattersfield 2021) ; « Jessie » (lecture incertaine) n'est pas identifié. C'est la seule mention explicite des \textit{Expeditionary Force Canteens}, qui vendaient les marques britanniques presque au prix coûtant (Fernand-Laurent 1917, p.~82--83) ; la boîte de Calvert's, payée 60~c à Louvencourt le 2 janvier (voir f.~59~r\textsuperscript{o}), revient ici à près de 88~c. Dans la nuit, les Allemands évacuent la ligne R.1 devant Bapaume (OH 1917-I, p.~107).
