historique: |
  L'histoire officielle britannique date le dégel de ce vendredi 16, après un gel continu depuis le 14~janvier (OH~\mbox{1917-I}, p.~66, 76). Le 15, courses habituelles des achats : Raincheval, où siégeait en décembre l'Army Purchase Board (voir f.~56~r\textsuperscript{o}), Puchevillers (voir f.~55~r\textsuperscript{o}), Toutencourt, QG de la Fifth Army (voir f.~49~v\textsuperscript{o}). La visite au maire d'Hérissart, non nommé, fait partie du rôle de l'interprète, « trait d'union entre les Anglais et les habitants du pays » (Fernand-Laurent 1917, p.~\textsc{xiv}). Beaucourt est sans doute Beaucourt-sur-l'Hallue, dans la vallée desservie depuis mai 1916 par la voie normale Daours--Contay (OH~\mbox{1916-I}, p.~273), et non Beaucourt-sur-l'Ancre, village détruit sur l'ancien front. Le château de Beaucourt-sur-l'Hallue, bâti vers 1750, subsiste (Inventaire IA80000292).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 66, 76.
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XIV.
- 'Région Hauts-de-France, Inventaire général du patrimoine culturel, dossier IA80000292 : château de Beaucourt-sur-l''Hallue (enquête 2000).'
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 273.
