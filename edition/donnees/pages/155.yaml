critique: Encre violette homogène ; les deux journées des 15 et 16 février sont séparées par une ligne blanche, sans comptes.
historique: |
  Le « dégel très rapide » du vendredi 16 est celui que l'histoire officielle britannique date de ce jour même, au terme d'un gel ininterrompu depuis le 14 janvier (OH 1917-I, p.~66, 76) ; Haig le place « dans la troisième semaine de février » (Haig, \textit{Despatches}, p.~69--70). Les courses du 15 suivent le circuit habituel des achats : Raincheval, siège de l'\textit{Army Purchase Board} (voir f.~46~r\textsuperscript{o}), Puchevillers (voir f.~55~r\textsuperscript{o}), Toutencourt, QG de la Fifth Army (voir f.~49~v\textsuperscript{o}). La visite « grand costume » au maire d'Hérissart, non nommé, relève des rapports avec les autorités civiles qui font de l'interprète le « trait d'union entre les Anglais et les habitants du pays » (Fernand-Laurent 1917, p.~XIV). Beaucourt est sans doute Beaucourt-sur-l'Hallue (Somme), au sud de Contay, et non Beaucourt-sur-l'Ancre, village détruit de l'ancienne ligne de feu ; son château, bâti vers 1750, subsiste (Inventaire IA80000292). La vallée de l'Hallue est desservie depuis mai 1916 par la voie normale Daours--Contay (OH 1916-I, p.~273).
