critique: Encre noire virée au brun. Les deux journées sont séparées par un filet pleine largeur ; les dépenses du 30, en retrait et précédées d'un tiret, sont intercalées dans le récit avant ce filet.
historique: |
  Le cantonnement est une ferme près de Saint-Jans-Cappel (Nord), où la compagnie est arrivée le 28 juillet (voir f. 2 v\textsuperscript{o}) ; la 54th Brigade campe au « Steam Mill », à l'ouest de Bailleul (JMO 7/Bedf, 28 juill. 1916). La messe du 30 est célébrée dans l'église de la Décollation-de-Saint-Jean-Baptiste (Palissy). Hancock, chef cuisinier (\textit{headcook}) du mess, n'est pas identifié ; son pourboire de 5 f approche une journée de solde et d'indemnité de l'interprète, environ 5,25 F (voir f. 2 r\textsuperscript{o}). Au \textit{refilling point}, la compagnie reçoit des camions de la \textit{supply column} les vivres de la brigade (FSPB 1914, « Definitions » ; Puckle 1917, p. 10) ; le fourrage vert, fauché et payé sur place, complète la ration de foin des chevaux (FSPB 1914, chap. 6, § 20). Ce 31 juillet, le général Plumer, commandant la Second Army, reçoit au QG de la brigade les chefs de bataillon (JMO 7/Bedf, 31 juill. 1916). La « crête boisée » aux moulins est sans doute celle des monts de Flandre (Mont-Noir, Mont-Rouge), au nord du village.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1607 : War Diary, 7th (Service) Battalion, Bedfordshire Regiment, juillet 1916 (28 et 31 juill.).'
- Field Service Pocket Book, 1914, London, HMSO, 1914, « Definitions » et chap. 6, « Supply », « Forage », § 20.
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 10.
- Ministère de la Culture, base Palissy (POP), objets mobiliers de la commune de Saint-Jans-Cappel (Nord).
