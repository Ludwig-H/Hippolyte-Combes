historique: |
  La compagnie cantonne depuis le 28~juillet dans une ferme près de Saint-Jans-Cappel (voir f.~2~v\textsuperscript{o}) ; sur l'église, voir f.~3~r\textsuperscript{o}. Hancock, chef cuisinier du mess, n'est pas identifié ; son pourboire de 5~F approche une journée de solde et d'indemnité de l'interprète, environ 5,25~F (voir f.~2~r\textsuperscript{o}). Au \textit{refilling point}, la compagnie reçoit des camions de la \textit{supply column} les vivres de la brigade (FSPB 1914, « Definitions » ; Puckle 1917, p.~10). Ce 31~juillet, le général Plumer, chef de la Second Army, reçoit au QG de la brigade les chefs de bataillon (JMO~7/Bedf, 31 juill. 1916). La « crête boisée » est sans doute celle des monts de Flandre (Mont-Noir, Mont-Rouge), au nord du village.
