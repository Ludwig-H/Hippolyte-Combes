critique: La journée du dimanche 11, amorcée au bas du f.~75~v\textsuperscript{o}, est reprise ici sous une nouvelle date.
historique: |
  Toutencourt est le QG de la Fifth Army (voir f.~75~r\textsuperscript{o}). Doullens abrite depuis le 12 janvier 1917 le QG du XIII Corps (LLT) ; la citadelle y est un hôpital militaire français (CWGC ; OH 1916-II, p.~541). Auxi-le-Château (Pas-de-Calais) est à une vingtaine de kilomètres en aval sur l'Authie ; Hippolyte Combes y était venu le 17 janvier chez M.~Renard (voir f.~62 r\textsuperscript{o}). M.~Romert n'est pas identifié. Le froid du retour appartient au grand gel commencé vers le 14 janvier, qui ne cède que le 16 février (OH 1917-I, p.~66, 76). Le chocolat est au même prix qu'à Doullens le 15 janvier (voir f.~61 v\textsuperscript{o}). Le Petit Beurre est le biscuit créé à Nantes en 1886 par Louis Lefèvre-Utile (Musée d'histoire de Nantes).
