critique: Encre violette ; tache d'encre en haut de la page. La journée du dimanche 11, amorcée au bas du f.~75 v\textsuperscript{o}, est reprise ici sous une nouvelle date. Les comptes, séparés du texte par un blanc, sont enfermés à gauche par un grand crochet à longs pieds horizontaux.
historique: |
  La course passe par Toutencourt, QG de la Fifth Army (voir f.~75 r\textsuperscript{o}), puis par Doullens, où siège depuis le 12 janvier 1917 le QG du XIII Corps (LLT) et où se trouvent la citadelle, hôpital militaire français, et des hôpitaux britanniques (CWGC ; OH 1916-II, p.~541). Auxi-le-Château (Pas-de-Calais) est à une vingtaine de kilomètres en aval sur l'Authie ; Hippolyte Combes y était venu le 17 janvier chez M.~Renard (voir f.~62 r\textsuperscript{o}). M.~Romert n'est pas identifié. Le kirsch de Forêt-Noire, eau-de-vie badoise, vient sans doute d'une cave d'avant-guerre. Le froid vif du retour appartient au grand gel commencé vers le 14 janvier, qui ne cède que le 16 février (OH 1917-I, p.~66, 76). Dans les comptes, le chocolat est au même prix qu'à Doullens le 15 janvier (voir f.~61 v\textsuperscript{o}) ; le Petit Beurre est le biscuit mis au point à Nantes en 1886 par Louis Lefèvre-Utile, dont la forme et la marque sont déposées en 1888 (Musée d'histoire de Nantes).
