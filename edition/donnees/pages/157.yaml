historique: |
  Fréchencourt et Bavelincourt sont dans la vallée de l'Hallue, desservie depuis mai 1916 par la voie normale Daours--Contay ; Fréchencourt était tête de ligne des vivres de la Fourth Army le 1\textsuperscript{er} juillet 1916 (OH 1916-I, p.~273--274). Le « cap\textsuperscript{e} Leonard » n'est pas identifié : peut-être le capitaine Robert Marsh Leonard, de l'A.S.C. (TNA, WO 374/41729) (hypothèse fragile) ; les nouveaux \textit{billets} relèvent en tout cas du \textit{Town Major}, qui tient la liste des logements numérotés de la localité (Fernand-Laurent 1917, p.~227 ; voir f.~73~v\textsuperscript{o}). La chambre libérée par le capitaine Williams (voir f.~52~v\textsuperscript{o}) jouxte le bureau ; Williams ne partira définitivement que le 10 mars (voir f.~82~v\textsuperscript{o}). La « propre » du n\textsuperscript{o}~104 est la logeuse d'une autre maison ; le M.O., \textit{Medical Officer}, est un médecin militaire britannique. Albertine, blanchisseuse d'Hérissart, est inconnue ; ses 1~F~70 dépassent les notes de blanchissage de l'hiver, souvent de 60 à 80~c (relevé de l'éditeur).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 273-274.
- 'The National Archives (Kew), WO 374/41729 : dossier d''officier du Captain Robert Marsh Leonard, Army Service Corps (notice du catalogue).'
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. 227.
