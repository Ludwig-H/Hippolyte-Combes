historique: |
  Fréchencourt et Bavelincourt sont sur l'Hallue (voir f.~77~v\textsuperscript{o}) ; Fréchencourt était tête de ligne des vivres de la Fourth Army le 1\textsuperscript{er}~juillet 1916 (OH~\mbox{1916-I}, p.~274). Le « cap\textsuperscript{e} Leonard » n'est pas identifié. Les \textit{billets} relèvent du \textit{Town Major}, qui tient la liste des logements numérotés (Fernand-Laurent 1917, p.~227 ; voir f.~73~v\textsuperscript{o}). Le capitaine Williams (voir f.~52~v\textsuperscript{o}) ne partira définitivement que le 10~mars (voir f.~82~v\textsuperscript{o}). Albertine, blanchisseuse d'Hérissart, est inconnue ; ses 1,70~F dépassent les notes de blanchissage de l'hiver, souvent de 60 à 80~c (relevé de l'éditeur).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, Londres, Macmillan, 1932, p. 274.
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. 227.
