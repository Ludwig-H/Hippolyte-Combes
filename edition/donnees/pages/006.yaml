historique: |
  Le Mont-Noir est un hameau de Saint-Jans-Cappel, sur la frontière belge, à 1,8~km du village (OSM). Le fourrage fauché et pesé est du fourrage vert, qui complète la ration de foin (FSPB 1914, chap.~6, « Forage », § 20). « La dernière attaque » est celle de la Somme : Montauban le 1\textsuperscript{er}~juillet, puis le bois des Trônes, pris par la 54\textsuperscript{th} Brigade le 14 (Nichols 1922, p.~51--74) ; du 14 au 21~juillet, la division a perdu 129~officiers et 2~597~hommes (OH~\mbox{1916-II}, p.~107, n.~3). Leroux (lecture incertaine), peut-être un vicaire, n'est pas identifié. Ballons et canonnade viennent sans doute du front de Wytschaete–Messines, à une douzaine de kilomètres à l'est, allemand jusqu'au 7~juin 1917 (CWGC). L'église est celle de la Décollation-de-Saint-Jean-Baptiste (Palissy).
sources:
