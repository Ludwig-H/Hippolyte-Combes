- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg–Londres, Blackwood, 1922, p. 51-74.
- Miles, Wilfrid (comp.), Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 107, n. 3.
