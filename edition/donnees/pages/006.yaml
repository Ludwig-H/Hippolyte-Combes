critique: 'La mention « St Jans -cappel (1) », serrée au-dessus du filet, et la dernière ligne de la note sont d''une encre plus pâle, brunâtre : ajouts probables. La note (1), décrivant le village, est séparée des comptes par un blanc et un filet.'
historique: |
  Le Mont-Noir, hameau de Saint-Jans-Cappel sur la frontière belge, à 1,8 km du village (OSM), avait été pris par le Cavalry Corps britannique le 13 octobre 1914 (CWGC, Mont Noir Military Cemetery). Le fourrage fauché et pesé est le fourrage vert (\textit{« rye grass, lucerne, sainfoin, clover »}) qui complète la ration de foin (FSPB 1914, chap. 6, « Forage », § 20) ; sur Curtis, voir f. 1 r\textsuperscript{o}. « La dernière attaque » est celle de la Somme : Montauban le 1\textsuperscript{er} juillet, puis le bois des Trônes, emporté par la 54th Brigade le 14 (Nichols 1922, p.~51--74) ; du 14 au 21 juillet, la division a perdu 129 officiers et 2~597 hommes (OH 1916-II, p.~107, n.~3). L'interlocuteur, peut-être un vicaire, n'est pas identifié. Les houblonnières sont propres au pied des monts de Flandre, culture « délicate et coûteuse » (Blanchard 1906, p.~359--360). Ballons et canonnade viennent sans doute du front de Wytschaete–Messines, à une douzaine de kilomètres à l'est, allemand jusqu'au 7 juin 1917 (CWGC). L'église est celle de la Décollation-de-Saint-Jean-Baptiste (Palissy).
sources:
- Commonwealth War Graves Commission, historiques des cimetières « Mont Noir Military Cemetery », « Wytschaete Military Cemetery » et « Messines Ridge British Cemetery ».
- Field Service Pocket Book, 1914, Londres, HMSO, 1914, chap. 6, « Forage », § 20.
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg–Londres, Blackwood, 1922, p. 51-74.
- Miles, Wilfrid (comp.), Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 107, n. 3.
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, p. 359-360.
- Ministère de la Culture, base Palissy, objets mobiliers de la commune de Saint-Jans-Cappel.
