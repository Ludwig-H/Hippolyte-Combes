historique: |
  Monin n'est pas identifié ; c'est sans doute, comme Hippolyte Combes, un interprète attaché à une compagnie britannique de passage. Ce même 26~mars, la 18\textsuperscript{th} Division, qu'Hippolyte Combes a quittée le 2~novembre, embarque à Saleux pour un mois de repos vers Aire et Hazebrouck (JMO~7/Bedf ; Nichols 1922, p.~166). Les troupes quittent Hérissart quand les états-majors se déplacent : le 27, le QG du II~Corps passe de Senlis à Pernes ; le 28, celui de la Fifth Army, de Toutencourt à Albert (LLT). À Puchevillers, les 3\textsuperscript{rd} et 44\textsuperscript{th} CCS partent en mars (LLT ; CWGC). Les routes sont « presque ruinées » par le trafic, le gel et le dégel (OH~\mbox{1917-I}, p.~151).
