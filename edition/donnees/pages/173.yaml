critique: Encre violette homogène, d'un tracé régulier ; les deux entrées des 22 et 23 mars sont séparées par un filet, avec un court relevé de dépenses en pied.
historique: |
  Monin, qu'Hippolyte Combes revoit « avec gd plaisir » et dont il note « sa Coy », n'est pas identifié ; c'est sans doute, comme lui, un interprète attaché à une compagnie britannique de passage. Ce même 26 mars, la 18th Division, qu'Hippolyte Combes a quittée le 2 novembre, embarque à Saleux pour un mois de repos dans la région d'Aire et d'Hazebrouck (JMO 7/Bedf, 26-27 mars 1917 ; Nichols 1922, p.~166). Le départ des troupes d'Hérissart à l'aube du 27 accompagne le glissement des états-majors vers l'est et le nord : le 27, le QG du II Corps quitte Senlis pour Pernes ; le 28, celui de la Fifth Army quitte Toutencourt, à 3 km, pour Albert (LLT). Les hôpitaux d'évacuation suivent : à Puchevillers, les 3rd et 44th CCS, présentes depuis 1916, s'en vont en mars et la 61st (South Midland) CCS n'y reste que jusqu'en mai (LLT ; CWGC). Les rues « transformées en cloaque » répondent aux routes « presque ruinées après la mi-mars » par le trafic et l'alternance du gel et du dégel (OH 1917-I, p.~151).
