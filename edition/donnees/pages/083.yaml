historique: |
  La basilique Notre-Dame de Brebières a été élevée en briques sur les plans d'Edmond Duthoit (Mérimée PA80000002). Sa tour porte une statue dorée de la Vierge présentant l'Enfant, œuvre d'Albert Roze. Les obus l'ont atteinte non en 1914 mais en janvier 1915. Le 15 janvier, vers 15~h, la coupole vole en éclats et la statue s'incline, puis le soir, sous l'effet de la tempête, elle se couche à l'horizontale. Elle restera ainsi jusqu'au 16 avril 1918, où l'artillerie britannique l'abat (diocèse d'Amiens). L'adjudant interprète Schumacher est déjà nommé en août (voir f.~12~r\textsuperscript{o}). La R.A.T. est la réserve de l'armée territoriale. D'après sa fiche matricule, Combes doit sans doute y passer le 1er novembre 1916 : la mesure le touche donc directement. Le 24, on lui dira qu'il reste à la Mission (voir f.~43~r\textsuperscript{o}), mais la menace reparaît le 1er décembre (f.~52~v\textsuperscript{o}). Aucun texte de cette mesure n'a été retrouvé. Le calme du soir concorde avec la météo : beau temps le 22, puis une « brume épaisse » (OH 1916-II, p.~462).
sources:
- Diocèse d'Amiens, « Notre-Dame de Brebières ou la “Vierge penchée” », 13 mars 2018, amiens.catholique.fr.
- Ministère de la Culture, base Mérimée, notice PA80000002 (basilique Notre-Dame de Brebières, Albert).
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 462.
