historique: |
  La tour de la basilique Notre-Dame de Brebières (voir f.~39~v\textsuperscript{o}) porte la Vierge dorée d'Albert Roze. Les obus l'atteignent en janvier 1915, non en 1914 : le 15, la statue s'incline presque à l'horizontale. Elle reste ainsi jusqu'au 16~avril 1918, quand l'artillerie britannique l'abat (diocèse d'Amiens). L'adjudant interprète Schumacher est déjà nommé en août (voir f.~12~r\textsuperscript{o}). D'après sa fiche matricule, Hippolyte Combes doit sans doute passer dans la R.A.T. le 1\textsuperscript{er}~novembre 1916 : la mesure, dont le texte n'est pas connu, le touche. Le 24, on lui dit qu'il reste à la Mission (voir f.~43~r\textsuperscript{o}) ; la menace reparaît le 1\textsuperscript{er}~décembre (f.~52~v\textsuperscript{o}).
sources:
- Diocèse d'Amiens, « Notre-Dame de Brebières ou la “Vierge penchée” », 13 mars 2018, amiens.catholique.fr.
