historique: |
  Le lieutenant, sans doute l'officier australien arrivé le 6~mars (voir f.~81~v\textsuperscript{o}), se rend à Martinsart, hameau de Mesnil-Martinsart à 4~km au nord d'Albert, proche du front jusqu'en septembre 1916 (CWGC ; voir f.~75~r\textsuperscript{o}). Les Flutre étaient instituteurs au Mesnil. Leur fils est très probablement Louis-Fernand Flutre, né au Mesnil en 1892, ancien élève de l'École normale supérieure, professeur à Lyon, auteur du \textit{Parler picard de Mesnil-Martinsart} (1955) (Wikidata Q559663 ; BnF). Le \textit{billet}~216 est un logement numéroté du cantonnement (Fernand-Laurent 1917, p.~227) ; Combes loge depuis le 11 au billet~220 (voir f.~83~r\textsuperscript{o}). Après la mi-mars, gel, dégel et trafic ont « presque ruiné » les routes (OH~\mbox{1917-I}, p.~151).
sources:
- Commonwealth War Graves Commission, notice « Martinsart British Cemetery » (cwgc.org).
- Wikidata, Q559663 (Louis-Fernand Flutre) ; BnF, notice de Flutre, L.-F., Le Parler picard de Mesnil-Martinsart (Somme), Genève, Droz / Lille, Giard, 1955.
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 227.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 151.
