historique: |
  Martinsart, où se rend le lieutenant (sans doute l'officier australien arrivé le 6 mars : voir f.~81~v\textsuperscript{o}), est un hameau de Mesnil-Martinsart, à 4~km au nord d'Albert, proche du front jusqu'en septembre 1916 (CWGC ; voir f.~75~r\textsuperscript{o}). Les Flutre étaient instituteurs au Mesnil ; resté sans voiture, Hippolyte Combes les voit peut-être à Hérissart ou alentour, où ils se seraient réfugiés. Leur fils est très probablement Louis-Fernand Flutre, né au Mesnil le 21 juin 1892, ancien élève de l'École normale supérieure, agrégé, professeur à la Faculté des lettres de Lyon, qui publiera en 1955 \textit{Le Parler picard de Mesnil-Martinsart} et un essai d'histoire locale sur le village (Wikidata Q559663 ; BnF) ; son année d'entrée à l'École n'a pu être vérifiée. Le \textit{billet}~216 est un logement numéroté du cantonnement, sur la liste du \textit{Town Major} (Fernand-Laurent 1917, p.~227) ; Hippolyte Combes loge depuis le 11 au billet~220 (voir f.~83~r\textsuperscript{o}). Après la mi-mars, gel, dégel et trafic ont « presque ruiné » les routes (OH 1917-I, p.~151).
