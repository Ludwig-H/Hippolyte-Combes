critique: Encre noire virée au brun. Un blanc d'environ cinq lignes, sans filet, sépare le 15 du 18 ; les 16 et 17 ne sont pas notés, mais l'entrée du 18 renvoie aux courses de la veille. La page se poursuit au f.~56~r\textsuperscript{o}.
historique: |
  Les courses du 18, et sans doute celles du dimanche 17 (« come hier »), suivent le circuit des achats de paille : Belle-Église et Arquèves, à 3 et 4,5~km à l'ouest d'Acheux, où l'on bat la paille depuis le 8 (voir f.~54~r\textsuperscript{o}) ; Raincheval, siège de l'\textit{Army Purchase Board} (voir f.~46~r\textsuperscript{o}) ; Toutencourt, QG de la Fifth Army (f.~49~v\textsuperscript{o}). La « ferme du Quesnoy », revue souvent jusqu'en janvier 1917 (f.~56~r\textsuperscript{o}, 56~v\textsuperscript{o}, 57~v\textsuperscript{o}, 58~r\textsuperscript{o}, 59~r\textsuperscript{o}), est sans doute le lieu-dit habité le Quesnoy, sur la commune de Puchevillers, à 2,3~km au nord-ouest de Toutencourt et 3~km au sud de Raincheval (IGN). Le « cap. de 20 ans » est le capitaine Williams, arrivé le 2 décembre (voir f.~52~v\textsuperscript{o}), dont Hippolyte Combes a noté l'âge et l'ancien emploi d'\textit{office boy} (f.~53~v\textsuperscript{o}) ; le jugement tranche avec le « de + en + sympathique » du 4 (f.~53~r\textsuperscript{o}) et annonce l'incident de Louvencourt du 24 (f.~56~v\textsuperscript{o}).
