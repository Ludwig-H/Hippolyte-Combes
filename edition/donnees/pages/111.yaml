critique: Les 16 et 17~décembre ne sont pas notés.
historique: |
  Le 18, et sans doute le dimanche 17 (« come hier »), Hippolyte Combes suit le circuit des achats de paille : Belle-Église et Arquèves, où l'on bat la paille depuis le 8 (voir f.~54~r\textsuperscript{o}) ; Raincheval, siège de l'Army Purchase Board (voir f.~46~r\textsuperscript{o}). La « ferme du Quesnoy », souvent revue jusqu'en janvier 1917, est sans doute le lieu-dit le Quesnoy, à Puchevillers (IGN). Le « cap. de 20 ans » est le capitaine Williams, arrivé le 2~décembre (voir f.~52~v\textsuperscript{o}), ancien \textit{office boy} (f.~53~v\textsuperscript{o}). Le 4, Hippolyte Combes le trouvait « de + en + sympathique » (f.~53~r\textsuperscript{o}) ; voir l'incident du 24 (f.~56~v\textsuperscript{o}).
