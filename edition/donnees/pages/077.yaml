critique: Page écrite en travers ; suite du récit du 17 octobre commencé f.~38~v\textsuperscript{o}.
historique: |
  Senlis-le-Sec abrite depuis le 24 juillet 1916 le QG du II Corps (Jacob), dont relève alors la 18th Division (LLT, « II Corps »). Le bivouac est entre Bouzincourt, à 4~km au nord-ouest d'Albert, et Hédauville, 3,5~km plus au nord-ouest. Hédauville est sur la route Contay--Englebelmer--Aveluy, « pratiquement la seule » route proche du front utilisable de jour comme de nuit (OH 1916-I, p.~271). Le QG de la division y était du 25 septembre au 6 octobre, pendant l'attaque de Thiepval (Nichols 1922, p.~79). Le 17 au soir, la pluie reprend (OH 1916-II, p.~444), quelques heures avant l'attaque de la Fourth Army sur les crêtes du Transloy, le 18 à 3~h~40.
sources:
