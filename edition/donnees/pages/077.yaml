critique: Page écrite en travers, à l'encre violette, à la suite du récit du 17 commencé f.~38 v\textsuperscript{o}. Le texte occupe la moitié supérieure ; après un large blanc, la date du jour, soulignée, est reportée au pied de la page.
historique: |
  Senlis-le-Sec abrite depuis le 24 juillet 1916 le QG du II Corps (Jacob), dont relève alors la 18th Division (LLT, « II Corps »). Le bivouac est sur le plateau entre Bouzincourt, à 4~km au nord-ouest d'Albert, et Hédauville, à 3,5~km plus au nord-ouest. Hédauville est sur la route Contay--Hédauville--Englebelmer--Martinsart--Aveluy, « pratiquement la seule » route proche du front praticable de jour comme de nuit (OH 1916-I, p.~271) ; le QG de la division y avait été du 25 septembre au 6 octobre, pendant l'attaque de Thiepval (Nichols 1922, p.~79). Bouzincourt, poste d'ambulances de 1916 à février 1917 (CWGC), est le cantonnement du 7th Bedfordshire le même soir (JMO 7/Bedf, 17 oct. 1916). La pluie est attestée : le 17, « clouds gathered in the afternoon and rain set in again at night », quelques heures avant l'attaque de la Fourth Army sur les crêtes du Transloy, lancée à 3~h~40 le 18 (OH 1916-II, p.~444).
