critique: Encre violette. Le long trait au-dessus de « matinee » est la barre du t, non un soulignement de la date ; le grand crochet des comptes descend dans le blanc jusqu'à trois lignes environ sous « Bain ».
historique: |
  La neige du matin fait l'objet, le jour même, d'une note de la mairie enjoignant aux habitants de balayer leur trottoir et de casser la glace des caniveaux (\textit{La Dépêche}, 2 févr. 1917, p.~4) ; Toulouse compta onze jours de neige cet hiver-là et descendit à −8,3~°C le 4 février (Barbé 1917, p.~182). Le dentiste « de Lersay » (ou « de Lezay »), rue La Fayette, n'est pas retrouvé dans la presse toulousaine ; sa note, réglée le lendemain, comprend un grand nettoyage et trois plombages (f.~70~r\textsuperscript{o}). Le « remontoir », montre à remontoir, est sans doute celle choisie la veille (f.~68~v\textsuperscript{o}) ; l'anneau qui permet de la suspendre au sautoir en or acheté chez Pfister le 29 septembre 1916 pour 295~f (f.~28~v\textsuperscript{o}) fait penser à un présent pour Marguerite. Les pastilles de chlorate de potasse se prenaient contre les maux de gorge ; les bains de la place Belfort ne sont pas identifiés. Les « 3 jours entiers » sont ceux du séjour à Millau, du 3 au 5 février (f.~69~v\textsuperscript{o} à 71~v\textsuperscript{o}).
sources:
- La Dépêche (Toulouse), 2 févr. 1917, p. 4, « Neiges et glaces. Note de la mairie » (Rosalis, ark:/12148/bpt6k4146925x).
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, n. s., t. 30, 1917, p. 181-182.
