historique: |
  Le jour même, la mairie demande aux habitants de balayer leur trottoir et de casser la glace des caniveaux (\textit{La Dépêche}, 2~févr. 1917, p.~4) ; sur l'hiver, voir f.~68~r\textsuperscript{o}. Le dentiste « de Lersay » n'est pas identifié ; sa note est payée le lendemain (f.~70~r\textsuperscript{o}). La montre à remontoir est sans doute celle choisie la veille (f.~68~v\textsuperscript{o}) ; l'anneau doit la suspendre au sautoir acheté en septembre 1916 (f.~28~v\textsuperscript{o}), peut-être un cadeau pour Marguerite. Les pastilles de chlorate de potasse se prenaient contre les maux de gorge. Les « 3 jours » sont ceux du séjour à Millau (ff.~69~v\textsuperscript{o}--71~v\textsuperscript{o}).
sources:
- La Dépêche (Toulouse), 2 févr. 1917, p. 4, « Neiges et glaces. Note de la mairie » (Rosalis, ark:/12148/bpt6k4146925x).
