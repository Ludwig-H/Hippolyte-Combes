critique: La journée du 25 août se poursuit au f. 14 v\textsuperscript{o}.
historique: |
  Ce train emmène les chevaux et les voitures de la 54th Brigade. L'infanterie a embarqué vers minuit à « Bailleul (West) Station » et débarqué à Saint-Pol vers 5 h (ordre d'opérations n° 26 du 23 août, Beds War Diary, 23-25 août 1916). Bailleul est alors un grand centre ferroviaire de l'arrière (CWGC, Bailleul Communal Cemetery Extension). Le convoi passe par Hazebrouck, par Berguette (Isbergues), où se croisent la ligne d'Arras à Dunkerque-Locale et celle d'Armentières à Arques, et par Lillers, sur la première (Wikipédia). Le contraste avec la campagne « plate et monotone » d'Estaires (voir f. 13 r\textsuperscript{o}) tient sans doute au passage de la plaine de la Lys aux plateaux de l'Artois.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (Beds War Diary), Operation Order No. 26 (23 août) et journal des 24-25 août.'
- CWGC, Bailleul Communal Cemetery Extension (fiche 2000048), historique.
- Wikipédia, art. « Gare de Berguette-Isbergues » et « Ligne d'Arras à Dunkerque-Locale », consultés le 18 oct. 2026.
