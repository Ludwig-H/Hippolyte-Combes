historique: |
  Le train de Combes est un échelon des transports de la 54th Brigade : l'infanterie a embarqué à « Bailleul (West) Station » vers minuit, dans la nuit du 24 au 25, et débarqué à Saint-Pol vers 5 h (ordre d'opérations n° 26 du 23 août, Beds War Diary, 23-25 août 1916). Bailleul, grand centre ferroviaire de l'arrière (CWGC, Bailleul Communal Cemetery Extension), est à trois heures de cheval de La Croix-du-Bac. Le convoi passe par Hazebrouck, Berguette (Isbergues), bifurcation de la ligne d'Arras à Dunkerque-Locale et de celle d'Armentières à Arques, et Lillers, sur la première (Wikipédia). La nouvelle zone de la brigade comprend La Thieuloye (QG), Marquay, Orlencourt et Bailleul-aux-Cornailles ; le 12th Middlesex cantonne comme la compagnie à Marquay, que Combes atteint vers 19 h (voir f. 14 v\textsuperscript{o}), jusqu'au 9 septembre (Wyrall [1926], p. 309), le 10th Essex à Chelers (Banks \& Chell 1924, p. 143). Le contraste avec la campagne « plate et monotone » d'Estaires (voir f. 13 r\textsuperscript{o}) tient sans doute au passage de la plaine de la Lys aux plateaux de l'Artois.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (Beds War Diary), Operation Order No. 26 (23 août) et journal des 24-25 août.'
- CWGC, Bailleul Communal Cemetery Extension (fiche 2000048), historique.
- Wikipédia, art. « Gare de Berguette-Isbergues » et « Ligne d'Arras à Dunkerque-Locale », consultés le 18 oct. 2026.
- Wyrall, Everard, The Die-Hards in the Great War. A History of the Duke of Cambridge's Own (Middlesex Regiment), 1914-1919, vol. I, London, Harrison & Sons, [1926], p. 309.
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., London, Gay & Hancock, 1924, p. 143.
