critique: Encre noire virée au brun. Un blanc d'environ trois lignes précède le filet qui sépare les comptes du récit.
historique: |
  La compagnie change de cantonnement le matin où la 54th Brigade achève, dans la nuit du 6 au 7 août, de relever les Néo-Zélandais sur la route d'Armentières à Lille (JMO 7/Bedf, 6-7 août 1916) ; le même jour, le 10th Essex s'installe en soutien à Erquinghem (Banks \& Chell 1924, p. 142). Chercher des \textit{billets} et un \textit{messroom} est la besogne ordinaire de l'interprète : selon Fernand-Laurent, le détachement de cantonnement se compose « d'un officier, de l'interprète et de deux caporaux », et l'habitant reçoit, d'après le décret de 1877, 1 F par nuit et par lit d'officier (Fernand-Laurent 1917, pp. 225-234). « Barning » n'est pas identifié. La route de Bac-Saint-Maur descend du village vers le pont de la Lys (voir f. 7 r\textsuperscript{o}) ; le « Postoffice » peut être la poste civile ou un bureau de poste militaire britannique. Le litre de bière à 30 c coûte moins qu'à l'économat d'une compagnie de chemins de fer en juillet 1916 (0,44 F ; March 1925, p. 182) ; le « cooking » payé à la propriétaire rémunère sans doute la cuisson des rations touchées à la compagnie.
sources:
- Bedfordshire Archives Service, X550/8/1/1608, War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916.
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 142.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, pp. 225-234.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 182.
