historique: |
  La compagnie change de cantonnement le matin qui suit la relève des Néo-Zélandais par la 54th Brigade, dans la nuit du 6 au 7 août (voir f. 6 r\textsuperscript{o}). Trouver des \textit{billets} et un \textit{messroom} est la tâche ordinaire de l'interprète : le détachement de cantonnement se compose « d'un officier, de l'interprète et de deux caporaux », et l'habitant reçoit, d'après le décret de 1877, 1 F par nuit et par lit d'officier (Fernand-Laurent 1917, pp. 225-234). « Barning » n'est pas identifié. Le « Postoffice » peut être la poste civile ou un bureau de poste militaire britannique. Le « cooking » payé à la propriétaire est sans doute la cuisson des rations touchées à la compagnie.
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, pp. 225-234.
