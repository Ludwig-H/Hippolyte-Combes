critique: 'Le feuillet 56 a été photographié verso d''abord : ce recto fait suite au f.~55~v\textsuperscript{o}. Le compte du 19 est ouvert par un grand crochet et séparé par un filet de la journée du 20.'
historique: |
  L'« Army P. Board » est l'\textit{Army Purchase Board} du major Levy, à Raincheval (voir f.~46~r\textsuperscript{o}) : chaque armée avait le sien, qui achetait paille et fourrages, gérait presses et batteuses et devait constituer, si le pays le permettait, une réserve d'environ 3~000 tonnes de paille pressée (Puckle 1917, p.~28). Le bureau de la Mission « XIIIe C. » d'Acheux est celui du XIII Corps de Congreve, qui tient la gauche de la Fifth Army (OH 1917-I, p.~66) et a pris Hippolyte Combes en charge le 1\textsuperscript{er} décembre (voir f.~52~v\textsuperscript{o}). Annoncés pour le 17 (f.~53~r\textsuperscript{o}), les 84~F font seize jours à 5,25~F (voir f.~40~r\textsuperscript{o}). La carte de Noël, à 70~c, coûte sept à quatorze fois une carte postale, payée 5 ou 10~c ailleurs dans le carnet (f.~50~r\textsuperscript{o}). Beauquesne avait reçu en juin 1916 le QG avancé de Haig, au château de Valvion (OH 1916-I, p.~304) ; Hippolyte Combes y traitera le 26 avec Mme Capron de la location d'une batteuse (f.~57~v\textsuperscript{o}). Sur la ferme du Quesnoy, voir f.~55~v\textsuperscript{o}.
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 304.
