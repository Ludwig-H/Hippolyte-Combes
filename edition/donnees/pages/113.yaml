historique: |
  L'« Army P. Board » est l'\textit{Army Purchase Board} du major Levy, à Raincheval (voir f.~46~r\textsuperscript{o}). Chaque armée avait le sien : il achetait paille et fourrages, gérait presses et batteuses et devait tenir une réserve d'environ 3~000 tonnes de paille pressée (Puckle 1917, p.~28). Le bureau « XIIIe C. » d'Acheux est celui du XIII~Corps, à la gauche de la Fifth Army (OH~\mbox{1917-I}, p.~66), qui a pris Hippolyte Combes en charge le 1\textsuperscript{er}~décembre (voir f.~52~v\textsuperscript{o}). Les 84~F font seize jours à 5,25~F (voir f.~40~r\textsuperscript{o}). La carte de Noël coûte 70~c, contre 5 ou 10~c pour une carte postale (f.~50~r\textsuperscript{o}). Beauquesne avait reçu en juin 1916 le QG avancé de Haig (OH~\mbox{1916-I}, p.~304). Sur le Quesnoy, voir f.~55~v\textsuperscript{o}.
sources:
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 304.
