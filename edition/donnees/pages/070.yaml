historique: |
  En 1916, Barlette, où cantonne la compagnie, dépend encore de la commune de Franqueville ; il n'a été rattaché à Ribeaucourt qu'au XX\textsuperscript{e} siècle (Inventaire, hameau de Barlette). Le hameau touche au grand massif du bois de Ribeaucourt, prolongé par le bois Monsieur-de-Berny, partie nord de l'ancien bois de Martaineville, acquise vers 1830 par Jean-Charles de Berny (Inventaire, village de Franqueville) : c'est sans doute la « forêt » qu'Hippolyte Combes parcourt. Le mess est celui des officiers de la compagnie, dont il est membre permanent depuis le 12 septembre (voir f.~21 v\textsuperscript{o}). La pleine lune tomba le 11 octobre 1916 vers 7 h (temps universel) : le 9 au soir, la lune, gibbeuse, était à un jour et demi du plein (calendrier lunaire 1916). La « gde et belle chambre » est le \textit{billet} trouvé le 6 octobre chez « Mme Ve — », à 900 m de Barlette, ancien salon d'une maison tenue par une « vieille gd-mère » (voir f.~34 r\textsuperscript{o} et v\textsuperscript{o}).
