historique: |
  La « foret » est sans doute le massif du bois de Ribeaucourt, qui touche Barlette, et le bois Monsieur-de-Berny qui le prolonge : c'est la partie nord de l'ancien bois de Martaineville, achetée vers 1830 par Jean-Charles de Berny (Inventaire, village de Franqueville). Le 9 au soir, la lune n'était pas encore pleine : elle le fut le 11~octobre 1916 vers 7~h, temps universel (calendrier lunaire 1916). La « gde et belle chambre » est le \textit{billet} trouvé le 6~octobre, ancien salon d'une maison tenue par une « vieille gd-mère » (voir f.~34~r\textsuperscript{o} et v\textsuperscript{o}).
