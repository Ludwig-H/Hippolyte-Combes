historique: |
  La 54\textsuperscript{th} Brigade attend son ordre de départ depuis le 15 (voir f.~22~r\textsuperscript{o}) ; il n'arrivera que le 22 (JMO~7/Bedf, 22~sept. 1916 ; voir f.~24~r\textsuperscript{o}). Le château est celui de Raincheval (voir f.~21~v\textsuperscript{o}). Ce dimanche, le 7\textsuperscript{th} Bedfordshire se baigne, assiste à l'office et voit une démonstration de mortiers Stokes au nord du village (ibid., 17~sept.). Les wesleyens sont des méthodistes ; en 1918, l'armée comptait plus de 500 aumôniers wesleyens et du United Board (Thompson 1990). Le chapitre~\textsc{xix} du sommaire des \textit{Feuillets de Route} d'Hippolyte Combes s'intitule « \textit{Sunday service in village churchway}~[?] » (annexe, p.~\pageref{annexe:doc6-xix}).
