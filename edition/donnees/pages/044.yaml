historique: |
  La 54th Brigade se tient prête à partir dans les six heures depuis le 15 (voir f. 22 r\textsuperscript{o}) ; l'ordre de départ pour le 23 n'arrivera que le 22 (JMO 7/Bedf, 22 sept. 1916 ; voir f. 24 r\textsuperscript{o}). Les chevaux britanniques ont besoin « of a certain amount of fresh fodder », que l'armée peut réquisitionner contre paiement (\textit{Blackwood's Magazine}, juin 1917, p. 933 ; pour le \textit{green forage}, voir f. 21 v\textsuperscript{o}). Le château de Raincheval date de 1719 ; ses façades, toitures et grille ont été inscrites en 1975 (Mérimée PA00116224). Le même dimanche, le 7th Bedfordshire se baigne par compagnies, assiste à l'office militaire et voit à 15 h une démonstration de mortiers Stokes « on ground just North of Raincheval » (JMO 7/Bedf, 17 sept.). Le culte \textit{Wesleyan} est celui des méthodistes, dont les aumôniers durent accepter des commissions temporaires ; on comptait en 1918 plus de 500 aumôniers wesleyens et du \textit{United Board} (Thompson 1990). Combes avait prévu de consacrer à ces cultes britanniques le chapitre~\textsc{xix} de ses \textit{Feuillets de Route} (\textit{« Sunday service in village church »}, en annexe), et c'est sur un feuillet du même papier qu'il a copié de sa main le poème wesleyen de Beatrice Chilcott (en annexe).
