historique: |
  Le champ de croix voisin du cimetière communal est l'\textit{Albert Communal Cemetery Extension}. Ouvert en août 1915, il sert surtout à partir de septembre 1916, quand les ambulances de campagne se regroupent à Albert ; la 5\textsuperscript{th} Casualty Clearing Station l'utilise deux mois à partir de novembre 1916 (CWGC). Le général écossais n'est pas identifié. Le jardin public, rue Jules-Ferry, est inscrit monument historique depuis le 16~février 2009 (Mérimée PA80000063). On ignore qui organise le \textit{Church meeting} de la route d'Amiens. L'ordre apporté par Curtis fait suite à l'enquête sur la paille et le foin d'Acheux et de Senlis, le 29~octobre (voir f.~44~r\textsuperscript{o}).
sources:
- Commonwealth War Graves Commission, « Albert Communal Cemetery Extension », notice historique, https://www.cwgc.org/visit-us/find-cemeteries-memorials/cemetery-details/61300/albert-communal-cemetery-extension/.
- Ministère de la Culture, base Mérimée, PA80000063, « Jardin public », Albert (Somme), inscription par arrêté du 16 février 2009.
