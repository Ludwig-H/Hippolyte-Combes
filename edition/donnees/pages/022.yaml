critique: 'La page continue sans rupture la chevauchée commencée au bas du f. 11 r\textsuperscript{o} ; le rappel « 19 Sam – » occupe en tête la place du mois. Deux ajouts interlinéaires : « Arrivé par gare… », d''un module plus petit, et « Ecossais », d''une encre plus brune et plus claire, sans doute postérieur. Faute de place, « très belle » est écrit au début de la dernière ligne, dans le blanc de l''alinéa.'
historique: |
  La blanchisserie Barbry est sans doute à Sailly-sur-la-Lys (voir f. 9 r\textsuperscript{o}). Fleurbaix (Pas-de-Calais), « about a mile behind the line » (Ellis [1920], p. 75), est derrière le secteur que tient encore la 5th Australian Division (ibid., p. 117). Armentières (Nord), à « about two miles from the front line » (ibid., p. 128), reste pourtant habitée « by civilian inhabitants in large numbers », et l'artillerie allemande vise surtout la ville et Houplines (Bewsher 1921, pp. 87-88). L'église de briques est vraisemblablement Saint-Vaast, peinte en ruines par F. Ch. Baude en 1919 (Palissy PM59007232) et rebâtie par L.-M. Cordonnier en 1929. Les « Ecossais » sont les Highlanders de la 152nd Brigade (51st Division), cantonnés en ville depuis les 15-16 août (Bewsher 1921, p. 87). Erquinghem-Lys, « the westerly suburb of Armentières », abrite les bataillons de soutien de la division (Banks \& Chell 1924, p. 142) ; l'officier des Sussex appartient sans doute au 8th Royal Sussex, bataillon de pionniers de la 18th Division (LLT).
sources:
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 75, 117, 128.
- Bewsher, F. W., The History of the 51st (Highland) Division, 1914–1918, Édimbourg–Londres, W. Blackwood & Sons, 1921, p. 87-88.
- Ministère de la Culture, base Palissy, notice PM59007232 (F. Ch. Baude, Vue de l'église Saint-Vaast d'Armentières après les combats de la Première Guerre mondiale, 1919, hôtel de ville d'Armentières).
- 'Ville d''Armentières, circuit du patrimoine, « Richesses architecturales : l''église Saint-Vaast, la reconstruction » (Cirkwi, point d''intérêt 2443051).'
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 142.
- Baker, C., The Long, Long Trail, « 18th (Eastern) Division » (état archivé du 9 févr. 2017).
