critique: Suite de la journée du 19, commencée au f.~11~r\textsuperscript{o} (« Longue chevauchée zone exposée, derrière ligne de feu »).
historique: |
  La blanchisserie Barbry est sans doute à Sailly-sur-la-Lys (voir f.~9~r\textsuperscript{o}). Fleurbaix est « about a mile behind the line » (Ellis [1920], p.~75). Armentières, à « about two miles from the front line » (ibid., p.~128), garde de nombreux civils ; l'artillerie allemande vise surtout la ville et Houplines (Bewsher 1921, p.~87--88). L'église de briques est sans doute Saint-Vaast, peinte en ruines par F. Ch. Baude en 1919 (Palissy PM59007232) et rebâtie par L.-M. Cordonnier en 1929. Les « Ecossais » sont les Highlanders de la 152\textsuperscript{nd} Brigade (51\textsuperscript{st} Division), en ville depuis les 15--16~août (Bewsher 1921, p.~87). Erquinghem-Lys abrite les bataillons de soutien de la 18\textsuperscript{th} Division (Banks et Chell 1924, p.~142) ; l'officier est sans doute du 8\textsuperscript{th} Royal Sussex, ses pionniers (LLT).
sources:
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 75, 128.
- Bewsher, F. W., The History of the 51st (Highland) Division, 1914–1918, Édimbourg–Londres, W. Blackwood & Sons, 1921, p. 87-88.
- Ministère de la Culture, base Palissy, notice PM59007232 (F. Ch. Baude, Vue de l'église Saint-Vaast d'Armentières après les combats de la Première Guerre mondiale, 1919, hôtel de ville d'Armentières).
- 'Ville d''Armentières, circuit du patrimoine, « Richesses architecturales : l''église Saint-Vaast, la reconstruction » (Cirkwi, point d''intérêt 2443051).'
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., Londres, Gay & Hancock, 1924, p. 142.
- Baker, C., The Long, Long Trail, « 18th (Eastern) Division » (état archivé du 9 févr. 2017).
