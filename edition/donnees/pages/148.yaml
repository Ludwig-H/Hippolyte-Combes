critique: Les comptes du retour de permission sont ouverts par un grand crochet ; un filet sépare les deux journées. La dernière ligne, d'une encre plus pâle, achève la page.
historique: |
  Le n°~104 est, comme le billet n°~59 d'Acheux (f.~45~v\textsuperscript{o}), un numéro de cantonnement attribué par le \textit{Town Major} ; sa propriétaire reparaît le 19 février (f.~78~v\textsuperscript{o}). Le métro parisien coûte 15~c en seconde classe, tarif de 1900 à 1919 (Hérodote) ; sur le foyer de la Y.M.C.A. d'Amiens, qui servait la nuit thé et gâteaux « pour une somme modique » (Fernand-Laurent 1917, p.~92-93), voir f.~65~r\textsuperscript{o}. Les 78~f~75 de la Mission française font quinze jours à 5~f~25, la quinzaine de seize jours étant payée 84~f (19 décembre et 19 janvier : f.~56~r\textsuperscript{o} et 62~v\textsuperscript{o} ; calcul) : la solde de la première quinzaine de février est donc versée entière, et la retenue des sept jours de permission (35~f) n'interviendra que le 3 mars (f.~81~r\textsuperscript{o}). Le \textit{gift} de 5~f paie le « déjeuner sommaire » offert le jour même par les Carluvant (f.~73~r\textsuperscript{o}). La quote-part de mess de février sera comptée « depuis le 8 » (f.~80~r\textsuperscript{o}).
sources:
- 'Hérodote.net, « 19 juillet 1900 : inauguration du métro de Paris » (herodote.net), consulté le 18 oct. 2026.'
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 92-93.
