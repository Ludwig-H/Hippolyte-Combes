historique: |
  Le n°~104 est, comme le billet n°~59 d'Acheux (f.~45~v\textsuperscript{o}), un numéro de cantonnement attribué par le \textit{Town Major}. Le métro parisien coûte 15~c en seconde classe, tarif de 1900 à 1919 (Hérodote). Les 78~f~75 de la Mission française font quinze jours à 5~f~25, d'après les soldes du 19 décembre et du 19 janvier (f.~56~r\textsuperscript{o} et 62~v\textsuperscript{o} ; calcul). La première quinzaine de février est donc payée entière ; la retenue des sept jours de permission (35~f) ne sera faite que le 3 mars (f.~81~r\textsuperscript{o}). Le \textit{gift} de 5~f paie le « déjeuner sommaire » offert le jour même par les Carluvant (f.~73~r\textsuperscript{o}).
sources:
- 'Hérodote.net, « 19 juillet 1900 : inauguration du métro de Paris » (herodote.net), consulté le 18 oct. 2026.'
