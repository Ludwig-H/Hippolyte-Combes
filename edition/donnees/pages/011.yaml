historique: |
  Saint-Jans-Cappel, au nord de Bailleul et contre la frontière belge, est en pays flamand. En 1906, Raoul Blanchard fait de Bailleul « la citadelle de la langue tudesque en France », tout en notant que dans ces communes « le français est compris et parlé de tous sauf quelques vieillards » (Blanchard 1906, p.~482--483). La prière du soir était donc sans doute dite en flamand ; le mot illisible de la dernière ligne nommait peut-être la langue. Le \textit{garret} est le grenier où Hippolyte Combes loge depuis son arrivée, faute de chambre (voir f.~2~v\textsuperscript{o}).
sources:
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, pp. 482-483.
