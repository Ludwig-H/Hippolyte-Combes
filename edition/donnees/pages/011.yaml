critique: Encre noire virée au brun ; « la » et « le » de la l. 6 sont repassés. L'entrée s'interrompt à la fin de la l. 12 ; la moitié inférieure de la page est restée blanche et le samedi 5 août commence au f. 6 r\textsuperscript{o}.
historique: |
  La ferme où la 152nd Company cantonne depuis le 28 juillet (voir f. 2 v\textsuperscript{o}) est en pays flamand. En 1906, Raoul Blanchard fait de Bailleul, « solidement appuyée sur la Belgique », « la citadelle de la langue tudesque en France », la limite linguistique suivant à peu près la voie ferrée Hazebrouck–Bailleul ; Saint-Jans-Cappel, au nord de Bailleul et contigu à la frontière belge, est du côté flamand. Il ajoute que dans ces communes « le français est compris et parlé de tous sauf quelques vieillards » (Blanchard 1906, pp. 482-483). La prière du soir menée par le père était donc sans doute dite en flamand, mais la fin de la ligne, noyée d'encre, ne permet pas de lire la langue que Combes nomme. C'est sa dernière soirée dans cette ferme : la compagnie part le lendemain pour La Croix-du-Bac (f. 6 r\textsuperscript{o}). Le \textit{garret} est le grenier dont il avait dû se contenter à l'arrivée, faute de chambre (f. 2 v\textsuperscript{o}).
sources:
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, pp. 482-483.
