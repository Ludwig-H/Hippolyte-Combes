critique: Encre violette. La ligne de la chapelle de Nazareth, serrée contre la précédente, a peut-être été ajoutée après coup ; le prix du chapelet est porté sous la dernière ligne, à droite.
historique: |
  « Sa mère » est Valentine Cartairade (1858--1943), épouse du Dr Gabriel Calmels, médecin à Millau (acte de naissance de Marguerite, Millau, 1892 ; \textit{PC-Annexe}). La chapelle Notre-Dame-de-Nazareth, 4, rue Philippe-Féral, à deux pas de l'appartement de Combes, est un édifice du XV\textsuperscript{e} siècle très remanié au XVI\textsuperscript{e}, bâti par des parlementaires qui en eurent l'usage jusqu'en 1789 et rendu au culte en 1800 (Mérimée PA00094499) ; on y célébrait pendant la guerre messes anniversaires et services pour les morts (\textit{Le Télégramme}, 10 mars 1916, p.~4 ; 3 juill. 1917, p.~2). La rue d'Alsace-Lorraine est l'artère commerçante ; le tram de la Côte-Pavée part du Capitole (Baedeker 1912, p.~298, 300). Sur Jean, voir f.~29 v\textsuperscript{o}. « Bonny » (?), destinataire du chapelet, se lisait auparavant « B\textsuperscript{ne} Maman » : peut-être Mme Calmels elle-même, grand-mère des enfants Vincens (\textit{PC-Livre} ; voir f.~30 v\textsuperscript{o}). Ce jour, la 54th Brigade quitte Acheux en chemin de fer pour Candas (voir f.~33 v\textsuperscript{o}).
sources:
- Acte de naissance de Marie Marguerite Calmels, Millau, n° 137, 16 avril 1892 (archives familiales).
- Combes, P., livre familial dactylographié et annexe généalogique (Combes-1 à Combes-4, Combes-annexe), archives familiales.
- Ministère de la Culture, base Mérimée, notice PA00094499 (chapelle Notre-Dame-de-Nazareth, Toulouse), pop.culture.gouv.fr, consultée le 18 oct. 2026.
- Le Télégramme, 10 mars 1916, p. 4 (ark:/12148/bd6t53866190s) ; 3 juillet 1917, p. 2 (ark:/12148/bd6t53866670r), Rosalis, Bibliothèque de Toulouse.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, K. Baedeker, 1912, p. 298, 300.
