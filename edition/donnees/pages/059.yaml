historique: |
  « Sa mère » est Valentine Cartairade (1858--1943), épouse du Dr Gabriel Calmels, médecin à Millau (acte de naissance de Marguerite, Millau, 1892 ; \textit{PC-Annexe}). La chapelle Notre-Dame-de-Nazareth, rue Philippe-Féral, près de l'appartement, date du XV\textsuperscript{e} siècle ; rendue au culte en 1800, elle accueille pendant la guerre des services pour les morts (Mérimée PA00094499 ; \textit{Le Télégramme}, 10 mars 1916, p.~4). Le tram de la Côte-Pavée part du Capitole (Baedeker 1912, p.~298, 300). Sur Jean, voir f.~29 v\textsuperscript{o}. « Bonny » n'est pas identifié. Ce jour, la 54th Brigade quitte Acheux en train pour Candas (voir f.~33 v\textsuperscript{o}).
sources:
- Acte de naissance de Marie Marguerite Calmels, Millau, n° 137, 16 avril 1892 (archives familiales).
- Combes, P., livre familial dactylographié et annexe généalogique (PC-Livre, PC-Annexe), archives familiales.
- Ministère de la Culture, base Mérimée, notice PA00094499 (chapelle Notre-Dame-de-Nazareth, Toulouse), pop.culture.gouv.fr, consultée le 18 oct. 2026.
- Le Télégramme, 10 mars 1916, p. 4 (ark:/12148/bd6t53866190s), Rosalis, Bibliothèque de Toulouse.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, K. Baedeker, 1912, p. 298, 300.
