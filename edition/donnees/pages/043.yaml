date: Jeudi 14 et vendredi 15 septembre 1916
mois: Septembre 1916
lieux: Raincheval et Acheux-en-Amiénois (Somme)
titre: 'Acheux : bureau de la Mission dans le parc du château ; cantine de Raincheval'
transcription: |
  14 \sl{J.} matin, ciel bleu & soleil \hfill \sl{Sept^{r} /16}
  radieux.
  \ind Après le lunch, course à cheval. Venu
  à Acheux ; bureau mission fr ; dans
  les parcs du chateau – maisonnette toile
  & planches
  \ind Fait route avec \inc{Lereux}
  Bourg très coquet
  \ind Fin jour, 1^{er} froid d'automne
  \blanc{1}
  \crochet{2}— Ctes ples, à Acheux : 30 c.
  to a batman for saddling up my pony : 50c
  \filet
  15 \sl{Ve} – nuit froide – matinee ext^{t} fraiche
  très b. journée
  Impressions de fin ete & comm^{t} automne
  \blanc{1}
  après-midi, venu à travers champs à
  la canteen, station de Raincheval
  Exerc. de grenades & mines de champs
  en face gare \trait
  \blanc{2}
  \ind — Canteen station de Raincheval :
  \ind[2] \inc{Cananda} In Flanders . – . 1^{f} 25 —
