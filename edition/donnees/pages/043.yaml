historique: |
  Acheux abrite le QG de la 18th Division jusqu'au 25 (Nichols 1922, p. 79 ; voir f. 23 r\textsuperscript{o}). Le bureau de la Mission y réunit les interprètes de la division (\textit{Blackwood's Magazine}, juin 1917, p. 940 ; voir f. 23 v\textsuperscript{o}). La « station » est sans doute la gare Raincheval-Arquèves de la ligne métrique Albert–Doullens (CFD Somme). Le 15 s'ouvre la bataille de Flers-Courcelette, où la 2nd Canadian Division prend Courcelette (CWGC) ; la 54th Brigade, exercée aux grenades depuis le 12, doit être prête à partir dans les six heures (JMO 7/Bedf, 12-15 sept. 1916). \textit{Canada in Flanders} est le vol. I (1916), vendu un shilling, environ 1,26 F (Aitken 1916 ; March 1925, p. 141).
