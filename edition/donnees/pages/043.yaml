critique: 'Le bulletin du matin du 14 (« matin, ciel bleu \& soleil […] radieux. ») est d''une encre plus pâle, virée à l''olive, de même que « pony : 50c » ; le reste de la page est d''une encre plus foncée. Aucune entrée pour le samedi 16 septembre : la page suivante passe au dimanche 17.'
historique: |
  Acheux-en-Amiénois, à 6,7 km à l'est de Raincheval, abrite le QG de la 18th Division jusqu'au 25 septembre (Nichols 1922, p. 79 ; voir f. 23 r\textsuperscript{o}) ; c'est aussi une tête de ligne, au bout de la voie normale construite depuis Candas au printemps 1916 (OH 1916-I, p. 273-274). Le bureau divisionnaire de la Mission, qu'Hippolyte Combes retrouve le 21 dans une « hutte s/ la pelouse » (voir f. 23 v\textsuperscript{o}), rassemble « the French interpreters attached to the Division » (\textit{Blackwood's Magazine}, juin 1917, p. 940). « Lereux » n'est pas identifié. La « station » est sans doute la gare Raincheval-Arquèves de la voie métrique Albert–Doullens (CFD Somme). Le 15 s'ouvre la bataille de Flers-Courcelette, où la 2nd Canadian Division prend Courcelette (CWGC) ; la 54th Brigade, exercée aux grenades depuis le 12, reçoit l'ordre d'être « ready to move at 6 hours notice » (JMO 7/Bedf, 12-15 sept. 1916). \textit{Canada in Flanders}, de Sir Max Aitken, est forcément le vol. I (1916), vendu un shilling, environ 1,26 F à la parité-or (Aitken 1916 ; March 1925, p. 141).
