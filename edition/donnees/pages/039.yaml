historique: |
  La 54\textsuperscript{th} Brigade gagne la zone de Moncheaux. Le 7\textsuperscript{th} Bedfordshire, parti de La Thieuloye, passe par Marquay et Ligny-Saint-Flochel et atteint Ternas à 11~h~30 (JMO~7/Bedf, 9~sept. 1916). Le train marche en queue, comme la 152\textsuperscript{nd} Company le lendemain (ibid., ordre n\textsuperscript{o}~30) : Hippolyte Combes part donc après les troupes. Le plateau est celui de l'école de mortiers de tranchée de la Third Army (IWM Q~961). Monts-en-Ternois est à 7,2~km de Marquay (OSM). Le capitaine Edward Maurice West, A.S.C., commande la 152\textsuperscript{nd} Company (Nichols 1922, p.~110 ; TNA WO 339/21191), et encore en 1918 (Nichols 1922, p.~432) ; Hippolyte Combes sera admis au mess « à titre definitif » le 12 (voir f.~21~v\textsuperscript{o}). M. Dupuich (lecture incertaine) est sans doute son logeur de Marquay.
