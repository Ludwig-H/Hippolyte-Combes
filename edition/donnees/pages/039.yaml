historique: |
  La 54th Brigade gagne la zone de Moncheaux. Le 7th Bedfordshire, parti de La Thieuloye, passe par Marquay et Ligny-Saint-Flochel et atteint Ternas à 11 h 30 (JMO 7/Bedf, 9 sept. 1916). Le train marche en queue, comme la 152nd Company le lendemain (ibid., ordre n° 30) : Hippolyte Combes part donc après les troupes. Le plateau est celui de l'école de mortiers de tranchée de la Third Army (voir f. 17 r\textsuperscript{o}). Monts-en-Ternois est à 7,2 km de Marquay (OSM). Le capitaine Edward Maurice West, A.S.C., commande la 152nd Company (Nichols 1922, p. 110 ; TNA WO 339/21191), et encore en 1918 (Nichols 1922, p. 432) ; Hippolyte Combes sera admis au mess « à titre définitif » le 12 (voir f. 21 v\textsuperscript{o}). M. Dupuich est sans doute son logeur de Marquay.
