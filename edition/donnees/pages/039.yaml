critique: La dernière ligne, d'une encre plus pâle et brunâtre, semble ajoutée après coup ; elle est en partie rognée au bas du feuillet.
historique: |
  La 54th Brigade marche en colonne vers la zone de Moncheaux : parti de La Thieuloye à 8 h 15, le 7th Bedfordshire traverse Orlencourt et Marquay, rejoint la colonne au carrefour de Ligny-Saint-Flochel à 10 h 19 et atteint Ternas à 11 h 30 (JMO 7/Bedf, 9 sept. 1916). Le train fermant les colonnes, comme la « \textit{152nd Company Divisional Train} » en queue de celle de la 54th le lendemain (ibid., ordre n° 30), Combes part après les troupes. Le plateau est celui de l'école de mortiers de tranchée de la Third Army (voir f. 17 r\textsuperscript{o}). Monts-en-Ternois est à 7,2 km de Marquay (OSM) ; l'« ancien monastère » de la grande ferme n'est pas identifié. Le « Cap. West » est le capitaine Edward Maurice West, A.S.C., commandant de la 152nd Company (Nichols 1922, p. 110 ; TNA WO 339/21191), qui la commande encore en 1918, avec la Military Cross (Nichols 1922, p. 432) ; cette invitation à « messer » précède l'admission au mess « à titre définitif » du 12 septembre (voir f. 21 v\textsuperscript{o}). M. Dupuich, rétribué au départ, est sans doute le logeur de Combes à Marquay.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, septembre 1916, avec les ordres d''opérations n° 29 et 30 (transcription en ligne).'
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh, Blackwood, 1922, p. 110 et 432.
- 'The National Archives (Kew), WO 339/21191 : Captain Edward Maurice West, Royal Army Service Corps, 1914-1919.'
