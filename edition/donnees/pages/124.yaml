date: Mardi 16 – mercredi 17 janvier 1917
mois: Janvier 1917
lieux: Acheux-en-Amiénois, Rubempré et Doullens (Somme) ; Auxi-le-Château (Pas-de-Calais)
titre: Paille cherchée à Rubempré ; chez M. Renard à Auxi-le-Château ; neige puis dégel
transcription: |
  16 Mardi \hfill \sl{Janvier 1917}
  \ind Nuit, gelé très fort.
  Durant journée, ciel nuageux. Temps froid, mais \inc{sec}
  aprè-midi, course en auto (Sunbeam) à
  Bouzincourt Senlis & Rubempré. Ds ce dernier village
  allé de ferme en ferme, pour trouver paille
  au retour, dévalé en vitesse coteaux pente
  Herissart à Toutencourt. Coteaux et champs
  encore – couverte neige : gde & mornes étendue
  blanches \trait
  \ind[2] — C^{tes} p^{les} : 35 c.
  \blanc{1}
  \filet
  17 Merc Nuit neigé abond^{t}. Au réveil
  trouvé toits, jardins rues, tout blancs
  \ind Tout le jour, en course Venu jà
  Auxi-le-Château, chz M. Renard. \inc{Jusqà} Doullens
  plaines mornes. Au delà, région pittoresque,
  vergers, petits coteaux boisés
  M. Renard ns a invités à déjeuner.
  Ns a montré ses objets d'art précieux :
  notam et surtout \inc{un} coffret en paille
  acheté en 1858 au bagne de Toulon
  Matinée entière, neige fine \sl{tourmente} \ill
  oblique, sous les rafales \trait
  Soir, température s'est radoucie considt
  et dégel commencé —
