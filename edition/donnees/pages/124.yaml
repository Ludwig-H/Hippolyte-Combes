historique: |
  Le 16, la 18th Division revient sur l'Ancre (Nichols 1922, p. 139) : le 7/Bedf a cantonné le 14 dans la « Rubempré Area » (JMO 7/Bedf, janv. 1917) et le 10th Essex fait étape à Hérissart (Banks et Chell 1924, p. 172). La paille cherchée à Rubempré leur est sans doute destinée. Senlis-le-Sec abrite alors le QG du IV Corps, auquel le II Corps succède le 21 janvier (LLT). La Sunbeam est celle du major Levy (voir f. 58 r\textsuperscript{o}). M. Renard n'est pas identifié. Au bagne de Toulon (1748–1873), les forçats vendaient aux visiteurs des objets de paille, d'os, de bois (Wikipedia, « Bagne of Toulon »). Hippolyte Combes avait fait ses classes d'artilleur à Toulon en mars–avril 1915 : il les appelle « Six Semaines (de bagne) à Toulon » dans ses \textit{Feuillets de Route} (en annexe).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg, Blackwood, 1922, p. 139.
- Bedfordshire Archives, X550/8/1/1701, War Diary, 7th Bn Bedfordshire Regiment, janvier 1917.
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, Londres, Gay & Hancock, 2e éd., 1924, p. 172.
- Baker, C., « The British IV Corps » et « The British II Corps in France and Flanders », The Long, Long Trail, https://www.longlongtrail.co.uk (copies Wayback de 2021 et 2024).
- « Bagne of Toulon », Wikipedia, https://en.wikipedia.org/wiki/Bagne_of_Toulon (consulté le 18 oct. 2026).
