critique: Encre noire virée au brun. Outre « M. Renard », les mots « coffret » et « de Toulon » ont été repassés à l'encre plus épaisse, peut-être à la relecture.
historique: |
  Le 16, la 18th Division revient sur l'Ancre (Nichols 1922, p. 139) ; le 7/Bedf avait cantonné dans la « Rubempré Area » le 14 (JMO 7/Bedf, janv. 1917), le 10th Essex fait étape à Hérissart (Banks et Chell 1924, p. 172) : la paille cherchée « de ferme en ferme » répond sans doute à ces cantonnements. Senlis-le-Sec abrite alors le QG du IV Corps, auquel le II Corps succède le 21 janvier (LLT). La Sunbeam est celle du major Levy (voir f. 58 r\textsuperscript{o}). Le 17, la course mène par Doullens jusqu'à Auxi-le-Château, où Combes reviendra le 11 février chez M. Romert (f. 76 r\textsuperscript{o}). M. Renard n'est pas identifié ; le « nous » inclut sans doute l'officier acheteur. Le coffret est un objet de forçat : le bagne de Toulon (1748–1873), le plus grand de France, était alors en activité. Les forçats y fabriquaient de menus objets de paille, de coco, d'os ou de bois pour les vendre aux visiteurs (Wikipedia, « Bagne of Toulon » ; \textit{Les Nouvelles calédoniennes}). L'attention particulière d'Hippolyte Combes pour cet objet s'éclaire par le souvenir de ses propres classes d'artilleur à Toulon en mars–avril 1915, qu'il intitule crûment \textit{« II - Six Semaines (de bagne) à Toulon »} dans le sommaire de ses \textit{Feuillets de Route} (en annexe). Le dégel du soir reste passager : dès le 19, « Il gele dejà très fort » (f. 62 v\textsuperscript{o}).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg, Blackwood, 1922, p. 139.
- Bedfordshire Archives, X550/8/1/1701, War Diary, 7th Bn Bedfordshire Regiment, janvier 1917.
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, Londres, Gay & Hancock, 2e éd., 1924, p. 172.
- Baker, C., « The British IV Corps » et « The British II Corps in France and Flanders », The Long, Long Trail, https://www.longlongtrail.co.uk (copies Wayback de 2021 et 2024).
- « La gravure sur nacre, cet art oublié des bagnards », Les Nouvelles calédoniennes, https://www.lnc.nc/article/la-gravure-sur-nacre-cet-art-oublie-des-bagnards.
- « Bagne of Toulon », Wikipedia, https://en.wikipedia.org/wiki/Bagne_of_Toulon (consulté le 18 oct. 2026).
