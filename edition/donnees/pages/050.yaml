- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 79, 81, 432.
- 'Spink, Orders, Decorations and Medals e-Auction 3 (vente 21102), lot 188 : « A Great War M.C. group of four awarded to Captain E. M. Ford, Royal Army Service Corps » (spink.com/lot/21102000188).'
