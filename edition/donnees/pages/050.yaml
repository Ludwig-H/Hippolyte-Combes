critique: Encre violette. Les comptes sont rejetés au pied de la page après un blanc ; le récit de la journée se poursuit sur la page suivante (f.~26 r\textsuperscript{o}).
historique: |
  Le croissant précède de deux jours la nouvelle lune du 27 (Espenak) ; les « 2 étoiles » sont très probablement Vénus et Jupiter (calcul de l'éditeur). Le « Lt Ford » est sans doute Edward Maurice Ford (né en 1882), \textit{2nd Lieutenant} de l'A.S.C. en 1915, qui « served in France with the 18th Divisional Train », capitaine et M.C. en 1917--1918 (Nichols 1922, p.~432 ; Spink, lot 188). Le convoi va à Acheux, tête de ligne des vivres (OH 1916-I, p.~273--274). La gare d'Acheux-Varennes est celle de la voie métrique d'Albert à Doullens qui rejoint la ligne du Nord à Gézaincourt (Wikipédia, « Chemins de fer départementaux de la Somme ») ; le \textit{R.T.O.}, \textit{Railway Transport Officer}, y tient le rôle du commissaire militaire de gare (\textit{Dictionary} 1919, s.v. « Commissaire »). Le \textit{groom} est sans doute Connelly (voir f.~6 r\textsuperscript{o}). Ce jour, « fine and sunny », la Fourth Army prend Morval et Lesbœufs (OH 1916-II, p.~373) et la 54th Brigade monte au bois de Thiepval, qu'elle attaque le 26 à 12 h 35 (JMO 7/Bedf, 25 sept. 1916 ; Nichols 1922, p.~81).
