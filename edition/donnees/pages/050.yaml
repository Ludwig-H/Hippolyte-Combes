date: Lundi 25 septembre 1916
mois: Septembre 1916
lieux: Forceville et Acheux-en-Amiénois (Somme)
titre: Fourrage vert avec le lieutenant Ford ; départ en permission par Acheux-Varennes
transcription: |
  \sl{25 L} \hfill \sl{Sept /16}
  \ind[2] Vers 7^{H}, sur pied.
  Au firmament bleuissant, léger croissant lunaire
  et 2 étoiles très brillantes —
  Temps superbe
  Bientot, entiert pret à partir
  Promené champs tt en haut plateau
  Dû venir à Forceville avec Lt Ford, for green
  forage Chaleur très forte
  à midi enfin, monté sur le dernier wagon
  du convoy allant au railhead puis continué
  à travers chps j à station d'Acheux-Varennes
  Laissé mes colis à Office de l R.T.O. & venu
  village déjeuné.
  Puis attendu lgt. ds mon compartimt petit
  train départemental en gare —
  chaleur intense
  \blanc{4}
  \equerre{2}Tip à mon groom : 2^{f} — Biscuits.
  Lunch à Acheux : 1^{f} 50 \hfill 0.50c
