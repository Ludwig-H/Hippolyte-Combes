critique: Le récit de la journée se poursuit sur la page suivante (f.~26 r\textsuperscript{o}).
historique: |
  Le « Lt Ford » est sans doute Edward Maurice Ford (né en 1882), \textit{2nd Lieutenant} de l'A.S.C. en 1915, qui « served in France with the 18th Divisional Train », capitaine et M.C. en 1917--1918 (Nichols 1922, p.~432 ; Spink, lot 188). Le convoi va à Acheux, tête de ligne des vivres (OH 1916-I, p.~273--274). Acheux-Varennes est sur la voie métrique d'Albert à Doullens, reliée à Gézaincourt à la ligne du Nord (Wikipédia, « Chemins de fer départementaux de la Somme »). Le \textit{groom} est sans doute Connelly (voir f.~6 r\textsuperscript{o}). Le 25, la Fourth Army prend Morval et Lesbœufs (OH 1916-II, p.~373) ; la 54th Brigade monte au bois de Thiepval, attaqué le 26 (JMO 7/Bedf, 25 sept. 1916 ; Nichols 1922, p.~81).
