historique: |
  Raincheval, à 7~km à l'ouest d'Acheux, est le siège de l'\textit{Army Purchase Board} du major Levy (voir f.~46~r\textsuperscript{o}) ; Léalvillers est une halte de la voie métrique Albert--Doullens (OH 1916-I, p.~273). Varennes est à 3~km au sud d'Acheux (voir f.~48~r\textsuperscript{o}). La batterie B, sans doute de la \textit{Royal Field Artillery}, et son interprète, M. Sorgues [?], ne sont pas identifiés. Les professeurs abondent parmi les interprètes : en juin 1917, leur association réclamera les deux tiers des postes (\textit{Les Langues modernes}, 1918, p.~5-6). Acheux, tête de ligne des vivres et du génie (OH 1916-I, p.~274), est bombardé deux jours avant l'assaut du 13 ; les sources consultées n'en disent rien.
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273-274.
- Les Langues modernes, bulletin de l'Association des professeurs de langues vivantes, XVI, 1918, p. 5-6.
