historique: |
  Raincheval, à 7~km à l'ouest d'Acheux, est le siège de l'\textit{Army Purchase Board} du major Levy (voir f.~46~r\textsuperscript{o}) ; Léalvillers est une halte de la voie métrique Albert--Doullens (OH 1916-I, p.~273). Varennes, à 3~km au sud d'Acheux, abrite alors deux hôpitaux d'évacuation, les 4th et 11th \textit{Casualty Clearing Stations} (LLT) ; la batterie B, sans doute d'une brigade de la \textit{Royal Field Artillery}, n'est pas identifiée. Son interprète, M. Sorgues ou Forgues [?], ne l'est pas davantage : un universitaire de plus parmi des interprètes où ils abondent, au point que l'Association des professeurs de langues vivantes réclamera en juin 1917 les deux tiers des postes (\textit{Les Langues modernes}, 1918, p.~5-6). Acheux, QG du V Corps (LLT) et tête de ligne des vivres et du génie (OH 1916-I, p.~274), est bombardé à l'avant-veille de l'assaut du 13, tir que les sources consultées ne signalent pas, non plus que celui du 25 (f.~51~v\textsuperscript{o}). Les 75~c de cartes postales, à 5 ou 10~c pièce ailleurs dans le carnet, paient sans doute un lot.
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 273-274.
- Baker, C., The Long, Long Trail, « Locations of British Casualty Clearing Stations » (copie Wayback Machine du 13 janvier 2018) et « The British V Corps in France and Flanders » (copie Wayback Machine d'août 2020).
- Les Langues modernes, bulletin de l'Association des professeurs de langues vivantes, XVI, 1918, p. 5-6.
