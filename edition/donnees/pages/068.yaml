historique: |
  Ce 7~octobre, la Fourth Army attaque sur les crêtes du Transloy et la 23\textsuperscript{rd} Division prend Le Sars, par un vent d'ouest si fort que les avions du Royal Flying Corps doivent virer face au vent pour observer (Jones 1928, p.~300--301). La « vieille gd-mère » est sans doute la logeuse du f.~34~r\textsuperscript{o}. Le capitaine « Pant » (voir f.~24~r\textsuperscript{o}) n'est pas identifié : aucun Panton de l'A.S.C. dans les dossiers d'officiers (TNA, WO~339 et WO~374). Admis au mess le 12~septembre (f.~21~v\textsuperscript{o}), parti en permission le 25 (f.~25~v\textsuperscript{o}), Hippolyte Combes y a mangé une quinzaine de jours : environ 2~F par jour, contre 47,70~F pour octobre (f.~46~r\textsuperscript{o}) (calcul).
sources:
- Jones, H. A., The War in the Air, vol. II, Oxford, Clarendon Press, 1928, p. 300-301.
- The National Archives (Kew), Discovery, dossiers d'officiers WO 339 et WO 374, recherche « Panton » et « Army Service Corps ».
