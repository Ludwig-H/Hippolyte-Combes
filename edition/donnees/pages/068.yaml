critique: Le compte des dépenses de mess est rejeté au bas de la page, sous un filet, après un blanc ; le nombre de jours, laissé en blanc, n'a jamais été complété.
historique: |
  La tempête de la nuit du 6 au 7 octobre et les bourrasques du jour accompagnent l'attaque de la Fourth Army sur les crêtes du Transloy, où la 23rd Division prend Le Sars le 7 : le vent d'ouest était si fort que les avions du Royal Flying Corps devaient virer face au vent pour observer (Jones 1928, p.~300--301). La « vieille gd-mère » dont l'ancien salon sert de \textit{billet} est sans doute la logeuse laissée sans nom au f.~34 r\textsuperscript{o}. Le capitaine à qui Combes règle le mess n'est pas identifié : le carnet porte « Pant » suivi d'une finale peu lisible, comme au f.~24 r\textsuperscript{o}, et aucun officier de l'A.S.C. nommé Panton ne figure dans les dossiers d'officiers des Archives nationales britanniques (TNA, WO 339 et WO 374) ; il pourrait tenir les comptes du mess. Admis au mess des officiers de la compagnie le 12 septembre (f.~21 v\textsuperscript{o}), parti en permission le 25 (f.~25 v\textsuperscript{o}), Combes y a pris ses repas une quinzaine de jours : 29~F font environ 2~F par jour, contre 47~F~70 pour octobre (f.~46 r\textsuperscript{o}) (calcul).
sources:
- Jones, H. A., The War in the Air, vol. II, Oxford, Clarendon Press, 1928, p. 300-301.
- The National Archives (Kew), Discovery, dossiers d'officiers WO 339 et WO 374, recherche « Panton » et « Army Service Corps ».
