critique: 'Première page écrite du carnet, à l''encre violette ; la fin de la ligne « mess de mes off. » est d''une encre plus pâle, les comptes, sous le filet, d''un violet plus foncé. Le bord droit du feuillet est légèrement coupé par le cadrage.'
historique: |
  « Marg\textsuperscript{te} » est Marguerite Calmels (Millau, 1892-1974), fille du docteur Gabriel Calmels (acte de naissance ; INSEE), qu'Hippolyte Combes épousera à Millau le 25 octobre 1917 (menu du mariage). Sercus est à 2,7 km de Lynde, où Hippolyte Combes loge sans doute (voir f. 2 v\textsuperscript{o}) ; l'« église très curieuse » serait Saint-Érasme, église-halle (\textit{hallekerque}) du XVI\textsuperscript{e} siècle sur soubassements du XII\textsuperscript{e}, au clocher classé en 1913 (Mérimée PA00107816). Les « 2 rangs de statues » visités l'après-midi sont vraisemblablement le jubé du XV\textsuperscript{e} siècle de Saint-Vaast de Lynde, reporté en 1695 au fond de la nef, « sous les orgues » (Palissy PM59000995). Les « 36 off. » sont très probablement ceux du 11th Royal Fusiliers, de la 54th Brigade (Nichols 1922, p. 109), au repos autour de Wallon-Cappel, à 4 km (Beds War Diary, juill. 1916). Les deux villages restaient « en majorité germaniques », flamandophones (Blanchard 1906, p. 483). Jusqu'à son admission au mess (voir f. 21 v\textsuperscript{o}), Hippolyte Combes paie ses repas à ses logeuses.
sources:
- Acte de naissance de Marie Marguerite Calmels, Millau, 16 avril 1892 (archives familiales) ; fichier INSEE des personnes décédées (via matchID), décès du 19 mars 1974 à Millau.
- Menu manuscrit du repas de mariage Combes-Calmels, « 25 octobre 1917 » (archives familiales).
- Ministère de la Culture, base Mérimée, notice PA00107816 (église Saint-Érasme, Sercus).
- Ministère de la Culture, base Palissy, notice PM59000995 (jubé, église Saint-Vaast, Lynde).
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg-Londres, Blackwood, 1922, p. 109.
- 'Bedfordshire Archives Service (Bedford), X550/8/1/1607 et 1607b : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet 1916 (cité « Beds War Diary »).'
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, p. 483.
