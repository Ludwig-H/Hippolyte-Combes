historique: |
  « Marg\textsuperscript{te} » est Marguerite Calmels (Millau, 1892-1974), fille du docteur Gabriel Calmels (acte de naissance ; INSEE) ; Hippolyte Combes l'épouse à Millau le 25 octobre 1917 (menu du mariage). Il loge sans doute à Lynde (voir f. 2 v\textsuperscript{o}), à 2,7 km de Sercus. L'« église très curieuse » serait Saint-Érasme de Sercus, église-halle du XVI\textsuperscript{e}~s. (Mérimée PA00107816). Les statues sont sans doute celles du jubé du XV\textsuperscript{e}~s. de Saint-Vaast de Lynde, placé en 1695 au fond de la nef (Palissy PM59000995). Les 36 officiers sont très probablement ceux du 11th Royal Fusiliers, 54th Brigade (Nichols 1922, p. 109). Jusqu'à son admission au mess (voir f. 21 v\textsuperscript{o}), il paie ses repas à ses logeuses.
sources:
- Acte de naissance de Marie Marguerite Calmels, Millau, 16 avril 1892 (archives familiales) ; fichier INSEE des personnes décédées (via matchID), décès du 19 mars 1974 à Millau.
- Menu manuscrit du repas de mariage Combes-Calmels, « 25 octobre 1917 » (archives familiales).
- Ministère de la Culture, base Mérimée, notice PA00107816 (église Saint-Érasme, Sercus).
- Ministère de la Culture, base Palissy, notice PM59000995 (jubé, église Saint-Vaast, Lynde).
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg-Londres, Blackwood, 1922, p. 109.
