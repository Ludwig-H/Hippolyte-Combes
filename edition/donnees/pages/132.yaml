date: Samedi 27 (comptes) et dimanche 28 janvier 1917
mois: Janvier 1917
lieux: Paris ; Toulouse (Haute-Garonne)
titre: Comptes du 27 janvier à Paris ; arrivée à Toulouse le 28, visite de l'oncle Émile
transcription: |
  Sam \sl{– 27} \hfill \sl{Janv. /17}
  \sl{Paris}. gare du nord. Facteur : 20c
  \ind Gare d Orsay : 10c. \hfill Carte ples : 10c
  \ind Enregt 2 colis, 2f 40 : 10c
  \ind Fiacre \inc{taxametre} : 1^{f}45 + 30c = 1 75c
  \ind Métro : 15, 15c \hfill Diner : 1^{f}95 + 10c
  \ind Billet pour Toulouse : 11^{f} 15c
  Magasins Hotel de Ville : 1 brosse à cheveux : 3^{f}95
  \ind Brosse à souliers : 65c. — Peigne fin : \inc{15}c
  \ind Peigne ord^{re} : 95c. — Cirage noir : 50c
  \filet
  \sl{Dimanche 28}
  \ind Voyage, terminé sans incidents \trait
  En approchant de Toulouse, souvrs jeunesse
  revenus en foule esprit. Cru revoir mère et
  \inc{sœurs}, m'attendant, cme autrefois, gare
  Vers 8^{H}15 arrivée
  Retiré 2 bagages. Pris tram St-Michel
  Matinée, ds mon appartt, à ranger
  affaires.
  \ind oncle Émile, venu me surprendre à 10^{H}\fr{1}{2}
  a midi, enfin, à Ste-Marie – Dû
  attendre tram 30m. angle musee
  \filet[d]{0.7}
