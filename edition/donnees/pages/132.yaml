critique: Les comptes du samedi 27, qui n'avaient pas trouvé place au verso précédent, occupent le haut de la page ; un filet les sépare du récit du dimanche 28, qui se poursuit au verso (f. 66 v\textsuperscript{o}).
historique: |
  Le billet de 11 f 15 est payé au quart de place militaire (Lafon 1922, p. 37 ; voir f. 27 r\textsuperscript{o}) : il est proche du billet de 3\textsuperscript{e} classe du retour d'octobre (11 f 75, f. 32 r\textsuperscript{o}), quand le plein tarif de 3\textsuperscript{e} Paris – Toulouse était de 35 fr. 40 en 1912 (Baedeker 1912, R. 39). À Matabiau, Combes prend la ligne de la gare à la place Saint-Michel (Baedeker 1912, p. 298), proche de son appartement de la rue de Languedoc ; l'« angle musee » est sans doute celui du musée des Augustins, où il attend le tram du Capitole pour la Côte-Pavée ; la presse dénonce alors « la crise des tramways électriques » (\textit{Le Télégramme}, 30 janv. 1917, p. 3). Les morts évoqués sont sa mère, Anaïs Alric, morte à Toulouse en 1907, et ses sœurs Maria (Carthage, 1903) et Joséphine (Nogent-le-Rotrou, octobre 1914, selon la tradition familiale). L'oncle Émile est Émile Crouzet (v. 1842–1926), mari de la tante paternelle de Marguerite (\textit{L'Express du Midi}, 23 déc. 1926) ; sur Sainte-Marie, voir f. 27 v\textsuperscript{o}.
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
