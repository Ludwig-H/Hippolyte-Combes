historique: |
  Le billet pour Toulouse, 11~f~15, est payé au quart de place militaire (Lafon 1922, p.~37 ; voir f.~27~r\textsuperscript{o}) ; le plein tarif de 3\textsuperscript{e} classe était de 35~fr.~40 en 1912 (Baedeker 1912, R.~39). De Matabiau, le tram mène à la place Saint-Michel, près de l'appartement de la rue de Languedoc (Baedeker 1912, p.~298) ; l'« angle musee » est sans doute celui du musée des Augustins. Hippolyte Combes pense à sa mère, Anaïs Alric, morte à Toulouse en 1907, et à ses sœurs mortes, Maria (Carthage, 1903) et Joséphine (Nogent-le-Rotrou, octobre 1914, selon la tradition familiale ; P. Combes, biographie familiale). L'oncle Émile est Émile Crouzet (v.~1842–1926), mari de la tante paternelle de Marguerite (\textit{L'Express du Midi}, 23 déc. 1926) ; sur Sainte-Marie, voir f.~27~v\textsuperscript{o}.
sources:
- Lafon, G., Les Chemins de fer français pendant la guerre, thèse de droit, Paris, A. Rousseau, 1922, p. 37.
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, R. 39 et p. 298.
- L'Express du Midi (Toulouse), 23 décembre 1926, p. 5 (faire-part d'Émile Crouzet).
- Combes, Pierre, biographie familiale d'Hippolyte Combes, dactylographie, s. d.
