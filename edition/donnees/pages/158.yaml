historique: |
  Le dégel commencé le 16~février défonce les routes de l'arrière (OH~\mbox{1917-I}, p.~76 ; voir f.~78~r\textsuperscript{o}). Auxi-le-Château (Pas-de-Calais), sur l'Authie, est à 18~km à l'ouest-nord-ouest de Doullens ; Combes y va pour la troisième fois (voir ff.~62~r\textsuperscript{o} et 76~r\textsuperscript{o}). Puchevillers, à 3~km au nord d'Hérissart, abrite deux \textit{Casualty Clearing Stations} (LLT). Le mandat de 42~F paie sans doute le panier de fleurs envoyé de Nice par M\textsuperscript{me} Spagnol, non identifiée (voir ff.~67~r\textsuperscript{o} et 68~r\textsuperscript{o}). Combes rachète des semelles de liège le 11~avril (f.~89~v\textsuperscript{o}). Molliens-au-Bois est à 5~km au sud-sud-ouest d'Hérissart.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 76.
