critique: Encre violette. Les trois journées sont séparées par deux filets ; les comptes de Doullens, réunis à gauche par un grand crochet, s'insèrent dans la notice du 21, avant l'après-midi à Hérissart, et un pâté d'encre couvre la fin de « liège ».
historique: |
  Les « fondrières » sont celles du dégel commencé le 16 février, qui défonce les routes de l'arrière (OH 1917-I, p.~76 ; voir f.~78 r\textsuperscript{o}). Auxi-le-Château (Pas-de-Calais), sur l'Authie, à 19~km au nord-ouest de Doullens, est pour la troisième fois le terme d'une course (voir f.~62 r\textsuperscript{o} et f.~76 r\textsuperscript{o}, chez M. Romert). Le retour passe par Puchevillers, à 3~km au nord d'Hérissart, tête de ligne de munitions en juillet 1916 (OH 1916-I, p.~274), où les 3rd et 44th \textit{Casualty Clearing Stations} restent installées jusqu'en mars 1917 (LLT). Le mandat de 42~francs règle sans doute le panier de fleurs expédié de Nice par Mme Spagnol et retiré à la gare de Toulouse le 29 janvier (voir f.~67 r\textsuperscript{o} et f.~68 r\textsuperscript{o}) ; la destinataire n'est pas identifiée. Les semelles de liège se glissaient sans doute dans les chaussures contre le froid et l'humidité ; Hippolyte Combes en rachète « 2 » pour 40~c. à Doullens le 11 avril (f.~89 v\textsuperscript{o}). Molliens-au-Bois est à 4,5~km au sud-sud-ouest d'Hérissart.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 76.
