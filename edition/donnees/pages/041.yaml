lieux: Oppy (Beaudricourt, Pas-de-Calais) ; Lucheux, Thièvres et Raincheval (Somme)
titre: D'Oppy à Raincheval par Lucheux et Thièvres ; logé chez de pauvres gens
transcription: |
  \sl{Lundi 11 —} Sur pied, \inc{dès} 5^{H} — \hfill \sl{Sept^{bre} /16}
  \ind[2] Derangé sur matin
  Quitté Oppy 7H. Ciel couvert
  Chevauché matinée entière – Après 3^{H} soir,
  seulement, arrivé à Raincheval
  aujd'hui souffert poussière.
  \inc{At} 11^{H} m. soleil perce nuages – et
  très ardent
  Traversé régions pittoresques : coteaux
  boisés, petite vallée verdoyante,
  \blanc{1}
  Arrêt à Lucheux : Edit de \inc{Ls} XI, \add{des postes} 1464
  \ind Raincheval, très gros village ( aux
  maisons mal entretenues – fourmillant
  de tommies. Très nombreuses troupes, y
  cantonnées.
  \ind Trouvé chambrette famille de pauvres
  , mais braves gens. Fille ainée, prête à accoucher
  mangé tjs au mess off \trait
  \blanc{2}
  \crochet{3}— Tip au groom Connelly : 1^{f} —
  Oeufs : 3 à Thièvres : 50c. — 4 à Raincheval : 70c
  6 cartes ples de Raincheval : 30 c \trait
  1 litre bière : 50 + 10 c –
