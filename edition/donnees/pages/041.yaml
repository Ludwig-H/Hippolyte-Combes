critique: Encre noire virée au brun ; les l.~9--10 sont très chargées d'encre. La ligne de Lucheux est d'une encre plus brune et plus pâle, sans doute écrite à part.
historique: |
  D'Oppy, la colonne descend sur Lucheux (Somme), à 6,6 km (OSM), et passe ainsi du Pas-de-Calais dans la Somme. Lucheux garde son château, son beffroi, porte de ville, et l'église Saint-Léger, tous protégés (Mérimée PA00116194, PA00116193, PA00116195). L'« Edit de Ls XI » est l'édit dit de Luxies, daté du 19 juin 1464, longtemps tenu pour l'acte fondateur de la poste royale, mais dont l'authenticité est contestée depuis 1937 (Zeller 1946, p. 338, n. 3). Thièvres est un village coupé par l'Authie entre deux communes homonymes, du Pas-de-Calais et de la Somme (OSM). L'infanterie de la brigade va en autobus du Souich à Halloy, puis à pied par Thièvres et Marieux ; le 7th Bedfordshire atteint Raincheval à 14 h 15 (JMO 7/Bedf, 11 sept. 1916), dans la zone « O » de la Reserve Army. Les œufs reviennent à 16,7 et 17,5 c pièce, un peu moins que la douzaine à 2,40 F d'une coopérative parisienne en juillet 1916 (March 1925, p. 188) ; la bière coûte 50 c le litre contre 30 c en Flandre (voir f. 7 v\textsuperscript{o}), les 10 c ajoutés étant peut-être la consigne.
