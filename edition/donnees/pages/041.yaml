historique: |
  D'Oppy, la colonne passe du Pas-de-Calais dans la Somme par Lucheux, à 6,6 km (OSM). Lucheux garde son château, son beffroi et son église, protégés (Mérimée PA00116194, PA00116193, PA00116195). L'« Edit de Ls XI » est l'édit de Luxies (19 juin 1464), longtemps tenu pour l'acte fondateur de la poste royale, mais contesté depuis 1937 (Zeller 1946, p. 338, n. 3). Thièvres est coupé par l'Authie entre deux communes homonymes, du Pas-de-Calais et de la Somme (OSM). L'infanterie de la brigade va en autobus du Souich à Halloy, puis à pied par Thièvres et Marieux ; le 7th Bedfordshire arrive à Raincheval à 14 h 15 (JMO 7/Bedf, 11 sept. 1916). La bière coûte 50 c le litre, contre 30 c en Flandre (voir f. 7 v\textsuperscript{o}) ; les 10 c ajoutés sont peut-être la consigne.
