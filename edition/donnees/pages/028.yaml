critique: 'La page poursuit le récit du 25 août commencé au recto : elle revient sur le trajet en train, déjà noté par ses seuls horaires (f. 14 r\textsuperscript{o}), et le conduit jusqu''à l''arrivée à Marquay. Les mots « haut d''1 plateau » (l.~16) sont d''une encre plus appuyée, sans doute après recharge de la plume.'
historique: |
  L'infanterie de la 54th Brigade avait gagné Saint-Pol par le rail dans la nuit du 24 au 25 ; chevaux et voitures suivent l'après-midi (JMO 7/Bedf, ordre n° 26, 23 août 1916). Marquay, « petit hameau » pour Combes, est une commune du Ternois à 6 km à l'est de Saint-Pol-sur-Ternoise ; elle forme avec La Thieuloye (QG de brigade), Orlencourt et Bailleul-aux-Cornailles la zone de cantonnement de la brigade (ibid.), et le 12th Middlesex y loge jusqu'au 9 septembre (Wyrall [1926], p. 309). C'est l'arrière de la Third Army, qui tient le front d'Hébuterne à Vimy (Miles 1938, p. 543, n. 3) ; la division y fait « three weeks' battle training » avant de regagner la Somme (Nichols 1922, p. 78). Les « réflexions amères » sur l'État qui, après les corps, prend l'intelligence et le cœur font écho, plus sobrement, à la lettre du 16 juin 1916 à sa sœur, très probablement la carmélite Françoise : « Toutes ces abstractions : gloire, honneur etc. quel tas de blagues ! » (archives familiales). Le \textit{groom} est l'ordonnance chargée de son cheval, sans doute Connelly (pourboires de 1 ou 2 F).
