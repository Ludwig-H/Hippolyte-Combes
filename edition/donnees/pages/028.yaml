historique: |
  Marquay, à 6 km à l'est de Saint-Pol, est l'un des cantonnements de la 54th Brigade (JMO 7/Bedf, ordre n° 26, 23 août 1916) ; le 12th Middlesex y loge jusqu'au 9 septembre (Wyrall [1926], p. 309). C'est l'arrière de la Third Army, qui tient le front d'Hébuterne à Vimy (Miles 1938, p. 543, n. 3) ; la division y fait « three weeks' battle training » avant de regagner la Somme (Nichols 1922, p. 78). Les « réflexions amères » sur l'État rappellent sa lettre du 16 juin 1916 à sa sœur, sans doute Françoise, carmélite : « Toutes ces abstractions : gloire, honneur etc. quel tas de blagues ! » (archives familiales). Le \textit{groom} est sans doute Connelly (voir f. 6 r\textsuperscript{o}).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916, ordre d''opérations n° 26 du 23 août (transcription en ligne).'
- Wyrall, Everard, The Die-Hards in the Great War, vol. I, London, Harrison & Sons, [1926], p. 309.
- Miles, Wilfrid (comp.), Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 543, n. 3.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh-London, Blackwood, 1922, p. 78.
- Lettre d'Hippolyte Combes à sa sœur [Françoise], « Au front, vendredi 16 juin 1916 », 4 p., archives de la famille Combes.
