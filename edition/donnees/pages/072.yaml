historique: |
  La « manière pareille » renvoie au \textit{green forage} de la veille (voir f.~36 r\textsuperscript{o}). Les \textit{wagons} sont sans doute les \textit{G.S. wagons} de la compagnie, chariots réglementaires à quatre roues tirés par quatre chevaux (FSPB 1914, chap.~5, § 5). Le « grand bois de Ribeaucourt » borde à l'ouest le territoire de Franqueville, dont dépendait alors Barlette (Inventaire, village de Franqueville). Les interprètes, en kaki, portaient le képi « ou le nouveau casque — également khaki » (Fernand-Laurent 1917, préface, p.~XIII), sans doute le casque Adrian ; la cape était déjà « traversée par la pluie » le 18 septembre (voir f.~23 r\textsuperscript{o}). Ce 11 octobre, Haig visite le 7th Bedfordshire, cantonné à Vacquerie, à quelques kilomètres de Barlette (JMO 7/Bedf, 11 oct. 1916).
sources:
- Field Service Pocket Book, 1914, London, HMSO, 1914, chap. 5, § 5.
- Région Hauts-de-France, Inventaire général du patrimoine culturel, dossier « Le village de Franqueville », inventaire.hautsdefrance.fr.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XII-XIII.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
