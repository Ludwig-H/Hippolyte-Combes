critique: 'Encre violette. La journée n''occupe que le haut de la page : sous un filet tracé à mi-hauteur, la moitié inférieure, marquée de rousseurs, est restée blanche.'
historique: |
  La « manière pareille » renvoie à la corvée de \textit{green forage} de la veille (voir f.~36 r\textsuperscript{o}). Les \textit{wagons} sont sans doute les \textit{G.S. wagons} de la compagnie, grands chariots réglementaires à quatre roues attelés de quatre chevaux (FSPB 1914, chap.~5, § 5), que Combes nomme le lendemain avec un \textit{limber} (voir f.~37 r\textsuperscript{o}). Le « grand bois de Ribeaucourt » est le massif qui borde à l'ouest le territoire de Franqueville, dont dépendait alors Barlette (Inventaire, village de Franqueville). Habillés de kaki, les interprètes portaient le képi « ou le nouveau casque — également khaki » (Fernand-Laurent 1917, préface, p.~XIII), sans doute le casque Adrian ; la cape, son vêtement de pluie, était déjà « traversée par la pluie » le 18 septembre (voir f.~23 r\textsuperscript{o}). Ce même 11 octobre, Haig visite les cantonnements du 7th Bedfordshire, à Vacquerie, à quelques kilomètres de là (JMO 7/Bedf, 11 oct. 1916) : la 54th Brigade achève son repos dans la zone de Candas (voir f.~33 v\textsuperscript{o}).
sources:
- Field Service Pocket Book, 1914, London, HMSO, 1914, chap. 5, § 5.
- Région Hauts-de-France, Inventaire général du patrimoine culturel, dossier « Le village de Franqueville », inventaire.hautsdefrance.fr.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. XII-XIII.
- 'Bedfordshire Archives Service, X550/8/1/1610 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, octobre 1916 (transcription en ligne).'
