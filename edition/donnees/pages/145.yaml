critique: La dépense de la dernière ligne, isolée au bas de la page après un blanc, se rapporte à la correspondance du matin à Brioude (f.~72~r\textsuperscript{o}) ; même encre violette que le récit. Le voyage se poursuit au feuillet suivant.
historique: |
  Le passage par Corbeil à 5~h~50, une heure et demie après Montargis, indique que l'express a quitté la grande ligne du Bourbonnais pour gagner Paris par la ligne P.L.M. de Montargis à Corbeil par Malesherbes, ouverte en 1865-1867, plutôt que par Moret et Melun (Wikipédia, « Ligne de Villeneuve-Saint-Georges à Montargis ») ; ce n'est qu'une probabilité. Corbeil et Essonnes, qu'Hippolyte Combes réunit en « Corbeil-Essonne », sont alors deux communes distinctes de Seine-et-Oise, fusionnées en 1951. À Paris, la correspondance par le métro emprunte la ligne~1 de la gare de Lyon à la Bastille, puis la ligne~5, qui relie depuis 1907 l'Étoile à la gare du Nord par la Bastille (Wikipédia, « Ligne 5 du métro de Paris ») ; le billet de 2\textsuperscript{e} classe coûte 15~c (Baedeker 1913, p.~28 ; voir f.~66~r\textsuperscript{o}). Le sol « durci par fortes gelees » est celui du froid qui, depuis le 29 janvier, fait charrier des glaçons à la Seine (\textit{La Dépêche}, 30 janv. 1917, p.~3). Le train de 7~h~19 le mène à Amiens à minuit et demi (f.~73~r\textsuperscript{o}).
