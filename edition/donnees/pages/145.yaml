historique: |
  Le passage à Corbeil à 5~h~50, une heure et demie après Montargis, suggère que l'express a pris la ligne P.L.M. de Montargis à Corbeil par Malesherbes, ouverte en 1865-1867, plutôt que par Moret et Melun (Wikipédia, « Ligne de Villeneuve-Saint-Georges à Montargis »). Corbeil et Essonnes sont alors deux communes de Seine-et-Oise, réunies en 1951 (Wikipédia, « Corbeil-Essonnes »). À Paris, il prend la ligne~1 du métro jusqu'à la Bastille, puis la ligne~5, qui relie depuis 1907 la Bastille à la gare du Nord (Wikipédia, « Ligne 5 du métro de Paris ») ; le billet de 2\textsuperscript{e} classe coûte 15~c (Baedeker 1913, p.~28 ; voir f.~66~r\textsuperscript{o}). Depuis le 29 janvier, la Seine charrie des glaçons (\textit{La Dépêche}, 30 janv. 1917, p.~3). Le train de 7~h~19 arrive à Amiens à minuit et demi (f.~73~r\textsuperscript{o}).
