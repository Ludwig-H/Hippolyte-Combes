critique: Un filet sépare les journées du 28 et du 29. « et d'ennui » est écrit dans la marge gauche, entre les l.~21 et 23 ; les deux dernières lignes, serrées contre le bord inférieur du feuillet, sont d'une lecture difficile, et la parenthèse ouverte avant « Roumanie » n'est pas refermée.
historique: |
  Le temps concorde avec le journal des Bedfords : 28 août, « Heavy showers at times » ; 29 août, « Heavy thunderstorm, men got very wet » (JMO 7/Bedf) ; à Chelers, le 10th Essex essuie au retour d'un exercice d'attaque derrière un barrage figuré « the heaviest thunderstorm we experienced in 1916 » (Banks \& Chell 1924, p. 145). Le 28, la brigade s'exerce à l'attaque sous bois au bois des Hérombus, sur Averdoingt, à 4 km au sud-est de Marquay (JMO 7/Bedf ; localisation OSM). Le « green fourrage » est le fourrage vert réglementaire des chevaux (voir f. 9 v\textsuperscript{o}). Le lieutenant Curtis, chargé du fourrage, reste non identifié (onze officiers de l'A.S.C. de ce nom : TNA, WO 339) ; voir f. 3 r\textsuperscript{o}. La Roumanie a déclaré la guerre à l'Autriche-Hongrie le dimanche 27 août ; l'Allemagne lui déclare la guerre le 28, la Turquie le 30, la Bulgarie le 1er septembre (Falls 1933, p. 139). En Angleterre, les journaux du soir l'annoncent dès le 28 (Henson, journal, 28 août 1916), d'où sans doute les « confirmations » du 29.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- Banks, T. M., et Chell, R. A., With the 10th Essex in France, 2e éd., London, Gay & Hancock, 1924, p. 145.
- 'The National Archives (Kew), WO 339 : dossiers d''officiers, recherche « Curtis » « Army Service Corps ».'
