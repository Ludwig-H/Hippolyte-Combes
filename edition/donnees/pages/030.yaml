historique: |
  Le journal des Bedfords note le même temps : « \textit{Heavy showers at times} » le 28, « \textit{Heavy thunderstorm, men got very wet} » le 29 (JMO~7/Bedf). Le « green fourrage » est le fourrage vert des chevaux (voir f.~9~v\textsuperscript{o}). Le lieutenant Curtis, chargé du fourrage, n'est pas identifié (onze officiers de l'A.S.C. de ce nom : TNA, WO 339 ; voir f.~3~r\textsuperscript{o}). La Roumanie a déclaré la guerre à l'Autriche-Hongrie le 27~août ; l'Allemagne lui déclare la guerre le 28 (Falls 1933, p.~139). Les journaux anglais du soir l'annoncent dès le 28 (Henson, journal, 28~août 1916), d'où sans doute les « Confirmations » du 29.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (transcription en ligne).'
- 'The National Archives (Kew), WO 339 : dossiers d''officiers, recherche « Curtis » « Army Service Corps ».'
- Falls, Cyril (comp.), Military Operations, Macedonia, vol. I, London, HMSO, 1933, p. 139.
- Henson, Herbert Hensley, Journals, vol. 20, p. 424, 28 août 1916, Durham University (henson.durham.ac.uk/journals/16-08-28), consulté le 18 oct. 2026.
