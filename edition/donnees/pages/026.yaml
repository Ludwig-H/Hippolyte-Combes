historique: |
  Steenwerck (Nord), presque intact jusque-là, sera pris le 10 avril 1918 et restera allemand jusqu'en octobre (CWGC, Le Grand Beaumart). L'église, dédiée à la Décollation de saint Jean-Baptiste, disparaîtra dans ces combats et sera reconstruite en 1928 (Mérimée PA59000231 ; voir f. 5 r\textsuperscript{o}) ; de l'ancien édifice ne subsistent que des fonts de 1567 et un chapiteau (Palissy PM59003991-3992). La relique de saint Hippolyte, martyr romain fêté le 13 août, la veille de l'anniversaire d'Hippolyte Combes (né le 14 août 1876), n'est pas documentée. Maurin est le collègue interprète, sans doute provençal, qu'Hippolyte Combes fréquente depuis le 6 août (voir f. 6 v\textsuperscript{o}) ; Fisher, soldat de la compagnie, reste inconnu. Mme Cliquennois est sans doute la propriétaire de son logement de La Croix-du-Bac (voir f. 10 r\textsuperscript{o} et 12 r\textsuperscript{o}). Le soir même, le 7th Bedfordshire quitte Erquinghem à 18 h 30 pour la gare de Bailleul (Beds War Diary, 24 août 1916) ; la compagnie suit le lendemain (voir f. 14 r\textsuperscript{o}).
sources:
- CWGC, Le Grand Beaumart British Cemetery, Steenwerck (fiche 20802), historique.
- Ministère de la Culture, base Mérimée, PA59000231 (église Saint-Jean-Baptiste, Steenwerck).
- Ministère de la Culture, base Palissy, PM59003991 et PM59003992 (Steenwerck, fonts baptismaux ; chapiteau et fût de colonne).
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (Beds War Diary), 24 août.'
