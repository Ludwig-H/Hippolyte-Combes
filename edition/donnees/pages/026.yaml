historique: |
  La relique de saint Hippolyte, fêté le 13~août, veille de l'anniversaire d'Hippolyte Combes (voir f.~10~r\textsuperscript{o}), n'est pas documentée. L'église, reconstruite en 1928 (voir f.~5~r\textsuperscript{o}), ne garde de l'édifice ancien que des fonts de 1567 et un chapiteau (Palissy PM59003991-3992). Sur Maurin, collègue interprète sans doute provençal, voir f.~7~r\textsuperscript{o}. M\textsuperscript{me} Cliquennois, payée pour cuisine et blanchissage, est sans doute sa logeuse (voir ff.~7~v\textsuperscript{o} et 12~r\textsuperscript{o}) ; Fisher, soldat de la compagnie, n'est pas identifié. Le soir même, le 7\textsuperscript{th} Bedfordshire part pour la gare de Bailleul (JMO~7/Bedf, 24~août 1916) ; la compagnie suit le lendemain (voir f.~14~r\textsuperscript{o}).
sources:
- Ministère de la Culture, base Palissy, PM59003991 et PM59003992 (Steenwerck, fonts baptismaux ; chapiteau et fût de colonne).
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, août 1916 (JMO 7/Bedf), 24 août.'
