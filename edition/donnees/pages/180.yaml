critique: Encre violette ; la fin de la journée du 17, depuis « C'est de nouveau l'hiver », est d'un violet plus clair.
historique: |
  Le mauvais temps borne les courses du service d'achats de paille et de fourrage aux villages proches d'Hérissart : Pierregot et Rubempré, au sud-ouest et à l'ouest, Fréchencourt, dans la vallée de l'Hallue, déjà parcourus les jours précédents (voir f.~89 r\textsuperscript{o}). L'« Office » où Combes passe son dimanche à lire est sans doute le bureau que le service d'achats occupe, avec le mess, au n\textsuperscript{o}~104 d'Hérissart depuis le 7 février (voir f.~74 r\textsuperscript{o}). La note de blanchissage, 60 c., est dans la moyenne de l'hiver, entre 50 c. et 1 F 25 ; la blanchisseuse d'Hérissart s'appelait Albertine (f.~78 v\textsuperscript{o}). La famille Denis, chez qui Combes passe la soirée du 16 et qu'il reverra jusqu'à la fin d'avril, n'est pas identifiée. Ce lundi 16 avril, l'armée française lance entre Soissons et Reims l'offensive Nivelle du Chemin des Dames, par un temps froid et pluvieux (Offenstadt 2004) ; le carnet n'en dit rien.
sources:
- Offenstadt, N. (dir.), Le Chemin des Dames. De l'événement à la mémoire, Paris, Stock, 2004.
