fichier: 20251126_111630.jpg
date: Samedi 14 – mardi 17 avril 1917
mois: Avril 1917
lieux: Hérissart, Pierregot, Fréchencourt et Rubempré (Somme)
titre: Beau samedi, puis pluies ; soirée chez les Denis ; neige et grêle le 17
transcription: |
  \sl{14 Sam.} \hfill — \sl{Avril 1917} —
  \ind Enfin, très belle journée,
  temperature se rechauffe, soleil ardent
  Après-midi seulement, course à Pierregot. Matin
  & soirée, liberté entière.
  \blanc{1}
  \sl{15 Dim.} – Pluie fine et tiède
  Tout le jour, averses, temps froid.
  Matin & soir, repos absolu.
  Resté plusieurs heures à Office, à lire. —
  \blanc{1}
  \equerre{1}Washing : 60c. —
  \blanc{1}
  \sl{16 Lundi.}
  \ind Après-midi, course à Pierregot
  Tout le jour, et le soir surtout, pluies très fortes
  Passé soirée chz la famille Denis. Rentré
  home sous 1 pluie battante, torrentielle,
  et ds nuit très noire.
  \blanc{1}
  \sl{17 Mardi.} \hfill Temps toujours affreux. Averses
  intermittentes. Après-midi neige et grêle
  tour à tour. Froid de plus en plus vif –
  \ind C'est de nouveau l'hiver \trait
  Matin & après-midi, courses en auto, à
  \ind Frechencourt & Rubempré
apparat:
- ligne: 15
  lemme: home
  type: emprunt
  note: chez moi, au logement
historique: |
  Le mauvais temps limite les courses du service d'achats de paille et de fourrage aux villages proches d'Hérissart : Pierregot, Rubempré, Fréchencourt (voir f.~89 r\textsuperscript{o}). L'« Office » où Hippolyte Combes passe son dimanche à lire est sans doute le bureau que le service occupe, avec le mess, au n\textsuperscript{o}~104 d'Hérissart depuis le 7 février (voir f.~74 r\textsuperscript{o}). Le blanchissage, 60 c., est dans la moyenne de l'hiver (de 50 c. à 1 F 25). La famille Denis n'est pas identifiée (voir f.~89 r\textsuperscript{o}). Le lundi 16 avril, l'armée française lance l'offensive Nivelle au Chemin des Dames, entre Soissons et Reims, par un temps froid et pluvieux (Offenstadt 2004) ; le carnet n'en dit rien.
sources:
- Offenstadt, N. (dir.), Le Chemin des Dames. De l'événement à la mémoire, Paris, Stock, 2004.
