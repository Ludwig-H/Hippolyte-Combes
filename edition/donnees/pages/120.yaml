historique: |
  Les « XIII corps Archie » (voir f.~58~r\textsuperscript{o}) sont sans doute les chanteurs des batteries antiaériennes du corps : \textit{Archie} désigne en argot militaire le canon antiaérien (Partridge 1937, s.v.). Le XIII~Corps, à Acheux depuis le 29~novembre, part pour Doullens le 12~janvier (LLT) : les 78~F~75 sont son dernier versement à Hippolyte Combes, payé ensuite par le V Corps (f.~62~v\textsuperscript{o}). Beauquesne avait abrité depuis juin 1916 le QG avancé de Haig (OH~\mbox{1916-I}, p.~304). Le lieutenant Walsh, d'Hérissart, est connu depuis novembre (f.~49~v\textsuperscript{o}) ; Morris est sans doute l'officier de la 150\textsuperscript{th} Company, manqué le 9 à Hédauville (f.~60~v\textsuperscript{o}). Le contrat conclut l'affaire du 26~décembre (f.~57~v\textsuperscript{o}).
sources:
- Partridge, E., A Dictionary of Slang and Unconventional English, London, Routledge, 1937, s.v. « Archie ».
- Baker, C., The Long, Long Trail, « The British XIII Corps in France and Flanders » et « The British V Corps in France and Flanders » (longlongtrail.co.uk, consultés le 18 oct. 2026).
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 304.
