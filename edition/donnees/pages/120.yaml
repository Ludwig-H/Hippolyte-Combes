critique: Les deux journées sont séparées par un filet ; la solde, inscrite au pied de la page après un blanc, est ouverte par une équerre. Quelques mots (« qq », « ds », début de « chanteurs ») sont repassés d'une encre plus épaisse.
historique: |
  Les « XIII Corps Archie », déjà entendus le 28 décembre (f.~58~r\textsuperscript{o}), sont vraisemblablement la troupe de chanteurs des batteries antiaériennes du XIII Corps : \textit{Archie} désigne depuis 1915, en argot militaire britannique, le canon antiaérien et ses servants (Partridge 1937, s.v.). Ce corps, à Acheux depuis le 29 novembre, partira pour Doullens le 12 janvier (LLT) : les 78~F~75 touchés au bureau de sa Mission sont son dernier versement à Combes, payé ensuite par le V Corps (f.~62~v\textsuperscript{o}). La somme vaut sans doute quinze jours à 5~F~25, comme les 84~F du 19 décembre en font seize (f.~56~r\textsuperscript{o}). La lune, dite « entière » le 4, ne sera pleine que le 8 (TheSkyLive). Beauquesne avait abrité depuis le 27 juin 1916 le QG avancé de Haig, au château de Valvion (OH 1916-I, p.~304). Le lieutenant Walsh, d'Hérissart, est connu depuis novembre (f.~49~v\textsuperscript{o}) ; Morris est sans doute l'officier de la 150th Company retrouvé le 9 (f.~60~v\textsuperscript{o}). Le contrat conclut l'affaire engagée le 26 décembre (f.~57~v\textsuperscript{o}).
sources:
- Partridge, E., A Dictionary of Slang and Unconventional English, London, Routledge, 1937, s.v. « Archie ».
