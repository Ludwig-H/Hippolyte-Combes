date: Mercredi 27 septembre 1916
mois: Septembre 1916
lieux: Toulouse (Haute-Garonne)
titre: Arrivée à Toulouse ; déjeuner chez les Crouzet ; Marguerite à la Côte-Pavée
transcription: |
  \sl{27 mer.} \hfill Sept \sl{1916}
  nuit passée \inc{ds} \inc{wag^{t}}. Dormi 1 peu
  A 7^{H} 30 m. , arrivé a Toulouse
  Pris tram et vers 8^{H}, ds mon appartement
  A 11^{Hm} – monté à S^{te} Marie-des-Champs. Les dames
  Calmels, pas e. arrivées, ne seront là que ce soir –
  Déjeuné chz les Crouzet, ds la + gd intimité
  Redescendu apres-midi en ville et fait courses
  diverses
  \blanc{2}
  A 5^{H}, remonté Cote-Pavée. Enfin, revu
  Margte. Charmante de simplicité & de tendresse
  confiante.
  \blanc{7}
  \filet
  Trams : 10, 10, 20 c..
  Bain, aux Thermes du Languedoc : 90 c – + 15 c
  Cartes ples :
