historique: |
  Son appartement est au 24, rue de Languedoc (lettre du 25 nov. 1918) ; les Thermes du Languedoc sont au 1~bis de la même rue (\textit{Le Télégramme}, 31 mars 1911, p.~4). Sainte-Marie-des-Champs, à la Côte-Pavée, est au terminus d'un tram parti du Capitole (Baedeker 1912, p.~298) ; la presse y signale une « villa Sainte-Marie-des-Champs » (\textit{La Dépêche}, 27 juin 1914, p.~4), où logent probablement les Crouzet. Émile Crouzet (v.~1842--1926), ancien agent de change à Millau, et sa femme, sœur du docteur Gabriel Calmels, sont l'oncle et la tante de Marguerite (PC-2020, p.~106 ; \textit{L'Express du Midi}, 23 déc. 1926, p.~5). « Les dames Calmels » sont Marguerite (voir f.~1 r\textsuperscript{o}) et sa mère, née Valentine Cartairade.
sources:
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, p. 298.
- Carte-lettre d'Hippolyte Combes à Marguerite, Paris, 25 novembre 1918 (archives familiales).
- La Dépêche (Toulouse), 27 juin 1914, p. 4.
- Combes, P., étude familiale (arbres généalogiques), 2020, p. 106 (archives familiales).
- L'Express du Midi (Toulouse), 23 décembre 1926, p. 5 (faire-part de décès d'Émile Crouzet).
- Le Télégramme (Toulouse), 31 mars 1911, p. 4.
