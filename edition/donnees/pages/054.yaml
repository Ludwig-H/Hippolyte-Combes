critique: Le récit occupe le haut de la page ; les comptes, séparés par un long filet, sont rejetés au bas après un grand blanc, et le montant des cartes postales n'a pas été porté.
historique: |
  Parti d'Orsay vers 20~h (voir f.~27 r\textsuperscript{o}), Hippolyte Combes arrive en onze heures et demie, durée normale par Limoges et Montauban (Baedeker 1912, R.~39). Son appartement est rue de Languedoc, au n\textsuperscript{o}~24 (lettre du 25 nov. 1918). Sainte-Marie-des-Champs, à la Côte-Pavée, au terminus du tram parti du Capitole (Baedeker 1912, p.~298), porte le nom de l'ancien noviciat des jésuites (Burnichon 1916, p.~297--298) ; la presse y signale une « villa Sainte-Marie-des-Champs, Côte-Pavée (hors barrière) » (\textit{La Dépêche}, 27 juin 1914, p.~4), où logent probablement les Crouzet. Émile Crouzet (v.~1842--1926), ancien agent de change de Millau, et sa femme, sœur du docteur Gabriel Calmels, sont l'oncle et la tante de Marguerite (PC-2020, p.~106 ; \textit{L'Express du Midi}, 23 déc. 1926, p.~5) ; « les dames Calmels » sont Marguerite (voir f.~1 r\textsuperscript{o}) et sa mère, née Valentine Cartairade. Les Thermes du Languedoc sont au 1~bis de la même rue (\textit{Le Télégramme}, 31 mars 1911, p.~4). Le matin même, à 5~h~45, des compagnies du Bedfordshire Regiment achèvent la prise de Thiepval (OH 1916-II, p.~406--417).
sources:
- Baedeker, K., Le Sud-Ouest de la France, de la Loire à la frontière d'Espagne, Leipzig, Baedeker, 1912, p. 298 et route 39.
- Carte-lettre d'Hippolyte Combes à Marguerite, Paris, 25 novembre 1918 (archives familiales).
- Burnichon, J., La Compagnie de Jésus en France. Histoire d'un siècle, 1814-1914, t. II, Paris, Beauchesne, 1916, p. 297-298.
- La Dépêche (Toulouse), 27 juin 1914, p. 4.
- Combes, P., étude familiale (arbres généalogiques), 2020, p. 106 (archives familiales).
- L'Express du Midi (Toulouse), 23 décembre 1926, p. 5 (faire-part de décès d'Émile Crouzet).
- Le Télégramme (Toulouse), 31 mars 1911, p. 4.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 406-417.
