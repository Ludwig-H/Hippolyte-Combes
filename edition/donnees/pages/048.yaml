date: Samedi 23 septembre 1916
mois: Septembre 1916
lieux: Raincheval, Léalvillers, Acheux-en-Amiénois et Forceville (Somme)
titre: Départ de Raincheval ; contre-ordre près de Léalvillers ; bivouac près de Forceville
transcription: |
  \sl{Sam 23} \hfill \sl{Sept^{bre} /16}
  très belle journée.
  Levé 6^{H} \fr{1}{2} et fait ts préparatifs.
  Vers 7^{H} \fr{1}{2}, cap West venu me dire que départ
  fixé à 9^{H} 30.
  Quitté village heure indiquée
  Temps superbe Soleil ardent
  A peine arrivions-ns vers garage de Lealviller
  que Pizzi, en auto, à notre rencontre \inc{avec} message
  Dû tourner bride et aller attendre champ à
  \inc{coté} refilling point
  Repartis à cheval seul j.à gare d'Acheux
  Cap West vers 2^{H} \fr{1}{2}, m a rejoint et aussitot
  tt Coy filé. –
  \inc{Revenus} route gare \inc{jau} tournant route de
  Forceville
  Cantonnés in the open – champs au flanc
  coteau
  \ind Très b. fin journée.
  Me suis arrangé hutte avec épaisse bache
  verte cme litière — Couché bonne nuit
  \equerre{2}A M^{me} — \inc{propri} d'Acheux. 1 (Cooking
  Carte du Petit Journal : 60 c —
