historique: |
  La compagnie part avec la 54th Brigade, qui monte vers Thiepval : le 7th Bedfordshire quitte Raincheval à 9 h et gagne Varennes à midi par Arquèves, Léalvillers et Acheux ; le QG de brigade est à Hédauville (JMO 7/Bedf, 23 sept. 1916). Le « cap West » est le capitaine E. M. West, commandant de la 152nd Coy (Nichols 1922, p.~110 ; voir f. 21 v\textsuperscript{o}). Le lieutenant Pizzi, qu'Hippolyte Combes louait dans sa lettre du 25 février 1916 comme « l'officier interprète de la 18e division » (en annexe, p.~\pageref{annexe:doc1}), transmet les ordres aux interprètes des unités, sans identité civile établie. Le \textit{refilling point} est le lieu où les camions de la \textit{supply column} remettent vivres et fourrage aux voitures du train (voir f. 33 v\textsuperscript{o}). La gare d'Acheux est le terminus de la voie normale Candas--Acheux ouverte en 1916, tête de ligne des vivres et du matériel du génie (OH 1916-I, p.~273--274). Ce même 23 septembre s'ouvre la préparation d'artillerie de l'attaque de Thiepval (OH 1916-II, p.~393--394) ; la division relève la 49th dans la nuit du 24 au 25 (ibid., p.~394).
