historique: |
  La compagnie suit la 54\textsuperscript{th} Brigade : le 7\textsuperscript{th} Bedfordshire part de Raincheval à 9~h pour Varennes par Arquèves, Léalvillers et Acheux (JMO~7/Bedf, 23~sept. 1916). Le « cap West » est le capitaine E. M. West, commandant de la 152\textsuperscript{nd} Coy (Nichols 1922, p.~110 ; voir f.~21~v\textsuperscript{o}). Le lieutenant Pizzi, « l'officier interprète de la 18\textsuperscript{e} division » selon la lettre du 25~février 1916 (en annexe, p.~\pageref{annexe:doc1}), transmet les ordres aux interprètes des unités ; son identité civile n'est pas établie. La gare d'Acheux est le terminus de la voie normale Candas--Acheux, ouverte en 1916 (OH~\mbox{1916-I}, p.~273--274). Le même jour commence la préparation d'artillerie de l'attaque de Thiepval (OH~\mbox{1916-II}, p.~393--394).
