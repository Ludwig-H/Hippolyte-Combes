critique: Encre noire virée au brun. Le récit occupe la moitié supérieure de la page ; après un blanc d'environ cinq lignes, un filet presque pleine largeur isole les trois lignes de comptes. Le verso du f. 6, entre le 5 et le 6 août, n'a pas été photographié.
historique: |
  Le \textit{refilling point} « sur rive canal \& près d'écluse » est sans doute au bord de la Lys canalisée, dont l'écluse et le barrage de Bac-Saint-Maur sont à 1,6 km de La Croix-du-Bac (CanalPlan ; voir f. 8 v\textsuperscript{o}). En secteur stabilisé, les camions de la \textit{supply column} vont jusque dans la zone de chaque brigade, où l'on place ces points (FSPB 1914, p. 175). Bac-Saint-Maur, hameau de Sailly-sur-la-Lys, est alors la tête de ligne des vivres du secteur (« the Railhead for supplies was Bac St. Maur » : Ellis [1920], pp. 119-120). L'« usine » voisine de l'église est peut-être la linerie que les Britanniques appellent « Edwards's Linen Factory » (CWGC, Trois Arbres Cemetery), ou la « factory » des postes de secours australiens de Fromelles (Bean 1941, p. 437, n.). La nuit suivante, la 54th Brigade relève les Néo-Zélandais devant Armentières (JMO 7/Bedf, 6-7 août 1916). Maurin, sans doute un collègue interprète, reste non identifié. Le lait à 25 c le litre, prix de ferme, vaut la moitié du maximum parisien de février 1917 (March 1925, p. 183).
