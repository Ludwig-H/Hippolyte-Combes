historique: |
  Le \textit{refilling point} « sur rive canal \& près d'écluse » est sans doute au bord de la Lys, près de l'écluse de Bac-Saint-Maur, à 1,6~km de La Croix-du-Bac (CanalPlan ; voir f.~8~v\textsuperscript{o}). En secteur stabilisé, les camions de la \textit{supply column} vont jusque dans la zone de chaque brigade, où l'on place ces points (FSPB 1914, p.~175). Bac-Saint-Maur, hameau de Sailly-sur-la-Lys, est alors la tête de ligne des vivres du secteur (Ellis [1920], p.~119--120). L'« usine » voisine de l'église est peut-être la linerie que les Britanniques appellent « Edwards's Linen Factory » (CWGC, Trois Arbres Cemetery). Maurin, sans doute un autre interprète, n'est pas identifié.
sources:
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 119-120.
- Commonwealth War Graves Commission, Trois Arbres Cemetery, Steenwerck, historique.
- Field Service Pocket Book, 1914, Londres, HMSO, 1914, chap. 6, « Supply », § 7, p. 175.
- CanalPlan AC, « Lys », https://canalplan.co.uk/waterway/zuwi (consulté le 18 oct. 2026).
