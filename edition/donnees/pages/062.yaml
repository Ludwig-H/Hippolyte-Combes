historique: |
  Le passage matinal à la gare est sans doute l'achat du billet pour Orsay, porté dans les comptes du lendemain (voir f.~32~r\textsuperscript{o}). Les Thermes du Languedoc sont dans la rue même de l'appartement, et Sainte-Marie-des-Champs est sans doute la maison des Crouzet (voir f.~27~v\textsuperscript{o}). L'oncle est Émile Crouzet (v.~1842--1926), ancien agent de change à Millau, mari de la tante paternelle de Marguerite, sans doute Élisabeth Calmels (\textit{Le Télégramme}, 24~déc. 1926) : il a alors environ 74~ans. La cour « de G.V. » est celle de la grande vitesse (bagages, messageries).
sources:
- Le Télégramme (Toulouse), 24 déc. 1926, p. 4 (Rosalis, Bibliothèque de Toulouse).
