critique: La dernière phrase se poursuit en tête du f.~32 r\textsuperscript{o}.
historique: |
  Le passage matinal à la gare est sans doute l'achat du billet pour Orsay, porté dans les comptes du lendemain (voir f.~32 r\textsuperscript{o}). Les Thermes du Languedoc, au 1 bis de la rue de Languedoc, sont dans la rue même de l'appartement (\textit{Le Télégramme}, 31 mars 1911, p.~4 ; voir f.~27 v\textsuperscript{o}). Sainte-Marie-des-Champs est la maison des Crouzet (voir f.~27 v\textsuperscript{o}). L'oncle est Émile Crouzet (v. 1842 -- 1926), ancien agent de change à Millau, mari d'Élisabeth Calmels, tante paternelle de Marguerite (\textit{Le Télégramme}, 24 déc. 1926) : il a alors environ 74 ans. La cour « de G.V. » est celle de la grande vitesse (bagages, messageries).
sources:
- Le Télégramme (Toulouse), 31 mars 1911, p. 4 ; 24 déc. 1926, p. 4 (Rosalis, Bibliothèque de Toulouse).
