critique: Encre violette. La l.~15 a été repassée et en partie empâtée, ce qui en rend la lecture incertaine. La dernière phrase se poursuit en tête du f.~32 r\textsuperscript{o} (« Mt \& moi, tres -- […] émus. »).
historique: |
  Le passage matinal à la gare est sans doute celui de l'achat du billet de 3\textsuperscript{e} classe pour Orsay, porté dans les comptes du lendemain (voir f.~32 r\textsuperscript{o}). Les Thermes du Languedoc, au 1 bis de la rue de Languedoc, sont dans la rue même de l'appartement (\textit{Le Télégramme}, 31 mars 1911, p.~4) ; Hippolyte Combes y avait déjà pris un bain le 27 septembre (voir f.~27 v\textsuperscript{o}). Sainte-Marie-des-Champs, maison des Crouzet sur les coteaux de la Côte-Pavée, porte le nom de l'ancien noviciat des jésuites, maison « entourée d'un vaste jardin » (Burnichon 1916, p.~297--298 ; voir f.~27 v\textsuperscript{o}). L'oncle est Émile Crouzet (v. 1842 -- 1926), ancien agent de change à Millau, mari d'Élisabeth Calmels, tante paternelle de Marguerite (\textit{Le Télégramme}, 24 déc. 1926) : son âge, 74 ans environ, explique sans doute le « ménagement ». La gare Matabiau, de la Compagnie du Midi, avait été reconstruite en 1903--1905 sur les plans de Marius Toudoire (Mérimée PA00094527) ; la cour « de G.V. » est celle du service de la grande vitesse (bagages, messageries).
sources:
- Le Télégramme (Toulouse), 31 mars 1911, p. 4 ; 24 déc. 1926, p. 4 (Rosalis, Bibliothèque de Toulouse).
- Burnichon, J., La Compagnie de Jésus en France. Histoire d'un siècle, 1814-1914, t. II, Paris, Beauchesne, 1916, p. 297-298.
- Ministère de la Culture, base Mérimée, notice PA00094527 (gare de Toulouse-Matabiau), consultée via monumentum.fr ; Wikipédia, « Toulouse-Matabiau station », consulté le 18 oct. 2026.
