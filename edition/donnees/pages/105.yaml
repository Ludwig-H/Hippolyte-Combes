critique: Les deux journées se suivent sans filet de séparation. Deux lignes du 2 décembre (« Tout le jour, resté à Acheux » et « vu Cap. H. ») sont d'une encre plus pâle, brunâtre, que le reste de la page.
historique: |
  Franvillers, Buire-sur-l'Ancre, Ribemont et Heilly sont à l'arrière de la Fourth Army (hôpitaux d'évacuation de Heilly et d'Edgehill, près de Buire : OH 1916-II, p.~541) ; la 18th Division cantonnait autour de Ribemont à l'hiver 1915-1916 (Becke 1938, p.~83, n.~14). Toutencourt est depuis le 2 juillet 1916 le QG de la Fifth Army (LLT) ; le capitaine Bresson, de sa Mission française, n'est pas identifié. Le XIII Corps s'est installé à Acheux le 29 novembre, à la place du V Corps parti pour Doullens (LLT) : Combes, « pris en charge » par la Mission de ce corps, y touchera sa solde le 3 décembre (voir f.~53~r\textsuperscript{o}). La « réintégration » redoutée prolonge la rumeur du 22 octobre sur le renvoi des interprètes de la R.A.T. (voir f.~42~r\textsuperscript{o}) ; le régiment d'origine est sans doute le 10\textsuperscript{e} d'artillerie, rejoint le 21 mars 1915 (registre matricule). Le « Cap. H. » est peut-être le capitaine Huguet (voir f.~47~r\textsuperscript{o}). Williams, « 20 ans ! », relève Curtis, qui part le 6 (voir f.~53~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 541.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 83, n. 14.'
- Baker, C., The Long, Long Trail, « The British Fifth or Reserve Army 1916-1918 », « The British V Corps in France and Flanders » et « The British XIII Corps in France and Flanders » (longlongtrail.co.uk, consultés le 18 oct. 2026).
- Archives départementales de la Haute-Garonne, registre matricule du recrutement de Toulouse, classe 1896, n° 911 (Combes, Marie Lucien Hippolyte).
