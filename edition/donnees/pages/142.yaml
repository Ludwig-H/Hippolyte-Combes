date: Dimanche 4 février 1917 (suite)
mois: Février 1917
lieux: Millau (Aveyron)
titre: Après-midi avec Marguerite ; visite aux Layral ; soirée avec Mimi ; cloches du matin
transcription: |
  \sl{Dim. 4 (Suite)} \hfill \sl{Fev. '17}
  plus clair & plus \inc{beau}
  Tout l'après-midi, av M^{te}. Elle m'a
  joué qq morceaux et chanté 1 peu.
  a 6^{h}15, cedant aux instances de tous,
  visite à l'oncle & \inc{tantes} Therèse (Layral)
  \blanc{1}
  Temp très sec. Rue deserte.
  \blanc{1}
  Après diner, prolongé causerie j-à
  11^{h}30 – av Mimi, arrivée train 6^{h} –
  \blanc{1}
  Ds ma chambre, à 11^{h} \inc{40}.
  ciel nuageux. Nuit très froide
  \blanc{2}
  – Ce Matin, en m'eveillant, charmé
  par sonneries cloches, eglises et
  chapelles ville. –
  \droite (Cf. Journal)
  \droite \sl{feuille} speciale)
