historique: |
  L'« oncle » et la « tante Thérèse » sont M\textsuperscript{e} Charles Layral, notaire à Millau, et sa femme Thérèse Cartairade, sœur de Valentine Cartairade, la mère de Marguerite (faire-part de décès d'Émilie Noel, M\textsuperscript{me} Guillaume Cartairade, 1889 ; PC-Annexe). « Mimi » est sans doute Anne-Marie Calmels (1888–1975), sœur aînée de Marguerite, future épouse de l'avoué Joseph Delcamps (PC-Annexe). Le temps sec et la nuit froide sont ceux de la vague de froid de l'hiver 1916-1917 : −15,4~°C à Paris ce 4 février (Barbé 1917, p.~181-182). Le « Journal » sur « feuille spéciale » est un écrit distinct du \textit{Livre-Journal}, comparable aux feuillets détachés des \textit{Feuillets de Route} (en annexe) ; la plupart des autres papiers d'Hippolyte Combes ont été détruits en 1970-1971 (PC-Livre).
sources:
- Faire-part de décès d'Émilie Noel, Mme Guillaume Cartairade, Lisside (Gard), 4 mars 1889 (archives familiales).
- Combes, Pierre, livre familial dactylographié, annexe généalogique (PC-Annexe), archives familiales.
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, nouvelle série, t. 30, 1917, p. 181-182.
- Combes, Pierre, Une étude de la famille Combes de Castelnau-Pégayrols, dactylographie, version du 19 mars 2023 (PC-Livre), archives familiales.
