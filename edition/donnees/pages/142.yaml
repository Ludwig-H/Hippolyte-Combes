critique: 'Encre violette ; les premiers mots achèvent la phrase laissée en suspens au bas du f.~70~v\textsuperscript{o}. Le renvoi au « Journal », rejeté en bas à droite sur deux lignes, est d''un module plus grand et d''une encre plus sombre : ajout probablement postérieur.'
historique: |
  L'« oncle » et la « tante Thérèse » sont M\textsuperscript{e} Charles Layral (« Layrals » dans la tradition familiale), notaire à Millau, et son épouse Thérèse Cartairade, sœur de Valentine Cartairade, mère de Marguerite (faire-part de décès d'Émilie Noel, M\textsuperscript{me} Guillaume Cartairade, 1889 ; PC-Annexe). « Mimi » est sans doute Anne-Marie Calmels (1888–1975), sœur aînée de Marguerite, future épouse de l'avoué Joseph Delcamps (PC-Annexe). Le « Temp très sec » et la « nuit très froide » relèvent de la vague de froid qui, du 16 janvier au 16 février 1917 environ, s'étend jusqu'au littoral méditerranéen, avec −8,3~°C à Toulouse et −15,4~°C à Paris le 4 février (Barbé 1917, p.~181-182) ; la neige couvre encore la ligne des Causses au départ du 5 (f.~71~v\textsuperscript{o}). Les cloches du matin sont celles du dimanche de la Septuagésime (voir f.~70~v\textsuperscript{o}). Le « Journal » sur « feuille spéciale » est un écrit distinct du \textit{Livre-Journal}, à rapprocher des feuillets détachés des \textit{Feuillets de Route} (\textit{« — Journal — | 1915 — | 1916 — | — Nouvelles — »}, en annexe) : la plupart des autres papiers de Combes furent détruits en 1970-1971 (PC-Livre).
sources:
- Faire-part de décès d'Émilie Noel, Mme Guillaume Cartairade, Lisside (Gard), 4 mars 1889 (archives familiales).
- Combes, Pierre, livre familial dactylographié, annexe généalogique (PC-Annexe), archives familiales.
- Combes, Pierre, Une étude de la famille Combes de Castelnau-Pégayrols, dactylographie, version du 19 mars 2023 (PC-Livre), archives familiales.
- Barbé, G., « L'hiver 1916-1917 », Journal d'agriculture pratique, nouvelle série, t. 30, 1917, p. 181-182.
