critique: Encre violette. La notice du 27 s'arrête au tiers supérieur de la page ; un blanc d'environ trois lignes la sépare de celle du 28, ouverte par un filet en escalier.
historique: |
  Toutencourt, à moins de 5~km à l'est d'Hérissart, abrite encore le QG de la Fifth Army et sa Mission française (voir f.~52 v\textsuperscript{o} et f.~73 v\textsuperscript{o}). Les champs « couverts de réseaux de \textit{barbed wire} \& creusés de tranchées » sont peut-être les terrains d'exercice où, avant le 1er juillet 1916, les tranchées ennemies avaient été réellement creusées, au grand dépit des cultivateurs (OH 1916-I, p.~262, n.~1) ; il peut aussi s'agir de lignes de défense arrière. Les « régiments de cavalerie indienne » appartiennent sans doute à la 4th ou à la 5th Cavalry Division, anciennes 1st et 2nd Indian Cavalry Divisions renommées en novembre 1916 (LLT) ; le Cavalry Corps avait hiverné près de la côte, entre la Canche et la Bresle, pour économiser le transport du fourrage (OH 1917-I, p.~64), et ces divisions suivront le repli allemand à partir du 14 mars (LLT). La part de mess, 33~francs pour les vingt et un jours passés à Hérissart depuis le 8, revient à 1,57~F par jour, contre 79~F~10 pour janvier (f.~63 v\textsuperscript{o}).
sources:
- 'Edmonds, J. E. (comp.), Military Operations, France and Belgium, 1916, vol. I, Sir Douglas Haig''s Command to the 1st July : Battle of the Somme, Londres, Macmillan, 1932, p. 262, n. 1.'
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 64.
- The Long, Long Trail (C. Baker), « 1st Indian Cavalry Division (later 4th Cavalry Division) », copie Wayback du 8 mai 2023, et « 2nd Indian Cavalry Division (later 5th Cavalry Division) », consulté le 18 oct. 2026.
