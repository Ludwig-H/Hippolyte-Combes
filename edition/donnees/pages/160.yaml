historique: |
  Toutencourt, à moins de 5~km à l'est d'Hérissart, abrite le QG de la Fifth Army (voir f.~52~v\textsuperscript{o}). Les champs de \textit{barbed wire} et de tranchées sont peut-être des terrains d'exercice de 1916, où l'on avait copié les tranchées ennemies (OH~\mbox{1916-I}, p.~262, n.~1), ou des lignes de défense arrière. La cavalerie indienne est sans doute celle de la 4\textsuperscript{th} ou de la 5\textsuperscript{th} Cavalry Division, anciennes 1\textsuperscript{st} et 2\textsuperscript{nd} Indian Cavalry Divisions (LLT). Le Cavalry Corps avait hiverné près de la côte, entre la Canche et la Bresle (OH~\mbox{1917-I}, p.~64). La part de mess, 33~francs pour les vingt et un jours passés à Hérissart depuis le 8, fait 1,57~F par jour, contre 79~F~10 pour janvier (f.~63~v\textsuperscript{o}).
sources:
- 'Edmonds, J. E. (comp.), Military Operations, France and Belgium, 1916, vol. I, Sir Douglas Haig''s Command to the 1st July : Battle of the Somme, Londres, Macmillan, 1932, p. 262, n. 1.'
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 64.
- The Long, Long Trail (C. Baker), « 1st Indian Cavalry Division (later 4th Cavalry Division) », copie Wayback du 8 mai 2023, et « 2nd Indian Cavalry Division (later 5th Cavalry Division) », consulté le 18 oct. 2026.
