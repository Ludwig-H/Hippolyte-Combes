historique: |
  Haig note lui aussi que la longue période de gel « avait gelé le sol à grande profondeur », jusqu'au dégel de la troisième semaine de février (Haig, \textit{Despatches}, p.~69--70). Rubempré (Somme) est à 2,5~km environ à l'ouest-sud-ouest d'Hérissart. Hippolyte Combes en connaissait déjà les fermes, visitées pour les achats de paille (voir f.~61~r\textsuperscript{o}). Le secteur sert alors de zone d'étape aux divisions qui montent vers l'Ancre : le 14~janvier, le 7\textsuperscript{th} Bedfordshire, de la 18\textsuperscript{th} Division, cantonnait encore dans la « Rubempré Area » avant de gagner le front (JMO~7/Bedf, janv. 1917). La pleine lune avait eu lieu le 7~février (iCalendrier).
sources:
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), Londres et Toronto, J. M. Dent & Sons, 1919, p. 69-70 (dépêche du 31 mai 1917).
