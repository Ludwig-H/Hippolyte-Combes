critique: Encre violette uniforme. La page poursuit sans rupture la journée du jeudi 8 commencée au f.~74 r\textsuperscript{o} ; un filet tiré sur toute la largeur la sépare de celle du vendredi 9.
historique: |
  La « Terre durcie j-à gde profondeur » rejoint presque mot pour mot la dépêche de Haig, pour qui la longue période de gel exceptionnel « avait gelé le sol à grande profondeur » jusqu'au dégel de la troisième semaine de février (Haig, \textit{Despatches}, p.~69--70). Rubempré (Somme) est à 2,5~km environ à l'ouest-sud-ouest d'Hérissart, où Combes s'est installé le 7 au soir (voir f.~73 v\textsuperscript{o}) ; il en connaissait déjà les fermes, visitées avec celles de Septenville pour les achats de paille (voir f.~61 r\textsuperscript{o}). Ce secteur de l'Amiénois sert alors de zone d'étape aux divisions qui montent vers l'Ancre : le 14 janvier, le 7th Bedfordshire de la 18th Division y cantonnait encore (« Rubempré Area ») avant de gagner le front (JMO 7/Bedf, janv. 1917). La « pleine lune » de la nuit du 8 au 9 avait eu lieu le 7 février (iCalendrier), et Combes l'avait vue briller à son arrivée à Hérissart (voir f.~73 v\textsuperscript{o}).
sources:
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), Londres et Toronto, J. M. Dent & Sons, 1919, p. 69-70 (dépêche du 31 mai 1917).
