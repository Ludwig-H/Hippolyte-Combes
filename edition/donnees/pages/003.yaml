historique: |
  Les 36~officiers sont arrivés la veille (voir f.~1~r\textsuperscript{o}). Le cantonnement était « une des principales besognes de l'interprète » : un officier, l'interprète et deux caporaux précédaient l'unité ; l'habitant recevait 1~F par nuit et par lit d'officier (Fernand-Laurent 1917, p.~225--234). Le lieutenant Michel et le « château de la brasserie » ne sont pas identifiés. Le même jour, à Wallon-Cappel, Maxse félicite le 7\textsuperscript{th} Bedfordshire de la prise de la Pommiers Redoubt (1\textsuperscript{er}~juillet) (Beds War Diary, 26 juill. 1916). Le départ du 28 est la marche de la 54\textsuperscript{th} Brigade vers Bailleul par Hazebrouck (ibid., 28 juill. 1916 ; voir f.~2~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. 225-234.
- 'Bedfordshire Archives Service (Bedford), X550/8/1/1607 et 1607b : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet 1916 (cité « Beds War Diary »).'
