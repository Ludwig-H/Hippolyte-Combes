critique: Encre violette ; un blanc d'une ligne isole l'annonce du départ du 28, un blanc de deux lignes la sépare du filet des comptes. Dans la ligne des comptes, les libellés et la ponctuation sont à l'encre, les montants ajoutés au crayon dans les blancs laissés à cet effet. Un ou deux mots sont biffés de boucles serrées après « d'off ».
historique: |
  Les 36 chambres sont pour les officiers des Royal Fusiliers arrivés la veille (voir f. 1 r\textsuperscript{o}). Le cantonnement était « une des principales besognes de l'interprète » : un officier, l'interprète et deux caporaux précédaient l'unité, et l'habitant recevait 1 F par nuit et par lit d'officier, selon le « Décret de 1877 » (Fernand-Laurent 1917, p. 225-234). Le lieutenant Michel n'est pas identifié. Lynde avait déjà logé, début juillet, l'état-major de l'artillerie de la 5th Australian Division (Ellis [1920], p. 66-67). Le même jour, à Wallon-Cappel, Maxse félicite le 7th Bedfordshire de la prise de la Pommiers Redoubt, le 1\textsuperscript{er} juillet (Beds War Diary, 26 juill. 1916). Le « changem de cantonnement » du 28 est la marche de la 54th Brigade vers Bailleul par Hazebrouck (ibid., 28 juill. 1916 ; voir f. 2 v\textsuperscript{o}). Le « château de la brasserie » n'est pas identifié. Le \textit{Washing} reparaît jusqu'à la dernière page (f. 93 r\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, préface de François de Tessan, Paris, Boivin, 1917, p. 225-234.
- Ellis, A. D., The Story of the Fifth Australian Division, Londres, Hodder & Stoughton, [1920], p. 66-67.
- 'Bedfordshire Archives Service (Bedford), X550/8/1/1607 et 1607b : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet 1916 (cité « Beds War Diary »).'
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg-Londres, Blackwood, 1922, p. 109.
