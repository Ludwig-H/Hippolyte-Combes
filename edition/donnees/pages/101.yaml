date: Lundi 20 et mardi 21 novembre 1916
mois: Novembre 1916
lieux: Acheux-en-Amiénois, Bouzincourt, Contay ? et Englebelmer (Somme)
titre: Boue et convois à Acheux ; nuit noire à Englebelmer ; remarque blessante de Curtis
transcription: |
  \sl{20 Lundi –} \hfill \sl{Nov – /16}
  \ind Auj-dhui, comme hier, ciel nuageux. Fines
  ondées, matin & soir
  Rues & routes etat lamentable, couvertes
  de boue glissante & épaisse.
  \ind Ts les jours, passe des heures à regarder rue –
  debout devant fenêtre chambre ou assis s/ lit à cote
  Mouvement inouï. Lorries, wagons, cars etc etc
  Et défilé incessant de troupes revenant de l'avant –
  ou des tranchées –
  \ind Souvent aussi, cortèges de prisonniers allemands
  Après-midi, longue course en auto : Bouzincourt
  au retour, arrêt à \inc{Contay}. Nuit noire. Cherché refuge
  à Englebelmer. Dû lattendre ds obscurité profonde : le long
  hauts murs du château. Boue épaisse . – –
  \ind Au retour, ciel merv.^{t} étoilé ! . . Nuit noire
  [ — Cartes ples d'Acheux : 45c . — Timbres : \inc{2 f} \add{Carnet \inc{60}}
  \filet
  \sl{21 Ma –} Épais brouillard matin & soir
  \fr{1}{2} jour, soleil brillé 1 peu
  Routes etat lamentable. Couche profonde
  de boue liquide. Humidité pénétrante
  \ind Matin, libre. Après-midi, s/ lorry
  à \inc{Lealvillers}. Au retour, office, remarque
  +tot desobligeante de Curtis : fâché
  contre lui. –
