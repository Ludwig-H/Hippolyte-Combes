historique: |
  Les prisonniers viennent de la bataille de l'Ancre (13--18~novembre ; voir f.~49~r\textsuperscript{o}). Les troupes reviennent après les relèves : la 37\textsuperscript{th} Division remplace la 63\textsuperscript{rd} dès le 14 au soir, la 32\textsuperscript{nd} la 51\textsuperscript{st} le 17 (OH~\mbox{1916-II}, p.~507, 513). Bouzincourt, à 7,5~km au sud-est d'Acheux, et Englebelmer, à 5,5~km à l'est, sont des postes d'ambulances (CWGC). Englebelmer est sur la route Contay--Hédauville--Martinsart, presque la seule utilisable de jour comme de nuit près du front (OH~\mbox{1916-I}, p.~271) ; il sera bientôt presque vide d'habitants (voir f.~54~r\textsuperscript{o}). Contay, gare de munitions et siège de deux hôpitaux d'évacuation (OH~\mbox{1916-I}, p.~273--274 ; CWGC), imposerait un détour de 8~km au sud-ouest : la lecture reste douteuse. Le lieutenant Curtis sera remplacé le 2~décembre par le capitaine Williams (voir f.~52~v\textsuperscript{o}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 507, 513.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 271, 273-274.
- Commonwealth War Graves Commission, notices historiques « Bouzincourt Communal Cemetery Extension », « Englebelmer Communal Cemetery Extension » et « Contay British Cemetery » (cwgc.org).
