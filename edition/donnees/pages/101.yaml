critique: Encre noire. Dans la phrase sur les troupes revenant de l'avant, « ou » est rejeté en marge et « des tranchées » écrit après un large blanc ; le relevé de dépenses du 20, ouvert par un crochet, n'est pas refermé.
historique: |
  Les « cortèges de prisonniers allemands » sont ceux de la bataille de l'Ancre (13--18 novembre), qui en a fait « plus de 7 200, dont 149 officiers » (Haig 1919, p.~51) ; le « défilé incessant de troupes revenant de l'avant » répond aux relèves qui la suivent : la 63rd Division est relevée par la 37th à partir du 14 au soir, la 51st par la 32nd le 17 (OH 1916-II, p.~507, 513). Bouzincourt, à 7,5~km au sud-est, est alors un poste d'ambulances (CWGC). Englebelmer, à 5,5~km à l'est, est sur la route Contay--Hédauville--Englebelmer--Martinsart, presque la seule utilisable de jour comme de nuit près du front (OH 1916-I, p.~271) ; poste d'ambulances encore exposé aux obus à l'automne 1916 (CWGC), il est bientôt presque vide d'habitants (voir f.~54~r\textsuperscript{o}). Contay, gare de munitions et siège de deux hôpitaux d'évacuation (OH 1916-I, p.~273--274 ; CWGC), imposerait un détour de 8~km au sud-ouest : la lecture reste douteuse. Le lieutenant Curtis, jugé très durement dès l'été, sera remplacé le 2 décembre par le capitaine Williams (voir f.~52~v\textsuperscript{o}).
sources:
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), London, Dent, 1919, p. 51.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 507, 513.
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 271, 273-274.
- Commonwealth War Graves Commission, notices historiques « Bouzincourt Communal Cemetery Extension », « Englebelmer Communal Cemetery Extension » et « Contay British Cemetery » (cwgc.org).
