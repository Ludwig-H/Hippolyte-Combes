historique: |
  Méaulte, au sud immédiat d'Albert, tenu par les Britanniques depuis 1915, garde les trois quarts de ses habitants (CWGC). En février 1916, menacés d'évacuation, ceux-ci avaient adressé une supplique à George V, peut-être à l'instigation d'un interprète de la 18th Division (Nichols 1922, p.~31). La minoterie n'est pas identifiée. Le retour suit la basse Ancre : Méricourt-l'Abbé était tête de ligne pour les vivres et le génie le 1er juillet 1916 (OH 1916-I, p.~274). C'est le pays de la division à l'automne et à l'hiver 1915--1916 (QG à Heilly dès le 19 août 1915 : Nichols 1922, p.~15--16 ; revue royale et présidentielle du 25 octobre 1915 au nord de Ribemont-sur-Ancre : Nichols 1922, p.~22, et \textit{Feuillets de Route}, chap.~\textsc{ix} ; Ribemont en février 1916 : Becke 1938, p.~83, n.~14), où Combes servait depuis août 1915 (lettre du 25 févr. 1916) et où il conçut ses \textit{Feuillets de Route} devant une « exist\textsuperscript{ce} ent\textsuperscript{t} monotone » en hiver, afin qu'il restât quelque chose « de ces heures vides » (en annexe, chap.~\textsc{i} et \textsc{xii}). À Hérissart, siège du \textit{Purchase Board} depuis le 7 février (voir f.~73 v\textsuperscript{o}), le dégel est passager : le gel nocturne reprend jusqu'au 16 (voir f.~77 v\textsuperscript{o} ; OH 1917-I, p.~76). Les cinq vues d'Amiens, à 50 c pièce, coûtent le prix des cinq gravures de la cathédrale achetées le 3 janvier (voir f.~59 v\textsuperscript{o}), cinq à dix fois une carte postale.
