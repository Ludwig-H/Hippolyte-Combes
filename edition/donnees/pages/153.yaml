historique: |
  Méaulte, au sud d'Albert, garde les trois quarts de ses habitants (CWGC) ; la minoterie n'est pas identifiée. La basse Ancre est le pays de la 18th Division à l'automne et à l'hiver 1915--1916 (QG à Heilly dès le 19 août 1915 : Nichols 1922, p.~15--16 ; Ribemont en février 1916 : Becke 1938, p.~83, n.~14). Combes y servait depuis août 1915 (lettre du 25 févr. 1916) ; il y conçut ses \textit{Feuillets de Route} (en annexe, chap.~\textsc{i} et \textsc{xii}). À Hérissart, siège du \textit{Purchase Board} depuis le 7 février (voir f.~73 v\textsuperscript{o}), le dégel est passager (voir f.~77 v\textsuperscript{o}). Les cinq vues d'Amiens, à 50 c pièce, ont le prix des cinq gravures de la cathédrale achetées le 3 janvier (voir f.~59 v\textsuperscript{o}).
