historique: |
  La ferme de Belle-Église, hameau d'Arquèves, ancienne tête de ligne de ravitaillement (voir f.~53~r\textsuperscript{o}), est tenue par une fermière belge ; « M. Houtteman » y est noté en mars 1917 (voir f.~85~v\textsuperscript{o}). Englebelmer, sur la route Hédauville--Martinsart (voir f.~50~v\textsuperscript{o}), est un poste d'ambulances dont l'extension du cimetière communal, ouverte en octobre 1916, sera fermée en mars 1917 (CWGC) ; ses habitants évacués se réuniront le 13 décembre à la mairie de Toutencourt avec le major Levy (voir f.~55~r\textsuperscript{o}). Le \textit{Town Major} est l'officier chargé des cantonnements du village (voir f.~45~v\textsuperscript{o}) ; le sens de la \textit{Daily Mail} logée dans la même ferme n'est pas éclairci. Le battage commencé le 8 à Arquèves est l'ouvrage propre du \textit{purchase board} d'armée, qui « administers a number of baling and threshing machines » et vise une réserve de quelque 3~000 tonnes de paille pressée (Puckle 1917, p.~28). Un contrat de battage suivra le 26 décembre (voir f.~57~v\textsuperscript{o}).
sources:
- Commonwealth War Graves Commission, notice historique « Englebelmer Communal Cemetery Extension » (cwgc.org).
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
