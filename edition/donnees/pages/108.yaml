historique: |
  La ferme de Belle-Église (voir f.~53~r\textsuperscript{o}) est tenue par une fermière belge ; un « M. Houtteman » y est noté en mars 1917 (voir f.~85~v\textsuperscript{o}). Englebelmer, sur la route Hédauville--Martinsart (voir f.~50~v\textsuperscript{o}), est un poste d'ambulances (CWGC, Englebelmer Communal Cemetery Extension) ; ses habitants évacués se réuniront le 13 décembre à Toutencourt (voir f.~55~r\textsuperscript{o}). Le battage d'Arquèves relève du \textit{purchase board} de l'armée, qui vise une réserve d'environ 3~000 tonnes de paille pressée (Puckle 1917, p.~28) ; un contrat de battage suivra le 26 décembre (voir f.~57~v\textsuperscript{o}).
sources:
- Commonwealth War Graves Commission, notice historique « Englebelmer Communal Cemetery Extension » (cwgc.org).
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 28.
