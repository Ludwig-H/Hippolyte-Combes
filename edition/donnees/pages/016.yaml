historique: |
  À Sailly-sur-la-Lys, à 2,5~km de La Croix-du-Bac, l'église « was burnt during the open fighting of October 1914 » (CWGC, Sailly-sur-la-Lys Churchyard). L'écluse est sans doute celle de Bac-Saint-Maur (voir f.~7~r\textsuperscript{o}). L'éclusier et lui parlent sans doute du général Ivor Maxse, qui commande la 18\textsuperscript{th} Division jusqu'au 15~janvier 1917 (Becke 1938, p.~79) et avait inspecté le 7\textsuperscript{th} Bedfordshire le 26~juillet (voir f.~1~v\textsuperscript{o}). « Les Australiens » sont ceux de la 5\textsuperscript{th} Australian Division, très éprouvée à Fromelles les 19--20~juillet (5~533 pertes : Miles 1938, p.~133, n. 2) ; une de ses brigades cantonne à Sailly, avec un « Empire Theatre » (Ellis [1920], p. 75, 117, 120--121).
sources:
- CWGC, Sailly-sur-la-Lys Churchyard, historique du cimetière (fiche 18800), https://www.cwgc.org/visit-us/find-cemeteries-memorials/cemetery-details/18800/.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 79.'
- Miles, Wilfrid (comp.), Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 133, n. 2.
- Ellis, A. D., The Story of the Fifth Australian Division, London, Hodder & Stoughton, [1920], pp. 75, 117, 120-121.
