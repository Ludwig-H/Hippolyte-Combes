critique: Encre brune, plusieurs mots repassés à l'encre noire épaisse ; la correction au crayon de la l.~7 est peut-être postérieure. La mention « Les Australiens », isolée en retrait au bas de l'entrée, précède le filet et la ligne de comptes.
historique: |
  À Sailly-sur-la-Lys, à 2,5 km de La Croix-du-Bac (R5, F61), l'église « was burnt during the open fighting of October 1914 », le village restant ensuite « comparatively untouched » jusqu'au 9 avril 1918 (CWGC, Sailly-sur-la-Lys Churchyard) ; Hippolyte Combes attribue l'incendie aux « Boches ». L'écluse est sans doute celle de Bac-Saint-Maur, en aval de Sailly (aujourd'hui écluse et barrage n\textsuperscript{o} 5 : Canalplan), près de laquelle se tenait le \textit{refilling point} (voir f. 7 r\textsuperscript{o}). « Causé … de notre genl en chef, Maxse » vaut sans doute « parlé de » : le Major-General Ivor Maxse commande la division jusqu'au 15 janvier 1917 (Becke 1938, p. 79) et avait inspecté la brigade le 26 juillet (voir f. 1 v\textsuperscript{o}). « Les Australiens » sont ceux de la 5th Australian Division, saignée à Fromelles les 19-20 juillet (5 533 pertes : Miles 1938, p. 133, n. 2) restée en ligne jusqu'à la mi-octobre ; l'une de ses brigades cantonne à Sailly et y a son école de grenadiers et son « Empire Theatre » (Ellis [1920], p. 75, 117, 120-121).
