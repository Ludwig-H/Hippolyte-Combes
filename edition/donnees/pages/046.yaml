date: Jeudi 21 septembre 1916
mois: Septembre 1916
lieux: Raincheval et Acheux-en-Amiénois (Somme)
titre: Accalmie après des jours d'averses ; solde touchée au bureau de la Mission à Acheux
transcription: |
  21 \sl{J.} \hfill \sl{Sept^{bre} /16}
  \ind[2] Ts ces derniers jours, averses continuelles.
  Routes boueuses transformées en ornières
  \ind Enfin, \inc{ce} matin, malgré temps
  menaçant, pluie pas tombée.
  \ind Après-midi, ciel tjs nuageux – mais
  soleil brille un peu \trait
  \ind Venu à cheval à Acheux – bureau
  mission fr, hutte s/ la pelouse chateau
  A 4^{H} \fr{1}{2}, retour – et sans \inc{avoir} été mouillé
  \blanc{3}
  \ind Fin journée, assez belle \trait
  \blanc{4}
  \filet
  \ind A Acheux : solde : 78.75 c
  \ind[2] — Cartes ples : 0.25 c.
