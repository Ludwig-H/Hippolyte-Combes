critique: Encre violette. La note sur la fin de journée est isolée entre deux blancs ; les comptes sont rejetés au pied de la page, sous un filet tiré sur toute la largeur.
historique: |
  Les averses des jours précédents (voir f. 23 r\textsuperscript{o} ; « Wet morning » le 18 au journal du 7th Bedfordshire : JMO 7/Bedf, 18 sept. 1916) tombent sur un réseau que l'histoire officielle juge « peu nombreux et médiocre » pour une zone où il fallait loger plus de 400 000 hommes et 100 000 chevaux (OH 1916-I, p.~271) : d'où les ornières des chemins entre Raincheval et Acheux. Acheux-en-Amiénois (Somme) abrite encore le QG de la 18th Division, qui ne passera à Hédauville que le 25 septembre (Nichols 1922, p.~79) ; le bureau divisionnaire de la Mission française y occupe, dans le parc du château, la « maisonnette toile \& planches » déjà vue le 14 (f. 22 r\textsuperscript{o}). Les 78~F~75 sont la paie de quinzaine (« Solde \& indemnité de fonctions »), du même montant que celle du 5 septembre à Roëllecourt (f. 18 v\textsuperscript{o}) : 15 jours à 5~F~25. Le même jour, la division reprend du génie de la 49th Division les tranchées au sud de Thiepval, qu'elle attaquera le 26 (Nichols 1922, p.~79).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 271.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 79.
