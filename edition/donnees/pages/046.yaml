historique: |
  L'histoire officielle juge le réseau routier de la zone « peu nombreux et médiocre » pour plus de 400 000~hommes et 100 000 chevaux (OH~\mbox{1916-I}, p.~271) : d'où les ornières entre Raincheval et Acheux. À Acheux, le bureau divisionnaire de la Mission française occupe la hutte du parc du château déjà vue le 14 (voir f.~22~r\textsuperscript{o}). Les 78~F~75 sont la solde de quinzaine, du même montant que le 5~septembre à Roëllecourt (voir f.~18~v\textsuperscript{o}) : 15~jours à 5~F~25. Le même jour, la 18\textsuperscript{th} Division reprend du génie de la 49\textsuperscript{th} Division les tranchées au sud de Thiepval, qu'elle attaquera le 26 (Nichols 1922, p.~79).
sources:
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 271.
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 79.
