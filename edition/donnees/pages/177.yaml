critique: Encre violette homogène ; quelques taches brunes, sans perte de texte. La journée du 7 s'achève sur « Admiré paysage », dont le délié se prolonge en trait, au-dessus d'un bas de page resté blanc.
historique: |
  Ce Vendredi saint, 6 avril 1917, les États-Unis déclarent la guerre à l'Allemagne (OH 1916-II, p.~531, n.~4). Toutencourt, QG de Gough depuis le 2 juillet 1916, est « si tranquille » parce que le quartier général de la Fifth Army s'est transporté à Albert le 28 mars (LLT) ; le bureau de la Mission française auprès de cette armée l'a suivi et envoie l'un des siens payer les interprètes restés à l'arrière. Les 78 f 75 sont le montant le plus fréquent des paiements du carnet, sans doute une quinzaine de quinze jours à 5 f 25 (voir f.~2 r\textsuperscript{o}). M. Wentworth, nommé « Lt » les 17 et 18 mars (f.~84 v\textsuperscript{o}--85 r\textsuperscript{o}), est sans doute l'officier australien arrivé le 6 mars pour remplacer le capitaine Williams (f.~81 r\textsuperscript{o}--v\textsuperscript{o}) ; deux officiers de l'A.I.F. conviennent sans qu'on puisse choisir : Henry Coates Wentworth, du train de la 2nd Australian Division, et Fitzwilliam Wentworth, éleveur du Queensland rattaché au 26th Battalion (\textit{AIF Project}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 531, n. 4.
- The Long, Long Trail (C. Baker), « The British Fifth or Reserve Army 1916-1918 », copie Wayback du 23 juil. 2024.
- UNSW Canberra, The AIF Project, notices Henry Coates Wentworth (pid 318876) et Fitzwilliam Wentworth (pid 318872, 318873).
