historique: |
  Ce jour, les États-Unis déclarent la guerre à l'Allemagne (OH~\mbox{1916-II}, p.~531, n.~4). Toutencourt est calme : le QG de la Fifth Army, là depuis le 2~juillet 1916, est parti pour Albert le 28~mars (LLT). Les 78,75~F, solde la plus fréquente, font sans doute quinze jours à 5,25~F (voir f.~2~r\textsuperscript{o}). M. Wentworth, « Lt » les 17 et 18~mars (f.~84~v\textsuperscript{o}--85~r\textsuperscript{o}), serait l'officier australien venu le 6~mars remplacer le capitaine Williams (f.~81~r\textsuperscript{o}--v\textsuperscript{o}). Ce pourrait être Henry Coates Wentworth, du train de la 2\textsuperscript{nd} Australian Division ; Fitzwilliam Wentworth, autre officier de l'A.I.F., semble alors en Australie, d'où il embarque le 14~juin 1917 (\textit{AIF Project}).
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 531, n. 4.
- The Long, Long Trail (C. Baker), « The British Fifth or Reserve Army 1916-1918 », copie Wayback du 23 juil. 2024.
- UNSW Canberra, The AIF Project, notices Henry Coates Wentworth (pid 318876) et Fitzwilliam Wentworth (pid 318872, 318873).
