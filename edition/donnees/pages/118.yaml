critique: Encre noire virée au brun, homogène, y compris le petit « par » inséré après coup entre « fatigué » et « Plusieurs ». Les deux journées ne sont séparées que par un blanc ; les comptes, sous un grand crochet, réunissent des achats des deux jours.
historique: |
  La douceur concorde avec l'histoire officielle : le temps s'améliore au début de janvier et le gel ne s'installe que le 14 (OH 1917-I, p.~66). La course de l'après-midi, par Authie (voir f.~54~v\textsuperscript{o}) et Pas-en-Artois, gagne Saulty, sur la grande route de Doullens à Arras, à l'arrière du front de la Third Army (Miles 1938, p.~543, n.~3). Le logeur-tailleur Carluvant [?] (f.~47~r\textsuperscript{o}, 51~r\textsuperscript{o}) n'est sans doute que locataire ; Combes loge encore chez lui le 7 février, quand il part pour Hérissart (f.~73~r\textsuperscript{o}). La ferme Cuisinier de Louvencourt est celle de la « gaffe » de Williams (f.~56~v\textsuperscript{o}) ; l'« expertise » prépare peut-être une indemnité. Pour Belle-Église et le Quesnoy, voir f.~53~r\textsuperscript{o}, 58~r\textsuperscript{o}. La poudre phéniquée de Calvert, de Manchester, eut vers 1906 « the largest sale of any dentifrice in the world » (Grace's Guide). Les « nails on » du 2 janvier suivent de trois jours les clous posés aux bottes (f.~58~v\textsuperscript{o}).
