historique: |
  Le temps s'améliore au début de janvier ; le gel ne s'installe que le 14 (OH~\mbox{1917-I}, p.~66). Saulty est sur la route de Doullens à Arras, à l'arrière de la Third Army (Miles 1938, p.~543, n.~3). Le logeur Carluvant [?] (ff.~47~r\textsuperscript{o}, 51~r\textsuperscript{o}) n'est sans doute que locataire : Hippolyte Combes loge encore chez lui le 7~février (f.~73~r\textsuperscript{o}). La ferme Cuisinier de Louvencourt est celle de la « gaffe » de Williams (f.~56~v\textsuperscript{o}) ; l'expertise prépare peut-être une indemnité. Pour Belle-Église et le Quesnoy, voir ff.~53~r\textsuperscript{o}, 55~v\textsuperscript{o}. La poudre Calvert, de Manchester, avait vers 1906 « the largest sale of any dentifrice in the world » (Grace's Guide).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 543, n. 3.
- Grace's Guide to British Industrial History, « F. C. Calvert and Co » (gracesguide.co.uk).
