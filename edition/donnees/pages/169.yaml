historique: |
  Le 16 mars est le premier « jour de marche » du repli allemand sur la ligne Hindenburg (OH 1917-I, p.~110--115) ; le 17, la 8th Australian Brigade entre dans Bapaume (p.~131--132). Combes revoit Albert, quittée le 2 novembre 1916 (voir f.~45~v\textsuperscript{o}) ; les Australiens qui y cantonnent relèvent du I Anzac Corps (p.~74). Ribemont-sur-Ancre : voir f.~52~v\textsuperscript{o} et 76~v\textsuperscript{o}. Les \textit{workshops} sont les ateliers du transport automobile de l'A.S.C. (Puckle 1917, p.~19--21) ; l'auto y est le 18 (voir f.~85~r\textsuperscript{o}). Le lieutenant Wentworth est peut-être l'officier australien arrivé le 6 mars (voir f.~81~v\textsuperscript{o}). La cavalerie « indigène » est indienne, peut-être de la Lucknow Cavalry Brigade, qui monte à Albert le 17 (OH 1917-I, p.~138). Les cartes « à soie » sont sans doute des cartes postales brodées.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 74, 110-115, 131-132, 138.
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 19-21.
