critique: Encre violette ; « Albert » et la fin de « workshops » sont repassés d'une encre plus vive. Rousseurs dans le haut de la page.
historique: |
  Le 16 mars est le premier « jour de marche » du repli allemand sur la ligne Hindenburg (plan \textit{Alberich} : OH 1917-I, p.~110--115) ; le 17, la 8th Australian Brigade entre dans Bapaume encore en feu (p.~131--132). Hippolyte Combes revoit Albert, quittée au début de novembre 1916 (voir f.~39~v\textsuperscript{o}) ; les Australiens qui y cantonnent relèvent du I Anzac Corps, passé à la Fifth Army le 15 février (p.~74). Ribemont-sur-Ancre appartient au pays où cantonnait la division à l'hiver 1915--1916 (Becke 1938, p.~83, n.~14), déjà revu le 1\textsuperscript{er} décembre et le 12 février (voir f.~52~v\textsuperscript{o} et 76~v\textsuperscript{o}). Les \textit{workshops} sont les ateliers du transport automobile de l'A.S.C. (Puckle 1917, p.~19--21) ; l'auto y est encore le 18 (f.~85~r\textsuperscript{o}). Le lieutenant Wentworth est sans doute l'officier australien arrivé le 6 mars (voir f.~81~v\textsuperscript{o}). La cavalerie « indigène » est indienne : le 17, la Lucknow Cavalry Brigade monte à Albert (OH 1917-I, p.~138), et les escadrons vus à Hérissart en sont peut-être. Les cartes « à soie » sont sans doute des cartes postales brodées.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 74, 110-115, 131-132, 138.
- 'Becke, A. F., Order of Battle of Divisions, Part 3A : New Army Divisions (9-26), London, HMSO, 1938, p. 83, n. 14.'
- Puckle, F. K., The Army Service Corps of the British Army and the Organization of the Transport and Transportation at the Front in France, Washington, Government Printing Office, 1917, p. 19-21.
