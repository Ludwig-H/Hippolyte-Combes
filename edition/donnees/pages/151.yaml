critique: Encre violette. Un blanc d'environ deux lignes précède le dimanche 11, dont la journée est reprise sous une nouvelle date en tête du f.~76 r\textsuperscript{o} ; tache d'encre au bas de la page.
historique: |
  « Mon ancienne Cy », la 152nd Company, quittée le 2 novembre, campe sur la route d'Aveluy, à l'arrière du secteur que la 18th Division tient au sud de l'Ancre depuis le 16 janvier (Nichols 1922, p.~139 ; OH 1917-I, p.~69). Le 17 février, dans la boue du dégel commencé la veille, elle attaquera à Boom Ravine et y perdra 54 officiers et 1~135 hommes (OH 1917-I, p.~75--82). Le lieutenant Bradfield est peut-être Godfrey Edward Bradfield, seul officier de l'A.S.C. de ce nom (TNA, WO 339/44046) ; le capitaine « Lovet » n'est pas identifié. Les « canons de marine » sont sans doute des pièces lourdes rassemblées pour ces opérations. Le \textit{refilling point} est le lieu où les sections du train rechargent sur les colonnes de ravitaillement (FSPB 1914). Senlis-le-Sec abrite depuis le 21 janvier 1917 le QG du II Corps (LLT), dont relève la division, et la Mission française de ce corps ; le capitaine de Casteljau, dont la lecture est sûre, n'est pas identifié.
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg et Londres, W. Blackwood & Sons, 1922, p. 139.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 69, 75-82.
- 'The National Archives (Kew), WO 339/44046 : dossier d''officier du Lieutenant G. E. Bradfield, Royal Army Service Corps (notice du catalogue).'
- General Staff, War Office, Field Service Pocket Book, Londres, HMSO, 1914, « Definitions ».
- The Long, Long Trail (C. Baker), « The British II Corps in France and Flanders », copie Wayback du 6 nov. 2024.
