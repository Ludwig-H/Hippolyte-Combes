critique: La journée du dimanche 11, commencée ici, est reprise sous la même date au f.~76~r\textsuperscript{o}.
historique: |
  « Mon ancienne Cy », la 152\textsuperscript{nd} Company, quittée le 2~novembre, campe sur la route d'Aveluy, à l'arrière du secteur que la 18\textsuperscript{th} Division tient au sud de l'Ancre depuis le 16~janvier (Nichols 1922, p.~139 ; OH~\mbox{1917-I}, p.~69). Le 17~février, la division attaquera à Boom Ravine (OH~\mbox{1917-I}, p.~75--82). Le lieutenant Bradfield est peut-être Godfrey Edward Bradfield, de l'A.S.C. (TNA, WO 339/44046) ; le capitaine « Lovet » n'est pas identifié. Senlis-le-Sec abrite depuis le 21~janvier 1917 le QG du II~Corps, dont relève la division, et sa Mission française (LLT) ; le capitaine de Casteljau n'est pas identifié.
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Édimbourg et Londres, W. Blackwood & Sons, 1922, p. 139.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 69, 75-82.
- 'The National Archives (Kew), WO 339/44046 : dossier d''officier du Lieutenant G. E. Bradfield, Royal Army Service Corps (notice du catalogue).'
- The Long, Long Trail (C. Baker), « The British II Corps in France and Flanders », copie Wayback du 6 nov. 2024.
