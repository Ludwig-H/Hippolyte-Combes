historique: |
  Le « cap. West » est le capitaine Edward Maurice West, qui commande la 152\textsuperscript{nd} Company ; il avait invité Hippolyte Combes au mess dès le 9 (voir f.~20~r\textsuperscript{o}). Hippolyte Combes écrit dans ses \textit{Feuillets de Route} (en annexe) : « Si aimables que se montrent les off[iciers] […], on se sent à cent lieues d eux ». Sa quote-part de septembre sera de 29~F (voir f.~34~v\textsuperscript{o}). Le \textit{green forage} est le fourrage vert des chevaux, que l'armée peut requérir contre paiement (\textit{Blackwood's Magazine}, juin 1917, p.~933). Le château de Raincheval, de 1719, est en partie inscrit aux monuments historiques (Mérimée PA00116224).
sources:
- Anonyme (« A Divisional Claims Officer »), « Claims », Blackwood's Magazine, vol. 201, n° 1220, juin 1917, p. 933-941.
- Ministère de la Culture, base Mérimée, notice PA00116224 (Raincheval, château).
