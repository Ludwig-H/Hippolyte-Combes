critique: La mention du fourrage vert du 12, resserrée à droite après « Temps menaçant », chevauche le filet qui sépare les deux journées et a sans doute été ajoutée après coup ; « hauteurs » y est repassé d'une encre plus appuyée. À la l.~22, « Remonté » est d'une encre plus pâle que la suite.
historique: |
  Le « cap. West » est le Captain Edward Maurice West, A.S.C., commandant de la 152nd Company (Nichols 1922, p. 110 ; TNA WO 339/21191), qui avait invité Hippolyte Combes au mess dès le 9 (voir f. 20 r\textsuperscript{o}) et commande encore la compagnie, avec la Military Cross, en 1918 (Nichols 1922, p. 432). L'usage fait de l'interprète d'abord « l'invité du mess », puis souvent son secrétaire (Fernand-Laurent 1917, p. 64-65) ; dans le chapitre premier de ses \textit{Feuillets de Route} (en annexe), Hippolyte Combes note toutefois que, « si aimables que se montrent les off[iciers] », l'interprète se sent souvent « à cent lieues d'eux » dès que cessent le jeu ou la conversation courante, et retrouve dans son « billet (ma chambre) » la lecture des journaux et des revues. L'avantage a un prix : la quote-part de septembre sera de 29 f (voir f. 34 v\textsuperscript{o}), et les « cooking » payés aux logeuses disparaissent des comptes. Le \textit{green forage} est le fourrage vert dont les chevaux britanniques ont besoin et que l'armée peut requérir contre paiement (\textit{Blackwood's Magazine}, juin 1917, p. 933). Le château de Raincheval, de 1719, est inscrit en partie aux monuments historiques (Mérimée PA00116224). Ces deux jours, le 7th Bedfordshire s'exerce à suivre un barrage, à la baïonnette et à la grenade, et ses officiers reconnaissent le terrain devant Thiepval, objectif de la division (JMO 7/Bedf, 12-13 sept. 1916).
