historique: |
  Le « cap. West » est le Captain Edward Maurice West, A.S.C., qui commande la 152nd Company (Nichols 1922, p. 110 ; TNA WO 339/21191) ; il avait invité Hippolyte Combes au mess dès le 9 (voir f. 20 r\textsuperscript{o}). Dans ses \textit{Feuillets de Route} (en annexe), il écrit : « Si aimables que se montrent les off[iciers] […], on se sent à cent lieues d eux ». Sa quote-part de septembre sera de 29 f (voir f. 34 v\textsuperscript{o}). Le \textit{green forage} est le fourrage vert des chevaux, que l'armée peut requérir contre paiement (\textit{Blackwood's Magazine}, juin 1917, p. 933). Le château de Raincheval, de 1719, est en partie inscrit aux monuments historiques (Mérimée PA00116224).
sources:
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh, Blackwood, 1922, p. 110.
- 'The National Archives (Kew), WO 339/21191 : Captain Edward Maurice West, Royal Army Service Corps (notice du catalogue).'
- Anonyme (« A Divisional Claims Officer »), « Claims », Blackwood's Magazine, vol. 201, n° 1220, juin 1917, p. 933-941.
- Ministère de la Culture, base Mérimée, notice PA00116224 (Raincheval, château).
