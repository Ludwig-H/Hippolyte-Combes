critique: Page écrite en travers du carnet, à l'encre violette. Les deux lignes de comptes sont séparées du récit par un blanc et un filet sur toute la largeur ; les comptes de Beauval se poursuivent en tête du f.~38 v\textsuperscript{o}.
historique: |
  L'étape est celle de la 54th Brigade : le 7th Bedfordshire et le 12th Middlesex cantonnent eux aussi à Beauval le 15 octobre (JMO 7/Bedf, 15 oct. 1916 ; Wyrall, p.~319). Bourg de la route de Doullens à Amiens, desservi par la voie métrique Doullens--Albert (OH 1916-I, p.~273), Beauval est un centre de l'arrière britannique : le parc n\textsuperscript{o}~3 d'aviation de l'armée (\textit{No. 3 Army Aircraft Park}) y est installé depuis décembre 1915 (Jones 1928, p.~189) ; la 4th Casualty Clearing Station, hôpital d'évacuation présent depuis juin 1915, en part en octobre 1916 et la 47th la remplace jusqu'en décembre (CWGC ; LLT). Le bourg industriel abrite aussi l'usine textile Saint Frères (Mérimée PA80000086). La chambre « en face de notre mess » coûte 1~f pour la nuit (voir f.~38 v\textsuperscript{o}), le tarif fixé par le décret de 1877 pour le lit d'officier logé chez l'habitant (Fernand-Laurent 1917, p.~225-234). Connelly est le palefrenier (\textit{groom}) chargé du cheval d'Hippolyte Combes, qui lui donne 1 ou 2~f à intervalles de quelques jours à quelques semaines.
