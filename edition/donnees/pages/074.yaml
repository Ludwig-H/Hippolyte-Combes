critique: Page écrite en travers du carnet. Les comptes de Beauval se poursuivent en tête du f.~38~v\textsuperscript{o}.
historique: |
  L'étape est celle de la 54\textsuperscript{th} Brigade : le 7\textsuperscript{th} Bedfordshire et le 12\textsuperscript{th} Middlesex cantonnent aussi à Beauval le 15~octobre (JMO~7/Bedf, 15~oct. 1916 ; Wyrall, p.~319). Beauval, sur la route de Doullens à Amiens, est un centre de l'arrière britannique. Le No.~3 Army Aircraft Park, parc d'aviation, y est installé depuis décembre 1915 (Jones 1928, p.~189). La 4\textsuperscript{th} Casualty Clearing Station, hôpital d'évacuation, en part en octobre 1916 ; la 47\textsuperscript{th} la remplace jusqu'en décembre (CWGC ; LLT). Beauval abrite aussi l'usine textile Saint Frères (Mérimée PA80000086). Connelly est le palefrenier (\textit{groom}) d'Hippolyte Combes, qui lui donne 1 ou 2~F de temps en temps.
