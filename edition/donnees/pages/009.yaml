historique: |
  « Le camp » est sans doute celui de la compagnie (voir f.~3~v\textsuperscript{o}). Le 2~août, les bataillons de la brigade assistent à une démonstration de la « 2\textsuperscript{nd} Army Bomb School » ; le 3, ils reconnaissent les tranchées de la route Armentières–Lille (JMO~7/Bedf, 2--7~août 1916). L'église Saint-Vaast, détruite en 1918, a été remplacée en 1932 par une église de Louis-Marie Cordonnier (Églises ouvertes, notice Saint-Vaast). En 1906, Bailleul est le seul centre dentellier de la Flandre française, avec « une centaine d'ouvrières » (Blanchard 1906, p.~382). Le galon noir sert de cordon au lorgnon d'Hippolyte Combes (voir f.~56~v\textsuperscript{o}). En 1914, l'économat d'une compagnie de chemins de fer vendait la chemise d'homme de 3,70 à 4,15~F (March 1925, p.~208).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion, Bedfordshire Regiment, août 1916 (2-7 août).'
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, p. 382.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 208.
- Églises ouvertes, notice « Église Saint-Vaast, Bailleul » ; Cirkwi, point d'intérêt 4393487 (consultés le 18 oct. 2026).
