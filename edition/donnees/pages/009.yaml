critique: Encre noire virée au brun. Les deux journées sont séparées par un filet pleine largeur ; un blanc précède les comptes du 2, et ceux du 3, en retrait, ferment la page. Taches brunes et écriture du verso visible par transparence à droite et au bas de la page.
historique: |
  « Le camp » est sans doute celui de la compagnie (voir f. 3 v\textsuperscript{o}). Le 2 août, les bataillons de la brigade assistent à une démonstration de la « 2nd Army Bomb School » ; le 3, ils reconnaissent les tranchées de la route Armentières–Lille, où la brigade monte en ligne dans la nuit du 6 au 7 (JMO 7/Bedf, 2-7 août 1916). L'église Saint-Vaast de Bailleul, \textit{hallekerque} détruite en 1918, a été remplacée en 1932 par une église de Louis-Marie Cordonnier (Églises ouvertes, notice Saint-Vaast) ; les belles maisons des rues d'Ypres et de Lille ont disparu avec la ville (voir f. 4 r\textsuperscript{o}). Les dentellières relèvent de la seule industrie dentellière de la Flandre française : « la région française ne possède guère qu'une centaine d'ouvrières dans la ville de Bailleul » (Blanchard 1906, p. 382). Le galon noir sert de cordon au lorgnon d'Hippolyte Combes, qu'il fera réparer par l'horloger de Léalvillers (voir f. 56 v\textsuperscript{o}). En 1914, l'économat d'une compagnie de chemins de fer vendait la chemise d'homme de 3,70 à 4,15 F (March 1925, p. 208).
sources:
- 'Bedfordshire Archives Service, X550/8/1/1608 : War Diary, 7th (Service) Battalion, Bedfordshire Regiment, août 1916 (2-7 août).'
- Blanchard, Raoul, La Flandre. Étude géographique de la plaine flamande en France, Belgique et Hollande, Paris, Armand Colin, 1906, p. 382.
- March, Lucien, Mouvement des prix et des salaires pendant la guerre, Paris, PUF / New Haven, Yale University Press, 1925, p. 208.
- Églises ouvertes, notice « Église Saint-Vaast, Bailleul » ; Cirkwi, point d'intérêt 4393487 (consultés le 18 oct. 2026).
