historique: 'Cette photographie reprend la \textbf{même page que la vue 091} : rencontre du \textbf{major Levy} à Raincheval, don de 5~fr. à Victor Duchâteau, puis compte de 58~fr.~75 à la Mission d''Albert avec retenue de 30~fr. pour six jours de permission. Le sigle D.O.S.T. reste non développé ; la demande de Levy pour le maintien au Purchase Board est attestée plus tard, à la vue 166. Aucun règlement général de solde n''est reproduit.'
