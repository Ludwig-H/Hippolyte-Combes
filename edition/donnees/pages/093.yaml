historique: 'Cette photographie reproduit la \textbf{même page que le f.~46~r\textsuperscript{o}} : rencontre du \textbf{major Levy} à Raincheval, don de 5~F à Victor Duchâteau, puis compte de 58,75~F à la Mission d''Albert avec retenue de 30~F pour six jours de permission. Le sigle D.O.S.T. reste non développé ; la demande de Levy pour le maintien au Purchase Board est attestée plus tard, au f.~83~r\textsuperscript{o}. Aucun règlement général de solde n''est reproduit.'
