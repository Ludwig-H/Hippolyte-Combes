date: 2 (soir) – 3 novembre 1916 [seconde prise]
lieux: Acheux, Raincheval, Albert (Somme)
titre: Seconde prise photographique du f.~46~r\textsuperscript{o} (2--3~novembre 1916)
transcription: |
  Après le dîner, course en auto à Raincheval.
  Vu Major Levy, of the D.O.S.T.
  Nuit très noire. — Couché assez tard.
  \filet
  [ Donné à Victor Duchâteau : 5 f —
  Mess, octobre : 47 f 70
  Acheux : c^{tes} p^{les} : 15 c ]
  \filet
  \sl{3 Ve.} Matin, ciel couvert, 1 peu de soleil
  l'après-midi.
  Partis en auto avec L^{t} Curtis. Resté à Albert
  et revenu seul s/ 1 lorry. Routes
  mauvaises et sillonnées de véhicules divers.
  Revenu au camp, 152 C^{oy} et au
  bureau mission.
  Après lunch, 2^{h} 30, Acheux.
  Passé journée ds ma chambre — au bureau.
  \filet
  [ — Mission, Albert : 58 f 75 (30 f retenus pour
  6 jours de permission) ]
