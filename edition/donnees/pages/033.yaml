historique: |
  Ligny-Saint-Flochel est à 2,7 km à vol d'oiseau de Marquay (OSM). Le clocher de l'église Saint-Flochel, classé monument historique en 1930, date des XV\textsuperscript{e}--XVI\textsuperscript{e} siècles et non du XIII\textsuperscript{e} (Mérimée PA00108332). Les « manœuvres speciales » sont l'instruction à l'attaque que la division reçoit trois semaines durant dans la zone de la Third Army (Nichols 1922, p. 78) : le 28 août, le 7th Bedfordshire s'est exercé à l'attaque sous bois au bois des Hérombus, à 2,2 km à l'est de Ligny (JMO 7/Bedf, 28 août 1916), peut-être le bois que longe la route ; à Chelers, le barrage roulant est figuré par des hommes portant des fanions bleus (Banks \& Chell 1924, p. 144-145). Le plateau de Ligny abritait aussi l'école de mortiers de tranchée de la Third Army, que George V avait visitée le 9 août 1916 (IWM Q 961). Le \textit{headcook} est sans doute Hancock, qui avait reçu 5 f le 31 juillet (voir f. 3 v\textsuperscript{o}). L'espoir d'un départ le lundi 4 devance les ordres : le transfert à la Reserve Army, fixé le 4 pour la nuit du 6 au 7, sera annulé le 5 (voir f. 18 v\textsuperscript{o}).
