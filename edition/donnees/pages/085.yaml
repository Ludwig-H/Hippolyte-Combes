critique: Les deux journées sont écrites à la même encre violette, séparées par un filet ; quelques taches brunes sous la dernière ligne sont sans valeur textuelle.
historique: |
  La pluie qui reprend le 24 octobre, après une brume épaisse, fait remettre l'opération principale de la Reserve Army sur l'Ancre, fixée le 19 au 25 octobre. Le 27, on lui donne la date « provisoire » du 1er novembre (OH 1916-II, p.~461--462). Le même 24, l'attaque alliée sur Le Transloy est reportée de 48 heures (\textit{ibid.}, p.~468). Les obus tombés à 400 ou 500 mètres de sa chambre, comme le bombardement du 31 (f.~44~v\textsuperscript{o}), nuancent le guide Michelin, pour qui Albert était en octobre 1916 « enfin hors de portée » des canons allemands (Michelin 1919, p.~31--35). La nouvelle répond à la menace annoncée le 22 aux interprètes « jeunes R.A.T. » (voir f.~42~r\textsuperscript{o}). Le carnet ne dit pas pourquoi Hippolyte Combes est maintenu. Le lieutenant Pizzi est l'officier interprète de la 18th Division, qu'Hippolyte Combes louait dans sa lettre du 25 février 1916 (en annexe, p.~\pageref{annexe:doc1}) ; son identité civile n'est pas établie. L'adjudant lu « Lepin » est sans doute le « Lupin » du 20 août (f.~12~r\textsuperscript{o}) et le « Lépin » du 2 novembre (f.~45~v\textsuperscript{o}), non identifié.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 461-462, 468.
- Michelin, The Somme, vol. 1, The First Battle of the Somme (1916-1917), Clermont-Ferrand, Michelin, 1919, p. 31-35.
- Hippolyte Combes, H., lettre « Au front, le 25 février 1916 » à un capitaine (copie autographe, archives familiales ; en annexe).
