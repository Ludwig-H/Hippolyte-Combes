historique: |
  La pluie du 24~octobre fait remettre l'attaque de la Reserve Army sur l'Ancre, fixée au 25. Le 27, elle reçoit la date « provisoire » du 1\textsuperscript{er}~novembre (OH~\mbox{1916-II}, p.~461--462). Ces obus, comme ceux du 31 (f.~44~v\textsuperscript{o}), nuancent le guide Michelin (Albert « enfin hors de portée » des canons allemands ; Michelin 1919, p.~31--35). Hippolyte Combes échappe à la menace du 22 aux interprètes « jeunes R.A.T. » (voir f.~42~r\textsuperscript{o}) sans que le carnet dise pourquoi. Le lieutenant Pizzi, officier interprète de la 18\textsuperscript{th} Division, est loué dans la lettre du 25~février 1916 (en annexe, p.~\pageref{annexe:doc1}). L'adjudant Lépin n'est pas identifié.
sources:
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, Londres, Macmillan, 1938, p. 461-462.
- Michelin, The Somme, vol. 1, The First Battle of the Somme (1916-1917), Clermont-Ferrand, Michelin, 1919, p. 31-35.
- Lettre d'Hippolyte Combes à un capitaine, « Au front, le 25 février 1916 » (copie autographe, archives familiales ; en annexe).
