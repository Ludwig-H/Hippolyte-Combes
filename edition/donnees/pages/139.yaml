critique: Encre violette. La fin des l. 14-15 et les mots « ville natale » sont d'un trait plus pâle et plus fin, comme à plume presque sèche ; un blanc d'une ligne sépare le voyage de l'arrivée à Millau. Les comptes de la journée sont reportés au recto suivant.
historique: |
  L'« oncle » qui les accompagne à la gare est sans doute Émile Crouzet, chez qui Marguerite loge à Sainte-Marie (voir f.~27~v\textsuperscript{o}). Jean est vraisemblablement son fils, l'abbé Jean Crouzet, vicaire à Saint-Étienne de Toulouse (voir f.~29~v\textsuperscript{o}) ; sa présence à Carcassonne reste inexpliquée. À Béziers, la « cath\textsuperscript{le} » est l'ancienne cathédrale Saint-Nazaire (XII\textsuperscript{e}-XIV\textsuperscript{e} s.), en partie fortifiée, dont la terrasse domine l'Orb et la plaine (Baedeker 1914, p.~107). Le « petit train » de 17~h~23 suit la ligne des Causses, de Béziers à Neussargues (Compagnie du Midi), par Bédarieux, où les voyageurs dînent au buffet (f.~70~r\textsuperscript{o}), et Tournemire (Baedeker 1914, p.~282-287). Pierre Calmels (1884-1924), médecin, frère de Marguerite, les attend à Millau, ville où Hippolyte Combes est né le 14 août 1876 (acte n\textsuperscript{o}~395). La « maison de Mte » est celle que le Dr Gabriel Calmels (1852-1921) a bâtie au 10, rue Alfred-Guibert, où sera servi le repas de noces du 25 octobre 1917 (PC-Annexe).
sources:
- Baedeker, K., Southern France including Corsica, 6e éd., Leipzig, Baedeker, 1914, p. 106-107 et 282-287.
- Acte de naissance de Marie Lucien Hippolyte Combes, Millau, n° 395, 16 août 1876 (archives familiales).
- Combes, P., annexe du livre familial dactylographié (PC-Annexe) et arbre généalogique (2020), p. 106 (archives familiales).
- Le Télégramme (Toulouse), 5 févr. 1915, p. 2 (abbé Crouzet, Rosalis, ark:/12148/bd6t53865791z).
