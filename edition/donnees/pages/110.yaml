critique: 'Encre noire virée au brun. Les trois journées se suivent sans filet complet : un blanc et un court trait en marge gauche annoncent le 13, un blanc d''une ligne le 14. Le compte de l''essuie-mains, logé dans le retrait de la dernière ligne, descend jusqu''au bord inférieur du feuillet, qui le coupe en partie.'
historique: |
  Senlis-le-Sec, à 6~km au sud-sud-est d'Acheux, est depuis le 1\textsuperscript{er} décembre le siège du QG du IV Corps (LLT). Toutencourt abrite le QG de la Fifth Army (voir f.~49~v\textsuperscript{o}). Englebelmer, à 5,5~km à l'est d'Acheux et à 11~km de Toutencourt, poste d'ambulances exposé aux obus jusqu'à l'automne (CWGC), n'était plus le 7 occupé que par la troupe (voir f.~54~r\textsuperscript{o}). La présence du major Levy, chef de l'\textit{Army Purchase Board} de Raincheval (voir f.~46~r\textsuperscript{o}), suggère que la réunion des habitants évacués portait sur l'achat, ou l'indemnisation, des récoltes et fourrages restés dans leurs granges, peut-être à faire battre comme à Arquèves (f.~54~r\textsuperscript{o}) ; les dossiers de la Mission sur les réfugiés et les réquisitions sont aux cartons 17~N 393-395 du SHD (Nicot 1972, p.~263-269). Belle-Église est un hameau d'Arquèves (voir f.~47~v\textsuperscript{o}) ; Puchevillers, à 9~km à l'ouest-sud-ouest, abrite les 3rd et 44th \textit{Casualty Clearing Stations} (LLT) ; Harponville est à 4,5~km au sud-sud-ouest d'Acheux.
sources:
- Baker, C., The Long, Long Trail, « The British IV Corps in France and Flanders » (copie Wayback de déc. 2021) et « Locations of British Casualty Clearing Stations » (copie Wayback du 13 janvier 2018).
- Commonwealth War Graves Commission, notice historique « Englebelmer Communal Cemetery Extension » (cwgc.org, consultée le 17 oct. 2026).
- Nicot, J., Schillinger, P., Ficat, J., Inventaire sommaire des archives de la guerre 1914-1918. Grand quartier général des armées alliées (15 N), GQG (16 N), Missions militaires françaises (17 N), Vincennes, Service historique de l'Armée, 1972, p. 263-269.
