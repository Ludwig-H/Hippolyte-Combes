critique: Encre violette homogène ; dans le compte du mess (l.~8), le quantième initial après « du » a été laissé en blanc et n'a pas été complété.
historique: |
  La neige des Rameaux et du 2 avril, une semaine avant Pâques (8 avril), est confirmée par l'histoire officielle : « une neige comme celle du début d'avril est rare en Picardie » ; le 2, la Fifth Army enlève sous ce temps Doignies, Louverval, Noreuil, Écoust, Croisilles et Hénin, avant-postes de la ligne Hindenburg (OH 1917-I, p.~159--161), et le QG du V Corps quitte Acheux pour Bihucourt (LLT). Belle-Église est le hameau d'Arquèves dont Combes fréquente la ferme (voir f.~85 v\textsuperscript{o}). Le compte du mess, dont la date de départ est restée en blanc, court sans doute depuis le règlement du 9 mars avec le capitaine Williams (f.~82 r\textsuperscript{o}) : 27 f 50 pour trois semaines environ, contre 79 f 10 pour janvier (f.~63 v\textsuperscript{o}). Le notaire de Toutencourt est M\textsuperscript{e} Jules Bienaimé, titulaire de l'étude de 1906 à 1933, d'une lignée de notaires établie au village depuis 1805 (AD Somme, Espel 2018, p.~3--4) ; la visite tient peut-être à un acte de vente de fourrage, comme le contrat de battage passé en janvier (f.~60 r\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 159-161.
- The Long, Long Trail (C. Baker), « The British V Corps in France and Flanders », copie Wayback d'août 2020.
- Archives départementales de la Somme, Fonds de l'Office notarial de Toutencourt, aujourd'hui Acheux-en-Amiénois (1729-1904). Répertoire méthodique détaillé, par A. Espel, sous la dir. d'A. Lejeune, Amiens, 2018, p. 3-4.
