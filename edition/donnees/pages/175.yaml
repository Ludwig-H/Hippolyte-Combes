historique: |
  La neige du début d'avril « est rare en Picardie », note l'histoire officielle ; le 2, par ce temps, la Fifth Army enlève Doignies, Louverval, Noreuil, Longatte, Écoust et Croisilles, et la Third Army Hénin-sur-Cojeul, avant-postes de la ligne Hindenburg (OH~\mbox{1917-I}, p.~151, 161--167). Belle-Église est le hameau d'Arquèves dont Hippolyte Combes fréquente la ferme (voir f.~85~v\textsuperscript{o}). Le compte du mess, sans date de départ, court sans doute depuis le règlement du 9~mars (f.~82~r\textsuperscript{o}) : 27,50~F pour trois semaines environ, contre 79,10~F pour janvier (f.~63~v\textsuperscript{o}). Le notaire de Toutencourt est M\textsuperscript{e} Jules Bienaimé, titulaire de l'étude de 1906 à 1933 (AD Somme, Espel 2018, p.~3--4).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 151, 161-167.
- Archives départementales de la Somme, Fonds de l'Office notarial de Toutencourt, aujourd'hui Acheux-en-Amiénois (1729-1904). Répertoire méthodique détaillé, par A. Espel, sous la dir. d'A. Lejeune, Amiens, 2018, p. 3-4.
