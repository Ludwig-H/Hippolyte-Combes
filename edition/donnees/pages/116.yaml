critique: Les comptes du 28 décembre, ouverts par une équerre, sont fermés par un filet tiré sur toute la largeur, qui sépare les deux journées ; le montant de la boîte recommandée et la fin de l'adresse (« Paris ») sont rejetés sur la ligne du concert.
historique: |
  La canonnade « du coté d'Hebuterne » vient du secteur de la 31st Division, gauche du XIII Corps (OH 1917-I, p.~66) ; aucune opération n'y est signalée, l'effort de décembre portant sur « l'amélioration de nos tranchées et des routes » (Haig 1919, p.~66). Les « 13th corps Archie Singers » sont sans doute la troupe de concert des batteries antiaériennes du corps, \textit{Archie} désignant en argot le canon antiaérien et ses servants (Partridge 1937) ; ils reviennent le 4 janvier (voir f.~60~r\textsuperscript{o}). L'entrée payante (30~c) surprend : la Y.M.C.A. disait ses concerts gratuits (Yapp 1918, chap.~IV). La boîte envoyée à Imbert, opticien du boulevard Saint-Michel (f.~65~v\textsuperscript{o}), contenait sans doute le pince-nez dont Combes paiera la réparation le 10 janvier (f.~61~r\textsuperscript{o}). Le Major Levy est peut-être Walter Henry Levy, major temporaire de l'A.S.C. (\textit{London Gazette}, suppl. 29585, p.~4941) ; Sunbeam est une marque de Wolverhampton (Grace's Guide). Le « Quesnoy » est peut-être le lieu-dit Le Quesnoy, à Puchevillers, où une ferme porte ce nom.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 66.
- Boraston, J. H. (éd.), Sir Douglas Haig's Despatches (December 1915 – April 1919), London, Dent, 1919, p. 66 (dépêche du 31 mai 1917).
- Partridge, E., A Dictionary of Slang and Unconventional English, London, Routledge, 1937, s.v. « Archie ».
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV, p. 39-62.
- The London Gazette, suppl. 29585, 17 mai 1916, p. 4941.
- Grace's Guide to British Industrial History, « Sunbeam Motor Car Co » (gracesguide.co.uk).
