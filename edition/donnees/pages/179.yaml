critique: Encre violette uniforme. Les comptes de Doullens, ouverts par un grand crochet, sont séparés de la journée du 12 par un filet.
historique: |
  La neige du 11 avril tombe le matin même où la 4th Australian Division, appuyée de chars, attaque Bullecourt « sur un sol maintenant plus enneigé que la veille » ; l'histoire officielle juge une neige d'avril « rare en Picardie » (OH 1917-I, p.~161, 364). À Doullens, à une quinzaine de kilomètres au nord d'Hérissart, la boîte achetée « (canteen) » vient sans doute d'une succursale des \textit{Expeditionary Force Canteens}, qui vendaient les produits britanniques près du prix coûtant (Fernand-Laurent 1917, p.~82-83 ; Fortescue 1928, p.~52-53). Teinture d'iode et chlorate de potasse, alors employé en pastilles ou en gargarisme contre les maux de gorge, composent une pharmacie de campagne. Warloy abrite l'aérodrome du No.~4 Squadron du Royal Flying Corps (Jones 1931, app.~XII). Le \textit{Second Lieutenant} Gilbert, « de Jersey », qui reparaît jusqu'au 30 avril (f.~90 v\textsuperscript{o}, 92 v\textsuperscript{o}, 93 r\textsuperscript{o}), n'est pas identifié : cinq officiers de l'A.S.C. portent ce nom, aucun n'est relié à Jersey ni à une œuvre poétique (TNA, WO 339).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, Londres, Macmillan, 1940, p. 161, 361-364.
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 82-83.
- Fortescue, Sir J., A Short Account of Canteens in the British Army, Cambridge, Cambridge University Press, 1928, p. 52-53.
- Jones, H. A., The War in the Air, vol. III, Oxford, Clarendon Press, 1931, appendice XII.
