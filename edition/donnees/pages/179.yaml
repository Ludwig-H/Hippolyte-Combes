historique: |
  La neige du 11~avril tombe le jour où la 4\textsuperscript{th} Australian Division attaque Bullecourt avec des chars ; l'histoire officielle juge une neige d'avril « rare en Picardie » (OH~\mbox{1917-I}, p.~161, 364). À Doullens, à une quinzaine de kilomètres au nord d'Hérissart, la boîte « (canteen) » vient sans doute d'une \textit{Expeditionary Force Canteen}, qui vendait les produits britanniques près du prix coûtant (Fernand-Laurent 1917, p.~82--83 ; Fortescue 1928, p.~52--53). Warloy a un aérodrome du Royal Flying Corps (No.~4 Squadron : Jones 1931, app.~\textsc{xii}). Le \textit{Second Lieutenant} Gilbert, « de Jersey », revu jusqu'au 30~avril, n'est pas identifié : aucun des cinq officiers de l'A.S.C. de ce nom n'est relié à Jersey (TNA, WO 339).
