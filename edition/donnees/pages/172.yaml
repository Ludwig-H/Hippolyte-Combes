critique: Encre violette ; « Superbe sunset. » est d'une encre plus pâle, la plume s'épuisant, sans indice d'ajout. Un blanc d'une ligne sépare chaque journée de la suivante.
historique: |
  L'auto toujours aux ateliers (voir f.~85~r\textsuperscript{o}), Hippolyte Combes gagne à pied Rubempré et le chemin de Puchevillers. Le « billet (220 » est la chambre où il s'est installé le 11 mars, après le départ de l'interprète Valet (voir f.~83~r\textsuperscript{o}) ; le 19, il a dû en céder un lit à un officier de passage (voir f.~85~r\textsuperscript{o}). Les logements chez l'habitant sont répartis par le \textit{Town Major}, qui tient la liste de ceux de la localité (Fernand-Laurent 1917, p.~227) et peut reprendre un billet, comme à Acheux en novembre (voir f.~47~r\textsuperscript{o}) ; le passage des divisions qui quittent la Somme rend la chambre convoitée. Ces gelées tardives prolongent un hiver très dur pour les chevaux, dont la ration d'avoine était tombée à 6 livres (OH 1917-I, p.~65--66). Dans la nuit du 24 au 25, à minuit, l'heure d'été entre en vigueur dans les armées britanniques (OH 1917-I, p.~147, n.~1) : le carnet n'en dit rien. Le départ du QG de la Fifth Army pour Albert, le 28, videra bientôt les villages de l'arrière (voir f.~88~v\textsuperscript{o}).
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, London, Macmillan, 1940, p. 65-66, 147, n. 1.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 227.
