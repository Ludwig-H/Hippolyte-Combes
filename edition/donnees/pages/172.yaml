historique: |
  Le « billet (220 » est la chambre qu'Hippolyte Combes occupe depuis le 11~mars, après le départ de l'interprète Valet (voir f.~83~r\textsuperscript{o}) ; le 19, il a dû en céder un lit (voir f.~85~r\textsuperscript{o}). Les logements chez l'habitant sont répartis par le \textit{Town Major} (Fernand-Laurent 1917, p.~227), qui peut reprendre un billet, comme à Acheux en novembre (voir f.~47~r\textsuperscript{o}). Ces gelées tardives prolongent un hiver très dur pour les chevaux, dont la ration d'avoine était tombée à 6~livres (OH~\mbox{1917-I}, p.~65--66). Dans la nuit du 24 au 25, l'heure d'été entre en vigueur dans les armées britanniques (OH~\mbox{1917-I}, p.~147, n.~1) ; le carnet n'en dit rien.
sources:
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, The German Retreat to the Hindenburg Line and the Battles of Arras, London, Macmillan, 1940, p. 65-66, 147, n. 1.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, p. 227.
