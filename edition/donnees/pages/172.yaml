date: Vendredi 23 – dimanche 25 mars 1917
mois: Mars 1917
lieux: Hérissart, Rubempré et Puchevillers (Somme)
titre: Gel et grand soleil ; démarches pour garder le billet 220 ; marches à Rubempré
transcription: |
  \sl{23 Ven.} \hfill — \sl{Mars 1917} —
  nuit \inc{gelé} très fort
  Vitres fenêtre, couvertes de glace
  Sol durci.    Froid très vif
  très beau ciel bleu, tout ensoleillé. Chants d'oiseaux
  notre auto, aux workshops. Matin & soir,
  liberté complète
  Lu et ecrit, office & chamb
  Fait demarches pour qu'on me laisse au billet (220.
  Ds la journée, et afternoon, promené
  un peu campagne
  Nuit très étoilée, mais froide \trait
  \blanc{1}
  \sl{24 Sam.} – Nuit froide. Gelé assz fort! Sol durci.
  Tout le jour, soleil brille –, très vif. Ciel d'un
  bleu profond. Vent souffle – avec violence \trait
  \ind Après-midi, venus à pied à Rubempré
  et j chemin Puchevillers
  Fin de journée magnifique. Superbe sunset.
  \blanc{1}
  \sl{25 D.} matin & soir, Temps nuageux \trait
  Ds la journée, soleil ardent, ciel bleu – .
  Course à pied à Rubempré, l'après-midi :
  Pas pris pardessus. Promenade fort agreable
