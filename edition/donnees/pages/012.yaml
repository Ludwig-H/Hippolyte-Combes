critique: Le verso de ce feuillet n'a pas été photographié ; le récit reprend le 6 août au f. 7 r\textsuperscript{o}.
historique: |
  Le départ du convoi accompagne la descente de la 54th Brigade vers la Lys : le même jour, le 7th Bedfordshire quitte à 5 h 30 le « Steam Mill », à l'ouest de Bailleul, gagne Erquinghem par Bailleul et relève dans la nuit du 6 au 7 le 1st Wellington (1st New Zealand Brigade), à cheval sur la route Armentières–Lille (Beds War Diary, 5-7 août 1916). La Croix-du-Bac, hameau de Steenwerck où Combes avait touché sa solde la veille (voir f. 5 r\textsuperscript{o}), est à 11 km à vol d'oiseau de Saint-Jans-Cappel ; un cimetière militaire britannique y avait été ouvert en juillet 1916 par les ambulances et les unités du secteur (CWGC). Chercher des chambres pour les officiers est l'une des « principales besognes de l'interprète » (Fernand-Laurent 1917, pp. 225-234). Connelly, nommé ici pour la première fois et de nouveau payé jusqu'au 15 octobre 1916, est le \textit{groom}, soldat chargé du cheval de Combes : les officiers montés avaient « un groom, pour soigner leur cheval », en plus de l'ordonnance (Fernand-Laurent 1917, p. 64) ; il n'est pas autrement identifié.
sources:
- 'Bedfordshire Archives Service, X550/8/1/1607-1609 : War Diary, 7th (Service) Battalion Bedfordshire Regiment, juillet-septembre 1916 (Beds War Diary), 5-7 août.'
- CWGC, Croix-du-Bac British Cemetery, Steenwerck (fiche 28202), historique.
- Fernand-Laurent, Chez nos alliés britanniques (With our British Allies in the Field). Notes et souvenirs d'un interprète, Paris, Boivin, 1917, pp. 64, 225-234.
