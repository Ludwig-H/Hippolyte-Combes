titre: Départ de Saint-Jans-Cappel par Bailleul ; installation à La Croix-du-Bac
transcription: |
  \sl{Sam. 5} \hfill Aout \sl{1916}
  \ind Lev. vers 6^{H} –
  Bientot, ts préparatifs terminés.
  Porte moi-= en 3 voy. mes sacs à l'office
  et les vu charger s/ wagon no 5 –
  Ciel tjs couvert de gros nuages noirs.
  Souffle vent à peine perceptible
  Ds le champ tt proche, les A.S.C. men
  se preparent lentement
  \ind Partis à 2^{H}. Soleil devenu brulant
  Route poussiéreuse
  par Bailleul, parvenus à La Croix
  du Bac – vers 4^{H} \fr{1}{2} –
  Les Horse-lines, à l'entrée village, du
  côté de Steenwerck.
  Cherché chambres pr. offs. Réussi à me
  loger maison en face de la Coy –
  \ind Fin journée vraiment superbe \trait
  Lumière vive éclaire paysage plat
  \blanc{1}
  \filet
  \ind A fermière de St Jans-Capel (pour oeufs, )
  lait & bière : 1^{f} 60 et for washing : 3 —
  \ind[2] Consommations : 60c (bière
  A Connelly, mon groom : 1 f —
