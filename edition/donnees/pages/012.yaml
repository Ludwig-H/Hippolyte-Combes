historique: |
  Le convoi suit la 54\textsuperscript{th} Brigade vers la Lys : le même jour, le 7\textsuperscript{th} Bedfordshire quitte le « Steam Mill », gagne Erquinghem par Bailleul et relève dans la nuit du 6 au 7 le 1\textsuperscript{st} Wellington néo-zélandais sur la route Armentières–Lille (JMO~7/Bedf, 5--7~août 1916). Un cimetière militaire britannique a été ouvert à La Croix-du-Bac en juillet 1916 (CWGC). Chercher des chambres pour les officiers est l'une des « principales besognes de l'interprète » (Fernand-Laurent 1917, p.~225--234). Connelly, payé de nouveau jusqu'au 15~octobre 1916 et non autrement identifié, est le \textit{groom} qui soigne le cheval d'Hippolyte Combes ; les officiers montés en ont un en plus de l'ordonnance (Fernand-Laurent 1917, p.~64).
