critique: 'Encre noire virée au brun, qui pâlit par endroits quand la plume se vide, sans indiquer d''ajout postérieur. La journée du vendredi 24 novembre n''a pas d''entrée : la page s''ouvre sur le samedi 25.'
historique: |
  La sucrerie visée par les obus du 25 est l'usine Normand et Cie (ancienne Compagnie sucrière du canton d'Acheux), à la sortie du bourg sur la route de Forceville (Mérimée IA00076408) ; la ferme Royer n'est pas identifiée. Ce second bombardement d'Acheux, après celui du 11 novembre (voir f.~48~v\textsuperscript{o}), n'est pas signalé par les sources consultées ; on ignore si les victimes étaient civiles ou militaires. Le bourg, tête de ligne, abrite jusqu'au 29 novembre le QG du V Corps (OH 1916-I, p.~274 ; LLT). Les ornières « j-à \fr{1}{2} jambe » rejoignent le « marécage presque sans fond » que Haig décrit au chef d'état-major impérial le 21 novembre (OH 1916-II, p.~536--537). Les caisses de bidons de pétrole qui servent de siège sont celles où l'essence arrivait, en bidons de 2 ou 4 gallons (\textit{Statistics} 1922, p.~846). Le lieutenant Walsh, chez qui Hippolyte Combes a déjeuné à Hérissart le 16, et son interprète, alors présenté comme directeur d'une usine de tissus près de Paris (voir f.~49~v\textsuperscript{o}), ne sont pas identifiés ; la forme « Deloney » reste incertaine.
sources:
- Ministère de la Culture, base Mérimée, notice IA00076408, « Sucrerie dite Cie sucrière du Canton d'Acheux, puis Normand et Cie », Acheux-en-Amiénois (pop.culture.gouv.fr).
- Edmonds, J. E., Military Operations, France and Belgium, 1916, vol. I, London, Macmillan, 1932, p. 274.
- Miles, W., Military Operations, France and Belgium, 1916, vol. II, London, Macmillan, 1938, p. 536-537.
- The Long, Long Trail, « The British V Corps in France and Flanders », https://web.archive.org/web/20200805133825/https://www.longlongtrail.co.uk/army/other-aspects-of-order-of-battle/the-british-corps-headquarters-in-france-and-flanders/the-british-v-corps-in-france-and-flanders/.
