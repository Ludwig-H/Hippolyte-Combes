critique: |
  Le vendredi 24~novembre n'a pas d'entrée.
historique: |
  La sucrerie touchée le 25 est l'usine Normand et Cie, à la sortie du bourg vers Forceville (Mérimée IA00076408) ; la ferme Royer n'est pas identifiée. Ce second bombardement d'Acheux, après celui du 11~novembre (voir f.~48~v\textsuperscript{o}), n'apparaît pas dans les sources consultées. Acheux, tête de ligne, abrite jusqu'au 29~novembre le QG du V Corps (OH~\mbox{1916-I}, p.~274 ; LLT). Le 21~novembre, Haig décrivait le terrain comme un « marécage presque sans fond » (OH~\mbox{1916-II}, p.~536--537). Les caisses servant de siège sont celles où arrivait l'essence, en bidons de 2 ou 4 gallons (\textit{Statistics} 1922, p.~846). Le lieutenant Walsh, chez qui Hippolyte Combes a déjeuné à Hérissart le 16, et son interprète (voir f.~49~v\textsuperscript{o}) ne sont pas identifiés ; la lecture « Deloney » reste incertaine.
