critique: 'Dernière page écrite du carnet : les deux dépenses sont portées au pied, après un blanc. L''encre pâlit par endroits (fin des l.~4 et 6, l.~13 et 15), sans changement d''instrument apparent.'
historique: |
  Le carnet s'achève à la date annoncée par sa couverture (« Du 25 juillet 1916 au 30 avril 1917 ») ; on ignore s'il eut une suite, la plupart des papiers d'Hippolyte Combes ayant été détruits en 1970-1971 (P. Combes, livre familial). Les villages du matin, à l'ouest d'Albert, avaient été trouvés vides le 19 avril (voir f.~90 v\textsuperscript{o}) ; Puchevillers avait abrité les hôpitaux d'évacuation n\textsuperscript{os}~3 et 44 jusqu'en mars et garde le n\textsuperscript{o}~61 jusqu'en mai ; Villers-Bocage fut le QG du II Corps du 23 juin au 23 juillet 1916 (LLT). La note de blanchissage, 50 c., clôt une rubrique ouverte le 26 juillet 1916 (« Washing : 1\textsuperscript{f} », f.~1 v\textsuperscript{o}). Ce même jour, la 18th Division est en ligne devant Chérisy, qu'elle attaquera le 3 mai (Nichols 1922, p.~165-166). Interprète jusqu'au 11 novembre 1918, Hippolyte Combes épouse Marguerite Calmels à Millau le 25 octobre 1917 (menu des noces) et est dirigé le 24 novembre 1918 sur l'École militaire préparatoire des Andelys comme professeur d'anglais (registre matricule n\textsuperscript{o}~911).
sources:
- Baker, C., The Long, Long Trail, « Locations of British Casualty Clearing Stations » (copie Wayback Machine du 13 janvier 2018) et « The British II Corps in France and Flanders » (copie Wayback Machine du 6 novembre 2024).
- Nichols, G. H. F., The 18th Division in the Great War, Edinburgh et London, Blackwood, 1922, p. 165-166.
