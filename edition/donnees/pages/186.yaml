historique: |
  Le carnet s'achève à la date inscrite sur sa couverture (« Du 25 juillet 1916 au 30 avril 1917 »). On ignore s'il eut une suite : la plupart des papiers d'Hippolyte Combes ont été détruits en 1970--1971 (P. Combes, livre familial). Les villages du matin, à l'ouest d'Albert, avaient été trouvés vides le 19~avril (voir f.~90~v\textsuperscript{o}). Puchevillers avait accueilli les hôpitaux d'évacuation n\textsuperscript{os}~3 et 44 jusqu'en mars ; le n\textsuperscript{o}~61 y reste jusqu'en mai (LLT). Hippolyte Combes épouse Marguerite Calmels à Millau le 25~octobre 1917 (menu des noces). Interprète jusqu'au 11~novembre 1918, il est envoyé le 24~novembre comme professeur d'anglais à l'École militaire préparatoire des Andelys (registre matricule n\textsuperscript{o}~911).
