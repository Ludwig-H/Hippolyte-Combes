critique: Encre gris-noir virée au brun, homogène ; une seule journée, sans filet, et le bas de la page laissé blanc.
historique: |
  Noël, que la page ne nomme pas, est un jour de repos à Acheux. Le « propos fâcheux » est le « Bloody France » de la veille, à Louvencourt (voir f.~56~v\textsuperscript{o}) ; la « Mission fr\textsuperscript{se} » est le bureau du XIII Corps à Acheux, où il touche sa solde (f.~56~r\textsuperscript{o}). Le carnet ne dit pas qu'un rapport ait été fait : après un nouveau mot « très regrettable » le 30, Hippolyte Combes choisit l'explication directe et obtient des excuses (f.~58~v\textsuperscript{o}). Le soir, la hutte de la Y.M.C.A. devenait salle de concert, pour des amateurs pris dans la troupe (Fernand-Laurent 1917, p.~94-95) ; l'entrée était en principe gratuite (Yapp 1918, chap.~IV), mais Hippolyte Combes paiera 30~c le 28 pour les « 13th Corps Archie Singers » (f.~58~r\textsuperscript{o}). Le silence de la nuit répond à l'arrêt des opérations que pluie et boue imposent depuis la mi-novembre (OH 1917-I, p.~65). La lettre de Marguerite du 17 ouvre une crise des fiançailles ignorée de la tradition familiale ; apaisée dès ce soir, elle s'efface à la permission de janvier (f.~66~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, préface de F. de Tessan, Paris, Boivin, 1917, p. 94-95.
- Yapp, A. K., The Romance of the Red Triangle, London, Hodder and Stoughton, 1918, chap. IV, « The Romance of Finance », p. 39-62.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 65.
