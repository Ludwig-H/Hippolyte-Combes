historique: |
  Le « propos fâcheux » est le « Bloody France » de la veille, à Louvencourt (voir f.~56~v\textsuperscript{o}). La Mission française a son bureau au XIII Corps, à Acheux (f.~56~r\textsuperscript{o}). Le carnet ne mentionne aucun rapport ; le 30, après un nouveau mot, Hippolyte Combes s'explique avec lui et obtient des excuses (voir f.~58~v\textsuperscript{o}). Les concerts de la hutte de la Y.M.C.A. étaient donnés par des soldats amateurs (Fernand-Laurent 1917, p.~94-95). Si la nuit est calme, c'est que pluie et boue arrêtent les opérations depuis la mi-novembre (OH 1917-I, p.~65). La lettre de Marguerite du 17 ouvre une crise dans les fiançailles, inconnue de la tradition familiale ; elle s'efface à la permission de janvier (f.~66~v\textsuperscript{o}).
sources:
- Fernand-Laurent, Chez nos alliés britanniques. Notes et souvenirs d'un interprète, préface de F. de Tessan, Paris, Boivin, 1917, p. 94-95.
- Falls, C., Military Operations, France and Belgium, 1917, vol. I, London, Macmillan, 1940, p. 65.
