resume: Le 13 mars, temps doux et nuageux, routes boueuses ; le lieutenant étant parti à Martinsart, Hippolyte Combes reste seul à Hérissart et rend visite après le thé à M. et Mme Flutre, instituteurs, dont le fils est élève de l'École normale supérieure. Le 14, sous la pluie, l'office et le mess sont transférés au billet 216, en face de sa maison ; l'après-midi, il fait la tournée des fermes de Puchevillers pour la paille. Le 15, froid piquant et vent glacial ; courses à Acheux et Bertrancourt, et à Acheux Wood dans une boue épaisse.
