difficultes:
- ligne: 7
  lemme: Beauq\lac
  analyse: 'zoom ×3,5 [.84 .215 1.0 .28] : B bouclé (boucle haute + panse), e, a, puis deux éléments arrondis (u à sommets ronds, ou c + o), enfin une lettre à tête ouverte et haste descendante oblique (q, y ou g) qui touche le bord de la photographie. Beauquesne suppose u + q, Beaucourt c-o-u sans descendante ; l''itinéraire par Varennes et Contay (au sud d''Acheux) conduit plus naturellement à Beaucourt-sur-l''Hallue, mais les traits favorisent q'
  alternatives:
  - Beauquesne
  - Beaucourt
- ligne: 4
  lemme: \add{lourds}
  analyse: 'zoom ×3,5 [.80 .105 .96 .145] : petit module dans l''interligne ; l sans boucle, o lié par le haut, u, r réduit à une pointe détachée, d à haste montante bouclée, s final plongeant ; le gros jambage violet qui traverse le mot est le s long de sillons (l. 3) ; cf. 174 « lourds véhicules »'
  alternatives:
  - lourds
- ligne: 22
  lemme: \inc{catéchismes}
  analyse: 'zooms ×3 et ×4 [.60 .835 .76 .875] : c ; a à jambage ; haste haute sans boucle (t, barre reportée à droite) ; petite boucle (é) ; c court sous la barre ; h à haute boucle ; arche puis cinq minimes, point d''i déporté au-dessus du m ; e ; s long final. Ni ll ni nn : carillonne exclu ; catéchumènes demanderait un second e'
  alternatives:
  - catéchismes
  - catéchumènes
- ligne: 22
  lemme: \inc{carillon}
  analyse: 'zoom ×4 [.83 .832 .96 .862] : précédé de un (surmonté d''un trait isolé) ; mot de petit module, plus haut que la ligne : c, a, cinq minimes, délié final, point d''i loin à droite ; aucune haste pour ll ni boucle d''o nette ; carillon suppose des l réduits à des minimes ; camion s''accorde mieux au compte des minimes mais non au sens'
  alternatives:
  - carillon
  - camion
  - canon
- ligne: 23
  lemme: \inc{gd}
  analyse: g à longue boucle inférieure puis panse fermée à jambage (aspect a) ; la haste du d ne se distingue pas (elle se confondrait avec le dernier 0 de 0.40 suscrit) ; aucun s
