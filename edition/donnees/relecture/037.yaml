resume: 'Le mercredi 6 septembre 1916, le beau temps revient : Hippolyte Combes passe deux heures assis à l''ombre dans une pâture puis, à six heures du soir, accompagne le lieutenant Curtis à une ferme voisine où Mme Vauchel, propriétaire intelligente, les accueille fort bien ; il dit languir dans ce trou perdu et sale. Le jeudi 7, après le déjeuner, il part en campagne, fait halte près de calvaires, d''un bois et de champs d''avoine. Il passe une longue demi-heure à Saint-Pol (maisons de brique, rues en pente vers la grande place et l''église), puis revient par Saint-Michel-sur-Ternoise, dont il visite le petit cimetière envahi d''herbes autour de l''église au clocher octogonal. Il note cartes postales, coupe de cheveux et consommations.'
