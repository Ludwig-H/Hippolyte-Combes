difficultes:
- ligne: 1
  lemme: mervt
  analyse: 'm, e, r, v (deux jambages), t haut barré dont la base reste sur la ligne : pas de suscription (zoom ×3).'
  alternatives:
  - merv^{t}
- ligne: 2
  lemme: annivre
  analyse: a, n, n, i, v, puis jambage et délié = re ; le point visible au-dessus de la fin est celui du i, décalé à droite.
  alternatives:
  - annivi
- ligne: 4
  lemme: Cl
  analyse: Grand C ; petite boucle montant à hauteur de hampe (l) ; puis & en ρ à longue haste plongeante.
  alternatives:
  - C.
  - Ch
- ligne: 6
  lemme: ensemble
  analyse: Trait épais sous le début du mot seulement (en) ; soulignement retenu (cf. guide), mais il pourrait s'agir d'un accent de Separes (l. 7) décalé.
  alternatives:
  - ensemble
- ligne: 7
  lemme: Separes
  analyse: Petit trait isolé au-dessus de l'attaque du p, qui peut être l'accent du premier e ou l'attaque haute du p.
  alternatives:
  - Sépares
  - Séparés
- ligne: 9
  lemme: B. Mm
  analyse: 'B en ℓo avec point ; M recoupé par le g de arrangt (l. 8) ; m bref ; grande boucle fermée en haut et haste vers la gauche plongeant dans la l. 10 : &.'
  alternatives:
  - B. Mme
  - Bne Maman
- ligne: 10
  lemme: Castanet
  analyse: C majuscule à grand arc ; petite panse ; haste montante (l ou s) ; deux ou trois minimes ; t barré d'une longue barre qui couvre aussi une seconde haste bouclée ; e final. La séquence s-t de Castanet n'est pas nette ; tt possible.
  alternatives:
  - Cobattel
  - Cabatel
- ligne: 16
  lemme: Laudet
  analyse: L en ℒ ; quatre à cinq minimes (a + u ou a + m) ; panse fermée + haste inclinée à droite (d ou ol) ; e ; t barré. Le second trait sous la barre est le jambage du p de pris.
  alternatives:
  - Lamolet
- ligne: 18
  lemme: '6'
  analyse: Petite tête ouverte, grande boucle basse fermée ; comparer au 8 de 80, de même dessin.
  alternatives:
  - '3'
  - '8'
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Vérifié sur l''image : Castanet, B. Mm et Laudet restent incertains (voir ci-dessus) ; lieux limité à Toulouse, Castanet(-Tolosan) n''étant qu''une lecture probable ; l''Automate, Mme de Labarthe et Mme Laudet restent non identifiées.'
  alternatives: []
controle:
- ligne: 9
  avant: Après déjeuner
  apres: après déjeuner
  justification: Initiale au module d'une minuscule, sans forme de A majuscule ; même traitement que en sortant (l. 4) ; accent de è décalé au-dessus du s.
- ligne: 6
  avant: apparat graphie « Victor. Hugo » (point au lieu du trait d'union)
  apres: note supprimée
  justification: Ponctuation seule ; l'identification du marché est donnée par noms.lieux et par la note sur V. (l. 17).
- ligne: 18
  avant: apparat autre « 80 c » (pâté)
  apres: note supprimée ; pâté mentionné dans changements
  justification: Simple pâté d'encre, sans incidence sur la lecture.
- ligne: 18
  avant: '\inc{6} : autre lecture 3'
  apres: '\inc{6} : autres lectures 3, 8'
  justification: La grande boucle basse fermée surmontée d'une petite tête reproduit aussi le 8 de 80 sur la même ligne.
- ligne: 16
  avant: 'Laudet : une seconde haste sous la barre peut faire tt'
  apres: t simple
  justification: La seconde haste est le jambage du p de pris (l. 15), qui descend dans la ligne.
remarques: Mme écrit Mm + délié aux l. 4, 12, 16 (transcrit Mme). Le long délié de Capitole remonte jusqu'à Hugo (l. 6). Le tiret final de la l. 13 est d'encre plus pâle.
resume: À Toulouse, Hippolyte Combes assiste le matin à la cathédrale Saint-Étienne à une messe anniversaire pour Mlle Calmels, à côté de Marguerite. Il fait le marché Victor-Hugo avec Marguerite et sa mère, déjeune à l'Automate, puis fait des visites et arrange son appartement. L'après-midi, il va avec Bonne-Maman (?) et Marguerite à Castanet (?), en tram de la rue Saint-Joseph jusqu'au terminus puis à pied, chez Mme de Labarthe, à qui il présente sa fiancée. Le soir, il rend visite à Mme Laudet (?). Comptes de trams, de l'Automate et du marché.
