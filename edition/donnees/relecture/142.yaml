difficultes:
- ligne: 2
  lemme: beau
  analyse: attaque montante, petite panse à hauteur d'oeil, boucle haute ; puis e, a fermé, u et long délié horizontal. La haste très longue qui descend jusqu'à la l. 3 se prolonge dans le d de midi (même axe, x ≈ .51). Le sens (« Soleil rendait appart. plus clair & plus beau ») convient ; « gai » n'emploie pas les trois éléments après l'initiale. Contrôle p2 (zoom .33 .05 .68 .12) confirme e-a-u.
  alternatives:
  - gai
- ligne: 6
  lemme: tantes
  analyse: t-a-n-t sous une longue barre, petit crochet de e, puis grande boucle fermée remontant au-dessus de l'oeil, séparée du T de Therèse par un blanc. Si le petit crochet n'est que la liaison du t, la grande boucle serait un e final agrandi (« tante »), attendu grammaticalement.
  alternatives:
  - tante
- ligne: 6
  lemme: Layral
  analyse: L bouclé, a, y descendant, puis r-a-l serrés ; trait descendant détaché avec point au pied = parenthèse fermante (zoom .82 .23 1.0 .33).
  alternatives:
  - Layrol
- ligne: 10
  lemme: '40'
  analyse: 'zoom .66 .55 .84 .61 ×3 : H suscrit à deux hastes, traverse prolongée jusqu''à la tête du chiffre suivant ; celui-ci = panse fermée en bas à gauche + haste droite montant à droite (aspect d, 4 fermé du guide § 6) ; puis 0 ; point. Le 3 de la l. 9 a deux panses, absentes ici. La traverse pourrait être un drapeau de 5 (5 en ſ), d''où 50 ; 30 (3 réduit en J) reste possible.'
  alternatives:
  - '30'
  - '50'
- ligne: 12
  lemme: – Ce
  analyse: trait épais horizontal, détaché, au pied de la ligne devant un C à crochet de tête et arc ouvert ; pourrait être le trait de base d'un L en £ (« Le Matin »), mais il ne porte pas la lettre suivante.
  alternatives:
  - Le Matin
- ligne: 16
  lemme: feuille speciale
  analyse: petit trait vertical haut entre feuille et speciale, dans le prolongement de la grande parenthèse de la l. 15 (fin de cette parenthèse après levée de plume) ou virgule ; non transcrit.
  alternatives:
  - feuille, speciale
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Sources : faire-part de 1889 (graphie « Layral »), PC-Annexe (« Layrals »), PC-Livre, Barbé 1917 (vague de froid, −8,3 °C à Toulouse le 4 févr.). Restent douteux « beau » (ou « gai »), « tantes » (ou « tante ») et l''heure 11 h 40 (ou 30, 50). Le « Journal, feuille spéciale » est un écrit distinct, non retrouvé.'
  alternatives: []
