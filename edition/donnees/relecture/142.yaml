remarques: Lieu repris de l'état antérieur (Millau), non nommé sur la page. Le renvoi « Cf. Journal, feuille spéciale » suppose un écrit séparé.
resume: Suite du dimanche 4 février 1917. Hippolyte Combes passe l'après-midi avec Marguerite, qui lui joue quelques morceaux et chante un peu. À 6 h 15, cédant aux instances de tous, il rend visite à l'oncle et à la tante Thérèse (Layral) ; temps très sec, rue déserte. Après le dîner, la causerie se prolonge jusqu'à 11 h 30 avec Mimi, arrivée par le train de 6 h ; il regagne sa chambre vers 11 h 40. Le matin, au réveil, il a été charmé par les sonneries des cloches des églises et chapelles de la ville (renvoi à un « Journal », feuille spéciale).
