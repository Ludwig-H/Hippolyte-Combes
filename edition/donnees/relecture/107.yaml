resume: Le 5 décembre 1916, après une matinée libre, Hippolyte Combes pousse jusqu'à Authie puis Bayencourt, à 3 km de Gommecourt tenu par les Allemands, et traverse Coigneux, village aux toits squelettiques. Le soir, il fait ses adieux au lieutenant Curtis, qui rejoint la 152nd Company A.S.C. Le 6, Curtis part vers 7 h 30, sans regret de la part d'Hippolyte Combes, qui le traite d'âne sans cervelle. Course le matin à Louvencourt et Raincheval. Le nouvel officier, le capitaine Williams, a 20 ans et raconte qu'il était office boy à 50 livres par an avant la guerre.
