remarques: Montants entiers avec f suscrit (l. 3, 4, 7, 8), montants à centimes sans f (l. 9, 10). Le prix brut du dentiste reste douteux (40 ou 20).
resume: Suite des comptes du samedi 3 février 1917, jour du départ de Toulouse. Hippolyte Combes paie le dentiste M. de Lersay pour un grand nettoyage et trois plombages (prix net 25 f), une broche, des trams à Toulouse, l'enregistrement des bagages de Marguerite et des étrennes à Marie. Il note aussi un supplément pour avoir voyagé en 2e classe, un billet à demi-place de Béziers à Millau et un repas au buffet de Bédarieux. Un filet clôt la liste ; le reste de la page est blanc.
