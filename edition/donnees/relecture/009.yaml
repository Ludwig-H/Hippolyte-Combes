resume: Le mercredi 2 août, encore une belle journée, Hippolyte Combes passe sa matinée libre assis dans l'herbe du camp ; l'après-midi, il conduit un chariot au fourrage, puis gagne Bailleul à pied et revisite à loisir l'église Saint-Vaast, la place et l'hôtel de ville. Au retour, il s'attarde devant des dentellières qui travaillent dans la rue devant leurs maisons, émerveillé par leur ouvrage. Il note cartes postales, une chemise, du galon noir pour lorgnons et des boissons. Le jeudi 3, par une chaleur estivale, il retourne à pied à Bailleul en s'arrêtant à l'ombre le long des champs d'avoine et de blé, parcourt la ville en tous sens (belles maisons rue d'Ypres et rue de Lille), se repose à Saint-Vaast, puis s'assied au fond du jardin de la ferme où il loge.
