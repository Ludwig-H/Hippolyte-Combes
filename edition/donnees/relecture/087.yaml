resume: Le dimanche 29 octobre, ciel lourd et averses, boue partout. L'après-midi, Hippolyte Combes va en auto à Acheux et Senlis enquêter sur la paille et le foin disponibles. Il rencontre le fils aîné de M. Duchateau, maréchal des logis d'artillerie dans l'armée belge, en permission, qui lui raconte les combats auxquels il a pris part. Le lundi 30, pluie torrentielle l'après-midi, qui le retient dans la cabane servant de mess ; vent de tempête et fortes averses toute la nuit.
