remarques: Le pâté de la l. 11 laisse une coulure sur la droite de la l. 12. Le début de la l. 6 est recouvert par le jambage du p de Cappel.
resume: Le samedi 29 juillet 1916, dès le petit déjeuner, le lieutenant Curtis emmène Hippolyte Combes chercher du fourrage à Saint-Jans-Cappel et au hameau du Mont-Noir, où il rencontre un homme du village (peut-être un vicaire) avec qui il parle de la dernière attaque de la division. L'après-midi, de 2 à 5 heures, il fait faucher et peser du fourrage dans un champ, allongé dans l'herbe et pensant à Marguerite. Il décrit la plaine couverte de houblonnières, les ballons captifs, le bombardement lointain et les avions anglais, puis se promène le soir à Saint-Jans-Cappel, dont il note en bas de page les maisons basses et l'église au clocher effilé. Il paie à sa logeuse 4 œufs et 2 litres et demi de lait (1 f 60) et 5 cartes postales (50 c).
