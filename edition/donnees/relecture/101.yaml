remarques: 'Encre noire. Ligne 10 : « ou » en marge, « des tranchées » écrit après un large blanc. Ligne 12 : la boucle haute sous « Bouzincourt » est la tête du f de « refuge » (l. 13).'
resume: Le 20 novembre 1916, à Acheux, temps couvert et boue ; Hippolyte Combes regarde passer de sa fenêtre camions, voitures, troupes revenant des tranchées et colonnes de prisonniers allemands. L'après-midi, course en auto à Bouzincourt ; au retour, arrêt (à Contay ?) puis attente dans la nuit noire à Englebelmer le long des murs du château. Petites dépenses (cartes postales, timbres, carnet). Le 21, brouillard et routes boueuses ; l'après-midi, en camion à Léalvillers ; au retour, au bureau, remarque désobligeante de Curtis qui le fâche.
