remarques: Encre noire virée au brun. Grand blanc de trois lignes avant le filet des comptes.
resume: 'Lundi 7 août 1916, par une chaleur accablante, Hippolyte Combes passe la matinée avec Curtis à chercher de nouveaux cantonnements et un mess pour les officiers. Venu chercher ses rations, il trouve la compagnie partie : elle a changé de cantonnement à 9 heures et s''est installée à l''autre extrémité du village. Il change lui aussi de logement et prend une grande chambre au premier étage d''une maison au-dessus du bureau de poste, route de Bac-Saint-Maur. Il finit la journée avec Maurin. Comptes : cuisine, oeufs et lait pour deux jours, bière.'
