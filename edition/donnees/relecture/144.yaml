difficultes:
- ligne: 5
  lemme: En
  analyse: Zoom [.78 .19 .99 .25] ×3 — haste inclinée descendant de la ligne de tête, petite boucle à la base, puis une arche ; ni boucle d'E, ni forme ɑ + accent des « à » de la page (l. 8, 10, 12).
  alternatives:
  - à
- ligne: 15
  lemme: av
  analyse: Trois attaques (a, v) puis long délié horizontal ; un délié peut valoir e, d'où « ave(c) » possible.
  alternatives:
  - avec
- ligne: 16
  lemme: serrés
  analyse: s montant, e, rr, e, finale crochue montante, dont le crochet de tête peut être l'accent décalé.
  alternatives:
  - serres
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: Contrôlé sur l'image ; « couverte » (l. 7) tranché, « permissre » (l. 6) admis comme abréviation ; reste incertain « En » (l. 5).
