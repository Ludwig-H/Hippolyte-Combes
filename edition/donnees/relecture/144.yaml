remarques: Encre violette. Interligne un peu plus large entre les l. 4 et 5.
resume: Après une nuit très froide à Saint-Flour, passée en salle d'attente puis dans un compartiment de 1re classe garé sur la voie, Hippolyte Combes part à 5 h 20 en 2e classe avec des permissionnaires. Correspondance à Brioude (7 h 30), d'où il repart à 8 h 30 dans un express P.L.M. Clermont à 10 h, Gannat à 11 h ; ciel bas et neige continue sur la campagne. Gien à 3 h 45, Montargis à 4 h 20.
