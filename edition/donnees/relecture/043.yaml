remarques: 'Canada in Flanders : premier volume de l''histoire officielle du corps canadien par Max Aitken (lord Beaverbrook), 1916.'
resume: Le jeudi 14 septembre 1916, après le déjeuner, Hippolyte Combes se rend à cheval à Acheux, où les bureaux de la Mission française sont installés dans le parc du château, en maisonnettes de toile et de planches ; il fait route avec Lereux et note le premier froid d'automne. Il dépense 30 c en cartes postales et 50 c pour une ordonnance qui a sellé son poney. Le vendredi 15, après une nuit froide, il va à travers champs à la cantine de la gare de Raincheval, où se tiennent des exercices de grenades et de mines ; il y achète Canada in Flanders (1 f 25).
