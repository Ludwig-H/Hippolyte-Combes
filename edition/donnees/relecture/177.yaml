resume: 'Vendredi saint 6 avril 1917 : Hippolyte Combes est conduit en auto à Toutencourt, où un membre du personnel du bureau de la Mission française du Q.G. de la Ve armée vient payer la solde (78 f 75). Il goûte les rues ensoleillées du village tranquille depuis le départ du Q.G. et des troupes, revient à Hérissart, repart avec l''officier pour Toutencourt et Rubempré ; bruine au retour, après-midi libre avec averses. Le soir, il cause longuement de l''Australie avec Wentworth devant le poêle et lit des brochures. Samedi 7 : grand froid, vent violent ; courses à Contay et Acheux, retour par Léalvillers, Toutencourt et Rubempré ; promenade sur la route de Contay écourtée par les rafales.'
