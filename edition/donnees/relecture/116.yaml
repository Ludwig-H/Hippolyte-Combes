resume: Le 28 décembre 1916, après une nuit de forte gelée et une violente canonnade du côté d'Hébuterne, le dégel rend les routes boueuses. Hippolyte Combes va à pied à Léalvillers et en revient ; sa voiture étant à l'atelier, il a la journée libre et assiste le soir au concert des « 13th Corps Archie Singers » au foyer du Y.M.C.A. Il note l'achat de cirage, l'envoi d'une boîte recommandée à l'opticien Imbert à Paris et le prix du concert. Le 29, par temps doux, il fait le matin une tournée en voiture Sunbeam du major Levy à Raincheval, Le Quesnoy et Louvencourt, rentre à 3 heures et peut travailler fenêtres ouvertes.
