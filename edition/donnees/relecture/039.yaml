resume: 'Le samedi 9 septembre 1916, la compagnie quitte Marquay vers 9 h 30 après le défilé de trois brigades de la division. Chevauchée lente par Ligny-Saint-Flochel et un plateau où se trouve une école de mortiers de tranchée, avec vue panoramique ; beau temps, poussière sur la route. Vers 13 h, fin de la première étape au hameau de Monts-en-Ternois : cantonnement dans une grande ferme, ancien monastère, avec jardin fleuri. Invité par le capitaine West à prendre ses repas au mess des officiers, Hippolyte Combes dort sur deux bancs de jardin. Il note 3 francs donnés à M. Dupuich à Marquay et un pourboire.'
