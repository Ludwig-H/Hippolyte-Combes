resume: Le samedi 2 septembre, Hippolyte Combes passe la matinée dans les champs détrempés de rosée, sous un ciel couvert, et a l'après-midi libre ; il note une dépense de blanchissage (une chemise, un gilet, une paire de chaussettes, un mouchoir) et 10 centimes de divers. Le dimanche 3, malgré un ciel menaçant, il va à pied jusqu'à Saint-Pol, grisé par le grand air et la vue circulaire du plateau. Il se repose longuement à l'église, parcourt les rues de la petite ville banale et rentre avant la pluie.
