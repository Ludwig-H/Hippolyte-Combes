resume: 'Dimanche des Rameaux 1er avril 1917 : temps froid, averses torrentielles puis neige le soir ; courses en auto à Belle-Église, Pierregot et Rainneville ; grande fatigue nerveuse ; compte du mess arrêté au 31 mars (27 francs 50). Le lundi 2, gel puis journée libre au bureau devant le feu, neige l''après-midi, dégel le soir ; blanchissage et clous de souliers. Le mardi 3, courses à Toutencourt (chez Me Bien-aimé, notaire) et Rubempré ; champs blancs de neige vus en descendant la côte d''Hérissart, puis dégel rapide et temps radouci.'
