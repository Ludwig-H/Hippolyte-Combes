remarques: 'Total implicite des trams : 10+10+10+60+10 = 1 f (non écrit). Commentateur historique : registre matricule classe 1896 (47, rue du Taur, près de Saint-Sernin) ; Mérimée PA31000123 pour Labit ; Mad^{ne} probablement Madeleine Calmels-Vincens, sœur aînée de Marguerite (f. 66 v°), non une tante.'
resume: 'Le lundi 29 janvier 1917, Hippolyte Combes se lève à 7 h 30 dans sa chambre de Toulouse, allume un grand feu et goûte le confort retrouvé. À la gare, il se fait livrer non sans peine un panier de fleurs de Nice dont l''étiquette et la feuille postale ont disparu. L''après-midi, avec Marguerite et Madeleine, il visite longuement la basilique Saint-Sernin et ses cryptes, qui réveillent toute sa jeunesse, puis les magasins du Capitole et Labit et la rue d''Alsace. Le soir, après le tram de la Côte Pavée, il quitte Sainte-Marie à 9 heures. Comptes : tramways, savonnettes, brosse à dents pour Marguerite, cartes postales, entrée des cryptes.'
