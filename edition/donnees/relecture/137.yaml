remarques: Disposition des l. 8–9 à confirmer (ajout interlinéaire « gare… fleurs »). Le mot « boulangeon » (l. 18 et 20), désignant sans doute un pain ou une pâtisserie, reste à identifier.
resume: 'Jeudi 1er février 1917 à Toulouse, par grand froid et soleil. Hippolyte Combes rend visite à Mme de Labarthe et aux dames Delsol, ses voisines, retrouve Marguerite et sa sœur au Capitole et remonte avec elles en tram à Sainte-Marie. L''après-midi, il descend en ville avec Henriette, passe à la gare pour un panier de fleurs, revoit sa famille à Nazareth et choisit une montre en or chez Pfister ; la conférence à la chapelle de l''archevêché n''a pas lieu. Le soir, marchant jusqu''à la rue de Languedoc dans la ville silencieuse, il se sent détaché de Toulouse et dit vouloir partir sans regret. Comptes : trams, nourriture, remboursement aux voisines (œufs, beurre).'
