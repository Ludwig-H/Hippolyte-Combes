difficultes:
- ligne: 1
  lemme: \sl{26}
  analyse: le soulignement part sous la fin de mardi et court obliquement jusqu'après 26
  alternatives:
  - \sl{mardi – 26}
- ligne: 3
  lemme: Reposé jardin
  analyse: un seul trait court, oblique, au-dessus de la ligne d'œil entre Repose et jardin, de même forme que l'accent de à (l. 9) et de Marché (l. 19) ; il vaut accent et non tiret
  alternatives:
  - Reposé – jardin
- ligne: 5
  lemme: \inc{Lgs}
  analyse: boucle haute ouverte à gauche puis descente bouclée (L en £), suivie de deux hastes descendantes réunies au pied ; aucune barre ; banc est empâté d'encre, sans rature
  alternatives:
  - 1 H
  - Lgt
- ligne: 12
  lemme: \inc{Therese}
  analyse: 'initiale : haste et forte barre de tête comme le T de Tramway (l. 11) ; puis h et cinq ou six éléments ; descente finale et parenthèse fermante au bord droit ; trait plus fin'
  alternatives:
  - Germaine
  - Thomas
- ligne: 13
  lemme: 15^{f} ... 1 f
  analyse: 'après 15, petit signe suscrit (f) ; plus à droite 1 + haste à boucle de tête, de même forme que le f de « Metro : 1 f » (l. 12), sous la fin de l''ajout Coupe (chvx ; on pourrait lire ce dernier signe 5 en ℓ, d''où 15 f 15'
  alternatives:
  - 15^{f}15
- ligne: 14
  lemme: \ill
  analyse: m + jambages (u/r) + m, signe suscrit (barre de t ou tilde) puis i pointé ; ni montre ni mesure ne rendent tous les traits
  alternatives:
  - montre
  - mesure
- ligne: 19
  lemme: 8^{f}75
  analyse: 'après 8, deux petits signes suscrits (f crochu, 7 barré), puis grande haste bouclée (5 en ſ) : 8 f 75 ; on pourrait lire 8^{75} f'
  alternatives:
  - 8^{75}f
- ligne: 19
  lemme: \inc{15 c}
  analyse: au bord droit, un signe en k (haste + boucle) ; un second k plus petit à droite de 30 c (l. 20) appartient sans doute au même montant, écrit en travers faute de place
  alternatives:
  - 1 c
  - 10 c
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Montant du billet : 15 f retenu (le 1 f suivant a la forme du f de la l. 12 et se place sous l''ajout Coupe (chvx, dont il est le prix) ; 15 f 15 reste possible et est signalé dans l''apparat. Therese, Envois et l''objet acheté chez Christofle restent incertains ; la destination de la couronne n''est pas dite par le carnet.'
  alternatives: []
