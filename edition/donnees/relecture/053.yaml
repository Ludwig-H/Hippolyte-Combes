remarques: 'Seconde lecture : l. 3 tiret supprimé (accent de Reposé) ; montant du billet (l. 13) tranché pour 15 f ; l. 12 Therese, l. 14 objet Christofle, l. 19 consigne et l. 20–21 intitulés restent incertains.'
resume: 'Dernière journée de permission à Paris le mardi 26 septembre 1916 : déjeuner boulevard Saint-Germain, repos au jardin de Notre-Dame, magasins de l''Hôtel-de-Ville, longue halte au square de la Tour Saint-Jacques. Après le dîner, Hippolyte Combes gagne lentement la gare d''Orsay par les quais et part vers 8 heures du soir pour Toulouse. Les comptes détaillent transports, billet à quart de place, achats chez Christofle, livres de Zyromski et Maeterlinck, couronne de fleurs artificielles, képi au Bon Marché et cartes de Verdun et de Roumanie.'
