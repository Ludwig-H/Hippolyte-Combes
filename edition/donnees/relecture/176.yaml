resume: 'Mercredi 4 avril 1917, par une tourmente de neige, Hippolyte Combes court à Toutencourt de ferme en ferme pour acheter du fourrage ; l''après-midi, libre, il écrit dans sa chambre et lit les journaux au bureau. Il note une coupe de cheveux (90 c) et des carnets de timbres (10 f ?). Le Jeudi saint 5 avril, belle journée ensoleillée : course en auto à Acheux par Contay, Warloy et Varennes, villages calmes et déserts sans troupes. Après le dîner, promenade près d''Hérissart, coucher de soleil derrière les cyprès du cimetière ; le soir, prêche de la Passion à l''église du village, nuit de pleine lune.'
