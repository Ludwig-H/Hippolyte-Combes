resume: 'Le lundi 1er janvier 1917, par un temps pluvieux et brumeux mais si doux qu''on ne se croirait pas en hiver, Combes fait le matin une course en auto à Toutencourt et au Quesnoy, puis l''après-midi se rend à Saulty par Authie, Pas-en-Artois et la grande route d''Arras, sous une ondée fine et intermittente. M. Carluvant, son logeur, lui annonce qu''il devra quitter la maison sous peu, le propriétaire tenant à s''y installer ; Combes regrette de partir et de perdre sa chambre chaude. Le mardi 2, ciel nuageux et temps doux, presque chaud : le matin, à la ferme Cuisinier de Louvencourt, il expertise une machine endommagée, puis passe à Raincheval ; l''après-midi, il va en auto à Belle-Église Farm, à la ferme du Quesnoy et à Toutencourt, et rentre à 6 h du soir, très fatigué par plusieurs heures de voiture. Dépenses : poudre dentifrice Calvert à la cantine de Louvencourt (60 c), cloutage de bottes neuves à Acheux (1 f).'
