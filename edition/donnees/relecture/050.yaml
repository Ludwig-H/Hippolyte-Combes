remarques: Le texte se poursuit au f. 26 r° (« 25 Lundi. (Suite) »).
resume: 'Lundi 25 septembre 1916. Debout vers 7 heures sous un ciel où brillent encore le croissant de lune et deux étoiles, Hippolyte Combes est prêt à partir en permission. Il doit encore aller à Forceville avec le lieutenant Ford pour du fourrage vert. À midi, il monte sur le dernier wagon du convoi allant à la gare de ravitaillement, puis gagne à travers champs la gare d''Acheux-Varennes, dépose ses colis au bureau du R.T.O., déjeune au village et attend longtemps dans son compartiment du petit train départemental, par une chaleur intense. Comptes : pourboire au palefrenier, biscuits, déjeuner.'
