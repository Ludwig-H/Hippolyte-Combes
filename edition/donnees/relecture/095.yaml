remarques: 'Les mots à l''encre pâle (l. 11–13, 22) mériteraient un contrôle sur l''original pour décider s''il s''agit d''ajouts dans des blancs réservés. Seconde lecture : vers (l. 8), à (l. 20), Lealvillo (l. 22) confirmés comme incertains après zoom ; « or » (l. 11, encre pâle, forme u + n barré) et le point après « Coy » (l. 13, peut-être point d''i de « divon ») restent à contrôler sur l''original.'
resume: Le lundi 6 novembre 1916, par temps de rafales et d'averses, Hippolyte Combes va à pied et en camion à la ferme de Belle-Église, à Arquèves, pour une question de pétrole, puis fait l'après-midi une longue course en auto vers Coisy par Hérissart et Rubempré pour acheter paille et foin, au milieu de bois aux couleurs d'automne. Il regrette d'avoir quitté la 152nd Company et cherche le moyen de rester à la 18th Division. Le mardi 7, sous la pluie et sans rien à faire, il renonce à aller à Albert faute de camion et observe de sa fenêtre le flot ininterrompu de véhicules et de troupes sur la route de Léalvillers.
