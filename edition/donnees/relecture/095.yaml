  analyse: 'À vérifier sur l''image : 1 049 caractères ; sources : OH 1916-I p. 274, OH 1916-II p. 462 et 480, Statistics 1922 p. 846, Fernand-Laurent/Tessan 1917 p. XIV, Puckle 1917 p. 28 ; pas de p2, rédigé sur la p1. Le nom de Léalvillers (« Lealvillo ( ) ») et les mots à l''encre pâle restent à contrôler sur l''original. La fiche « commanderie templière » de Belle-Église donnée par l''édition antérieure n''a pas été retrouvée et n''est pas reprise. — Seconde lecture : nom relu L-e-a-l + haste bouclée + élément court + ll + o ; Léalvillers retenu en identification, la forme graphique reste incertaine.'
  alternatives: []
