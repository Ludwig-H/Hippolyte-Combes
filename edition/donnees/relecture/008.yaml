remarques: Le lieu de cantonnement (ferme près de Saint-Jans-Cappel) est déduit du contexte des pages voisines.
resume: Le mardi 1er août 1916, la chaleur reste accablante et Hippolyte Combes, libre toute la journée, s'installe sommairement dans sa mansarde. L'après-midi, il se rend à pied à Bailleul (une demi-heure de trajet), parcourt les rues principales et regarde longuement l'église et l'hôtel de ville, comparant la place à celles d'Hazebrouck et de Béthune. Il rentre vers 6 heures. Ses comptes notent le lait et la bière payés à la fermière, des cartes postales et quatre pièces de cuivre achetées à Bailleul chez un M. Guetin (lecture incertaine).
