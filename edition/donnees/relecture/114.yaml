remarques: 'Le propos du capitaine est la « gaffe » du 24 décembre à Louvencourt (f. 56 v° : « Bloody France etc. ! », hésitation à la rapporter à la French Mission). Les trois points au-dessus de « du » (l. 6) sont ceux des signes finaux de la l. 5, non des points d''i.'
resume: Le lundi 25 décembre 1916, jour de Noël que la page ne nomme pas, Hippolyte Combes sort d'une nuit d'insomnie, toujours sous le coup du propos fâcheux tenu la veille à Louvencourt par son capitaine (Williams), et se demande s'il doit en faire rapport à la Mission française ; une lettre de Marguerite du 17 le hante aussi. Par un temps affreux (averses, vent de tempête), il passe une journée de repos dans sa chambre et se rassérène peu à peu. L'après-midi, il assiste dans la baraque du Y.M.C.A. à un concert de chansons comiques et de saynètes ; il note 80 c de blanchissage. Le soir, ayant retrouvé calme et équilibre, il quitte vers 9 h le capitaine Williams et regagne sa chambre, entrant quelques minutes au Y.M.C.A., où le concert a repris ; ciel étoilé, temps doux, grand silence de la nuit sans écho de canonnade.
