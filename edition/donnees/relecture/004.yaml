resume: 'Le jeudi 27 juillet 1916, Hippolyte Combes va à pied à Renescure après le petit déjeuner, sous un temps gris. Il y visite deux châteaux du Moyen Âge (fossés, tours d''angle, donjon) et l''église à double nef. L''après-midi, il se rend à cheval à Hazebrouck (grande place, église, square). La soirée est mélancolique : il arpente l''allée des jardins potagers devant son cottage, dans le brouillard. Les comptes notent plumes, carnets de timbres, cartes postales, un cahier, une carte d''état-major, des élastiques de bretelles, et la solde de 84 francs.'
