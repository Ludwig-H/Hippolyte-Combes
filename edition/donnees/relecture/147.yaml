remarques: Le nom du café (l. 18) reste à confronter avec d'autres occurrences à Hérissart (148 sqq.) ; le lexique porte « café Charlet (147) », lecture non confirmée ; p1 lisait Chalelton, p2 Chatelain (point d'i après le mot).
resume: En se rendant au bureau, Hippolyte Combes apprend de Mme Delille que le capitaine Williams a quitté Acheux pour Hérissart. À la Mission française, il trouve un mot du capitaine et lui téléphone. De retour chez les Carluvant, atterrés, il fait ses paquets ; l'auto arrive vers 4 h 1/2 et l'emmène à Hérissart par Raincheval et Puchevillers, sous une bise glaciale. Le Town Major lui donne une petite chambre au premier étage d'un café d'angle, avec vue sur la place et l'église.
