  analyse: 'À vérifier sur l''image : 1 029 caractères ; sources : OH 1916-I p. 304, Long, Long Trail (QG de la Fifth Army à Toutencourt, hôpitaux d''évacuation de Puchevillers), Palissy PM80005288 (église Saint-Martin, Hérissart) ; seule la lecture p1 existe. Le nom du café se lit « Chalelton », lecture incertaine, et non « Charlet » comme dans la lecture antérieure et R7 F2. Mme Delille et le capitaine Williams ne sont pas identifiés. Le « Mme Delille, postière » de l''édition antérieure n''est pas attesté. (p2 : nom du café relu \inc{Chatelain}, voir ci-dessus.)'
