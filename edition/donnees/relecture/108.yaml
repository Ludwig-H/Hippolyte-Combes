- ligne: 16
  avant: \ind Diné seul, off. allé à Hérissart Rentré
  apres: \ind Diné seul, off. allé à Herissart Rentré
  justification: Au zoom ×5 (/tmp/hc_bands/z_rem03_108_d.jpg), le papier est entièrement vierge au-dessus de « e-r » dans « Herissart » (le jambage du « p » de « l'espace » l. 15 touche uniquement le sommet de la première haste du « H », et le point isolé plus à droite est le point du « i »). Même graphie sans accent aux cl. 095 l. 6, 104 l. 23 et 168 l. 6.
