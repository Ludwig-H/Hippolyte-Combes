resume: 'Le jeudi 7 décembre 1916, Combes passe la journée en auto. Le matin, à Belle-Église (Arquèves), il attend longtemps le capitaine Williams parti jusqu''à Raincheval et s''amuse des enfants de la fermière belge, Mme Houtteman (?). L''après-midi, par Hédauville, il gagne Englebelmer, village presque désert où ne restent que les troupes anglaises ; il attend devant la ferme qui abrite le Town Major, tandis que tonnent les canons anglais. Le soir, il dîne seul, l''officier étant à Hérissart. Le vendredi 8, sous la brume et la bruine, routes affreuses : course à Saint-Léger-lès-Authie le matin, puis ferme de Belle-Église et Arquèves, où l''on a commencé à battre la paille.'
