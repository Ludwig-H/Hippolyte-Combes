collation_2026_11:
- ligne: 1
  avant: 7 \sl{Jeudi} – \hfill — \sl{Dec^{bre} 1916} —
  apres: 7 \sl{Jeudi}. \hfill — \sl{Dec^{bre} 1916} —
  justification: 'À droite de « Jeudi », deux signes distincts figurent : en haut au-dessus du « i », le petit tiret couché qui sert de point à l''« i » (identique à celui de « midi » juste au-dessous à la l. 2), et plus à droite à mi-hauteur, un point rond net « . » hors du trait de soulignement (et non un tiret court « – »).'
- ligne: 2
  avant: \ind[2] Matin & après-midi en
  apres: \ind[2] Matin & apres-midi en
  justification: 'Aucun accent grave n''est tracé au-dessus de « apres » : l''espace interlinéaire sous l''en-tête est entièrement vierge au-dessus de « a-p-r-e-s » (contrairement à « Après-midi » l. 7, « après coup » l. 14 et « Après-midi » l. 26 sur la même page).'
- ligne: 3
  avant: auto. – Matin, à Belle-Eglise, arqueves
  apres: auto. – Matin à Belle-Eglise, arqueves
  justification: 'Aucune virgule ne suit « Matin » : le jambage final du « n » plonge directement sous la ligne sans levée de plume selon le ductus habituel de Combes (cf. « constipation » cl. 110 l. 3, « explication » cl. 117 l. 9), et le papier entre « Matin » et « à » est entièrement blanc.'
- ligne: 8
  avant: Hedauville, Resté près d'1 h ds ce village
  apres: Hédauville, Resté près d'1 h ds ce village
  justification: Au zoom ×5 (/tmp/hc_bands/z_rem03_108_d.jpg), un net accent aigu vertical-oblique est tracé isolément juste au-dessus du « e » de « Hédauville », entre la seconde haste du « H » et la hampe du « d » (bien au-dessous de « Après » l. 7, dont seul le jambage du « p » descend plus à droite sur la hampe du « d »). Accent réel supprimé à tort lors de la relecture.
- ligne: 15
  avant: répercutées à travers l'espace – cme gémisst
  apres: repercutées à travers l'espace – cme gémisst
