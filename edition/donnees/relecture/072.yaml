  - ds 1
- ligne: 3
  lemme: pareille
  analyse: 'Zoom [.10 .075 .38 .135] ×3 : p, puis minimes et boucles compatibles avec a-r-e-i, deux hastes parallèles (ll) coupées par la descente du p de « employée », e en délié. Lecture retenue pour le sens ; graphie compressée.'
  alternatives:
  - qu'hier
  - pareil
- ligne: 2
  lemme: Matinée
  analyse: 'Court trait horizontal sous « Mat » (zoom [.10 .075 .38 .135]), distinct du soulignement de la date (au-dessus de « Matinée », zoom [.08 .04 .26 .095]) ; non transcrit : trait de plume isolé.'
  alternatives:
  - \sl{Mat}inée
- ligne: 8
  lemme: nuageux
  analyse: 'n-u-a-g-e puis délié horizontal terminé par une petite boucle : finale -ux écrasée (zoom [.36 .29 .80 .37] ×2).'
  alternatives:
