changements:
- ligne: 1
  avant: Mer. 11 \hfill Oct / 16
  apres: \sl{Mer. 11} \hfill Oct^{bre} /16
  justification: Trait appuyé sous « Mer. 11 » ; après le t de Oct, boucle haute (b) et ondulation descendante (-re) ; « /16 » sans espace, barre oblique longue.
  confiance: haute
- ligne: 2
  avant: Matinée employée de =
  apres: \ind Matinée employée d'1
  justification: 'Après le d, petit crochet (apostrophe) relié à une haste descendante à trait d''attaque : forme « 4 » du chiffre 1 ; aucun double trait horizontal (=). Ligne en retrait.'
  confiance: moyenne
- ligne: 3
  avant: manière qu'hier. Sous pluie battante,
  apres: manière pareille. Sous pluie battante,
  justification: Initiale p à jambage droit sans panse de q, a, r, e, i, deux hastes (ll), e en délié ; aucune boucle montante de h ni apostrophe. La longue haste qui coupe le mot descend du p de « employée » (l. 2). Cf. 042 « d'1 manière permanente ».
  confiance: moyenne
- ligne: 6
  avant: Rentré billet, casque & cape tt ruisselants
  apres: Rentré billet, casque & cape tt ruisselants.
  justification: Point net sous la fin de « ruisselants », à la ligne de base.
  confiance: moyenne
- ligne: 8
  avant: Tt le jour, ciel nuageux et temps
  apres: \ind Tt le jour, ciel nuageux et temps
  justification: Ligne commencée en retrait (x ≈ 0,10).
  confiance: haute
difficultes:
- ligne: 2
  lemme: d'1
  analyse: 'Zoom [.45 .035 .57 .095] ×3 : d à petit crochet montant (apostrophe), puis tracé en « 4 » ouvert en tête, haste descendant sous la ligne = 1 à trait d''attaque. Le même d à crochet sert pour « ds » l. 4, mais « ds 1 manière » est exclu par le sens ; « d''1 manière pareille » retenu.'
  alternatives:
