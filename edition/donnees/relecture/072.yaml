- ligne: 6
  lemme: billet,
  analyse: Virgule = court trait vertical à la ligne de base devant « casque » (zoom [.18 .185 .42 .245]) ; maintenue.
  alternatives: []
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Lieux : Barlette, hameau de Franqueville, est le cantonnement des pages voisines (070–074) ; « Rentré billet » y renvoie, d''où « Barlette et bois de Ribeaucourt ». Sources citées par le commentateur (FSPB 1914, Inventaire Franqueville, Fernand-Laurent 1917, JMO 7/Bedf 11 oct. 1916) non vérifiables sur l''image.'
  alternatives: []
