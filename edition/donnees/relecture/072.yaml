- ligne: 9
  lemme: pluvieux
  analyse: 'Zoom [0 .35 .36 .42] ×3 : p, l bouclé, trois minimes dont la dernière pointée, délié horizontal, puis grand x plongeant en boucle qui recoupe le délié. -vieu- réduit ; mot sûr par le sens (« temps pluvieux », cf. 073 « Temps pluvieux »). Suivent un point à la ligne de base et deux tirets.'
  alternatives:
