remarques: 'Blanc de la moitié inférieure : la journée suivante (12 octobre) commence au cliché 073.'
resume: 'Mercredi 11 octobre 1916. La matinée se passe comme la veille : sous une pluie battante, Hippolyte Combes doit conduire des wagons dans un champ de luzerne derrière le grand bois de Ribeaucourt. Il rentre au cantonnement, casque et cape ruisselants. Après-midi libre ; ciel nuageux et temps pluvieux toute la journée. La seconde moitié de la page est restée blanche sous un filet.'
