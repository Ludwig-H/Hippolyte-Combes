remarques: 'Encre brune plus pâle sur « Cornailles », « kilomètres de Marquay », « moissonnés » : simple appauvrissement de la plume entre deux trempages, non un ajout ; la note de critique de la première lecture est retirée.'
resume: 'Samedi 26 août 1916, à Marquay. Hippolyte Combes a bien dormi malgré une chambrette étroite aux murs moisis et s''est levé à 7 h 30. Après une matinée de fortes ondées, la pluie cesse l''après-midi ; il se promène jusqu''au village de Bailleul-aux-Cornailles, à 2 ou 3 km, par une route entre blés moissonnés et avoines, sur un plateau dominant bois et clochers. Avant un dîner tardif, il assiste à un beau coucher de soleil sur une route. Il se plaint de son logement : enfants atteints de coqueluche, maison sale et moisie.'
