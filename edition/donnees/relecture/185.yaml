remarques: 'Cambrai était encore aux mains des Allemands en avril 1917 (jusqu''au 9 octobre 1918) : l''annonce rapportée relève de la rumeur ou d''un projet. Le « off. » de la l. 5 n''est pas nommé.'
resume: 'Samedi 28 avril 1917, temps couvert puis beau soleil ; vers 5 h 1/4, course en auto à Pierregot. Un officier revenu de Bournemouth annonce que l''on quittera bientôt Hérissart pour Cambrai ; Hippolyte Combes regrettera les panoramas des environs. Après le déjeuner, promenade en pleine campagne. Dimanche 29, journée de printemps ; le matin, l''auto casse deux ressorts en arrivant à Contay : retour à Hérissart à pied, puis sur une voiture-citerne. L''après-midi, promenade sur la route de Mirvaux avec le lieutenant Gilbert, causerie assis sur un talus ; beau coucher de soleil, nuit étoilée.'
