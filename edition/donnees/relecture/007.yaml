remarques: 'Ponctuation relue signe par signe : plusieurs points appartiennent à une autre ligne (point du i d''Assis sous comble, l. 7 ; point du i de dormi près d''aise, l. 9). Hampes et descendantes empiètent sur les lignes voisines : tête du f de fem. (l. 7) entre Jans et Cappel (l. 6) ; g de à g. (l. 7) croisant la fin de ruisseau (l. 8) ; g de grenier (l. 10) devant ecrit (l. 11) ; f de fermière (l. 17) traversant le filet. Le retrait de la l. 27 (x ≈ 0,09 contre 0,04 à la l. 26) est marqué bien que la phrase continue. Confirmés par zooms : crasseuse., archi-comble Hoes, aise., lu et, off :, plaine fertile, 75c (7 à barre médiane).'
resume: Le dimanche 30 juillet 1916, après une nuit troublée par les rats sur une paillasse crasseuse, Hippolyte Combes gagne à pied, à travers les houblonnières, l'église comble de Saint-Jans-Cappel (hommes à droite, femmes à gauche), puis lit et rumine assis sur un petit pont. Il passe l'après-midi au grenier à dormir, lire et écrire, et contemple d'une fenêtre la plaine fertile, semée de boqueteaux et de houblonnières, sous un ciel qui rosit. Il note 5 f de pourboire au chef cuisinier Hancock et 75 c à la fermière pour du lait et de la bière. Le lundi 31, par une chaleur accablante, il va le matin en auto avec ses officiers au point de ravitaillement, à Bailleul, puis chez un fermier au nom incertain (Terrier ?) ; l'après-midi, en plein soleil, il doit conduire un chariot aux champs pour le fourrage vert. Le soir, il s'assied dans les champs voisins de sa ferme, face aux moulins à vent d'une crête boisée.
