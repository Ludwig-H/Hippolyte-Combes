remarques: 'Le lundi 22 n''a pas d''entrée propre : il est résumé par « Hier » le 23. Distance de la l. 11 non tranchée (kilog. / kil 9).'
resume: 'Samedi 20 janvier 1917 : repos toute la journée, à la chambre ou au bureau ; la neige ne fond pas et il gèle très fort. Dimanche 21 : Hippolyte Combes va en auto à Louvencourt voir Mme Cuisinier et en revient à pied, à sa demande, par une route durcie (environ 2 km) ; il achète à la cantine trois boîtes de graisse Wren''s Dubbin (30 c) et commence l''après-midi ses préparatifs de départ. Mardi 23 : liberté entière ce jour et la veille ; le lundi 22, le capitaine Williams est allé seul à Amiens. Température très basse, vitres couvertes de glace, neige étincelant au soleil de midi.'
