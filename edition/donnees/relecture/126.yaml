difficultes:
- ligne: 3
  lemme: \inc{à}
  analyse: 'petit a fermé lié à droite, puis tiret horizontal haut et à droite (accent détaché) : tracé identique à « à Amiens » l. 18 et « à pied » l. 11 ; ni boucle ni descente des & de la page (l. 4, 17, 19) ; « et » supposerait une haste de t absente'
  alternatives:
  - et
  - '&'
- ligne: 3
  lemme: toilette
  analyse: t initial bouclé, o, l haut, e, tt sous la barre (confondue avec le soulignement du mois qui passe au-dessus), e et délié remontant
  alternatives: []
- ligne: 9
  lemme: Matinée
  analyse: finale -née noyée dans un pâté d'encre ; le e final remonte en crosse
  alternatives:
  - Matin
- ligne: 10
  lemme: Cuis^{r}
  analyse: C, u, i (point en tiret décalé), ſ long descendant, r surélevé surmonté d'un petit crochet, point
  alternatives:
  - Cuis^{er}
- ligne: 11
  lemme: \inc{kil'g.}
  analyse: 'k bouclé, i pointé, l ; petit trait suscrit à crochet ; dernière lettre à boucle fermée et longue descente terminée en crochet à gauche, comme les g de « Neige » (l. 12, 22) et « glace » (l. 20), plus longue que le 9 de « 1917 » (l. 1) ; point bas. Sens attendu : kilomètres'
  alternatives:
  - kilog.
  - kil^{o}g.
  - kil 9
- ligne: 16
  lemme: départ
  analyse: d et e noyés dans un pâté ; accent non vérifiable, conservé
  alternatives:
  - depart
- ligne: 17
  lemme: '['
  analyse: trait vertical à peine incurvé, petit pied à droite, sans retour en tête ; limité à la hauteur de la l. 17, il s'arrête au-dessus du H de « Hier » (l. 18)
  alternatives:
  - (
  - '|'
- ligne: 17
  lemme: entière
  analyse: 'un seul trait horizontal au-dessus de -re : barre du t décalée ou accent grave'
  alternatives:
  - entiere
- ligne: 18
  lemme: Cap^{ne} W
  analyse: Cap à p descendant, petite ondulation suscrite ; le trait qui suit W est la fin du jambage du j de « aujdhui » (l. 17), non une lettre
  alternatives:
  - Cap^{n} W
- ligne: 19
  lemme: Tempér^{re}
  analyse: aucun accent distinct sur le e ; l'ondulation suscrite après r vaut abréviation (même tracé que Cap^{ne}, l. 18)
  alternatives:
  - Temper^{re}
