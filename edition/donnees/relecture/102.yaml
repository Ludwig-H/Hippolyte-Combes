remarques: Lieu de séjour (Acheux) repris de l'état antérieur, non nommé sur la page.
resume: 'Le 22, Hippolyte Combes souffre d''indigestion et de diarrhée (sept selles dans la nuit), craint la dysenterie, se ménage et va mieux le soir. Il paie 75 c à son propriétaire, M. Carluvant, tailleur, pour avoir élargi ses culottes neuves. La nuit est très noire dès 5 h ½ et la rue boueuse. Le 23, belle journée froide : repos le matin sur le lit du clerk au bureau, l''après-midi course en auto à Amplier, Authieule et Authie. Blanchissage : 1 f 25.'
