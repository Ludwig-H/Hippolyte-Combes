resume: 'Le jeudi 1er mars 1917, très belle journée : Hippolyte Combes va l''après-midi en auto à Rubempré, au château, puis à Montigny et à Fréchencourt, où il cause avec le fils du maire dans ses champs vers Pont-Noyelles. Après le thé, promenade sur la route de Contay : brume, plateau à large vue, moulins, grands crucifix aux carrefours. Le soir, il marche sur la route de Toutencourt sous un clair de lune avec halo, dans le calme et le silence. Le vendredi 2, brouillard puis soleil pâle et retour du froid ; le matin, longue conversation à Montigny avec le Dr Dubois ; l''après-midi est libre.'
