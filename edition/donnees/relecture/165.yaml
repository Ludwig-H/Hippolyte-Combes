remarques: Mot 2 de la l. 8 non résolu (monté / nouvl / nom propre). Bas de page blanc, taches de rouille.
resume: 'Le samedi 10 mars 1917, à Hérissart, Hippolyte Combes achève ses paquets avant le petit déjeuner et éprouve une étrange mélancolie à l''idée de quitter le village et de changer d''affectation ; les souvenirs des six derniers mois affluent. Le capitaine Williams part définitivement vers 10 heures : Combes se retrouve sans fonctions. Il obtient de rester un jour de plus au village et à la ferme, où il a une belle chambre, et fraternise avec les Anglais qu''il connaît depuis longtemps. Ciel nuageux, temps très doux, puis temps mauvais, bruine et boue ; il se repose, écrit et lit dans le bureau. Penché à la mélancolie le matin, il se résigne le soir à son nouveau sort.'
