remarques: 'Lexique à corriger : « Jimmie (167) » devient « Jessie [?] » ; « Beaumont (167) » devient « Beaucourt [?] » (Beaucourt-sur-l''Hallue) ; l. 6 « m''a porté » devient « aidé porter ».'
resume: 'Fin du dimanche 11 mars 1917 : la nouvelle chambre, à deux fenêtres, est calme et propice à la rêverie et à l''étude ; matinée printanière, après-midi d''averses ; à Hérissart, un tommy l''a aidé à porter ses sacs (50 c). Lundi 12, levé à 7 h après une très bonne nuit, Hippolyte Combes achève de s''installer. Temps brumeux et pluie fine. Le matin, tournée à Toutencourt, Contay, Beaucourt (?) et Molliens-au-Bois dans une auto Wolseley conduite par un Australien, moins confortable que la Vauxhall de Jessie (?) ; l''après-midi, Puchevillers, Raincheval et Candas. Achat de poudre dentifrice Calvert''s à la cantine de Toutencourt.'
