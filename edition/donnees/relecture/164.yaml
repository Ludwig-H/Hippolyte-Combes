remarques: 'Ligne 21 : « office » d''une encre plus pâle (plume moins chargée).'
resume: 'Jeudi 8 mars 1917 à Hérissart : nuit très froide, neige à gros flocons le matin. Vers 3 h, l''interprète Evar revient avec un autre interprète, Valet, de la 2e division australienne, puis repart pour Albert en camion avec son paquetage. À la Mission française de Toutencourt, un maréchal des logis lui dit de rester avec son capitaine à Hérissart jusqu''au départ de celui-ci, puis de se rendre au dépôt de Toutencourt. Vendredi 9 : neige toute la journée, préparatifs de départ, tristesse et incertitude sur la nouvelle affectation ; le soir, règlement des comptes de mess avec le capitaine Williams.'
