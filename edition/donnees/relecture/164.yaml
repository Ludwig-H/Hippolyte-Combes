difficultes:
- ligne: 6
  lemme: Evar
  analyse: E bouclé, petit v, a ouvert surmonté d'un trait haut (l. 6 seulement), finale r ou n prolongée ; même forme l. 8 sans le trait haut.
  alternatives:
  - Evan
  - Eval
- ligne: 6
  lemme: en
  analyse: Ovale ouvert (aspect a) puis petite bosse ; e à boucle ouverte + n réduit ; l'idiome « en cie de » est fréquent dans le journal.
  alternatives:
  - av
  - au
- ligne: 6
  lemme: d'1
  analyse: Après d, un seul trait vertical courbe sur la ligne, point au-dessus ; 1 avec apostrophe fondue dans le d.
  alternatives:
  - d'
- ligne: 9
  lemme: est
  analyse: e bouclé, haute boucle montante (s), t à barre longue ; pas de grande croix.
  alternatives:
  - ext
- ligne: 10
  lemme: fr^{se}
  analyse: f à drapeau de tête, petit r en 2 au-dessous du drapeau, suscrit en ʒ à droite, virgule à la ligne ; cf. 163 « Mission f^{se} ».
  alternatives:
  - fr^{e}
  - F^{se}
- ligne: 15
  lemme: mervx
  analyse: 'm-e-r-v puis haste haute recoupée par un trait montant et un délié long vers la droite. Contrôle p2 : croix nette, lecture retenue sans réserve.'
  alternatives:
  - merv^{t}
- ligne: 22
  lemme: pensif tristesse
  analyse: 'pensif : p, e, n, s, i à point en ^, f long, délié ; tristesse : t bouclé, r, i, s montant, t-e, ss réduits, e prolongé, barre de t décalée à droite.'
  alternatives:
  - pensif triste
- ligne: 25
  lemme: '18'
  analyse: 1 à long trait d'attaque ; puis boucle basse fermée et haste remontante qui redescend (petite boucle haute ouverte = 8, ou 6 en d). Le chiffre a la forme « d » (boucle basse, haste à droite), que le guide donne aussi au 4 fermé.
  alternatives:
  - '16'
  - '14'
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'À vérifier sur l''image : 1067 caractères ; sources principales : OH 1917-I p. 74 (le I Anzac Corps rattaché à la Fifth Army le 15 févr.), LLT (QG de Toutencourt), Fernand-Laurent 1917 p. 27 (dépôt des interprètes) ; seule la lecture p1 existe. « Evar » (ou Evan), « R.2 » et le montant du mess (18 ou 16 f) restent incertains, et le nom du maréchal des logis est laissé en blanc dans le carnet. Je n''ai pas ajouté de clé lieux.'
  alternatives: []
- ligne: 7
  lemme: R.2
