remarques: Le trait vertical entre air et – (l. 11) est la virgule de 1^{H}, (l. 10) ; le trait après mouille est la haste du f de forte. Le long trait vertical traversant rivière (l. 8) est la haste du p de promené (l. 7).
resume: 'Dimanche 13 août 1916 : soleil ardent ; Hippolyte Combes est déçu de n''avoir reçu aucune lettre de Marguerite et passe la journée dans le pot-au-noir. L''après-midi, il retrouve Maurin et se promène avec lui dans la campagne le long de la Lys. Lundi 14 : ciel couvert ; vers une heure, une forte pluie rafraîchit l''air et colle la poussière des routes ; il regarde l''averse zébrer l''air et l''écoute crépiter sur sa vitre. Course à cheval avec le lieutenant Curtis en direction d''Armentières. Comptes : blanchissage 50 c, lait 15 c + 0,05.'
