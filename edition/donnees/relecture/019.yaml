difficultes:
- ligne: 6
  lemme: Après
  analyse: A pointu, p, r, e surmonté d'un accent en tiret ; s final non distinct, fondu dans le délié qui rejoint le trait d'union
  alternatives:
  - Aprè-midi
- ligne: 9
  lemme: nuages –
  analyse: après nuage, haste montante (s en boucle haute) puis trait horizontal appuyé sur la ligne de base = tiret ; la croix d'un x n'apparaît pas
  alternatives:
  - nuageux
- ligne: 10
  lemme: – enfin
  analyse: trait épais x .05-.10, y .506, à 0,015 sous la base de 14 ; soudé à la tête du e ; pourrait être le soulignement de la date (cf. l. 1)
  alternatives:
  - \sl{14} L – … / enfin
  - Enfin
- ligne: 10
  lemme: très
  analyse: forme réduite « hu » ; le tiret qui suit, au niveau de la ligne de tête, est l'accent grave décalé à droite, non un tiret
  alternatives:
  - très –
- ligne: 15
  lemme: ecouter
  analyse: e, c à attaque haute, o, u, t, e, r ; la boucle supérieure appartient au z de zebrer
  alternatives:
  - écouter
- ligne: 18
  lemme: \inc{de}
  analyse: ∂ à panse pleine, puis élément court montant vers la droite, sans boucle visible ni s plongeant ; comparer de l. 16 (e bouclé net)
  alternatives:
  - ds
- ligne: 18
  lemme: Armentières
  analyse: A, r, m, e, n, t, i, e sous accent grave, r, e, délié final ; s non distinct ; pas d'apostrophe visible après d
  alternatives:
  - Armentière
- ligne: 20
  lemme: 15c
  analyse: trait d'attaque montant (1) et haste descendante à drapeau (5 en ſ) fondus en un tracé ; 15 c comme au cliché 018
  alternatives:
  - 5c
