remarques: 'Le trait oblique sous « Groom : 1^{f} » (x .74–.88, y .17–.19) est rendu par un filet partiel entre les l. 2 et 3. Le camp du 16 au soir (route de Senlis, cliché 075) est à Warloy-Baillon. Remarque du commentateur : le nom du groom (Connelly ?) n''est pas sur la page ; non imprimé.'
resume: 'Comptes du lundi 16 octobre 1916 : chambre à Beauval et pourboire au groom, cartes postales à Warloy. Le mardi 17, Hippolyte Combes a couché sous la tente à côté de deux officiers, par une nuit très froide, et note la nouveauté du bivouac. Levé vers 6 h sous une demi-lune argentée, il voit le camp s''animer ; les régiments d''infanterie partent d''abord, sa colonne se met en route à 10 h. Les routes sont encombrées de convois de toute sorte.'
