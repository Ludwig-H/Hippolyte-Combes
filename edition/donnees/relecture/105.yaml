  lemme: \inc{Mess}
  analyse: M à attaque longue, deux ou trois minimes, puis deux longues hastes en ſ montant et descendant ; aucun e net. Au-dessus « tout » précédé d'un tiret (t bouclé, o, u, t barré) ; au-dessous un mot l-a-r-g-e à g descendant. Le sens de l'ensemble reste obscur (zoom x3 [.66 .72 1.0 .80]).
