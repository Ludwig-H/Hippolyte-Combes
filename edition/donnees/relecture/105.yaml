- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'À vérifier sur l''image : 1070 caractères ; sources : OH 1916-II p. 541, Becke 1938 p. 83 n. 14, LLT (Fifth Army, V et XIII Corps), registre matricule n° 911 ; transcription p1 seulement. Le mot en fin de l. 21 est lu « tout Mess large » (douteux), alors que R7 et l''édition antérieure citent « tout jeune, mince » : je ne l''ai pas cité. Le mess est noté 70, et non les 40 f donnés par R8. Le « régiment d''origine » est rendu par « sans doute le 10e d''artillerie » d''après le registre matricule, non d''après R3 : son « 10e régiment d''artillerie à pied » ne date que de décembre 1918. La note sur le cirage Nugget a été retirée pour tenir dans la longueur. — Contrôle p2 : 70 confirmé ; la fin de la l. 21 reste douteuse, ne pas citer « tout jeune, mince ».'
  alternatives: []
