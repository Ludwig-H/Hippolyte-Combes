remarques: Le mot de la fin de la l. 21 et celui qui est écrit au-dessous restent douteux ; le numéro d'armée de la l. 8 (V ou 5) aussi.
resume: 'Le 1er décembre, matinée perdue au bureau ; après un déjeuner pris tôt, Hippolyte Combes va en auto à Franvillers et Buire-sur-Ancre, revoit avec plaisir la région de Ribemont-Heilly et, au retour, passe au bureau de la Mission française de la Ve armée à Toutencourt (cap. Bresson). À Acheux, un message le fait se présenter à la Mission française du XIIIe corps, qui le prend en charge ; il envisage de réintégrer son régiment d''origine. Comptes : sa part du mess de novembre à Curtis et une boîte de cirage. Le 2, gel très fort ; resté à Acheux, il voit arriver vers 1 h le capitaine Williams, qui vient remplacer Curtis, au grand étonnement de celui-ci. Le soir, il voit le cap. H. au bureau de la mission.'
