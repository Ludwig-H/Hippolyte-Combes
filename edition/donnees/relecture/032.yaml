remarques: Pas de total des comptes. Fantômes du verso visibles au bas de la page.
resume: Le 31 août 1916, par une belle journée enfin ensoleillée, Hippolyte Combes va à pied jusqu'à Saint-Pol par le plateau de Ramecourt et Saint-Michel-sur-Ternoise, puis par la grand-route d'Arras. Il décrit la petite sous-préfecture de 5000 habitants, ses rues en pente et l'église de briques rouges de style hollandais (1697), où une plaque rappelle que Benoît Labre y passa une nuit en prière en mars 1767. Il rentre par Ostreville, ragaillardi par la course. Il note ses achats de cartes postales et une carte du département.
