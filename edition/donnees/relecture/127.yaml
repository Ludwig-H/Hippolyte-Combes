resume: 'Le mardi 23 au soir, Hippolyte Combes assiste au foyer du Y.M.C.A. à une conférence sur le Canada. Le 24, nuit extrêmement froide : vitres couvertes de glace, eau du pot et du seau gelée ; soleil ardent à midi ; journée libre, il termine ses préparatifs de départ (blanchissage 70 c). Le 25, gel encore plus fort, soleil sur la neige durcie, violent bombardement la nuit et le matin ; tout est prêt pour partir le lendemain à 3 h 1/2. Dépenses du mess pour janvier : 79 f 10.'
