remarques: Retour de permission (Toulouse, Paris) ; suite de la journée au cliché 147.
resume: Nuit de voyage vers le front dans un compartiment surchauffé et bondé, par un froid très vif. Arrivé à Amiens à minuit 30, Hippolyte Combes se repose une heure au foyer Y.M.C.A., attend deux heures dans la salle d'attente comble, puis prend le train de Doullens à 6 h 7. À la gare de Louvencourt, il voit deux Taubes évoluer dans le ciel bleu sous les éclatements d'obus. Arrivé à Acheux vers 1 h 1/2, il regagne à pied son ancien cantonnement, où les Carluvant lui offrent un déjeuner sommaire.
