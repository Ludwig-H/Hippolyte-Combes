difficultes:
- ligne: 8
  lemme: comble
  analyse: c d'attaque, o lié, m, haste de b puis l, e final plongeant sous la ligne (aspect « cmll » suivi d'une queue) ; zoom ×3 confirme, aucun b initial ni d (contre « bondée ») ; le sens concorde
  alternatives:
  - combles
- ligne: 13
  lemme: d'1
  analyse: 'zoom ×3 : petit c suivi d''une haste courte coupée d''un trait (aspect « ct », « et »), puis 1 à longue boucle d''attaque (aspect « 4 ») : d à panse noyée + apostrophe + 1 ; « et 1 » ne donne pas de sens'
  alternatives:
  - et 1
- ligne: 13
  lemme: pâle
  analyse: p, a, l, e, puis un arc en ɛ détaché, pris pour le circonflexe décalé à droite
  alternatives:
  - pale
- ligne: 20
  lemme: Carluvant
  analyse: 'zoom ×3 : grand C bouclé, a ouvert, r, l bouclé à base empâtée, puis trois ou quatre minimes (u + v ?), une boucle (a ou o), n, t barré ; compatible avec Carluvant (u + v à boucle + a), retenu en 102 et 118 ; la lecture « Carlumont » (7 occurrences en première lecture) reste possible'
  alternatives:
  - Carlumont
  - Corlemont
- ligne: 22
  lemme: sorti,
  analyse: 'zoom ×3 : petite masse d''encre à queue descendante sous la ligne, à droite du i ; la page suivante reprend par « En me rendant »'
  alternatives:
  - sorti.
