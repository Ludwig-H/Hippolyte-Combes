remarques: Le départ se fait de Saint-Jans-Cappel (cantonnement de la 152nd Company depuis 006). La fin de la page précédente (009) et le début de 011 (« Ve 4 — Avant & après diner ») encadrent la journée.
resume: 'Le vendredi 4 août 1916, Hippolyte Combes se rend à cheval de son cantonnement à La Croix-du-Bac, au bureau de la mission française : une heure et demie pour une quinzaine de kilomètres, par Bailleul et Steenwerck, gros village à grande église. Ciel menaçant et quelques gouttes au retour, puis vent et soleil ardent. Il se repose l''après-midi dans sa mansarde. Au bureau de la mission il touche 80 f 30, dont 8 f de supplément de juillet. Il note que la ferme où est cantonnée sa compagnie est isolée en rase campagne, dans un grand calme.'
