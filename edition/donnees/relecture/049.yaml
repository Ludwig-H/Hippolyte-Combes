remarques: Les en-têtes de phrase Après (l. 2, 10, 14) ont un a à peine agrandi ; majuscule conservée.
resume: 'Dimanche 24 septembre 1916 au camp près d''Acheux : épais brouillard dissipé vers 11 h, puis chaleur. Hippolyte Combes achève sa hutte, plus spacieuse, derrière une haie d''aubépine, et va à pied à Forceville pour le fourrage vert. Après le déjeuner, où un capitaine (Newton ?) est invité, il prépare ses affaires en deux heures. Après le thé, il se promène à Acheux où une musique militaire joue sur la place, près de l''église et du château. Nuit étoilée ; le canon gronde tout le long du front.'
