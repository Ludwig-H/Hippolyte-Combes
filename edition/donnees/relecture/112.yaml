remarques: 'Le cliché 112 (22 et 24 déc.) précède le cliché 113 (19 déc.) : ordre des feuillets inverse de la chronologie. Aucune entrée pour le 23.'
resume: Le vendredi 22 décembre 1916, par le dégel et la pluie, Hippolyte Combes va le matin à Senlis, l'après-midi à Rubempré et au Quesnoy, et fait réparer son lorgnon chez un horloger de Léalvillers ; le capitaine dîne à Beauquesne. Une lettre de Marguerite l'a fort contrarié. Le dimanche 24, sous les averses et les rafales, il court Saint-Léger, Orville, Authie, Louvencourt, Puchevillers et Toutencourt. À Louvencourt, chez Mme Cuisinier, le capitaine Williams lâche « Bloody France », propos qu'il hésite à signaler à la Mission française. Déprimé depuis la lettre de Marguerite du 17, il évoque des velléités de rupture.
