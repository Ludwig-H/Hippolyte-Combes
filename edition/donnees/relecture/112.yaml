difficultes:
- ligne: 8
  lemme: \inc{+}
  analyse: Haste très épaisse, descendant sous la ligne et bouclée à gauche, suivie à droite d'un court trait oblique (aspect y') ; aucune traverse nette. Le sens (Rentré plus tôt au billet) appuie +. Contrôle p2 (zoom .06 .24 .30 .30 ×3) sans décision meilleure.
  alternatives:
  - y
  - '&'
- ligne: 1
  lemme: \sl{Dec 1916}
  analyse: Le trait sous la date de droite est bas (y .08) et décalé vers la droite ; même décalage et même crosse d'attaque que le soulignement de 22 Ven. ; il ne tient à aucun mot de la l. 3.
  alternatives:
  - Dec \sl{1916}
- ligne: 13
  lemme: rafale
  analyse: Contrôle p2 (zoom ×3) - l bouclé puis e terminé par une courte remontée, sans s plongeant ni crochet final.
  alternatives:
  - rafales
- ligne: 23
  lemme: gdes
  analyse: g, d bouclé, e prolongé en délié terminé par un petit crochet montant, qui peut valoir s ; l'accord avec apprehensions appuie gdes.
  alternatives:
  - gde
- ligne: 4
  lemme: '&'
  analyse: Contrôle p2 (zoom .58 .11 .72 .16 ×3) - forme « t bouclé » de l'esperluette (petite boucle basse, haste barrée), non la croix détachée du + de la l. 15.
  alternatives: []
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: Quesnoy (l. 4) - sans doute le lieu-dit « le Quesnoy » entre Rubempré et Puchevillers (IGN, à confirmer) ; Orville est dans le Pas-de-Calais (clé lieux corrigée). Les deux formes signalées (\inc{+} tot, l. 8 ; rafale, l. 13) ont été contrôlées en p2.
  alternatives: []
