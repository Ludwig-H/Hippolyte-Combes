remarques: Aucun nom de lieu sur la page ; le cantonnement de Barlette est déduit des pages voisines (cl. 067). La forêt n'est pas nommée.
resume: 'Journée sombre, ciel couleur de plomb. L''après-midi, Hippolyte Combes pénètre dans une forêt qui longe la route : sentiers boueux jonchés de feuilles, taillis enchevêtrés, arbres plusieurs fois séculaires ; il y reste longtemps à écouter le vent dans les branches. Le soir, en revenant du mess, il admire le ciel éclairé par la lune et la campagne aux détails bien découpés. Il se plaît beaucoup dans sa grande chambre, « un vrai salon ».'
