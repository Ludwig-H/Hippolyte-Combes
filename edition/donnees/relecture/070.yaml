  lemme: rouillés
  analyse: r-o-u, puis deux hautes boucles (ll, ou ss en ll/ff comme dans « bruissement » l. 11), e surmonté d'un seul signe (accent ou point d'i décalé), s plongeant, point ; aucune minime sûre pour l'i
