remarques: '« place (hotel . des Invalides » : la Place = le commandement de la place de Paris, à l''hôtel des Invalides.'
resume: Arrivé de nuit au Bourget vers 6 heures, Hippolyte Combes suit les voies jusqu'au bureau militaire, obtient l'autorisation de sortir et gagne en tramway la gare du Nord, puis en métro les Tuileries (changement au Châtelet). Il traverse le jardin jusqu'à la gare d'Orsay, se rend à la place des Invalides pour demander l'autorisation de voyager à ses frais en express, puis prend un billet de 2e classe pour Toulouse. Il descend ensuite la rue du Bac, passe au Bon Marché, rue de Rennes, au jardin du Luxembourg et chez Colin.
