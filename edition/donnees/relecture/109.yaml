remarques: Ordre de la surcharge Belle-Eglise / Orville indécidable ; Croughton (ou Crampton) et Autoritaire restent incertains ; 81st probablement lapsus pour 31st.
resume: 'Samedi 9 décembre 1916, sous la pluie, Hippolyte Combes part en auto vers 9 heures ; une destination (Belle-Église) est biffée et remplacée par Orville. Il déjeune à Authie au mess de la no 3 Company d''une division notée 81st (sans doute la 31st), avec un lieutenant Croughton (lecture incertaine), puis gagne Orville et pousse jusqu''à Saulty et L''Arbret, rentrant de nuit, trempé. Il se plaint du capitaine Williams. Le lundi 11, après deux jours inoccupés au bureau par un temps affreux, il souffre de dysenterie et ne mange rien. Compte : une boîte de graisse Wren''s Dubbin, 30 c.'
