resume: 'Suite du jeudi 8 février 1917 : temps merveilleux, ciel bleu, soleil ardent, gel profond. L''après-midi, promenade à pied jusqu''à Rubempré sur la neige durcie, dans un paysage vallonné couronné de moulins, moins banal que les environs d''Acheux. Hippolyte Combes achève de ranger sa chambre et de s''installer ; froid très vif, un peu de couture avant le coucher vers 9 h. Vendredi 9 : nuit excessivement froide, ciel clair et pleine lune ; matinée libre, mais trop froid pour écrire dans sa chambre.'
