remarques: Mot interlinéaire sous « Royer » (l. 10), premier mot de la l. 14 et signe après « Cotés » (l. 17) restent douteux ; nom de l'interprète à confronter aux autres mentions.
resume: 'Samedi 25 novembre 1916, à Acheux : pluie battante, routes et rues transformées en bourbiers ; Hippolyte Combes passe de longues heures inactif au bureau. Dans la matinée, plus de 28 obus tombent sur Acheux du côté de la sucrerie et de la ferme Royer, faisant plusieurs tués et blessés ; sa chambre est inhabitable à cause du froid et du bruit. Dimanche 26 : pluie toute la nuit et la matinée, chaussées couvertes de boue. Le lieutenant Walsh et son interprète, M. Deloney, viennent prendre le thé dans la cabane ; Hippolyte Combes les raccompagne à Hérissart et peut longuement parler français. Nuit étoilée.'
