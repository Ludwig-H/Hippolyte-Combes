resume: Le 16 janvier 1917, après une nuit de forte gelée, Hippolyte Combes fait en auto (Sunbeam) une tournée à Bouzincourt, Senlis et Rubempré, où il va de ferme en ferme chercher de la paille ; il revient par Hérissart à Toutencourt dans la campagne enneigée. Le 17, après une nuit de neige abondante, il passe la journée en course jusqu'à Auxi-le-Château, chez M. Renard, qui l'invite à déjeuner et lui montre ses objets d'art, notamment un coffret en paille acheté en 1858 au bagne de Toulon. Tourmente de neige le matin, dégel le soir.
