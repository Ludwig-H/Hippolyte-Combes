resume: Le samedi 3 mars 1917, par brouillard glacial, Hippolyte Combes achète paille et fourrage à Rubempré et Puchevillers, passe au bureau du Town Major, puis va à pied à Toutencourt (Mission française, fermes) et rentre en camion à Hérissart. Il note à la Mission française de Toutencourt une somme de 43 f 75, avec une retenue de 35 f pour sept jours de permission. Le dimanche 4, gel et beau soleil ; le capitaine part en promenade à Flixecourt et lui laisse la journée libre. Le lundi 5, la neige couvre routes et toits ; tournées à Montigny, Fréchencourt, Rubempré et Puchevillers. Il apprend l'arrivée prochaine d'un officier australien qui doit les remplacer, et se réjouit de quitter le capitaine.
