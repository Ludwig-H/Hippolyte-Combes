remarques: La date « 17 mardi / oct 16 » au pied de la page reprend le jour du récit (commencé au cliché 076) ; la page suivante (078) s'ouvre sur « Merc. 18 ».
resume: Suite du 17 octobre 1916. Après Senlis, Hippolyte Combes et sa compagnie campent dans un champ dévasté à mi-chemin entre Bouzincourt et Hédauville, où leurs prédécesseurs n'ont rien laissé. Il doit improviser une installation sommaire et aménager une sorte de hutte ouverte pour abriter ses sacs. Il couche dans la tente du mess, sur un fauteuil de toile ; il pleut à verse toute la nuit, le froid est pénétrant et il n'y a aucun confort. La date du jour est portée au pied de la page.
