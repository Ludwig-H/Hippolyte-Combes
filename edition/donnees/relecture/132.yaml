  analyse: 'À vérifier sur l''image : 1081 caractères ; sources : Lafon 1922 (p. 37, quart de place), Baedeker Sud-Ouest 1912 (R. 39, p. 298), *Le Télégramme* du 30 janv. 1917, *L''Express du Midi* du 23 déc. 1926, biographie familiale ; seule p1 existe. Le billet de 11 f 15 est seulement rapproché du billet de 3e classe du retour d''octobre (11 f 75) : la classe n''est pas écrite. L''« angle musee » est donné comme sans doute le musée des Augustins. Lectures incertaines dans p1 : « taxametre » (l. 5), « 1^{f}25c » (l. 9), « sœurs » (l. 15). Contrôle p2 : l. 9 relue « 15c » (incertain) ; l. 5 et l. 15 maintenues incertaines.'
