resume: 'Samedi 27 janvier 1917 : comptes du voyage de Paris (facteur à la gare du Nord, gare d''Orsay, enregistrement de deux colis, fiacre, métro, dîner, billet pour Toulouse) et achats aux magasins de l''Hôtel de Ville (brosses, peignes, cirage). Dimanche 28 : le voyage s''achève sans incident ; en approchant de Toulouse, Hippolyte Combes croit revoir sa mère et ses sœurs l''attendant à la gare. Arrivé vers 8 h 15, il retire deux bagages, prend le tram de Saint-Michel et range ses affaires dans son appartement. L''oncle Émile vient le surprendre à 10 h 1/2 ; à midi il se rend à Sainte-Marie, après avoir attendu le tram trente minutes à l''angle du musée.'
