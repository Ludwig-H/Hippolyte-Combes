remarques: Page commençant une nouvelle journée (et non suite du 10). Le crochet des comptes a des pieds horizontaux longs, presque un cadre ouvert à droite.
resume: 'Dimanche 11 février 1917, Hippolyte Combes passe la journée en course : matinée à Toutencourt, déjeuner et arrêt de trois heures à Doullens, promenade solitaire le long d''un ruisseau. À 3 heures il repart pour Auxi-le-Château, où M. Romert, vieux célibataire héritier de trois générations, lui offre café, rhum de 1870 et kirsch de la Forêt-Noire. Au retour l''air devient glacial et il gèle durement ; nuit étoilée sans lune. Dépenses à Doullens : papeterie, cartes postales, chocolat, biscuits Petit Beurre.'
