  apres: 11^{h} 1/4
  justification: Le 1 (petite haste après l'H suscrit) et le 4 sont séparés par une barre nettement oblique, non horizontale ; BALISAGE impose 1/4 dans ce cas. Note d'apparat corrigée.
- ligne: 12
  avant: sangloté.
  apres: sanglote
  justification: Zoom ×3, aucun accent sur le e final ; le point sous la ligne appartient à l'i d'« Insomnie » (l. 13).
- ligne: 19
  avant: Marg^{te}
  apres: Margte
  justification: Zoom ×2, te écrit sur la ligne de base, à la hauteur de Marg, puis long délié ; surélévation non nette.
- ligne: 2
  avant: 'apparat : fraction empilée à barre oblique ; ajout entre « Monté » et « hier »'
  apres: notes abrégées (onze heures un quart ; lecture Monté / Remonté)
  justification: Épuration de l'apparat ; détails paléographiques renvoyés aux difficultés.
remarques: Lieu (Millau) déduit du contexte des clichés 140 (billet Béziers–Millau) et 142 ; aucun toponyme sur la page.
resume: Dimanche 4 février 1917, à Millau, dans la maison natale. Monté se coucher vers 11 h 1/4, Hippolyte Combes ouvre le volet de fer et contemple le vallon sous la pleine lune. Assailli par le souvenir de ses parents et de ses sœurs, il sanglote, passe une nuit d'insomnie à écouter la pendule et la toux de Germaine dans la chambre voisine. Levé vers 7 h, il déjeune avec Marguerite, qui le laisse vers 11 h pour aller à la messe ; il rêve alors dans sa chambre ensoleillée.
