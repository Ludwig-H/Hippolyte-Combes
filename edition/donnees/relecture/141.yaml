difficultes:
- ligne: 2
  lemme: Monté
  analyse: 'Mot repassé à l''encre très épaisse, juste sous le soulignement de la date : attaque bouclée descendante (M à délié d''attaque ou Q), jambages, haste barrée (t), e final. Une première leçon (Quand ?) semble recouverte. Le sens (« Monté chambre hier soir ») et « monté chambre » de la l. 21 appuient Monté.'
  alternatives:
  - Remonté
  - Quand (première leçon recouverte ?)
- ligne: 1
  lemme: \sl{Dim. 4}
  analyse: 'Le trait épais qui frôle le haut du premier mot de la l. 2 part sous « Dim. » et s''arrête au pied de « chambre », à la même hauteur que le soulignement de « Fevr ''17 » : soulignement de la date, non rature.'
  alternatives:
  - rature du premier mot de la l. 2
- ligne: 14
  lemme: cheminée
  analyse: c-h-e-m-i-n puis é à accent décalé et long délié final pouvant valoir -e.
  alternatives:
  - cheminé
- ligne: 20
  lemme: pour
  analyse: 'p à longue haste puis deux éléments arrondis et r final crochu : pour écrit court plutôt que pr.'
  alternatives:
  - pr
- ligne: 21
  lemme: chambre
  analyse: Mot écrit court (c-h-a-m-b, b ouvert en k, puis crochet final) ; on garde chambre, comme l. 15, plutôt qu'une abréviation chamb.
  alternatives:
  - chamb.
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Pleine lune le 7 févr. 1917 (Calendar-12) : la lune du 3–4 février était presque pleine ; rien à corriger dans la transcription. Aucun toponyme sur la page : Millau est déduit du contexte (140, 142).'
  alternatives: []
