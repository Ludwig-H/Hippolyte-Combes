remarques: La suite (151) mentionne le Lt Bradfield et la route d'Aveluy.
resume: L'après-midi du vendredi 9 février 1917, Hippolyte Combes va à Toutencourt dans l'auto du lieutenant Croughton ; au bureau de la Mission française, il apprend qu'il sera désormais administré par l'armée et payé les 3 et 18 de chaque mois. Il rentre en camion, écrit dans la salle du café de sa maison, puis parcourt les fermes le soir avec le capitaine Williams pour acheter paille et foin. Le samedi 10, levé à 7 heures, il doit aller aussitôt aux lignes du Motor Transport ; froid vif et gel. Après le petit déjeuner, il part en auto pour Martinsart par des routes en pente entre des champs couverts de neige durcie ; au château, il est reçu par un général très aimable ; le village est rempli de troupes anglaises.
