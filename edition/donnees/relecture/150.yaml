- ligne: 11
  lemme: dès
  analyse: d bouclé, deux jambages (e + s réduits), trait horizontal détaché au-dessus à droite (accent) ; « Dû » de la l. 12 porte au contraire un vrai circonflexe ; l'expression « Sur pied dès 6H » (062) appuie dès
  alternatives:
