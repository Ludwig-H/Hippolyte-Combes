- ligne: 12
  lemme: L^{ns}
  analyse: L en ℒ (grande boucle haute, boucle basse, pied), puis, suscrits, une boucle ou un jambage arqué (g ou n) et une finale verticale (s réduit) ; zoom ×3 sans décision
  alternatives:
  - L^{es}
  - L^{gn}
  - Lignes
- ligne: 15
  lemme: toujrs
  analyse: t barré, o, u, j à longue descente pointé, un jambage, s plongeant
  alternatives:
  - toujs
  - toujis
- ligne: 20
  lemme: Votté
  analyse: V à long délié, o, deux hastes droites sans boucle (donc t plutôt que l bouclé) reliées par une barre transversale à mi-hauteur, e lié au délié final ; accent en croissant posé à droite ; la barre peut aussi être le nœud d'un k (Volké) ou un ss en « ll »
