remarques: La fin de la page 078 (« au-delà route ») amène « sur l[aquelle] » en tête de page.
resume: 'Suite du mercredi 18 octobre 1916. Depuis son camp près d''Albert, Hippolyte Combes observe sur la route, nuit et jour, un flot ininterrompu de véhicules, camions et caissons de munitions, aussi animé qu''une grande artère de capitale. Après le dîner, les officiers partis, il se retrouve enfin seul dans la tente du mess. Au pied de la page, le compte du 18 : cartes postales à Albert (40 c) et 84 francs inscrits sous « mission française » à Albert, sans doute la solde perçue.'
