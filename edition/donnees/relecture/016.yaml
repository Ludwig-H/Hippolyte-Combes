remarques: Le crayon de « Sailly » (l. 7) est sans doute une correction postérieure. Plusieurs reprises à l'encre noire sur fond d'encre brune. « causé … de notre genl » s'entend « parlé de notre général ».
resume: 'Jeudi 10 août 1916 : pluie fine et intermittente, agréable pour marcher le long des routes arrosées. L''après-midi, Hippolyte Combes va à pied jusqu''au village de Sailly-sur-la-Lys, à 3 ou 4 km, sans dépasser le pont ; il remarque l''église brûlée par les Allemands, dont il ne reste que les murs et le haut clocher. Au retour, le long des berges de la Lys, il s''arrête à l''écluse et cause longuement avec l''éclusier de « notre général en chef », Maxse. Il contemple de sa fenêtre un beau coucher de soleil vers Estaires et Hazebrouck ; note isolée sur les Australiens. Dépenses : cartes postales 1 franc, lait 50 centimes.'
