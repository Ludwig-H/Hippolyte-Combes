remarques: La ville parcourue (l. 4) est Albert, d'après les pages voisines. Remarque du commentateur historique (Miles OH 1916-II p. 462-463, 543 ; R7 F59) — « l'ordonnance » peut désigner l'Ordnance britannique.
resume: Nuit très froide et forte gelée, que le soleil adoucit un peu dans la journée. Le matin, Hippolyte Combes parcourt les rues aux maisons atteintes par les obus, puis va à l'ordonnance à Aveluy. L'après-midi, il achève de s'installer dans sa chambre et s'attarde sur le plateau où est dressé le camp, la colline étant couverte de troupes au bivouac. Le soir, il lit puis reste longtemps près de la cuisinière avec Abel, le plus jeune fils de la maison, tandis que la canonnade reste très violente.
