difficultes:
- ligne: 10
  lemme: Me \inc{fich} \ill
  analyse: f à grande boucle de tête, petit c (ou e), h ; puis deux hastes épaisses parallèles reliées par une traverse oblique (aspect H), un point sous la seconde (aspect « ! ») ; le tiret à droite appartient à la l. 11. Aucune biffure.
