remarques: Fin de l. 10 non résolue ; les comptes de la l. 23 débordent sous la l. 24. Lieux réduit à Steenwerck (Erquinghem-Lys n'apparaît pas sur la page).
resume: 'Dimanche 20 août 1916 : averses et éclaircies ; avec Curtis, Hippolyte Combes va aux champs chercher du fourrage vert, puis prend café et rhum chez le propriétaire, M. Barbry, où Curtis a amené les adjudants Lupin et Schumacher. Le moral est redevenu excellent ; il prépare le départ de la semaine suivante et décrit le paysage plat vu de sa fenêtre. Lundi 21 : belle journée et coucher de soleil frangé d''or ; il allège ses bagages en expédiant un sac à Nogent et se rend à cheval à Steenwerck. Comptes : 5 francs au propriétaire, 2 francs au groom, 10 centimes divers.'
