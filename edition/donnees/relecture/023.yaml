  - Me fiche !!
  - Me fâche
- ligne: 11
  lemme: \inc{Repare}
  analyse: trait d'attaque sur la ligne, haste, boucle haute et jambe (R), identique au R de Réagi l. 9 ; puis e, p descendant, a, r, e ; le sens attend Prépare.
  alternatives:
  - Prépare
  - Répare
- ligne: 9
  lemme: \inc{redevenu}
  analyse: après le l de Moral, un e lié (r initial réduit ou fondu dans la liaison) puis d bouclé, e, v, e, n, u.
