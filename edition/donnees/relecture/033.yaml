resume: 'Vendredi 1er septembre 1916 : matinée variable, éclaircies l''après-midi puis ciel couvert. Hippolyte Combes se promène jusqu''à Ligny-Saint-Flochel, à 2,5 km, par une route en pente longeant un bois où des régiments anglais font des manœuvres. Il visite la petite église du XIIIe siècle, au clocher octogonal orné de pierres sculptées, entourée d''un cimetière où l''herbe cache les tombes, et en ressent une mélancolie pénétrante. Pourboire de 5 francs au chef cuisinier. Les jours se succèdent, monotones ; il espère un départ prochain, lundi.'
