remarques: La location de la batteuse aboutit au contrat passé avec la même Mme Capron le 5 janvier 1917 (cliché 120) ; M. Guibet est revu à Raincheval le 9 janvier (cliché 121). Le nom Capron, écrit de même en 120 avec un point d'i, reste incertain.
resume: 'Le mardi 26 décembre 1916, par la pluie et le brouillard, Combes se rend le matin à Raincheval et à Arquèves, où il voit M. Guibet, puis l''après-midi à Beauquesne et au Quesnoy. À Beauquesne, il voit la « charmante » Mme Capron (nom incertain) au sujet de la location d''une machine à battre. Rentré à 6 heures, extrêmement fatigué, il se couche tôt. Le mercredi 27, enfin une très belle journée ensoleillée : course à Beauquesne le matin, puis à Doullens, où il ne reste qu''à peine vingt minutes, à son regret. Il y achète une ramette de papier à lettres (1 f 25), deux paquets de grandes enveloppes (45 + 45 c) et des cartes postales (55 c).'
