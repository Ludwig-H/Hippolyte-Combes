difficultes:
- ligne: 6
  lemme: Beauquesne, charmante
  analyse: 'trait presque vertical de y ≈ 0,203 à 0,265 entre Beauquesne et charmante, coudé à la ligne de base de la l. 6 (y ≈ 0,22), où deux tracés se rejoignent : en haut, segment d''environ un œil à crochet de tête et queue vers la gauche, du module et de la position des virgules des l. 3 et 5 ; en bas, haste du t de location (l. 7), déjà longue de 2,6 œils. D''un seul tracé, la haste mesurerait 3,7 œils, plus que toute autre sur la page. Virgule de l''état antérieur rétablie'
  alternatives:
  - Beauquesne, charmante
  - Beauquesne charmante
- ligne: 6
  lemme: \inc{Capron}
  analyse: C bouclé ; a fermé à jambage, lié par le bas ; p à longue haste descendante ; ensuite deux minimes liées en u, une troisième sous un point d'i en tiret (x ≈ 0,885, y ≈ 0,195), tracé de gauche à droite et séparé de la queue du y de Quesnoy ; n final en délié ; aucun o fermé visible. Le point oriente vers Caprin ; Capron, nom picard courant et leçon de l'état antérieur, reste possible si r et o sont réduits à deux minimes. Même graphie en 120 l. 20
  alternatives:
  - Capron
  - Caprin
  - Capin
- ligne: 4
  lemme: Guibet
  analyse: G bouclé descendant ; trois minimes (u, i) ; point d'i en tiret à gauche de la haste suivante ; b en forme de h (haste bouclée et arche) ; e ; t barré. Aucune place pour un c entre i et b, ce qui exclut Guichet ; même nom en 121 l. 16, à Raincheval
  alternatives:
  - Guibet
  - Guihet
- ligne: 2
  lemme: brouillard
  analyse: 'la figure en x qui suit est le d en ∂, dont la haste rejetée en arrière croise le trait d''attaque du D de Déc (l. 1) ; le délié final se relève sans levée de plume : aucun point'
  alternatives:
  - brouillard
  - brouillard.
- ligne: 8
  lemme: Couché tot
  analyse: 'un seul trait au-dessus, à droite du é de Couché et au-dessus du premier t : accent de Couché décalé à droite, selon l''usage du scripteur ; un circonflexe de l''o serait décalé à gauche, contre cet usage'
  alternatives:
  - Couché tot
  - Couché tôt
- ligne: 12
  lemme: resté
  analyse: barre du t prolongée au-dessus du e final, épaissie à son départ, sans accent distinct ; resté conservé (accord des deux lectures et de la syntaxe), l'accent pouvant se confondre avec la barre
  alternatives:
  - resté
  - reste
- ligne: 14
  lemme: 1 ramette
  analyse: 'trait d''attaque oblique montant haut, puis haste descendante (aspect ʌ), lié à la suite du mot : 1 à attaque, ou boucle d''attaque du r initial ; le compte (1 ramette, 2 paquets) appuie le chiffre'
  alternatives:
  - 1 ramette
  - ramette
- ligne: 14
  lemme: 1^{f} 25 c
  analyse: 1 à attaque ; 2 à tête ronde et boucle basse ; au-dessus, f à tête bouclée et barre, non relié à la haste suivante ; 5 en longue haste oblique descendant sous la ligne ; c sous la ligne, au bord. Le prix d'une ramette exclut 12 f 5
  alternatives:
  - 1^{f} 25 c
  - 125 c
