remarques: 'Unité : Bedfords = Bedfordshire Regiment (54e brigade, 18th Division). Lieu de la journée déduit du cliché 039 (« Quitté Marquay »).'
resume: 'Le vendredi 8 septembre 1916, à Marquay, Hippolyte Combes attend en vain tout l''après-midi deux wagons des Bedfords pour le fourrage vert. Après le dîner, il se promène longuement dans la campagne au clair de lune, les arbres se détachant nettement. Il s''attarde sur le petit chemin de Ryonval, dans la pâture derrière la ferme Collet, et goûte le silence de la nuit. Seule dépense : une boîte de poudre dentifrice, 65 centimes.'
