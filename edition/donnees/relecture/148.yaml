remarques: Le no 104 est le cantonnement du bureau et du mess (à Hérissart, d'après 147). Les comptes concernent le retour de permission (Paris – Amiens – Acheux).
resume: 'Fin du mercredi 7 février 1917 à Hérissart : bureau et mess installés au n° 104, installation médiocre ; retour à la chambre vers 9 heures, vitres couvertes de gelée, froid rigoureux. Comptes du voyage de retour : métro à Paris, Y.M.C.A. d''Amiens, solde de la Mission française touchée à Acheux (78 f 75), gratification de 5 f aux Carluvant pour le déjeuner et divers. Jeudi 8 : excellente nuit dans un lit confortable, lever vers 8 heures au soleil, petit déjeuner au mess, journée entièrement libre.'
