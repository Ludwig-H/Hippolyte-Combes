remarques: La forme « La Croix » / « du Bac » est coupée en fin de ligne (l. 12–13).
resume: Le samedi 5 août 1916, Hippolyte Combes achève ses préparatifs à Saint-Jans-Cappel, porte ses sacs au bureau et les voit charger sur le wagon no 5. Sous un ciel couvert puis un soleil brûlant, le convoi part à 2 heures, passe par Bailleul et atteint La Croix-du-Bac vers 4 h 30. Les lignes des chevaux sont installées à l'entrée du village, côté Steenwerck ; il cherche des chambres pour les officiers et se loge en face de la compagnie. Les comptes notent la fermière de Saint-Jans-Cappel, le blanchissage, des consommations et un pourboire à Connelly, son ordonnance.
