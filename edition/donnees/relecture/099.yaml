remarques: 'La l. 1 réunit date, début du texte et mois (l''état antérieur en faisait deux lignes) : la numérotation est décalée d''une unité par rapport à l''état antérieur. Contrôle : apparat épuré (justifications paléographiques et notes de disposition redondantes avec le balisage supprimées) ; critique vidée, l''opposition de deux encres avancée par la première lecture n''étant pas vérifiable sur les tuiles (le point isolé sous bombardt, l. 12–13, est sans portée). Le tiret marginal qui précède le crochet (l. 10) ne peut être balisé devant \crochet, reconnu seulement en début de ligne par balisage.py : il est signalé dans l''apparat. Le bureau de la mission fr^{se} (l. 6) est celui de la Mission française auprès de l''armée britannique, à Albert.'
resume: Le mercredi 15 novembre 1916, la canonnade reste très violente vers Beaumont-sur-Ancre, toute la nuit et le jour, surtout à l'aube, par une très belle journée ensoleillée. Le matin, Combes fait l'aller et retour en auto à Albert, où il passe au bureau de la Mission française sans y trouver de nouvelle le concernant ; l'après-midi, libre, il se promène au village et note ses menues dépenses (cartes postales d'Acheux, journaux, blanchissage). Le jeudi 16, le bombardement fait trembler vitres et fenêtres ; il a fortement gelé et la bise est froide malgré le soleil. En auto toute la journée (Raincheval, Louvencourt, Toutencourt), il déjeune à Hérissart chez le lieutenant Walsh avec l'interprète de celui-ci, directeur d'une usine près de Paris, homme intelligent et distingué dont il laisse le nom en blanc.
