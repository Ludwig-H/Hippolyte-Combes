  analyse: après le l final de Raincheval, aucun trait jusqu'à Louvencourt, hors la tête du H d'Hérissart (l. 19) ; après Louvencourt, trait vertical à point, de la ligne de tête sous la ligne de base, au-dessus du L de Lt
  alternatives:
