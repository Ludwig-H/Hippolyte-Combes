  - Journaux . 40c
- ligne: 16
  lemme: fortt
  analyse: f, o, r, puis deux hastes épaisses sous une même barre longue ; la retombée du S de Soleil (l. 15) descend jusqu'au sommet de la seconde haste, qui pourrait lui appartenir (fort) ; le tracé épais plaide pour un second t (cf. fort^{t}, 100)
  alternatives:
