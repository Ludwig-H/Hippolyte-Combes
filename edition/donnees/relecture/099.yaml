  - Raincheval, Louvencourt,
- ligne: 22
  lemme: \inc{tiss}
  analyse: 'après la parenthèse : délié d''attaque et première hampe épaisse, seconde hampe portant à mi-hauteur un crochet vers la droite, jambage surmonté d''un point en tiret (i), deux hampes obliques (ss montants), puis la parenthèse fermante, épaisse en tête ; aucune finale -us. Les deux premières hampes font t (initial bouclé) ou W'
  alternatives:
  - tiss
  - tissus
  - Weiss
  - Wiss
