difficultes:
- ligne: 1
  lemme: \inc{Me}
  analyse: 'M à long délié d''attaque et trois jambages, puis un ovale fermé à hauteur d''œil, refermé à droite par un jambage, et un délié : aspect d''un a ; l''e de « 22 Me » (102 l. 1) est une boucle plus haute qu''ovale. Le calendrier (15 novembre 1916 = mercredi ; 16 J, 17 Ven.) impose Me ; Ma serait un lapsus d''après le 14 Ma^{rdi} (098)'
  alternatives:
  - Me
  - Ma
- ligne: 5
  lemme: de =
  analyse: 'après Rentr- : petite boucle surmontée d''une crosse (é), puis une panse portant une haste oblique d''environ 1,5 œil (d) et une boucle (e), enfin deux traits superposés, le supérieur plus court (=) ; la première lecture ne voyait que Rentré =, mais ces tracés ne s''expliquent ni par l''accent ni par le délié'
  alternatives:
  - Rentré de =
  - Rentré =
- ligne: 10
  lemme: Cartes ples
  analyse: p à haste descendante, l haut, puis deux petits traits (e et s réduit) avant un long délié et le deux-points
  alternatives:
  - ples
  - ple
- ligne: 10
  lemme: 'Journaux : 40c'
  analyse: un seul point net après l'x, dont le second trait monte à hauteur du point supérieur ; 4 fermé (aspect ∂), 0 étroit, c à long délié
  alternatives:
