remarques: La ligne « 2 Boîte de chlorate… » est sous le pied du crochet, qui ne couvre que les trois premières lignes des comptes.
resume: 'Le mercredi 11 avril 1917, après une nuit très froide, Hippolyte Combes fait une course à Doullens le matin et à Warloy l''après-midi ; il neige longtemps et abondamment, puis la nuit apporte de violentes rafales. Il note ses achats de Doullens : ceinture de cuir (24 f 50), boîte achetée à la cantine, cahiers de géographie de la Somme, cartes postales, semelles de liège, teinture d''iode, chlorate de potasse, pastilles de menthe. Le jeudi 12, la neige durcie fond au dégel et les routes deviennent des bourbiers ; course à Belle-Église le matin, liberté l''après-midi. Le vendredi 13, belle matinée froide puis ciel couvert ; journée libre et longue conversation avec le sous-lieutenant Gilbert, de Jersey, homme instruit et poète.'
