resume: 'Vendredi 10 novembre 1916 : belle journée ensoleillée ; matinée au bureau en l''absence du lieutenant Curtis et du commis, à lire, écrire et réfléchir près du feu ; l''après-midi, courses en auto à Raincheval et Léalvillers dans la campagne ensoleillée ; nuit de pleine lune. Samedi 11 : à pied à Varennes pour un achat de paille ; pour trouver une batterie d''artillerie (B Battery), marche dans un terrain détrempé. L''interprète de cette unité, M. Sorgues (?), est professeur au lycée de Toulon. Le soir, au repas, sifflement d''obus : Acheux bombardé à intervalles rapprochés, refuge à la cave. Achat de cartes postales à Varennes (75 c).'
