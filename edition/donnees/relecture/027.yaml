remarques: Le contexte suivant (028) revient sur l'attente en gare de Bailleul vers 1 h, ce qui confirme l'heure de départ du train (l. 7).
resume: 'Vendredi 25 août 1916 : départ à cheval vers 8 h, arrivée à Bailleul à 11 h ; embarquement des chevaux et des voitures terminé à midi et demi. Le train part vers 1 h 30 et passe sans arrêt par Hazebrouck (2 h), Berguette (2 h 30), Lillers (2 h 45), avant d''arriver à Saint-Pol à 4 h 30. Départ par la route à 5 h sous la bruine puis une pluie battante. Combes note le changement de paysage : pays boisé et pittoresque, verdure printanière, gerbes en meules.'
