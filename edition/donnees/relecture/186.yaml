resume: 'Le lundi 30 avril 1917, temps magnifique et soleil ardent : Hippolyte Combes fait ses courses en auto sans pardessus. Le matin, il passe à Vadencourt, Warloy, Hénencourt, Millencourt et Lavieville ; l''après-midi, avec le lieutenant Gilbert, à Puchevillers, Pierregot et Villers-Bocage ; en route, l''auto chasse un lapin sauvage. Ciel bleu, bourgeons qui grossissent ; après le tea-dinner, il rentre dans sa chambre et se couche tôt, fatigué. Nuit très belle sous la lune. Dépenses : blanchissage et miroir de poche acheté à Hénencourt, 50 c chacun.'
