resume: 'Jeudi 26 octobre 1916 : temps couvert et averses, plateaux et routes impraticables, lacs de boue et humidité pénétrante. Sans occupation d''interprète, Hippolyte Combes se retire dans sa chambrette ; nuits calmes, violente canonnade matinale de courte durée ; coupe de cheveux par un Royal Fusilier (50 c). Samedi 28 : pluie et boue persistent ; les matins du 27 et du 28, il descend en ville, parcourt les rues aux maisons vides et endommagées par les obus et s''arrête longuement devant l''église. Journée et nuit calmes, silence complet à l''horizon ; cartes postales (75 c).'
