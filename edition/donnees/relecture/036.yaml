difficultes:
- ligne: 6
  lemme: \inc{3} \ill . 1/2h – 60
  analyse: 'Crayon gris : premier chiffre à petite boucle haute fermée et grande boucle basse (8 aussi probable que 3) ; mot à haste initiale, o, minimes, jambage descendant sous le filet (long ?) ; point ; 1/2 suivi d''un h ; tiret ; 60, puis un tracé en < au bord, peut-être c.'
  alternatives:
  - 8 \ill . 1/2h – 60 c
  - 3 long . 1/2h – 60
- ligne: 7
  lemme: + \inc{5}
  analyse: Croix nette à l'encre noire, puis tracé brun pâle ; point d'attaque en haut, descente oblique sous la ligne, boucle de tête à droite ; même forme que le second chiffre de « 35 » (l. 8) et que le dernier signe de la l. 10.
  alternatives:
  - + f
  - + 5 c
- ligne: 8
  lemme: \inc{35}
  analyse: 3 net, puis signe en ſ à boucle, encre pâle ; aucun c.
  alternatives:
  - 3 f
- ligne: 10
  lemme: \inc{f}
  analyse: Après le deux-points, tracé pâle long et oblique, boucle à mi-hauteur à droite, coupé par le bord de la photographie ; aucun 1 distinct.
  alternatives:
  - 1f
  - '5'
controle:
- ligne: 0
  avant: 'date « complément, écrit après le 4 » ; critique : page écrite à la suite de celle du lundi 4 (035)'
  apres: 'date « (suite) » ; critique : recto du f. 18, avant la page du lundi 4'
  justification: codicologie.yaml (edition/donnees) place 036 au f. 18 r° (ordre 34) et 035 au f. 18 v° ; seul le verso a été photographié le premier. La page 034 contenait déjà le début du dimanche 3.
- ligne: 6
