  apres: '1 Eponge : 60 – – — 1/4 livre choc^{t} Poulain : \inc{f}'
  justification: E bouclé initial, sans accent ; après 60, deux petits traits puis un tiret long, aucun c ; t surélevé après choc ; au bord droit, un seul tracé pâle.
