remarques: Ligne au crayon (l. 6) et signes pâles des l. 7, 8 et 10 (5 en ſ ou f) à revoir sur l'original ; ils se valent mutuellement.
resume: 'Suite de la journée du dimanche 3 septembre 1916 : Hippolyte Combes note les champs d''avoine encore sur pied, tout jaunes, qui bruissent sous la brise. Le reste de la page est blanc jusqu''aux comptes, précédés d''une ligne au crayon en partie illisible. Les achats faits à Saint-Pol comprennent des cartes postales, une carte du département de la Somme, une Géographie du Pas-de-Calais, du savon de sellerie, une éponge et un quart de livre de chocolat Poulain.'
