resume: Le 18 octobre 1916, Hippolyte Combes a dormi dans la tente du mess, allongé sur un fauteuil de jardin, les deux cuisiniers à l'autre bout ; nuit très froide. Après le petit déjeuner, un camion chargé d'obus l'emmène à Albert, où il passe à la Mission française. Il erre en ville, s'arrête longuement devant la basilique ravagée par les obus et parcourt des rues aux maisons vides et abandonnées. L'après-midi il retourne à Albert en camion et revient de même au camp. Ciel couvert tout le jour, boue épaisse ; le soir, assis sur une caisse hors de son abri, il observe le camp et la route au-delà.
