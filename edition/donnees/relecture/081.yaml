remarques: Page entièrement à l'encre violette, d'une seule main et d'un seul jet. Lieu (Albert, brickfield area) déduit du cliché 080. Seconde lecture (p2) faite ; critique laissé vide, faute d'élément vérifiable sur la page.
resume: Le soleil reparaît un peu, mais la bise est glaciale et la boue reste épaisse. Toute la journée, un bombardement terrifiant à quelques kilomètres fait trembler vitres et portes et empêche de dormir. Hippolyte Combes monte prendre ses repas sur le plateau voisin, où le mess est installé dans une cahute de caisses de munitions vides, et s'organise dans sa chambrette. La nuit, du haut de la colline où bivouaque la compagnie, il voit à gauche l'horizon illuminé par les éclairs des canons, dont la canonnade ne cesse pas.
