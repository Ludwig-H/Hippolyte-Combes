resume: 'Le lundi 19 février 1917, par temps couvert et ondées, Hippolyte Combes explore Fréchencourt et Bavelincourt pour trouver paille et foin ; il note un solde de caisse de 225 f 95. Au thé, un capitaine (Leonard ?) lui annonce de nouveaux arrangements de logement : le soir il quitte le 7b pour l''ancienne chambre du capitaine Williams, près du bureau, très froide et ruisselante d''humidité. Vers 9 h 30, la propriétaire du n° 104 tombe malade ; il va chercher le curé et le médecin militaire. Le mardi 20, il ne peut rester dans sa chambre humide et passe la journée au bureau ; le matin, il cherche paille et foin dans les fermes de Pierregot par des routes impraticables. Comptes : coupe de cheveux, blanchissage et service de chambre payés à Albertine, à Hérissart.'
