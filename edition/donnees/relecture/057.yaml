resume: 'Le samedi 30 septembre 1916, à Toulouse, temps pluvieux. Le matin, Hippolyte Combes rend visite à Mme de Labarthe, pour qui il a un attachement profond, puis monte à Sainte-Marie vers 11 h 30 et passe quelques minutes en tête-à-tête avec Marguerite. L''après-midi, promenade à pied à Montaudran : il monte au clocher de l''église, admire la plaine du Lauraguais et fait sonner les cinq cloches. Au cimetière de Terre-Cabade, devant le caveau des Pères jésuites et celui du P. Marie-Antoine, Marguerite et lui échangent des serments, en souvenir de leur grand ami et de Josèphe. Dépenses : tram, confiseries et gâteaux, bière et limonade.'
