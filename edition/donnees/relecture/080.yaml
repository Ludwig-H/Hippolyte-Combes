resume: 'Le jeudi 19 octobre 1916, Hippolyte Combes est réveillé à 6 heures par l''orage ; la pluie torrentielle a duré toute la nuit et la matinée, rendant le sol impraticable. Abrité sous la tente du mess, il attend le départ, quitte le camp vers 11 heures sur un wagon et arrive vers 1 heure au secteur des briqueteries (brickfield area) d''Albert, où l''on doit bivouaquer sous la pluie dans la boue. Il trouve une petite chambre dans une maison d''une rue voisine, à trois ou quatre cents mètres du camp, et s''y installe. Toute la nuit, canonnade très forte et ininterrompue. Dépense : cartes postales d''Albert, 20 centimes.'
