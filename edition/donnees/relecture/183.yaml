resume: 'Le lundi 23 avril 1917, beau temps : courses à Toutencourt et Pierregot le matin (mention de métiers à tisser), à Acheux et Puchevillers l''après-midi ; promenade vers le cimetière et beau coucher de soleil. Le 24, vraie journée d''été, ciel azur et bourgeons vernissés ; course à Toutencourt et Pierregot, puis promenade sur la route de Mirvaux avec vues sur Beaucourt et Montigny. Le 25, ciel couvert et ondées, temps refroidi ; Acheux est vide de troupes ; après-midi à Pierregot chez Mme Mignot (lecture douteuse) et Louise, soirée chez la famille Denis à Hérissart.'
