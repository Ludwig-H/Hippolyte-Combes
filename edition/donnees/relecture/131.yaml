remarques: 'Comptes du 27 janvier au cliché 132 ; le carnet reprend ensuite à Toulouse. Remarque du commentateur historique (p1, reportée ici) : la mort d''Henri Faure le 11 juin 1918 ne repose que sur la tradition familiale et reste à vérifier.'
resume: Suite du samedi 27 janvier 1917, à Paris. Hippolyte Combes arrive vers midi et demi (heure incertaine) chez Mme Faure, au quatrième étage d'un immeuble de Neuilly, où il est accueilli très affectueusement ; il déjeune en famille avec Mlle Germaine et Marcel, les deux autres fils, Henri, aspirant, et André, qui prépare Polytechnique, étant absents. Vers 4 heures, il prend congé et gagne en métro le boulevard Saint-Michel, chez l'opticien Imbert, mobilisé, dont il voit le remplaçant, puis fait plusieurs achats aux magasins de l'Hôtel de Ville. Il remonte la rue de Rivoli, dîne au restaurant et se rend à 7 heures à la gare d'Orsay. Installé dans un compartiment surchauffé où voyagent quelques soldats, il part vers 7 h 50 et s'assoupit peu à peu.
