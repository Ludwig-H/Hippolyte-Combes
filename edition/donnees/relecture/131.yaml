difficultes:
- ligne: 2
  lemme: Mme
  analyse: 'M (délié d''attaque et deux jambages), puis e et long délié tiré jusqu''au F, sur la ligne de base : aucune surélévation nette ; transcrit Mme selon l''usage de l''édition'
  alternatives:
  - M^{me}
  - Me
- ligne: 3
  lemme: midi \inc{30}
  analyse: '3 net à panse descendante ; puis grande courbe ouverte à droite, de la hauteur des hampes jusque sous la ligne, plus haute que le 3, lue 0 ; enfin, détaché, un petit trait montant, un court jambage et un long trait horizontal terminé en massue : tiret. 3/4 supposerait une barre oblique et un 4, que les traits ne montrent pas nettement ; la forme de 139 l. 8 (« midi 3? ») est différente et n''aide pas'
  alternatives:
  - 3/4
- ligne: 11
  lemme: remplacant
  analyse: rempl + a fermé + c sans cédille + boucle de type e (a réduit ?) + deux ou trois jambages + t dont la barre file loin à droite ; les deux hampes descendantes de « St » (l. 10) traversent la fin du mot. « remplacemt » est graphiquement possible ; le sens (Imbert mobilisé, remplacé au magasin) appelle remplaçant
  alternatives:
  - remplacem^{t}
- ligne: 12
  lemme: plusrs
  analyse: p + l bouclé + jambages + s final plongeant ; un point au-dessus de la fin du mot pourrait signaler un i (plusirs) ; forme du tableau des abréviations retenue
  alternatives:
  - plusirs
- ligne: 12
  lemme: achats
  analyse: 'le long trait montant sous « acha » est la barre du premier t de « restaurant » (l. 13), tirée à hauteur de la tête du t et décalée vers la droite ; le second t a sa propre barre : pas de soulignement'
  alternatives:
  - \sl{achats}
- ligne: 13
  lemme: Remonté
  analyse: R + e + m à premier jambage haut (aspect l) + o + n + t barré + é ; le long trait oblique qui traverse le mot est le jambage du g de « Magasins » (l. 12)
  alternatives:
  - Retourné
- ligne: 13
  lemme: '&'
  analyse: 'tête en V ouvert (forme de y), mais une barre horizontale coupe la descente : critère de l''esperluette ; le signe relie « Diné restaurant » et « A 7^{H} s. »'
  alternatives:
  - y
