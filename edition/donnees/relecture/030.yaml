resume: Le 28 août, giboulées et éclaircies comme en mars, routes changées en cloaques ; Hippolyte Combes doit aller matin et soir aux champs pour le fourrage vert. Il se plaint de son logement et d'une vie végétative déprimante, puis regarde le soir des paysans moissonner à la machine. Le 29, il accompagne encore matin et soir le lieutenant Curtis à travers champs, sous la pluie ; violent orage l'après-midi, la cour de la ferme devient une mare. Il note la confirmation de l'entrée en guerre de la Roumanie, « sœur néo-latine ».
