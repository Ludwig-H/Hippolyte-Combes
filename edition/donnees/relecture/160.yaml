remarques: Cavalerie indienne non identifiée par l'auteur.
resume: 'Mardi 27 février 1917, temps couvert et doux : le capitaine Williams, souffrant des dents, garde le lit jusqu''à une heure, d''où une journée de liberté ; promenade sur la petite route de Toutencourt, entre champs de barbelés et de tranchées. Mercredi 28, temps frais mais beau, « commencement du printemps » ; l''après-midi, recherche de fourrage et de paille à Toutencourt. Le matin, plusieurs régiments de cavalerie indienne ont traversé Hérissart (chevaux, lances, turbans). Mess de février depuis le 8 : 33 francs.'
