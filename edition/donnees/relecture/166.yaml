remarques: L'adresse laissée en blanc (l. 9 et 11) est celle du logement d'abord envisagé à Toutencourt ; le billet 220 est à Hérissart, siège du Purchase Board ; la suite de la journée se lit en 167 (« 2 fenêtres »).
resume: Le dimanche 11 mars 1917, Hippolyte Combes termine ses paquets, résolu à quitter le village et le Purchase Board. Il part en auto pour Toutencourt, laisse ses sacs au mess des interprètes, rue de Raincheval, et cherche un logement au camp. Au bureau de la Mission, il apprend que le major Levy a demandé avec insistance qu'il reste au Purchase Board ; long entretien avec un jeune lieutenant (nom ajouté au crayon, Godare ou Godard). Revenu en camion jusqu'au tournant de Puchevillers, il s'installe définitivement au billet 220, après le départ de l'interprète Valet, et se trouve bien dans sa nouvelle chambre.
