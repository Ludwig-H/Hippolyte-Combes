difficultes:
- ligne: 4
  lemme: tiédit l'air
  analyse: t-i-é-d-i-t net (point du i, d en ∂, longue barre de t). Puis une haute boucle (l), une seconde boucle plus courte prise pour l'apostrophe, a-i-r et point du i reporté à droite. « clair » supposerait un c initial bouclé ; le sens retient l'air.
  alternatives:
  - tiédit clair
- ligne: 5
  lemme: quitterai
  analyse: q-u-i-t-t-e sous une barre commune ; suivent un r montant et un i pointé collés à l'attaque de sans ; aucun a distinct.
  alternatives:
  - quitte
  - quitterais
- ligne: 7
  lemme: en.
  analyse: Petite panse fermée + jambage (aspect a), puis point sur la ligne ; aucune arche de n. Le trait au-dessus appartient au i de parti.
  alternatives:
  - à.
  - a.
- ligne: 15
  lemme: Godare
  analyse: Crayon. G bouclé descendant, o, d à haute haste, a, r, puis e bouclé à queue descendante, sans haste finale. La lettre à lettre donne Godare ; Godard reste possible (d final réduit).
  alternatives:
  - Godard
- ligne: 21
