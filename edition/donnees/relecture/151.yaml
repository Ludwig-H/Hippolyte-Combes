resume: 'Suite du samedi 10 février 1917 : Hippolyte Combes poursuit en auto vers Aveluy, où son ancienne compagnie campe sous la tente dans un champ dévasté ; il déjeune au mess avec le lieutenant Bradfield, visite le cantonnement et cause avec sous-officiers et hommes. Ciel bleu, soleil brûlant, canons de marine camouflés, deux avions allemands canonnés. Au retour, arrêt au refilling point (capitaine Lovet), puis à la Mission française du 2e corps (capitaine de Casteljau, jugé énorme et bête) ; retour par Senlis et Acheux vers 3 h 1/2. Le dimanche 11, nuit très froide et gel, puis soleil de midi annonçant le dégel.'
