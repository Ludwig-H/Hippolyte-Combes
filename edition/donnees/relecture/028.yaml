remarques: 'L. 16 : « haut d''1 plateau » d''une encre plus appuyée (plume rechargée). L. 6 (et), 7 (p.), 19 (vx g) et 21 (montant) restent incertaines.'
resume: 'Suite du vendredi 25 août 1916. En gare de Bailleul vers 1 heure, puis dans le train, Hippolyte Combes écoute des tommies jouer une musique d''harmonica monotone sous un ciel pommelé et note des réflexions amères sur l''État qui a mobilisé les corps et prend encore l''intelligence et le cœur. Le ciel se charge, l''orage menace, une brise agite les tilleuls le long de la voie ; la pluie le trempe jusqu''à la peau. Vers 7 heures, il arrive à Marquay, hameau perché sur un plateau d''Artois, où il trouve à grand-peine une chambrette exiguë partagée avec un autre occupant ; il est invité à dîner au mess des officiers. Comptes : pourboire au groom, nourriture à Bailleul et à Saint-Pol.'
