remarques: 'Petit trait isolé au bord droit vers y = 0,515 (tache ou amorce), sans valeur textuelle. Le soulignement de l''en-tête de droite court sous Octobre et le début de /16. Contrôle p2 : 9^{H} (boucle fermée + haste, H suscrit), et (l. 7), 40c, M^{te} surélevé, Tjs (s réduit à un trait) confirmés au zoom ; l''identification de Jean à l''abbé Crouzet reste une hypothèse du commentateur.'
resume: 'Dimanche 1er octobre 1916 à Toulouse : messe à la cathédrale Saint-Étienne à l''autel paroissial, Marguerite à ses côtés. Matinée à ranger ses affaires dans son appartement, puis déjeuner à Sainte-Marie. L''après-midi, tram jusqu''à Lardenne puis marche jusqu''au pont du Touch ; longue causerie avec Marguerite assis dans l''herbe au bord de la rivière. Au retour il trouve Jean à la maison et redescend avec lui en tram à 9 h 30. Dépenses de tram et de confiseries.'
