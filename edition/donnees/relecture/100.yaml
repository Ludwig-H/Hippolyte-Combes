remarques: Ligne 2 « Nuit gelé très » écrite sous le soulignement de la date, entre la date et le mois, traitée comme ligne propre (l. 25 pour les comptes).
resume: Le vendredi 17 novembre 1916, après une nuit de forte gelée, Hippolyte Combes parcourt en auto Authie, Orville et Amplier sous une bise glaciale ; libre l'après-midi, il assiste à 6 heures du soir à une conférence sur la Russie dans la baraque du Y.M.C.A. Toute la nuit et à l'aube du samedi 18, une très violente canonnade lointaine fait vibrer portes et fenêtres. Le matin il fait l'aller-retour à Albert en camion ; la première neige tombe puis fond sous la pluie, et les routes deviennent des fondrières. À Albert, il touche sa solde (88 francs) et achète trois cartes postales.
