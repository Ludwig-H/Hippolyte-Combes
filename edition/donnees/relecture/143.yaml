remarques: Lieu du séjour (Millau) repris des pages précédentes, non nommé sur la page. Plusieurs marques prises pour des accents par l'état antérieur sont des points d'i déportés. Le 3 de la l. 18 a une tête fermée (aspect 8) ; 3 retenu.
resume: 'Dernier jour du séjour auprès de Marguerite : lever à 6 heures, sortie à deux au cimetière après le déjeuner, départ fixé au train de 5 h 33. Hippolyte Combes quitte la maison vers 5 heures après des adieux déchirants ; Pierre l''attend à la gare. Le train venant de Béziers part avec un long retard à 6 h 15, en 2e classe, s''arrête à toutes les stations dans la neige et arrive à Saint-Flour à minuit 30. Comptes : remboursement à Marguerite des cadeaux faits aux enfants Vincens (6 f) et gratification à sa bonne (3 f).'
