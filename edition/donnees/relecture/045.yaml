resume: Pluie battante toute la journée. Rappelé à la Mission française par un message reçu la veille, Hippolyte Combes part à cheval vers 13 h 30 par des routes boueuses. À Hédauville il apprend que la 18e division n'a pas quitté Acheux et que son quartier général reste en place ; il gagne Acheux par Forceville et y retrouve la mission française de la division. Retour avec Brammas (lecture incertaine), trempé ; dérangement intestinal attribué au régime du mess des officiers ; couché tôt. Pourboire de 2 francs à son ordonnance Connelly.
