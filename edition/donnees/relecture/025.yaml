remarques: 'Seconde lecture : points signalés par le commentateur historique vérifiés sur l''image (l. 4, 18, 19) ; les incertitudes demeurent. Le crochet des comptes a un long trait de tête au niveau de la l. 20 et un pied sous la l. 21. Les traits bruns qui croisent les montants des l. 20–21 appartiennent à « parfaite » (l. 19).'
resume: 'Temps couvert le matin et en fin de journée, brume légère dès 6 h 30. L''après-midi, Hippolyte Combes pousse à cheval jusqu''à Estaires, petite ville animée et commerçante, dont il visite l''église (chœur, stalles ogivales, statuettes en bois, saint Ambroise) et remarque l''écusson peint au-dessus du perron de l''hôtel de ville. Routes poussiéreuses, campagne plate, monotone et sans pittoresque ; l''exercice physique lui fait du bien au moral. Dépenses : cartes postales et chocolat.'
