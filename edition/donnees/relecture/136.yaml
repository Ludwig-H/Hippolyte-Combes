resume: 'Le mercredi 31 janvier 1917, à Toulouse, la nuit a gelé très fort ; dans la journée il neige un peu et souffle une bise glaciale. Le matin, Hippolyte Combes rejoint Marguerite à son tram à Saint-Sernin vers 10 h ; ils font ensemble le marché Victor-Hugo. L''après-midi, ils descendent en ville, se promènent par des rues abritées et visitent l''hôtel d''Assézat, la Daurade et la Dalbade, puis se reposent deux heures à son appartement. Il la ramène à Sainte-Marie vers 6 h ½ et rentre à pied vers 9 h sous de légers flocons. Comptes : achats aux halles Victor-Hugo (gigot, fromages, beurre, sardines, dattes, figues, gâteaux), trams et télégramme à Mme Spagnol, à Nice.'
