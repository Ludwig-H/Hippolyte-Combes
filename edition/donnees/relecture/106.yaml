resume: 'Le dimanche 3 décembre 1916, après une nuit très froide, Hippolyte Combes fait en auto de longues courses, de 8 h 30 du matin à 6 h 30 du soir : Septenville et Hérissart le matin, déjeuner chez le lieutenant Walsh, puis Marcelcave l''après-midi par Corbie et Villers-Bretonneux, retour par Warfusée-Abancourt. Une brume glaciale enveloppe tout ; il note les moulins squelettiques au milieu des champs et le loisir de ruminer et d''observer. Comptes : deux bocks à Hérissart et la solde (78 f 75) touchée au bureau de la Mission du XIIIe corps à Acheux, la prochaine le 17. Le lundi 4, dégel et routes boueuses ; matinée dans la grange de Mme Guerle, puis courses en auto à la ferme de Belle-Église (Arquèves) et à Louvencourt. Le soir, le lieutenant Walsh et son interprète sont invités à dîner ; le capitaine Williams est de plus en plus sympathique.'
