remarques: 'Remarque du commentateur historique tranchée : l''express est bien « midi 30 » (12 h 30), conforme à l''état antérieur et à R6 F4/F6. « Auriol » reste non identifié et réservé ; « Jean » = abbé Jean Crouzet reste une identification probable.'
resume: Samedi 3 février 1917, dernier jour du séjour à Toulouse. Levé à 5 h, Hippolyte Combes range ses affaires, passe chez un joaillier (Auriol ?) et chez le dentiste, puis rejoint Marguerite et part de Sainte-Marie vers 11 h 40 ; l'oncle les accompagne à la gare. Express de midi 30 (retard de 15 minutes) ; à Carcassonne il embrasse Jean ; à Béziers, à 4 h 30, montée à pied en ville, visite rapide de la cathédrale et panorama de la terrasse au soleil couchant. Petit train à 5 h 23, vieux wagons sans deuxième classe ; arrivée à Millau à 10 h 30, où Pierre les attend ; accueil très affectueux des parents de Marguerite.
