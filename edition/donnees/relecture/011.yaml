resume: Le soir du vendredi 4 août, Hippolyte Combes s'assied et se promène dans les pâtures de la ferme où il loge, écoutant le vent dans les feuillages des grands arbres. Impression de solitude et d'abandon, loin de la ville ; sans le vert intense des frondaisons on se croirait déjà en automne. Remonté dans sa mansarde à la nuit tombée, il entend la famille du fermier dire en commun la prière du soir, menée par la voix grave et monotone du père ; la fin de la ligne, noyée d'encre, reste en partie illisible.
