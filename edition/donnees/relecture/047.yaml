difficultes:
- ligne: 1
  lemme: \sl{Ve –}
  analyse: trait arqué fin entre les l. 1 et 2, de x≈.07 à .17, sous Ve et le tiret, ne couvrant pas 22 ; pris pour le soulignement de la date, décalé vers le bas
  alternatives:
  - \sl{22 Ve} –
  - 22 Ve – (trait parasite)
- ligne: 7
  lemme: '"'
  analyse: 'trois petits crochets entre vif et blancs (x≈.47–.56) : le premier, plus bas, virgule ; les deux suivants = signe d''idem pour maillots ; « blancs » : finale réduite à un crochet, s non assuré'
  alternatives:
  - vif " " blancs
  - vif, " blanc
- ligne: 9
  lemme: chateau cap
  analyse: 'deux traits horizontaux au-dessus du mot : l''un au-dessus du a (x≈.67), l''autre au-dessus de la finale (x≈.80, y≈.335), l''un accent circonflexe décalé, l''autre barre de t décalée ; aucune virgule avant cap (le trait descendant x≈.86 est la haste du d de « demain », l. 10)'
  alternatives:
  - château cap
  - chateau — cap
- ligne: 17
  lemme: 3^{f}
  analyse: 'zoom ×3 [.40 .885 .58 .965] : après le 3, petit tracé en S (boucle de tête, panse ouverte) suscrit, dont le délié descend vers la droite jusqu''à la tête du f de la l. 18 ; forme compatible avec un f monétaire bouclé comme avec un 5'
  alternatives:
  - 3^{5}
  - 3 f 5
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Le manuscrit porte seulement « Pant » : le développement Panton suit la table des abréviations (Pant. = capitaine Panton, cf. autres clichés) ; il est donné dans l''apparat comme développement, non comme leçon. La somme « 3 f » de la l. 17 reste douteuse (lecture en \inc).'
  alternatives: []
controle:
