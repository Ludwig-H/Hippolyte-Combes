- ligne: 9
  avant: chateau, cap
  apres: chateau cap
  justification: aucune virgule ; le trait descendant pris pour elle est la haste du d de « demain » (l. 10) ; le trait au-dessus de la finale est un accent ou une barre de t décalés
- ligne: 13
  avant: voyage à Toul\trait
  apres: voyage a Toul\trait
  justification: a ouvert sans accent ; le trait au-dessus de « voyage » est la virgule de la l. 12, celui au-dessus de Toul le crochet de tête du T
- ligne: 15
  avant: Nuit très sombre — qq
  apres: Nuit très sombre\trait qq
  justification: le long trait horizontal prolonge sans levée de plume la finale de sombre (zoom ×3), délié prolongé, non tiret
remarques: Le départ du 25 désigne la permission pour Toulouse (séjour 055–064). Le chateau est le logement de la compagnie près de Raincheval.
resume: 'Le vendredi 22 septembre 1916, par un temps splendide et un soleil ardent, Hippolyte Combes va à pied jusqu''à la station de Raincheval s''informer des horaires des trains. Au retour, il assiste à un match de football sur une prairie près des lignes de chevaux des Bedfords. En passant devant le château, il apprend du capitaine Panton que l''unité part le lendemain : grande déception. Dernière nuit dans sa chambre ; il songe à ses paquets et au voyage à Toulouse, départ le 25. Comptes : boîtes de lait au café à la cantine, œufs et nourriture.'
