remarques: 'Suite au cliché 131 (appartement de Mme Faure, au 4e étage à gauche ; arrivée vers midi 30). Numéro de la rue d''Armenonville non assuré (premier chiffre noyé d''encre). « gare de Orsay » : leçon littérale, d''Orsay voulu. « Paris » (l. 11) d''encre plus pâle, sans doute plume presque sèche, non un ajout.'
resume: Le train arrive enfin à Amiens vers 2 heures du matin. Avec deux interprètes, dont Boilly, professeur à Pont-à-Mousson, Hippolyte Combes sort de la gare, ne trouve aucune place à l'abri du soldat du boulevard Alsace-Lorraine, entre à la baraque Y.M.C.A. voisine de la gare, puis déambule des heures sur le quai, par un froid très vif, en attendant le train Boulogne-Paris, arrivé vers 5 h 30 avec deux heures de retard. Dans un compartiment de 2e classe confortable mais à l'air brûlant, il parvient à s'assoupir un peu. Arrivé gare du Nord vers 11 h 15, il gagne en fiacre la gare d'Orsay, où il prend son billet et fait enregistrer ses bagages en dix minutes, puis va en métro (Tuileries – Porte-Maillot) à Neuilly. Après cinq minutes de marche, il arrive rue d'Armenonville, dans une maison luxueuse, au 4e étage à gauche.
