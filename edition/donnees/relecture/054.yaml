resume: 'Après une nuit passée en train, Hippolyte Combes arrive à Toulouse à 7 h 30 et gagne son appartement en tram. À 11 h il monte à Sainte-Marie-des-Champs : les dames Calmels ne doivent arriver que le soir ; il déjeune chez les Crouzet, dans la plus grande intimité, puis fait des courses en ville. À 5 h il remonte à la Côte Pavée et revoit enfin Marguerite, « charmante de simplicité & de tendresse confiante ». Comptes : trams, bain aux Thermes du Languedoc, cartes postales (montant laissé en blanc).'
