remarques: 'Village de cantonnement (l. 8) : Hérissart d''après les pages voisines. Ligne 13 : la date et « Au reveil » sur la même ligne, sans rejet à droite.'
resume: 'Jeudi 15 février 1917 : nuit de gel, beau soleil ; le matin, courses à Toutencourt, Raincheval et Puchevillers ; l''après-midi, il écrit dans sa chambre puis se promène au village en grande tenue et voit le maire, population sympathique. Nuit très belle et étoilée, gel persistant, rues en pente couvertes de glace. Vendredi 16 : vitres givrées au réveil, puis radoucissement et dégel rapide. Matinée en auto : il reste deux ou trois heures dans le village de Beaucourt, fermes et château, à la recherche de paille et de foin ; après-midi libre.'
