remarques: Cantonnement à Hérissart (cf. 153). Seconde lecture faite sur zooms ×3 (Couin, 6^{h} ½, arret, ponctuation finale).
resume: 'Mardi 13 février 1917 : nuit moins froide, dégel ; course à Authie par Puchevillers sous une bise glaciale, après-midi libre. Mercredi 14 : gel nocturne, vitres couvertes d''arabesques de givre ; beau soleil. Après le petit déjeuner, tournée en auto à Authie, Couin et Acheux, repas au café de l''Hôtel de Ville à prix exorbitants ; arrêt à Toutencourt au retour, puis nouvelle visite vers six heures et demie pour rencontrer M. Lefèvre. Nuit étoilée sans lune, froid vif.'
