remarques: Le grand trait vertical à l'extrême droite de la l. 10 est la descente de « message » (l. 9) ; la haste qui traverse le premier mot de la l. 15 est la descente du y de « Coy » (l. 14). Le village quitté (l. 6) est celui du cliché 047 (Raincheval).
resume: 'Le 23 septembre 1916, par un temps superbe, la compagnie quitte son cantonnement à 9 h 30 ; près du garage de Léalvillers, Pizzi arrive en auto avec un message qui oblige à rebrousser chemin et à attendre dans un champ près du refilling point. Hippolyte Combes gagne seul à cheval la gare d''Acheux ; le capitaine West l''y rejoint vers 14 h 30 et toute la compagnie repart. On cantonne en plein air au flanc d''un coteau, au tournant de la route de Forceville ; il s''installe une hutte garnie d''une épaisse bâche verte. Dépenses : propriétaire d''Acheux (cuisine), une carte du Petit Journal.'
