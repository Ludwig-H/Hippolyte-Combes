remarques: '« les 3 1ers villages » : Bresle, Laviéville, Hénencourt.'
resume: Le 18 avril, pluie fine toute la journée ; routes en état lamentable ; l'auto est aux ateliers, repos complet. Le 19, ciel couvert et temps doux ; tournée en auto à Bresle, Laviéville, Hénencourt, Warloy et Contay, villages revus vides et déserts, où il n'était pas retourné depuis fin juillet 1915 ; le lieutenant Gilbert, revenu d'Abbeville, passe la soirée avec eux. Le 20, assez belle journée ; courses à Rubempré, Senlis, Warloy, puis Hénencourt, Albert, Buire et Ribemont. L'auto s'embourbe à la sortie de Buire et des Australiens aident à la dégager ; à Ribemont, il revoit les Colart, qui lui font meilleur accueil.
