- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'À vérifier sur l''image : 1046 caractères ; sources : Puckle 1917 (p. 8, 26), London Gazette suppl. 29585 (W. H. Levy, candidat probable mais pas prouvé), OH 1916-II p. 462, Bulletin des armées du 22 mars 1916 ; pas de p2, rédigé sur p1. « D.O.S.T. » est bien lu sur l''image et le sigle n''est attesté nulle part ; je le donne comme l''abréviation possible de « D. of S. and T. ». J''ai corrigé « lieux » en « Acheux-en-Amiénois, Raincheval, Albert (Somme) ». Le cliché 093 est un doublon de cette page (f. 46 r°). — Contrôle p2 : quatre lettres capitales séparées par des points, D en ∂, O, S, T : lecture D.O.S.T. confirmée ; aucun autre point du commentaire ne touche la lecture.'
  alternatives: []
controle:
- ligne: 2
  avant: 'of the : du (service)'
  apres: 'of the : de la'
  justification: traduction accordée au sigle féminin (la D.O.S.T., direction)
- ligne: 7
  avant: (pas de note)
  apres: '1 peu : un peu'
  justification: le chiffre 1 mis pour l'article est une abréviation de la table ; note manquante
- ligne: 10
  avant: '\trait : queue du y de « lorry » prolongée…'
  apres: '(note supprimée) ; ajout de « 1 lorry : un (camion) »'
  justification: la balise \trait rend seule la disposition ; note d'abréviation du 1 manquante
- ligne: 16
  avant: '58^{f} 75 : 58 francs 75 ; f suscrit au-dessus du 7, 5 en boucle (ℓ)'
  apres: '58^{f} 75 : 58 francs 75'
  justification: description paléographique retirée de l'apparat imprimé (portée dans difficultes)
remarques: Le cliché 093 est une seconde prise de vue de la même page (même cadrage). 093 est un peu plus net et mieux contrasté (boucles du f suscrit et du 7 de 58^{f} 75, l. 16, mieux détachées) ; 091 reste entièrement lisible et aucune lecture ne diffère entre les deux prises.
resume: 'Le soir du jeudi 2 novembre 1916, après le dîner, Hippolyte Combes va en auto à Raincheval voir le major Levy, de la D.O.S.T., et se couche tard par une nuit très noire ; il note un don de 5 francs à Victor Duchateau, le mess d''octobre (47 f 70) et des cartes postales à Acheux. Le vendredi 3, par ciel couvert, il part en auto avec le lieutenant Curtis, reste à Albert et revient seul sur un camion par des routes mauvaises et encombrées de véhicules. Il repasse au camp, à la 152 Coy et au bureau de la Mission, puis rentre à Acheux à 2 h 30 et passe la journée dans sa chambre et au bureau. En bas de page : solde de la Mission à Albert, 58 f 75, dont 30 francs retenus pour six jours de permission.'
