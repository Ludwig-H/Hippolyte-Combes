remarques: Le village de cantonnement (Hérissart, d'après les pages voisines) n'est pas nommé sur la page.
resume: 'Le lundi 26 mars 1917, la pluie transforme les rues en cloaque. Monin passe au village avec sa compagnie pour y cantonner une nuit : Combes le revoit avec plaisir, mais le trouve vieilli et usé. Le 27, il y a des giboulées et de la neige. Combes court le matin à Rubempré, puis va à Puchevillers. Les troupes ont quitté le village à l''aube. Le 28, Combes est libre ; il fait froid, et il se promène en fin d''après-midi sur la route de Puchevillers.'
