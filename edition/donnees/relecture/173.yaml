difficultes:
- ligne: 5
  lemme: \inc{arrivé}
  analyse: 'Après Monin (x ≈ .235–.40, y ≈ .185) : a, r, r en c, i (point déporté à droite), v lié à e, accent déporté. La boucle descendante à l''attaque (x ≈ .21) est le g de patauge (l. 4) ; la haste montante voisine est le L de L''ai (l. 6). Pas de hautes boucles de ss comme dans « Passé » (l. 6) : « passé » exclu.'
  alternatives:
  - traversé
  - venu
- ligne: 7
  lemme: \inc{usé}
  analyse: Après la virgule, u puis une finale plongeante au bord droit, sans accent visible, puis un point.
  alternatives:
  - us.
- ligne: 2
  lemme: intermitt^{te}
  analyse: 'Finale suscrite (x ≈ .60–.64, y ≈ .065) : petit trait vertical bouclé puis arche à queue ; aucune barre de t visible, d''où « en » possible ; développement identique.'
  alternatives:
  - intermitt^{en}
- ligne: 16
  lemme: très
  analyse: t et r liés, è puis une finale réduite, sans s distinct.
  alternatives:
  - tr.
- ligne: 20
  lemme: après-midi
  analyse: Le trait d'union est réduit à un point bas entre après et midi ; non noté.
  alternatives:
  - après.midi
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'À vérifier sur l''image : JMO 7/Bedf (26-27 mars 1917), Nichols 1922 p. 166, LLT (QG du II Corps et de la Fifth Army, CCS), CWGC Puchevillers, OH 1917-I p. 151 ; Monin n''est pas identifié ; la lecture « arrivé » (l. 5) reste incertaine (contrôlée p2 : « passé » exclu, « traversé » non soutenu).'
  alternatives: []
