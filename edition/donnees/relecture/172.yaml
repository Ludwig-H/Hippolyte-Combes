remarques: Encre violette uniforme ; « Superbe sunset. » (l. 18) plus pâle, plume qui s'épuise, sans indice d'ajout. Lieu de séjour (Hérissart) déduit du billet 220 (cliché 166), non nommé ici. Le numéro 220 est confirmé par le cliché 166 (« porté ts mes paquets au billet 220 »).
resume: 'Vendredi 23 mars 1917 : forte gelée, vitres couvertes de glace, puis grand soleil et chants d''oiseaux ; l''auto est aux ateliers, Hippolyte Combes, libre, lit et écrit au bureau et dans sa chambre, fait des démarches pour garder son billet n° 220 et se promène dans la campagne. Samedi 24 : nuit froide, soleil vif, vent violent ; l''après-midi, marche à pied jusqu''à Rubempré et au chemin de Puchevillers ; superbe coucher de soleil. Dimanche 25 : temps nuageux matin et soir, soleil ardent dans la journée ; nouvelle course à pied à Rubempré, sans pardessus.'
