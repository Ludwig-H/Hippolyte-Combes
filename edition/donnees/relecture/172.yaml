difficultes:
- ligne: 2
  lemme: gelé
  analyse: pâté d'encre couvrant le début du mot (la hampe du f de « fenêtre », l. 3, y monte) ; « le » final net ; un accent peut être masqué par la crosse du soulignement de la date. Parallèle « Gelé assz fort » l. 13.
  alternatives:
  - gelé
- ligne: 17
  lemme: j
  analyse: tracé unique en ȝ descendant, surmonté d'un petit crochet (point du j) ; le trait vertical au-dessus de « chemin » est le jambage du p d'« Après » (l. 16), non une apostrophe ; le n final de « chemin » plonge (aspect z).
  alternatives:
  - j'
  - chemins
- ligne: 10
  lemme: Ds
  analyse: D en ∂ suivi d'un petit crochet (s réduit) ; même tracé l. 20 ; « Ds la journée » attesté ailleurs.
  alternatives:
  - De
- ligne: 12
  lemme: étoilée
  analyse: aucun accent visible, mais la zone est encombrée par les jambages de « campagne » (l. 11) ; leçon de p1 conservée.
  alternatives:
  - etoilee
- ligne: 21
  lemme: ':'
  analyse: deux points nets, le supérieur entre les lignes 20 et 21, l'inférieur sur la ligne de base, en oblique comme l'écriture ; le point de la l. 20 (« – . ») est distinct, plus à gauche.
  alternatives:
  - .
