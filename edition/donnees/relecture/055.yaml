remarques: 'Restent incertains : l. 5 (& / en), l. 10 (Mme C^{h}, non identifiée), l. 12 (Là).'
resume: 'Jeudi 28 septembre 1916, à Toulouse. Hippolyte Combes s''attarde dans son appartement à ranger ses affaires, laissant s''éveiller des souvenirs du passé. Vers 11 h 30 il monte à Sainte-Marie et apporte à Marguerite un joli bouquet ; il la trouve toujours simple, affectueuse et charmante. L''après-midi, promenade avec Mme C^{h} et M. Crouzet : descente à pied vers Saint-Joseph, tram jusqu''à Saint-Agne, montée à Pouvourville, crête de Pech-David jusqu''au carrefour des Récollets, retour en tram ; le soir, il redescend à pied la Côte Pavée. Comptes : trams, fruits (raisins et grenades), bouquet de la place Esquirol.'
