difficultes:
- ligne: 1
  lemme: Sept^{bre} /16
  analyse: S-e-p (jambage traversant le soulignement), haste haute (t ou b) portant re suscrit ; avant 16 deux traits obliques fondus (barre + 1).
  alternatives:
  - Sept^{re} /16
  - Sept /16
- ligne: 5
  lemme: \inc{&}
  analyse: 'Crochet de tête, barre médiane terminée en crochet, haste plongeant sous la ligne : même tracé que le & de la l. 22 (forme ƒ) ; le ds de la l. 2 (∂ + s) est tout autre. Sens attendu « en moi » : lapsus probable.'
  alternatives:
  - en
  - ds
  - pr
- ligne: 5
  lemme: s'éveiller
  analyse: s initial réduit à un trait ; une seule marque au-dessus de l'e, apostrophe ou accent.
  alternatives:
  - séveiller
  - s'eveiller
- ligne: 8
  lemme: Mêmes
  analyse: 'M-e-m puis long délié et point à mi-hauteur : -es abrégé (délié = e, point = s réduit).'
  alternatives:
  - 'Même :'
  - Même .
- ligne: 10
  lemme: \inc{C^{h}}
  analyse: 'Grand C puis, surélevés, boucle haute et arche terminée par un pied à droite : h ; un ls (Calmels) supposerait un s final non visible.'
  alternatives:
  - C^{ls}
  - C.
- ligne: 12
  lemme: \inc{Là}
  analyse: Boucle basse à gauche, haste montante (L en ℒ), a, accent long décalé vers la droite.
  alternatives:
  - De là
  - dà
- ligne: 14
  lemme: Pouvourville
  analyse: P à boucle réduite (aspect L), ou-v-ou-r-v-i-ll-e à délié long.
  alternatives:
  - Louvourville
- ligne: 22
  lemme: 1 f
  analyse: 1 droit puis f à haute boucle dont la descente plonge jusqu'à la l. 23 après Esquirol.
