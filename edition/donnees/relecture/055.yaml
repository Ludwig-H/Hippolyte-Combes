  avant: s'éveiller \inc{ds} moi
  apres: s'éveiller \inc{&} moi
  justification: 'Zoom ×3 [.17 .16 .42 .205] : crochet de tête, barre médiane, haste plongeante = forme ƒ du & (l. 22 « raisins & grenades ») ; aucun ∂ ni s comme dans le ds de la l. 2 [.30 .045 .50 .08]. Le sens appelle « en » : lapsus, d''où \inc maintenu.'
