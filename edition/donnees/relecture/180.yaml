resume: 'Samedi 14 avril 1917, enfin une belle journée, chaude et ensoleillée ; Hippolyte Combes fait une course à Pierregot l''après-midi. Dimanche 15, pluie fine, averses et froid ; repos absolu et lecture au bureau ; blanchissage 60 c. Lundi 16, course à Pierregot, fortes pluies ; soirée chez la famille Denis et retour sous une pluie torrentielle dans la nuit noire. Mardi 17, averses, neige et grêle, froid croissant : « C''est de nouveau l''hiver » ; courses en auto à Fréchencourt et Rubempré.'
