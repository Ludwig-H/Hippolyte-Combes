resume: Samedi 4 novembre 1916. Le matin, Hippolyte Combes doit se rendre à pied à Bertrancourt et revient sur un camion (3 km), par des routes boueuses, dans une région plate et dévastée couverte de tentes, de huttes, de voitures et de caissons. Il y cherche l'interprète Jamet au sujet d'une question de pétrole, passe au quartier général de la division, à gauche de la route de Bus, et retrouve au bureau de la Mission française de la 2e division l'interprète Cordonnier (R.F.A.), connu à Béthune. Après le déjeuner, il regagne Albert en camion, passe à la 152nd Company puis au bureau de la Mission, où il voit le lieutenant Pozzi. Ciel noir, pluie menaçante, bois roussis par les gelées, routes affreusement boueuses.
