difficultes:
- ligne: 1
  lemme: '4'
  analyse: 'trait montant puis petite boucle et crochet à droite, aspect « le » : forme ouverte du 4 ; confirmé par le calendrier (samedi 4 novembre 1916)'
  alternatives: []
- ligne: 3
  lemme: \add{au}
  analyse: a + u de module réduit, ligne de base plus basse que celle de Retour ; le point après pied et le R majuscule montrent que la phrase commençait à Retour
  alternatives:
  - Au Retour sans ajout
- ligne: 8
  lemme: Div^{n}
  analyse: D en ∂, i (point déporté), v, puis un petit n surélevé ; aucun o distinct
  alternatives:
  - Div^{on}
  - Divon
- ligne: 15
  lemme: Pozzi
  analyse: P bouclé, o fermé, deux z plongeants, i pointé ; le o est sans ambiguïté sur ce cliché, mais le même lieutenant est lu Pizzi ailleurs
  alternatives:
  - Pizzi
- ligne: 18
  lemme: automnes
  analyse: 'a, u, t barré, o, m-n en jambages, e, puis un trait distinct plongeant sous la ligne avant le point : s final plongeant (cf. ʒ final du guide) ; un simple délié de e reste concevable'
  alternatives:
  - automne
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Pozzi vérifié au zoom (P bouclé, o ovale fermé, zz plongeants, i pointé) : la page porte bien Pozzi ; l''harmonisation avec Pizzi (048, 085, 090) relève d''un contrôle de ces clichés, non de celui-ci.'
