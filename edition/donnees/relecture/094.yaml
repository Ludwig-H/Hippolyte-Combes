remarques: Lieu (Acheux) déduit du contexte des pages voisines (093, 095).
resume: 'Dimanche 5 novembre 1916 à Acheux. Délogé de son billet (n° 59) par le Town-Major, Hippolyte Combes trouve grâce à un commis une meilleure chambre au n° 1 de la route de Léalvillers et s''y installe avant midi. Après-midi libre ; il fait la connaissance de son propriétaire, très sympathique. À 6 heures du soir, l''interprète des Fifth Army troops vient le chercher : le capitaine Huguet, de la mission française du corps, désire le voir. Bien reçu, avec quelque froideur, il est interrogé sur divers renseignements ; dans sa chambre dès 8 h 30.'
