resume: 'Vendredi 29 septembre 1916 à Toulouse, ciel nuageux et courte averse. Le matin, Hippolyte Combes rend visite à Mme de Labarthe, puis, après le marché et un déjeuner au restaurant du Change, retrouve Marguerite. L''après-midi, ils prennent le tram de la place Esquirol à Purpan, s''arrêtent longuement aux ruines, gagnent Blagnac à pied (halte dans la chapelle du monastère, prairie au bord de la Garonne) et reviennent par les Ponts-Jumeaux. Comptes : trams, sautoir en or chez Pfister (300 f, net 295 f), remboursements, fruits et fleurs.'
