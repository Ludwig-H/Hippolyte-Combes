remarques: Le cliché 130 reprend le récit de l'arrivée à Amiens à la date du samedi 27. Selon le commentaire historique joint à la première lecture (Baedeker 1913, p. xiii, à vérifier), 30 kg de bagages voyageaient en franchise moyennant un droit d'enregistrement de 10 c, ce qui s'accorde avec les 27 kilos et les 10 c des l. 7–8.
resume: 'Suite de la journée du vendredi 26 janvier 1917 : parti de Gézaincourt à 22 h 30 (cliché 128), Hippolyte Combes arrive à Amiens vers deux heures du matin, par un froid pénétrant et une forte gelée, sous un ciel sombre où brillent quelques étoiles. Dans un compte encadré, il note 1 franc payé au voiturier d''Acheux pour porter deux sacs à la gare, puis 10 centimes d''enregistrement des bagages à Gézaincourt (deux sacs, 27 kilos). Il inscrit aussi l''état de sa caisse « ce matin » : 319 francs 50. Le reste de la page est blanc.'
