remarques: 'Ponctuation relue signe par signe ; plusieurs points de l''état antérieur ne sont pas sur l''image (après mauvaises, lamentables), d''autres sont fondus au bout du délié final (neige, liberte, fine). Accents absents : reveil, refugiés, Belle-Eglise, liberte (l. 14), Rest^{e}, ecrit, Temperature, ecrire, a de tt a fait. Le bas du compte (l. 21) est coupé par le bord du cliché : à contrôler sur l''original.'
resume: 'Le mardi 12 décembre 1916, Combes, nettement mieux (levé deux fois dans la nuit, constipé dans la journée), trouve au réveil rues, toits et arbres couverts de neige et reste longtemps à sa fenêtre, côté devant puis côté derrière, à admirer le paysage ; course à Senlis le matin, liberté l''après-midi ; il se sent presque guéri. Le mercredi 13, par brouillard et pluie, il assiste le matin, à la mairie de Toutencourt, à une réunion de réfugiés d''Englebelmer avec le major Levy, puis va l''après-midi en auto, très secoué, à Belle-Église, Puchevillers et Harponville, par des routes très mauvaises. Le jeudi 14, journée entière de liberté : il reste longtemps dans sa chambre à écrire, lire ou ranger ses affaires ; ciel brumeux et pluie fine tout le jour, température assez douce pour écrire sans feu ; la nuit est extrêmement noire et les routes lamentablement sales. Dépense : un essuie-mains (lecture incertaine), 90 c.'
