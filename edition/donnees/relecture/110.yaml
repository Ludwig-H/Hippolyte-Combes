difficultes:
- ligne: 21
  lemme: Essui\inc{e-mains}
  analyse: 'À gauche de Nuit : trait de tête et haste (équerre), petit trait médian attaché à la haste (tiret), puis un tracé en croix très appuyé (E et ss écrasés), u, i pointé, délié montant (e) ; sous Nuit, trois ou quatre lettres coupées à mi-hauteur par le bord du cliché, puis deux-points, 90, c, tiret. Trait de tête + haste + trait médian pourraient former un E anguleux (aspect F), mais les E de la page (Englebelmer, Eglise) sont bouclés ; l''état antérieur lisait aussi un crochet et un tiret.'
  alternatives:
  - Essuie-mains
  - Essuie-main
- ligne: 14
  lemme: Rest^{e}
  analyse: 'R, e, s montant, t ; la boucle de l''e est portée à hauteur de la tête des minuscules, nettement au-dessus de la ligne de base, et se prolonge en un trait horizontal à sa base (délié final) ; rien au-dessus de la boucle : pas d''accent, à la différence de Resté (l. 5), où un trait surmonte té'
  alternatives:
  - Rest^{e}
  - Rest^{é}
  - Resté
- ligne: 8
  lemme: tt a fait
  analyse: 'zoom x4 : a noir et appuyé, sans rien au-dessus ; à sa droite, un trait fin à crochet initial, à hauteur de la tête des minuscules, rejoint la haste du f et se prolonge au-delà en délié montant vers la boucle de tête : attaque du f, non accent (les accents de à, l. 5, 6, 7, 10, 12, sont posés au-dessus de l''a)'
  alternatives:
  - tt a fait
  - tt à fait
- ligne: 9
  lemme: lamentables
  analyse: 'après b : l haut, e en petite boucle, puis long délié terminé en crochet (s) ; la longue barre en tête est celle du t, reportée ; la hampe oblique qui coupe la finale vient du d de de (l. 10) ; l''adjectif s''accorde avec Routes ; à la l. 20, lamentablt n''a ni e ni délié après le t final'
  alternatives:
  - lamentables
  - lamentabl^{t}
- ligne: 3
  lemme: journée. .
  analyse: 'deux signes isolés à mi-hauteur après le délié : un court trait oblique puis un point rond, distants d''environ deux lettres ; aucun n''appartient aux lignes voisines (le point de l''i de Nuit, l. 2, est plus haut)'
  alternatives:
  - journée. .
  - journée.
- ligne: 11
  lemme: refugiés
  analyse: r d'attaque, e sans accent visible (la tête bouclée du f occupe l'interligne), f, u, g, i, é ; le trait d'accent final se prolonge et redescend en crochet, interprété comme s final réduit
  alternatives:
  - refugiés
  - refugié
