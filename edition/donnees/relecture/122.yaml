resume: Le 10 janvier 1917, canonnade toute la nuit sur Miraumont ; course en auto à Saint-Léger et Belle-Église, où Hippolyte Combes retrouve son vieux camarade Morris, qui lui rend visite l'après-midi. Il envoie un mandat de 19 fr. à l'opticien Imbert pour réparer son pince-nez et en faire un neuf. Le 11, journée de repos sous la neige, consacrée au courrier en retard. Le 12, pris par une tempête de grésil entre Authie, Arquèves et Louvencourt, il fait ses tournées (Louvencourt, Saint-Léger, Raincheval, Beauquesne, où il déjeune au Café Continental, Septenville, Rubempré) et rentre vers 6 h.
