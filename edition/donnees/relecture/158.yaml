remarques: Le tiret au-dessus du 0 (l. 14) termine la l. 13. Le petit crochet isolé vers x .20 y .50 (au-dessus de « Après-midi », l. 15) est un point d'i déporté de « midi », non une quantité devant « de semelles ».
resume: Le 21 février 1917, par temps de brume, de bruine et de dégel, Hippolyte Combes va le matin à Auxi-le-Château ; il s'arrête à Doullens vers 1 h 30 pour déjeuner et rentre par Puchevillers sur des routes défoncées, avec un sentiment de solitude et de détresse morale. À Doullens, il envoie un mandat de 42 francs à Mme Spagnol, à Nice, et achète des œufs, un café et des semelles de liège. Le 22, journée monotone et libre au bureau ou avec ses propriétaires. Le 23, il cherche du fourrage à Molliens-au-Bois, près de Montigny, puis range ses paquets.
