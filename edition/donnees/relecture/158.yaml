  - abomles
- ligne: 14
  lemme: 0^{f}80
  analyse: Le tiret au-dessus du 0 (précédé d'un point) termine la l. 13 ; entre 0 et 8, trait oblique court descendant vers la tête du 8, pris pour le f monétaire.
  alternatives:
  - 0'80
  - '0.80'
- ligne: 17
  lemme: \inc{extre}
  analyse: e, x en croix, t, r, puis lettre fermée en boucle haute (e surmonté d'un circonflexe fondu, ou a) et délié jusqu'au bord ; aucun point.
  alternatives:
  - extrê
  - extra
- ligne: 25
