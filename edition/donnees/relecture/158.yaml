difficultes:
- ligne: 7
  lemme: \inc{rendent}
  analyse: r à boucle d'attaque, e ; le jambage plongeant qui traverse le mot est la queue du q de « pittoresque » (l. 6) ; puis d bouclé, hampe (t ?) et n en délié. Sens sûr (brouillard et pluie rendent paysages banals), forme non assurée.
  alternatives:
  - rendt
  - rendent
- ligne: 8
  lemme: à 1^{H} \fr{1}{2}
  analyse: Virgule, a ouvert + crochet montant (accent) ; 1, H surélevé, 2 au-dessous ; le 1 et la barre de la fraction se confondent avec des tracés descendant de la l. 7.
  alternatives:
  - de 1^{H} \fr{1}{2}
  - à 1^{H} 2
- ligne: 9
  lemme: \inc{abomibles}
  analyse: a, b, o, minimes (m), i pointé, deux hautes boucles, long délié remontant ; forme contractée d'abominables.
  alternatives:
