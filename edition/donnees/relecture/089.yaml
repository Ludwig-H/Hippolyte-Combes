remarques: Encre violette. Un blanc d'environ une ligne sépare l'après-midi du soir.
resume: 'Toussaint 1916 à Albert, par temps bas et froid. Le matin, Hippolyte Combes visite le cimetière d''Albert, ravagé par les obus, à côté d''un champ de croix de soldats anglais tués au combat. L''après-midi, place du monument, un général écossais décore devant plusieurs bataillons des soldats et sous-officiers distingués dans l''offensive de la Somme. Le soir, réunion religieuse route d''Amiens dans les rues obscures. À 9 heures, le lieutenant Curtis lui apporte l''ordre de partir avec lui le lendemain pour Acheux : ils sont détachés de la compagnie du train.'
