remarques: Les journées des 7 et 8 ne sont pas tenues ; l'entrée du 9 les résume (« Hier & avant-hier »).
resume: 'Samedi 6 janvier 1917, belle journée froide : le matin, course en auto à Louvencourt, Bertrancourt et Authie, l''après-midi libre, le soir concert Y.M.C.A. au programme répété ; routes encombrées par des mouvements de troupes, d''artillerie et d''A.S.C. Comptes : blanchissage et concert. Mardi 9 : depuis l''avant-veille, courses en auto matin et soir vers Arquèves, Raincheval et Saint-Léger ; visite à M. Guibet à Raincheval, puis l''après-midi à Hédauville, où il retrouve la 150th Company de la 18th Division dans un terrain fangeux ; Morris était sorti à cheval. Froid, neige puis pluie fine, très violente canonnade jour et nuit ; avis de réception pour Imbert.'
