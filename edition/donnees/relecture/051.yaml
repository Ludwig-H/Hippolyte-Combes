remarques: Le départ en permission suit le 25 septembre ; la page suivante (052) commence au Bourget le 26.
resume: 'Suite du 25 septembre 1916 : départ vers 3 h 1/2, voyage en train par beau temps. Changement de train à Gézaincourt vers 4 h 1/2, puis à 5 h dans le train venant de Doullens ; à Amiens vers 8 h du soir, montée dans le train des permissionnaires pour Paris, en troisième classe parmi des poilus. Après Amiens, au croisement de Longueau, le train est survolé par des Taubes qui lâchent des bombes ; obus dans les airs et projecteurs. Il ne descend pas à Creil et voyage toute la nuit.'
