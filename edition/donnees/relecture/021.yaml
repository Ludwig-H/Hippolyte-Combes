remarques: Petit point isolé devant Longue (l. 22), sans valeur de ponctuation (repos de plume). Le récit de la chevauchée se poursuit au f. 11 v°.
resume: 'Le vendredi 18 août, Hippolyte Combes note que depuis deux ou trois jours se succèdent de vraies giboulées, comme en mars : averses prolongées, puis éclaircies. La veille après-midi, au refilling point et dans un champ de trèfle, il a été surpris par la pluie et trempé. En fin de journée, il retrouve Maurin et cause avec lui sur l''herbe sèche près des lignes de sa compagnie ; vers 7 h 1/2, orage. Il inscrit 84 fr. de solde et d''indemnité de fonctions. Le samedi 19, après une nuit et une matinée de pluie torrentielle, le lieutenant Curtis, qu''il traite de crétin, vient le chercher vers 2 h 30 : il doit l''accompagner à cheval, cette fois sur un bon poney, pour une longue chevauchée en zone exposée derrière la ligne de feu.'
