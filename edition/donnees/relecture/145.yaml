  analyse: 'À vérifier sur l''image : 1 067 caractères ; sources : Wikipédia (lignes Villeneuve-Saint-Georges – Montargis et 5 du métro, Corbeil-Essonnes), Baedeker 1913 (p. 28), La Dépêche du 30 janv. 1917 ; p2 absente, p1 utilisée. La clé « lieux » est corrigée : Corbeil était alors une commune de Seine-et-Oise, réunie à Essonnes en 1951. Le passage par Malesherbes est seulement probable. La lecture « 2e cl. » (l. 12) contredit le « 1re cl. » de la notice F7 du dossier R6 et reste à confirmer. Contrairement à la remarque de la p1, la dépense de Brioude se rapporte à la correspondance du matin même (f. 72 r°).'
