remarques: 'La dépense de Brioude se rapporte sans doute à une étape antérieure du trajet de retour (ligne de Nîmes à Clermont), non à la remontée Gien–Paris. L. 12 : « 2e cl. » confirmé sur l''image en p2 (contre « 1re cl. » de l''état antérieur et de la notice F7, à corriger).'
resume: 'Suite du voyage de retour de permission, le mardi 6 février 1917. En remontant vers Paris, la neige diminue, le sol est durci par le gel et la nuit s''annonce très froide. Passage à Corbeil-Essonnes à 5 h 50 du soir, arrivée à Paris vers 6 h 30. Hippolyte Combes prend le métro de la gare de Lyon, change à Bastille et gagne la gare du Nord à temps pour le train de 7 h 19, où il observe des soldats ; il roule toute la nuit. Dépense notée : buffet de Brioude, 60 c.'
