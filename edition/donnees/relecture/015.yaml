remarques: 'Lieu repris de l''état antérieur (cantonnement de Bac-Saint-Maur, route de Steenwerck) : aucun nom de lieu sur la page ; le commentateur historique propose La Croix-du-Bac (Steenwerck).'
resume: 'Le mardi 8 août 1916, la chaleur reste extrême. Bien reposé dans sa nouvelle chambre, Hippolyte Combes achève de s''y installer et passe une journée entière de liberté à s''y reposer ; il note 50 c d''œufs pour sa nourriture. Le mercredi 9, sous une chaleur accablante, il reste le plus possible dans sa chambre : les routes sont si poussiéreuses qu''il ne peut tenir sa fenêtre ouverte. La nuit, il est dévoré par les moustiques.'
