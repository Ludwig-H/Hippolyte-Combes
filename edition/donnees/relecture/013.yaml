remarques: 'Bac-Saint-Maur, hameau de Sailly-sur-la-Lys (Pas-de-Calais), fait face à La Croix-du-Bac (Steenwerck, Nord) sur la Lys canalisée : le « canal » et l''« écluse » des l. 6–7 sont probablement la Lys et son écluse de Bac-Saint-Maur. Accents contrôlés : eglise et l''e initial d''ecouté sans accent visible ; le circonflexe de côté paraît posé sur le t.'
resume: 'Dimanche 6 août 1916, levé à 7 h 1/2 par un temps magnifique, Hippolyte Combes a à peine fini son petit déjeuner que le lieutenant Curtis vient le chercher : ils vont à pied au refilling point, sur la rive du canal près d''une écluse, puis parcourent la campagne à la recherche de fourrage. Seul, Hippolyte Combes pousse jusqu''au village de Bac-Saint-Maur, dont il visite l''église, voisine d''une usine. L''après-midi, il retrouve Maurin et écoute avec lui, assis sur l''herbe, une musique militaire anglaise ; il note que son installation n''est que provisoire. Comptes : à sa logeuse, œufs, lait et bière, 90 c ; un litre de lait, 25 c + 5 c ; cartes postales, 10 c.'
