resume: 'Lundi 11 septembre 1916, Hippolyte Combes quitte Oppy à 7 heures et chevauche toute la journée jusqu''à Raincheval, atteint après 3 heures du soir, souffrant de la poussière. Le soleil perce vers 11 heures. Il traverse des coteaux boisés et une vallée verdoyante, s''arrête à Lucheux, où il note l''édit des postes de Louis XI (1464). Raincheval, gros village mal entretenu, fourmille de troupes britanniques ; il loge chez une famille pauvre dont la fille aînée va accoucher. Comptes : pourboire au groom Connelly, œufs, cartes postales, bière.'
