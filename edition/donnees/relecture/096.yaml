  apres: phrase supprimée
  justification: le blanc est déjà rendu par \blanc{2}
remarques: Le 2 de « 152 » (l. 18) est à peine surélevé, non balisé.
resume: Le mercredi 8 novembre, Hippolyte Combes fait une course en auto à Forceville avec le major Hughes et Curtis, puis l'après-midi se rend en auto à Albert par Varennes, Warloy et Senlis ; il va au bureau de la Mission française demander des renseignements et rentre sur un camion. Le jeudi 9, temps couvert, un peu de soleil vers midi. L'après-midi, course en auto à Varennes par Léalvillers, retour par Acheux puis jusqu'à Albert sur des routes très boueuses. Il reste prendre le thé au mess-hut de la 152 Coy, sur un plateau changé en marécage ; le ciel s'éclaircit sous la pleine lune et un bombardement commence sur Albert.
