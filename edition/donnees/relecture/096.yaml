- ligne: 2
  avant: (pas de note)
  apres: 'major : emprunt, grade britannique'
  justification: mot anglais (rang de l'armée britannique), à traduire pour le lecteur
- ligne: 6
  avant: 'fr^{se} : française ; finale suscrite réduite à une ondulation'
  apres: 'fr^{se} : française'
  justification: 'épuration de l''apparat : la description du tracé n''est pas utile au lecteur'
- ligne: 0
