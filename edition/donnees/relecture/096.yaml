- ligne: 20
  avant: éclairci, qq étoiles, pleine lune magnifique.
  apres: eclairci, qq etoiles, pleine lune magnifique
  justification: aucun accent sur les e initiaux (le trait au-dessus d'eclairci est le point du i) ; pas de point
