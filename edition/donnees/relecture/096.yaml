- ligne: 14
  avant: puis continuer j. à Albert.
  apres: Puis continue j-à Albert \trait
  justification: P majuscule ; -ue lié au j sans r ; petit trait (presque un point) entre j et à ; long trait après Albert
  confiance: moyenne
- ligne: 19
  avant: marécage. Alors, ciel
  apres: marécage — Alors, ciel
  justification: long tiret appuyé après marécage, aucun point ; accent de marécage posé sur le c
