  confiance: haute
difficultes:
- ligne: 2
  lemme: Hughs
  analyse: H à deux hastes, u, g bouclé, h, puis une seule petite boucle fermée prolongée d'un jambage (aspect a) ; pas de boucle de e ; zoom x3 [.70 .06 .90 .11] ne tranche pas entre s réduit et a
  alternatives:
  - Hughes
  - Hugha
- ligne: 14
  lemme: continue
  analyse: c-o-n-t-i-n-u-e, l'e lié directement au j ; aucune bosse de r ni accent (zoom x2)
  alternatives:
  - continuer
  - continué
- ligne: 17
  lemme: mess-hut
  analyse: 'la 2e lettre de hut a un second jambage qui plonge vers la gauche sous la ligne (aspect y : « hyt ») ; sans doute u dont la liaison vers le t a dérapé ; non noté'
  alternatives:
  - hyt
- ligne: 20
  lemme: magnifique
  analyse: m-a-g-n-i-f-i-q puis long délié final sans boucle, valant -ue
  alternatives:
  - magnifiq
- ligne: 5
  lemme: Délicieuse
  analyse: 'un seul trait au-dessus de « lic » : point d''i ou accent décalé ; l''accent est gardé ; finale -euse en boucle plongeante'
  alternatives:
