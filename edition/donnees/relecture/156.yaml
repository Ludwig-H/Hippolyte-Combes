resume: 'Samedi 17 février 1917 : le dégel continue, temps doux et pluvieux ; journée entière de liberté consacrée à la correspondance en retard, repos bienfaisant au physique et au moral ; brouillard le soir. Dimanche 18 : ciel brouillé, ondées, dégel rapide, routes transformées en fondrières ; Hippolyte Combes reste dans sa chambre sans feu. Le matin, à Toutencourt, il se rend à la Mission française de la Ve armée pour se renseigner sur un cantonnement « d''anglais » à Toulouse, puis assiste à une partie de l''office et au prône dans l''église du village. Retour à Hérissart en camion ; il se sent tout à fait ressaisi. Solde touchée à Toutencourt : 68 f 25.'
