difficultes:
- ligne: 1
  lemme: \sl{Dim. 10.}
  analyse: 'Le trait sous Dim. 10. touche à gauche le haut du T de Tres et à droite la haste du b de bonne : il peut s''agir de la barre de tête du T très prolongée ; sa longueur couvre exactement la date, d''où le soulignement.'
