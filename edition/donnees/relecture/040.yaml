remarques: 'Encre noire virée au brun, homogène. Blancs plus larges avant les deux dernières lignes. Second contrôle : 1 intervention ; soulignement de « Dim. 10. » possiblement confondu avec la barre du T de « Tres ».'
resume: Le dimanche 10 septembre 1916, Hippolyte Combes a dormi sur deux bancs de jardin rapprochés devant le four. Parti à 11 heures du matin par temps d'abord nuageux, il fait un voyage agréable à travers des paysages variés, des plaines aux hauteurs boisées, et arrive vers 1 heure à Oppy, hameau de six maisons situé en haut d'une côte, d'où la vue est belle. Il doit coucher au grenier de la ferme où est installé le mess. En fin d'après-midi, il va à pied à Beaudricourt, de service, chez le maire. Il prend tous ses repas au mess des officiers et se couche tôt.
