resume: 'Le 12 septembre 1916, reposé, Hippolyte Combes déjeune dans sa chambre ; l''après-midi, le capitaine West l''invite à faire partie de leur mess de façon permanente, et il doit accepter. Dès le soir il en est membre : cuisine quelconque, mais conversation anglaise et lieu où lire revues et journaux. Achats de fourrage vert sur les hauteurs. Le 13, temps couvert et averses ; il se promène dans la forêt à gauche du château, aux arbres séculaires et allées à angle droit, puis remonte au plateau pour le fourrage ; premier jour entier au mess des officiers.'
