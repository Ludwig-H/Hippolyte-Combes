remarques: 'Lieu (Marquay) déduit du contexte : arrivée à Marquay (028), départ (039).'
resume: 'Mercredi 30 août 1916, à Marquay : pluie et rafales toute la journée. Le vent tourmente les grands arbres du voisinage (boqueteau de l''autre côté de la route, prairies derrière les fermes) avec un bruit effrayant. Matin et après-midi, malgré de très fortes ondées, Hippolyte Combes a dû aller dans les champs détrempés pour faire prendre du fourrage vert. La moitié inférieure de la page est restée blanche.'
