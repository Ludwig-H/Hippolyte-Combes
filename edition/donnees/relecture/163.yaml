resume: 'Le 6 mars 1917, bise glaciale ; matinée libre ; arrivée d''un nouvel officier australien, jugé vulgaire, et d''un nouvel interprète, très sympathique. L''après-midi, Hippolyte Combes va à Doullens avec le capitaine Williams ; vers 6 h, il se rend à pied à la Mission française de Toutencourt, où un maréchal des logis (Granger ?) le conduit chez le capitaine Renouleau (?), qui l''interroge ; le maréchal des logis lui promet de lui faire donner un bon poste. Comptes : papeterie, carte postale, pastilles de chlorate, quête pour les blessés de l''hôpital auxiliaire. Le 7, inoccupé, il prépare ses paquets ; bise et rafales de tempête ; courte promenade et visite du cimetière du village.'
