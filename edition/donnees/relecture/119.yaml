remarques: 'La Semeuse : maison d''instruments agricoles de la rue Sire-Firmin-Leroux. Montigny identifié par l''itinéraire vers Amiens (à confirmer).'
resume: 'Le mercredi 3 janvier 1917, Hippolyte Combes fait une course en auto à Amiens avec deux officiers, par un temps couvert et doux. Arrêts à Belle-Église et à Montigny, chez le maire Paul Dubois, avec qui il a une conversation intéressante. Arrivé vers 11 heures, l''auto est garée dans la cour de l''Hôtel de la Paix ; libre jusqu''à 3 h 1/2, il rencontre le capitaine Trefton (lecture incertaine) rue Sire-Firmin-Leroux (La Semeuse, instruments agricoles), visite plus d''une heure la cathédrale et se promène dans le centre. Départ vers 4 heures ; comptes : cartes postales, boutons kaki, déjeuner, gravures de la cathédrale, bonnet de police.'
