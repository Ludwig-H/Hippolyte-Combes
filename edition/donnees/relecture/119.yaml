  analyse: 'Sources : Blackwood''s 1917 (F44), Michelin, Amiens 1919 (sacs de terre, Hôtel de la Paix, 15 rue Duméril, F49, probable), préface de Tessan dans Fernand-Laurent 1917 (F36). Montigny-sur-l''Hallue identifié de façon probable par le « Dr Dubois » du f. 80 v°. Le maire Paul Dubois, le capitaine (lu Trefton, antérieurement Trefcon) et la maison « La Semeuse » ne sont pas identifiés ; rechercher aussi la forme Trefton. Le carnet ne mentionne aucune visite antérieure de la cathédrale (« déjà vus » renvoie peut-être à un séjour d''avant-guerre).'
  alternatives: []
