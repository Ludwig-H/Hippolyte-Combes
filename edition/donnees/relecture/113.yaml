remarques: 'Lignes 1–2 : la date et 19 Ma sont sur une ligne haute, Matinée commence un demi-interligne plus bas. Le crochet du bloc de comptes commence au niveau du tiret de « — Bureau mission ». Le soulignement de l''en-tête gauche ne couvre que Ma.'
resume: Le mardi 19 décembre 1916, Hippolyte Combes fait en auto une course à Belle-Église et à Raincheval, où il attend longtemps devant l'Army Purchase Board ; l'après-midi il reste au bureau et à son cantonnement d'Acheux sous une neige à gros flocons, puis passe la soirée avec ses propriétaires. Il touche sa solde (84 fr) au bureau de la Mission du XIIIe corps et achète une carte de Noël (70 c.). Le 20, après une nuit de forte gelée, il circule l'après-midi en auto, assis à l'avant, vers Raincheval, Quesnoy et Beauquesne. Il rentre à la nuit sous un ciel étoilé et préfère ce grand froid au brouillard et à la pluie des semaines précédentes.
