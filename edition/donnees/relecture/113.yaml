difficultes:
- ligne: 4
  lemme: \inc{& désert. Froid}
  analyse: après village, « tr calme » écrit petit et surélevé au-dessus de tracés épais repassés (aspect ullk) ; puis mot à grande boucle initiale (F ou D), e/r, s/o, terminé par une boucle en ∂ ; puis ∂ + s plongeant (ds) et auto. Le dernier mot convient mieux à Froid (F bouclé, ∂ final) qu'à désert ; « & désert » devrait alors se trouver dans les tracés épais sous calme, ce qui n'est pas vérifiable trait à trait.
  alternatives:
  - calme désert ds auto
  - calme & Froid ds auto
  - \sur{\ill}{calme} Froid ds auto
- ligne: 8
  lemme: propriétres
  analyse: p-r-o-p-r-i lisibles, puis t dont la barre revient sur le i, accent grave décalé, finale ra/res sur la ligne ; zoom sans gain
  alternatives:
  - propriét^{res}
  - propriétaires
- ligne: 9
  lemme: touché
  analyse: devant touché, grande croix grise pâle (crayon ?) sans liaison avec l'encre ; trait étranger, non transcrit
  alternatives: []
- ligne: 9
  lemme: mission
  analyse: m à trois jambages, ss en hampes, finale plongeante (n plongeant ou s final)
  alternatives:
  - missions
- ligne: 10
  lemme: 84 fr
  analyse: deux-points, 8 bouclé, 4 ouvert, puis f/r en un tracé (aspect h), encre brune comme Solde etc
  alternatives:
  - 84 f
- ligne: 11
  lemme: 70c.
  analyse: 7 à barre, 0 empâté (repassé), c, point ; avant le montant, deux tirets de conduite puis un point et deux-points
  alternatives:
  - \sur{?}{70}c.
- ligne: 13
  lemme: tr
  analyse: tr réduit (aspect hu) suivi d'un accent grave isolé, qui peut valoir trè ou appartenir à pénétrant
  alternatives:
  - trè
  - très
- ligne: 15
  lemme: jetté
  analyse: J bouclé, e, deux hampes hautes non barrées (la barre de et ne les atteint pas), é ; le sens (moins jeté et moins secoué) impose jeté
  alternatives:
  - jeté
  - jessé
- ligne: 0
  lemme: remarque du commentateur historique
  analyse: 'Sources : Puckle 1917, p. 28 (Purchase Board d''armée), OH 1917-I, p. 66 (XIII Corps), OH 1916-I, p. 304 (Beauquesne). Belle-Église est un hameau d''Arquèves (corrigé dans noms). « & désert. Froid » (l. 4) et « jetté » (l. 15) restent douteux après contrôle. La place du feuillet 56 (verso photographié d''abord) n''est pas vérifiable sur ce seul cliché ; non reprise dans la note critique.'
  alternatives: []
