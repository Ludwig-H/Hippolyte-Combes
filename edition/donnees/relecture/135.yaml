remarques: 'Le Miroir des modes : périodique de mode (numéro de janvier 1917).'
resume: 'Mardi 30 janvier 1917, à Toulouse. Lever à 7 heures, grand feu dans la chambre, moment de repos et d''évocation sereine du passé. Le matin, visite à Mme de Labarthe ; déjeuner à Sainte-Marie comme d''habitude. L''après-midi, conférence de M. Zyromski sur Maurice de Guérin (influence de la Bretagne et de Lamennais), jugée admirablement écrite ; soirée avec Marguerite. Comptes : cartes postales, papier vélin, enveloppes, tramways, Le Miroir des modes de janvier.'
