resume: 'Lundi 12 février 1917. Le gel faiblit. Course en auto jusqu''à Méaulte, où Hippolyte Combes visite une minoterie, retour par Ville-sur-Ancre, Treux, Méricourt et Ribemont, région familière où il a vécu des heures tristes. En approchant d''Hérissart, il voit des moulins à vent sur un ciel gris. L''après-midi, libre, il s''installe dans sa chambrette ; dégel rapide ; le village d''Hérissart semble inhabité. Compte : 5 vues d''Amiens, 2 f 50.'
