difficultes:
- ligne: 11
  lemme: \inc{çà}
  analyse: haste droite montant au-dessus de l'œil, arche, e, puis accent grave détaché ; tracé presque identique à celui de très (l. 9 « très b maisons ») ; aucune cédille. Le jambage du g de grands (l. 10) descend sur le &, qu'il rend confus. Le sens (çà & là) commande.
  alternatives:
  - çà
  - là
  - très
- ligne: 7
  lemme: (l.
  analyse: trait court, légèrement courbe, sur la ligne après gare ; parenthèse ouvrante (même forme qu'à la l. 4) ou virgule courte
  alternatives:
  - (l.
  - ', l.'
- ligne: 18
  lemme: \add{Ecossais}
  analyse: ajout d'une encre plus brune, sous abandonnés par ; il peut gloser la description d'Armentières ou se rattacher à Rentré
  alternatives:
  - fin de la l. 18
  - début de la l. 19
controle:
- ligne: 11
  avant: de toits –
  apres: de toits
  justification: le trait court à droite croise la haste du t final de toits et se prolonge au-dessus du mot ; c'est la barre du t, non un tiret
- ligne: 13
  avant: mises à nu
  apres: mises à nu –
  justification: tiret court sur la ligne de base après nu (x ≈ 0,56–0,60, y ≈ 0,54), rien de la l. 14 à cet endroit ; l'état antérieur le portait
- ligne: 19
  avant: Rentrés
  apres: Rentré
  justification: le mot finit par e prolongé, l'accent est rejeté au-dessus de par ; aucun s ; singulier comme arrivé, dirigé
- ligne: 11
  avant: '\inc{çà} : haste haute suivie d''une panse et d''un accent grave'
  apres: \inc{çà} maintenu, alternative très ajoutée
  justification: le tracé est presque identique à très (l. 9) ; le & est brouillé par le jambage du g de grands (l. 10)
- ligne: 0
  avant: apparat de 37 entrées (ponctuation, majuscules, coordonnées)
  apres: apparat épuré (21 entrées)
  justification: notes de ponctuation, d'accent, de majuscule et de position supprimées selon la règle d'impression ; difficulté « remarque du commentateur » versée aux remarques
remarques: Le tiret de remonté (l. 4) est l'accent de l'é, tiré long. Les points au-dessus de principaux (l. 8) sont les points de ses i. La remarque du commentateur historique (église rapprochée de Saint-Vaast d'Armentières, références Ellis, Bewsher, Palissy) ne touche pas la lecture et n'est pas reprise dans l'apparat.
resume: 'Suite de la chevauchée du samedi 19 août (cf. 021) : galop à travers champs jusqu''à la blanchisserie Barbry, puis traversée de Fleurbaix, dont presque toutes les maisons ont reçu des obus. Hippolyte Combes gagne ensuite Armentières, où il arrive par la gare, complètement déserte, et parcourt les principaux quartiers d''une ville importante et riche : toits crevés, façades trouées, cloisons d''appartement mises à nu, église de briques rouges au clocher découronné, immeubles pour la plupart abandonnés par leurs habitants ; il ajoute plus tard le mot « Ecossais ». Retour par la grande route avec un arrêt à Erquinghem pour prendre le thé avec un officier des Sussex ; fin de journée ensoleillée et très belle.'
