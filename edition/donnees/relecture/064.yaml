remarques: Le cliché 063 (Louvre, gare du Nord) semble postérieur dans la chronologie (5 octobre, à Paris) ; 065 enchaîne sur le départ vers Amiens et Doullens.
resume: 'Fin des adieux à Marguerite le mercredi 4 octobre 1916 : tous deux très émus. Le train part vers 8 heures du soir ; voyage de toute la nuit, Hippolyte Combes ne parvient à s''assoupir qu''au matin. La moitié de la page reste blanche. Sous un filet, les dépenses de la veille (4 octobre) : images de sainte Thérèse, fleurs pour Marguerite, trams, billet de 3e classe pour Paris-Orsay (11 f 75), bain aux Thermes, étrennes à Maria, la bonne des Crouzet.'
