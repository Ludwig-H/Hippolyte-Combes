remarques: 'Transcription de la première lecture confirmée mot à mot ; seule la place du \hfill de la l. 17 change. Les 36 chambres répondent aux 36 officiers des Royal Fusiliers arrivés la veille (cliché 002). L''heure de fin varie dans la page : 2 h ½ (l. 2), puis « vers 2^{h} » (l. 6). La virgule après 2^{h} (l. 6) se confond peut-être avec le haut du f de faim (l. 7).'
resume: 'Le mercredi 26 juillet 1916, de 9 h du matin à 2 h ½ de l''après-midi, Hippolyte Combes s''occupe du cantonnement des Royal Fusiliers : avec le lieutenant Michel, billeting officer, il parcourt le village d''un bout à l''autre et jusque dans les environs pour trouver 36 chambres d''officiers. Libre vers 2 h, harassé de fatigue et mourant de faim, il se repose tout l''après-midi dans sa chambre. Après le dîner, vers 9 h, il reste longtemps devant la porte de son cottage à regarder l''église de briques rouges, les grands potagers, les moutons et le château de la brasserie, sous un ciel très bas et gris, dans un silence et une solitude funèbres. Il apprend avec regret un nouveau changement de cantonnement, fixé au 28. Comptes : nourriture 60 c, blanchissage 1 f, montants portés au crayon.'
