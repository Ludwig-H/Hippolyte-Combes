remarques: La 54e brigade d'infanterie appartient à la 18th Division, que la 152 Coy A.S.C. ravitaille.
resume: Le vendredi 6 octobre 1916, Hippolyte Combes achève la nuit dans la salle des départs de la gare de Doullens, allongé sur un banc. Au petit jour il se promène dans la ville déserte et rêve dans l'église sous une pluie fine. Il prend le train de 7 h 25 ; le R.T.O. lui apprend que sa division s'est déplacée et que la gare de ravitaillement est Canaples. Descendu à Canaples, il trouve les camions de la 54e brigade, monte dans l'un d'eux jusqu'au point de ravitaillement de sa brigade et y retrouve la 152 Coy A.S.C., à 1 heure de l'après-midi.
