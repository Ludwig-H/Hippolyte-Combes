resume: Mardi 10 octobre 1916, enfin une très belle journée. Matin et après-midi, Hippolyte Combes s'occupe de fourrage vert et conduit les fourragères dans les champs. Assis sur une botte de luzerne pendant le chargement, il contemple la lisière de la forêt à 40 ou 50 mètres, arbres aux teintes que le soleil rend plus éclatantes sur le ciel bleu. Le soir, nuit merveilleuse de pleine lune, quelques rares étoiles, grande paix.
