resume: Le 20 mars, un lieutenant de la 63rd (Royal Naval) Division, logé dans la chambre d'Hippolyte Combes, repart avec son unité à 8 heures ; nuit de vent violent, neige à gros flocons le matin, journée libre. Le 21, après une nuit très froide, course en auto à Puchevillers et Arquèves (ferme de Belle-Église, M. Houtteman), puis par Contay et Warloy jusqu'à Senlis ; routes encombrées de troupes, cavalerie indienne et anglaise (17th Lancers). Le 22, tourmentes de neige ; courses à Puchevillers, Mirvaux, Pierregot, Molliens-au-Bois, puis Senlis et Albert, où il regarde longuement les maisons touchées par les obus ; retour par la grande route d'Amiens entre des champs enneigés.
