resume: Le 28 novembre, brouillard et pluie, routes en mauvais état ; l'après-midi, course en auto à Martinsart, où Hippolyte Combes est reçu au château par M. et Mme Val… [?] et prend le thé ; gros canons en action tout près, convois, éclairs à l'horizon au retour. Le 29, épais brouillard ; tournée en auto par Raincheval, Puchevillers, Rubempré, Septenville et Pierregot dans un paysage enseveli ; blanchissage 70 c. Le 30, matinée à Acheux, l'après-midi course à Septenville, thé à Hérissart au retour ; le soir, premier dîner au nouveau mess, chambre du lieutenant Curtis.
