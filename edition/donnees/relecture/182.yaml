resume: 'Samedi 21 avril 1917, après une nuit de violente canonnade au sud d''Arras, Hippolyte Combes va à pied à Toutencourt toucher sa solde, puis fait en auto une tournée à Buire, Albert, Millencourt et Contay, cherchant vainement de la paille à acheter. Il note sa solde (78 f 75) et l''achat, rapporté d''Amiens par Baptiste (?) Denis, de « Promenade dans Amiens » d''A. Martin et d''une grande carte avec vue de la cathédrale. Le dimanche 22, belle journée froide : tournée à Toutencourt, Molliens-au-Bois et Pierregot, où il visite un grand moulin à vent. L''après-midi, promenade sur la route d''Hérissart, près d''une batterie antiaérienne ; canonnade ininterrompue vers Arras.'
