difficultes:
- ligne: 6
  lemme: Lépin
  analyse: 'zoom [.28 .215 .46 .27] : L en grande boucle ; point rond au-dessus de la 2e lettre (i ou é) ; haste descendante droite sans boucle (p plutôt que g) ; trois ou quatre minimes ; signe courbe rejeté à droite (point du i ou accent). Lépin reste le plus probable.'
  alternatives:
  - Lupin
  - Ligné
- ligne: 7
  lemme: avoir
  analyse: 'après « après » : un mot de trois ou quatre minimes finissant en s plongeant (aspect « vus »), puis « vu » ; « Lt Pizzi » serré au bord droit, plus petit et plus pâle'
  alternatives:
  - vus
- ligne: 8
  lemme: Pizzi
  analyse: 'zoom [.66 .30 .88 .36] : P bouclé, petite boucle fermée (o plutôt que i), zz descendants, i final avec un seul point rejeté à droite'
  alternatives:
  - Pozzi
- ligne: 10
  lemme: Col.
  analyse: C, haste bouclée l, petit trait vertical surélevé (point abréviatif) ; l'o n'est pas distinct
  alternatives:
  - Cl.
- ligne: 14
  lemme: Lt.
  analyse: L bouclé, tiret, lettre descendante, point (aspect « L-ſ. ») ; forme inhabituelle de Lt, laissée sans \inc vu le contexte (Lt Curtis, l. 11)
  alternatives:
  - L^{t}.
- ligne: 17
