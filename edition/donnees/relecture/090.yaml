remarques: Page entière à l'encre violette, sans comptes ni filet. Le départ se fait d'Albert (cf. 089) ; le récit se poursuit au cl. 091.
resume: Le 2 novembre 1916, Hippolyte Combes boucle ses paquets à Albert et, au breakfast, décide de passer au bureau de la Mission. Lépin et Serpin lui conseillent d'obtenir un ordre écrit ; après avoir vu le Lt Pizzi, il se rend au Train Office, où le major Hughes tempête, puis le colonel Grose signe l'ordre d'accompagner le Lt Curtis à Acheux. À 9 h 30, une auto le prend avec ses bagages juchés sur le kit de Curtis ; sous une pluie battante et par des routes affreuses, il arrive vers 11 h à Acheux. Il voit le Town Major, cherche billets et salle de mess, s'installe provisoirement et note l'état lamentable des rues.
