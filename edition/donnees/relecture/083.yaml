  analyse: 'À vérifier sur l''image : 1071 caractères ; diocèse d''Amiens 2018, Mérimée PA80000002, Miles OH 1916-II p. 462 ; R1 F27 et R3 F17 (R.A.T.), renvois f. 12 r°, 43 r°, 52 v°. Écrit d''après p1, pas de p2. Hippolyte Combes date le bombardement de la tour de « 1914 », mais la Vierge s''est inclinée le 15 janvier 1915 : l''écart est signalé dans le commentaire. Son passage dans la R.A.T. au 1er novembre 1916 repose sur une lecture seulement probable de sa fiche matricule, d''où le « sans doute ». Contrôle p2 : « 1914 » est sûr sur l''image (aucune correction du chiffre) ; Schumacher lisible malgré un pâté sur -ch-.'
