remarques: La Vierge dorée du clocher d'Albert, frappée par un obus, pendait à l'horizontale depuis janvier 1915 ; Hippolyte Combes rattache le dommage au bombardement de 1914.
resume: 'Dimanche 22 octobre 1916 à Albert : nuit de forte gelée, canonnade incessante, journée de beau soleil. L''après-midi, Hippolyte Combes s''arrête longuement devant l''église de briques rouges, dont la haute tour a été atteinte par les obus en 1914 et dont la Vierge, devenue horizontale, penche l''Enfant au-dessus de la place. Il rencontre des interprètes ; Schumacher lui apprend que les deux tiers des interprètes, jeunes territoriaux de la R.A.T., seront renvoyés dans des régiments français. Les canons se taisent le soir ; au retour du mess vers 9 heures, il se perd sur le plateau dans la nuit noire avant de retrouver son logement à Albert. Calme absolu, exceptionnellement, ce soir-là.'
