remarques: Steenwerk (l. 4) et Steenwerck (l. 14, 16) coexistent sur la page. Le montant du bain (l. 18) reste à confronter avec d'autres « 1 f 25 ». Remarque du commentateur historique (renvois Shakespear 1921, Ellis [1920], prix des bains) à reprendre dans le commentaire, non dans l'apparat.
resume: Mardi 22 août 1916. Le ciel nuageux s'éclaircit l'après-midi. Hippolyte Combes va à pied à Steenwerck (55 minutes) ; vers 5 h 30 il retrouve Maurin et tous deux vont au Bac-Saint-Maur boire une bière chez un charcutier, en parlant de la Provence et d'Antibes. Il fait expédier par un commissionnaire d'Erquinghem un sac de linge à Nogent par la gare de Steenwerck (13 kilos, 3 f 80) et note ses menues dépenses (emballage, cartes postales, divers, bain à 1 f 25).
