difficultes:
- ligne: 3
  lemme: après-midi
  analyse: a, p, r, e surmonté d'un long accent, s fondu ; entre « après » et « midi » un point bas tient lieu de trait d'union
  alternatives:
  - après. midi
- ligne: 12
  lemme: comm^{re}
  analyse: c, o, m, m puis un point et une finale surélevée en forme de z (r + e) ; le point pourrait être celui d'un i (commis)
  alternatives:
  - commis
- ligne: 14
  lemme: Steenwerck
  analyse: w, e, r puis k ; le c n'est pas net, conservé d'après la l. 16 où il est visible
  alternatives:
  - Steenwerk
- ligne: 16
  lemme: Cartes ples
  analyse: C, a, r, t barré, e ; s fondu dans la liaison vers le p ; p, l, e + délié pour ples, sur la ligne
  alternatives:
  - Carte ples
- ligne: 18
  lemme: 1^{25}
  analyse: 1 à trait d'attaque ; 2 surélevé (tête barrée à deux boutons, pied horizontal) prolongé en grande boucle montante puis haste descendant très bas (5 en ſ, ou f monétaire)
  alternatives:
  - 1^{f}25
  - 1 25
