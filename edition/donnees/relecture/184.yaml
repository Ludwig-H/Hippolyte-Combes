resume: Le jeudi 26 avril 1917, matinée nuageuse puis soleil ; courses à Contay, Puchevillers et Pierregot. Après le dîner, promenade par le petit chemin de Puchevillers le long d'abris et de tranchées, sous un ciel bleu ; nuit étoilée. Le vendredi 27, courses à Contay, Harponville et Varennes, où Hippolyte Combes revoit la famille Mortreux, puis à Pierregot et Rubempré ; il rentre seul à pied de Rubempré, l'auto continuant sur Varennes. Temps nuageux et un peu froid ; soirée chez les Denis à Hérissart.
