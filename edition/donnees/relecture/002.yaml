controle:
- ligne: 2
  avant: (l. 1) \sl{25 Ma.} Levé \inc{dès} 8^{H} m. Bien reposé \hfill \sl{Juillet 1916}
  apres: (l. 1) \sl{25 Ma.} \hfill \sl{Juillet 1916} ; (l. 2) \ind[3] Levé \inc{dès} 8^{H} m. \hfill Bien repose
  justification: la note a sa propre ligne de base (y ≈ 0,10 contre 0,05 pour l'en-tête), sous les deux soulignements ; Bien repose est écrit sous Juillet 1916 et ne peut le précéder sur la même ligne ; les lignes suivantes sont renumérotées (+1)
- ligne: 2
  avant: Bien reposé
  apres: Bien repose
  justification: 'aucun accent au-dessus de l''e final ni du délié (zoom ×4 : espace vide sous le soulignement) ; la première lecture notait cette absence sans la transcrire'
- ligne: 3
  avant: Courte nuit
  apres: Toute nuit
  justification: initiale à haste plongeante et crochet de tête, identique au T de Toujours (l. 4), sans l'arc ouvert du C (Curtis, l. 10) ; minimes réduits à o + u + liaison, sans r ; lecture de la transcription antérieure rétablie
- ligne: 3
  avant: Marg^{te}
  apres: Margte
  justification: 't (haste descendante) et e sur la ligne, comme le disait la note de la première lecture : surélévation non nette ; le long jambage qui traverse le mot est le p de repose (l. 2)'
- ligne: 19
  avant: 7^{h}
  apres: 7^{H}
  justification: même H suscrit à deux hastes et traverse qu'en 8^{H} (l. 2)
- ligne: 1
  avant: apparat de 41 notes ; critique de 6 phrases
  apres: apparat de 21 notes ; critique de 3 phrases
  justification: notes paléographiques supprimées (soulignements, accents absents de reposé et chateau, ponctuation, formes de &, E, 4, 6, Curtis, déménagement, traits de fin de ligne) et versées dans difficultes ; R. Fus^{rs} passe en abréviation ; notes Toute, Sercus, Backer et montant de la l. 21 abrégées
remarques: 'Lignes renumérotées par rapport à la première lecture : la note du lever forme la l. 2 (22 lignes de texte). Le bord droit du feuillet sort du cliché : la fin de la l. 16 et le montant de la l. 21 ne peuvent être contrôlés ; « 75 » (l. 21) vient de la transcription antérieure. Les deux église (l. 12, 16), pâturages (l. 6) et atmosphère (l. 8) ont été contrôlés au zoom (accents, barre de t prolongée).'
resume: 'Le mardi 25 juillet 1916, levé dès 8 h du matin et bien reposé, Hippolyte Combes note qu''il a pensé toute la nuit, très vivement, à Marguerite. Il décrit le ciel gris et bas de Flandre, les grands arbres aux branches retombantes autour des pâturages et des champs d''avoine et de blé, et la mélancolie de l''atmosphère. Le matin, il se rend à pied avec le lieutenant Curtis au village (Sercus, lecture proposée), où l''unité se rassemble devant le cimetière qui entoure une église très curieuse. L''après-midi, il se repose dans sa chambre après avoir déménagé sur l''arrière de son logement à cause de l''arrivée de 36 officiers des Royal Fusiliers, puis visite longuement l''église (deux rangs de statues de plâtre et de bois sous les orgues) ; vers 7 h ½ du soir, les dames du château lui rendent visite et il les conduit au mess de ses officiers. Comptes : repas de la veille et 4 œufs chez Mme Backer (montant coupé, 1 f 75 ?), divers 75 c.'
