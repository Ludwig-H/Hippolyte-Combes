  - des
- ligne: 3
  lemme: Toute
  analyse: 'initiale : trait d''attaque montant, crochet de tête vers la droite, haste plongeant sous la ligne, soit le T de Toujours (l. 4) ; le C de Curtis (l. 10) est un arc ouvert qui ne descend pas ; puis o lié par le haut, u (deux jambages), montée vers le t (haste haute, barre commune avec e), e en boucle ; aucune bosse de r entre u et t'
  alternatives:
  - Toute
  - Courte
- ligne: 3
  lemme: Margte
  analyse: 'M, a, r, g nets ; t à haste descendant sous la ligne, e en boucle à peine plus haut que la ligne de base : surélévation non nette ; le jambage oblique qui traverse le mot est le p de repose (l. 2)'
  alternatives:
  - Margte
  - Marg^{te}
- ligne: 6
  lemme: pâturages
  analyse: 'deux traits horizontaux distincts : un circonflexe aplati au-dessus de a, décalé à droite, et la barre du t'
  alternatives:
  - pâturages
- ligne: 8
  lemme: atmosphère
  analyse: 'long trait oblique de x ≈ 0,80 à 0,95 au-dessus de sphère, aboutissant au délié final : barre du t prolongée, non une biffure'
  alternatives:
  - atmosphère
- ligne: 10
  lemme: \inc{Sercus}
  analyse: S montant et e nets ; le jambage du f de fantastique (l. 9) masque la 3e lettre ; puis c (ou a), u, s final plongeant ; Sercus (Nord) est voisin de Lynde (005) et d'Hazebrouck (004)
  alternatives:
  - Sercus
  - Serques
- ligne: 12
