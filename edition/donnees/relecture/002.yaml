difficultes:
- ligne: 2
  lemme: \inc{dès}
  analyse: d à panse pleine et haste haute, deux jambages courts puis crochet qui ouvre la petite boucle du 8 ; aucun accent distinct ; Combes écrit ailleurs « Levé dès 7H ½ » (013, 029)
