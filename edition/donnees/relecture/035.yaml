  justification: 15 × 5,25 = 78,75, conforme à R3 ; détail paléographique déplacé dans changements.
remarques: 'Le hameau quitté (l. 9) est sans doute Marquay, cantonnement des jours précédents. Le cliché 036 donne la fin du dimanche 3 septembre : ordre photographique non chronologique.'
resume: 'Le lundi 4 septembre 1916, sous une pluie continuelle, Hippolyte Combes va le matin à Roëllecourt sur un chariot et revient à pied ; l''après-midi il fait lentement ses paquets, prêt à 5 heures et demie, heureux de quitter ce hameau obscur et boueux où il a été si mal logé. Le mardi 5, un sous-officier de service lui apprend que le départ est retardé ; il va se renseigner et reçoit la confirmation : encore huit jours à attendre. Le temps reste affreux ; l''après-midi il retourne à pied à Roëllecourt et rentre sous une pluie battante. Il note sa solde et son indemnité de la Mission française : 78 francs 75.'
