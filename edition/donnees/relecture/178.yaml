remarques: 'Village non nommé l. 11 : Hérissart, cantonnement d''Hippolyte Combes à cette date.'
resume: 'Le jour de Pâques, 8 avril 1917, beau temps et chaleur ; le matin Hippolyte Combes va chez le notaire Bienaimé à Toutencourt, l''après-midi à Harponville, Rubempré et Beauquesne. Rentré à 5 h 30, il visite la famille Denis et se promène dans les rues désertes du village. Le 9, mauvais temps, grêle et grésil ; courses à Pierregot et Belle-Église sur des routes défoncées. Le 10, orage et neige, giboulées ; courses à Fréchencourt et Contay : retour de l''hiver.'
