remarques: 'Le commentaire antérieur décrit une étiquette bleue « au centre », « à pans coupés », une encre noire et un soulignement du titre. Sur le cliché, le papier bleu couvre tout le plat sous la bande rouge, jusqu''aux bords (angles seulement émoussés) ; l''encre, mesurée sur la vue (pixels les plus sombres ≈ RVB 38/33/94 contre 23/67/136 pour le papier), tire sur le violet ; le trait sous le titre en est séparé par plus d''un interligne. La bande rouge est faite de deux pièces qui se recouvrent (raccord vertical vers x ≈ 0,38 ; bord inférieur en gradins entre x ≈ 0,38 et 0,54) et porte une tache sombre vers x ≈ 0,61–0,88, y ≈ 0,06–0,10. L''homogénéité d''encre et de module des trois lignes laisse supposer une inscription d''un seul jet, donc au plus tôt du 30 avril 1917, sans que rien l''assure : la date de l''inscription reste indéterminée.'
resume: 'Plat supérieur du carnet : papier rouge gaufré à losanges en haut, du côté de la reliure, papier bleu au-dessous. Hippolyte Combes y a écrit l''intitulé « Livre - Journal » et les bornes du carnet, « Du 25 juillet 1916 / Au 30 avril 1917 », en trois lignes centrées, séparées par un court trait et closes par un trait plus long. Ces bornes sont celles de la première entrée (f. 1 r°, mardi 25 juillet 1916) et de la dernière (f. 93 r°, lundi 30 avril 1917). L''écriture, plus grande et plus posée que celle du journal, en garde les formes (D en J, 2 bouclé, 7 à barre médiane). Le livre-journal est le registre où le commerçant inscrit ses opérations jour par jour ; le carnet tient de même, jour après jour, le récit et les comptes de dépenses.'
