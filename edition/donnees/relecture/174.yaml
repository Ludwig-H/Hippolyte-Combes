remarques: Le village non nommé (l. 7, 24) est Hérissart, cantonnement depuis mi-mars (cliché 168).
resume: Le jeudi 29 mars 1917, temps moins froid mais ondées torrentielles ; le matin, courses en auto à Puchevillers et Rubempré ; après-midi libre. Le village paraît abandonné, sans troupes, et Hippolyte Combes goûte ce calme. Le 30, giboulées, neige et rafales ; routes défoncées par les camions ; courses à Pierregot et Molliens-au-Bois, puis ciel étoilé et croissant de lune. Le 31, courses à Rubempré par Toutencourt, Puchevillers, Pierregot et Rainneville, achat de paille sous la grêle ; il aime le calme et le silence du village désert.
