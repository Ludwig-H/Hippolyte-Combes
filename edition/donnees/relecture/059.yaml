resume: 'Lundi 2 octobre 1916 à Toulouse, par un temps splendide. Hippolyte Combes passe la matinée dans son appartement, puis monte à Sainte-Marie vers 11 h 30 ; avant et après le déjeuner, long tête-à-tête avec Marguerite dans le petit salon. Redescendu vers 4 h, il reçoit à 5 h la visite de Marguerite et de sa mère ; chapelle de Nazareth vers 6 h 30, promenade rue d''Alsace, puis retour en tram à la Côte-Pavée. Départ à 9 h 30 avec Jean par une belle nuit étoilée. Dépenses : trams et un chapelet (1 f 25).'
