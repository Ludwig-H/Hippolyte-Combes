resume: 'Hippolyte Combes se lève à 6 h 30, termine ses paquets et quitte définitivement son logement de Barlette. Après une matinée d''attente au mess, la colonne part vers 11 h 15 pour une lente chevauchée à travers une région paisible, sous de fortes averses. Arrivée à Beauval à 15 h 30, quand le ciel s''éclaircit ; la petite ville est remplie de troupes et il trouve une chambre en face du mess. Comptes : blanchissage et reprisage à Barlette, pourboire à Connelly, cartes postales à Beauval.'
