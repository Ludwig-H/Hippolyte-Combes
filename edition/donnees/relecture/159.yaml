remarques: 'Ligne 17 : la date 26 L et Jour entier… pourraient former deux lignes ; on a suivi l''état antérieur. Lecture 11^{h} (non 9h) assurée. « pleine lune » lu sans doute possible, quoique la lune fût alors au premier croissant (nouvelle lune le 21 février 1917, selon le commentateur historique).'
resume: 'Samedi 24 février 1917, journée entière inoccupée ; courte promenade sur la route de Contay, temps brumeux, route boueuse, jusqu''au moulin. Dimanche 25, course le matin à Mirvaux, hameau d''une centaine d''habitants ; quelques heures de soleil, première sensation de printemps ; promenade l''après-midi sur la route de Toutencourt ; le village où le service est « exilé » est perdu sur les hauteurs. Lundi 26, journée de liberté : le capitaine Williams part seul vers 11 h pour Senlis et Martinsart et ne rentre qu''à 6 h du soir ; Hippolyte Combes écrit beaucoup, lit un roman anglais, se promène autour du village ; nuit étoilée et pleine lune.'
