remarques: Lieu déduit de la page précédente (cantine de la gare de Raincheval). La première lettre de « Après-midi » (l. 17) est empâtée d'une tache d'encre.
resume: 'Dimanche 17 septembre 1916, à Raincheval, la compagnie attend toujours son départ ; Combes s''occupe du fourrage vert et doit conduire un chariot à un champ de trèfle rouge. Temps très beau, frais matin et soir, soleil brûlant à midi. Il se promène plusieurs fois par jour dans le grand bois proche des horse-lines, derrière le mur du château, aux grands chênes séculaires. Le matin, il rencontre un interprète à la sortie de l''église et l''accompagne chez un petit vieux collectionneur de faïences, pierres et médailles ; l''après-midi, il assiste à un culte wesleyen dans une petite salle en face de l''église. Blanchissage : 1 franc.'
