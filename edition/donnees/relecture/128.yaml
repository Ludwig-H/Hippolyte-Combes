remarques: 'Début du voyage de permission vers Toulouse (suite cliché 129 : arrivée à Amiens vers 2 h du matin). La gare de départ n''est pas nommée : sans doute Acheux (ou Acheux-Varennes), d''où le soleil frappe les vitres « du côté de Varennes ».'
resume: Nuit très froide, forte gelée, soleil vif. Hippolyte Combes achève ses bagages, fait porter deux sacs à la gare par la voiture de la poste, puis gagne à pied la gare vers 2 h et s'installe en seconde classe. Il décrit la neige durcie scintillant au soleil et la buée de l'horizon, et converse avec un interprète sur les Anglais. Le train part après 3 h ; à Gézaincourt il attend la correspondance dans une salle surchauffée et bruyante ; le train de Doullens a trois heures de retard et il ne repart qu'à 10 h 30 du soir.
