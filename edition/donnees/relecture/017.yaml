remarques: 'Ponctuation relue signe par signe en première lecture (points de parages et de dégâts ; fibre roux après mètres). Le lieu est déduit des pages voisines (015–018 : Bac-Saint-Maur, bords de la Lys). « très » (l. 16) est réduit à t + r + accent + délié, forme habituelle.'
resume: Le vendredi 11 août 1916, la chaleur caniculaire reprend. L'après-midi, de 2 à 3 heures, 40 ou 50 obus tombent autour du cantonnement ; dans la maison du coin, à 50 mètres, un soldat est atteint (les mots décapité et bras emportés sont biffés). La grande blanchisserie Barbry subit beaucoup de dégâts et des obus non éclatés restent sur l'herbe. Hippolyte Combes descend à la cave pendant le bombardement et note son énervement, son malaise et une insécurité perpétuelle (mot écrit sur relative). Il inscrit 55 c d'œufs, puis note qu'il est question d'un nouveau départ dimanche et décrit une grande chambre à haute fenêtre, avec une vue étendue sur la campagne à l'ouest d'Armentières.
