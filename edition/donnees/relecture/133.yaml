resume: 'Suite du dimanche 28 janvier 1917 à Toulouse. Marguerite attendait Hippolyte Combes sur la porte et l''accueille tendrement ; il voit la tante et Madeleine. Il passe la journée à Sainte-Marie, en tête-à-tête avec Marguerite dans le petit salon ; Jean monte à six heures et demie et dîne avec eux. Hippolyte redescend seul à pied à neuf heures et demie, faute de tram, et note la simplicité, le charme et l''affection de Marguerite. Seule dépense : deux tickets de tram à 10 c.'
