resume: 'Le samedi 30 décembre, après une nuit de pluie torrentielle et par une douceur exceptionnelle, Hippolyte Combes va en Sunbeam à Franvillers, où il revoit trois vieux réfugiés de Martinsart. À Senlis, le capitaine Williams lui adresse devant l''ordonnance un mot très regrettable ; à Acheux, explication calme mais ferme : le capitaine s''excuse et le supplie de ne pas le quitter. Le dimanche 31, après une matinée dans sa chambre, course en auto à Belle-Église, Raincheval et Beauquesne ; le capitaine, gêné et contrit, ose à peine lui parler. Le soir, demi-séance au foyer Y.M.C.A. ; compte des dépenses du mess (total de 88 francs, faux).'
