resume: 'Le 6 octobre 1916, la compagnie d''Hippolyte Combes cantonne au hameau de Barlette, près de Ribeaucourt : quelques maisons, population sympathique, région boisée et pittoresque. Après le déjeuner, il gagne Bernaville en camion et fait viser son titre de permission au bureau de la Mission française. Il trouve une grande chambre chez une veuve dont le nom est laissé en blanc, à 900 mètres de Barlette, sommairement meublée mais belle et spacieuse. Comptes : cartes postales à Doullens et Bernaville, achats à la cantine, pourboire au conducteur du camion, gratification au Q.M.S. Tait.'
