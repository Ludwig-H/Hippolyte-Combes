resume: 'Vendredi 2 février 1917, à Toulouse : froid persistant, neige abondante le matin. Matin et soir, Hippolyte Combes est soigné chez le dentiste M. de Lersay, rue La Fayette, par une jeune opératrice ; l''après-midi, il rend visite à Mme de Labarthe puis retrouve Marguerite chez Henriette, et redescend à pied de Sainte-Marie vers 10 heures du soir. Il achète chez Pfister un remontoir en or mat Louis XVI (105 fr.) et note quelques menues dépenses (pastilles de chlorate de potasse, trams, bain place Belfort). Il regrette de quitter Toulouse et son appartement pour trois jours à Millau.'
