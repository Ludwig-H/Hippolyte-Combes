  apres: \sl{Janv. 17}
  justification: le petit trait devant 17 est le trait d'attaque du 1, non une barre de millésime ; mois et millésime soulignés ; date de gauche soulignée aussi
  confiance: haute
- ligne: 2
  avant: (neige fondue)
  apres: \add{(neige fondue)}
  justification: écrit dans l'interligne, sous « fine et »
  confiance: haute
- ligne: 6
  avant: 'Ve corps : vu'
  apres: 'V^{e} corps : Vu'
  justification: e suscrit ; V de « Vu » au module majuscule, identique au V de V^{e}
  confiance: moyenne
- ligne: 7
  avant: Cap. Huguet; mon départ fixé défint
  apres: 'cap. Huguet : mon départ fixé definit'
  justification: c minuscule ; deux-points nets après Huguet ; deux points d'i dans d-e-f-i-n-i-t, sans accent visible sur le e
  confiance: moyenne
- ligne: 8
  avant: 14 D. Neige
  apres: 14 D. – Neige
  justification: point abréviatif suivi d'un court tiret bas
  confiance: moyenne
- ligne: 10
