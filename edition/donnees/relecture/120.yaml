remarques: Montant de la coupe de cheveux (l. 13) et nom de Mme Capron (l. 20 ; cf. 115) à confronter avec les autres pages.
resume: 'Le jeudi 4 janvier 1917, Hippolyte Combes reste au repos dans sa chambre à Acheux, à ranger ses affaires et à regarder l''animation de la rue ; matinée de fortes ondées, après-midi ensoleillé, nuit de clair de lune. Le soir, concert des « XIII Corps Archie » à la baraque de la Y.M.C.A. Dépenses : coupe de cheveux (15 c, lecture incertaine) et concert (30 c). Le vendredi 5, en course toute la journée : ferme Moulard à Septenville, puis déjeuner à Beauquesne, au Café Continental, avec les lieutenants Walsh et Morris et l''interprète de ce dernier ; il passe un contrat de location de batteuse avec Mme Capron et rentre à la nuit tombante par des routes boueuses sous la lune. En bas de page : 78 f 75 au bureau de la Mission française du XIIIe corps à Acheux.'
