- ligne: 13
  lemme: \inc{15}c
  analyse: 'zoom [.46 .39 .66 .46] : premier chiffre = haste épaisse sans barre de tête, petit trait à gauche à mi-hauteur (attaque du 1 ou barre médiane d''un 7) ; second = boucle haute fermée et long jambage descendant (forme du 5 de « 75 », l. 24, et non f, dont aucune trace de c ou r après) ; c à tête pleine et délié comme 30c. Les autres coupes de cheveux du carnet coûtent 30 à 90 c : 75 c reste possible'
