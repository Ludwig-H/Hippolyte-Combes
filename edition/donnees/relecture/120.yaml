  - 75c
  - 1 fr
  - 50 c
- ligne: 20
  lemme: \inc{Capron}
  analyse: C bouclé, petite boucle (o ou a), p long, puis jambages terminés en crochet, point d'i au-dessus ; aucun r ni o distinct après le p ; même aspect au f. 57 v°
