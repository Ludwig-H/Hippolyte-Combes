difficultes:
- ligne: 3
  lemme: \add{\inc{ruisseaux}}
  analyse: 'mot écrit sous recouvertes, au niveau de la l. 4, même encre : délié d''attaque et pointe (r ou v), deux jambages (u ou i + s), jambage droit descendant sans boucle, à tête en V (s long, q ou g : les g de village et Fatigue sont aussi sans boucle sur cette page), petite boucle (e), panse fermée à jambage (a plutôt que u), croix finale (x) ; -eaux s''accorde mieux aux traits que -ueux, mais aucune lecture n''est satisfaisante pour le sens (ni accord avec couche ni place claire dans la phrase)'
  alternatives:
  - ruisseaux
  - rugueux
  - visqueux
  - visqueuse
- ligne: 1
  lemme: Déc.^{b}
  analyse: 'après le D en J et l''e plein, croissant épais au-dessus du c (accent décalé) ; point bas ; petite haste montante à pied tourné à droite, au-dessus de l''œil : b suscrit pour -bre (même forme qu''en 110)'
  alternatives:
  - Déc.^{b}
  - Déc.^{bre}
- ligne: 6
  lemme: lgs
  analyse: l bouclé net ; la suite est recouverte par le jambage épais du q de quitté (l. 5) ; un second jambage plus fin et une descente sous la ligne (g) ; ni barre ni t visibles
  alternatives:
  - lgs
  - lgt
- ligne: 12
  lemme: en
  analyse: 'e et n en traits fins, encre plus pâle, base un peu plus basse que celle de routes et de très, dans un blanc étroit : ajout probable, une reprise de plume n''est pas exclue'
  alternatives:
  - en (ajouté)
  - en
- ligne: 14
