remarques: Le capitaine de vingt ans (l. 21) est le capitaine Williams, présenté en 107 comme « nouvel off., Cap. Williams, 20 ans ». Le mot écrit sous recouvertes (l. 3) reste indécis entre ruisseaux, rugueux et visqueux ; la première lecture proposait rugueux.
resume: 'Le vendredi 15 décembre 1916, après un peu de neige dans la nuit, une pluie fine a tout fait fondre dans la matinée et les chaussées sont couvertes de boue liquide ; Combes ne quitte pas le village, reste longtemps au bureau devant le brasero ou dans sa chambre et lit beaucoup pour se distraire. Le lundi 18, comme la veille, il fait en auto des courses à Belle-Église, Arquèves, Raincheval, Toutencourt et à la ferme du Quesnoy ; sur des routes en très mauvais état la voiture ressaute, on est jeté de côté et d''autre, d''où une fatigue extrême. Le temps reste brumeux, les chaussées luisantes de boue, et l''on patauge par endroits jusqu''à la cheville. Les journées se suivent, monotones, et Combes trouve peu agréable la société de son officier, un capitaine de vingt ans présomptueux et vain (le capitaine Williams, cf. 107). Dépense : cartes postales, 25 c.'
