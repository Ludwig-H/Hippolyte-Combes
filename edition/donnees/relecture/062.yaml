remarques: 'La page suivante (063) s''ouvre le jeudi 5 à Paris, gare d''Orsay : départ par le train de nuit.'
resume: 'Le mercredi 4 octobre 1916, dernier jour de permission à Toulouse, Hippolyte Combes range l''appartement, passe à la gare puis aux Thermes du Languedoc. Il quitte la maison à 11 heures et passe l''après-midi à Sainte-Marie avec Marguerite : longs tête-à-tête, promenade dans le parc, jeux avec des enfants. Après le dîner, Marguerite tient à l''accompagner à la gare avec l''oncle Crouzet ; il choisit un coin de compartiment puis se promène avec eux le long des trottoirs de la cour de grande vitesse, avant une séparation abrégée par égard pour l''oncle.'
