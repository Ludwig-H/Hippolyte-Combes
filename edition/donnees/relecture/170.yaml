remarques: '63rd div., naval div. : 63rd (Royal Naval) Division.'
resume: 'Dimanche 18 mars 1917 : matin pluvieux, après-midi ensoleillé. Le matin, Hippolyte Combes va à pied à la Mission française de Toutencourt, s''arrête à l''église et entend le prône du vieux curé ; l''après-midi, il accompagne le lieutenant Wentworth à Puchevillers à pied, l''auto étant en réparation, et contemple le paysage. Comptes : solde de 82 francs, cartes postales (25 c.), blanchissage (80 c.). Lundi 19 : temps couvert ; il cède un des deux lits à un officier de la 63rd (Royal Naval) Division, dont le régiment revient des tranchées de Miraumont et d''Achiet-le-Petit, et recueille des renseignements.'
