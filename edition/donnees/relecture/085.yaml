remarques: 'Lieu (Albert) déduit du contexte (cliché 084 : cartes postales d''Albert). Le nom de l''adjudant est à harmoniser avec 023 et 090 dans l''index.'
resume: 'Mardi 24 octobre 1916, à Albert : pluie toute la nuit, averses fines toute la matinée, boue jusqu''à la cheville et brume qui masque la vue à 30 ou 40 mètres. Au bureau de la Mission française, l''adjudant Lepin et le lieutenant Pizzi lui apprennent qu''il ne quittera pas la Mission. Vers 11 heures, quelques obus tombent sur une prairie à 400 ou 500 mètres de sa chambre ; nuit calme. Mercredi 25 : même temps pluvieux mais doux, terrain du bivouac changé en fondrière ; libre, il lit et écrit dans sa chambrette, vie d''une extrême monotonie.'
