remarques: 'Lieu déduit du contexte (067 : arrivée à Barlette) ; aucun toponyme sur la page.'
resume: 'Première journée complète au cantonnement de Barlette. Nuit de tempête : averses et rafales font bruire arbres et arbustes devant la maison, comme au bord de la mer ; pluie et bourrasques tout le jour. Hippolyte Combes s''installe et se plaît dans son billet, une grande chambre haute de plafond, ancien salon d''une vieille grand-mère très sympathique ; devant la maison, une pâture plantée de pommiers chargés de fruits, au-delà de grands bois. Il règle au capitaine « Pant[on] » sa part des dépenses du mess de septembre : 29 francs.'
