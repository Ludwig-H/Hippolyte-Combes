remarques: 'La page suivante (064) revient au soir du 4 octobre (départ de Toulouse) : ordre des clichés lié à la codicologie (verso photographié avant le recto).'
resume: Le jeudi 5 octobre 1916 au matin, Hippolyte Combes arrive à la gare d'Orsay, gagne à pied sous une pluie fine le métro des Tuileries et change au Châtelet pour la gare du Nord, où il laisse ses paquets à la consigne. Il descend la rue La Fayette, se repose dans l'église Saint-Vincent-de-Paul, dont il admire les peintures murales et les colonnes de marbre, puis va aux Grands Magasins du Louvre, où il écrit deux lettres au salon de correspondance. La pluie cesse ; trop longtemps retenu au Louvre, il n'a pas le temps de déjeuner au restaurant et doit revenir en métro à la gare du Nord.
