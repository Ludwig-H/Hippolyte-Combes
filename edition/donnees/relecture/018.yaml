remarques: 'Les trois dernières lignes (après lunch…) reviennent sur le début de l''après-midi : ajout de fin de journée, séparé du compte par un filet partiel. L''éclusier est sans doute celui avec qui Combes a déjà causé la veille (016, écluse de la Lys).'
resume: 'Le samedi 12 août 1916, la chaleur caniculaire continue. En fin d''après-midi, Combes sort se distraire : il se promène le long de la Lys, cause longuement avec l''éclusier, puis suit la berge gazonnée jusqu''à une oasis d''ombre, un champ de luzerne face à des champs de blé jaunis. Allongé sur le dos, il goûte un repos délicieux en regardant les nuages floconneux sur le ciel bleu clair. Il note un demi-litre de lait à 15 c. Trois lignes ajoutées sous un filet précisent qu''après le déjeuner il est resté dans sa chambre à lire, la chaleur rendant toute sortie impossible.'
