remarques: La basilique d'Albert (Notre-Dame de Brebières) est celle de la Vierge penchée.
resume: 'Vendredi 16 mars 1917 : nuit de gel ; courses à Mirvaux et Pierregot, puis, après un déjeuner pris tôt, voyage à Albert par Contay, Warloy et Senlis : maisons atteintes par les obus, basilique, troupes australiennes cantonnées. Au retour, long arrêt à Ribemont pour acheter du fourrage, où Hippolyte Combes retrouve des connaissances. Compte du forgeron d''Hérissart. Samedi 17 : belle journée printanière ; aller-retour à pied à Toutencourt le matin, promenade à pied à Puchevillers l''après-midi avec le Lt Wentworth ; l''auto est aux ateliers ; passage de cavalerie indigène et anglaise au trot. Achat de cartes postales, dont des cartes de soie, à Toutencourt.'
