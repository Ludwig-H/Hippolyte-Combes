difficultes:
- ligne: 1
  lemme: s \inc{(}
  analyse: 'après 15 : court trait d''attaque montant qui recoupe une haste brève (aspect +), forme identique au s (soir) de la l. 4, mais sans le tiret ; puis crochet à tête recourbée, descendant en arc, surmonté d''un point placé à la hauteur des hampes (ce n''est donc pas un point abréviatif) ; enfin la vraie parenthèse ouvrante, haute et fine, devant espéré. Parallèles : « 1H s. » (039), « 8 H s — » (064).'
  alternatives:
  - s. (
  - s ((
- ligne: 1
  lemme: il y \inc{en}
  analyse: 'petit module, au-dessus de la fin de espéré : i pointé + l haut ; y à tête en V et longue descente à gauche ; puis e empâté (en V plein) relié à un jambage pointu et à un long délié horizontal vers la droite, n non formé. Le crochet sous ce groupe peut être l''accent du à de la ligne (gros a empâté). La haute haste isolée à droite (x≈0,91) pourrait être le t d''un « eût ».'
  alternatives:
  - il y eût
  - il y eu
- ligne: 1
  lemme: 10^{H}\inc{45}
  analyse: 1 à trait d'attaque ; 0 en petite boucle prolongée d'une longue queue (aspect ρ), qui rejoint presque le t de matin ; puis un H à deux hastes, sur le module des chiffres, dont la traverse déborde à droite, surmonté d'une haute haste oblique isolée ; 5 à drapeau et panse ouverte. Le 4 ne se lit que si la haute haste et la traverse débordante forment un 4 ouvert lié au H ; 9 exclu (le 1 est net).
  alternatives:
  - 10^{H}5
- ligne: 7
  lemme: \add{Paris}
  analyse: 'P à haste descendante, a, r, i, s final remontant ; le filet part à gauche du P et frôle le haut des lettres sans les traverser ; le long trait oblique montant passe nettement sous le mot et s''achève dans le premier jambage du M : attaque du M, non biffure.'
  alternatives:
  - \del{Paris}
- ligne: 8
  lemme: 10, c
  analyse: 1 appuyé + 0 ouvert en haut ; puis trait en arc, haut de 0,021 (plus que les c de la ligne, 0,012–0,015) et plongeant sous la ligne comme les virgules de Food ; après un blanc, petit c en crochet à courte queue, de la forme du c de 15 c (l. 7) et de 10c (l. 9).
  alternatives:
  - 10c c
  - 10c —
