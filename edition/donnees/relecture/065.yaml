remarques: Page en grande partie blanche, encre violette homogène. Point d'encre isolé entre les l. 5 et 6, sous « vers », sans valeur. Transparence du verso (taches brunes) sans texte lisible.
resume: 'Suite du jeudi 5 octobre 1916, au retour de la permission passée à Toulouse : Hippolyte Combes quitte Paris par le train de 1 h 15 de l''après-midi, alors qu''il avait espéré en trouver un à 10 h 45 du matin (lecture incertaine). Il arrive à Amiens à 6 h du soir, en repart à 6 h 30 et n''atteint Doullens que vers minuit ; il doit coucher à la gare. Les comptes, sous un filet, notent à Paris deux billets de métro (15 c chacun), puis de la nourriture (25 c, 25 c, 50 c), une boisson (10 c) et la consigne (10 c).'
