  analyse: 'À vérifier sur l''image : 1080 caractères ; sources principales : OH 1916-I p. 274 et OH 1917-I p. 66 et 69 (Edmonds 1932, Falls 1940), LLT (CCS de Puchevillers, QG du V Corps à Acheux le 12 janv.), Barbé 1917 ; aucune version p2, rédigé d''après p1. J''ai corrigé « lieux » en « Acheux-en-Amiénois, Belle-Église (Arquèves), Raincheval, Puchevillers (Somme) ». Le lien entre la canonnade du 18 et les attaques de la 11th Division à l''ouest de la route Beaucourt–Puisieux reste une hypothèse (« peut-être ») : la date exacte de ces attaques n''a pas pu être confirmée sur le web. — Relecture p2 : l''image ne dit rien de la provenance de la canonnade (« Matin (Canonnade — ») ; le mot « confondaient » de p1 devient « confondent » (incertain), ce que le commentaire doit suivre s''il cite la phrase.'
