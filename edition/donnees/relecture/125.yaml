remarques: 'Ve corps : Ve corps d''armée britannique (V Corps) ; « bureau Mission » : bureau de la Mission française auprès de ce corps.'
resume: 'Jeudi 18 janvier 1917 : canonnade le matin, temps froid, la neige reste sur les toits et les champs. Le matin, course en auto à Belle-Église, Raincheval et Puchevillers ; les plaines blanches se confondent avec le ciel mat. Après-midi libre. Vendredi 19 : ciel bas, neige non fondue, nouvelle course à Puchevillers par Raincheval ; neige cristallisée, buée grise, il gèle fort. Le matin, au bureau de la Mission du Ve corps, il touche sa solde de 84 francs.'
