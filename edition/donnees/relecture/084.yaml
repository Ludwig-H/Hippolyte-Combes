remarques: Le cratère « sur la droite » est vraisemblablement celui de Lochnagar (mine du 1er juillet 1916). Tuiles de la rangée 5 vides (grand blanc).
resume: 'Lundi 23 octobre 1916, à Albert : levé très tard ; journée brumeuse mais moins froide. L''après-midi, Hippolyte Combes va en camion à La Boisselle avec deux de ses officiers. Autour d''Albert et jusqu''à l''horizon, troupes au bivouac, tentes innombrables et dépôts de toutes sortes. Il visite longuement un abri souterrain allemand, très habilement aménagé, et voit un immense cratère sur la droite ; impression funèbre de désolation. Seule dépense : cartes postales d''Albert, 70 c.'
