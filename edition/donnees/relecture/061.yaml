remarques: Commerce « Cie Française » non identifié ; la page suivante (062) ouvre le mercredi 4 octobre.
resume: Le 3 octobre 1916, à Toulouse, Hippolyte Combes règle le tailleur Guiraud pour la façon et les fournitures d'une tunique (38 f) et paie à Mlle Guilhem le semestre de juillet 1916 à janvier 1917 (90 f). Il achète 20 cm de doublure de satin à la Compagnie Française et des fleurs. Il note ensuite le charme de la propriété de Mme de Labarthe, qui leur a fait visiter sa maison avec simplicité et abandon.
