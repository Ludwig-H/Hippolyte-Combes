remarques: Le cantonnement (Barlette, près de Ribeaucourt) est déduit des pages voisines ; la page ne le nomme pas.
resume: Le jeudi 12 octobre 1916, par temps pluvieux, Hippolyte Combes conduit l'après-midi un limber et des G.S. wagons dans un grand champ de luzerne coupée. À l'aller et au retour, il s'attarde dans les bois pour écouter le vent en rafales, semblable au bruit de la houle. Le vendredi 13, sous un ciel bas et gris, il fait l'après-midi une course à cheval avec le capitaine « Pant » jusqu'au village de Prouville, à 4 kilomètres. Au dîner, il apprend que la compagnie changera de cantonnement le dimanche et regrette de partir.
