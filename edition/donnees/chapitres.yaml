chapitres:
- numero: I
  premier_cliche: 1
  titre: De la Flandre intérieure à la vallée de la Lys
  periode: 25~juillet – 12~août 1916
  illustrations:
  - fichier: illustrations/epoque/bailleul_hotel_de_ville_beffroi_vers_1909.jpg
    legende: Bailleul, l'hôtel de ville et le beffroi (carte postale, vers 1900--1909).
  - fichier: illustrations/epoque/bailleul_grand_place_convoi_hippomobile_1917.jpg
    legende: Bailleul, convoi hippomobile néo-zélandais sur la Grand-Place (15~mai~1917 ; National Library of New Zealand).
- numero: II
  premier_cliche: 19
  titre: De la Lys à la Somme
  periode: 13~août – 24~septembre 1916
  illustrations:
  - fichier: illustrations/epoque/saint_pol_rue_defile_territoriaux_1916.jpg
    legende: Saint-Pol-sur-Ternoise, passage de territoriaux (9~mars~1916 ; La contemporaine, Licence Ouverte).
  - fichier: illustrations/epoque/lucheux_beffroi_vers_1900.jpg
    legende: Lucheux, la porte du beffroi (\textit{France-Album}, années 1890 ; Gallica-BnF).
- numero: III
  premier_cliche: 50
  titre: La première permission — Paris et Toulouse
  periode: 25~septembre – 6~octobre 1916
  illustrations:
  - fichier: illustrations/epoque/paris_gare_du_nord_permissionnaire_taxi_1915.jpg
    legende: Paris, gare du Nord, un permissionnaire et les taxis (juillet~1915 ; agence Meurisse, Gallica-BnF).
  - fichier: illustrations/epoque/amiens_cathedrale_muirhead_bone_1916.jpg
    legende: Amiens, carrefour des permissionnaires ; la cathédrale dessinée en 1916 par Muirhead Bone (lithographie, 1917 ; RAMM, Exeter).
- numero: IV
  premier_cliche: 67
  titre: L'automne sur l'Ancre — d'Albert à Acheux
  periode: 6~octobre – 30~novembre 1916
  illustrations:
  - fichier: illustrations/epoque/albert_basilique_vierge_penchee_attelage_1916.jpg
    legende: Albert, la basilique Notre-Dame-de-Brebières et sa Vierge penchée (photographie officielle canadienne, vers 1916--1917 ; Archives of Ontario).
  - fichier: illustrations/epoque/contay_convoi_camions_septembre_1916.jpg
    legende: Camion de premiers secours en tête d'une colonne de camions, près de Contay (septembre~1916 ; Nationaal Archief, CC{\LJchiffres 0}).
  illustration_fin:
    fichier: illustrations/epoque/albert_vierge_penchee_gros_plan_1916.jpg
    legende: La Vierge dorée de la basilique d'Albert, couchée par un obus le 15~janvier~1915 (photographie officielle canadienne, vers 1916 ; Archives of Ontario).
- numero: V
  premier_cliche: 105
  titre: L'hiver à Acheux-en-Amiénois
  periode: 1\textsuperscript{er}~décembre 1916 – 25~janvier 1917
  illustrations:
  - fichier: illustrations/epoque/bertrancourt_foyer_ymca_avril_1918.jpg
    largeur: 0.62\textwidth
    legende: Foyer de la Y.M.C.A. à Bertrancourt, près d'Acheux (avril~1918 ; National Library of New Zealand).
  illustration_fin:
    fichier: illustrations/epoque/route_saint_pol_arras_convoi_neige_fevrier_1917.jpg
    legende: Ambulances sur la route de Saint-Pol à Arras, sous la neige (février~1917 ; Imperial War Museums, Q~4683).
- numero: VI
  premier_cliche: 128
  titre: La seconde permission — Paris, Toulouse, Millau
  periode: 26~janvier – 7~février 1917
  illustrations:
  - fichier: illustrations/epoque/toulouse_saint_sernin_autochrome_1916.jpg
    legende: Toulouse, la basilique Saint-Sernin, qu'Hippolyte Combes visite le 29~janvier~1917 (autochrome, 28~avril~1916 ; musée départemental Albert-Kahn).
  - fichier: illustrations/epoque/millau_tarn_moulin_du_pont_vieux_avant_1914.jpg
    legende: Millau, le Tarn et le moulin du Pont-Vieux (avant 1914 ; Gallica-BnF).
  illustration_fin:
    fichier: illustrations/epoque/millau_ganterie_jonquet_vers_1910.jpg
    legende: Millau, la ganterie Jonquet, salle des fourrures (carte postale, années 1910).
- numero: VII
  premier_cliche: 147
  titre: Hérissart et le printemps de 1917
  periode: 7~février – 30~avril 1917
  illustrations:
  - fichier: illustrations/epoque/puchevillers_gare_hopital_vue_aerienne_1916.jpg
    legende: Puchevillers, la gare et les hôpitaux d'évacuation vus d'un avion allemand (septembre~1916 ; Landesarchiv Baden-Württemberg, CC BY 4.0).
  - fichier: illustrations/epoque/cavalerie_indienne_deccan_horse_mars_1917.jpg
    legende: Cavalerie indienne (Deccan Horse) près de Pys (mars~1917 ; Imperial War Museums, Q~4997).
