albert_basilique_vierge_penchee_attelage_1916.jpg:
  legende: Albert, la basilique Notre-Dame-de-Brebières et sa Vierge “horizontale”, au-dessus de la place où passent les attelages britanniques (photographie officielle canadienne, vers 1916-1917 ; Archives of Ontario).
  lieu: Albert (Somme), place devant la basilique.
  date: 'vers 1916-1917 (Archives of Ontario : « ca. 1917 » ; la statue est encore suspendue, donc avant avril 1918).'
  auteur: photographe officiel canadien non identifié (Canadian War Records Office) ; album « Canadian Expeditionary Force photograph albums », Archives of Ontario, C 224-8, n° I0004828.
  source: https://commons.wikimedia.org/wiki/File:Albert_Cathedral_damaged_by_the_war_(I0004828).jpg
  licence: 'domaine public — `PD-US-expired` + `PD-Canada` (photographie canadienne antérieure à 1949 ; publiée avant 1931). Crédit : Archives of Ontario.'
  chapitre: 'IV — 18 oct. 1916 (f. 39 v° : « Arrêté l[on]g[temp]t devant basilique ravagée par les obus ») et 22 oct. 1916 (f. 42 r°) ; rappel en VII (16 et 22 mars 1917, f. 84 v° et 85 v°).'
albert_vierge_penchee_gros_plan_1916.jpg:
  legende: '“Vierge, horiz[onta]le, penche Jésus bras ouverts au-dessus place” (22 octobre 1916) : la Vierge dorée d''Albert, renversée par un obus en janvier 1915 (photographie officielle canadienne, vers 1916).'
  lieu: Albert (Somme).
  date: 'vers 1916 (Archives of Ontario : « ca. 1916 »).'
  auteur: photographe officiel canadien non identifié ; Archives of Ontario, C 224-8, n° I0004775.
  source: https://commons.wikimedia.org/wiki/File:Falling_statue_on_the_Albert_Cathedral_Tower_(I0004775).jpg
  licence: 'domaine public — `PD-US-expired` + `PD-Canada`. Crédit : Archives of Ontario.'
  chapitre: IV — 22 oct. 1916 (f. 42 r°, la page même de la description).
bailleul_grand_place_convoi_hippomobile_1917.jpg:
  legende: 'Bailleul, la Grand-Place traversée par un train de voitures hippomobiles, 15 mai 1917 : le décor des promenades d''Hippolyte Combes, un an plus tôt, avant la destruction de la ville en 1918 (H. A. Sanders, Alexander Turnbull Library).'
  lieu: Bailleul (Nord), Grand-Place.
  date: 15 mai 1917.
  auteur: Henry Armytage Sanders, photographe officiel néo-zélandais ; Alexander Turnbull Library, National Library of New Zealand, réf. 1/2-013396-G.
  source: https://commons.wikimedia.org/wiki/File:New_Zealand_troops_march_through_Bailleul,_France_(21610313216).jpg
  licence: '« No known copyright restrictions » (`Flickr-no known copyright restrictions`, National Library of New Zealand, Flickr Commons) ; photographie officielle néo-zélandaise de 1917, *Crown copyright* (100 ans) expiré. Crédit : Alexander Turnbull Library, Wellington, 1/2-013396-G.'
  chapitre: 'I — 1er août 1916 (f. 4 r° : « Place assez semblable à celle d''Hazebrouck & de Béthune […] regardé longuement église & hôtel de ville »), 5 août 1916 (f. 6 r° : le convoi de la compagnie passe par Bailleul) ; II — 25 août 1916 (f. 14 r° : embarquement à Bailleul).'
bailleul_hotel_de_ville_beffroi_vers_1909.jpg:
  legende: Bailleul, le beffroi et l'hôtel de ville qu'Hippolyte Combes “regarde longuement” le 1er août 1916 ; ils seront anéantis en avril 1918 (carte postale, vers 1909).
  lieu: Bailleul (Nord), Grand-Place.
  date: vers 1900-1909 (carte ayant circulé en 1909).
  auteur: photographe anonyme ; éditeur au trèfle à quatre feuilles (Maurice Tesson, Limoges). Collection Jpcuvelier.
  source: https://commons.wikimedia.org/wiki/File:Nord_-_28_-_Bailleul_%E2%80%94_H%C3%B4tel_de_Ville.jpg
  licence: domaine public (`PD-old-70-expired`).
  chapitre: I — 1er août 1916 (f. 4 r°).
saint_pol_rue_defile_territoriaux_1916.jpg:
  legende: 'Saint-Pol, petite sous-préfecture aux “rues en pente aboutissant à gde place”, au cœur de la zone britannique : défilé de territoriaux français, 9 mars 1916 (SPA, E. Mas ; La contemporaine).'
  lieu: Saint-Pol-sur-Ternoise (Pas-de-Calais).
  date: 9 mars 1916.
  auteur: Emmanuel-Louis Mas (Section photographique de l'armée) ; La contemporaine (Nanterre), fonds des « Albums Valois ».
  source: 'https://commons.wikimedia.org/wiki/File:D%C3%A9fil%C3%A9_du_108e_RIT_dans_une_rue_de_Saint-Pol,_9_mars_1916.jpg (notice d''origine : https://argonnaute.parisnanterre.fr/ark:/14707/a011432125257Rw8Pmx)'
  licence: 'Licence Ouverte / Open Licence (Etalab), déclarée par La contemporaine pour les Albums Valois — réutilisation libre, y compris commerciale, avec mention de la source. Crédit : « La contemporaine, Nanterre — Albums Valois (opérateur E. Mas) ».'
  chapitre: 'II — 25 août 1916 (f. 14 r° : arrivée en gare de Saint-Pol) et 31 août 1916 (f. 16 v° : promenade à Saint-Pol).'
lucheux_beffroi_vers_1900.jpg:
  legende: 'Lucheux, le beffroi : halte du 11 septembre 1916 sur la route d''Oppy à Raincheval, où Hippolyte Combes note le souvenir de l''“Édit de Louis XI, 1464, des postes” (*La France en album*, vers 1900).'
  lieu: Lucheux (Somme).
  date: 'années 1890-1900 (datation BnF : années 1890).'
  auteur: photographe non identifié ; recueil attribué par la BnF à « A. Karl » (donateur) ; BnF, département des Estampes et de la photographie, btv1b10500747g (f. 340).
  source: https://commons.wikimedia.org/wiki/File:France-Album_-_fascicules_55-70_-_dessins_originaux_A._Karl_-_btv1b10500747g_(340_of_605).jpg
  licence: 'domaine public (`PD-France`, `PD-US-expired`). Mention demandée : « Source gallica.bnf.fr / BnF ».'
  chapitre: II — 11 sept. 1916 (f. 21 r°).
contay_convoi_camions_septembre_1916.jpg:
  legende: Les *lorries* d'une *supply column* sur une route de l'arrière-front, près de Contay, septembre 1916 ; le 6 octobre, Hippolyte Combes rejoint sur l'un d'eux le *refilling point* de sa brigade (Nationaal Archief, fonds Spaarnestad).
  lieu: environs de Contay (Somme).
  date: septembre 1916.
  auteur: photographe inconnu (photographie de presse) ; Nationaal Archief (La Haye), fonds Spaarnestad, inv. 22057, n° 22057_041.
  source: https://commons.wikimedia.org/wiki/File:A_first_aid_lorry_with_a_convoy_near_Contay,_September_1916,_Bestanddeelnr_22057_041.tif
  licence: 'CC0 1.0 (dédicace au domaine public par le Nationaal Archief ; « Auteursrechthebbende : Publiek Domein »).'
  chapitre: 'IV — 6 oct. 1916 (f. 33 v° : « les lorries (supply column) de la 54e brigade […] Monté sur 1 de ces lorries ») et 18 oct. 1916 (f. 39 v° : « eu a lift s/ 1 lorry chargé d''obus ») ; Contay revient en VII (f. 84 v°, 85 v°).'
puchevillers_gare_hopital_vue_aerienne_1916.jpg:
  legende: 'Puchevillers vu par un avion allemand, septembre 1916 : la tête de ligne (*railhead*) et l''hôpital d''évacuation britannique ; c''est dans ce village qu''Hippolyte Combes s''installe, “billet 220”, le 11 mars 1917 (Landesarchiv Baden-Württemberg, CC BY 4.0).'
  lieu: Puchevillers (Somme).
  date: septembre 1916.
  auteur: aviation allemande, observateur « Lt. d. R. Münz » ; Landesarchiv Baden-Württemberg, Generallandesarchiv Karlsruhe, 456 F 7 Nr. 114 Foto 14.
  source: 'https://commons.wikimedia.org/wiki/File:Foto_des_Bahnhofs_von_Puchevillers_mit_Kriegsrampe_und_Lazarettanlage_(Luftbild)_-_LABW_-_Generallandesarchiv_Karlsruhe_456_F_7_Nr._114_Foto_14.jpg (permalien de l''archive : https://www.landesarchiv-bw.de/plink/?f=4-1701618-1)'
  licence: 'CC BY 4.0. Crédit obligatoire : « Landesarchiv Baden-Württemberg, Generallandesarchiv Karlsruhe 456 F 7 Nr. 114 Foto 14 (CC BY 4.0) ».'
  chapitre: VII — 11 mars 1917 (f. 83 r°) ; Puchevillers est traversé dès l'automne 1916 (f. 38 r°, 52 r°, 55 r°, 73 v°).
albert_depot_routier_distribution_pain_mars_1917.jpg:
  legende: 'Au dépôt routier d''Albert, un homme de l''Army Service Corps fait les parts de pain des unités, mars 1917 : la mécanique quotidienne du ravitaillement dont Hippolyte Combes est l''un des rouages (J. W. Brooke, IWM Q 4828).'
  lieu: Albert (Somme), dépôt de ravitaillement au bord de la route.
  date: mars 1917.
  auteur: John Warwick Brooke, photographe officiel britannique ; Imperial War Museums, Q 4828.
  source: https://commons.wikimedia.org/wiki/File:The_Army_Service_Corps_on_the_Western_Front,_1914-1918_Q4828.jpg
  licence: 'domaine public (`PD-UKGov` : photographie de la Couronne britannique antérieure à 1957, droits expirés). Crédit : Imperial War Museums (Q 4828).'
  chapitre: 'VII — 16 et 22 mars 1917 (f. 84 v° et 85 v°, passages à Albert ; neige les 20-22 mars) ; illustre aussi le *refilling point* de la compagnie (I : f. 3 v° ; IV : f. 33 v°).'
route_saint_pol_arras_convoi_neige_fevrier_1917.jpg:
  legende: 'L''hiver 1917 sur l''arrière-front : un convoi d''ambulances automobiles attend ses ordres sur la route enneigée de Saint-Pol à Arras, février 1917 (J. W. Brooke, IWM Q 4683).'
  lieu: route de Saint-Pol-sur-Ternoise à Arras (Pas-de-Calais).
  date: février 1917.
  auteur: John Warwick Brooke ; Imperial War Museums, Q 4683.
  source: https://commons.wikimedia.org/wiki/File:The_British_Army_on_the_Western_Front,_1914-1918_Q4683.jpg
  licence: 'domaine public (`PD-UKGov`). Crédit : Imperial War Museums (Q 4683).'
  chapitre: 'V-VII — le grand froid de janvier-février 1917 (f. 61 v°, 14 janv. : « Neige tombé à gros flocons » ; f. 71 v°, 5 févr. : « Neige partout » ; f. 73 v°, 7 févr. : « Bise glaciale. Froid intense »).'
cavalerie_indienne_deccan_horse_mars_1917.jpg:
  legende: 'La cavalerie indienne monte vers l''ancien front au moment du repli allemand, mars 1917 : “Troupes cavalerie indigène & anglaise traversé village au trot” (Hérissart, 17 mars 1917) (J. W. Brooke, IWM Q 4997).'
  lieu: près de Pys (Somme), ancien champ de bataille de l'Ancre.
  date: mars 1917.
  auteur: John Warwick Brooke ; Imperial War Museums, Q 4997.
  source: https://commons.wikimedia.org/wiki/File:The_German_Withdrawal_To_the_Hindenburg_Line,_March-april_1917_Q4997.jpg
  licence: 'domaine public (`PD-UKGov`). Crédit : Imperial War Museums (Q 4997).'
  chapitre: 'VII — 17 mars 1917 (f. 84 v°) et 21 mars 1917 (f. 85 v° : « Admiré cav[ale]rie indienne & anglaise »).'
repli_allemand_route_amiens_saint_quentin_mars_1917.jpg:
  legende: 'Mars 1917, le repli allemand sur la ligne Hindenburg : l''infanterie britannique avance sur la route d''Amiens à Saint-Quentin ; à l''arrière, Hippolyte Combes note les “routes encombrées par troupes *moving*” (E. Brooks, IWM Q 1863).'
  lieu: route Amiens-Saint-Quentin, de Foucaucourt vers Brie (Somme).
  date: mars 1917.
  auteur: Ernest Brooks, photographe officiel britannique ; Imperial War Museums, Q 1863.
  source: https://commons.wikimedia.org/wiki/File:Sherwood_Foresters_following_up_Germans_near_Brie_March_1917_IWM_Q_1863.jpg
  licence: 'domaine public (`PD-UKGov`). Crédit : Imperial War Museums (Q 1863).'
  chapitre: VII — 16-22 mars 1917 (f. 84 v°–85 v°).
paris_gare_du_nord_permissionnaire_taxi_1915.jpg:
  legende: Un permissionnaire hèle un taxi à la sortie de la gare du Nord (Agence Meurisse, juillet 1915) ; le 27 janvier 1917, Hippolyte Combes y prend “1 fiacre” pour gagner la gare d'Orsay et le train de Toulouse.
  lieu: Paris, gare du Nord.
  date: 'juillet 1915 (diffusion Meurisse : 9 juillet 1915).'
  auteur: Agence de presse Meurisse (photographe non identifié) ; BnF, département des Estampes et de la photographie, btv1b90437920 (Meurisse, 57527).
  source: https://commons.wikimedia.org/wiki/File:Arriv%C3%A9e_des_permissionnaires_%C3%A0_la_gare_du_Nord_-_btv1b90437920.jpg
  licence: 'domaine public (`PD-France`, `PD-1996`, `PD-US-expired` : photographie de presse anonyme publiée en 1915). Mention demandée : « Source gallica.bnf.fr / BnF ».'
  chapitre: 'VI — 27 janv. 1917 (f. 65 r°) ; aussi III — 26 sept. et 5 oct. 1916 (f. 26 v°, 32 v° : tramway du Bourget à la gare du Nord, consigne des bagages).'
toulouse_saint_sernin_autochrome_1916.jpg:
  legende: 'Saint-Sernin en couleurs, avril 1916 (autochrome d''Auguste Léon, musée Albert-Kahn) : “Toute ma jeunesse réveillée, dans & autour de cette admirable église romane” (29 janvier 1917).'
  lieu: Toulouse, place Saint-Sernin.
  date: 28 avril 1916.
  auteur: Auguste Léon, opérateur des Archives de la Planète (mission « 1916 – Provinces françaises », Jean Brunhes, Auguste Léon et Georges Chevalier) ; Département des Hauts-de-Seine, musée Albert-Kahn, A 8326.
  source: 'https://commons.wikimedia.org/wiki/File:La_basilique_Saint-Sernin,_vue_depuis_la_place_Saint-Sernin,_rue_du_Taur_-_A8326.jpg (notice du musée : https://collections.albert-kahn.hauts-de-seine.fr/document/la-basilique-saint-sernin-vue-depuis-la-place-saint-sernin-rue-du-taur/617a7a43cf8b8968b3381b6f)'
  licence: 'CC0 1.0 (dédicace au domaine public par le musée départemental Albert-Kahn ; l''opérateur est mort en 1942). Crédit d''usage : « Musée départemental Albert-Kahn, Département des Hauts-de-Seine ».'
  chapitre: 'VI — 29 janv. 1917 (f. 67 r° : visite de la basilique et des cryptes).'
millau_ganterie_jonquet_vers_1910.jpg:
  legende: 'Millau, la ville natale d''Hippolyte Combes, vivait de la mégisserie et de la ganterie : la “salle des fourrures” de la maison Jonquet (carte postale, années 1910).'
  lieu: Millau (Aveyron), ganterie Jonquet.
  date: années 1910.
  auteur: photographe et éditeur non identifiés (carte postale ; reproduction d'après Delcampe).
  source: https://commons.wikimedia.org/wiki/File:Millau_Gant_Jonquet_Salle_des_fourrures.jpg
  licence: 'domaine public (`PD-old-1923` sur Commons : œuvre anonyme publiée avant 1923).'
  chapitre: VI — séjour à Millau, 3-5 févr. 1917 (f. 69 v°–71 v°).
millau_tarn_moulin_du_pont_vieux_avant_1914.jpg:
  legende: 'Millau avant 1914 : le Tarn et ses lavandières sous la Pouncho d''Agast ; le moulin du Pont-Vieux (photographies d''Émile Duchemin, BnF). Hippolyte Combes y revient le 3 février 1917 : “Impression silence profond en débarquant ville natale”.'
  lieu: Millau (Aveyron), bords du Tarn et Pont-Vieux.
  date: entre 1890 et 1914.
  auteur: Émile Duchemin (1862-1914) ; BnF, département des Estampes et de la photographie, btv1b106645153.
  source: https://commons.wikimedia.org/wiki/File:Aveyron_-_btv1b106645153.jpg
  licence: 'domaine public (`PD-France`, `PD-old-auto-expired` [auteur mort en 1914], `PD-US-expired`). Mention demandée : « Source gallica.bnf.fr / BnF ».'
  chapitre: VI — 3-5 févr. 1917 (f. 69 v°–71 v°).
bertrancourt_foyer_ymca_avril_1918.jpg:
  legende: 'Un foyer de la Y.M.C.A. dans une grange de Bertrancourt, à quelques kilomètres d''Acheux (avril 1918) : c''est dans une “Y.M.C.A. hut” de ce genre qu''Hippolyte Combes entend une conférence sur la Russie et les concerts de Noël 1916 (H. A. Sanders, Alexander Turnbull Library).'
  lieu: Bertrancourt (Somme), village voisin d'Acheux-en-Amiénois (environ 3 km).
  date: '16 avril 1918 — *un an après la fin du carnet* : image retenue à défaut d''une photographie libre et nette d''un foyer Y.M.C.A. du secteur en 1916-1917 (les photographies IWM de 1917 ne sont disponibles sur Commons qu''en 800 px).'
  auteur: Henry Armytage Sanders, photographe officiel néo-zélandais ; Alexander Turnbull Library, National Library of New Zealand.
  source: https://commons.wikimedia.org/wiki/File:A_New_Zealand_Divisional_YMCA_building_on_the_Somme_(21474583676).jpg
  licence: '« No known copyright restrictions » (`Flickr-no known copyright restrictions`, National Library of New Zealand) ; photographie officielle néo-zélandaise, *Crown copyright* expiré. Crédit : Alexander Turnbull Library, Wellington.'
  chapitre: 'V — 25 déc. 1916 (f. 57 r° : « ds la Y.M.C.A. hut, concert : chansons comiques & saynètes ») ; voir aussi IV, 17 nov. 1916 (f. 50 r° : conférence « s/ Russia ») et VI, 27 janv. 1917 (f. 65 r° : « Y.M.C.A. Hut, à côté gare » d''Amiens).'
amiens_cathedrale_muirhead_bone_1916.jpg:
  legende: 'Amiens, carrefour des permissionnaires : la cathédrale dessinée en 1916 par Muirhead Bone, artiste officiel du front britannique (lithographie, 1917 ; RAMM, Exeter).'
  lieu: Amiens (Somme).
  date: dessin exécuté en 1916 (Bone arrive au front le 16 août 1916) ; lithographie publiée en 1917.
  auteur: Sir (David) Muirhead Bone (1876-1953), premier artiste de guerre officiel britannique ; Royal Albert Memorial Museum & Art Gallery (Exeter), inv. 50/1918/1/9.
  source: https://commons.wikimedia.org/wiki/File:Amiens_Cathedral_-_Sir_Muirhead_Bone_-_50_1918_1_9.jpg
  licence: 'domaine public (`PD-old-70` : auteur mort en 1953) ; numérisation versée sous CC0 par le musée (`CC0`). Crédit d''usage : Royal Albert Memorial Museum & Art Gallery, Exeter.'
  chapitre: 'VI — nuit du 26 au 27 janv. 1917 à Amiens (f. 64 v°–65 r° : l''Abri du Soldat complet, la Y.M.C.A. Hut près de la gare, l''attente sur le quai) ; aussi III (25 sept. et 5 oct. 1916, f. 26 r° et 33 r°).'
