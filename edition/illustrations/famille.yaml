# Photographies et documents des archives familiales reproduits dans l'édition (originaux ou copies conservés
# dans la descendance d'Hippolyte Combes). Légende courte, date, fonds d'origine.
hippolyte_1897.jpg:
  legende: Hippolyte Combes à vingt et un ans (1897).
  origine: portraits et lieux de famille
toulon_artillerie_1915.jpg:
  legende: Canonniers de la 39\textsuperscript{e}~batterie du 10\textsuperscript{e}~régiment d'artillerie à pied, Toulon (printemps 1915), photographie de Marius Bar.
  origine: photographies militaires
hippolyte_canonnier_1915.jpg:
  legende: Hippolyte Combes, canonnier au 10\textsuperscript{e}~régiment d'artillerie à pied, en buste (printemps 1915).
  origine: photographies militaires
hippolyte_canonnier_pied_1915.jpg:
  legende: Hippolyte Combes, canonnier au 10\textsuperscript{e}~régiment d'artillerie à pied, coiffé du bonnet de police (printemps 1915).
  origine: photographies militaires
interpretes_salle_des_fetes.jpg:
  legende: Militaires en kaki et képi, sans doute des interprètes, devant une salle des fêtes (lieu et date incertains ; la famille la date d'avril 1915, à Toulon).
  origine: photographies militaires
hippolyte_interprete_1.jpg:
  legende: Hippolyte Combes en tenue d'interprète, coiffé du képi, 1915–1918 (portrait de studio).
  origine: photographies militaires
hippolyte_interprete_2.jpg:
  legende: Hippolyte Combes en tenue d'interprète, tête nue, 1915–1918 (portrait de studio).
  origine: photographies militaires
fiche_matricule.jpg:
  legende: Registre matricule du recrutement de Toulouse, classe 1896, n° 911 (fiche refaite en 1921).
  origine: papiers militaires
marguerite_1917.jpg:
  legende: Marguerite Calmels à vingt-cinq ans (1917).
  origine: portraits et lieux de famille
mariage_millau_1917.jpg:
  legende: Mariage d'Hippolyte Combes et de Marguerite Calmels, Millau, 25 octobre 1917.
  origine: état civil et actes familiaux
menu_mariage_1917.jpg:
  legende: Menu du repas de noces, 25 octobre 1917.
  origine: état civil et actes familiaux
famille_combes_1925.jpg:
  legende: Hippolyte et Marguerite Combes et quatre de leurs enfants (milieu des années 1920).
  origine: photographies de famille
hippolyte_trois_enfants.jpg:
  legende: Hippolyte Combes et trois de ses enfants (années 1920).
  origine: photographies de famille
enfants_jeux.jpg:
  legende: Les enfants Combes au jardin (années 1920).
  origine: photographies de famille
hippolyte_cambridge_1930.jpg:
  legende: Hippolyte Combes à Cambridge (années 1930).
  origine: portraits et lieux de famille
maison_millau.jpg:
  legende: Millau, la maison Combes (photographie récente).
  origine: portraits et lieux de famille
andelys_ecole_militaire.jpg:
  legende: Les Andelys, l'École militaire préparatoire d'infanterie, carte postale annotée « Ma chambre » par Hippolyte Combes (1918–1919).
  origine: photographies militaires
camarades_ailly_1919.jpg:
  legende: Militaires britanniques, « Camarades », Ailly-sur-Somme, 9 juin 1919 (titre et date donnés par la famille).
