#         « date » s'imprime sous le nom ; dx/dy = décalage de l'étiquette en mm ; ha = alignement (left/right/center).
# contexte : repères sans lien direct avec le carnet (localités du front, villes), en gris.
# fronts : lignes de donnees/fronts.yaml ; zone_allemande : front à l'est duquel la zone tenue par l'armée allemande est hachurée.
