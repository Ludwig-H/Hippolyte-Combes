# Lignes de front schématiques : [longitude, latitude] WGS 84, du nord au sud.
# Chaque sommet est placé entre une localité tenue par les Britanniques ou les Français (B/F) et une localité
# tenue par l'armée allemande (A), d'après les tables sourcées des dossiers de recherche R4 (Somme, Ancre,
# ligne Hindenburg) et R5 (Flandre). Les repères urbains et les sommets intermédiaires sont approximatifs ;
# aucune marge d’erreur uniforme n’est établie. Ces tracés situent les grands secteurs du front à l’échelle
# du livre ; ils ne restituent ni les tranchées ni les variations quotidiennes des lignes.
# Abréviations des sources : OH = Official History, Military Operations, France and Belgium (1916-I, 1916-II,
# 1917-I) ; Michelin = Guides illustrés Michelin des champs de bataille (The Somme, vol. 1 ; St-Quentin–Cambrai,
# 1921) ; Miles 1938 = OH 1916-II ; CWGC = fiches des cimetières de la Commonwealth War Graves Commission ;
# JMO 4/Bedf = War Diary du 4th Bedfordshire, sept. 1916 (Bedfordshire Archives, notice 110139664).
